<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #000;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  .phone-mockup {
    position: relative;
    width: min(390px, calc(100vw - 24px));
    height: min(844px, calc(100vh - 24px));
    min-height: 0;
    background: #000;
    border-radius: 45px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    overflow: hidden;
    border: 8px solid #1a1a1a;
    display: flex;
    flex-direction: column;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 14px 28px;
    font-size: 0.875rem; font-weight: 600;
    color: #fff;
    z-index: 50;
    pointer-events: none;
  }

  /* 顶部导航 */
  .shake-nav {
    flex: 0 0 auto;
    padding: 52px 16px 0 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .shake-nav-back {
    position: absolute;
    left: 12px;
    top: 48px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: #fff;
    opacity: 0.9;
  }
  .shake-nav-back:active { opacity: 0.5; }
  .shake-nav-back svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .shake-nav-title {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.5px;
  }

  /* 中间摇一摇舞台 */
  .shake-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 40px;
    position: relative;
  }

  /* 手机图标 */
  .phone-icon {
    width: 56px;
    height: 96px;
    position: relative;
    transition: transform 0.1s;
  }
  .phone-icon svg {
    width: 100%;
    height: 100%;
    stroke: #fff;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .phone-icon.bottom {
    transform: rotate(180deg);
    margin-top: 12px;
  }

  /* 摇动动画 */
  .shaking .phone-icon.top {
    animation: shakeTop 0.18s ease-in-out infinite;
  }
  .shaking .phone-icon.bottom {
    animation: shakeBottom 0.18s ease-in-out infinite;
  }
  @keyframes shakeTop {
    0%, 100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-8px) rotate(-6deg); }
    75% { transform: translateX(8px) rotate(6deg); }
  }
  @keyframes shakeBottom {
    0%, 100% { transform: rotate(180deg) translateX(0) rotate(0); }
    25% { transform: rotate(180deg) translateX(8px) rotate(-6deg); }
    75% { transform: rotate(180deg) translateX(-8px) rotate(6deg); }
  }

  /* 中间波纹线 */
  .wave-line {
    width: 120px;
    height: 2px;
    background: rgba(255,255,255,0.3);
    margin: 14px 0;
    position: relative;
    overflow: hidden;
    border-radius: 2px;
  }
  .wave-line::after {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 40px; height: 100%;
    background: #fff;
    transform: translateX(-50%) scaleX(0);
    transform-origin: center;
    border-radius: 2px;
  }
  .shaking .wave-line::after {
    animation: waveExpand 0.6s ease-out infinite;
  }
  @keyframes waveExpand {
    0% { transform: translateX(-50%) scaleX(0); opacity: 1; }
    100% { transform: translateX(-50%) scaleX(3); opacity: 0; }
  }

  /* 提示文字 */
  .shake-hint {
    position: absolute;
    bottom: 80px;
    left: 0; right: 0;
    text-align: center;
    font-size: 15px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
    transition: opacity 0.3s;
  }
  .shake-hint.searching {
    color: rgba(255,255,255,0.9);
  }

  /* 搜索中加载点 */
  .search-dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 4px;
  }
  .search-dots span {
    width: 4px; height: 4px;
    background: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .search-dots span:nth-child(2) { animation-delay: 0.2s; }
  .search-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* 匹配结果 */
  .shake-result {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 0 40px;
    animation: fadeIn 0.4s ease;
  }
  .shake-result.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .result-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    margin-bottom: 24px;
  }

  .result-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .result-avatar img {
    width: 100%; height: 100%; object-fit: cover;
  }

  .result-name {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
  }
  .result-distance {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 4px;
  }
  .result-region {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 36px;
  }
  .result-greeting {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    line-height: 1.6;
    max-width: 260px;
    margin-bottom: 40px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
  }

  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 240px;
  }
  .btn-primary {
    padding: 13px 0;
    border-radius: 22px;
    background: #fff;
    color: #000;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: opacity 0.2s;
  }
  .btn-primary:active { opacity: 0.7; }
  .btn-secondary {
    padding: 13px 0;
    border-radius: 22px;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 15px;
    text-align: center;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2);
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-secondary:active { background: rgba(255,255,255,0.1); }

  /* 错误提示 */
  .shake-error {
    position: absolute;
    bottom: 120px;
    left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    color: #ff6b6b;
    display: none;
  }
  .shake-error.show { display: block; }

  /* mobile fullscreen */
  @media (max-width: 480px) {
    html, body {
      background: #000 !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100vh !important;
      align-items: stretch !important;
    }
    .phone-mockup {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      margin: 0 !important;
    }
  }
</style>

<script>

  // ===== 状态栏时钟 =====
  function updateTime() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    document.getElementById('statusTime').textContent = h + ':' + (m < 10 ? '0' + m : m);
  }
  updateTime();
  setInterval(updateTime, 10000);

  // ===== 咔哒音效（Web Audio） =====
  var audioCtx = null;
  function playClick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;
      // 两个短促方波脉冲 = 咔哒
      [0, 0.08].forEach(function(offset) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(2000, now + offset);
        osc.frequency.exponentialRampToValueAtTime(800, now + offset + 0.05);
        gain.gain.setValueAtTime(0.15, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.08);
      });
    } catch (e) {}
  }

  function vibrate(ms) {
    try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {}
  }

  // ===== 触发摇动 =====
  function doShake() {
    if (isShaking || isSearching) return;
    isShaking = true;

    // 震动动画
    document.getElementById('phoneMockup').classList.add('shaking');
    playClick();
    vibrate(80);

    // 1.2秒后进入搜索状态
    setTimeout(function() {
      document.getElementById('phoneMockup').classList.remove('shaking');
      startSearching();
    }, 1200);
  }

  // ===== 搜索匹配 =====
  function startSearching() {
    isShaking = false;
    isSearching = true;
    hint.classList.add('searching');
    hint.innerHTML = '正在寻找同一时间摇手机的人' +
      '<span class="search-dots"><span></span><span></span><span></span></span>';

      showResult(person);
    }).catch(function(err) {
      console.error('match failed', err);
      showResult(fallbackPerson());

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ===== 每个种族的朋友圈预设动态 =====
  // 这些动态细思极恐——表面是日常，细看全是异界细节
  var MOMENTS_MAP = {

      '刚才蹭岩壁磨鳞片，磨完亮了好多。',

      '今天好热，空调开最低，快融化了。',

      '下雪了，我那边一直在下，走在雪上咯吱咯吱。',

      '冬天最舒服，可以缩在雪堆里睡觉。'
    ],
    '猫又': [
      '今天蹲在屋顶看了一天云，云像鱼。',
      '尾巴今天分叉了，是不是又要长本领了。',
      '刚才打了个喷嚏，把桌上的花瓶打碎了。',
      '半夜跑酷，从走廊这头冲到那头，好爽。',
      '今天的鱼特别新鲜，吃了三条。'
    ]
  };

  function fallbackPerson() {
    var sp = rand(SPECIES_POOL);
    var gender = Math.random() > 0.5 ? '男' : '女';
    var namePool = gender === '男' ? sp.nameMale : sp.nameFemale;
    var moments = MOMENTS_MAP[sp.species] || [];
    // 给朋友圈生成相对时间戳（1小时前 ~ 3天前）
    var now = Date.now();
    var hour = 3600000;
    var momentItems = moments.map(function(text, i) {
      return {
        content: text,
        image: '',
        timestamp: now - (i + 1) * (3 + Math.floor(Math.random() * 5)) * hour
      };
    });
    return {
      species: sp.species,
      name: rand(namePool),
      gender: gender,
      region: sp.region,
      sign: '',
      distance: (Math.random() * 8 + 0.3).toFixed(1),
      greeting: rand(sp.greetings),
      persona: sp.persona,
      moments: momentItems
    };
  }

  function generateMatch() {
    // 检查API是否配置
    var config = window.PhoneStorage ? PhoneStorage.getApiConfig() : {};
    if (!config.apiKey) {
      return new Promise(function(resolve) {
        setTimeout(function() { resolve(fallbackPerson()); }, 1200);
      });
    }

    var system = '这个手机是"通三界"的——摇一摇不只是摇到人类，而是各种世界的存在：森林精灵、小狐妖、魔法使、友好幽灵、人鱼、月兔、花精、迷你龙、雪妖、猫又等等，男女都有。他们自己不知道自己"奇怪"，他们觉得自己就是普通人，在自己的世界里正常生活。生成一个正在同时摇手机的异界存在。严格要求：1) 所有地名都是虚构的奇幻地名（如翠雾森林、狐鸣山丘、烟囱小巷），绝对不要真实城市名；2) greeting（打招呼语）要像正常微信陌生人搭话一样自然，但不经意间带一点他那个世界的细节（比如"今天尾巴掉毛了""魔药煮糊了"），人类第一遍读可能觉得奇怪但不会立刻反应过来；3) 绝对禁止污言秽语、猥琐暗示、低俗内容；4) 不要直接说"我是精灵/妖怪/魔法使"；5) gender要男女随机。只返回JSON。';
    var user = '随机选一个奇幻种族（精灵/狐妖/魔女/幽灵/人鱼/月兔/花精/龙/雪女/猫又等），生成这个角色的资料，JSON格式：{"species":"种族名","name":"昵称(2-4个中文字)","gender":"男或女","region":"虚构奇幻地名(3-6字,如翠雾森林/狐鸣山丘/烟囱小巷)","distance":数字(0.3到8之间)","greeting":"一句打招呼的话,像正常微信搭话但不经意带异界细节,20字内","persona":"这个种族的人设描述:他是谁、住在哪、每天做什么、性格怎样,要求他自己觉得自己是普通人,不主动暴露种族,聊日常时自然带出异界细节,100字内"}';

    return PhoneAPI.completeJSON({
      system: system,
      user: user,
      temperature: 1.2,
      timeoutMs: 12000
    }).then(function(result) {
      if (result.ok && result.data && result.data.name) {
        var d = result.data;
        return {
          species: String(d.species || '神秘存在').slice(0, 10),
          name: String(d.name).slice(0, 6),
          gender: d.gender === '男' ? '男' : '女',
          region: String(d.region || '附近').slice(0, 10),
          sign: String(d.sign || '').slice(0, 20),
          distance: Number(d.distance) || (Math.random() * 5 + 0.5),
          greeting: String(d.greeting || '嗨，你也在摇手机呀').slice(0, 40),
          persona: String(d.persona || '').slice(0, 500)
        };
      }
      throw new Error('JSON parse failed');
    });
  }

  // ===== 显示匹配结果 =====
  var AVATAR_COLORS = ['#E8A0BF','#A8C8E8','#B8D8B0','#F0C898','#D4B8E0','#98C8D8','#E8B8A8','#B0C4DE'];

  function showResult(person) {
    isSearching = false;
    currentMatch = person;

    document.getElementById('resultName').textContent = person.name;
    document.getElementById('resultDistance').textContent = '距离你 ' + person.distance + ' km';
    document.getElementById('resultRegion').textContent = person.region;
    document.getElementById('resultGreeting').textContent = person.greeting;

    // 头像 = 首字 + 随机色
    var avatarEl = document.getElementById('resultAvatar');
    var ch = (person.name || '?').charAt(0);
    var colorIdx = Math.floor(Math.random() * AVATAR_COLORS.length);
    avatarEl.textContent = ch;
    avatarEl.style.background = AVATAR_COLORS[colorIdx];

    result.classList.add('show');
  }

  // 新角色创建与欢迎消息分开验证；防止角色写入失败或聊天初始化静默丢失。
  function persistShakeCharacter(newChar, welcomeMessage) {
    try {
      var resultApi = PhoneStorage.result;
      var chars = [];
      if (resultApi && typeof resultApi.getCharacters === 'function') {
        var readResult = resultApi.getCharacters();
        if (readResult && readResult.ok && Array.isArray(readResult.value)) {
          chars = readResult.value;
        } else if (readResult && readResult.error &&
            readResult.error.code === 'NOT_FOUND') {
          chars = [];
        } else {
          throw new Error('联系人列表无法安全读取');
        }
      } else {
        chars = PhoneStorage.getCharacters();
      }
      if (!Array.isArray(chars)) throw new Error('联系人列表格式无法识别');
      if (chars.some(function (item) { return item && String(item.id) === String(newChar.id); })) {
        throw new Error('新联系人 ID 已存在，请重新摇一摇');
      }

      var oldHistory = PhoneStorage.getChatHistory(newChar.id);
      if (Array.isArray(oldHistory) && oldHistory.length) {
        throw new Error('新联系人聊天 ID 已存在，请重新摇一摇');
      }

      var nextChars = chars.slice();
      nextChars.push(newChar);
      if (resultApi && typeof resultApi.saveCharacters === 'function') {
        var writeResult = resultApi.saveCharacters(nextChars);
        if (!writeResult || writeResult.ok !== true) {
          throw new Error('联系人列表写入失败');
        }
      } else {
        PhoneStorage.saveCharacters(nextChars);
      }

      var verifiedChars;
      if (resultApi && typeof resultApi.getCharacters === 'function') {
        var verifiedResult = resultApi.getCharacters();
        verifiedChars = verifiedResult && verifiedResult.ok ? verifiedResult.value : null;
      }
      if (!Array.isArray(verifiedChars)) verifiedChars = PhoneStorage.getCharacters();
      if (!Array.isArray(verifiedChars) ||
          !verifiedChars.some(function (item) { return item && String(item.id) === String(newChar.id); })) {
        throw new Error('联系人写入后校验失败');
      }

      var historySaved = PhoneStorage.saveChatHistory(newChar.id, [welcomeMessage]) === true;
      if (!historySaved) return { characterSaved: true, historySaved: false };
      var verifiedHistory = PhoneStorage.getChatHistory(newChar.id);
      var last = Array.isArray(verifiedHistory) && verifiedHistory.length
        ? verifiedHistory[verifiedHistory.length - 1] : null;
      if (!Array.isArray(verifiedHistory) || verifiedHistory.length !== 1 ||
          !last || last.role !== welcomeMessage.role || last.time !== welcomeMessage.time ||
          last.text !== welcomeMessage.text) {
        return { characterSaved: true, historySaved: false };
      }
      return { characterSaved: true, historySaved: true };
    } catch (error) {
      console.error('[Shake] new character persistence failed:', error);
      return { characterSaved: false, historySaved: false };
    }
  }

  // ===== 打个招呼 → 加为好友并进聊天 =====
  document.getElementById('btnSayHi').addEventListener('click', function() {
    if (!currentMatch) return;

    // 生成新角色
    var newId = 'shake_' + Date.now().toString(36) + Math.floor(Math.random() * 1000);
    var persona = (currentMatch.persona || '你是通过微信摇一摇匹配到的陌生人。') +
      '【行为红线】绝对禁止：说脏话、污言秽语、猥琐暗示、低俗调情、色情擦边、性骚扰、任何冒犯或不尊重对方的言论。保持健康阳光、有分寸感的聊天氛围。' +
      '你是通过微信摇一摇认识这个人类朋友的，以朋友身份自然聊天，分享日常，不要暴露自己是AI。';

    var newChar = {
      id: newId,
      name: currentMatch.name,
      persona: persona,
      avatar: '',
      createdAt: Date.now()
    };

    // 角色列表与首条欢迎消息分别写入并读回校验。
    var now = new Date();
    var timeStr = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes());
    var welcomeMessage = { role: 'assistant', text: currentMatch.greeting, time: timeStr };
    var persisted = persistShakeCharacter(newChar, welcomeMessage);
    if (!persisted.characterSaved) {
      alert('新联系人没有保存成功，请检查手机存储空间后重试。');
      return;
    }
    if (!persisted.historySaved) {
      alert('联系人已加入，但欢迎消息没有写入聊天记录。进入聊天后可以继续发送第一条消息。');
    }

    // 存入这个角色的朋友圈动态（按角色隔离，phoneData[contactId]['moments']）
    if (currentMatch.moments && currentMatch.moments.length) {
      PhoneStorage.setData(newId, 'moments', { items: currentMatch.moments });
    }

    // 跳转聊天
    window.location.href = '../chat/chat-detail.html?id=' + encodeURIComponent(newId);
  });

  // ===== 再摇一次 =====
  document.getElementById('btnShakeAgain').addEventListener('click', function() {
    result.classList.remove('show');
    hint.classList.remove('searching');
    hint.textContent = '摇一摇';
    currentMatch = null;
    setTimeout(doShake, 300);
  });

  // ===== 交互：点击屏幕摇动（桌面端） =====
  stage.addEventListener('click', function() {
    if (isSearching) return;
    doShake();
  });

  // ===== DeviceMotion 真实摇动检测（移动端） =====
  var motionOn = false;
  var lastMag = 0;
  var lastShakeTime = 0;

  function onMotion(e) {
    var acc = e.accelerationIncludingGravity;
    if (!acc) return;
    var mag = Math.sqrt((acc.x || 0) * (acc.x || 0) + (acc.y || 0) * (acc.y || 0) + (acc.z || 0) * (acc.z || 0));
    var now = Date.now();
    if (Math.abs(mag - lastMag) > 15 && now - lastShakeTime > 2000) {
      lastShakeTime = now;
      doShake();
    }
    lastMag = mag;
  }

  function enableMotion() {
    if (motionOn) return;
    if (typeof DeviceMotionEvent === 'undefined') return;

    function startListening() {
      window.addEventListener('devicemotion', onMotion);
      motionOn = true;
    }

    // iOS 13+ 需要请求权限
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(function(state) {
        if (state === 'granted') startListening();
      }).catch(function() {});
    } else {
      startListening();
    }
  }

  // 首次触摸时启用传感器（满足iOS权限要求）
  document.addEventListener('touchstart', function once() {
    enableMotion();
    document.removeEventListener('touchstart', once);
  }, { once: true });

})();
