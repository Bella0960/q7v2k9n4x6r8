                if (presencePrompt && typeof window.ChatPresencePolicy.buildAutonomyPrompt === 'function') {
                    var autonomyPrompt = window.ChatPresencePolicy.buildAutonomyPrompt(
                        historyList,
                        {
                            mode: presenceMode,
                            isGroupChat: isGroupChat,
                            speakerId: groupReplyPick && groupReplyPick.id != null ? String(groupReplyPick.id) : '',
                            speakerName: groupReplyPick && groupReplyPick.name ? groupReplyPick.name : '',
                            maxScan: 60,
                            maxNotes: 3,
                            maxTurns: 4
                        }
                    );
                    if (autonomyPrompt) presencePrompt += '\n\n' + autonomyPrompt;
                }

                if (presencePrompt) systemPrompt += '\n\n' + presencePrompt;
            }

            // 跨场景只同步角色本人公开/好友可见的动态；私聊、群聊记录仍留在各自会话内。
            var sharedTimelineRoleId = isGroupChat
                ? ''
                : String(currentRoleId || currentCharacter.id || '');
            var sharedTimelinePrompt = '';
            var sharedTimelineMoments = [];
            try {
                sharedTimelineMoments = window.PhoneStorage && typeof window.PhoneStorage.getMoments === 'function'
                    ? window.PhoneStorage.getMoments()
                    : JSON.parse(localStorage.getItem('moments') || '[]');
            } catch (e) { sharedTimelineMoments = []; }
            if (window.RolePublicTimeline) {
                if (isGroupChat && currentGroup && typeof window.RolePublicTimeline.buildGroupPrompt === 'function') {
                    sharedTimelinePrompt = window.RolePublicTimeline.buildGroupPrompt(
                        currentGroup.members || [],
                        sharedTimelineMoments,
                        { maxMembers: 8, maxChars: 100 }
                    );
                } else if (sharedTimelineRoleId && typeof window.RolePublicTimeline.buildRolePrompt === 'function') {
                    sharedTimelinePrompt = window.RolePublicTimeline.buildRolePrompt(
                        sharedTimelineRoleId,
                        sharedTimelineMoments,
                        { maxEntries: 3, maxChars: 120 }
                    );
                }
            }
            if (sharedTimelinePrompt) systemPrompt += '\n\n' + sharedTimelinePrompt;

            // 只在单人线上聊天、普通可见回复中提供本角色已收藏的表情目录。
            // 群聊、旁白、静默任务、重玩和后台 context-only 回合都不触发自动表情。
            var roleStickerCatalog = [];
            if (!isGroupChat && !silent && !contextOnly && !isRegen && presenceMode === 'online' &&
                window.RoleStickerLibrary &&
                typeof window.RoleStickerLibrary.resolveSelected === 'function' &&
                typeof window.RoleStickerLibrary.buildReplyPrompt === 'function') {
                try {
                    var roleStickerLibraries = JSON.parse(localStorage.getItem('sticker_libraries') || '[]');
                    roleStickerCatalog = window.RoleStickerLibrary.resolveSelected(
                        aliasRoleId || currentCharacter.id,
                        roleStickerLibraries,
                        16
                    );
                    var roleStickerPrompt = window.RoleStickerLibrary.buildReplyPrompt(roleStickerCatalog);
                    if (roleStickerPrompt) systemPrompt += '\n\n' + roleStickerPrompt;
                } catch (stickerPromptError) {
                    roleStickerCatalog = [];
                }
            }

            // 单聊中的亲属卡/亲密付是虚拟互动，不触达真实支付。只有剧情自然适合时才发放，不要每轮强行送卡。
            systemPrompt += '\n\n【单聊虚拟亲属卡 / 亲密付规则】\n' +
                '仅在私聊、并且符合你当前人设、关系、经济状况与剧情时，你可以主动赠予对方一张虚拟亲属卡或亲密付卡；不要每次回复都送，也不要把它说成真实银行业务。\n' +
                '需要发放时，在正常回复末尾附加一个机器标记，格式必须是 [亲属卡:月额度:单笔上限:给对方的留言] 或 [亲密付:月额度:单笔上限:给对方的留言]。金额必须是正数，单笔上限不得高于月额度；留言不要包含右方括号。前端会把标记转换为聊天卡片，不要解释标记本身。\n' +
                '若需要调整你发出的最近一张未撤销卡，可附加 [调整亲属卡:新月额度:新单笔上限:简短说明]；若想撤销，可附加 [撤销亲属卡]。只有确实在剧情中作出这些决定时才输出对应标记。\n' +
                '亲属卡只是 MAOMAO 内的虚拟额度，只能用于应用内模拟商店和外卖结算，不是真实余额，不涉及真实支付、银行卡或外部扣款。不得声称已经执行任何现实付款。\n\n';
            // 只向一对一角色聊天提供该角色自己的图库目录；群聊、静默、重生成不触发自主发图。
            var roleGalleryCharacterId = (!isGroupChat && !isRegen && !contextOnly && !silent &&
                presenceMode === 'online' && currentCharacter && currentCharacter.id != null)
                ? String(currentCharacter.id) : '';
            var roleGalleryCatalogue = null;
            if (roleGalleryCharacterId && window.RoleGalleryImageAutonomy &&
                typeof window.RoleGalleryImageAutonomy.prepare === 'function') {
                try {
                    roleGalleryCatalogue = await window.RoleGalleryImageAutonomy.prepare(roleGalleryCharacterId);
                    if (roleGalleryCatalogue && roleGalleryCatalogue.prompt) {
                        systemPrompt += '\n\n' + roleGalleryCatalogue.prompt;
                    }
                } catch (galleryError) {
                    // 图库不可用时仍照常完成文字聊天。
                    roleGalleryCatalogue = null;
                }
            }

            // 构造 OpenAI 兼容格式 messages 数组 (system + 历史记录)
            const apiMessages = [
                { role: 'system', content: systemPrompt }
            ];

            // 记忆条数截断：只取最后 N 条（含当前用户刚发的），system 消息始终保留
            // 优先读每个角色独立设置 chat_memory_limit_<roleId>（对话设置页写入），
            // 非法/未设置时回退全局 API 配置 memoryCount，再回退默认 20
            const roleMemoryLimitSetting = localStorage.getItem('chat_memory_limit_' + aliasRoleId);
            let recentHistory;
            if (
                window.ChatContextPolicy &&
                typeof window.ChatContextPolicy.resolveMemoryLimit === 'function' &&
                typeof window.ChatContextPolicy.selectRecentHistory === 'function'
            ) {
                const memoryLimit = window.ChatContextPolicy.resolveMemoryLimit(roleMemoryLimitSetting, config.memoryCount);
                recentHistory = window.ChatContextPolicy.selectRecentHistory(historyList, memoryLimit);
            } else {
                // Compatibility fallback: preserve the page's original limit and slice behavior.
                let memoryLimit = parseInt(roleMemoryLimitSetting, 10);
                if ([10, 20, 30, 50].indexOf(memoryLimit) === -1) {
                    memoryLimit = config.memoryCount || 20;
                }
                recentHistory = historyList.slice(-memoryLimit);
            }

            // Decode only images explicitly attached to this send. DataURLs stay transient in memory.
            if (visionImageMids.length && window.ChatImageVision &&
                typeof window.ChatImageVision.prepareHistory === 'function') {
                var preparedVisionHistory = await window.ChatImageVision.prepareHistory(
                    recentHistory,
                    visionImageMids,
                    function (assetId) {
                        return _chatImageMediaRepo
                            ? _chatImageMediaRepo.toDataUrl(assetId)
                            : Promise.resolve({ ok: false });
                    },
                    4
                );
                recentHistory = preparedVisionHistory.history;
                avatarCandidateImages = preparedVisionHistory.images || [];
                if (preparedVisionHistory.failed && typeof showToast === 'function') {
                    showToast('有 ' + preparedVisionHistory.failed + ' 张图片暂时无法读取，已跳过');
                }
                if (preparedVisionHistory.omitted && typeof showToast === 'function') {
                    showToast('本轮最多识别 4 张图片，超出的图片仍保留在聊天记录中');
                }
            }

            // Search older saved conversation locally. This adds no separate API call and only
            // injects a few relevant source excerpts when the current message matches.
            if (window.MemoryRecall && typeof window.MemoryRecall.buildHistoricalRecallText === 'function') {
                let recallQuery = text;
                let recallOptions = {
                    excludeRecent: recentHistory.length,
                    maxItems: 2,
                    maxChars: 540,
                    maxScan: 2500
                };
                if (
                    window.ChatContextPolicy &&
                    typeof window.ChatContextPolicy.buildHistoricalRecallRequest === 'function'
                ) {
                    const recallRequest = window.ChatContextPolicy.buildHistoricalRecallRequest(
                        historyList,
                        text,
                        recentHistory.length
                    );
                    recallQuery = recallRequest.query;
                    recallOptions = recallRequest.options;
                } else {
                    // Compatibility fallback: preserve the original backwards query scan and limits.
                    if (!recallQuery) {
                        for (let ri = historyList.length - 1; ri >= 0; ri--) {
                            const entry = historyList[ri];
                            if (entry && (entry.role === 'user' || entry.role === 'sent') && (entry.text || entry.content)) {
                                recallQuery = String(entry.text || entry.content);
                                break;
                            }
                        }
                    }
                }
                const recalledText = window.MemoryRecall.buildHistoricalRecallText(historyList, recallQuery, recallOptions);
                if (recalledText) apiMessages[0].content += '\n\n' + recalledText;
            }

            if (!isGroupChat && !isRegen && !contextOnly && (!silent || visionImageMids.length) &&
                presenceMode === 'online' && avatarCandidateImages.length && window.ChatImageVision &&
                typeof window.ChatImageVision.buildAvatarCandidatePrompt === 'function') {
                var avatarCandidatePrompt = window.ChatImageVision.buildAvatarCandidatePrompt(avatarCandidateImages, text);
                if (avatarCandidatePrompt) apiMessages[0].content += '\n\n' + avatarCandidatePrompt;
            }

            if (window.ChatContextPolicy && typeof window.ChatContextPolicy.mapHistoryToApiMessages === 'function') {
                apiMessages.push.apply(apiMessages, window.ChatContextPolicy.mapHistoryToApiMessages(recentHistory, stripInternalReasoning, {
                    isGroupChat: isGroupChat,
                    groupMode: currentGroup && currentGroup.settings && currentGroup.settings.chatMode === 'offline' ? 'offline' : 'online',
                    groupMembers: currentGroup && Array.isArray(currentGroup.members) ? currentGroup.members : []
                }));
            } else {
                // Compatibility fallback: keep the legacy context mapping intact if the shared module fails to load.
                recentHistory.forEach(m => {
                    if (m.isError || m.role === 'system_error' || m.sendFailed) return;
                    if (isGroupChat && m.type === 'group_private') return;
                    if (m.type === 'sticker') {
                        var stickerMeaning = String(m.desc || '').trim();
                        var stickerRole = (m.role === 'received' || m.role === 'assistant') ? 'assistant' : 'user';
                        apiMessages.push({
                            role: stickerRole,
                            content: stickerMeaning
                                ? '[用户发送了一张表情包，表达的意思是：' + stickerMeaning + '。请理解其含义并自然回应，不要复述这段说明。]'
                                : '[用户发送了一张表情包，请结合语境自然回应。]'
                        });
                        return;
                    }
                    var content = stripInternalReasoning(m.text || m.content || '').trim();
                    if (!content) return; // 纯展示卡片消息（位置/通话等）无文本时不发给 AI
                    if (m.quote && typeof m.quote === 'object' && m.quote.text) {
                        var quoteText = String(m.quote.text).trim().slice(0, 500);
                        var quoteAuthor = String(m.quote.authorName || '').trim();
                        if (quoteText) content = '[引用回复上下文' + (quoteAuthor ? '，原消息来自' + quoteAuthor : '') +
                            '：「' + quoteText + '」]\n' + content;
                    }
                    // 剥离 <narratage>...</narratage>（旁白是 UI 层，不占上下文序号）
                    content = content.replace(/<narratage>[\s\S]*?<\/narratage>/gi, '');
                    // 剥离 [中译:...] 双语翻译条（UI 层，不回灌给 AI）
                    content = content.replace(/\[中译[:：][^\]]{0,800}\]/g, '');
                    content = content.replace(/\n{3,}/g, '\n\n').trim();
                    if (!content) return;
                    if (m.role === 'sent' || m.role === 'user') {
                        var fallbackUserContent = content;
                        var fallbackVisionUrl = String(m.visionDataUrl || '');
                        if (m.type === 'image' &&
                            /^data:image\/(?:jpeg|jpg|png|webp|gif|avif);base64,[A-Za-z0-9+\/=\r\n]+$/i.test(fallbackVisionUrl) &&
                            fallbackVisionUrl.length <= 4 * 1024 * 1024 + 128) {
                            var fallbackVisionIndex = Math.max(0, parseInt(m.visionIndex, 10) || 0);
                            var fallbackVisionLabel = fallbackVisionIndex ? '\n[本轮图片编号：' + fallbackVisionIndex + ']' : '';
                            fallbackUserContent = [
                                { type: 'text', text: (content || '[用户分享了一张图片]') + fallbackVisionLabel },
                                { type: 'image_url', image_url: { url: fallbackVisionUrl, detail: 'auto' } }
                            ];
                        }
                        apiMessages.push({ role: 'user', content: fallbackUserContent });
                    } else if (m.role === 'received' || m.role === 'assistant') {
                        var groupSpeaker = isGroupChat ? String(m.name || '') : '';
                        apiMessages.push({
                            role: 'assistant',
                            content: (isGroupChat ? '【群成员' + (groupSpeaker ? ' ' + groupSpeaker : '') + '】\n' : '') + content
                        });
                    }
                });
    
                // 防呆：最后一条如果是 assistant（比如重试场景），强制补一条 user 消息
                const lastCheck = apiMessages[apiMessages.length - 1];
                if (lastCheck && lastCheck.role === 'assistant') {
                    apiMessages.push({ role: 'user', content: '(继续)' });
                }
            }

            // 界面反馈：显示"对方正在输入..."状态（底部 loading + 顶部 header 切换）
            var chatTitleEl = document.getElementById('chat-title');
            var originalTitleText = chatTitleEl ? chatTitleEl.textContent : '';
            if (chatTitleEl) chatTitleEl.textContent = '对方正在输入...';
            const statusId = 'loading-' + Date.now();
            const box = document.getElementById('chat-messages');
            const statusDiv = document.createElement('div');
            statusDiv.id = statusId;
            statusDiv.className = 'loading-dots';
            statusDiv.innerText = '对方正在输入...';
            box.appendChild(statusDiv);
            scrollToBottom(true);

            // API 调用计时起点（用于调用记录）
            const apiCallStart = Date.now();

            // 打字机气泡引用（首个 delta 到达时复用现有气泡结构创建）
            let streamBubble = null;
            // 流式临时消息实际创建的全部节点（主 row + 旁白块 + 额外气泡行）。
            // 收尾时按节点精确移除，避免多气泡临时消息只删掉主 row 而残留孤儿气泡。
            let streamNodes = [];
            let fullText = '';
            // 意外异常时，用最后一次收到并尝试渲染的原始累计文本做保文兜底。
            let lastPaintedStreamText = '';
            let groupReplyVisible = false;

            // R4 渲染回调：交给 PhoneStream 每帧节流调用（正则清洗 + DOM 写入 + 滚动）
            // 引擎已抽离至 shared/js/phone/phone_stream.js（三段式超时/SSE 解析/残留收尾）
            function paintStreamLive(text) {
                // 保留原始累计文本：若流引擎意外抛错，收尾仍可走既有清洗与落库流程。
                lastPaintedStreamText = typeof text === 'string' ? text : '';
                // 同步快照，供 pagehide 时把半截消息落库
                inflightSnapshot = {
                    text: (function () {
                        var snapshotText = lastPaintedStreamText;
                        if (window.RoleStickerLibrary && typeof window.RoleStickerLibrary.stripStreamMarker === 'function') {
                            snapshotText = window.RoleStickerLibrary.stripStreamMarker(snapshotText);
                        }
                        if (window.ChatImageVision && typeof window.ChatImageVision.stripAvatarCandidateMarker === 'function') {
                            snapshotText = window.ChatImageVision.stripAvatarCandidateMarker(snapshotText);
                        }
                        return snapshotText;
                    })(),
                    voiceMode: presenceMode || 'online',
                    groupName: groupReplyPick ? groupReplyPick.name : undefined,
                    memberId: groupReplyPick && groupReplyPick.id != null ? String(groupReplyPick.id) : undefined
                };
                /* 推理标签可能先于正文到达；在真正有可见聊天文字前，不创建气泡。 */
                var tmpText = stripInternalReasoning(extractVoiceCallMarker(text).text);
                tmpText = tmpText
                    .replace(/<narratage\b[^>]*>[\s\S]*?(?:<\/narratage\s*>|$)/gi, '')
                    .replace(/<\/?narratage\b[^>]*>/gi, '')
                    .replace(/\[中译[:：][^\]]{0,800}\]/g, '')
                    .replace(/\[中译[:：][^\]]{0,}$/g, '')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();

                if (window.RoleStickerLibrary && typeof window.RoleStickerLibrary.stripStreamMarker === 'function') {
                    tmpText = window.RoleStickerLibrary.stripStreamMarker(tmpText);
                }
                if (window.ChatImageVision && typeof window.ChatImageVision.stripAvatarCandidateMarker === 'function') {
                    tmpText = window.ChatImageVision.stripAvatarCandidateMarker(tmpText);
                }
                if (!tmpText) return;

                if (!streamBubble) {
                    const loadingEl = document.getElementById(statusId);
                    if (loadingEl) loadingEl.remove();
                    var tmpStreamMsg = { role: 'assistant', text: tmpText, name: groupReplyPick ? groupReplyPick.name : undefined };
                    // 先用 DocumentFragment 组装，拿到本次临时消息的全部节点（主 row / 旁白 / 额外气泡）。
                    const sfrag = document.createDocumentFragment();
                    appendMessageToDOM(tmpStreamMsg, undefined, sfrag);
                    streamNodes = Array.prototype.slice.call(sfrag.childNodes);
                    const firstRow = streamNodes.filter(function (node) {
                        return node.nodeType === 1 && node.classList && node.classList.contains('msg-row');
                    })[0];
                    if (_vl) {
                        // 虚拟列表：流式气泡挂进窗口容器，并标记 streaming 暂停窗口重排（避免每帧被 scroll 监听器打断）
                        _vl.streaming = true;
                        _vl.win.appendChild(sfrag);
                    } else {
                        chatMessages.appendChild(sfrag);
                    }
                    streamBubble = firstRow ? firstRow.querySelector('.msg-bubble') : null;
                    if (typeof SoundSystem !== 'undefined') SoundSystem.play('receive', currentRoleId || '');
                }
                if (streamBubble) streamBubble.textContent = tmpText;
                pinToBottom();
            }

            aiSending = true;   // R3：进入请求阶段，到流式结束由收尾统一解锁（此前无 await，不存在并发窗口）

            // 流式请求：核心引擎已抽离至 shared/js/phone/phone_stream.js
            //（三段式超时 / SSE 半包解析 / 残留收尾 / rAF 节流 / 中断保文，全部内聚在模块内）
            // 永不 reject：结果对象 { ok, fullText, error }，fullText 中断时 = 已收到的部分
            let streamResult;
            try {
                streamResult = await PhoneStream.chat({
                    baseUrl: baseUrl,
                    apiKey: apiKey,
                    model: apiModel,
                    messages: apiMessages,
                    temperature: config.temperature != null ? config.temperature : 0.7,
                    maxTokens: config.maxTokens,
                    topP: config.topP,
                    onPaint: paintStreamLive
                });
                if (!streamResult || typeof streamResult !== 'object') {
                    throw new Error('流式请求未返回有效结果');
                }
            } catch (streamErr) {
                // PhoneStream 的正常契约是返回结果对象；这里专门防护其意外抛错/拒绝，
                // 避免 sendMsg 中断后 aiSending 锁一直保持 true。后续仍走统一错误收尾。
                console.error('[chat-detail] PhoneStream 未预期异常:', streamErr);
                streamResult = {
                    ok: false,
                    fullText: lastPaintedStreamText,
                    error: {
                        kind: 'network',
                        detail: (streamErr && streamErr.message) ? String(streamErr.message) : '流式请求意外中断'
                    }
                };
            }
            fullText = typeof streamResult.fullText === 'string'
                ? streamResult.fullText
                : lastPaintedStreamText;

            // 流内一直没出现 loading 移除（零 delta 兜底）
            const loadingEl2 = document.getElementById(statusId);
            if (loadingEl2) loadingEl2.remove();

            // 错误分类与日志（成功/失败都记录；文案在下方收尾分支组装成气泡）
            var errText = '';
            if (!streamResult.ok) {
                const e = streamResult.error || {};
                if (e.kind === 'http') {
                    errText = friendlyHttpError(e.status, e.detail || '');
                } else if (e.kind === 'abort') {
                    errText = e.reason === 'watchdog'
                        ? '连接中断（30 秒未收到新内容），请检查网络后重试。'
                        : (e.reason === 'total'
                            ? '回复超时（120 秒上限），未收到有效内容。'
                            : '请求超时（15秒未响应），请检查网络或 API 地址。');
                } else if (e.kind === 'stream') {
                    errText = '连接失败: ' + (e.detail || '流式响应异常');
                } else {
                    errText = '连接失败: ' + (e.detail || '请检查 API 设置是否正确（可能是跨域或地址不正确）');
                }
                logApiCall(apiModel, 'error', apiCallStart, errText);
            } else {
                logApiCall(apiModel, 'success', apiCallStart);
            }

            // Regeneration is replacement, not deletion: a failed/empty AI turn must
            // never overwrite the saved old reply with the filtered prompt history.
            if (isRegen && (!streamResult.ok || !String(fullText || '').trim())) {
                for (var regenNode = 0; regenNode < streamNodes.length; regenNode++) {
                    if (streamNodes[regenNode] && streamNodes[regenNode].parentNode) {
                        streamNodes[regenNode].parentNode.removeChild(streamNodes[regenNode]);
                    }
                }
                streamNodes = [];
                if (_vl) _vl.streaming = false;
                aiSending = false;
                if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
                if (_vl) vlRefresh(); else renderAllMessages();
                if (typeof showToast === 'function') showToast('重新生成未成功，原回复已保留');
                return;
            }

            // 重试后 API 失败：先把同一条用户消息重新标记为失败并落库，
            // 再按既有 _isRepeatedSystemError 去重规则处理错误提示。
            var retryRemarked = false;
            if (!streamResult.ok && retryTarget) {
                retryRemarked = _markUserSendFailed(historyList, retryTarget.mid, retryTarget.time);
            }

            try {
                // A group interaction or regenerated turn can modify earlier
                // messages; preserve the pre-mutation snapshot for a strict
                // locked compare-and-swap, never rewrite stale chat history.
                var aiWriteBaseline = (isRegen || isGroupChat)
                    ? JSON.parse(JSON.stringify(isRegen && regenBefore ? regenBefore : historyList))
                    : null;
                if (fullText) {
                    // ---- 标记剥离 → 清洗 → 落库 → 重渲染（成功与中断保文共用同一套收尾） ----
                    // 群投票/接龙/群管理标记先落到当前历史与群资料，再清理展示文本
                    fullText = processGroupInteractionMarkers(fullText, groupReplyPick, historyList, isRegen, isGroupFollowup);
                    // 角色表情是现有回复的一部分，不发起额外 API。只接受完整成功的单聊线上回复。
                    var parsedRoleSticker = { text: fullText, stickers: [] };

        // 取消息的可读文本（非文本消息给等价占位文案）
        function plainTextOf(msg) {
            if (!msg) return '';
            if (msg.type === 'group_private') return '[群成员私聊] ' + String(msg.senderName || msg.name || '群成员') + '：' + String(msg.text || '');
            if (msg.type === 'group_poll' && msg.poll) return '[群投票] ' + String(msg.poll.question || '') + '：' + (msg.poll.options || []).join(' / ');
            if (msg.type === 'group_chain' && msg.chain) return '[群接龙] ' + String(msg.chain.title || '') + '：' + (msg.chain.entries || []).map(function (entry) { return String(entry.name || '成员') + '：' + String(entry.text || ''); }).join('；');
            // 心声带标签再复制/转发，避免对方看不出这是"心里话"
            if (msg.type === 'heart') return '[心声] ' + String(msg.text || '');
            var t = String((msg.text || msg.content) || '').trim();
            if (t) return t;
            if (msg.type === 'redpacket') return '[红包] ' + (msg.message || '恭喜发财，大吉大利');
            if (msg.type === 'transfer') return '[转账] ' + (msg.amount != null ? '¥' + msg.amount : '');
            if (msg.type === 'voice') return '[语音]' + (msg.text ? ' ' + msg.text : '');
            if (msg.type === 'image') return '[图片]' + (msg.desc ? ' ' + msg.desc : '');
            if (msg.type === 'location') return '[位置] ' + ((msg.location && msg.location.label) || '');
            if (msg.type === 'card') return '[名片] ' + ((msg.card && msg.card.name) || '');
            if (msg.type === 'sticker') return '[表情] ' + (msg.desc || '');
            if (msg.type === 'call') return '[通话]';
            return '[消息]';
        }

            var html = sheetItemHTML('select', '多选', MSG_ICON_SELECT, false);
            if (hasText) html += sheetItemHTML('copy', '复制文本', MSG_ICON_COPY, false);
            html += sheetItemHTML('forward', '转发给…', MSG_ICON_FORWARD, false);
            html += sheetItemHTML('quote', '引用回复', MSG_ICON_QUOTE, false);
            if (hasText) html += sheetItemHTML('translate', 'AI 翻译', MSG_ICON_TRANSLATE, false);
            if (isAi) html += sheetItemHTML('rewrite', '改写这条回复', MSG_ICON_REWRITE, false);
            if (hasText) html += sheetItemHTML('edit', '编辑内容', MSG_ICON_EDIT, false);

        // 锚定定位：气泡上方放得下就向上弹，否则向下；左右与上下都钳制在手机屏内
        function positionMsgMenu(bubbleId) {
            var row = chatMessages.querySelector('.msg-row[data-bubble-id="' + bubbleId + '"]') ||
                chatMessages.querySelector('.msg-row[data-mid="' + bubbleId + '"]');
            var host = document.querySelector('.phone-mockup') || document.body;
            if (!row || !msgSheetList || !host) { msgSheetList.style.visibility = ''; return; }
            var hostRect = host.getBoundingClientRect();
            var rowRect = row.getBoundingClientRect();
            var mw = msgSheetList.offsetWidth;
            var mh = msgSheetList.offsetHeight;
            var gap = 10;
            var above = (rowRect.top - hostRect.top) > (mh + gap + 10);
            var top = above
                ? (rowRect.top - hostRect.top - mh - gap)
                : (rowRect.bottom - hostRect.top + gap);
            var isSent = row.classList.contains('sent');
            var left = isSent ? (rowRect.right - hostRect.left - mw) : (rowRect.left - hostRect.left);
            left = Math.max(8, Math.min(left, hostRect.width - mw - 8));
            top = Math.max(8, Math.min(top, hostRect.height - mh - 8));
            msgSheetList.style.top = Math.round(top) + 'px';
            msgSheetList.style.left = Math.round(left) + 'px';
            msgSheetList.classList.remove('above', 'below');
            msgSheetList.classList.add(above ? 'above' : 'below');
            // 小三角对准气泡中心
            var bubbleEl2 = row.querySelector('.msg-bubble');
            var bRect = bubbleEl2 ? bubbleEl2.getBoundingClientRect() : rowRect;
            var ax = (bRect.left + bRect.width / 2) - (hostRect.left + left) - 5;
            ax = Math.max(14, Math.min(ax, mw - 24));
            msgSheetList.style.setProperty('--arrow-x', Math.round(ax) + 'px');
            msgSheetList.style.visibility = '';
        }

        // ---------- 复制消息文本 ----------
        function copyMessageText(msg) {
            var txt = plainTextOf(msg);
            if (!txt) return;
            function ok() { if (typeof showToast === 'function') showToast('已复制'); }
            function fallback() {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = txt;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    ok();
                } catch (e) {
                    if (typeof showToast === 'function') showToast('复制失败');
                }
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(ok).catch(fallback);
            } else {
                fallback();
            }
        }

        // ---------- 单条删除（按气泡身份，只删目标气泡） ----------
        async function deleteOneMessage(bubbleId) {
            var list = loadMessages();
            var originalSnapshot = JSON.parse(JSON.stringify(list));
            var resolved = resolveBubbleInPage(bubbleId);
            var keep;
            if (resolved && window.ChatMessagePolicy && typeof window.ChatMessagePolicy.removeBubblesFromHistory === 'function') {
                keep = window.ChatMessagePolicy.removeBubblesFromHistory(list, [bubbleId]);
            } else if (resolved) {
                keep = list.filter(function (m) { return ensureMid(m) !== resolved.mid; });
            } else {
                keep = list;
            }
            var changed = keep.length !== list.length || keep.some(function (m, i) { return m !== list[i]; });
            if (!changed) {
                if (typeof showToast === 'function') showToast('消息已不存在');
                return;
            }
            if (!await replaceChatSafely(originalSnapshot, keep)) {
                if (typeof showToast === 'function') showToast('删除失败，消息和图片均已保留');
                return;
            }
            var keptMids = new Set(keep.map(function (m) { return String(ensureMid(m)); }));
            var removedMessages = list.filter(function (m) { return !keptMids.has(String(ensureMid(m))); });
            if (removedMessages.length) releaseDeletedChatImageReferences(removedMessages);
            rerenderFromList(loadMessages());
            if (typeof showToast === 'function') showToast('已删除 1 条消息');
        }

        async function saveEditedMessage() {
            var bubbleId = editMid;
            var resolved = resolveBubbleInPage(bubbleId);
            if (!resolved) {
                if (typeof showToast === 'function') showToast('消息已不存在');
                closeEditSheet();
                return;
            }
            var newText = String(editInput.value || '').trim();
            if (!newText) {
                if (typeof showToast === 'function') showToast('内容不能为空');
                return;
            }
            if (newText === String(resolved.text || '').trim()) { closeEditSheet(); return; }
            var list = loadMessages();
            var originalSnapshot = JSON.parse(JSON.stringify(list));
            var idx = -1;
            for (var i = 0; i < list.length; i++) { if (ensureMid(list[i]) === resolved.mid) { idx = i; break; } }
            if (idx === -1) {
                if (typeof showToast === 'function') showToast('消息已不存在');
                closeEditSheet();
                return;
            }
            var msg = list[idx];
            var textField = (msg.content != null && msg.text == null) ? 'content' : 'text';
            if (resolved.count > 1 && window.ChatMessagePolicy && typeof window.ChatMessagePolicy.replaceBubbleInText === 'function') {
                // 老记录一条消息含多个气泡：只替换目标段，兄弟气泡原样重建。
                var rebuilt = window.ChatMessagePolicy.replaceBubbleInText(String(msg.text || msg.content || ''), resolved.index, newText);
                msg[textField] = rebuilt || newText;
            } else {
                msg[textField] = newText;
            }
            msg.edited = true;
            msg.editedAt = Date.now();
            if (!await replaceChatSafely(originalSnapshot, list)) {
                if (typeof showToast === 'function') showToast('保存失败，未修改');
                return;
            }
            rerenderFromList(loadMessages());
            closeEditSheet();
            if (typeof showToast === 'function') showToast('已保存');
        }

        // 可选会话：角色列表（排除当前会话与已隐藏会话）+ 群聊列表
        function getForwardTargets() {
            var out = [];
            try {
                var roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]');
                var hidden = JSON.parse(localStorage.getItem('hidden_chat_dialog_ids') || '[]').map(String);
                if (Array.isArray(roles)) {
                    roles.forEach(function (r) {
                        if (!r || r.id == null) return;
                        if (String(r.id) === String(aliasRoleId)) return;
                        if (hidden.indexOf(String(r.id)) !== -1) return;
                        out.push({ id: String(r.id), name: r.name || '角色', avatar: r.avatar || '' });
                    });
                }
            } catch (e) {}
            try {
                var groups = JSON.parse(localStorage.getItem('phone_groups') || '[]');
                if (Array.isArray(groups)) {
                    groups.forEach(function (g) {
                        if (!g || !g.id) return;
                        if (String(g.id) === String(aliasRoleId)) return;
                        out.push({ id: String(g.id), name: g.name || '群聊', avatar: '' });
                    });
                }
            } catch (e) {}
            return out;
        }

        function openForwardSheet(bubbleId, resolved) {
            resolved = resolved || resolveBubbleInPage(bubbleId);
            if (!resolved || !fwOverlay) return;
            var msg = resolved.message;
            // 类型专属消息（红包/转账）只在整条消息只有一个气泡时拦截；老记录可单独转发某个文字气泡。
            if (resolved.count === 1 && (msg.type === 'redpacket' || msg.type === 'transfer')) {
                if (typeof showToast === 'function') showToast('红包/转账不支持转发');
                return;
            }
            var targets = getForwardTargets();
            var html = '';
            if (!targets.length) {
                html = '<div class="fw-empty">暂无可转发的好友</div>';
            } else {
                html = targets.map(function (t) {
                    var avSrc = safeUrl(t.avatar);
                    var av = avSrc
                        ? '<img src="' + escHtml(avSrc) + '" alt="">'
                        : escHtml(String(t.name || '?').slice(0, 1));
                    return '<button class="fw-item" type="button" data-id="' + escHtml(t.id) + '" data-name="' + escHtml(t.name) + '">' +
                        '<span class="fw-avatar">' + av + '</span>' +
                        '<span class="fw-name">' + escHtml(t.name) + '</span>' +
                        '</button>';
                }).join('');
            }
            fwList.innerHTML = html;
            fwList.dataset.bubbleId = bubbleId;
            fwOpenedAt = Date.now();
            fwOverlay.classList.add('active');
        }

        // 只携带白名单字段，避免把本地状态（mid/status/translation/isError）带过去引发二次余额逻辑
        async function forwardMessage(resolved, targetId, targetName) {
            var historyStorage = _storage && _storage.result;
            if (!historyStorage || typeof historyStorage.appendChatHistory !== 'function' || !targetId) {
                if (typeof showToast === 'function') showToast('目标会话或存储不可用，转发未完成');
                return;
            }
            var msg = resolved.message;
            var fwd = {
                role: 'user',
                time: Date.now(),
                forwarded: true,
                forwardFrom: { id: String(aliasRoleId), name: (chatTitle && chatTitle.textContent) || contactName },
                text: String(resolved.text || '') || plainTextOf(msg)
            };
            var linkedImageRef = false;
            if (resolved.count === 1) {
                if (msg.type === 'image' && msg.assetId) {
                    if (!_chatImageMediaRepo || typeof _chatImageMediaRepo.addRef !== 'function') {
                        if (typeof showToast === 'function') showToast('图片资源不可用，转发未完成');
                        return;
                    }
                    fwd.type = 'image';
                    fwd.assetId = String(msg.assetId);
                    fwd.desc = msg.desc || '';
                    ensureMid(fwd);
                    var linked;
                    try {
                        linked = await _chatImageMediaRepo.addRef(fwd.assetId, 'chat-message', String(fwd.mid));
                    } catch (e) {
                        if (typeof showToast === 'function') showToast('图片引用建立失败，转发未完成');
                        return;
                    }
                    if (!linked || !linked.ok) {
                        if (typeof showToast === 'function') showToast('图片引用建立失败，转发未完成');
                        return;
                    }
                    linkedImageRef = true;
                } else if (msg.type === 'image' && msg.img) {
                    fwd.type = 'image'; fwd.img = msg.img; fwd.desc = msg.desc || '';
                } else if (msg.type === 'voice') {
                    fwd.type = 'voice'; fwd.duration = msg.duration || 3;

        // URL 协议白名单：只放行图片类安全来源。
        // 单独转义不够——src="..." 里的引号可被闭合（`" onerror=alert(1)`），
        // 而 javascript: / vbscript: 这类协议即便转义了引号仍然危险。
        // 白名单之外一律返回空串，调用方按"无图"处理。
        function safeUrl(u) {
            var s = String(u == null ? '' : u).trim();
            if (!s) return '';
            // 去掉 HTML/CSS 里常见的空白与控制字符混淆（java\tscript: 之类）
            s = s.replace(/[\u0000-\u001F\u007F-\u009F]/g, '');
            if (/^(?:data\s*:)\s*image\/(?:png|jpe?g|gif|webp|bmp|svg\+xml|avif)\s*;/i.test(s)) return s;
            if (/^https?:\/\//i.test(s)) return s;
            if (/^blob:/i.test(s)) return s;
            if (/^(?:\.|\/)/.test(s)) return s;   // 站点相对路径
            return '';
        }

        // 属性赋值也无法用引号闭合出新的标签。
        function fillAvatar(el, src, fallbackHtml) {
            var s = safeUrl(src);
            if (!s) { el.innerHTML = fallbackHtml || ''; return el; }
            el.innerHTML = '';
            var img = document.createElement('img');
            img.alt = '';
            img.src = s;
            el.appendChild(img);
            return el;
        }

        // 直接拼 'url(' + v + ')' 属于 CSS 注入面——v 里的 ')' 会提前闭合，
        // 后面能追加任意声明。这里先过协议白名单，再对引号与括号做转义。
        function safeCssUrl(u) {
            var s = safeUrl(u);

        function handlePayCardClick(event) {
            const cardEl = event && event.currentTarget;
            if (!cardEl) return;
            const mid = cardEl.getAttribute('data-mid') || '';
            const indexStr = cardEl.getAttribute('data-index');

            // 必须按稳定 mid 查全量历史，不能把过滤了 silent/date 的显示序号当数组下标。
            const list = loadMessages();
            let index = mid ? list.findIndex(function (item) { return item && ensureMid(item) === mid; }) : -1;
            if (index < 0 && indexStr !== '' && indexStr != null) {
                const legacyIndex = parseInt(indexStr, 10);
                if (!isNaN(legacyIndex) && legacyIndex >= 0) index = legacyIndex;
            }
            if (index < 0 || index >= list.length) return;
            const msg = list[index];
            if (!msg || (msg.type !== 'redpacket' && msg.type !== 'transfer')) return;
            const isRed = msg.type === 'redpacket';

            if (msg.type === 'transfer' && msg.status === 'returned') {
                showToast('这笔转账已退回');
                return;
            }
            if (msg.type === 'transfer' && msg.status === 'accepted') {
                showToast('对方已收下这笔转账');
                return;
            }
            if (msg.type === 'transfer' && msg.status === 'returning') {
                showToast('对方正在退回这笔转账');
                return;
            }
            // 只有角色发来的红包/转账可以由用户领取，防止点击自己发出的卡片给自己加钱。
            if (msg.role !== 'assistant') {
                showToast('这是你发出的' + (isRed ? '红包' : '转账') + '，等待对方回应哦');
                return;
            }

            // 状态校验：已领取/已收款直接提示并 return
            if (isRed && msg.status === 'opened') {
                showToast('你已经领取过这个红包啦');
                return;
            }
            if (!isRed && msg.status === 'received') {
                showToast('已经收过款啦');
                return;
            }

            // 金额：Number 强转数字，杜绝字符串拼接（1000 + '100' 绝不会变成 '1000100'）
            const amountNum = Number(msg.amount);
            if (!isFinite(amountNum) || amountNum <= 0) {
                showToast('金额数据异常');
                return;
            }

            // 1. 先落钱包账本，并以消息 mid 做幂等键，避免状态存储失败后重复加钱。
            if (typeof getWorkData !== 'function' || typeof saveWorkData !== 'function') {
                showToast('钱包暂不可用，未完成收款');
                return;
            }
            const paymentId = ensureMid(msg);
            const wd = getWorkData();
            if (!wd || typeof wd !== 'object') {
                showToast('钱包数据读取失败，未完成收款');
                return;
            }
            if (!Array.isArray(wd.history)) wd.history = [];
            if (wd.history.some(function (entry) { return entry && String(entry.paymentId || '') === String(paymentId); })) {
                var duplicatePreviousStatus = msg.status;
                msg.status = isRed ? 'opened' : 'received';
                var duplicateStatusSaved = saveMessages(list);
                if (!duplicateStatusSaved) msg.status = duplicatePreviousStatus;
                renderAllMessages();
                showToast(duplicateStatusSaved
                    ? '这笔款项已经入账'
                    : '这笔款项已经入账，但聊天卡片状态未保存；请刷新后检查');
                return;
            }
            const oldBalance = Number(wd.balance);
            wd.balance = Math.round(((isFinite(oldBalance) ? oldBalance : 0) + amountNum) * 100) / 100;
            wd.history.unshift({
                type: 'income',
                category: msg.type,
                title: isRed ? '收到红包' : '收到转账',
                amount: amountNum,
                time: Date.now(),
                paymentId: paymentId
            });
            if (!saveWorkData(wd)) return;

            // 交易已入账后，再单独保存聊天卡片状态；聊天写入失败不能回滚已完成的虚拟收款。
            var statusSnapshots = [{ message: msg, status: msg.status, returnedAt: msg.returnedAt }];
            if (!isRed && /退回|退还|还给你/.test(String(msg.message || ''))) {
                for (let ri = list.length - 1; ri >= 0; ri--) {
                    const previous = list[ri];
                    if (previous && (previous.role === 'user' || previous.role === 'sent') &&
                        previous.type === 'transfer' && previous.status === 'returning' &&
                        Number(previous.amount) === amountNum) {
                        statusSnapshots.push({
                            message: previous,
                            status: previous.status,
                            returnedAt: previous.returnedAt
                        });
                        previous.status = 'returned';
                        previous.returnedAt = Date.now();
                        break;
                    }
                }
            }
            msg.status = isRed ? 'opened' : 'received';
            var chatStatusSaved = saveMessages(list);
            if (!chatStatusSaved) {
                statusSnapshots.forEach(function (snapshot) {
                    if (snapshot.status == null) delete snapshot.message.status;
                    else snapshot.message.status = snapshot.status;
                    if (snapshot.returnedAt == null) delete snapshot.message.returnedAt;
                    else snapshot.message.returnedAt = snapshot.returnedAt;
                });
            }

            // 记账本只在真正收款时记收入，避免 AI 生成卡片但用户尚未领取就提前入账。
            try {
                let fin = JSON.parse(localStorage.getItem('finance_records') || '[]');
                if (!Array.isArray(fin)) fin = [];
                if (!fin.some(function (entry) { return entry && String(entry.paymentId || '') === String(paymentId); })) {
                    fin.push({
                        paymentId: paymentId,
                        amount: amountNum,
                        type: '收入',
                        category: isRed ? '红包' : '转账',
                        note: (currentCharacter ? currentCharacter.name : '角色') + (isRed ? ' 发的红包' : ' 转账给我'),
                        time: Date.now()
                    });
                    localStorage.setItem('finance_records', JSON.stringify(fin));
                }
            } catch (e) {}
            renderAllMessages();
            if (!chatStatusSaved) {
                showToast('款项已入账，但聊天卡片状态没有保存；请检查存储空间后刷新聊天');
            }

            // 3. 结果弹窗：红包「已存入余额」，转账「收款成功」
            openPayResult('+' + amountNum.toFixed(2), isRed ? '已存入余额' : '收款成功');
        }


        // ===== 群投票 / 群接龙 / 角色群管理标记 =====
        function processGroupInteractionMarkers(rawText, speaker, historyList, isRegeneration, isGroupFollowup) {
            var text = String(rawText || '');
            if (!isGroupChat || !currentGroup || !Array.isArray(historyList)) return text;
            var changedHistory = false;
            var groupHistoryRollback = [];
            var relationshipEventSeen = false;
            text = text.replace(/\[群关系变化[:：]([^:：\]]{1,100})[:：]([^:：\]]{1,20})[:：]([+-]?\d{1,3})[:：]([+-]?\d{1,3})[:：]([^\]]{1,120})\]/gi, function (marker, targetKey, level, intimacyDelta, trustDelta, summary) {
                if (relationshipEventSeen) return '';
                relationshipEventSeen = true;
                if (isRegeneration || !isGroupFollowup || !speaker || speaker.id == null || getGroupSettings().relationshipDynamicsEnabled === false) return '';
                var targetId = String(targetKey || '').trim();
                var members = Array.isArray(currentGroup.members) ? currentGroup.members : [];
                var target = members.find(function (member) { return member && String(member.id) === targetId; });
                if (!target || String(target.id) === String(speaker.id)) return '';
                var previousSpeaker = findGroupSpeakerInHistory(historyList);
                if (!previousSpeaker || String(previousSpeaker.id) !== String(target.id)) return '';
                var relation = getOrCreateGroupRelationship(speaker, target);
                var direction = relation && relation.directions && relation.directions[String(speaker.id)];
                var policy = window.GroupChatPolicy;
                if (!direction || !policy || typeof policy.applyRelationshipEvent !== 'function') return '';
                var applied = policy.applyRelationshipEvent(direction, {
                    level: String(level || '').toLowerCase(),
                    intimacyDelta: Number(intimacyDelta),
                    trustDelta: Number(trustDelta),
                    summary: String(summary || '').trim()
                }, Date.now());
                if (applied) {
                    relation.lastInteractionAt = Date.now();
                    saveCurrentGroupObject();
                }
                return '';
            });
            text = text.replace(/\[群关系互动[:：]([^:：\]]{1,100})(?:[:：]([^\]]{1,160}))?\]/g, function (marker, targetKey, memorySummary) {
                if (isRegeneration || !speaker || speaker.id == null) return '';
                var targetId = String(targetKey || '').trim();
                var members = Array.isArray(currentGroup.members) ? currentGroup.members : [];
                var target = members.find(function (member) { return member && String(member.id) === targetId; });
                if (!target || String(target.id) === String(speaker.id)) return '';
                var previousSpeaker = findGroupSpeakerInHistory(historyList);
                if (!previousSpeaker || String(previousSpeaker.id) !== String(target.id)) return '';
                var relation = getOrCreateGroupRelationship(speaker, target);
                if (relation) {
                    relation.interactions = Math.max(0, parseInt(relation.interactions, 10) || 0) + 1;
                    relation.lastInteractionAt = Date.now();
                    var summary = String(memorySummary || '').replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
                    if (summary) {
                        var direction = relation.directions && relation.directions[String(speaker.id)];
                        if (direction) {
                            if (!Array.isArray(direction.sharedEvents)) direction.sharedEvents = [];
                            direction.sharedEvents.push({ summary: summary, time: Date.now(), fromId: String(speaker.id), toId: String(target.id) });
                            direction.sharedEvents = direction.sharedEvents.filter(function (item) { return item && String(item.summary || '').trim(); }).slice(-6);
                            direction.lastInteractionAt = Date.now();
                        }
                        if (!Array.isArray(relation.memories)) relation.memories = [];
                        relation.memories.push({ summary: summary, time: Date.now(), fromId: String(speaker.id), toId: String(target.id) });
                        relation.memories = relation.memories.filter(function (item) { return item && String(item.summary || '').trim(); }).slice(-6);
                    }
                    saveCurrentGroupObject();
                }
                return '';
            });
            text = text.replace(/\[群投票:([^\]:]+):(\d{1,2})\]/g, function (marker, pollMid, optionNumber) {
                var pollMessage = historyList.find(function (item) { return item && item.type === 'group_poll' && String(ensureMid(item)) === String(pollMid); });
                var poll = pollMessage && pollMessage.poll;
                var optionIndex = parseInt(optionNumber, 10) - 1;
                if (poll && !poll.closed && Array.isArray(poll.options) && optionIndex >= 0 && optionIndex < poll.options.length && speaker && speaker.id != null) {
                    groupHistoryRollback.push({
                        kind: 'votes',
                        message: pollMessage,
                        hadVotes: !!poll.votes,
                        votes: poll.votes && typeof poll.votes === 'object'
                            ? JSON.parse(JSON.stringify(poll.votes)) : null
                    });
                    if (!poll.votes || typeof poll.votes !== 'object') poll.votes = {};
                    poll.votes[String(speaker.id)] = optionIndex;
                    changedHistory = true;
                }
                return '';
            });
            text = text.replace(/\[群接龙:([^\]:]+):([^\]]{1,120})\]/g, function (marker, chainMid, entryText) {
                var chainMessage = historyList.find(function (item) { return item && item.type === 'group_chain' && String(ensureMid(item)) === String(chainMid); });
                var chain = chainMessage && chainMessage.chain;
                if (chain && !chain.closed && speaker && speaker.id != null && String(entryText || '').trim()) {
                    var duplicate = Array.isArray(chain.entries) && chain.entries.some(function (entry) { return String(entry.memberId || '') === String(speaker.id); });
                    if (!duplicate) {
                        groupHistoryRollback.push({
                            kind: 'entries',
                            message: chainMessage,
                            hadEntries: Array.isArray(chain.entries),
                            entries: Array.isArray(chain.entries) ? JSON.parse(JSON.stringify(chain.entries)) : []
                        });
                        if (!Array.isArray(chain.entries)) chain.entries = [];
                        chain.entries.push({ memberId: String(speaker.id), name: groupMemberDisplayName(speaker), text: String(entryText).trim().slice(0, 120), time: Date.now() });
                        changedHistory = true;
                    }
                }
                return '';
            });
            var settings = getGroupSettings();
            text = text.replace(/\[群私聊[:：]([^:：\]]+)[:：]([^\]]{1,300})\]/g, function (marker, targetKey, privateText) {
                if (settings.allowPrivateMessages === false) return '';
                var members = Array.isArray(currentGroup.members) ? currentGroup.members : [];
                var target = members.find(function (member) {
                    return member && (String(member.id) === String(targetKey).trim() ||
                        String(member.name || '').trim() === String(targetKey).trim() ||
                        groupMemberDisplayName(member) === String(targetKey).trim());
                });
                if (!target || !target.id || !String(privateText || '').trim()) return '';
                if (!speaker || String(speaker.id) !== String(target.id)) return '';
                var targetId = String(target.id);
                var displayName = groupMemberDisplayName(target);
                var privateMessageText = String(privateText).trim().slice(0, 300);
                var privateMsg = { role: 'assistant', name: displayName, text: privateMessageText, time: Date.now(), fromGroupId: String(currentGroup.id), privateFromGroup: true };
                var privateHistory = [];
                var privateSaved = false;
                try {
                    if (window.PhoneStorage && typeof window.PhoneStorage.getChatHistory === 'function') {
                        var storedHistory = window.PhoneStorage.getChatHistory(targetId);
                        if (Array.isArray(storedHistory)) privateHistory = storedHistory.slice();
                    }
                    if (!privateHistory.length) {
                        var rawPrivateHistory = localStorage.getItem('chat_history_' + targetId);
                        var parsedPrivateHistory = rawPrivateHistory ? JSON.parse(rawPrivateHistory) : [];
                        if (Array.isArray(parsedPrivateHistory)) privateHistory = parsedPrivateHistory;
                    }
                    privateHistory.push(privateMsg);
                    if (window.PhoneStorage && typeof window.PhoneStorage.saveChatHistory === 'function') {
                        privateSaved = window.PhoneStorage.saveChatHistory(targetId, privateHistory) === true;
                    } else {
                        localStorage.setItem('chat_history_' + targetId, JSON.stringify(privateHistory));
                        privateSaved = true;
                    }
                    var verifiedPrivate = window.PhoneStorage && typeof window.PhoneStorage.getChatHistory === 'function'
                        ? window.PhoneStorage.getChatHistory(targetId)
                        : JSON.parse(localStorage.getItem('chat_history_' + targetId) || '[]');
                    var lastPrivate = Array.isArray(verifiedPrivate) && verifiedPrivate.length
                        ? verifiedPrivate[verifiedPrivate.length - 1] : null;
                    privateSaved = privateSaved && Array.isArray(verifiedPrivate) &&
                        verifiedPrivate.length === privateHistory.length && lastPrivate &&
                        lastPrivate.role === privateMsg.role && lastPrivate.type === privateMsg.type &&
                        lastPrivate.time === privateMsg.time && lastPrivate.text === privateMsg.text &&
                        lastPrivate.fromGroupId === privateMsg.fromGroupId;
                } catch (privateError) {
                    privateSaved = false;
                    console.error('[GroupChat] private message persistence failed:', privateError);
                }
                if (!privateSaved) {
                    if (typeof showToast === 'function') showToast('群私聊消息没有保存成功，未显示已发送状态');
                    return '';
                }

                var groupPrivateMessage = {
                    role: 'assistant', type: 'group_private', text: privateMessageText,
                    senderId: targetId, privateRoleId: targetId, senderName: displayName,
                    name: displayName, fromGroupId: String(currentGroup.id), time: Date.now()
                };
                ensureMid(groupPrivateMessage);
                var previousGroupLength = historyList.length;
                historyList.push(groupPrivateMessage);
                if (!saveMessages(historyList)) {
                    historyList.length = previousGroupLength;
                    if (typeof showToast === 'function') showToast('私聊已保存，但群聊中的私聊入口没有保存成功');
                    return '';
                }
                window.__groupPrivateCardPending = true;
                showGroupPrivatePopup(displayName, targetId, privateMessageText);
                return '';
            });
            text = text.replace(/\[群动作[:：](改名|邀请|移除)[:：]([^\]]{1,40})\]/g, function (marker, action, targetName) {
                var isOwner = currentGroup && String(currentGroup.ownerId || '__user') === String(speaker && speaker.id || '');
                if (!settings.allowRoleActions || !speaker || (!speaker.isAdmin && !isOwner)) return '';
                targetName = String(targetName || '').trim();
                if (!targetName) return '';
                var actionMessage = '';
                if (action === '改名') {
                    currentGroup.name = targetName.slice(0, 20);
                    currentCharacter.name = currentGroup.name;
                    var title = document.getElementById('chat-title');
                    if (title) title.textContent = currentGroup.name;
                    actionMessage = '群管理员将群名修改为「' + currentGroup.name + '」';
                } else if (action === '邀请') {
                    var roles = [];
                    try { roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]'); } catch (e) {}
                    var targetRole = Array.isArray(roles) ? roles.find(function (role) { return role && (String(role.id) === targetName || String(role.name || '').trim() === targetName); }) : null;
                    if (targetRole && !(currentGroup.members || []).some(function (member) { return String(member.id) === String(targetRole.id); })) {
                        if (!Array.isArray(currentGroup.members)) currentGroup.members = [];
                        currentGroup.members.push({ id: String(targetRole.id), name: targetRole.name || '角色', avatar: targetRole.avatar || '', nickname: '', title: '', isAdmin: false, muted: false, activeFrom: '08:00', activeTo: '23:00' });
                        actionMessage = '群管理员邀请「' + (targetRole.name || '角色') + '」加入群聊';
                    }
                } else if (action === '移除') {
                    var existing = (currentGroup.members || []).find(function (member) { return String(member.id) === targetName || String(member.name || '').trim() === targetName || groupMemberDisplayName(member) === targetName; });
                    if (existing && (currentGroup.members || []).length > 1) {
                        currentGroup.members = currentGroup.members.filter(function (member) { return String(member.id) !== String(existing.id); });
                        if (String(currentGroup.ownerId || '') === String(existing.id)) currentGroup.ownerId = '__user';
                        actionMessage = '群管理员将「' + groupMemberDisplayName(existing) + '」移出群聊';
                    }
                }
                if (actionMessage) {
                    saveCurrentGroupObject();
                    if (typeof showToast === 'function') showToast(actionMessage);
                }
                return '';
            });
            text = text.replace(/\[群聊结束\]/g, function () {
                window.__groupAutoStopRequested = true;
                return '';
            });
            text = text.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
            if (changedHistory && !saveMessages(historyList)) {
                groupHistoryRollback.forEach(function (snapshot) {
                    var targetMessage = snapshot.message;
                    if (!targetMessage) return;
                    if (snapshot.kind === 'votes') {
                        if (snapshot.hadVotes) targetMessage.poll.votes = snapshot.votes;
                        else delete targetMessage.poll.votes;
                    } else if (snapshot.kind === 'entries') {
                        if (snapshot.hadEntries) targetMessage.chain.entries = snapshot.entries;
                        else delete targetMessage.chain.entries;
                    }
                });
                if (typeof showToast === 'function') showToast('群投票/接龙回应没有保存成功，原有互动状态已恢复');
            }
            return text;
        }

        function showGroupPrivatePopup(name, roleId, messageText) {
            var overlay = document.getElementById('groupPrivateOverlay');
            var desc = document.getElementById('groupPrivateDesc');
            var body = document.getElementById('groupPrivateBody');
            var go = document.getElementById('groupPrivateGo');
            if (!overlay || !desc || !body || !go) return;
            desc.textContent = name + ' 在群聊中给你发了一条私聊消息。';
            body.textContent = messageText || '';
            go.dataset.roleId = String(roleId || '');
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
        }
        (function bindGroupPrivatePopup() {
            var overlay = document.getElementById('groupPrivateOverlay');
            var later = document.getElementById('groupPrivateLater');
            var go = document.getElementById('groupPrivateGo');
            function close() {
                if (!overlay) return;
                overlay.classList.remove('active');
                overlay.setAttribute('aria-hidden', 'true');
            }
            if (later) later.addEventListener('click', close);
            if (overlay) overlay.addEventListener('click', function (event) { if (event.target === overlay) close(); });
            if (go) go.addEventListener('click', function () {
                var roleId = go.dataset.roleId;
                if (!roleId) { close(); return; }
                location.href = 'chat-detail.html?id=' + encodeURIComponent(roleId);
            });
            document.addEventListener('keydown', function (event) { if (event.key === 'Escape') close(); });
        })();

        (function bindGroupInteractionActions() {
            var pollAction = document.querySelector('.plus-item[data-feat="group-poll"]');
            var chainAction = document.querySelector('.plus-item[data-feat="group-chain"]');
            var callAction = document.querySelector('.plus-item[data-feat="group-call"]');
            var composerOverlay = document.getElementById('groupComposerOverlay');
            var composerForm = document.getElementById('groupComposerForm');
            var composerTitle = document.getElementById('groupComposerTitle');
            var composerDesc = document.getElementById('groupComposerDesc');
            var composerQuestion = document.getElementById('groupComposerQuestion');
            var composerQuestionLabel = document.getElementById('groupComposerQuestionLabel');
            var composerQuestionWrap = document.getElementById('groupComposerQuestionWrap');
            var composerOptionsWrap = document.getElementById('groupComposerOptionsWrap');
            var composerOptions = document.getElementById('groupComposerOptions');
            var composerEntryWrap = document.getElementById('groupComposerEntryWrap');
            var composerEntryLabel = document.getElementById('groupComposerEntryLabel');
            var composerEntry = document.getElementById('groupComposerEntry');
            var composerSubmit = document.getElementById('groupComposerSubmit');
            var composerMode = '';
            var composerTargetMid = '';
            if (!isGroupChat) {
                if (pollAction) pollAction.style.display = 'none';
                if (chainAction) chainAction.style.display = 'none';
                if (callAction) callAction.style.display = 'none';
                return;
            }
            if (callAction) callAction.addEventListener('click', function (event) {
                event.preventDefault(); event.stopImmediatePropagation();
                var overlay = document.querySelector('.plus-panel-overlay');
                if (overlay) overlay.classList.remove('active');
                location.href = '../call/call.html?id=' + encodeURIComponent(currentRoleId) + '&group=1&type=voice';
            }, true);
            function closePlusPanel() {
                var overlay = document.querySelector('.plus-panel-overlay');
                if (overlay) overlay.classList.remove('active');
            }
            function closeComposer() {
                if (!composerOverlay) return;
                composerOverlay.classList.remove('active');
                composerOverlay.setAttribute('aria-hidden', 'true');
                composerMode = '';
                composerTargetMid = '';
            }
            function maybeStartGroupActivity() {
                const settings = getGroupSettings();
                const rounds = Number(settings.autoTalkRounds);
                if (!settings.autoTalkEnabled || !rounds || getAvailableGroupMembers().length < 2) return;
                if (aiSending) {
                    showToast('等当前回复结束后，再发起新的群互动');
                    return;
                }
                // 刚创建的投票/接龙也能触发成员响应；延迟模拟成员看到消息后再接话。
                var activityToken = ++groupAutoFollowupToken;
                var activityDelay = getGroupReplyDelayMs();
                setTimeout(function () {
                    if (activityToken !== groupAutoFollowupToken) return;
                    sendMsg({ contextOnly: true, silent: true, groupFollowup: true, groupAutoDepth: 1 });
                }, activityDelay);
            }
            function openComposer(mode, targetMid) {
                if (!composerOverlay || !composerForm) { showToast('互动面板暂时无法打开'); return; }
                if (aiSending) { showToast('等当前角色回复结束后再发起互动'); return; }
                composerMode = mode;
                composerTargetMid = targetMid || '';
                composerForm.reset();
                composerQuestionWrap.style.display = '';
                composerOptionsWrap.style.display = mode === 'poll' ? '' : 'none';
                composerEntryWrap.style.display = mode === 'join' || mode === 'chain' ? '' : 'none';
                if (mode === 'poll') {
                    composerTitle.textContent = '发起群投票';
                    composerDesc.textContent = '把问题抛给大家，每位成员都可以表达自己的选择。';
                    composerQuestionLabel.textContent = '投票问题';
                    composerQuestion.placeholder = '例如：周末去哪儿？';
                    composerEntryWrap.style.display = 'none';
                    composerSubmit.textContent = '发起投票';
                } else if (mode === 'chain') {
                    composerTitle.textContent = '发起群接龙';
                    composerDesc.textContent = '先定一个主题，大家接着往下写。';
                    composerQuestionLabel.textContent = '接龙主题';
                    composerQuestion.placeholder = '例如：今天最想做的一件事';
                    composerEntryLabel.textContent = '我的第一条（可留空）';
                    composerEntry.placeholder = '可先留空，让群成员接第一棒';
                    composerSubmit.textContent = '发起接龙';
                } else {
                    composerTitle.textContent = '参与接龙';
                    composerDesc.textContent = '写下你的内容，提交后会追加到接龙列表。';
                    composerQuestionWrap.style.display = 'none';
                    composerEntryLabel.textContent = '我的接龙内容';
                    composerEntry.placeholder = '写下这一条内容';
                    composerSubmit.textContent = '提交内容';
                }
                composerOverlay.classList.add('active');
                composerOverlay.setAttribute('aria-hidden', 'false');
                setTimeout(function () {
                    var focusTarget = mode === 'join' ? composerEntry : composerQuestion;
                    if (focusTarget) focusTarget.focus();
                }, 80);
            }
            if (pollAction) pollAction.addEventListener('click', function (event) {
                event.preventDefault(); event.stopImmediatePropagation(); closePlusPanel(); openComposer('poll');
            }, true);
            if (chainAction) chainAction.addEventListener('click', function (event) {
                event.preventDefault(); event.stopImmediatePropagation(); closePlusPanel(); openComposer('chain');
            }, true);
            if (composerOverlay) composerOverlay.addEventListener('click', function (event) {
                if (event.target === composerOverlay) closeComposer();
            });
            var composerCancel = document.getElementById('groupComposerCancel');
            if (composerCancel) composerCancel.addEventListener('click', closeComposer);
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && composerOverlay && composerOverlay.classList.contains('active')) closeComposer();
            });
            if (composerForm) composerForm.addEventListener('submit', function (event) {
                event.preventDefault();
                if (composerMode === 'poll') {
                    var question = composerQuestion.value.trim();
                    var options = composerOptions.value.split(/[\n|]/).map(function (item) { return item.trim().slice(0, 40); }).filter(Boolean).slice(0, 6);
                    if (!question) { composerQuestion.focus(); showToast('先写下投票问题'); return; }
                    if (options.length < 2) { composerOptions.focus(); showToast('至少填写两个不同的选项'); return; }
                    options = options.filter(function (item, index) { return options.indexOf(item) === index; });
                    if (options.length < 2) { showToast('投票选项不能完全相同'); return; }
                    var history = loadMessages();
                    var message = { role: 'user', type: 'group_poll', text: '', poll: { question: question.slice(0, 100), options: options, votes: {}, closed: false }, time: Date.now() };
                    ensureMid(message);
                    history.push(message);
                    if (!saveMessages(history)) {
                        history.pop();
                        showToast('群投票没有保存成功，请检查本地存储空间');
                        return;
                    }
                    closeComposer();
                    renderAllMessages();
                    showToast('群投票已发起');
                    maybeStartGroupActivity();
                } else if (composerMode === 'chain') {
                    var title = composerQuestion.value.trim();
                    if (!title) { composerQuestion.focus(); showToast('先写下接龙主题'); return; }
                    var first = composerEntry.value.trim();
                    var entries = first ? [{ memberId: '__user', name: '我', text: first.slice(0, 120), time: Date.now() }] : [];
                    var chainHistory = loadMessages();
                    var chainMessage = { role: 'user', type: 'group_chain', text: '', chain: { title: title.slice(0, 80), entries: entries, closed: false }, time: Date.now() };
                    ensureMid(chainMessage);
                    chainHistory.push(chainMessage);
                    if (!saveMessages(chainHistory)) {
                        chainHistory.pop();
                        showToast('群接龙没有保存成功，请检查本地存储空间');
                        return;
                    }
                    closeComposer();
                    renderAllMessages();
                    showToast('群接龙已发起');
                    maybeStartGroupActivity();
                } else if (composerMode === 'join') {
                    var entryText = composerEntry.value.trim();
                    if (!entryText) { composerEntry.focus(); showToast('写点内容再提交'); return; }
                    var joinHistory = loadMessages();
                    var targetMessage = joinHistory.find(function (item) { return item && item.type === 'group_chain' && String(ensureMid(item)) === String(composerTargetMid); });
                    var targetChain = targetMessage && targetMessage.chain;
                    if (!targetChain || targetChain.closed) { closeComposer(); showToast('这条接龙已结束'); renderAllMessages(); return; }
                    if (!Array.isArray(targetChain.entries)) targetChain.entries = [];
                    if (targetChain.entries.some(function (entry) { return String(entry.memberId || '') === '__user'; })) { showToast('你已经参与过这条接龙'); return; }
                    var previousEntries = JSON.parse(JSON.stringify(targetChain.entries));
                    targetChain.entries.push({ memberId: '__user', name: '我', text: entryText.slice(0, 120), time: Date.now() });
                    if (!saveMessages(joinHistory)) {
                        targetChain.entries = previousEntries;
                        showToast('接龙内容没有保存成功，请检查本地存储空间');
                        return;
                    }
                    closeComposer();
                    renderAllMessages();
                    showToast('已加入接龙');
                }
            });
            var messageContainer = document.getElementById('chat-messages');
            if (!messageContainer) return;
            messageContainer.addEventListener('click', function (event) {
                var privateOpenButton = event.target.closest('[data-private-open]');
                if (privateOpenButton) {
                    var privateRoleId = privateOpenButton.getAttribute('data-private-open');
                    if (privateRoleId) location.href = 'chat-detail.html?id=' + encodeURIComponent(privateRoleId);
                    return;
                }
                var voteButton = event.target.closest('[data-poll-mid][data-poll-option]');
                if (voteButton) {
                    var history = loadMessages();
                    var pollMessage = history.find(function (item) { return item && item.type === 'group_poll' && String(ensureMid(item)) === String(voteButton.getAttribute('data-poll-mid')); });
                    var poll = pollMessage && pollMessage.poll;
                    var optionIndex = parseInt(voteButton.getAttribute('data-poll-option'), 10);
                    if (!poll || poll.closed || !Array.isArray(poll.options) || optionIndex < 0 || optionIndex >= poll.options.length) return;
                    var previousVotes = poll.votes && typeof poll.votes === 'object'
                        ? JSON.parse(JSON.stringify(poll.votes)) : null;
                    poll.votes = poll.votes && typeof poll.votes === 'object' ? poll.votes : {};
                    poll.votes.__user = optionIndex;
                    if (!saveMessages(history)) {
                        if (previousVotes) poll.votes = previousVotes;
                        else delete poll.votes;
                        showToast('投票没有保存成功，请检查本地存储空间');
                        return;
                    }
                    renderAllMessages();
                    return;
                }
                var closePollButton = event.target.closest('[data-poll-close]');
                if (closePollButton) {
                    var pollHistory = loadMessages();
                    var pollToClose = pollHistory.find(function (item) { return item && item.type === 'group_poll' && String(ensureMid(item)) === String(closePollButton.getAttribute('data-poll-close')); });
                    if (pollToClose && pollToClose.poll && !pollToClose.poll.closed) {
                        pollToClose.poll.closed = true;
                        if (!saveMessages(pollHistory)) {
                            pollToClose.poll.closed = false;
                            showToast('投票状态没有保存成功，请稍后重试');
                            return;
                        }
                        renderAllMessages();
                        showToast('投票已结束');
                    }
                    return;
                }
                var joinButton = event.target.closest('[data-chain-join]');
                if (joinButton) {
                    var chainHistory = loadMessages();
                    var chainMessage = chainHistory.find(function (item) { return item && item.type === 'group_chain' && String(ensureMid(item)) === String(joinButton.getAttribute('data-chain-join')); });
                    var chain = chainMessage && chainMessage.chain;
                    if (!chain || chain.closed) return;
                    openComposer('join', String(ensureMid(chainMessage)));
                    return;
                }
                var closeChainButton = event.target.closest('[data-chain-close]');
                if (closeChainButton) {
                    var closeHistory = loadMessages();
                    var chainToClose = closeHistory.find(function (item) { return item && item.type === 'group_chain' && String(ensureMid(item)) === String(closeChainButton.getAttribute('data-chain-close')); });
                    if (chainToClose && chainToClose.chain && !chainToClose.chain.closed) {
                        chainToClose.chain.closed = true;
                        if (!saveMessages(closeHistory)) {
                            chainToClose.chain.closed = false;
                            showToast('接龙状态没有保存成功，请稍后重试');
                            return;
                        }
                        renderAllMessages();
                        showToast('接龙已结束');
                    }
                }
            });
        })();

    </script>

        (function setupStickers() {
            var overlay = document.getElementById('stickerPanelOverlay');
            var grid = document.getElementById('stickerPanelGrid');
            var openBtn = document.getElementById('stickerOpenBtn');
            var roleTab = document.getElementById('stickerRoleTab');

                ? String((currentCharacter && currentCharacter.id) || currentRoleId || '')
