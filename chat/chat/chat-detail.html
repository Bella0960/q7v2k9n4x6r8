                            ? '[用户发送了一张表情包，表达的意思是：' + stickerMeaning + '。请理解其含义并自然回应，不要复述这段说明。]'
                            : '[用户发送了一张表情包，请结合语境自然回应。]'
                    });
                    return;
                }
                var content = stripInternalReasoning(m.text || m.content || '').trim();
                if (!content) return; // 纯展示卡片消息（位置/通话等）无文本时不发给 AI
                // 剥离 <narratage>...</narratage>（旁白是 UI 层，不占上下文序号）
                content = content.replace(/<narratage>[\s\S]*?<\/narratage>/gi, '');
                content = content.replace(/\n{3,}/g, '\n\n').trim();
                if (!content) return;
                if (m.role === 'sent' || m.role === 'user') {
                    apiMessages.push({ role: 'user', content: content });
                } else if (m.role === 'received' || m.role === 'assistant') {
                    apiMessages.push({ role: 'assistant', content: content });
                }
            });

            // 防呆：最后一条如果是 assistant（比如重试场景），强制补一条 user 消息
            const lastCheck = apiMessages[apiMessages.length - 1];
            if (lastCheck && lastCheck.role === 'assistant') {
                apiMessages.push({ role: 'user', content: '(继续)' });
            }

            // 界面反馈：显示"对方正在输入..."状态（底部 loading + 顶部 header 切换）
            var chatTitleEl = document.getElementById('chat-title');
            var originalTitleText = chatTitleEl ? chatTitleEl.textContent : '';
            if (chatTitleEl) chatTitleEl.textContent = '对方正在输入...';
            const statusId = 'loading-' + Date.now();
            const box = document.getElementById('chat-messages');
            const statusDiv = document.createElement('div');
            statusDiv.id = statusId;
            statusDiv.className = 'loading-dots';
            statusDiv.innerText = '对方正在输入...';
            box.appendChild(statusDiv);
            box.scrollTop = box.scrollHeight;

            // API 调用计时起点（用于调用记录）
            const apiCallStart = Date.now();

            // 打字机气泡引用（首个 delta 到达时复用现有气泡结构创建）
            let streamBubble = null;
            let fullText = '';

            // R4 渲染回调：交给 PhoneStream 每帧节流调用（正则清洗 + DOM 写入 + 滚动）
            // 引擎已抽离至 shared/js/phone/phone_stream.js（三段式超时/SSE 解析/残留收尾）
            function paintStreamLive(text) {
                /* 推理标签可能先于正文到达；在真正有可见聊天文字前，不创建气泡。 */
                var tmpText = stripInternalReasoning(extractVoiceCallMarker(text).text);
                tmpText = tmpText
                    .replace(/<narratage\b[^>]*>[\s\S]*?(?:<\/narratage\s*>|$)/gi, '')
                    .replace(/<\/?narratage\b[^>]*>/gi, '')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();

                if (!tmpText) return;

                if (!streamBubble) {
                    const loadingEl = document.getElementById(statusId);
                    if (loadingEl) loadingEl.remove();
                    appendMessageToDOM({ role: 'assistant', text: tmpText, name: groupReplyPick ? groupReplyPick.name : undefined });
                    if (typeof SoundSystem !== 'undefined') SoundSystem.play('receive', currentRoleId || '');
                    const lastRow = chatMessages.lastElementChild;
                    streamBubble = lastRow ? lastRow.querySelector('.msg-bubble') : null;
                }
                if (streamBubble) streamBubble.textContent = tmpText;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            aiSending = true;   // R3：进入请求阶段，到流式结束由收尾统一解锁（此前无 await，不存在并发窗口）

            // 流式请求：核心引擎已抽离至 shared/js/phone/phone_stream.js
            //（三段式超时 / SSE 半包解析 / 残留收尾 / rAF 节流 / 中断保文，全部内聚在模块内）
            // 永不 reject：结果对象 { ok, fullText, error }，fullText 中断时 = 已收到的部分
            const streamResult = await PhoneStream.chat({
                baseUrl: baseUrl,
                apiKey: apiKey,
                model: apiModel,
                messages: apiMessages,
                temperature: config.temperature != null ? config.temperature : 0.7,
                maxTokens: config.maxTokens,
                topP: config.topP,
                onPaint: paintStreamLive
            });
            fullText = streamResult.fullText;

            // 流内一直没出现 loading 移除（零 delta 兜底）
            const loadingEl2 = document.getElementById(statusId);
            if (loadingEl2) loadingEl2.remove();

            // 错误分类与日志（成功/失败都记录；文案在下方收尾分支组装成气泡）
            var errText = '';
            if (!streamResult.ok) {
                const e = streamResult.error || {};
                if (e.kind === 'http') {
                    errText = friendlyHttpError(e.status, e.detail || '');
                } else if (e.kind === 'abort') {
                    errText = e.reason === 'watchdog'
                        ? '连接中断（30 秒未收到新内容），请检查网络后重试。'
                        : (e.reason === 'total'
                            ? '回复超时（120 秒上限），未收到有效内容。'
                            : '请求超时（15秒未响应），请检查网络或 API 地址。');
                } else if (e.kind === 'stream') {
                    errText = '连接失败: ' + (e.detail || '流式响应异常');
                } else {
                    errText = '连接失败: ' + (e.detail || '请检查 API 设置是否正确（可能是跨域或地址不正确）');
                }
                logApiCall(apiModel, 'error', apiCallStart, errText);
            } else {
                logApiCall(apiModel, 'success', apiCallStart);
            }

            try {
                if (fullText) {
                    // ---- 标记剥离 → 清洗 → 落库 → 重渲染（成功与中断保文共用同一套收尾） ----
                    // 落盘前剥离主动通话标记：气泡展示与聊天记录均不保留标记，避免污染后续上下文
                    const parsedCall = extractVoiceCallMarker(fullText);
                    fullText = parsedCall.text;
                    // 剥离红包/转账标记 [红包:金额:留言] / [转账:金额:留言]
                    const parsedPay = extractPayMarkers(fullText);
                    fullText = parsedPay.text;
                    // 剥离自动记忆标记 [记住:xxx]，并存进 user_memory
                    const parsedMem = extractMemoryMarkers(fullText);
                    fullText = parsedMem.text;
                    if (parsedMem.memories.length) saveUserMemories(parsedMem.memories);
                    // 剥离心声标记 [心声:内容] 与虚拟图片标记 [图片:描述]
                    const parsedHeart = extractHeartMarkers(fullText);
                    fullText = parsedHeart.text;
                    const parsedImg = extractVImageMarkers(fullText);
                    fullText = parsedImg.text;
                    // 删除模型意外输出的推理草稿，再进行普通聊天文本清洗
                    fullText = stripInternalReasoning(fullText);
                    fullText = cleanupAiReply(fullText);
                    if (fullText) {
                        // 落库（保留 think/narratage 标签供 parseReplyContent 解析）
                        const aiMsg = { role: 'assistant', text: fullText, time: Date.now(), name: groupReplyPick ? groupReplyPick.name : undefined };
                        historyList.push(aiMsg);
                        saveMessages(historyList);
                        // 删掉流式期间的临时气泡（它只显示了剥离标签后的原始文本）
                        if (streamBubble) {
                            var tempRow = streamBubble.closest('.msg-row');
                            if (tempRow) tempRow.remove();
                        }
                        // 整体重新渲染：让新消息走 parseReplyContent → 思维链块 + 旁白块 + 多气泡
                        renderAllMessages();
                    } else if (streamBubble) {
                        // 模型只输出了标记：移除空白气泡、不落文本（来电卡/红包卡仍会插入）
                        const onlyRow = streamBubble.closest('.msg-row');
                        if (onlyRow) onlyRow.remove();
                    }
                    if (parsedCall.wantCall) {
                        // AI 侧插入黑底「发起语音通话」卡并落库；是否拨号由 chat_auto_call 开关决定
                        insertIncomingCallCard(historyList);
                        maybeAutoIncomingCall();
                    }
                    if (parsedPay.items.length) {
                        // AI 侧插入红包/转账卡片并落库，role='assistant' 可被用户点击领取
                        insertPayCards(historyList, parsedPay.items);
                    }
                    if (parsedHeart.hearts.length) {
                        insertHeartCards(historyList, parsedHeart.hearts);
                    }
                    if (parsedImg.images.length) {
                        insertVImageCards(historyList, parsedImg.images);
                    }
                    if (!streamResult.ok) {
                        // 中断提示：放在已收到内容之后（保命语义：以上为已收到的回复）
                        const e = streamResult.error || {};
                        var tipText = e.kind === 'abort'
                            ? (e.reason === 'total'
                                ? '回复较长已截断（120 秒上限），以上为已收到的内容'
                                : '连接中断（' + (e.reason === 'watchdog' ? '30 秒未收到新内容' : '连接超时') + '），以上为已收到的回复')
                            : '连接中断：' + (e.detail || '网络错误');
                        const tipMsg = { role: 'system_error', isError: true, text: tipText, time: Date.now() };
                        historyList.push(tipMsg);
                        saveMessages(historyList);
                        appendMessageToDOM(tipMsg);
                    }
                } else if (!streamResult.ok) {
                    // 零内容错误：HTTP/超时/网络 → 错误气泡（文案已在上方按类别组装）
                    const errorMsg = { role: 'system_error', isError: true, text: errText, time: Date.now() };
                    historyList.push(errorMsg);
                    saveMessages(historyList);
                    appendMessageToDOM(errorMsg);
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (postErr) {
                // 收尾处理自身的异常：仅记录，不伪装成网络错误
                console.error('[chat-detail] 流式收尾处理异常:', postErr);
            }

            aiSending = false;   // R3：所有出口统一解锁
            // 恢复 header 名字（所有出口统一恢复）
            if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
        }

        // 暴露给 chat-extras.js：重玩/重新生成
        window.sendMsg = sendMsg;
        window.regenerateReply = function(direction, mid) {
            if (aiSending) { if (typeof showToast === 'function') showToast('TA 正在回复中，稍等一下'); return; }
            if (isBlocked(aliasRoleId)) {
                if (typeof showToast === 'function') showToast('你已把 TA 拉黑，无法重玩或改写');
                return;
            }
            var list = loadMessages();
            var targetIdx = -1;
            if (mid) {
                for (var k = 0; k < list.length; k++) {
                    if (ensureMid(list[k]) === mid) { targetIdx = k; break; }
                }
            } else {
                // 从后往前找最后一条 AI 消息
                for (var i = list.length - 1; i >= 0; i--) {
                    var m = list[i];
                    if (m.role === 'received' || m.role === 'assistant') { targetIdx = i; break; }
                }
            }
            if (targetIdx === -1) {
                if (typeof showToast === 'function') showToast(mid ? '这条消息已不存在' : '还没有 AI 回复可以重玩');
                return;
            }
            list.splice(targetIdx, 1);
            saveMessages(list);
            // 清空聊天区重新渲染
            chatMessages.innerHTML = '';
            list.forEach(function(m) { appendMessageToDOM(m); });
            chatMessages.scrollTop = chatMessages.scrollHeight;
            // 触发重新生成
            sendMsg({ isRegenerate: true, regenDirection: direction || '' });
        };

        // 改写指定的某条 AI 消息（由消息操作面板调用）
        window.openRegenForMid = function(mid) {
            window.__regenMid = mid;
            if (typeof window.openRegen === 'function') window.openRegen(mid);
        };

        // ================= 消息多选（长按进入） =================
        var selectingMode = false;
        var selectedTimes = new Set();
        var pressTimer = null;

        function enterSelection(msgTime) {
            selectingMode = true;
            selectedTimes = new Set();
            if (msgTime) selectedTimes.add(msgTime);
            chatMessages.classList.add('selecting');
            document.getElementById('selectBar').classList.add('show');
            // 给所有消息行插入勾选圈
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                if (row.querySelector('.msg-select-check')) return;
                var c = document.createElement('div');
                c.className = 'msg-select-check';
                row.insertBefore(c, row.firstChild);
            });
            updateSelectionUI();
        }

        function exitSelection() {
            selectingMode = false;
            selectedTimes = new Set();
            chatMessages.classList.remove('selecting');
            var bar = document.getElementById('selectBar');
            if (bar) bar.classList.remove('show');
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                var c = row.querySelector('.msg-select-check');
                if (c) c.remove();
                row.classList.remove('ghost');
            });
        }

        function updateSelectionUI() {
            document.getElementById('selectCount').textContent = '已选 ' + selectedTimes.size + ' 条';
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                var t = row.dataset.time;
                var c = row.querySelector('.msg-select-check');
                if (!t || !c) return;
                var on = selectedTimes.has(t);
                c.classList.toggle('checked', on);
                row.classList.toggle('ghost', on);
            });
        }

        function toggleSelectRow(row) {
            var t = row.dataset.time;
            if (!t) return;
            if (selectedTimes.has(t)) selectedTimes.delete(t);
            else selectedTimes.add(t);
            updateSelectionUI();
        }

        // ================= 消息操作面板（长按弹出；多选收进面板，原多选逻辑保持不变） =================
        var MSG_ICON_SELECT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12.5l2.5 2.5 5-5.5"/></svg>';
        var MSG_ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V5.5A2.5 2.5 0 0 1 7.5 3H15"/></svg>';
        var MSG_ICON_FORWARD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19v-1.5A5.5 5.5 0 0 1 9.5 12H20"/><polyline points="15 7 20 12 15 17"/></svg>';
        var MSG_ICON_TRANSLATE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h9"/><path d="M7.5 5v1c0 4.5-2 8-4.5 9.5"/><path d="M5.5 12c1.8 3.2 4 4.6 6.5 5"/><path d="M12 20l3.5-9 3.5 9"/><path d="M13.4 17h4.2"/></svg>';
        var MSG_ICON_REWRITE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><polyline points="20 4 20 9 15 9"/></svg>';
        var MSG_ICON_QUOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4a6 6 0 0 1-3 5.2V11z"/><path d="M21 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4a6 6 0 0 1-3 5.2V11z"/></svg>';
        var MSG_ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
        var MSG_ICON_DELETE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

        var msgSheetOverlay = document.getElementById('msgSheetOverlay');
        var msgSheetList = document.getElementById('msgSheetList');
        var msgSheetMid = '';
        var msgSheetOpenedAt = 0;
        var pendingQuote = null;
        window.clearQuote = function () {
            pendingQuote = null;
            var qb = document.getElementById('quoteBar');
            if (qb) qb.style.display = 'none';
        };

        function closeMsgSheet() {
            if (msgSheetOverlay) msgSheetOverlay.classList.remove('active');
            msgSheetMid = '';
        }

        function sheetItemHTML(act, label, icon, danger) {
            return '<button class="msg-sheet-item' + (danger ? ' danger' : '') + '" type="button" data-act="' + act + '">' + icon + '<span>' + label + '</span></button>';
        }

        // 取消息的可读文本（非文本消息给等价占位文案）
        function plainTextOf(msg) {
            if (!msg) return '';
            // 心声带标签再复制/转发，避免对方看不出这是"心里话"
            if (msg.type === 'heart') return '[心声] ' + String(msg.text || '');
            var t = String((msg.text || msg.content) || '').trim();
            if (t) return t;
            if (msg.type === 'redpacket') return '[红包] ' + (msg.message || '恭喜发财，大吉大利');
            if (msg.type === 'transfer') return '[转账] ' + (msg.amount != null ? '¥' + msg.amount : '');
            if (msg.type === 'voice') return '[语音]' + (msg.text ? ' ' + msg.text : '');
            if (msg.type === 'image') return '[图片]' + (msg.desc ? ' ' + msg.desc : '');
            if (msg.type === 'location') return '[位置] ' + ((msg.location && msg.location.label) || '');
            if (msg.type === 'card') return '[名片] ' + ((msg.card && msg.card.name) || '');
            if (msg.type === 'sticker') return '[表情] ' + (msg.desc || '');
            if (msg.type === 'call') return '[通话]';
            return '[消息]';
        }

        // 菜单项按消息类型动态生成，内容不变
        function buildMsgMenuHTML(msg) {
            var isAi = msg.role === 'received' || msg.role === 'assistant';
            var hasText = !!String((msg.text || msg.content) || '').trim();
            var html = sheetItemHTML('select', '多选', MSG_ICON_SELECT, false);
            if (hasText) html += sheetItemHTML('copy', '复制文本', MSG_ICON_COPY, false);
            html += sheetItemHTML('forward', '转发给…', MSG_ICON_FORWARD, false);
            html += sheetItemHTML('quote', '引用回复', MSG_ICON_QUOTE, false);
            if (hasText) html += sheetItemHTML('translate', 'AI 翻译', MSG_ICON_TRANSLATE, false);
            if (isAi) html += sheetItemHTML('rewrite', '改写这条回复', MSG_ICON_REWRITE, false);
            if (hasText) html += sheetItemHTML('edit', '编辑内容', MSG_ICON_EDIT, false);
            html += sheetItemHTML('delete', '删除这条', MSG_ICON_DELETE, true);
            return html;
        }

        // 锚定定位：气泡上方放得下就向上弹，否则向下；左右与上下都钳制在手机屏内
        function positionMsgMenu(mid) {
            var row = chatMessages.querySelector('.msg-row[data-mid="' + mid + '"]');
            var host = document.querySelector('.phone-mockup') || document.body;
            if (!row || !msgSheetList || !host) { msgSheetList.style.visibility = ''; return; }
            var hostRect = host.getBoundingClientRect();
            var rowRect = row.getBoundingClientRect();
            var mw = msgSheetList.offsetWidth;
            var mh = msgSheetList.offsetHeight;
            var gap = 10;
            var above = (rowRect.top - hostRect.top) > (mh + gap + 10);
            var top = above
                ? (rowRect.top - hostRect.top - mh - gap)
                : (rowRect.bottom - hostRect.top + gap);
            var isSent = row.classList.contains('sent');
            var left = isSent ? (rowRect.right - hostRect.left - mw) : (rowRect.left - hostRect.left);
            left = Math.max(8, Math.min(left, hostRect.width - mw - 8));
            top = Math.max(8, Math.min(top, hostRect.height - mh - 8));
            msgSheetList.style.top = Math.round(top) + 'px';
            msgSheetList.style.left = Math.round(left) + 'px';
            msgSheetList.classList.remove('above', 'below');
            msgSheetList.classList.add(above ? 'above' : 'below');
            // 小三角对准气泡中心
            var bubbleEl2 = row.querySelector('.msg-bubble');
            var bRect = bubbleEl2 ? bubbleEl2.getBoundingClientRect() : rowRect;
            var ax = (bRect.left + bRect.width / 2) - (hostRect.left + left) - 5;
            ax = Math.max(14, Math.min(ax, mw - 24));
            msgSheetList.style.setProperty('--arrow-x', Math.round(ax) + 'px');
            msgSheetList.style.visibility = '';
        }

        function openMsgSheet(mid) {
            var msg = findByMid(mid);
            if (!msg || !msgSheetOverlay) return;
            msgSheetMid = mid;
            msgSheetList.innerHTML = buildMsgMenuHTML(msg);
            msgSheetList.style.visibility = 'hidden';
            msgSheetOpenedAt = Date.now();
            msgSheetOverlay.classList.add('active');
            positionMsgMenu(mid);
        }

        // 点击菜单以外的任何位置关闭；聊天区滚动时也关闭（菜单锚定的是旧位置）
        if (msgSheetOverlay) {
            msgSheetOverlay.addEventListener('click', function (e) {
                if (e.target.closest('.msg-menu')) return;
                if (Date.now() - msgSheetOpenedAt < 200) return;
                closeMsgSheet();
            });
        }
        chatMessages.addEventListener('scroll', function () {
            if (msgSheetOverlay && msgSheetOverlay.classList.contains('active')) closeMsgSheet();
        }, { passive: true });
        if (msgSheetList) {
            msgSheetList.addEventListener('click', function (e) {
                var btn = e.target.closest('.msg-sheet-item');
                if (!btn) return;
                var act = btn.getAttribute('data-act');
                var mid = msgSheetMid;
                var msg = findByMid(mid);
                closeMsgSheet();
                if (!msg) return;
                if (act === 'select') { enterSelection(String(msg.time || '')); return; }
                if (act === 'copy') { copyMessageText(msg); return; }
                if (act === 'forward') { openForwardSheet(mid); return; }
                if (act === 'quote') {
                    pendingQuote = { mid: mid, text: plainTextOf(msg), fromRole: msg.role };
                    var qb = document.getElementById('quoteBar');
                    var qbt = document.getElementById('quoteBarText');
                    if (qb && qbt) {
                        qbt.textContent = '引用：' + pendingQuote.text.substring(0, 60);
                        qb.style.display = 'block';
                    }
                    return;
                }
                if (act === 'translate') {
                    if (typeof translateMessage === 'function') translateMessage(mid);
                    else if (typeof showToast === 'function') showToast('翻译功能稍后开放');
                    return;

            function fallback() {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = txt;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    ok();
                } catch (e) {
                    if (typeof showToast === 'function') showToast('复制失败');
                }
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(ok).catch(fallback);
            } else {
                fallback();
            }
        }

        // 只携带白名单字段，避免把本地状态（mid/status/translation/isError）带过去引发二次余额逻辑
        function forwardMessage(msg, targetId, targetName) {
            var key = 'chat_history_' + targetId;
            var arr = [];
            try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { arr = []; }
            if (!Array.isArray(arr)) arr = [];
            var fwd = {
                role: 'user',
                time: Date.now(),
                forwarded: true,
                forwardFrom: { id: String(aliasRoleId), name: roleDisplayName },
                text: plainTextOf(msg)
            };
            if (msg.type === 'image' && msg.img) { fwd.type = 'image'; fwd.img = msg.img; fwd.desc = msg.desc || ''; }
            else if (msg.type === 'voice') { fwd.type = 'voice'; fwd.duration = msg.duration || 3; }
            else if (msg.type === 'location' && msg.location) { fwd.type = 'location'; fwd.location = msg.location; }
            else if (msg.type === 'card' && msg.card) { fwd.type = 'card'; fwd.card = msg.card; }
            else if (msg.type === 'sticker' && msg.img) { fwd.type = 'sticker'; fwd.img = msg.img; fwd.desc = msg.desc || ''; }
            arr.push(fwd);
            try {
                localStorage.setItem(key, JSON.stringify(arr));
            } catch (e) {
                if (typeof showToast === 'function') showToast('转发失败：本地存储空间不足');

        function syncChatThemeLayout() {

                const microphoneGlyph = '<rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path>';
                voiceSvg.innerHTML = isIMessageTheme ? audioWaveform : microphoneGlyph;

            if (chatForm && capsule && sendButton && sendButton.parentElement !== chatForm) {
                chatForm.insertBefore(sendButton, capsule.nextSibling);

        // ========== 红包/转账卡片工具 ==========

        function escHtml(s) {

        const WORK_DATA_KEY = 'workData';
        function getWorkData() {
            let wd = null;
            try {
                const raw = localStorage.getItem(WORK_DATA_KEY);
                if (raw) wd = JSON.parse(raw);
            } catch (e) {}
            if (!wd || typeof wd !== 'object' || Array.isArray(wd)) {

                wd.balance = 1000;
            }
            // 交易明细：history 缺失或非法时补空数组（老数据自动兼容）
            if (!Array.isArray(wd.history)) wd.history = [];
            return wd;
        }
        function saveWorkData(wd) {

        // 红包/转账卡片点击：拆红包 / 收款（防重复领取，金额强转数字防字符串拼接）
        function handlePayCardClick(event) {
            const cardEl = event && event.currentTarget;
            if (!cardEl) return;
            const indexStr = cardEl.getAttribute('data-index');
            if (indexStr === '' || indexStr == null) return;
            const index = parseInt(indexStr, 10);
            if (isNaN(index) || index < 0) return;

            // 每次点击都从 localStorage 重读最新消息：双击时第二次读到的已是最新状态，天然防重复刷钱
            const list = loadMessages();
            const msg = list[index];
            if (!msg || (msg.type !== 'redpacket' && msg.type !== 'transfer')) return;
            const isRed = msg.type === 'redpacket';

            // 角色判断（修复资金漏洞）：只有对方(assistant)发来的才能领取；
            // 自己(user/sent)发出的只提示等待对方，不加余额、不改状态
            if (msg.role !== 'assistant') {
                showToast('这是你发出的' + (isRed ? '红包' : '转账') + '，等待对方领取哦');
                return;
            }

            // 状态校验：已领取/已收款直接提示并 return
            if (isRed && msg.status === 'opened') {
                showToast('你已经领取过这个红包啦');
                return;
            }
            if (!isRed && msg.status === 'received') {
                showToast('已经收过款啦');
                return;
            }

            // 金额：Number 强转数字，杜绝字符串拼接（1000 + '100' 绝不会变成 '1000100'）
            const amountNum = Number(msg.amount);
            if (!isFinite(amountNum) || amountNum <= 0) {
                showToast('金额数据异常');
                return;
            }

            // 1. 改状态并保存回聊天历史
            msg.status = isRed ? 'opened' : 'received';
            saveMessages(list);

            // 2. 余额累加：保留两位小数，避免浮点误差
            const wd = getWorkData();
            wd.balance = Math.round((wd.balance + amountNum) * 100) / 100;

        // ================= 表情包：挂载库浏览与发送 =================
        (function setupStickers() {
            var overlay = document.getElementById('stickerPanelOverlay');
            var grid = document.getElementById('stickerPanelGrid');
            var openBtn = document.getElementById('stickerOpenBtn');
            if (!overlay || !grid || !openBtn) return;

            // 表情包管理页把所有库统一保存在 sticker_libraries。
            // 旧逻辑还要求每个角色额外存在 chat_sticker_libs_<roleId> 挂载列表，
            // 但管理页没有提供挂载操作，导致已上传的表情在聊天选择器里永远是空的。
            // 这里直接读取已保存的表情库，让上传内容立即可选、可发送。
            function getAvailableStickers() {
                try {
                    var libs = JSON.parse(localStorage.getItem('sticker_libraries') || '[]');
                    if (!Array.isArray(libs)) return [];
                    var out = [];
                    libs.forEach(function (lib) {
                        if (!lib || !Array.isArray(lib.stickers)) return;
                        lib.stickers.forEach(function (s) {
                            if (s && s.img) out.push(s);
                        });
                    });
                    return out;
                } catch (e) { return []; }
            }

            function render() {
                var stickers = getAvailableStickers();
                grid.innerHTML = '';
                if (!stickers.length) {
                    grid.innerHTML = '<div class="sticker-panel-empty">还没有表情包<br><button onclick="location.href=\'../sticker/sticker-manager.html\'" style="margin-top:12px;padding:8px 20px;border:none;border-radius:10px;background:#111;color:#fff;font-size:0.8rem;cursor:pointer;">+ 添加表情包</button></div>';
                    return;
                }
                stickers.forEach(function (s) {
                    var item = document.createElement('div');
                    item.className = 'sticker-panel-item';
                    var stickerThumb = document.createElement('img');
                    stickerThumb.src = String(s.img || '');
                    stickerThumb.alt = '';
                    item.appendChild(stickerThumb);
                    item.addEventListener('click', function () {
                        overlay.classList.remove('is-show');
                        sendSticker(s);
                    });
                    grid.appendChild(item);
                });
            }

            openBtn.addEventListener('click', function () {
                render();
                overlay.classList.add('is-show');
            });
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) overlay.classList.remove('is-show');
            });

            function sendSticker(s) {
                var msg = { role: 'user', type: 'sticker', img: s.img, desc: s.desc, time: Date.now() };
                var list = loadMessages();
                list.push(msg);
                saveMessages(list);
                appendMessageToDOM(msg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                if (typeof SoundSystem !== 'undefined') SoundSystem.play('send');
                // 描述只留在表情消息数据中，供 AI 请求上下文读取；不另存、不显示成聊天文字。
                sendMsg({
                    text: '[用户发送了一张表情包，表达的意思是：' + String(s.desc || '') + '。]',
                    silent: true,
                    contextOnly: true
                });
            }
        })();

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var rid = params.get('id') || params.get('roleId') || '';
  if (!rid) return;

  var HOUR = 3600000;
  var overlay = document.getElementById('sumOverlay');
  var sumSub = document.getElementById('sumSub');
  var btnConfirm = document.getElementById('sumConfirm');
  var btnDismiss = document.getElementById('sumDismiss');
  // M3：非阻塞提示（showToast 为主脚本的全局函数；异常时兜底 alert）
  function sumToast(msg) {
    if (typeof showToast === 'function') showToast(msg, 2600);
    else alert(msg);
  }

  function getHistory() {
    try {
      var raw = localStorage.getItem('chat_history_' + rid);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function getProcessedCount() {
    var n = parseInt(localStorage.getItem('chat_summary_processed_' + rid), 10);
    return isNaN(n) || n < 0 ? 0 : n;
  }
  function getInterval() {
    var n = parseInt(localStorage.getItem('chat_summary_interval_' + rid), 10);
    if (isNaN(n) || n < 1) n = 20;
    return Math.min(n, 200);
  }
  function autoEnabled() { return localStorage.getItem('chat_summary_auto_' + rid) !== '0'; }
  function lastSummaryAt() {
    var t = parseInt(localStorage.getItem('chat_last_summary_' + rid), 10);
    return isNaN(t) ? 0 : t;
  }
  function checkAutoSummary() {
    if (!autoEnabled() || overlay.style.display !== 'none') return;
    var history = getHistory(), processed = getProcessedCount();
    if (processed > history.length) processed = 0;
    var remaining = Math.max(0, history.length - processed);
    if (remaining < getInterval()) return;
    if (Date.now() - lastSummaryAt() < 8 * HOUR) return;
    sumSub.textContent = '有 ' + remaining + ' 条历史消息尚未整理。本次最多整理 20 条；原始聊天不会被替换或删除。确认后才会额外调用一次 API。';
    overlay.style.display = 'flex';
  }
  function snooze() {
    try { localStorage.setItem('chat_last_summary_' + rid, String(Date.now())); } catch (e) {}
    overlay.style.display = 'none';
  }
  async function doSummarize() {
    btnConfirm.disabled = true;
    btnConfirm.textContent = '整理中...';
    try {
      var config = {};
      try { config = JSON.parse(localStorage.getItem('api_settings') || '{}'); } catch (e) {}
      var apiKey = (config.apiKey || '').trim();
      var baseUrl = (config.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
      var apiModel = (config.model || 'gpt-3.5-turbo').trim();
      if (!apiKey) { sumToast('请先到设置页配置 API Key'); overlay.style.display = 'none'; return; }

      var history = getHistory(), startIndex = getProcessedCount();
      if (startIndex > history.length) startIndex = 0;
      var hardEnd = Math.min(history.length, startIndex + Math.min(20, getInterval()));
      var endIndex = startIndex, transcriptLines = [], transcriptChars = 0;
      while (endIndex < hardEnd) {
        var m = history[endIndex], line = '';
        if (m && !m.isError && m.role !== 'system_error') {
          var who = (m.role === 'sent' || m.role === 'user') ? '用户' : '角色';
          var content = String(m.text || m.content || m.desc || '').trim();
          if (content) line = who + '：' + content;
        }
        if (line && transcriptLines.length && transcriptChars + line.length + 1 > 4000) break;
        if (line && !transcriptLines.length && line.length > 4000) {
          transcriptLines.push(line.slice(0, 3800) + '…[单条消息较长，原文完整保留]');
          endIndex++;
          break;
        }
        if (line) {
          transcriptLines.push(line);
          transcriptChars += line.length + 1;
        }
        endIndex++;
      }
      var transcript = transcriptLines.join('\n');
      if (endIndex === startIndex) {
        overlay.style.display = 'none';
        sumToast('没有新的未整理记录');
        return;
      }
      if (!transcript) {
        localStorage.setItem('chat_summary_processed_' + rid, String(endIndex));
        localStorage.setItem('chat_last_summary_' + rid, String(Date.now()));
        overlay.style.display = 'none';
        sumToast('这批没有可整理的文字消息');
        return;
      }
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 20000);
      var resp = await fetch(baseUrl + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        signal: controller.signal,
        body: JSON.stringify({
          model: apiModel, temperature: 0.3, stream: false, max_tokens: 600,
          messages: [
            { role: 'system', content: '你是长期记忆整理助手。只整理当前这小批对话，不要把多件事压缩成空泛人格摘要。尽量保留具体人物、时间、专有名词、承诺、事件因果和未完成话题；没有证据的内容不要补造。输出 JSON 数组，每条格式为 {"content":"具体记忆","category":"key|plot|detail|anniversary|preference","importance":1到5的整数}。只输出 JSON 数组，没有值得长期保留的内容就输出 []。' },
            { role: 'user', content: '本批原始对话（消息序号 ' + startIndex + ' 至 ' + (endIndex - 1) + '）：\n' + transcript }
          ]
        })
      });
      clearTimeout(timer);
      if (!resp.ok) { sumToast(friendlyHttpError(resp.status, '')); overlay.style.display = 'none'; return; }
      var data = await resp.json();
      var text = data && data.choices && data.choices[0] && data.choices[0].message ? (data.choices[0].message.content || '').trim() : '';
      var jsonMatch = text.match(/\[[\s\S]*\]/);
      if (!jsonMatch) throw new Error('memory-json-invalid');
      var items = JSON.parse(jsonMatch[0]);
      if (!Array.isArray(items)) throw new Error('memory-json-invalid');

      var existing = [];
      try {
        var raw = localStorage.getItem('chat_memories_' + rid);
        existing = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(existing)) existing = [];
      } catch (e) {}
      var now = Date.now(), confirmed = 0, pending = 0, reinforced = 0;
      items.forEach(function (it) {
        if (!it || !it.content) return;
        var content = String(it.content).trim().slice(0, 240);
        var key = content.toLowerCase().replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '');
        var duplicate = existing.find(function (m) {
          return String(m && m.content || '').toLowerCase().replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '') === key;
        });
        var importance = Math.max(1, Math.min(5, parseInt(it.importance, 10) || 3));
        if (duplicate && key) {
          duplicate.reinforcementCount = Math.max(1, Number(duplicate.reinforcementCount) || 1) + 1;
          duplicate.lastReinforcedAt = now;
          duplicate.updatedAt = now;
          duplicate.importance = Math.max(Number(duplicate.importance) || 3, importance);
          duplicate.sourceStartIndex = startIndex;
          duplicate.sourceEndIndex = endIndex - 1;
          reinforced++;
          return;
        }
        var status = importance >= 4 ? 'confirmed' : 'pending';
        if (status === 'confirmed') confirmed++; else pending++;
        existing.push({
          id: 'mem_' + now.toString(36) + '_' + existing.length.toString(36),
          content: content,
          category: ['key','plot','detail','anniversary','preference'].indexOf(it.category) >= 0 ? it.category : 'detail',
          importance: importance, status: status, createdAt: now, lastReinforcedAt: now,
          reinforcementCount: 1, source: 'auto-summary', sourceRoleId: String(rid),
          sourceStartIndex: startIndex, sourceEndIndex: endIndex - 1
        });
      });
      if (window.MemoryRecall && window.MemoryRecall.saveMemories) window.MemoryRecall.saveMemories(rid, existing);
      else localStorage.setItem('chat_memories_' + rid, JSON.stringify(existing));
      localStorage.setItem('chat_summary_processed_' + rid, String(endIndex));
      localStorage.setItem('chat_last_summary_' + rid, String(now));
      overlay.style.display = 'none';
      var message = '本批整理：' + confirmed + ' 条确认';
      if (pending) message += ' · ' + pending + ' 条待确认';
      if (reinforced) message += ' · 强化旧记忆 ' + reinforced + ' 条';
      sumToast(message);
    } catch (err) {
      sumToast('总结失败：' + (err.name === 'AbortError' ? '请求超时' : (err.message === 'memory-json-invalid' ? '模型返回格式不正确，未推进进度，可重试' : '网络错误')));
      overlay.style.display = 'none';
    } finally {
      btnConfirm.disabled = false;
      btnConfirm.textContent = '整理下一批';
    }
  }

  btnDismiss.addEventListener('click', snooze);
  btnConfirm.addEventListener('click', doSummarize);

  // 页面加载后延迟检测
  setTimeout(checkAutoSummary, 1500);
})();
</script>

<script id="maomao-voice-input">
(function(){
  'use strict';
  var btn=document.getElementById('voice-input-btn');
  var input=document.getElementById('chat-input');
  if(!btn||!input)return;

  /* 单一交互：点一次开始聆听，再点一次结束。完全不使用长按/指针捕获逻辑。 */
  var SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition;
  var recognition=null, mode='', finalText='', interimText='', startTimer=null, stopRequested=false;
  var oldPlaceholder=input.getAttribute('data-default-placeholder')||input.placeholder;

  function getRestoredPlaceholder(){
    try {
      return window.ChatBeauty&&typeof ChatBeauty.getThemePreset==='function'&&ChatBeauty.getThemePreset()==='imessage'
        ?'iMessage 信息':oldPlaceholder;
    } catch(e) { return oldPlaceholder; }
  }

  function toast(message){
    /* Voice feedback stays local to this control, so other page-level toast/click guards cannot replace it. */
    var el=document.getElementById('voice-input-status');
    if(!el){
      el=document.createElement('div');el.id='voice-input-status';
      el.style.cssText='position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;background:#111;color:#fff;padding:9px 13px;font:12px -apple-system,BlinkMacSystemFont,sans-serif;max-width:85%;text-align:center';
      var shell=document.querySelector('.phone-mockup');
      if(shell)shell.appendChild(el);else document.body.appendChild(el);
    }
    el.textContent=message;el.style.display='block';clearTimeout(el._timer);
    el._timer=setTimeout(function(){el.style.display='none'},3200);
  }

  function setActive(active,label){
    btn.classList.toggle('recording',active);
    btn.setAttribute('aria-pressed',active?'true':'false');
    btn.title=label||(active?'正在聆听，再点一下结束':'点一下开始语音输入，再点一下结束');
    input.placeholder=active?'正在聆听… 再点一下结束':getRestoredPlaceholder();
  }

  function putText(text){
    text=String(text||'').trim();
    if(!text){toast('没有识别到文字。说完后再点一次波形结束录音。');return}
    var prefix=input.value.trim();
    input.value=prefix?(prefix+' '+text):text;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.focus();
    toast('语音已转成文字，可以检查后发送');
  }

  function errorText(code){
    switch(code){
      case 'not-allowed':
      case 'service-not-allowed': return '请允许浏览器使用麦克风和语音识别功能后重试';
      case 'audio-capture': return '没有检测到可用的麦克风';
      case 'no-speech': return '没有识别到语音。点一下开始，说完后再点一下结束';
      case 'network': return '浏览器的语音识别服务连接失败；这不是聊天 API 的转写接口';
      case 'language-not-supported': return '当前浏览器语音识别不支持中文';
      case 'aborted': return '';
      default: return '语音识别暂时不可用，请检查麦克风权限后重试';
    }
  }

  function resetState(){
    if(startTimer){clearTimeout(startTimer);startTimer=null}
    recognition=null;
    mode='';
    finalText='';
    interimText='';
    stopRequested=false;
    setActive(false);
    btn.disabled=false;
    input.placeholder=getRestoredPlaceholder();
  }

  function startListening(){
    if(mode!=='')return;
    if(!SpeechRecognitionCtor){
      input.focus();
      toast('当前浏览器不支持网页语音识别。可点输入框，再使用手机键盘上的麦克风听写；文字不会自动发送。');
      return;
    }
    var rec;
    try{rec=new SpeechRecognitionCtor()}
    catch(e){toast('无法启动语音识别，请检查麦克风权限后重试');return}

    recognition=rec;
    mode='starting';
    finalText='';
    interimText='';
    rec.lang='zh-CN';
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=1;
    setActive(true,'正在开启语音识别… 再点一下可结束');

    /* 避免浏览器既未触发 onstart 也未触发 onend 时，按钮卡死无法停止。 */
    startTimer=setTimeout(function(){
      if(recognition!==rec||mode!=='starting')return;
      /* 用户在启动阶段已点过停止：静默收尾，不把它当成“启动超时”故障。 */
      if(stopRequested){resetState();return;}
      try{rec.abort()}catch(e){}
      resetState();
      toast('语音识别启动超时。请检查麦克风权限或换用 Chrome 浏览器。');
    },8000);

    rec.onstart=function(){
      if(recognition!==rec)return;
      if(startTimer){clearTimeout(startTimer);startTimer=null}
      mode='listening';
      setActive(true,'正在聆听；说完后再点一次结束');
      /* 用户在启动阶段又点了一次时，等 onstart 确认就绪后再 stop，避免浏览器判定“操作太快”。 */
      if(stopRequested){
        mode='stopping';
        setActive(true,'正在整理语音文字…');
        try{rec.stop()}
        catch(e){try{rec.abort()}catch(ignore){};resetState();toast('语音服务未能正常结束，已重置。请再点一次重试。')}
        return;
      }
      toast('正在聆听。说完后再点一次波形结束。');
    };

    rec.onresult=function(event){
      if(recognition!==rec)return;
      var interim='';
      for(var i=event.resultIndex;i<event.results.length;i++){
        var result=event.results[i];
        var spoken=result&&result[0]?String(result[0].transcript||'').trim():'';
        if(!spoken)continue;
        if(result.isFinal)finalText+=(finalText?' ':'')+spoken;
        else interim+=(interim?' ':'')+spoken;
      }
      interimText=interim;
      /* 识别预览只放在输入框占位提示里，不会直接发送消息。 */
      input.placeholder=interimText||'正在聆听；说完后再点一次结束';
    };

    rec.onerror=function(event){
      if(recognition!==rec)return;
      rec._maomaoError=event&&event.error?event.error:'';
    };

    rec.onend=function(){
      if(recognition!==rec)return;
      var result=(finalText+' '+interimText).trim();
      var error=rec._maomaoError||'';
      var wasActive=mode!=='';
      var endedByUser=(mode==='stopping'||stopRequested);
      resetState();
      if(result)putText(result);
      else if(error&&error!=='aborted')toast(errorText(error));
      else if(wasActive&&endedByUser)toast('已结束，但没有识别到文字。请说完后再点一次结束。');
    };

    try{rec.start()}
    catch(e){
      resetState();
      toast('浏览器拒绝启动语音识别，请确认麦克风权限并使用 HTTPS。');
    }
  }

  function stopListening(){
    if(mode==='starting'){
      /* 不把“正在启动”当成失败，也不立刻调用 stop；等浏览器 onstart 后自动结束。 */
      stopRequested=true;
      setActive(true,'正在启动，已收到结束指令…');
      toast('已收到结束指令，正在等语音服务就绪；不会重复启动。');
      return;
    }
    if(mode==='listening'){
      mode='stopping';
      setActive(true,'正在整理语音文字…');
      try{if(recognition)recognition.stop()}
      catch(e){
        try{if(recognition)recognition.abort()}catch(ignore){}
        resetState();
        toast('语音已结束，请再试一次');
      }
      return;
    }
    if(mode==='stopping')toast('正在整理语音文字，请稍等一下');
  }

  btn.addEventListener('click',function(event){
    if(event){event.preventDefault();event.stopPropagation()}
    if(mode==='')startListening();
    else stopListening();
  });

  /* 页面离开时清理语音识别和启动看门狗。 */
  window.addEventListener('pagehide',function(){
    if(startTimer){clearTimeout(startTimer);startTimer=null}
    try{if(recognition)recognition.abort()}catch(e){}
    recognition=null;mode='';
  },{once:true});

  window.MAOMAO_VOICE_CAPABILITIES={
    speechToText:!!SpeechRecognitionCtor,
    recordingFallback:false,
    interaction:'tap-to-start-tap-to-stop',
    captureMode:'Browser SpeechRecognition',
    requiresConfiguredAPI:false
  };
})();
</script>

          '你刚才做的那道真的好好吃！下次能不能再做一次呀？',
          '说真的，你做菜居然这么好吃？我都想天天吃了。',
          '刚才那道菜的味道，我现在还在想呢……',
          '你什么时候学会做饭的？也太厉害了吧。',
          '刚才那道菜我全吃光了！真的一点都没剩。'
        ];
        var pool = cookBy === 'them' ? draftsThem : draftsMe;
        var draft = pool[Math.floor(Math.random() * pool.length)];
        function fillDraft(){
          var input = document.getElementById('chat-input');
          if (!input || input.value.trim()) return false;
          input.value = draft;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.focus({ preventScroll: true });
          return true;
        }
        if (!fillDraft()) window.addEventListener('load', function(){ setTimeout(fillDraft, 350); }, { once: true });
      } catch (e) { console.warn('投喂厨房上下文未能载入', e); }
    })();
    </script>

<script>
// iMessage clear transparency: no blur layers anywhere in this theme.
(function() {
  function isIMessageTheme() {
    var mockup = document.querySelector('.phone-mockup');
    return !!(mockup && mockup.getAttribute('data-chat-theme-preset') === 'imessage');
  }

  function applyClearTheme() {
    if (!isIMessageTheme()) return;
    var shell = document.querySelector('.phone-mockup');
    if (!shell) return;

    shell.querySelectorAll('.chat-header, .chat-title-box, .chat-stage, .input-dock').forEach(function(el) {
      el.style.setProperty('background', 'transparent', 'important');
      el.style.setProperty('background-color', 'transparent', 'important');
      el.style.setProperty('background-image', 'none', 'important');
      el.style.setProperty('box-shadow', 'none', 'important');
      el.style.setProperty('backdrop-filter', 'none', 'important');
      el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    });

    shell.querySelectorAll('*').forEach(function(el) {
      el.style.setProperty('backdrop-filter', 'none', 'important');
      el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    });

    shell.querySelectorAll('.msg-row .msg-bubble:not(.bubble-pay):not(.bubble-media)').forEach(function(bubble) {
      var row = bubble.closest('.msg-row');
      var isSent = !!(row && (row.classList.contains('sent') || row.classList.contains('right')));
      bubble.style.setProperty('background', isSent ? 'rgba(0,122,255,.26)' : 'rgba(255,255,255,.12)', 'important');
      bubble.style.setProperty('color', '#FFFFFF', 'important');
      bubble.style.setProperty('border-color', isSent ? 'rgba(105,185,255,.46)' : 'rgba(255,255,255,.24)', 'important');
      bubble.style.setProperty('box-shadow', 'none', 'important');
      bubble.style.setProperty('backdrop-filter', 'none', 'important');
      bubble.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    });

    shell.querySelectorAll('.chat-user-name, .chat-header-actions .nav-circle-btn').forEach(function(el) {
      el.style.setProperty('background', 'rgba(255,255,255,.10)', 'important');
      el.style.setProperty('box-shadow', 'none', 'important');
      el.style.setProperty('backdrop-filter', 'none', 'important');
      el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    });

    shell.querySelectorAll('.input-capsule').forEach(function(el) {
      el.style.setProperty('background', 'rgba(255,255,255,.10)', 'important');
      el.style.setProperty('border-color', 'rgba(255,255,255,.28)', 'important');
      el.style.setProperty('box-shadow', 'none', 'important');
      el.style.setProperty('backdrop-filter', 'none', 'important');
      el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    });

    shell.querySelectorAll('.plus-action-btn, .plus-icon-circle').forEach(function(el) {
      el.style.setProperty('backdrop-filter', 'none', 'important');
      el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
      el.style.setProperty('box-shadow', 'none', 'important');
    });

    shell.querySelectorAll('.plus-panel-sheet').forEach(function(el) {
      el.style.setProperty('background', 'rgba(18,22,29,.74)', 'important');
      el.style.setProperty('color', '#FFFFFF', 'important');
      el.style.setProperty('backdrop-filter', 'none', 'important');
      el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
      el.style.setProperty('box-shadow', 'none', 'important');
    });

    shell.querySelectorAll('.message-time, .msg-time, .msg-timestamp').forEach(function(el) {
      el.style.setProperty('background', 'transparent', 'important');
      el.style.setProperty('box-shadow', 'none', 'important');
      el.style.setProperty('backdrop-filter', 'none', 'important');
      el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    });
  }

  function scheduleApply() { setTimeout(applyClearTheme, 80); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleApply);
  } else {
    scheduleApply();
  }

  var root = document.getElementById('chat-messages');
  if (root && window.MutationObserver) {
    new MutationObserver(scheduleApply).observe(root, { childList: true, subtree: true });
  }

  var shell = document.querySelector('.phone-mockup');
  if (shell && window.MutationObserver) {
    new MutationObserver(scheduleApply).observe(shell, { attributes: true, attributeFilter: ['data-chat-theme-preset'], childList: true, subtree: true });
  }
})();
</script>
