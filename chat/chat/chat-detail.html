        // ====== 权重分层记忆系统 ======
        // 半衰期（天）：key=关键事件/anniversary=纪念日约1年，plot=线上剧情约3周，detail=生活细节/preference=互动偏好约2个月
        const MEM_HALF_LIFE = { key: 365, anniversary: 365, plot: 21, detail: 60, preference: 60 };
        const MEM_CAT_BASE = { key: 1.0, anniversary: 1.0, plot: 0.45, detail: 0.7, preference: 0.7 };

        function loadWeightMemories(roleId) {
            if (_storage) return _storage.getMemories(roleId);
            try {
                const raw = localStorage.getItem('chat_memories_' + roleId);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) { return []; }
        }
        function saveWeightMemories(roleId, arr) {
            arr = trimMemoriesByWeight(arr, 300);   // M1：存储上限 300 条，按权重淘汰尾部
            if (_storage) {
                var ok = _storage.saveMemories(roleId, arr);
                if (ok) {
                    _resetWarnCooldown('mem-save');
                } else if (_shouldWarnAgain('mem-save') && typeof showToast === 'function') {
                    showToast('记忆未能保存，请检查本地存储空间');
                }
                return;
            }
            try { localStorage.setItem('chat_memories_' + roleId, JSON.stringify(arr)); } catch (e) {}
        }
        function memoryWeight(m) {
            const anchor = m.lastReinforcedAt || m.createdAt || Date.now();
            const days = Math.max(0, (Date.now() - anchor) / 86400000);
            const half = MEM_HALF_LIFE[m.category] || 60;
            const base = MEM_CAT_BASE[m.category] || 0.6;
            let imp = Number(m.importance);
            if (isNaN(imp)) imp = 3;
            imp = Math.max(1, Math.min(5, imp)) / 5;
            const repeats = Math.max(1, Number(m.reinforcementCount) || 1);
            const reinforcementBoost = Math.min(1.45, 1 + (repeats - 1) * 0.08);
            return imp * base * Math.pow(2, -days / half) * reinforcementBoost;
        }
        // M1：记忆存储上限 —— 超过 max 条时按权重淘汰最不重要的；fixed（钉住）永不淘汰
        function trimMemoriesByWeight(arr, max) {
            arr = (Array.isArray(arr) ? arr : []).filter(Boolean);
            if (arr.length <= max) return arr;
            var pinned = arr.filter(function (m) { return m.status === 'fixed'; });
            var rest = arr.filter(function (m) { return m.status !== 'fixed'; });
            var budget = Math.max(0, max - pinned.length);
            rest = rest.map(function (m) { return { m: m, w: memoryWeight(m) }; })
                .sort(function (a, b) { return b.w - a.w; })
                .slice(0, budget)
                .map(function (x) { return x.m; });
            return pinned.concat(rest);
        }
        // 构造注入文本；加载记录与权重算法仍留在页面。纯文案规则走共享策略，加载失败则回退旧逻辑。
        function buildWeightedMemoryText(roleId, fallbackText) {
            const mems = loadWeightMemories(roleId);
            if (window.ChatContextPolicy && typeof window.ChatContextPolicy.buildWeightedMemoryInjectionText === 'function') {
                return window.ChatContextPolicy.buildWeightedMemoryInjectionText(mems, fallbackText, memoryWeight);
            }
            // Compatibility fallback: preserve the original fixed/confirmed/pending and clear/vague rules.
            const oldText = (fallbackText || '').trim();
            const oldValid = oldText && oldText !== '暂无记忆';
            if (!mems.length) return oldValid ? oldText : '暂无记忆';
            const fixed = mems.filter(function (m) { return m.status === 'fixed'; });
            const confirmed = mems.filter(function (m) { return !m.status || m.status === 'confirmed'; });
            const lines = [];
            if (fixed.length) {
                lines.push('【你一直记得的事】（钉住的记忆，绝对不会忘，可自然提及）');
                fixed.forEach(function (m) { lines.push('· ' + m.content); });
            }
            const weighted = confirmed.map(function (m) {
                return { content: m.content, weight: memoryWeight(m) };
            }).filter(function (m) { return m.content && m.weight > 0.12; });
            weighted.sort(function (a, b) { return b.weight - a.weight; });
            const clear = weighted.filter(function (m) { return m.weight >= 0.5; });
            const vague = weighted.filter(function (m) { return m.weight < 0.5; });
            if (clear.length) {
                lines.push('【你清晰记得的事】（可以自然地提及）');
                clear.forEach(function (m) { lines.push('· ' + m.content); });
            }
            if (vague.length) {
                lines.push('【你隐约记得的事】（只有当对方主动提起相关话题时，你才回忆起来；平时不要主动提起）');
                vague.forEach(function (m) { lines.push('· ' + m.content); });
            }
            if (oldValid) lines.push('【过往长期记忆】' + oldText);
            return lines.length ? lines.join('\n') : '暂无记忆';
        }

        // ================= R6：HTTP 状态码 → 友好提示（原始细节进 api-logs 供排查） =================
        var friendlyHttpError = window.friendlyHttpError = function (status, detail) {
            var map = {
                400: '请求格式有误（可能是参数错误或上下文超长）',
                401: 'API Key 错误或已失效，请到【设置 → API 设置】检查',
                403: '没有访问权限（Key 被禁用或无此模型权限）',
                404: 'API 地址或模型名不存在，请检查 Base URL 与模型设置',
                413: '请求内容过长，请精简人设/世界书或减少记忆条数',
                429: '请求太频繁或额度已用尽，请稍后再试',
                500: '服务器繁忙，请稍后再试',
                502: '服务器繁忙（网关错误），请稍后再试',
                503: '服务暂不可用（可能过载或维护），请稍后再试',
                504: '服务器响应超时，请稍后再试'
            };
            var tip = map[status] || ('请求失败（HTTP ' + status + '）');
            detail = String(detail || '').trim();
            return detail ? (tip + '｜' + detail.slice(0, 120)) : tip;
        };

        // ================= 非流式单次 AI 调用（翻译等短任务复用，含 15 秒超时与埋点） =================
        async function callAiNonStream(systemPrompt, userPrompt) {
            const cfg = getAiConfig();
            const apiKey = (cfg.apiKey || '').trim();
            const baseUrl = (cfg.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
            const apiModel = (cfg.model || 'gpt-3.5-turbo').trim();
            if (!apiKey) {
                if (typeof showToast === 'function') showToast('请先到【设置页 → API 设置】配置 API Key');
                return null;
            }
            const start = Date.now();
            const controller = new AbortController();
            const timeoutId = setTimeout(function () { controller.abort(); }, 15000);
            try {
                const resp = await fetch(baseUrl + '/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: apiModel,
                        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                        temperature: 0.3,
                        stream: false
                    })
                });
                clearTimeout(timeoutId);
                if (!resp.ok) {
                    let raw = '';
                    try { raw = await resp.text(); } catch (e) {}
                    let detail = raw;
                    try { detail = (JSON.parse(raw).error && JSON.parse(raw).error.message) || raw; } catch (e) {}
                    logApiCall(apiModel, 'error', start, friendlyHttpError(resp.status, detail));
                    return null;
                }
                const data = await resp.json();
                let out = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
                out = String(out || '').trim();
                if (!out) { logApiCall(apiModel, 'error', start, '空响应'); return null; }
                logApiCall(apiModel, 'success', start, '');
                return out;
            } catch (e) {
                clearTimeout(timeoutId);
                const em = (e && e.name === 'AbortError') ? '请求超时（15秒）' : ('连接失败：' + ((e && e.message) || ''));
                logApiCall(apiModel, 'error', start, em);
                return null;
            }
        }

        // ================= AI 翻译：结果写入 msg.translation 落库并就地追加小字 =================
        const TRANSLATE_SYSTEM = '[任务]\n你是翻译引擎，只做翻译，不做其他任何事。\n' +
            '[规则]\n' +
            '1. 原文是中文就翻译成英文；原文不是中文就翻译成简体中文。\n' +
            '2. 只输出译文本身，禁止输出解释、引号、“译文：”之类的前缀，禁止保留原文。\n' +
            '3. 保留原文语气与口语感，句子短、自然。\n' +
            '4. 人名、地名不翻译。\n' +
            '5. 长度与原文相当，不要扩写。';

        async function translateMessage(bubbleId) {
            const resolved = resolveBubbleInPage(bubbleId);
            if (!resolved) return;
            const src = String(resolved.text || '').trim();
            if (!src) {
                if (typeof showToast === 'function') showToast('这条消息没有可翻译的文字');
                return;
            }
            var cfgNow = getAiConfig();
            if (!(cfgNow.apiKey || '').trim()) {
                if (typeof showToast === 'function') showToast('请先到【设置页 → API 设置】配置 API Key');
                return;
            }
            if (typeof showToast === 'function') showToast('正在翻译...');
            const out = await callAiNonStream(TRANSLATE_SYSTEM, '请翻译以下内容：\n' + src);
            if (!out) {
                if (typeof showToast === 'function') showToast('翻译失败，请检查网络或 API 设置');
                return;
            }
            const list = loadMessages();
            var idx = -1;
            for (let i = 0; i < list.length; i++) {
                if (ensureMid(list[i]) === resolved.mid) { idx = i; break; }
            }
            if (idx === -1) return;
            const msg = list[idx];
            if (resolved.count > 1 && window.ChatMessagePolicy && typeof window.ChatMessagePolicy.applyBubbleTranslation === 'function') {
                // 老记录多气泡：翻译写回目标段，兄弟气泡不受影响。
                var textField = (msg.content != null && msg.text == null) ? 'content' : 'text';
                var rebuilt = window.ChatMessagePolicy.applyBubbleTranslation(String(msg.text || msg.content || ''), resolved.index, out);
                msg[textField] = rebuilt;
            } else {
                msg.translation = out;
                msg.translationAt = Date.now();
            }
            if (!saveMessages(list)) {
                if (typeof showToast === 'function') showToast('保存失败，未写入翻译');
                return;
            }
            rerenderFromList(list);
            if (typeof showToast === 'function') showToast('已翻译');
        }

        // R3 防重入锁：AI 回复期间（含流式）忽略重复发送，防止并发请求交错写坏聊天记录
        let aiSending = false;
        let lastGroupUserSend = { text: '', time: 0 };
        let groupAutoFollowupToken = 0;

        function acceptGroupUserMessage(candidateText) {
            if (!isGroupChat) return true;
            var normalized = String(candidateText || '').replace(/\s+/g, ' ').trim();
            if (!normalized) return true;
            var now = Date.now();
            var policy = window.GroupChatPolicy;
            var duplicated = policy && typeof policy.isDuplicateWithinWindow === 'function'
                ? policy.isDuplicateWithinWindow(lastGroupUserSend.text, lastGroupUserSend.time, normalized, now, 3000)
                : (lastGroupUserSend.text === normalized && now >= lastGroupUserSend.time && now - lastGroupUserSend.time < 3000);

            // Also inspect the saved timeline so a page refresh cannot reset the
            // three-second duplicate guard. Only the latest visible user message
            // participates; silent context-only prompts are deliberately ignored.
            if (!duplicated) {
                var savedHistory = loadMessages();
                for (var i = savedHistory.length - 1; i >= 0; i--) {
                    var savedMessage = savedHistory[i];
                    if (!savedMessage || savedMessage.silent ||
                        (savedMessage.role !== 'user' && savedMessage.role !== 'sent')) continue;
                    var savedText = String(savedMessage.text || savedMessage.content || '').replace(/\s+/g, ' ').trim();
                    var savedAt = Number(savedMessage.time || savedMessage.timestamp) || 0;
                    if (savedText && savedAt && now >= savedAt && now - savedAt < 3000) {
                        duplicated = policy && typeof policy.isDuplicateWithinWindow === 'function'
                            ? policy.isDuplicateWithinWindow(savedText, savedAt, normalized, now, 3000)
                            : savedText === normalized;
                    }
                    break;
                }
            }

            if (duplicated) return false;
            lastGroupUserSend = { text: normalized, time: now };
            return true;
        }

        function getGroupReplyDelayMs() {
            var policy = window.GroupChatPolicy;
            return policy && typeof policy.getReplyDelayMs === 'function'
                ? policy.getReplyDelayMs()
                : 1500;
        }
        // The pagehide event cannot await Web Locks. Store the visible partial
        // reply in its own per-tab journal; never write a stale full history
        // synchronously while leaving the page. Recovery is idempotent and
        // replays only after acquiring the normal conversation lock.
        let inflightSnapshot = null;
        var inflightJournalToken = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
        var inflightJournalKey = 'chat_inflight_journal_' + currentCharacter.id + '_' + inflightJournalToken;
        var inflightRecoveryRunning = false;
        window.addEventListener('pagehide', function () {
            try {
                if (!aiSending || !inflightSnapshot) return;
                var raw = String(inflightSnapshot.text || '').trim();
                if (!raw) return;
                var cleaned = stripInternalReasoning(raw)
                    .replace(/<narratage\b[^>]*>[\s\S]*?(?:<\/narratage\s*>|$)/gi, '')
                    .replace(/<\/?narratage\b[^>]*>/gi, '')
                    .replace(/\[中译[:：][^\]]{0,800}\]/g, '')
                    .replace(/\n{3,}/g, '\n\n').trim();
                if (!cleaned) return;
                localStorage.setItem(inflightJournalKey, JSON.stringify({
                    roleId: String(currentCharacter.id),
                    message: {
                        role: 'assistant', mid: 'inflight:' + inflightJournalToken,
                        text: cleaned, time: Date.now(),
                        voiceMode: inflightSnapshot.voiceMode || 'online',
                        name: inflightSnapshot.groupName,
                        memberId: inflightSnapshot.memberId
                    }
                }));
            } catch (error) {
                console.warn('[Chat] partial reply journal could not be saved:', error);
            }
        });
        async function recoverInFlightJournals() {
            // A bfcache-restored page may still finish the original stream.
            // Wait for that stream rather than inserting its partial twice.
            if (inflightRecoveryRunning || _chatHistoryUnreadable || aiSending) return;
            inflightRecoveryRunning = true;
            try {
                var prefix = 'chat_inflight_journal_' + currentCharacter.id + '_';
                var keys = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf(prefix) === 0) keys.push(key);
                }
                for (var j = 0; j < keys.length; j++) {
                    var stored;
                    try { stored = JSON.parse(localStorage.getItem(keys[j])); }
                    catch (error) { continue; }
                    if (!stored || String(stored.roleId) !== String(currentCharacter.id) ||
                        !stored.message || !String(stored.message.mid || '').startsWith('inflight:')) continue;
                    var entry = stored.message;
                    var alreadySaved = false;
                    var latest = loadMessages();
                    // A reply that completed after pagehide takes precedence
                    // over its shorter partial snapshot.
                    alreadySaved = latest.some(function (message) {
                        return message && (
                            message.mid === entry.mid ||
                            ((message.role === 'assistant' || message.role === 'received') &&
                                Math.abs(Number(message.time) - Number(entry.time)) < 120000 &&
                                String(message.text || '').indexOf(String(entry.text || '')) === 0)
                        );
                    });
                    if (alreadySaved) {
                        localStorage.removeItem(keys[j]);
                        continue;
                    }
                    var recovered = await appendChatSafely([entry], function (now) {
                        return !now.some(function (message) {
                            return message && (
                                message.mid === entry.mid ||
                                ((message.role === 'assistant' || message.role === 'received') &&
                                    Math.abs(Number(message.time) - Number(entry.time)) < 120000 &&
                                    String(message.text || '').indexOf(String(entry.text || '')) === 0)
                            );
                        });
                    });
                    if (recovered) {
                        localStorage.removeItem(keys[j]);
                        if (_vl) vlRefresh(); else renderAllMessages();
                    }
                }
            } catch (error) {
                console.warn('[Chat] partial reply recovery postponed:', error);
            } finally {
                inflightRecoveryRunning = false;
            }
        }

        // 3. 核心真实 AI 聊天发送逻辑 (含历史记录、人设构造与 15 秒超时控制)
        async function sendMsg(opts) {
            const input = document.getElementById('chat-input');
            const sendState = (window.ChatSendPolicy && typeof window.ChatSendPolicy.normalizeOptions === 'function')
                ? window.ChatSendPolicy.normalizeOptions(opts, input.value)
                : (function () {
                    // Compatibility fallback: preserve the original sendMsg option normalization.
                    const customText = (opts && typeof opts.text === 'string') ? opts.text.trim() : '';
                    return {
                        customText: customText,
                        silent: !!(opts && opts.silent),
                        contextOnly: !!(opts && opts.contextOnly),
                        regenDirection: (opts && typeof opts.regenDirection === 'string') ? opts.regenDirection.trim() : '',
                        isRegen: !!(opts && opts.isRegenerate),
                        isGroupFollowup: !!(opts && opts.groupFollowup),
                        groupAutoDepth: Math.max(0, parseInt(opts && opts.groupAutoDepth, 10) || 0),
                        text: customText || input.value.trim()
                    };
                })();
            const customText = sendState.customText;
            const silent = sendState.silent;
            const contextOnly = sendState.contextOnly;
            const regenDirection = sendState.regenDirection;
            const isRegen = sendState.isRegen;
            const isGroupFollowup = sendState.isGroupFollowup;
            const groupAutoDepth = sendState.groupAutoDepth;
            const text = sendState.text;
            // 重试调用携带的目标：API 失败时据此把原用户消息重新标记为可重试。
            const retryTarget = (opts && opts.retryTarget && typeof opts.retryTarget === 'object')
                ? {
                    mid: opts.retryTarget.mid ? String(opts.retryTarget.mid) : '',
                    time: opts.retryTarget.time
                }
                : null;
            var visionImageMids = (opts && Array.isArray(opts.visionImageMids))
                ? opts.visionImageMids.map(function (mid) { return String(mid || '').trim(); })
                    .filter(function (mid, index, items) { return mid && items.indexOf(mid) === index; }).slice(0, 4)
                : [];
            var avatarCandidateImages = [];
            window.__groupAutoStopRequested = false;
            let preflightReason;
            if (window.ChatSendPolicy && typeof window.ChatSendPolicy.evaluatePreflight === 'function') {
                preflightReason = window.ChatSendPolicy.evaluatePreflight({
                    text: text,
                    isRegen: isRegen,
                    contextOnly: contextOnly,
                    isBlocked: function () { return isBlocked(aliasRoleId); },
                    isSending: function () { return aiSending; },
                    isGroupChat: function () { return isGroupChat; },
                    hasGroup: function () { return !!currentGroup; },
                    getAvailableGroupMembers: function () { return getAvailableGroupMembers(); }
                });
            } else {
                // Compatibility fallback: keep every guard in its original order.

                else if (isBlocked(aliasRoleId)) preflightReason = 'blocked';
                else if (aiSending) preflightReason = 'busy';
                else if (isGroupChat && currentGroup && !isRegen && !contextOnly && !getAvailableGroupMembers().length) {
                    preflightReason = 'group-unavailable';
                } else preflightReason = 'ready';
            }
            // /photo [场景补充]：生成请求不作为普通聊天消息发送，也不进入 AI 对话正文。
            var photoCommand = !isRegen && !contextOnly && !silent
                ? String(text || '').match(/^\/photo(?:\s+([\s\S]*))?$/i) : null;
            if (photoCommand && isGroupChat) {
                if (typeof showToast === 'function') showToast('角色生图目前支持单人聊天，请在单人聊天中使用 /photo');
                return;
            }
            if (photoCommand && preflightReason === 'ready') {
                generateRoleImageFromChat((photoCommand[1] || '').trim());
                return;
            }
            if (preflightReason === 'empty') return;
            if (preflightReason === 'busy') {
                if (typeof showToast === 'function') showToast('TA 正在回复中，稍等一下');
                return;
            }
            if (preflightReason === 'group-unavailable') {
                if (typeof showToast === 'function') {
                    showToast(getGroupSettings().scheduleEnabled ? '当前时段没有可发言的群成员，大家都在休息' : '群成员都处于禁言状态');
                }
                return;
            }
            // blocked 不再拦截发送：消息照常发出，但标记为 sendFailed（渲染为红色感叹号），不调用 API
            // 提前处理：不走 API Key 检查，直接落库显示
            if (isBlocked(aliasRoleId) && !isRegen && !contextOnly) {
                const previousGroupUserSend = (isGroupChat && !silent) ? { ...lastGroupUserSend } : null;
                const previousGroupAutoFollowupToken = groupAutoFollowupToken;
                if (!silent && !acceptGroupUserMessage(text)) {
                    if (typeof showToast === 'function') showToast('这条群消息刚刚发送过了');
                    return;
                }
                let blockedHistory = loadMessages();
                const blockedQuote = pendingQuote ? {
                    mid: pendingQuote.mid, text: pendingQuote.text,
                    fromRole: pendingQuote.fromRole, authorName: pendingQuote.authorName

                const blockedMsg = { role: 'user', text: text, time: Date.now(), sendFailed: true, quote: blockedQuote };
                ensureMid(blockedMsg);
                blockedHistory.push(blockedMsg);
                // P0：用户消息必须真正落库后才生效；写失败就终止，保留输入与引用。
                if (!await appendChatSafely([blockedMsg])) {
                    if (previousGroupUserSend) lastGroupUserSend = previousGroupUserSend;
                    groupAutoFollowupToken = previousGroupAutoFollowupToken;
                    return;
                }
                if (isGroupChat && !silent) groupAutoFollowupToken += 1;
                if (blockedQuote && typeof window.clearQuote === 'function') window.clearQuote();
                if (_vl) vlRefresh(); else appendMessageToDOM(blockedMsg);
                input.value = '';
                input.style.height = 'auto';
                updateSendBtnState();
                if (typeof SoundSystem !== 'undefined') SoundSystem.play('send');
                scrollToBottom(true);
                return;
            }

            const config = getAiConfig();
            const apiKey = (config.apiKey || '').trim();
            let baseUrl = (config.baseUrl || 'https://api.openai.com/v1').trim();
            const apiModel = (config.model || 'gpt-3.5-turbo').trim();
            const customPrompt = (config.prompt || '').trim();

            if (!apiKey) {
                const historyList = loadMessages();
                let userMsg = null;
                let userSaved = null;
                const previousGroupUserSend = (isGroupChat && !silent)
                    ? { ...lastGroupUserSend } : null;
                const previousGroupAutoFollowupToken = groupAutoFollowupToken;

                if (!isRegen && !contextOnly) {
                    if (!silent && !acceptGroupUserMessage(text)) {
                        if (typeof showToast === 'function') showToast('这条群消息刚刚发送过了');
                        return;
                    }
                    const quoteSnapshot = (!silent && pendingQuote) ? {
                        mid: pendingQuote.mid, text: pendingQuote.text,
                        fromRole: pendingQuote.fromRole, authorName: pendingQuote.authorName
                    } : null;
                    userMsg = {
                        role: 'user', text: text, time: Date.now(), silent: !!silent,
                        quote: quoteSnapshot, sendFailed: true, sendFailedReason: 'missing-api-key'
                    };
                    if (visionImageMids.length) userMsg.visionImageMids = visionImageMids.slice();
                    ensureMid(userMsg);
                    historyList.push(userMsg);

                    // 先单独确认用户消息已落库；只有成功后才清空输入与引用。
                    userSaved = await appendChatSafely([userMsg]);
                    if (!userSaved) {
                        // P0：用户消息没有真正落库 → 立即终止本次发送。
                        // 不写 system_error、不渲染任何气泡，输入框原文与引用状态保持原样。
                        historyList.pop();
                        if (previousGroupUserSend) lastGroupUserSend = previousGroupUserSend;
                        groupAutoFollowupToken = previousGroupAutoFollowupToken;
                        return;
                    }
                    if (isGroupChat && !silent) groupAutoFollowupToken += 1;
                    if (quoteSnapshot && typeof window.clearQuote === 'function') window.clearQuote();
                    if (!silent) {
                        input.value = '';
                        input.style.height = 'auto';
                        updateSendBtnState();
                        if (typeof SoundSystem !== 'undefined') SoundSystem.play('send');
                    }
                }

                const errMsg = {
                    role: 'system_error', isError: true,
                    text: '请先到【设置页 → API 设置】配置 API Key',
                    time: Date.now()
                };
                // isRegen / contextOnly 反复触发时，相同错误已经在历史尾部就不再重复入库、渲染。
                if (!_isRepeatedSystemError(historyList, errMsg.text)) {
                    historyList.push(errMsg);
                    // 第二次写入同样以读回结果为准；失败则不保留、不渲染无名错误记录。
                    const errSaved = await appendChatSafely([errMsg]);
                    if (!errSaved) historyList.pop();
                    if (_vl) {
                        vlRefresh();
                    } else {
                        if (userMsg && userSaved && !silent) appendMessageToDOM(userMsg);
                        if (errSaved) appendMessageToDOM(errMsg);
                    }
                }
                scrollToBottom(true);
                return;
            }

            baseUrl = baseUrl.replace(/\/+$/, '');

            // 重玩模式：不新增用户消息，直接基于现有历史重新请求
            let historyList = loadMessages();
            if (retryTarget && !visionImageMids.length) {
                var retrySource = historyList.find(function (item) {
                    return item && String(item.mid || '') === String(retryTarget.mid || '');
                });
                if (retrySource && Array.isArray(retrySource.visionImageMids)) {
                    visionImageMids = retrySource.visionImageMids.map(function (mid) { return String(mid || ''); })
                        .filter(Boolean).slice(0, 4);
                }
            }
            if (!isRegen) {
                if (!contextOnly) {
                    const blockedNow = isBlocked(aliasRoleId);
                    const quoteSnapshot = (!silent && pendingQuote) ? {
                        mid: pendingQuote.mid, text: pendingQuote.text,
                        fromRole: pendingQuote.fromRole, authorName: pendingQuote.authorName
                    } : null;
                    const userMsg = {
                        role: 'user', text: text, time: Date.now(), silent: !!silent,
                        quote: quoteSnapshot
                    };
                    if (visionImageMids.length) userMsg.visionImageMids = visionImageMids.slice();
                    ensureMid(userMsg);
                    const previousGroupUserSend = (isGroupChat && !silent) ? { ...lastGroupUserSend } : null;
                    const previousGroupAutoFollowupToken = groupAutoFollowupToken;
                    if (!silent && !acceptGroupUserMessage(text)) {
                        if (typeof showToast === 'function') showToast('这条群消息刚刚发送过了');
                        return;
                    }
                    if (blockedNow) userMsg.sendFailed = true;
                    historyList.push(userMsg);
                    // P0：用户消息必须真正落库后才继续；写失败立即终止，保留输入与引用。
                    if (!await appendChatSafely([userMsg])) {
                        historyList.pop();
                        if (previousGroupUserSend) lastGroupUserSend = previousGroupUserSend;
                        groupAutoFollowupToken = previousGroupAutoFollowupToken;
                        return;
                    }
                    // Include other tabs' newly persisted messages in the AI context.
                    historyList = loadMessages();
                    if (isGroupChat && !silent) groupAutoFollowupToken += 1;
                    if (quoteSnapshot && typeof window.clearQuote === 'function') window.clearQuote();
                    if (!silent) {
                        if (_vl) vlRefresh(); else appendMessageToDOM(userMsg);
                        input.value = '';
                        input.style.height = 'auto';
                        updateSendBtnState();
                        if (typeof SoundSystem !== 'undefined') SoundSystem.play('send');
                    }
                    // 拉黑状态下：消息已显示为红色感叹号，不调用 API，直接结束
                    if (blockedNow) return;
                }
                scrollToBottom(true);

                // contextOnly 只发起 AI 回合，不创建普通用户文字消息。
            } else {
                historyList = loadMessages();
                if (opts && opts.regenTargetMid) {
                    // Filter the old turn from the AI prompt, but never persist its deletion.
                    // The existing stored turn remains intact through network/API failures.

                    var regenBefore = historyList.slice();

                    } else {

                            ? window.ChatMessagePolicy.parseBubbleId(regenTargetId)
                            : { mid: regenTargetId.split('#')[0] };

                    }

            // ===== R2 字符预算：上下文各段落设上限，超长静默截断降级（防 400 context_length_exceeded） =====
            // 阈值按中文 ≈0.6~1 token/字 估算；最坏组合 ~30k 字，适配主流 32k+ 上下文模型。要调就改这里。
            var CTX_CAP = {
                persona: 5000,      // 人设（在设定区与身份锁中各引用一次，实际占 2 份）
                memory: 3000,       // 分层长期记忆
                userMemory: 2000,   // [记住:...] 用户侧记忆
                worldbook: 8000,    // 世界书全量
                rpProtocol: 6000,   // RP 协议原文

            };

            // 组装超级 System Prompt（角色设定 + 用户信息 + 长期记忆 + 回复要求）
            // 群聊：合并全部成员人设，并随机选定本轮回复成员
            let rolePersona;
            let groupReplyPick = null;
            let groupContextPrompt = '';
            if (isGroupChat && currentGroup) {
                const members = currentGroup.members || [];
                const availableMembers = getAvailableGroupMembers();
                const personaLines = members.map(function (m, i) {
                    const r = getRoleById(m.id);
                    const p = (r && (r.persona || r.prompt || '').trim()) || '一个善解人意的朋友';

                    if (m.isAdmin) labels.push('管理员');
                    if (String(currentGroup.ownerId || '__user') === String(m.id)) labels.push('群主');
                    if (m.muted) labels.push('禁言中');
                    else if (!isGroupMemberInActiveHours(m)) labels.push('当前休息中');
                    return (i + 1) + '. ' + groupMemberDisplayName(m) + '（ID：' + String(m.id) + '）' + (labels.length ? '（' + labels.join('、') + '）' : '') + '：' + p;
                });
                rolePersona = '你是群聊「' + currentGroup.name + '」中的成员之一，成员名单如下：\n' + (personaLines.join('\n') || '暂无成员');
                if (availableMembers.length) {
                    var previousSpeaker = findGroupSpeakerInHistory(historyList);
                    var selectionText = String(text || '');
                    if (!selectionText && isGroupFollowup) {
                        for (var userIndex = historyList.length - 1; userIndex >= 0; userIndex--) {
                            var userEntry = historyList[userIndex];
                            if (userEntry && (userEntry.role === 'user' || userEntry.role === 'sent')) {
                                selectionText = String(userEntry.text || userEntry.content || '');
                                break;
                            }

                    var detectedGroupContext = groupPolicy && typeof groupPolicy.analyzeMessageContext === 'function'
                        ? groupPolicy.analyzeMessageContext(selectionText)
                        : null;
                    if (detectedGroupContext && detectedGroupContext.type !== 'casual') {

                            '请结合自己的角色人设、与发言者的关系和真实聊天上下文自然回应，不要为了匹配标签而强行接话。';
                    }

                        var mentionQueue = typeof groupPolicy.getPendingMentionIds === 'function'
                            ? groupPolicy.getPendingMentionIds(historyList, members, availableMembers, selectionText)
                            : (typeof groupPolicy.extractMentionedMemberIds === 'function'
                                ? groupPolicy.extractMentionedMemberIds(selectionText, members)
                                : []);
                        var recentSpeakerIds = [];
                        for (var recentIndex = historyList.length - 1; recentIndex >= 0 && recentSpeakerIds.length < 5; recentIndex--) {
                            var recentMessage = historyList[recentIndex];
                            if (!recentMessage || recentMessage.type || (recentMessage.role !== 'assistant' && recentMessage.role !== 'received')) continue;
                            var recentId = recentMessage.memberId != null ? String(recentMessage.memberId) : '';
                            if (!recentId && recentMessage.name) {
                                var recentMember = members.find(function (member) { return groupMemberDisplayName(member) === String(recentMessage.name); });
                                if (recentMember) recentId = String(recentMember.id);
                            }
                            if (recentId) recentSpeakerIds.push(recentId);
                        }
                        var speakerDecision = groupPolicy.selectSpeaker({
                            text: selectionText,
                            members: members,
                            availableMembers: availableMembers,
                            mentionQueueIds: mentionQueue,
                            isFollowup: isGroupFollowup,
                            previousSpeakerId: previousSpeaker && previousSpeaker.id,
                            relationshipTargetId: isGroupFollowup && previousSpeaker ? previousSpeaker.id : '',
                            recentSpeakerIds: recentSpeakerIds,
                            relationships: currentGroup.relationships,
                            context: detectedGroupContext
                        });
                        if (speakerDecision && speakerDecision.member) {
                            groupReplyPick = Object.assign({}, speakerDecision.member, {

                            });

                    } else {

                        var pickPool = availableMembers;
                        if (isGroupFollowup && previousSpeaker && availableMembers.length > 1) {
                            var alternatives = availableMembers.filter(function (member) {
                                return String(member.id) !== String(previousSpeaker.id);
                            });
                            if (alternatives.length) pickPool = alternatives;
                        }
                        var selectedMember = pickPool[Math.floor(Math.random() * pickPool.length)];
                        groupReplyPick = Object.assign({}, selectedMember, { name: groupMemberDisplayName(selectedMember) });
                    }
                }
            } else {
                rolePersona = (currentCharacter.persona || currentCharacter.prompt || '').trim()
                    || '你是一个善解人意、回复自然的AI助手。';
            }
            if (groupContextPrompt) rolePersona += '\n' + groupContextPrompt;
            rolePersona = capText(rolePersona, CTX_CAP.persona);

            // 当前主角色专属的人物关系与生活线；群聊只读取本轮发言角色自己的关系资料。
            function buildCharacterSocialPrompt(role) {
                if (!role || typeof role !== 'object') return '';
                var lines = [];
                var speechStyle = String(role.tone || role.speechStyle || role.speech || '').trim();
                if (speechStyle) lines.push('【主角色说话与表达习惯】\n' + speechStyle.slice(0, 900));
                var npcs = Array.isArray(role.npcCharacters) ? role.npcCharacters : [];
                var awarenessLabels = {
                    known: '用户已认识此人',
                    heard: '用户听说过此人，但不代表熟悉或见过',
                    unknown: '用户尚未认识此人'
                };
                var categoryLabels = {
                    family: '家人',
                    friend: '朋友',
                    work: '工作 / 学习',
                    other: '其他关系'
                };

                if (npcs.length) {
                    lines.push('【主角色的人物关系网络】');
                    npcs.slice(0, 30).forEach(function (npc) {
                        if (!npc || !String(npc.name || '').trim()) return;
                        var relation = String(npc.relation || categoryLabels[npc.category] || '其他关系').trim();
                        var category = categoryLabels[npc.category] || '其他关系';
                        var awareness = awarenessLabels[npc.awareness] || awarenessLabels.known;
                        lines.push('人物：' + String(npc.name).trim() + '；关系：' + relation + '；分类：' + category + '；' + awareness + '。');
                        [
                            ['身份 / 职业', npc.profession],
                            ['性格', npc.personality],
                            ['背景', npc.background],
                            ['与主角色的相处方式', npc.relationNotes],
                            ['与其他人物的关系', npc.connections],
                            ['说话习惯', npc.speechStyle],
                            ['个人生活与近况', npc.currentStatus]
                        ].forEach(function (field) {
                            var value = String(field[1] || '').trim();
                            if (value) lines.push(field[0] + '：' + value.slice(0, 420));
                        });
                    });
                    lines.push('人物关系规则：这些人是主角色生活中的独立个体，也有自己的生活与关系。严格依据档案，不擅自编造既成事实或共同经历。用户已认识的人可以在合适语境自然提起；用户听说过的人不代表熟悉；用户尚未认识的人不能被说成用户的熟人，若要引入应先自然介绍。不要每轮强行提 NPC，也不要逐条背诵档案。');
                }

                var lifeLine = String(role.lifeLine || '').trim();
                if (lifeLine) lines.push('【主角色生活状态与长期安排】\n' + lifeLine.slice(0, 1100));

                var events = Array.isArray(role.lifeEvents) ? role.lifeEvents.slice() : [];
                var statusLabels = { planned: '计划中', ongoing: '进行中', done: '已发生' };
                events.sort(function (a, b) {
                    return String(b.date || '').localeCompare(String(a.date || ''))
                        || Number(b.createdAt || 0) - Number(a.createdAt || 0);
                });
                if (events.length) {
                    lines.push('【主角色近期生活事件】');
                    events.slice(0, 12).forEach(function (item) {
                        if (!item || !String(item.title || '').trim()) return;
                        lines.push('事件：' + String(item.title).trim()
                            + (item.date ? '；日期：' + String(item.date) : '')
                            + (statusLabels[item.status] ? '；状态：' + statusLabels[item.status] : ''));
                        if (item.people) lines.push('涉及人物：' + String(item.people).slice(0, 160));
                        if (item.detail) lines.push('事件细节：' + String(item.detail).slice(0, 360));
                    });
                }

                if (!lines.length) return '';
                lines.push('生活连续性规则：把人物关系和生活线当作持续背景，而不是固定播报任务。计划中的事件不能说成已完成，过去事件不能随意改写；仅在话题相关、角色确实想到或适合分享时自然提起。');
                return lines.join('\n').slice(0, 4000);
            }

            var relationshipRole = isGroupChat
                ? (groupReplyPick ? getRoleById(groupReplyPick.id) : null)
                : currentCharacter;
            var characterSocialPrompt = '';
            try { characterSocialPrompt = buildCharacterSocialPrompt(relationshipRole); } catch (socialContextError) {
                console.warn('[CharacterSocialContext] skipped:', socialContextError);
            }


            // 用户资料（myProfile 里可能有：nickname/age/hobbies/likes/dislikes/about/sign）
            let myProfile = {};
            try {
                const rawProfile = localStorage.getItem('myProfile');
                if (rawProfile) myProfile = JSON.parse(rawProfile) || {};
            } catch (e) {}
            const userName = (myProfile.nickname || '').trim() || '未知';
            // 把用户人设拆成结构化字段，拼给 AI
            const userFacts = [];
            if (myProfile.age) userFacts.push('年龄：' + myProfile.age + '岁');
            if (myProfile.hobbies) userFacts.push('爱好：' + myProfile.hobbies);
            if (myProfile.likes) userFacts.push('喜欢：' + myProfile.likes);
            if (myProfile.dislikes) userFacts.push('讨厌：' + myProfile.dislikes);
            if (myProfile.about || myProfile.sign) userFacts.push('简介：' + (myProfile.about || myProfile.sign));
            const userPersona = userFacts.length ? userFacts.join('\n') : '无';

            // ===== 用户动态记忆：聊天中 AI 自动记住的关于用户的事 =====
            let userMemoryText = '（暂无）';
            try {
                const um = JSON.parse(localStorage.getItem('user_memory') || '[]');
                if (Array.isArray(um) && um.length) {
                    // User facts saved by older builds may be global; new extracted memories are stored
                    // in chat_memories_<roleId>. Keep scoped legacy entries with their own character.
                    const activeMemoryRoleId = String(aliasRoleId || currentRoleId || '');
                    const roleScoped = (
                        window.ChatContextPolicy &&
                        typeof window.ChatContextPolicy.filterUserMemoriesForRole === 'function'
                    )
                        ? window.ChatContextPolicy.filterUserMemoriesForRole(um, activeMemoryRoleId)
                        : um.filter(function(m) {
                            // Compatibility fallback: legacy entries without a role ID remain globally visible.
                            return !m.sourceRoleId || String(m.sourceRoleId) === activeMemoryRoleId;
                        });
                    userMemoryText = roleScoped.slice(-30).map(function(m){ return '· ' + (m.text || m.content || ''); }).join('\n');
                }
            } catch(e) {}
            userMemoryText = capText(userMemoryText, CTX_CAP.userMemory);

            // 长期记忆：权重分层（清晰记得/隐约记得），兼容原文本记忆
            const roleMemory = capText(buildWeightedMemoryText(
                typeof aliasRoleId !== 'undefined' ? aliasRoleId : roleId,
                (currentCharacter.memory || '').trim()
            ) || '暂无记忆', CTX_CAP.memory);

            // 实时状态（记忆空间子系统：当前心情 + 今日事件）
            const memoryContext = (typeof memorySystem !== 'undefined')
                ? memorySystem.getAIContext() : '暂无实时状态';

            // ===== 全局伴侣协议：所有角色与群聊统一读取同一个应用级设置 =====
            let rpProtocol = '';
            try {
                const globalRpKey = 'chat_rp_protocol_';
                rpProtocol = localStorage.getItem(globalRpKey) || '';

                // 一次性兼容旧版角色专属协议：优先迁移当前聊天角色，其余旧键仅作回退。
                if (!rpProtocol.trim()) {
                    const legacyRpKeys = [];
                    [aliasRoleId, currentCharacter && currentCharacter.id, roleId].forEach(function (id) {
                        if (id != null && String(id).trim()) {
                            const key = globalRpKey + String(id);
                            if (legacyRpKeys.indexOf(key) === -1) legacyRpKeys.push(key);
                        }
                    });
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.indexOf(globalRpKey) === 0 && key !== globalRpKey &&
                            legacyRpKeys.indexOf(key) === -1) legacyRpKeys.push(key);
                    }
                    for (let i = 0; i < legacyRpKeys.length; i++) {
                        const legacyValue = localStorage.getItem(legacyRpKeys[i]) || '';
                        if (legacyValue.trim()) {
                            rpProtocol = legacyValue;
                            localStorage.setItem(globalRpKey, legacyValue);
                            break;
                        }
                    }
                }
            } catch (e) {}
            rpProtocol = capText(rpProtocol.trim(), CTX_CAP.rpProtocol);

            // 世界书：召回当前话题相关条目；兼容旧版只有 content 的整本设定
            let worldbookText = '';
            try {
              const rawWB = localStorage.getItem('phone_worldbooks');
              if (rawWB) {
                let wbList = JSON.parse(rawWB) || [];
                if (!Array.isArray(wbList)) wbList = [];
                if (isGroupChat) {
                  const mountRaw = localStorage.getItem('chat_worldbooks_' + aliasRoleId);
                  if (mountRaw != null) {
                    const mounted = JSON.parse(mountRaw);
                    if (Array.isArray(mounted)) {
                      const mountedIds = mounted.map(function (id) { return String(id); });
                      wbList = wbList.filter(function (book) { return book && mountedIds.indexOf(String(book.id)) !== -1; });
                    }
                  }
                }
                if (window.ChatContextPolicy &&
                    typeof window.ChatContextPolicy.buildWorldbookInjectionText === 'function') {
                  worldbookText = window.ChatContextPolicy.buildWorldbookInjectionText(wbList, {
                    currentText: text,
                    recentMessages: historyList.slice(-8),
                    maxEntries: 32,
                    maxChars: CTX_CAP.worldbook
                  });
                } else {
                  worldbookText = wbList.map(function(b){
                    return '【' + (b.title || '未命名') + '】\n' + (b.content || '');
                  }).join('\n\n');
                }
              }
            } catch(e) { worldbookText = ''; }
            worldbookText = capText(worldbookText, CTX_CAP.worldbook);

            // 协议变量替换：{{char}} {{user}} {{persona}} {{memory}} {{worldbook}}
            function applyProtocolVars(text) {
                return String(text || '')
                    .replace(/\{\{char\}\}/g, currentCharacter.name || '角色')
                    .replace(/\{\{user\}\}/g, userName)
                    .replace(/\{\{persona\}\}/g, rolePersona)
                    .replace(/\{\{memory\}\}/g, roleMemory)
                    .replace(/\{\{worldbook\}\}/g, worldbookText || '暂无世界书');
            }

            let systemPrompt;
            if (rpProtocol) {
                // 协议存在：替换变量后置于 System Prompt 最顶端（最高优先级，覆盖底层默认规则）
                systemPrompt = capText(applyProtocolVars(rpProtocol), CTX_CAP.rpComposed);
            } else {
                // 协议不存在：使用原有的人设/用户信息/记忆/回复要求拼接逻辑
                systemPrompt = [
                    '[角色设定]',
                    rolePersona,
                    '',
                    '[用户信息]',
                    `用户名：${userName}`,
                    `用户人设/背景：${userPersona}`,
                    '',
                    '[长期记忆]',
                    roleMemory,
                    '',
                    '[实时状态]',
                    memoryContext,
                    '',
                    '[回复要求]',
                    '像真人发微信一样回复，用口语化短句，不要写动作描述（如*动作*），不要写旁白，每次回复简短自然，1-5句话即可。'
                ].join('\n');
                if (currentCharacter.name) {
                    systemPrompt = `你的名字是${currentCharacter.name}。\n${systemPrompt}`;
                }
            }
            // 群聊：覆盖本轮发言者身份（无论是否使用协议均生效）
            if (isGroupChat && groupReplyPick) {
                const memberNames = (currentGroup.members || []).map(function (m) { return groupMemberDisplayName(m); }).join('、') || '暂无成员';
                systemPrompt = '你正在群聊「' + currentGroup.name + '」中，群成员有：' + memberNames + '。本轮由你（' + groupReplyPick.name + '）以第一人称发言。\n' + systemPrompt;
                systemPrompt += '\n\n[群聊回复规则]\n直接输出' + groupReplyPick.name + '的聊天内容即可，不要输出名字前缀、不要用冒号开头、不要模拟其他成员发言，一次只由你一个人说话。';
                if (groupReplyPick.isMentioned) {
                    systemPrompt += '\n\n[本轮被@点名] 用户刚刚明确提到了你。请优先直接回应与自己相关的内容，不要忽略这次点名，也不要替其他被提及的成员发言。';
                }
                const groupSettings = getGroupSettings();
                systemPrompt += '\n\n[群成员自然互动]\n你们是在同一个群里的真实角色。先读懂最近几条群消息，再按自己的性格回应其中某一位成员；可以赞同、追问、补充、开玩笑或温和地不同意。不要每次都把话题拉回用户身上，不要机械复述上一句，不要替其他成员发言，也不要凭空编造人际关系或共同经历。回复保持简短自然，像群聊消息。若本条确实在回应上一位群成员，而不是主要回应用户，请在回复末尾添加隐藏标记 [群关系互动:准确角色ID:一句简短的真实互动记忆]；ID必须来自群成员名单，每轮最多一个。记忆只概括本轮确实发生的事或明确表达，不要推断情绪、关系升级或编造过去；建议 15-70 个汉字。没有明确回应对象时不要添加，系统会自动移除标记。';
                if (groupSettings.relationshipDynamicsEnabled !== false && isGroupFollowup) {
                    systemPrompt += '\n\n[动态关系事件评估]\n每次回复前都要判断：你与刚刚发言的上一位群成员之间，是否真的发生了足以改变关系的事情。普通寒暄、礼貌回应、单纯分享信息、日常玩笑通常不改变数值，不要为了使用功能而制造事件。只有关系确实受到影响时，才在本轮正常回复末尾追加一个隐藏标记：[群关系变化:准确角色ID:等级:亲密度变化:信任度变化:简短依据]。等级只能是 micro、moderate、major、turning；对应单项变化绝对值上限分别为 2、5、10、18，系统还会再次限幅。变化使用整数，可只改变亲密度或只改变信任度；没有真实变化就不要输出标记。正负方向必须符合当前互动：被理解、兑现承诺、可靠支持等可能增加；明显失信、羞辱、伤害关系的行为可能降低。不要因不同意见或普通拒绝直接判定背叛。依据必须来自本轮实际发生的内容，不能引用虚构过去。目标ID只能是刚刚与你发生直接互动的上一位群成员，不能选择用户、自己或旁观成员。每轮最多一个关系变化标记，不得自动改变关系类型；系统会移除标记并按安全上限保存，不要向群聊展示标记。';
                }
                const groupRelationshipContext = getGroupRelationshipContext(groupReplyPick.id);
                if (groupRelationshipContext) {
                    systemPrompt += '\n\n[群成员双向关系网]\n' + groupRelationshipContext + '\n箭头表示左侧角色对右侧角色的主观关系。亲密度、信任度与情绪倾向必须按方向分别理解；不要把 A 对 B 的态度套用到 B 对 A，也不要因为数值或关系标签自行升级关系、虚构共同经历。';
                }
                var speakerTalkativeness = Math.round(Math.max(0, Math.min(1, groupReplyPick.talkativeness == null ? 0.5 : Number(groupReplyPick.talkativeness))) * 100);
                var speakerInterests = Array.isArray(groupReplyPick.interests) ? groupReplyPick.interests.join('、') : String(groupReplyPick.interests || '');
                systemPrompt += '\n\n[本轮角色发言倾向]\n话唠度=' + speakerTalkativeness + '/100；兴趣=' + (speakerInterests || '未特别设置') + '。话唠度只影响自然参与群聊的主动性；兴趣只用于判断是否对话题有真实回应欲，不要机械提及这些设置。';
                if (isGroupFollowup) {
                    systemPrompt += '\n\n[自主接话回合 ' + groupAutoDepth + ']\n这是系统安排的自动接话，不是用户新发了一条消息。请接着最近那位群成员的话题说，当前发言者应当与上一位发言者不同。只输出你自己的1-3句群聊消息。如果话题已经自然结束、没有值得补充的内容，请只输出隐藏标记 [群聊结束]，不必硬聊。禁止把“继续”当成用户实际说的话。';
                }
                if (groupSettings.spectatorMode) {
                    systemPrompt += '\n\n[旁观模式]\n用户当前是旁观者。用户发来的文字是剧情走向提示或导演指令；角色之间优先自然交流、争论、互相回应，不要每句话都直接向用户提问或称呼用户，也不要替用户发言。';
                }
                if (groupSettings.memorySharing) {
                    const syncedMemoryLines = [];
                    (currentGroup.members || []).forEach(function (member) {
                        const role = getRoleById(member.id);
                        if (!role) return;
                        const memory = buildWeightedMemoryText(String(member.id), (role.memory || '').trim());
                        if (memory && memory !== '暂无记忆') syncedMemoryLines.push('【' + groupMemberDisplayName(member) + '的单聊记忆】\n' + memory);
                    });
                    if (syncedMemoryLines.length) {
                        systemPrompt += '\n\n[已启用成员单聊记忆同步]\n' + capText(syncedMemoryLines.join('\n\n'), 2200);
                    }
                }
                if (groupSettings.allowRoleActions) {
                    systemPrompt += '\n\n[群管理行动]\n只有带有管理员或群主身份的成员才可以根据剧情执行群管理操作。若剧情确实需要，可在正常台词末尾附加一个隐藏标记：改群名用 [群动作:改名:新群名]；邀请角色库中已有角色用 [群动作:邀请:角色名]；移除成员用 [群动作:移除:角色名]。不要向用户解释标记，系统会处理。不要重复邀请已有成员，不要移除最后一名群成员。';
                }
                if (groupSettings.allowPrivateMessages !== false) {
                    systemPrompt += '\n\n[群成员私聊能力]\n你可以偶尔向用户发起私聊，但不要每轮都触发，仅在出现适合单独说的话、想补充秘密或想私下安慰用户时使用。仅允许给自己发私聊：在本轮正常群聊回复末尾另起一行写 [群私聊:你的准确角色ID:私聊内容]。角色ID必须从群成员名单中选择，并且应当是本轮发言者自己的ID；私聊内容控制在1-3句，不要解释标记。标记会保存到你的单聊历史，并在群聊里弹出私聊小窗。每轮最多一条。';
                }
                const activePolls = historyList.filter(function (item) { return item && item.type === 'group_poll' && item.poll && !item.poll.closed; }).slice(-3);
                if (activePolls.length) {
                    systemPrompt += '\n\n[当前群投票]\n' + activePolls.map(function (item) {
                        return '投票ID=' + ensureMid(item) + '；问题：' + String(item.poll.question || '') + '；选项：' + (item.poll.options || []).map(function (option, index) { return (index + 1) + '. ' + option; }).join('；');
                    }).join('\n');
                    systemPrompt += '\n如果你本轮想投票，请在台词末尾附加 [群投票:投票ID:选项序号]，序号从1开始。按你自己的立场选择，不要伪造其他成员的投票。';
                }
                const activeChains = historyList.filter(function (item) { return item && item.type === 'group_chain' && item.chain && !item.chain.closed; }).slice(-3);
                if (activeChains.length) {
                    systemPrompt += '\n\n[当前群接龙]\n' + activeChains.map(function (item) {
                        return '接龙ID=' + ensureMid(item) + '；主题：' + String(item.chain.title || '') + '；已有内容：' + (item.chain.entries || []).map(function (entry) { return String(entry.name || '成员') + '：' + String(entry.text || ''); }).join('；');
                    }).join('\n');
                    systemPrompt += '\n如果你想参与其中一项接龙，请在台词末尾附加 [群接龙:接龙ID:你的接龙内容]，每轮最多参与一次。';
                }
            }
            if (customPrompt && !systemPrompt.includes(customPrompt)) {
                systemPrompt += `\n补充要求: ${customPrompt}`;
            }
            // 说话方式强制约束（每次请求必注入）
            const replyBubbleMode = getActiveReplyBubbleMode();
            const bubbleSplitRule = replyBubbleMode === 'single'
                ? '本轮只输出一条完整消息，不要用空行分隔多个气泡。'
                : (replyBubbleMode === 'multi'
                    ? '本轮必须拆成 2–5 条连续消息，每条用换行分隔（单换行即可），每条简短、只表达一个意思，禁止把一句话拆成碎片。'
                    : (replyBubbleMode === 'legacy'
                        ? '按角色原有的自然聊天节奏分段，不设置固定条数上限；内容简短时保持 1 条，禁止按字数或标点机械拆分。'
