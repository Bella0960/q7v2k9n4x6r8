        <div class="x-modal-overlay" id="xModalOverlay">
            <div class="x-modal-backdrop" id="xModalBackdrop"></div>
            <div class="x-modal">
                <div class="x-modal-header">
                    <span id="xModalTitle">标题</span>
                    <button class="x-modal-close" id="xModalClose" type="button">×</button>
                </div>
                <div class="x-modal-body" id="xModalBody"></div>
            </div>
        </div>

    </div>

    <script src="../../shared/js/memory.js"></script>
    <script src="../../shared/js/sound-system.js"></script>
    <script>
        // ===== 加载壁纸到手机背景（iMessage 透明主题，支持 IndexedDB + 明暗自动切换） =====
        (function loadWallpaper() {
            var store = window.MAOMAOWallpaperStore;
            var mockup = document.querySelector('.phone-mockup');
            if (!mockup) return;

            function applyWallpaper(dataUrl) {
                if (dataUrl) {
                    mockup.style.backgroundImage = 'url("' + dataUrl + '")';
                    mockup.style.backgroundSize = 'cover';
                    mockup.style.backgroundPosition = 'center';
                    mockup.style.backgroundRepeat = 'no-repeat';
                } else {
                    mockup.style.backgroundImage = 'none';
                }
                // 深色壁纸自动调整文字对比度
                if (store && typeof store.applyTone === 'function') {
                    store.applyTone(dataUrl || '');
                }
            }

            if (store && typeof store.get === 'function') {
                store.get().then(function (dataUrl) {
                    applyWallpaper(dataUrl || '');
                }).catch(function () {
                    // 回退到 localStorage
                    try {
                        var wp = localStorage.getItem('home_custom_wallpaper');
                        applyWallpaper(wp || '');
                    } catch (e) {}
                });
            } else {
                // 回退到 localStorage
                try {
                    var wp = localStorage.getItem('home_custom_wallpaper');
                    applyWallpaper(wp || '');
                } catch (e) {}
            }
        })();

        const STORAGE_KEY = 'ai_custom_characters';
        const DEFAULT_ROLES = [];

        function getRoleById(roleId) {
            if (!roleId) return null;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const roles = JSON.parse(raw);
                    if (Array.isArray(roles)) {
                        const target = roles.find(r => String(r.id) === String(roleId));
                        if (target) return target;
                    }
                }
            } catch (e) {
                console.error('获取角色失败:', e);
            }
            return null;
        }

        const params = new URLSearchParams(window.location.search);
        const currentRoleId = params.get('id');
        const isGroupChat = !!currentRoleId && String(currentRoleId).indexOf('g') === 0;

        function loadGroupById(gid) {
            if (!gid) return null;
            try {
                const raw = localStorage.getItem('phone_groups');
                if (raw) {
                    const groups = JSON.parse(raw);
                    if (Array.isArray(groups)) {
                        const target = groups.find(g => String(g.id) === String(gid));
                        if (target) return target;
                    }
                }
            } catch (e) {}
            return null;
        }

        let currentGroup = null;
        if (isGroupChat) {
            currentGroup = loadGroupById(currentRoleId);
        }

        const currentCharacter = isGroupChat
            ? { id: currentRoleId, name: (currentGroup && currentGroup.name) || '群聊', avatar: (currentGroup && (currentGroup.avatar || currentGroup.cover)) || '', avatarBg: '#3B9EFF' }
            : (getRoleById(currentRoleId) || { id: currentRoleId || 'default', name: '聊天', avatarBg: '#3B9EFF' });
        const contactName = currentCharacter.name || '聊天';
        const chatHeaderAvatar = document.getElementById('chat-header-avatar');
        if (chatHeaderAvatar) {
            const headerAvatarSource = String(currentCharacter.avatar || currentCharacter.avatarUrl || '').trim();
            if (headerAvatarSource) {
                const headerAvatarImage = document.createElement('img');
                headerAvatarImage.src = headerAvatarSource;
                headerAvatarImage.alt = '';
                chatHeaderAvatar.replaceChildren(headerAvatarImage);
            } else {
                const headerAvatarInitial = document.createElement('span');
                headerAvatarInitial.textContent = Array.from(contactName)[0] || '聊';
                chatHeaderAvatar.replaceChildren(headerAvatarInitial);
            }
        }

        const chatTitle = document.getElementById('chat-title');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');

        // ================= 双方备注（只读应用：chat_alias_<roleId>） =================
        // 与 chat-settings.html 的 roleId（URL 的 id 参数）保持一致
        const aliasRoleId = currentRoleId || currentCharacter.id;
        function loadAlias() {
            try {
                const raw = localStorage.getItem('chat_alias_' + aliasRoleId);
                if (raw) {
                    const o = JSON.parse(raw);
                    if (o && typeof o === 'object') {
                        return {
                            myAlias: String(o.myAlias == null ? '' : o.myAlias).trim(),
                            roleAlias: String(o.roleAlias == null ? '' : o.roleAlias).trim()
                        };
                    }
                }
            } catch (e) {}
            return { myAlias: '', roleAlias: '' };
        }
        const chatAlias = loadAlias();
        // 群聊：优先显示群备注（chat_group_alias_<gid>），无备注回退群名
        let groupAliasName = '';
        if (isGroupChat) {
            try {
                groupAliasName = localStorage.getItem('chat_group_alias_' + aliasRoleId) || '';
            } catch (e) {}
        }
        const roleDisplayName = (isGroupChat && groupAliasName) ? groupAliasName : (chatAlias.roleAlias || contactName);

        if (chatTitle) {
            chatTitle.textContent = roleDisplayName;
        }
        // 群聊：副标题显示成员名单；普通聊天保持 ONLINE
        const chatStatusSub = document.getElementById('chat-status-sub');
        if (isGroupChat && chatStatusSub) {
            const names = (currentGroup && currentGroup.members || []).map(function (m) { return m.name; }).filter(Boolean);
            chatStatusSub.textContent = names.length ? names.join(' · ') : '群聊';
            // 群聊：显示群公告横条（chat_group_notice_<gid>）
            const chatNoticeBar = document.getElementById('chat-notice-bar');
            if (chatNoticeBar) {
                let notice = '';
                try { notice = localStorage.getItem('chat_group_notice_' + aliasRoleId) || ''; } catch (e) {}
                if (notice) {
                    chatNoticeBar.textContent = '公告：' + notice;
                    chatNoticeBar.style.display = '';
                }
            }
        }

        // ================= 拉黑态（键 chat_blocked_ids：会话仍在列表，但不能聊） =================
        function isBlocked(id) {
            try {
                var arr = JSON.parse(localStorage.getItem('chat_blocked_ids') || '[]');
                if (!Array.isArray(arr)) return false;
                return arr.map(String).indexOf(String(id)) !== -1;
            } catch (e) { return false; }
        }

        function applyBlockUI() {
            var blocked = isBlocked(aliasRoleId);
            var bar = document.getElementById('chat-notice-bar');
            if (bar) {
                if (blocked) {
                    bar.textContent = '你已把 TA 拉黑，TA 不会再回复你（可在对话设置里解除）';
                    bar.style.display = '';
                } else if (!isGroupChat) {
                    bar.style.display = 'none';
                }
            }
            var cap = document.querySelector('.input-capsule');
            if (cap) cap.classList.toggle('is-blocked', blocked);
            if (chatInput) chatInput.disabled = blocked;
        }
        applyBlockUI();

        // ================= 聊天背景 =================
        // 原 applyChatBackground（chat_bg_<roleId> + 72% 白遮罩）已并入 ChatBeauty（shared/js/chat-beauty.js）：
        // 美化配置 chatBg 优先；未配置时自动回落旧 chat_bg_<id> 并保持白遮罩观感，见下方统一应用点。

        const storageKey = `chat_history_${currentCharacter.id}`;

        function getInitialMessages() {
            if (isGroupChat) {
                return [
                    { role: 'received', text: `欢迎来到「${contactName}」群聊，一起聊聊吧。` }
                ];
            }
            return [
                { role: 'received', text: `你好，我是${contactName}！很高兴和你聊天。` }
            ];
        }

        function removeLegacyStickerCaptions(list) {
            if (!Array.isArray(list)) return [];
            var changed = false;
            var cleaned = list.filter(function (m, index) {
                if (!m || (m.role !== 'user' && m.role !== 'sent')) return true;
                var raw = typeof m.text === 'string' ? m.text : (typeof m.content === 'string' ? m.content : '');
                var match = raw.match(/^\[发表情包：([\s\S]*)\]$/);
                if (!match) return true;
                var previous = list[index - 1];
                if (previous && previous.type === 'sticker' && String(previous.desc || '') === match[1]) {
                    changed = true;
                    return false;
                }
                return true;
            });
            // 清理旧版本遗留的独立文字消息，避免刷新后再次显示；表情图片本身保留。
            if (changed) saveMessages(cleaned);
            return cleaned;
        }

        function loadMessages() {
            if (_storage) {
                var arr = _storage.getChatHistory(currentCharacter.id);
                if (arr && arr.length) return removeLegacyStickerCaptions(arr);
            }
            try {
                const raw = localStorage.getItem(storageKey);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return removeLegacyStickerCaptions(parsed);
                    }
                }
            } catch (err) {
                console.warn('读取历史聊天记录失败:', err);
            }

            const initial = getInitialMessages();
            saveMessages(initial);
            return initial;
        }

        function saveMessages(list) {
            if (_storage) { _storage.saveChatHistory(currentCharacter.id, list); return; }
            try {
                localStorage.setItem(storageKey, JSON.stringify(list));
            } catch (err) {
                console.warn('保存聊天记录失败:', err);
            }
        }

        // 头像占位：极细线条 SVG 小人（黑白灰规范，无 Emoji）
        const USER_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';

        // 我的头像：从 myProfile.avatar 实时读取
        function getMyAvatar() {
            try {
                const raw = localStorage.getItem('myProfile');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.avatar) return parsed.avatar;
                }
            } catch (e) {}
            return '';
        }

        // ================= 消息稳定标识：单条操作（复制/转发/翻译/编辑/删除）都依赖 mid =================
        function ensureMid(msg) {
            if (!msg || typeof msg !== 'object') return '';
            // 老数据（含欢迎消息）可能没有 time：补一个，使长按/多选/删除都能正常工作
            if (!msg.time) msg.time = Date.now();
            if (!msg.mid) {
                msg.mid = 'm' + (msg.time || Date.now()) + Math.random().toString(36).slice(2, 5);
            }
            return msg.mid;
        }

        function findByMid(mid) {
            var list = loadMessages();
            for (var i = 0; i < list.length; i++) {
                if (ensureMid(list[i]) === mid) return list[i];
            }
            return null;
        }

        // ================= 礼物拆开动画 =================
        function openGiftUnwrap(msg) {
            var g = msg.gift || {};
            var overlay = document.getElementById('giftUnwrapOverlay');
            if (!overlay) return;
            var box = document.getElementById('gwBox');
            var hint = document.getElementById('gwHint');
            var closeBtn = document.getElementById('gwClose');
            document.getElementById('gwName').textContent = g.name || '礼物';
            document.getElementById('gwTag').textContent = g.tag || '';
            document.getElementById('gwMsg').textContent = g.message ? '“' + g.message + '”' : '';
            overlay.style.setProperty('--gw-color', g.color || '#e74c3c');
            overlay.classList.remove('opened');
            box.classList.remove('opening');
            hint.style.display = '';
            closeBtn.style.display = 'none';
            overlay.classList.add('show');

            // 生成金光粒子
            var scene = document.getElementById('gwScene');
            scene.querySelectorAll('.gw-spark').forEach(function (s) { s.remove(); });
            var angles = [0,45,90,135,180,225,270,315];
            angles.forEach(function (a) {
                var s = document.createElement('span');
                s.className = 'gw-spark';
                var rad = a * Math.PI / 180;
                s.style.setProperty('--dx', Math.cos(rad) * 80 + 'px');
                s.style.setProperty('--dy', Math.sin(rad) * 80 + 'px');
                scene.appendChild(s);
            });

            function doOpen() {
                if (overlay.classList.contains('opened')) return;
                box.classList.add('opening');
                setTimeout(function () {
                    overlay.classList.add('opened');
                    hint.style.display = 'none';
                    closeBtn.style.display = '';
                }, 500);
            }
            box.onclick = doOpen;
            closeBtn.onclick = function () { overlay.classList.remove('show'); };
            overlay.onclick = function (e) {
                if (e.target === overlay && overlay.classList.contains('opened')) {
                    overlay.classList.remove('show');
                }
            };
        }

        // AI 回复清洗（保护 think/narratage 标签不被 cleanup 破坏）
        function cleanupAiReply(raw) {
            // 1) 提取 think 和 narratage 块，替换成占位符
            var THINK_PH = '\u0000THINK_BLOCK\u0000';
            var NARR_PH = '\u0000NARR_BLOCK\u0000';
            var thinks = [];
            var narrations = [];
            var text = String(raw || '');
            var m;
            var thinkRegex = /<think>[\s\S]*?<\/think>/gi;
            while ((m = thinkRegex.exec(text)) !== null) {
                thinks.push(m[0]);
            }
            text = text.replace(thinkRegex, THINK_PH);
            var narrRegex = /<narratage>[\s\S]*?<\/narratage>/gi;
            while ((m = narrRegex.exec(text)) !== null) {
                narrations.push(m[0]);
            }
            text = text.replace(narrRegex, NARR_PH);
            // 2) 对不含标签的安全文本做 cleanup
            text = applyAICleanup(text);
            // 3) 还原占位符
            var idx = 0;
            text = text.replace(new RegExp(THINK_PH.replace(/\u0000/g, '\\u0000'), 'g'), function () {
                return thinks[idx++] || '';
            });
            idx = 0;
            text = text.replace(new RegExp(NARR_PH.replace(/\u0000/g, '\\u0000'), 'g'), function () {
                return narrations[idx++] || '';
            });
            return text;
        }

        // 推理内容只作为内部模型输出处理，永不显示、存储或回灌给下一轮对话。
        function stripInternalReasoning(raw) {
            return String(raw || '')
                .replace(/<think\b[^>]*>[\s\S]*?(?:<\/think\s*>|$)/gi, '')
                .replace(/<\/?think\b[^>]*>/gi, '')
                .replace(/<reasoning\b[^>]*>[\s\S]*?(?:<\/reasoning\s*>|$)/gi, '')
                .replace(/<\/?reasoning\b[^>]*>/gi, '')
                .replace(/<analysis\b[^>]*>[\s\S]*?(?:<\/analysis\s*>|$)/gi, '')
                .replace(/<\/?analysis\b[^>]*>/gi, '');
        }

        // ===== 解析 AI 回复：移除所有内部推理标记，只渲染聊天正文与角色旁白 =====
        function parseReplyContent(raw) {
            var text = stripInternalReasoning(raw);

            var narrRegex = /<narratage>([\s\S]*?)<\/narratage>/gi;
            var narrations = [];
            var m;
            while ((m = narrRegex.exec(text)) !== null) {
                var nc = String(m[1] || '').trim();
                if (nc) narrations.push(nc);
            }
            text = text.replace(/<narratage>[\s\S]*?<\/narratage>/gi, '');

            var segments = text.replace(/\n{3,}/g, '\n\n').split(/\n\n+/);
            var bubbles = [];
            segments.forEach(function (seg) {
                var s = seg.trim();
                if (s) bubbles.push(s);
            });

            return { thinks: [], narrations: narrations, bubbles: bubbles };
        }

        // 渲染旁白块（居中淡化，无气泡）
        function renderNarratageBlock(content) {
            var el = document.createElement('div');
            el.className = 'narratage-block';
            el.textContent = content;
            return el;
        }

        function appendMessageToDOM(msg, idx) {
            const row = document.createElement('div');
            const isSent = msg.role === 'sent' || msg.role === 'user';
            const isError = msg.isError || msg.role === 'system_error';

            row.className = `msg-row ${isSent ? 'sent' : 'received'}`;
            // 搜索页跳转定位用：记录该消息在渲染序列中的序号（实时新发的消息无 idx）
            if (typeof idx === 'number') row.dataset.idx = idx;
            // 多选删除用：消息唯一标识
            row.dataset.time = String(msg.time || '');
            // 单条操作用：稳定标识（不存在时自动补齐）
            row.dataset.mid = ensureMid(msg);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            var attachEl = bubble;

            // 特殊类型消息渲染为卡片，复用同一套气泡与左右对齐
            if ((msg.type === 'image' || msg.type === 'virtual-image') && msg.img) {
                bubble.classList.add('bubble-media');
                bubble.innerHTML = '<img class="msg-media-img" src="' + String(msg.img) + '" alt="">';
            } else if (msg.type === 'image' || msg.type === 'virtual-image') {
                // 虚拟图片：只渲染图片框，不显示任何描述文字
                bubble.classList.add('bubble-media');
                bubble.innerHTML = '<div class="vimg-box">' +
                    '<span class="vimg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></span></div>';
            } else if (msg.type === 'heart') {
                // 心声卡：iOS 备忘录风格卡片（方案 B · 黑白灰）
                bubble.classList.add('bubble-heart');
                var heartText = String(msg.text || '');
                var heartDate = formatHeartTime(msg.time);
                bubble.innerHTML = '' +
                    '<div class="heart-header">' +
                        '<span class="heart-back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>心声</span>' +
                        '<span class="heart-actions">' +
                            '<span class="ico-up">↑</span>' +
                            '<span class="ico-dots">•••</span>' +
                        '</span>' +
                    '</div>' +
                    '<div class="heart-body">' +
                        '<span class="heart-date">' + heartDate + '</span>' +
                        '<span class="heart-title">心声</span>' +
                        '<span class="heart-content">' + heartText + '</span>' +
                    '</div>';
            } else if (msg.type === 'voice') {
                bubble.classList.add('bubble-voice');
                var voiceSecs = Math.max(1, parseInt(msg.duration, 10) || 3);
                var voiceBars = '';
                for (var vb = 0; vb < 16; vb++) {
                    voiceBars += '<i style="height:' + (5 + Math.round(Math.random() * 13)) + 'px"></i>';
                }
                bubble.innerHTML = '<div class="voice-row"><span class="voice-wave" data-bars="1">' + voiceBars + '</span>' +
                    '<span class="voice-dur">' + voiceSecs + '"</span></div>';
                if (msg.text) {
                    var vWrap = document.createElement('div');
                    vWrap.className = 'msg-voice';
                    vWrap.appendChild(bubble);
                    var vDetails = document.createElement('details');
                    vDetails.className = 'voice-transcript-toggle';
                    vDetails.innerHTML = '<summary><span class="vt-closed">转文字</span><span class="vt-open">收起</span></summary>' +
                        '<div class="voice-transcript">' + String(msg.text) + '</div>';
                    vWrap.appendChild(vDetails);
                    attachEl = vWrap;
                }
            } else if (msg.type === 'sticker') {
                // 表情消息只展示图片；desc 保留在数据中供 AI 理解，不渲染为标题/替代文字。
                bubble.classList.add('bubble-sticker');
                var safeImg = String(msg.img || '');
                if (safeImg) {
                    var stickerImg = document.createElement('img');
                    stickerImg.className = 'sticker-msg-img';
                    stickerImg.alt = '';
                    stickerImg.src = safeImg;
                    stickerImg.onerror = function () { this.remove(); };
                    bubble.appendChild(stickerImg);
                }
            } else if (msg.type === 'gift' && msg.gift) {
                // 礼物卡片：竖版浅色系礼物盒图，十字丝带+蝴蝶结，点击全屏拆开
                var g = msg.gift;
                bubble.classList.add('bubble-gift');
                bubble.style.cssText = 'background:transparent !important; box-shadow:none !important; border:none !important; padding:0 !important; border-radius:0 !important;';
                var cardEl = document.createElement('div');
                cardEl.className = 'gift-card';
                if (g.img) cardEl.style.backgroundImage = 'url(' + g.img + ')';
                var blessing = g.message || (g.tag || '');
                var directionLabel = isSent ? '你送出了一份礼物' : '你收到了一份礼物';
                cardEl.innerHTML =
                    '<div class="gift-direction">' + directionLabel + '</div>' +
                    '<div class="gift-blessing">' + String(blessing) + '</div>';
                cardEl.addEventListener('click', function () { openGiftUnwrap(msg); });
                bubble.appendChild(cardEl);
            } else if (msg.type === 'location') {
                const loc = msg.location || {};
                bubble.innerHTML = `<div class="msg-card">
                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span>位置</span>
                    </div>
                    <div class="msg-card-body">${loc.label || '宇宙尽头'}</div>
                </div>`;
            } else if (msg.type === 'anniversary') {
                const a = msg.anniversary || {};
                bubble.innerHTML = `<div class="msg-card">
                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span>${a.name || '纪念日'}</span>
                    </div>
                    <div class="msg-card-body">${a.date || ''}</div>
                    <div class="msg-card-meta">${a.daysText || ''}</div>
                </div>`;
            } else if (msg.type === 'todo') {
                const items = (msg.todo && msg.todo.items) || [];
                const done = items.filter(i => i.done).length;
                bubble.innerHTML = `<div class="msg-card">
                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        <span>共享待办</span>
                    </div>
                    <div class="msg-card-body">${items.slice(0,3).map(i => (i.done ? '· ' : '○ ') + i.text).join('<br>') || '暂无待办'}</div>
                    <div class="msg-card-meta">已完成 ${done} / ${items.length}</div>
                </div>`;
            } else if (msg.type === 'moment') {
                const m = msg.moment || {};
                bubble.innerHTML = `<div class="msg-card">
                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        <span>${m.title || '特别时刻'}</span>
                    </div>
                    <div class="msg-card-body">${m.content || ''}</div>
                    <div class="msg-card-meta">${m.date || ''}</div>
                </div>`;
            } else if (msg.type === 'call') {
                const c = msg.call || {};
                if (c.theme === 'dark') bubble.classList.add('bubble-call-in');
                const cardTitle = c.title || (c.type === 'video' ? '视频通话' : '语音通话');
                bubble.innerHTML = `<div class="msg-card">
                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        <span>${cardTitle}</span>
                    </div>
                    ${c.text ? `<div class="msg-card-body">${c.text}</div>` : ''}
                </div>`;
            } else if (msg.type === 'redpacket') {
                // 红包卡：纯黑底圆角卡 + 白色细线条金币图标（黑白灰极简，无红黄配色）
                bubble.classList.add('bubble-pay');
                const payLabel = msg.isVoice === true ? '语音红包' : '红包';
                const payStatus = msg.status === 'opened' ? '已领取' : '未领取';
                bubble.innerHTML = `<div class="pay-card pay-card-red" data-index="${typeof idx === 'number' ? idx : ''}" data-type="redpacket" onclick="handlePayCardClick(event)">
                    <svg class="pay-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5 12 11.6 14.5 8.5"/><line x1="10.6" y1="12.5" x2="13.4" y2="12.5"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
                    <div class="pay-card-main">
                        <span class="pay-card-label">${payLabel}</span>
                        <span class="pay-card-amount">¥${escHtml(String(msg.amount == null ? '0.00' : msg.amount))}</span>
                        <span class="pay-card-msg">${escHtml(String(msg.message == null ? '' : msg.message))}</span>
                    </div>
                    <div class="pay-card-status">${payStatus}</div>
                </div>`;
            } else if (msg.type === 'transfer') {
                // 转账卡：纯白底 + 浅灰边框 + 黑色细线条双向箭头 + 右侧灰色细箭头
                bubble.classList.add('bubble-pay');
                bubble.innerHTML = `<div class="pay-card pay-card-transfer" data-index="${typeof idx === 'number' ? idx : ''}" data-type="transfer" onclick="handlePayCardClick(event)">
                    <svg class="pay-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    <div class="pay-card-main">
                        <span class="pay-card-label">转账</span>
                        <span class="pay-card-amount">¥${escHtml(String(msg.amount == null ? '0.00' : msg.amount))}</span>
                    </div>
                    <svg class="pay-card-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </div>`;
            } else if (msg.type === 'card' && msg.card) {
                const cd = msg.card;
                const cdAv = cd.avatar && String(cd.avatar).length > 20
                    ? '<img src="' + String(cd.avatar) + '" alt="">'
                    : String(cd.name || '?').slice(0, 1);
                bubble.innerHTML = '<div class="msg-card card-share">' +
                    '<div class="card-avatar">' + cdAv + '</div>' +
                    '<div class="card-info"><div class="card-name">' + String(cd.name || '') + '</div>' +
                    '<div class="card-label">个人名片</div></div>' +
                    '</div>';
            } else {
                var rawText = msg.text || msg.content || '';
                // AI 消息：解析思维链、旁白、双回车多气泡
                var isAiMsg = !isSent && !isError &&
                    (msg.role === 'assistant' || msg.role === 'received');
                var _pendingExtras = []; // 收集 think/narration/extra rows，主 row 之后再 append
                if (isAiMsg && rawText) {
                    var parsed = parseReplyContent(rawText);
                    // 旁白块（居中淡化）
                    parsed.narrations.forEach(function (nc) {
                        _pendingExtras.push(renderNarratageBlock(nc));
                    });
                    if (parsed.bubbles.length > 0) {
                        // 第一个气泡走正常 row 流程（含 avatar / group name / mid / 译文）
                        bubble.textContent = parsed.bubbles[0];
                        // 后续气泡：只保留 bubble + avatar，不带 extra 装饰
                        for (var bi = 1; bi < parsed.bubbles.length; bi++) {
                            var extraRow = document.createElement('div');
                            extraRow.className = 'msg-row received';
                            extraRow.dataset.mid = ensureMid(msg);
                            extraRow.dataset.time = String(msg.time || '');
                            var extraBubble = document.createElement('div');
                            extraBubble.className = 'msg-bubble';
                            extraBubble.textContent = parsed.bubbles[bi];
                            var extraAv = document.createElement('div');
                            extraAv.className = 'msg-avatar';
                            if (currentCharacter.avatar) {
                                extraAv.innerHTML = '<img src="' + currentCharacter.avatar + '" alt="">';
                            } else {
                                extraAv.innerHTML = USER_SVG;
                            }
                            extraRow.appendChild(extraAv);
                            extraRow.appendChild(extraBubble);
                            _pendingExtras.push(extraRow);
                        }
                    } else {
                        // 只有思维链/旁白没正文：直接挂 extras 并 return，主 row 丢弃
                        _pendingExtras.forEach(function (el) { chatMessages.appendChild(el); });
                        return;
                    }
                } else {
                    bubble.textContent = rawText;
                }
            }

            // 译文小字（AI 翻译结果落库后随消息一起渲染）
            if (msg.translation) {
                const trEl = document.createElement('div');
                trEl.className = 'msg-translation';
                trEl.textContent = String(msg.translation);
                bubble.appendChild(trEl);
            }

            if (isError) {
                // 黑白灰规范：系统提示为浅灰底深灰字
                bubble.style.backgroundColor = '#F2F2F7';
                bubble.style.color = '#666666';
            }

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            if (isSent) {
                const myAvatar = getMyAvatar();
                if (myAvatar) {
                    avatar.innerHTML = `<img src="${myAvatar}" alt="">`;
                } else {
                    avatar.innerHTML = USER_SVG;
                }
            } else if (isError) {
                avatar.textContent = '!';
                avatar.style.backgroundColor = '#E5E5EA';
                avatar.style.color = '#666666';
            } else {
                if (currentCharacter.avatar) {
                    avatar.innerHTML = `<img src="${currentCharacter.avatar}" alt="">`;
                } else {
                    avatar.innerHTML = USER_SVG;
                }
            }

            // 群聊：AI 成员回复在气泡上方显示成员名
            if (isGroupChat && !isSent && !isError && msg.name) {
                const nameTag = document.createElement('div');
                nameTag.className = 'msg-sender';
                nameTag.textContent = msg.name;
                row.appendChild(nameTag);
            }

            if (isSent) {
                row.appendChild(attachEl);
                row.appendChild(avatar);
            } else {
                row.appendChild(avatar);
                row.appendChild(attachEl);
            }

            chatMessages.appendChild(row);
            // AI 消息的思维链块/旁白块/额外气泡：主 row 之后追加，保证正确渲染顺序
            if (typeof _pendingExtras !== 'undefined') {
                _pendingExtras.forEach(function (el) { chatMessages.appendChild(el); });
            }
        }

        function renderAllMessages() {
            chatMessages.innerHTML = `<div class="message-time">Just now</div>`;
            const list = loadMessages();
            // 老数据补齐稳定 id 与时间戳：只新增字段，不迁移、不改变原有结构
            let midAdded = false;
            let reasoningRemoved = false;
            list.forEach(function (m) {
                if (!m) return;
                if (m.role === 'assistant' || m.role === 'received') {
                    var field = typeof m.text === 'string' ? 'text' : (typeof m.content === 'string' ? 'content' : '');
                    if (field) {
                        var originalText = m[field];
                        var visibleText = stripInternalReasoning(originalText);
                        if (visibleText !== originalText) {
                            m[field] = visibleText;
                            reasoningRemoved = true;
                        }
                    }
                }
                if (!m.mid || !m.time) { ensureMid(m); midAdded = true; }
            });
            if (midAdded || reasoningRemoved) saveMessages(list);
            // 清理历史残留：此前真实定位调用产生的超时/失败错误消息，一次性从记录中移除
            const cleaned = list.filter(m => {
                const t = String((m && (m.text || m.content)) || '');
                return !(t.indexOf('定位失败') !== -1 || t.indexOf('Timeout expired') !== -1);
            });
            if (cleaned.length !== list.length) saveMessages(cleaned);
            // 线上/线下界面隔离：赴约剧情消息（mode:'date'）与静默指令消息（silent:true，
            // 如送礼物后的 AI 提示词）不进气泡流；数据本身保留全量供 AI 上下文使用。
            const visibleList = cleaned.filter(m => !(m && (m.mode === 'date' || m.silent)));
            visibleList.forEach(function (m, i) { appendMessageToDOM(m, i); });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ================= 搜索页跳转定位：读取 URL 的 hl=<序号>，滚动并闪烁提示 =================
        function highlightMessageFromUrl() {
            const hl = parseInt(new URLSearchParams(window.location.search).get('hl'), 10);
            if (isNaN(hl) || hl < 0) return;
            const target = chatMessages.querySelector('.msg-row[data-idx="' + hl + '"] .msg-bubble');
            if (!target) return;
            // 等渲染布局完成后滚动到视口中部
            setTimeout(function () {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.classList.add('hl-flash');
                setTimeout(function () { target.classList.remove('hl-flash'); }, 1900);
            }, 120);
            // 消费后清掉定位参数，避免刷新重复闪烁
            try {
                const url = new URL(window.location.href);
                url.searchParams.delete('hl');
                window.history.replaceState(null, '', url.toString());
            } catch (e) {}
        }

        // ================= 读取 API 配置（纯 localStorage，不再编辑） =================
        const API_STORAGE_KEY = 'api_settings';

        function getAiConfig() {
            try {
                const raw = localStorage.getItem(API_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed) return parsed;
                }
            } catch (e) {}
            return {};
        }

        function sendMessage() {
            sendMsg();
        }

        // ---- AI 主动通话标记：从回复文本中剥离 [发起语音通话] ----
        const VOICE_CALL_MARKER = '[发起语音通话]';
        function extractVoiceCallMarker(raw) {
            const text = String(raw || '');
            const idx = text.indexOf(VOICE_CALL_MARKER);
            if (idx === -1) return { text: text, wantCall: false };
            // 移除标记，并清理遗留的行尾空白与多余空行
            const cleaned = (text.slice(0, idx) + text.slice(idx + VOICE_CALL_MARKER.length))
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, wantCall: true };
        }
        // 命中标记：在 AI 侧（左侧）插入一张黑底白字「发起语音通话」卡，并写入聊天记录
        // historyList 是 sendMsg 内的局部变量，由调用方传入
        function insertIncomingCallCard(historyList) {
            const cardMsg = {
                role: 'assistant', type: 'call',
                call: { type: 'voice', title: '发起语音通话', text: '', theme: 'dark' },
                time: Date.now()
            };
            historyList.push(cardMsg);
            saveMessages(historyList);
            appendMessageToDOM(cardMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        // 自动来电：仅当该角色独立开关 chat_auto_call_<roleId> 为 'true' 时，延迟 1.5s 进入来电页
        // 关闭（false/null/脏值）时只保留卡片，绝不跳转
        function maybeAutoIncomingCall() {
            let enabled = false;
            try {
                enabled = localStorage.getItem('chat_auto_call_' + aliasRoleId) === 'true';
            } catch (e) { enabled = false; }
            if (!enabled) return;
            setTimeout(function () {
                window.location.href = '../call/call-ui.html?roleId=' + encodeURIComponent(aliasRoleId) + '&type=incoming';
            }, 1500);
        }

        // ---- AI 虚拟图片标记：从回复文本中剥离 [图片:描述]（前端渲染灰底占位图，不接受任何图片链接/代码） ----
        const VIMG_MARKER_REGEX = /\[图片[:：]([^\]]{1,80})\]/g;
        function extractVImageMarkers(raw) {
            const text = String(raw || '');
            const images = [];
            let m;
            VIMG_MARKER_REGEX.lastIndex = 0;
            while ((m = VIMG_MARKER_REGEX.exec(text)) !== null) {
                const desc = String(m[1] || '').trim();
                if (desc) images.push(desc);
            }
            const cleaned = text.replace(VIMG_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, images: images };
        }

        // ---- AI 心声标记：从回复文本中剥离 [心声:内容]（前端渲染浅灰心声卡，与正常台词区分） ----
        const HEART_MARKER_REGEX = /\[心声[:：]([^\]]{1,200})\]/g;
        function extractHeartMarkers(raw) {
            const text = String(raw || '');
            const hearts = [];
            let m;
            HEART_MARKER_REGEX.lastIndex = 0;
            while ((m = HEART_MARKER_REGEX.exec(text)) !== null) {
                const say = String(m[1] || '').trim();
                if (say) hearts.push(say);
            }
            const cleaned = text.replace(HEART_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, hearts: hearts };
        }

        // 虚拟图片落库：role=assistant + type=image（无 img 走占位图渲染），text 让 AI 后续也能"记得"发过图
        function insertVImageCards(historyList, descs) {
            (descs || []).forEach(function (d) {
                const card = { role: 'assistant', type: 'image', desc: d, text: '[图片] ' + d, time: Date.now() };
                historyList.push(card);
                saveMessages(historyList);
                appendMessageToDOM(card);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 心声卡日期格式化：2026年6月28日 14:30（iOS 备忘录风格）
        function formatHeartTime(ts) {
            var d = new Date(ts || Date.now());
            var y = d.getFullYear();
            var mo = d.getMonth() + 1;
            var da = d.getDate();
            var hh = d.getHours();
            var mm = d.getMinutes();
            return y + '年' + mo + '月' + da + '日 ' + (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
        }

        // 心声落库：role=assistant + type=heart（text 即心声内容，会进入 AI 上下文）
        function insertHeartCards(historyList, texts) {
            (texts || []).forEach(function (t) {
                // 心声不再自动弹到聊天流里，存到 localStorage 供点头像查看
                try {
                    var key = 'latest_heart_' + currentRoleId;
                    localStorage.setItem(key, t);
                } catch (e) {}
            });
        }

        // ---- AI 主动赠送标记：从回复文本中剥离 [红包:金额:留言] / [转账:金额:留言] ----
        const PAY_MARKER_REGEX = /\[(红包|转账):(\d+(?:\.\d{1,2})?):([^\]]*)\]/g;
        function extractPayMarkers(raw) {
            const text = String(raw || '');
            const items = [];
            let m;
            PAY_MARKER_REGEX.lastIndex = 0;
            while ((m = PAY_MARKER_REGEX.exec(text)) !== null) {
                const type = m[1] === '转账' ? 'transfer' : 'redpacket';
                const amountNum = Number(m[2]);
                if (isFinite(amountNum) && amountNum > 0) {
                    items.push({
                        type: type,
                        amount: amountNum.toFixed(2),
                        message: m[3] ? m[3].trim() : (type === 'redpacket' ? '恭喜发财，大吉大利' : '')
                    });
                }
            }
            const cleaned = text.replace(PAY_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, items: items };
        }
        // ---- 自动记忆标记：[记住:xxx] 从 AI 回复中剥离，存进 user_memory ----
        const MEM_MARKER_REGEX = /\[记住:([^\]]+)\]/g;
        function extractMemoryMarkers(raw) {
            const text = String(raw || '');
            const memories = [];
            let m;
            MEM_MARKER_REGEX.lastIndex = 0;
            while ((m = MEM_MARKER_REGEX.exec(text)) !== null) {
                const content = m[1] && m[1].trim();
                if (content) memories.push(content);
            }
            const cleaned = text.replace(MEM_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, memories: memories };
        }
        function saveUserMemories(memories) {
            if (!memories || !memories.length) return;
            const roleMemoryId = String(aliasRoleId || currentRoleId || '');
            if (window.MemoryRecall && roleMemoryId) {
                memories.forEach(function(content) {
                    window.MemoryRecall.upsertMemory(roleMemoryId, {
                        content: String(content || '').trim(),
                        category: 'detail',
                        importance: 3,
                        status: 'confirmed',
                        source: 'ai-marker'
                    });
                });
                return;
            }
            // Fallback for an older browser build: keep the memory role-scoped.
            try {
                const list = JSON.parse(localStorage.getItem('user_memory') || '[]');
                const now = Date.now();
                memories.forEach(function(content) {
                    content = String(content || '').trim();
                    if (!content) return;
                    const key = content.toLowerCase().replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '');
                    const existing = list.find(function(item) {
                        const oldText = String(item && (item.text || item.content) || '')
                            .toLowerCase().replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '');
                        return oldText && oldText === key && String(item.sourceRoleId || '') === roleMemoryId;
                    });
                    if (existing) {
                        existing.reinforcementCount = Math.max(1, Number(existing.reinforcementCount) || 1) + 1;
                        existing.lastReinforcedAt = now;
                        existing.time = now;
                        existing.updatedAt = now;
                    } else {
                        list.push({
                            id: 'user_mem_' + now.toString(36) + '_' + list.length.toString(36),
                            text: content.slice(0, 240), time: now, createdAt: now,
                            lastReinforcedAt: now, reinforcementCount: 1, sourceRoleId: roleMemoryId
                        });
                    }
                });
                while (list.length > 200) list.shift();
                localStorage.setItem('user_memory', JSON.stringify(list));
            } catch(e) {}
        }
        // 命中红包/转账标记：在 AI 侧插入对应卡片并落库，role='assistant' 可被用户领取
        function insertPayCards(historyList, items) {
            if (!items || !items.length) return;
            items.forEach(function (item) {
                const payMsg = {
                    role: 'assistant',
                    type: item.type,
                    amount: item.amount,
                    message: item.message,
                    status: 'unopened',
                    timestamp: Date.now()
                };
                historyList.push(payMsg);
                // ===== 互通：红包/转账自动写进记账本（用户收入） =====
                try {
                    const fin = JSON.parse(localStorage.getItem('finance_records') || '[]');
                    fin.push({
                        amount: Number(item.amount),
                        type: '收入',
                        category: item.type === 'transfer' ? '转账' : '红包',
                        note: (currentCharacter ? currentCharacter.name : '角色') + (item.type === 'transfer' ? ' 转账给我' : ' 发的红包'),
                        time: Date.now()
                    });
                    localStorage.setItem('finance_records', JSON.stringify(fin));
                } catch (e) {}
            });
            saveMessages(historyList);
            renderAllMessages();
        }

        // ===== AI 回复清洗：只做标点/空白收口，不删任何正文内容 =====
        // 之前按文字内容删的规则（动作描写/烂俗比喻/爹味/AI 废话）已全部撤回
        // 只保留：多空格压缩、行首行尾空白、连续标点合并、句首句尾残迹清理
        function applyAICleanup(text) {
            if (!text) return text;
            var out = String(text);
            // 1) 空白整理
            out = out.replace(/[ \t]+\n/g, '\n')
                     .replace(/\n[ \t]+/g, '\n')
                     .replace(/[ \t]{2,}/g, ' ')
                     .trim();
            // 2) 连续句号/问号/感叹号/逗号压成一个
            out = out.replace(/([。！？])\1+/g, '$1')
                     .replace(/，{2,}/g, '，');
            // 3) 逗号紧跟句末标点 / 句末标点紧跟逗号 → 去掉多余的逗号
            out = out.replace(/，([。！？])/g, '$1')
                     .replace(/([。！？])，/g, '$1');
            // 4) 句首句尾残留标点（只清逗号/句号/顿号，保留 ？！…）
            out = out.replace(/^[ \t，。、]+/, '')
                     .replace(/[ \t，、]+$/, '')
                     .trim();
            // 5) 用户在设置页自定义的规则（enabled:true 才跑）——保留入口，但不再硬编码删内容
            try {
                var userRules = JSON.parse(localStorage.getItem('regex_rules') || '[]');
                if (Array.isArray(userRules)) {
                    userRules.forEach(function (r) {
                        if (!r || !r.enabled || !r.pattern) return;
                        try { out = out.replace(new RegExp(r.pattern, 'g'), r.replacement || ''); } catch (e) {}
                    });
                }
            } catch (e) {}
            // 5b) 用户规则删完内容后可能留下 "。，。，" 这种句子边界标点残迹
            // 只清理：连续重复标点、逗号紧跟句号/句号紧跟逗号的组合；正常内部逗号不动
            out = out.replace(/([。！？])\1+/g, '$1')          // 。。。 → 。
                     .replace(/，{2,}/g, '，')                 // ，，， → ，
                     .replace(/，([。！？])/g, '$1')           // ，。 → 。
                     .replace(/([。！？])，/g, '$1')           // 。， → 。
                     .replace(/([。！？])([。！？])+/g, '$1');  // 。？。？ → 第一个
            // 6) 末尾如果是中文且无标点，补一个句号
            if (out && /[\u4e00-\u9fa5]$/.test(out)) {
                out += '。';
            }
            // 7) 兜底：末尾连续标点只留一个
            out = out.replace(/([。！？])\1+$/, '$1');
            return out;
        }


        // API 调用记录 — 委托 PhoneStorage
        var _storage = window.PhoneStorage;
        function logApiCall(model, status, startTime, errorMsg) {
            if (_storage) {
                _storage.pushApiLog({
                    model: model || 'unknown',
                    status: status,
                    errorMsg: (status === 'error' && errorMsg) ? String(errorMsg).slice(0, 200) : ''
                });
                return;
            }
            try {
                const logs = JSON.parse(localStorage.getItem('api_call_logs') || '[]');
                const entry = {
                    id: Date.now().toString(36),
                    time: Date.now(),
                    model: model || 'unknown',
                    status: status,
                    duration: Date.now() - startTime,
                    errorMsg: (status === 'error' && errorMsg) ? String(errorMsg).slice(0, 200) : ''
                };
                logs.unshift(entry);
                while (logs.length > 50) logs.pop();
                localStorage.setItem('api_call_logs', JSON.stringify(logs));
            } catch (e) { /* 日志失败不影响主流程 */ }
        }

        // ====== 权重分层记忆系统 ======
        // 半衰期（天）：key=关键事件/anniversary=纪念日约1年，plot=线上剧情约3周，detail=生活细节/preference=互动偏好约2个月
        const MEM_HALF_LIFE = { key: 365, anniversary: 365, plot: 21, detail: 60, preference: 60 };
        const MEM_CAT_BASE = { key: 1.0, anniversary: 1.0, plot: 0.45, detail: 0.7, preference: 0.7 };

        function loadWeightMemories(roleId) {
            if (_storage) return _storage.getMemories(roleId);
            try {
                const raw = localStorage.getItem('chat_memories_' + roleId);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) { return []; }
        }
        function saveWeightMemories(roleId, arr) {
            arr = trimMemoriesByWeight(arr, 300);   // M1：存储上限 300 条，按权重淘汰尾部
            if (_storage) { _storage.saveMemories(roleId, arr); return; }
            try { localStorage.setItem('chat_memories_' + roleId, JSON.stringify(arr)); } catch (e) {}
        }
        function memoryWeight(m) {
            const anchor = m.lastReinforcedAt || m.createdAt || Date.now();
            const days = Math.max(0, (Date.now() - anchor) / 86400000);
            const half = MEM_HALF_LIFE[m.category] || 60;
            const base = MEM_CAT_BASE[m.category] || 0.6;
            let imp = Number(m.importance);
            if (isNaN(imp)) imp = 3;
            imp = Math.max(1, Math.min(5, imp)) / 5;
            const repeats = Math.max(1, Number(m.reinforcementCount) || 1);
            const reinforcementBoost = Math.min(1.45, 1 + (repeats - 1) * 0.08);
            return imp * base * Math.pow(2, -days / half) * reinforcementBoost;
        }
        // M1：记忆存储上限 —— 超过 max 条时按权重淘汰最不重要的；fixed（钉住）永不淘汰
        function trimMemoriesByWeight(arr, max) {
            arr = (Array.isArray(arr) ? arr : []).filter(Boolean);
            if (arr.length <= max) return arr;
            var pinned = arr.filter(function (m) { return m.status === 'fixed'; });
            var rest = arr.filter(function (m) { return m.status !== 'fixed'; });
            var budget = Math.max(0, max - pinned.length);
            rest = rest.map(function (m) { return { m: m, w: memoryWeight(m) }; })
                .sort(function (a, b) { return b.w - a.w; })
                .slice(0, budget)
                .map(function (x) { return x.m; });
            return pinned.concat(rest);
        }
        // 构造注入文本：fixed 永远钉住注入 / confirmed 按权重分两层 / pending 不注入
        function buildWeightedMemoryText(roleId, fallbackText) {
            const mems = loadWeightMemories(roleId);
            const oldText = (fallbackText || '').trim();
            const oldValid = oldText && oldText !== '暂无记忆';
            if (!mems.length) return oldValid ? oldText : '暂无记忆';
            const fixed = mems.filter(function (m) { return m.status === 'fixed'; });
            const confirmed = mems.filter(function (m) { return !m.status || m.status === 'confirmed'; });
            const lines = [];
            if (fixed.length) {
                lines.push('【你一直记得的事】（钉住的记忆，绝对不会忘，可自然提及）');
                fixed.forEach(function (m) { lines.push('· ' + m.content); });
            }
            const weighted = confirmed.map(function (m) {
                return { content: m.content, weight: memoryWeight(m) };
            }).filter(function (m) { return m.content && m.weight > 0.12; });
            weighted.sort(function (a, b) { return b.weight - a.weight; });
            const clear = weighted.filter(function (m) { return m.weight >= 0.5; });
            const vague = weighted.filter(function (m) { return m.weight < 0.5; });
            if (clear.length) {
                lines.push('【你清晰记得的事】（可以自然地提及）');
                clear.forEach(function (m) { lines.push('· ' + m.content); });
            }
            if (vague.length) {
                lines.push('【你隐约记得的事】（只有当对方主动提起相关话题时，你才回忆起来；平时不要主动提起）');
                vague.forEach(function (m) { lines.push('· ' + m.content); });
            }
            if (oldValid) lines.push('【过往长期记忆】' + oldText);
            return lines.length ? lines.join('\n') : '暂无记忆';
        }

        // ================= R6：HTTP 状态码 → 友好提示（原始细节进 api-logs 供排查） =================
        var friendlyHttpError = window.friendlyHttpError = function (status, detail) {
            var map = {
                400: '请求格式有误（可能是参数错误或上下文超长）',
                401: 'API Key 错误或已失效，请到【设置 → API 设置】检查',
                403: '没有访问权限（Key 被禁用或无此模型权限）',
                404: 'API 地址或模型名不存在，请检查 Base URL 与模型设置',
                413: '请求内容过长，请精简人设/世界书或减少记忆条数',
                429: '请求太频繁或额度已用尽，请稍后再试',
                500: '服务器繁忙，请稍后再试',
                502: '服务器繁忙（网关错误），请稍后再试',
                503: '服务暂不可用（可能过载或维护），请稍后再试',
                504: '服务器响应超时，请稍后再试'
            };
            var tip = map[status] || ('请求失败（HTTP ' + status + '）');
            detail = String(detail || '').trim();
            return detail ? (tip + '｜' + detail.slice(0, 120)) : tip;
        };

        // ================= 非流式单次 AI 调用（翻译等短任务复用，含 15 秒超时与埋点） =================
        async function callAiNonStream(systemPrompt, userPrompt) {
            const cfg = getAiConfig();
            const apiKey = (cfg.apiKey || '').trim();
            const baseUrl = (cfg.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
            const apiModel = (cfg.model || 'gpt-3.5-turbo').trim();
            if (!apiKey) {
                if (typeof showToast === 'function') showToast('请先到【设置页 → API 设置】配置 API Key');
                return null;
            }
            const start = Date.now();
            const controller = new AbortController();
            const timeoutId = setTimeout(function () { controller.abort(); }, 15000);
            try {
                const resp = await fetch(baseUrl + '/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: apiModel,
                        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                        temperature: 0.3,
                        stream: false
                    })
                });
                clearTimeout(timeoutId);
                if (!resp.ok) {
                    let raw = '';
                    try { raw = await resp.text(); } catch (e) {}
                    let detail = raw;
                    try { detail = (JSON.parse(raw).error && JSON.parse(raw).error.message) || raw; } catch (e) {}
                    logApiCall(apiModel, 'error', start, friendlyHttpError(resp.status, detail));
                    return null;
                }
                const data = await resp.json();
                let out = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
                out = String(out || '').trim();
                if (!out) { logApiCall(apiModel, 'error', start, '空响应'); return null; }
                logApiCall(apiModel, 'success', start, '');
                return out;
            } catch (e) {
                clearTimeout(timeoutId);
                const em = (e && e.name === 'AbortError') ? '请求超时（15秒）' : ('连接失败：' + ((e && e.message) || ''));
                logApiCall(apiModel, 'error', start, em);
                return null;
            }
        }

        // ================= AI 翻译：结果写入 msg.translation 落库并就地追加小字 =================
        const TRANSLATE_SYSTEM = '[任务]\n你是翻译引擎，只做翻译，不做其他任何事。\n' +
            '[规则]\n' +
            '1. 原文是中文就翻译成英文；原文不是中文就翻译成简体中文。\n' +
            '2. 只输出译文本身，禁止输出解释、引号、“译文：”之类的前缀，禁止保留原文。\n' +
            '3. 保留原文语气与口语感，句子短、自然。\n' +
            '4. 人名、地名不翻译。\n' +
            '5. 长度与原文相当，不要扩写。';

        async function translateMessage(mid) {
            const msg = findByMid(mid);
            if (!msg) return;
            const src = String((msg.text || msg.content) || '').trim();
            if (!src) {
                if (typeof showToast === 'function') showToast('这条消息没有可翻译的文字');
                return;
            }
            var cfgNow = getAiConfig();
            if (!(cfgNow.apiKey || '').trim()) {
                if (typeof showToast === 'function') showToast('请先到【设置页 → API 设置】配置 API Key');
                return;
            }
            if (typeof showToast === 'function') showToast('正在翻译...');
            const out = await callAiNonStream(TRANSLATE_SYSTEM, '请翻译以下内容：\n' + src);
            if (!out) {
                if (typeof showToast === 'function') showToast('翻译失败，请检查网络或 API 设置');
                return;
            }
            const list = loadMessages();
            for (let i = 0; i < list.length; i++) {
                if (ensureMid(list[i]) === mid) {
                    list[i].translation = out;
                    list[i].translationAt = Date.now();
                    break;
                }
            }
            saveMessages(list);
            const row = chatMessages.querySelector('.msg-row[data-mid="' + mid + '"]');
            const bubbleEl = row ? row.querySelector('.msg-bubble') : null;
            if (bubbleEl) {
                const old = bubbleEl.querySelector('.msg-translation');
                if (old) old.remove();
                const tr = document.createElement('div');
                tr.className = 'msg-translation';
                tr.textContent = out;
                bubbleEl.appendChild(tr);
            } else {
                renderAllMessages();
            }
            if (typeof showToast === 'function') showToast('已翻译');
        }

        // R3 防重入锁：AI 回复期间（含流式）忽略重复发送，防止并发请求交错写坏聊天记录
        let aiSending = false;

        // 3. 核心真实 AI 聊天发送逻辑 (含历史记录、人设构造与 15 秒超时控制)
        async function sendMsg(opts) {
            const input = document.getElementById('chat-input');
            const customText = (opts && typeof opts.text === 'string') ? opts.text.trim() : '';
            const silent = !!(opts && opts.silent);
            const contextOnly = !!(opts && opts.contextOnly);
            const regenDirection = (opts && typeof opts.regenDirection === 'string') ? opts.regenDirection.trim() : '';
            const isRegen = !!(opts && opts.isRegenerate);
            const text = customText || input.value.trim();
            if (!text && !isRegen && !contextOnly) return;
            if (isBlocked(aliasRoleId)) {
                if (typeof showToast === 'function') showToast('你已把 TA 拉黑，无法发送消息');
                return;
            }
            if (aiSending) {
                if (typeof showToast === 'function') showToast('TA 正在回复中，稍等一下');
                return;
            }

            const config = getAiConfig();
            const apiKey = (config.apiKey || '').trim();
            let baseUrl = (config.baseUrl || 'https://api.openai.com/v1').trim();
            const apiModel = (config.model || 'gpt-3.5-turbo').trim();
            const customPrompt = (config.prompt || '').trim();

            if (!apiKey) {
                const errMsg = { role: 'system_error', isError: true, text: '请先到【设置页 → API 设置】配置 API Key', time: Date.now() };
                const historyList = loadMessages();
                historyList.push(errMsg);
                saveMessages(historyList);
                appendMessageToDOM(errMsg);
                return;
            }

            baseUrl = baseUrl.replace(/\/+$/, '');

            // 重玩模式：不新增用户消息，直接基于现有历史重新请求
            let historyList = loadMessages();
            if (!isRegen) {
                if (!contextOnly) {
                    const userMsg = { role: 'user', text: text, time: Date.now(), silent: !!silent };
                    historyList.push(userMsg);
                    saveMessages(historyList);
                    if (!silent) {
                        appendMessageToDOM(userMsg);
                        input.value = '';
                        input.style.height = 'auto';
                        updateSendBtnState();
                        if (typeof SoundSystem !== 'undefined') SoundSystem.play('send');
                    }
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // contextOnly 只发起 AI 回合，不创建普通用户文字消息。
            } else {
                historyList = loadMessages();
            }

            // ===== R2 字符预算：上下文各段落设上限，超长静默截断降级（防 400 context_length_exceeded） =====
            // 阈值按中文 ≈0.6~1 token/字 估算；最坏组合 ~30k 字，适配主流 32k+ 上下文模型。要调就改这里。
            var CTX_CAP = {
                persona: 5000,      // 人设（在设定区与身份锁中各引用一次，实际占 2 份）
                memory: 3000,       // 分层长期记忆
                userMemory: 2000,   // [记住:...] 用户侧记忆
                worldbook: 8000,    // 世界书全量
                rpProtocol: 6000,   // RP 协议原文
                rpComposed: 16000   // 协议变量替换后的整段（协议 + 人设 + 世界书展开）
            };
            function capText(str, max) {
                str = String(str || '');
                if (str.length <= max) return str;
                // 避免把代理对（emoji 等）从中间切开
                if (max > 0) {
                    var code = str.charCodeAt(max - 1);
                    if (code >= 0xD800 && code <= 0xDBFF) max -= 1;
                }
                return str.slice(0, max) + '\n…（内容过长，已自动截断）';
            }

            // 组装超级 System Prompt（角色设定 + 用户信息 + 长期记忆 + 回复要求）
            // 群聊：合并全部成员人设，并随机选定本轮回复成员
            let rolePersona;
            let groupReplyPick = null;
            if (isGroupChat && currentGroup) {
                const members = currentGroup.members || [];
                const personaLines = members.map(function (m, i) {
                    const r = getRoleById(m.id);
                    const p = (r && (r.persona || r.prompt || '').trim()) || '一个善解人意的朋友';
                    return (i + 1) + '. ' + (m.name || '成员') + '：' + p;
                });
                rolePersona = '你是群聊「' + currentGroup.name + '」中的成员之一，成员名单如下：\n' + (personaLines.join('\n') || '暂无成员');
                if (members.length) {
                    groupReplyPick = members[Math.floor(Math.random() * members.length)];
                }
            } else {
                rolePersona = (currentCharacter.persona || currentCharacter.prompt || '').trim()
                    || '你是一个善解人意、回复自然的AI助手。';
            }
            rolePersona = capText(rolePersona, CTX_CAP.persona);

            // 用户资料（myProfile 里可能有：nickname/age/hobbies/likes/dislikes/about/sign）
            let myProfile = {};
            try {
                const rawProfile = localStorage.getItem('myProfile');
                if (rawProfile) myProfile = JSON.parse(rawProfile) || {};
            } catch (e) {}
            const userName = (myProfile.nickname || '').trim() || '未知';
            // 把用户人设拆成结构化字段，拼给 AI
            const userFacts = [];
            if (myProfile.age) userFacts.push('年龄：' + myProfile.age + '岁');
            if (myProfile.hobbies) userFacts.push('爱好：' + myProfile.hobbies);
            if (myProfile.likes) userFacts.push('喜欢：' + myProfile.likes);
            if (myProfile.dislikes) userFacts.push('讨厌：' + myProfile.dislikes);
            if (myProfile.about || myProfile.sign) userFacts.push('简介：' + (myProfile.about || myProfile.sign));
            const userPersona = userFacts.length ? userFacts.join('\n') : '无';

            // ===== 用户动态记忆：聊天中 AI 自动记住的关于用户的事 =====
            let userMemoryText = '（暂无）';
            try {
                const um = JSON.parse(localStorage.getItem('user_memory') || '[]');
                if (Array.isArray(um) && um.length) {
                    // User facts saved by older builds may be global; new extracted memories are stored
                    // in chat_memories_<roleId>. Keep scoped legacy entries with their own character.
                    const roleScoped = um.filter(function(m) {
                        return !m.sourceRoleId || String(m.sourceRoleId) === String(aliasRoleId || currentRoleId || '');
                    });
                    userMemoryText = roleScoped.slice(-30).map(function(m){ return '· ' + (m.text || m.content || ''); }).join('\n');
                }
            } catch(e) {}
            userMemoryText = capText(userMemoryText, CTX_CAP.userMemory);

            // 长期记忆：权重分层（清晰记得/隐约记得），兼容原文本记忆
            const roleMemory = capText(buildWeightedMemoryText(
                typeof aliasRoleId !== 'undefined' ? aliasRoleId : roleId,
                (currentCharacter.memory || '').trim()
            ) || '暂无记忆', CTX_CAP.memory);

            // 实时状态（记忆空间子系统：当前心情 + 今日事件）
            const memoryContext = (typeof memorySystem !== 'undefined')
                ? memorySystem.getAIContext() : '暂无实时状态';

            // ===== 角色扮演协议：优先角色键 chat_rp_protocol_<roleId>，兜底全局键 chat_rp_protocol_ =====
            let rpProtocol = '';
            try {
                rpProtocol = localStorage.getItem('chat_rp_protocol_' + aliasRoleId)
                          || localStorage.getItem('chat_rp_protocol_')
                          || '';
            } catch (e) {}
            rpProtocol = capText(rpProtocol.trim(), CTX_CAP.rpProtocol);

            // 世界书内容：从 phone_worldbooks 读全部条目，拼成文本
            let worldbookText = '';
            try {
              const rawWB = localStorage.getItem('phone_worldbooks');
              if (rawWB) {
                const wbList = JSON.parse(rawWB) || [];
                worldbookText = wbList.map(function(b){
                  return '【' + (b.title || '未命名') + '】\n' + (b.content || '');
                }).join('\n\n');
              }
            } catch(e) { worldbookText = ''; }
            worldbookText = capText(worldbookText, CTX_CAP.worldbook);

            // 协议变量替换：{{char}} {{user}} {{persona}} {{memory}} {{worldbook}}
            function applyProtocolVars(text) {
                return String(text || '')
                    .replace(/\{\{char\}\}/g, currentCharacter.name || '角色')
                    .replace(/\{\{user\}\}/g, userName)
                    .replace(/\{\{persona\}\}/g, rolePersona)
                    .replace(/\{\{memory\}\}/g, roleMemory)
                    .replace(/\{\{worldbook\}\}/g, worldbookText || '暂无世界书');
            }

            let systemPrompt;
            if (rpProtocol) {
                // 协议存在：替换变量后置于 System Prompt 最顶端（最高优先级，覆盖底层默认规则）
                systemPrompt = capText(applyProtocolVars(rpProtocol), CTX_CAP.rpComposed);
            } else {
