            if (!overlay || !grid || !openBtn) return;

            if (roleId) {
                if (roleTab) roleTab.textContent = (contactName || 'TA') + '的表情';
                if (scopeLabel) scopeLabel.textContent = (contactName || '当前角色') + '的收藏只在本角色聊天中使用';
            } else {
                if (roleTab) roleTab.style.display = 'none';
                if (scopeLabel) scopeLabel.textContent = '从现有表情库中选择';
                activeView = 'all';
            }

            function getAvailableStickers() {
                try {
                    var libs = JSON.parse(localStorage.getItem('sticker_libraries') || '[]');
                    if (!Array.isArray(libs)) return [];
                    var out = [];
                    libs.forEach(function (lib) {
                        if (!lib || !Array.isArray(lib.stickers)) return;
                        lib.stickers.forEach(function (sticker) {
                            if (!sticker || !sticker.img) return;
                            out.push({
                                sticker: sticker,
                                key: roleLibrary ? roleLibrary.stickerKey(lib.id, sticker.id) : '',
                                libraryName: String(lib.name || '')
                            });
                        });
                    });
                    return out;
                } catch (error) {
                    return [];
                }
            }

            function setEmpty(message, actionLabel, action) {
                var empty = document.createElement('div');
                empty.className = 'sticker-panel-empty';
                empty.textContent = message;
                if (actionLabel && typeof action === 'function') {
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = actionLabel;
                    button.style.cssText = 'display:block;margin:12px auto 0;padding:8px 18px;border:1px solid #D0D0D5;border-radius:10px;background:#fff;color:#333;font-size:12px;cursor:pointer;';
                    button.addEventListener('click', action);
                    empty.appendChild(button);
                }
                grid.appendChild(empty);
            }

            function updateTabs() {
                if (roleTab) {
                    roleTab.classList.toggle('is-active', activeView === 'role');
                    roleTab.setAttribute('aria-pressed', activeView === 'role' ? 'true' : 'false');
                }
                if (allTab) {
                    allTab.classList.toggle('is-active', activeView === 'all');
                    allTab.setAttribute('aria-pressed', activeView === 'all' ? 'true' : 'false');
                }
            }

            function render() {
                var entries = getAvailableStickers();
                if (activeView === 'role' && roleId && roleLibrary) {
                    var favorites = roleLibrary.list(roleId);
                    entries = entries.filter(function (entry) {
                        return entry.key && favorites.indexOf(entry.key) !== -1;
                    });
                }
                grid.innerHTML = '';
                updateTabs();

                if (!entries.length) {
                    if (activeView === 'role' && roleId) {
                        setEmpty(
                            '这个角色还没有专属表情。切换到「全部表情」，点收藏按钮就能加入。',

                            '管理 / 添加表情包',

                        );

                entries.forEach(function (entry) {

                    var item = document.createElement('div');
                    item.className = 'sticker-panel-item';

                    var stickerThumb = document.createElement('img');
                    stickerThumb.src = String(sticker.img || '');
                    stickerThumb.alt = String(sticker.desc || '');
                    stickerThumb.loading = 'lazy';
                    item.appendChild(stickerThumb);

                    if (sticker.desc) {
                        var caption = document.createElement('span');
                        caption.textContent = String(sticker.desc);
                        item.appendChild(caption);
                    }

                    if (roleId && roleLibrary && entry.key) {
                        var selected = roleLibrary.has(roleId, entry.key);
                        var favoriteButton = document.createElement('button');
                        favoriteButton.type = 'button';
                        favoriteButton.className = 'sticker-favorite-toggle' + (selected ? ' is-saved' : '');
                        favoriteButton.textContent = selected ? '已收藏' : '收藏给TA';
                        favoriteButton.setAttribute('aria-pressed', selected ? 'true' : 'false');
                        favoriteButton.addEventListener('click', function (event) {
                            event.stopPropagation();
                            var result = roleLibrary.toggle(roleId, entry.key);
                            if (!result.ok) {
                                if (typeof showToast === 'function') showToast('角色表情收藏保存失败，请检查本地存储空间');
                                return;
                            }
                            if (activeView === 'role' && !result.selected) {
                                render();
                                return;
                            }
                            favoriteButton.textContent = result.selected ? '已收藏' : '收藏给TA';
                            favoriteButton.classList.toggle('is-saved', result.selected);

                    silent: true,
                    contextOnly: true
                });
                return true;
            }
        })();

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var rid = params.get('id') || params.get('roleId') || '';
  if (!rid) return;

  var HOUR = 3600000;
  var overlay = document.getElementById('sumOverlay');
  var sumSub = document.getElementById('sumSub');
  var btnConfirm = document.getElementById('sumConfirm');
  var btnDismiss = document.getElementById('sumDismiss');
  // M3：非阻塞提示（showToast 为主脚本的全局函数；异常时兜底 alert）
  function sumToast(msg) {
    if (typeof showToast === 'function') showToast(msg, 2600);
    else alert(msg);
  }

  function getHistory() {
    try {
      var raw = localStorage.getItem('chat_history_' + rid);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function getProcessedCount() {
    var n = parseInt(localStorage.getItem('chat_summary_processed_' + rid), 10);
    return isNaN(n) || n < 0 ? 0 : n;
  }
  function getInterval() {
    var n = parseInt(localStorage.getItem('chat_summary_interval_' + rid), 10);
    if (isNaN(n) || n < 1) n = 20;
    return Math.min(n, 200);
  }
  function autoEnabled() { return localStorage.getItem('chat_summary_auto_' + rid) !== '0'; }
  function lastSummaryAt() {
    var t = parseInt(localStorage.getItem('chat_last_summary_' + rid), 10);
    return isNaN(t) ? 0 : t;
  }
  function checkAutoSummary() {
    if (!autoEnabled() || overlay.style.display !== 'none') return;
    var history = getHistory(), processed = getProcessedCount();
    if (processed > history.length) processed = 0;
    var remaining = Math.max(0, history.length - processed);
    if (remaining < getInterval()) return;
    if (Date.now() - lastSummaryAt() < 8 * HOUR) return;
    sumSub.textContent = '有 ' + remaining + ' 条历史消息尚未整理。本次最多整理 20 条；原始聊天不会被替换或删除。确认后才会额外调用一次 API。';
    overlay.style.display = 'flex';
  }
  function snooze() {
    try { localStorage.setItem('chat_last_summary_' + rid, String(Date.now())); } catch (e) {}
    overlay.style.display = 'none';
  }
  async function doSummarize() {
    btnConfirm.disabled = true;
    btnConfirm.textContent = '整理中...';
    try {
      var config = {};
      try { config = JSON.parse(localStorage.getItem('api_settings') || '{}'); } catch (e) {}
      var apiKey = (config.apiKey || '').trim();
      var baseUrl = (config.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
      var apiModel = (config.model || 'gpt-3.5-turbo').trim();
      if (!apiKey) { sumToast('请先到设置页配置 API Key'); overlay.style.display = 'none'; return; }

      var history = getHistory(), startIndex = getProcessedCount();
      if (startIndex > history.length) startIndex = 0;
      var hardEnd = Math.min(history.length, startIndex + Math.min(20, getInterval()));
      var endIndex = startIndex, transcriptLines = [], transcriptChars = 0;
      while (endIndex < hardEnd) {
        var m = history[endIndex], line = '';
        if (m && !m.isError && m.role !== 'system_error') {
          var who = (m.role === 'sent' || m.role === 'user') ? '用户' : '角色';
          var content = String(m.text || m.content || m.desc || '').trim();
          if (content) line = who + '：' + content;
        }
        if (line && transcriptLines.length && transcriptChars + line.length + 1 > 4000) break;
        if (line && !transcriptLines.length && line.length > 4000) {
          transcriptLines.push(line.slice(0, 3800) + '…[单条消息较长，原文完整保留]');
          endIndex++;
          break;
        }
        if (line) {
          transcriptLines.push(line);
          transcriptChars += line.length + 1;
        }
        endIndex++;
      }
      var transcript = transcriptLines.join('\n');
      if (endIndex === startIndex) {
        overlay.style.display = 'none';
        sumToast('没有新的未整理记录');
        return;
      }
      if (!transcript) {
        localStorage.setItem('chat_summary_processed_' + rid, String(endIndex));
        localStorage.setItem('chat_last_summary_' + rid, String(Date.now()));
        overlay.style.display = 'none';
        sumToast('这批没有可整理的文字消息');
        return;
      }
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 20000);
      var resp = await fetch(baseUrl + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        signal: controller.signal,
        body: JSON.stringify({
          model: apiModel, temperature: 0.3, stream: false, max_tokens: 600,
          messages: [
            { role: 'system', content: '你是长期记忆整理助手。只整理当前这小批对话，不要把多件事压缩成空泛人格摘要。尽量保留具体人物、时间、专有名词、承诺、事件因果和未完成话题；没有证据的内容不要补造。输出 JSON 数组，每条格式为 {"content":"具体记忆","category":"key|plot|detail|anniversary|preference","importance":1到5的整数}。只输出 JSON 数组，没有值得长期保留的内容就输出 []。' },
            { role: 'user', content: '本批原始对话（消息序号 ' + startIndex + ' 至 ' + (endIndex - 1) + '）：\n' + transcript }
          ]
        })
      });
      clearTimeout(timer);
      if (!resp.ok) { sumToast(friendlyHttpError(resp.status, '')); overlay.style.display = 'none'; return; }
      var data = await resp.json();
      var text = data && data.choices && data.choices[0] && data.choices[0].message ? (data.choices[0].message.content || '').trim() : '';
      var jsonMatch = text.match(/\[[\s\S]*\]/);
      if (!jsonMatch) throw new Error('memory-json-invalid');
      var items = JSON.parse(jsonMatch[0]);
      if (!Array.isArray(items)) throw new Error('memory-json-invalid');

      var existing = [];
      try {
        var raw = localStorage.getItem('chat_memories_' + rid);
        existing = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(existing)) existing = [];
      } catch (e) {}
      var now = Date.now(), confirmed = 0, pending = 0, reinforced = 0;
      items.forEach(function (it) {
        if (!it || !it.content) return;
        var content = String(it.content).trim().slice(0, 240);
        var key = content.toLowerCase().replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '');
        var duplicate = existing.find(function (m) {
          return String(m && m.content || '').toLowerCase().replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '') === key;
        });
        var importance = Math.max(1, Math.min(5, parseInt(it.importance, 10) || 3));
        if (duplicate && key) {
          duplicate.reinforcementCount = Math.max(1, Number(duplicate.reinforcementCount) || 1) + 1;
          duplicate.lastReinforcedAt = now;
          duplicate.updatedAt = now;
          duplicate.importance = Math.max(Number(duplicate.importance) || 3, importance);
          duplicate.sourceStartIndex = startIndex;
          duplicate.sourceEndIndex = endIndex - 1;
          reinforced++;
          return;
        }
        var status = importance >= 4 ? 'confirmed' : 'pending';
        if (status === 'confirmed') confirmed++; else pending++;
        existing.push({
          id: 'mem_' + now.toString(36) + '_' + existing.length.toString(36),
          content: content,
          category: ['key','plot','detail','anniversary','preference'].indexOf(it.category) >= 0 ? it.category : 'detail',
          importance: importance, status: status, createdAt: now, lastReinforcedAt: now,
          reinforcementCount: 1, source: 'auto-summary', sourceRoleId: String(rid),
          sourceStartIndex: startIndex, sourceEndIndex: endIndex - 1
        });
      });
      if (window.MemoryRecall && window.MemoryRecall.saveMemories) {
        var ok2 = window.MemoryRecall.saveMemories(rid, existing);
        if (!ok2 && typeof sumToast === 'function') sumToast('记忆未能保存：' + (existing.length || 0) + ' 条新整理的记忆未落库，请检查本地存储空间');
      } else {
        try { localStorage.setItem('chat_memories_' + rid, JSON.stringify(existing)); }
        catch (e) { if (typeof sumToast === 'function') sumToast('记忆未能保存，请检查本地存储空间'); }
      }
      localStorage.setItem('chat_summary_processed_' + rid, String(endIndex));
      localStorage.setItem('chat_last_summary_' + rid, String(now));
      overlay.style.display = 'none';
      var message = '本批整理：' + confirmed + ' 条确认';
      if (pending) message += ' · ' + pending + ' 条待确认';
      if (reinforced) message += ' · 强化旧记忆 ' + reinforced + ' 条';
      sumToast(message);
    } catch (err) {
      sumToast('总结失败：' + (err.name === 'AbortError' ? '请求超时' : (err.message === 'memory-json-invalid' ? '模型返回格式不正确，未推进进度，可重试' : '网络错误')));
      overlay.style.display = 'none';
    } finally {
      btnConfirm.disabled = false;
      btnConfirm.textContent = '整理下一批';
    }
  }

  btnDismiss.addEventListener('click', snooze);
  btnConfirm.addEventListener('click', doSummarize);

  // 页面加载后延迟检测
  setTimeout(checkAutoSummary, 1500);
})();
</script>

  function setActive(active,label){
    btn.classList.toggle('recording',active);
    btn.setAttribute('aria-pressed',active?'true':'false');
    btn.title=label||(active?'正在聆听，再点一下结束':'点一下开始语音输入，再点一下结束');
    input.placeholder=active?'正在聆听… 再点一下结束':getRestoredPlaceholder();
  }

  function putText(text){
    text=String(text||'').trim();
    if(!text){toast('没有识别到文字。说完后再点一次波形结束录音。');return}
    var prefix=input.value.trim();
    input.value=prefix?(prefix+' '+text):text;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.focus();
    toast('语音已转成文字，可以检查后发送');
  }

  function errorText(code){
    switch(code){
      case 'not-allowed':
      case 'service-not-allowed': return '请允许浏览器使用麦克风和语音识别功能后重试';
      case 'audio-capture': return '没有检测到可用的麦克风';
      case 'no-speech': return '没有识别到语音。点一下开始，说完后再点一下结束';
      case 'network': return '浏览器的语音识别服务连接失败；这不是聊天 API 的转写接口';
      case 'language-not-supported': return '当前浏览器语音识别不支持中文';
      case 'aborted': return '';
      default: return '语音识别暂时不可用，请检查麦克风权限后重试';
    }
  }

  function resetState(){
    if(startTimer){clearTimeout(startTimer);startTimer=null}
    recognition=null;
    mode='';
    finalText='';
    interimText='';
    stopRequested=false;
    setActive(false);
    btn.disabled=false;
    input.placeholder=getRestoredPlaceholder();
  }

  function startListening(){
    if(mode!=='')return;
    if(!SpeechRecognitionCtor){
      input.focus();
      toast('当前浏览器不支持网页语音识别。可点输入框，再使用手机键盘上的麦克风听写；文字不会自动发送。');
      return;
    }
    var rec;
    try{rec=new SpeechRecognitionCtor()}
    catch(e){toast('无法启动语音识别，请检查麦克风权限后重试');return}

    recognition=rec;
    mode='starting';
    finalText='';
    interimText='';
    rec.lang='zh-CN';
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=1;
    setActive(true,'正在开启语音识别… 再点一下可结束');

    /* 避免浏览器既未触发 onstart 也未触发 onend 时，按钮卡死无法停止。 */
    startTimer=setTimeout(function(){
      if(recognition!==rec||mode!=='starting')return;
      /* 用户在启动阶段已点过停止：静默收尾，不把它当成“启动超时”故障。 */
      if(stopRequested){resetState();return;}
      try{rec.abort()}catch(e){}
      resetState();
      toast('语音识别启动超时。请检查麦克风权限或换用 Chrome 浏览器。');
    },8000);

    rec.onstart=function(){
      if(recognition!==rec)return;
      if(startTimer){clearTimeout(startTimer);startTimer=null}
      mode='listening';
      setActive(true,'正在聆听；说完后再点一次结束');
      /* 用户在启动阶段又点了一次时，等 onstart 确认就绪后再 stop，避免浏览器判定“操作太快”。 */
      if(stopRequested){
        mode='stopping';
        setActive(true,'正在整理语音文字…');
        try{rec.stop()}
        catch(e){try{rec.abort()}catch(ignore){};resetState();toast('语音服务未能正常结束，已重置。请再点一次重试。')}
        return;
      }
      toast('正在聆听。说完后再点一次波形结束。');
    };

    rec.onresult=function(event){
      if(recognition!==rec)return;
      var interim='';
      for(var i=event.resultIndex;i<event.results.length;i++){
        var result=event.results[i];
        var spoken=result&&result[0]?String(result[0].transcript||'').trim():'';
        if(!spoken)continue;
        if(result.isFinal)finalText+=(finalText?' ':'')+spoken;
        else interim+=(interim?' ':'')+spoken;
      }
      interimText=interim;
      /* 识别预览只放在输入框占位提示里，不会直接发送消息。 */
      input.placeholder=interimText||'正在聆听；说完后再点一次结束';
    };

    rec.onerror=function(event){
      if(recognition!==rec)return;
      rec._maomaoError=event&&event.error?event.error:'';
    };

    rec.onend=function(){
      if(recognition!==rec)return;
      var result=(finalText+' '+interimText).trim();
      var error=rec._maomaoError||'';
      var wasActive=mode!=='';
      var endedByUser=(mode==='stopping'||stopRequested);
      resetState();
      if(result)putText(result);
      else if(error&&error!=='aborted')toast(errorText(error));
      else if(wasActive&&endedByUser)toast('已结束，但没有识别到文字。请说完后再点一次结束。');
    };

    try{rec.start()}
    catch(e){
      resetState();
      toast('浏览器拒绝启动语音识别，请确认麦克风权限并使用 HTTPS。');
    }
  }

  function stopListening(){
    if(mode==='starting'){
      /* 不把“正在启动”当成失败，也不立刻调用 stop；等浏览器 onstart 后自动结束。 */
      stopRequested=true;
      setActive(true,'正在启动，已收到结束指令…');
      toast('已收到结束指令，正在等语音服务就绪；不会重复启动。');
      return;
    }
    if(mode==='listening'){
      mode='stopping';
      setActive(true,'正在整理语音文字…');
      try{if(recognition)recognition.stop()}
      catch(e){
        try{if(recognition)recognition.abort()}catch(ignore){}
        resetState();
        toast('语音已结束，请再试一次');
      }
      return;
    }
    if(mode==='stopping')toast('正在整理语音文字，请稍等一下');
  }

  btn.addEventListener('click',function(event){
    if(event){event.preventDefault();event.stopPropagation()}
    if(mode==='')startListening();
    else stopListening();
  });

  /* 页面离开时清理语音识别和启动看门狗。 */
  window.addEventListener('pagehide',function(){
    if(startTimer){clearTimeout(startTimer);startTimer=null}
    try{if(recognition)recognition.abort()}catch(e){}
    recognition=null;mode='';
  },{once:true});

  window.MAOMAO_VOICE_CAPABILITIES={
    speechToText:!!SpeechRecognitionCtor,
    recordingFallback:false,
    interaction:'tap-to-start-tap-to-stop',
    captureMode:'Browser SpeechRecognition',
    requiresConfiguredAPI:false
  };
})();
</script>

    <script>
    // 投喂厨房只把菜品情境放进输入框草稿，由用户确认后再发送；不自动发消息。
    (function(){
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get('cooking') !== '1') return;
        var roleId = params.get('id');
        if (!roleId) return;
        var key = 'maomao_cooking_pending_' + String(roleId);
        var raw = localStorage.getItem(key);
        if (!raw) return;
        localStorage.removeItem(key);
        var dish = JSON.parse(raw);
        if (!dish || !dish.dishName) return;

        // 根据谁做的菜，生成自然的开场白
        var cookBy = dish.cookBy || 'me';
        var draftsMe = [
          '刚刚那道菜……你真的觉得好吃吗？我还怕盐放多了呢。',
          '说真的，刚才那道菜合你胃口吗？我总觉得哪里怪怪的。',

          '欸，刚才那道菜……你真的喜欢吗？我还偷偷尝了一口，感觉好像有点咸。'
        ];
        var draftsThem = [
          '你刚才做的那道真的好好吃！下次能不能再做一次呀？',
          '说真的，你做菜居然这么好吃？我都想天天吃了。',
          '刚才那道菜的味道，我现在还在想呢……',
          '你什么时候学会做饭的？也太厉害了吧。',
          '刚才那道菜我全吃光了！真的一点都没剩。'
        ];
        var pool = cookBy === 'them' ? draftsThem : draftsMe;
        var draft = pool[Math.floor(Math.random() * pool.length)];
        function fillDraft(){
          var input = document.getElementById('chat-input');
          if (!input || input.value.trim()) return false;
          input.value = draft;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.focus({ preventScroll: true });
          return true;
        }
        if (!fillDraft()) window.addEventListener('load', function(){ setTimeout(fillDraft, 350); }, { once: true });
      } catch (e) { console.warn('投喂厨房上下文未能载入', e); }
    })();

<script>
// ===== 强制 iMessage 透明磨砂玻璃主题 =====
(function() {
  function isIMessageTheme() {
    var mockup = document.querySelector('.phone-mockup');
    return mockup && mockup.getAttribute('data-chat-theme-preset') === 'imessage';
  }
  
  function applyTransparentTheme() {
    // 只在 iMessage 主题下生效
    if (!isIMessageTheme()) return;
    
    // 强制设置所有气泡透明
    document.querySelectorAll('.msg-bubble, .msg-card, .msg-row > div').forEach(function(bubble) {
      var row = bubble.closest('.msg-row');
      if (!row) return;
      
      var isSent = row.classList.contains('sent') || row.classList.contains('right');
      
      if (isSent) {
        // 自己的气泡：纯透明蓝色
        bubble.style.setProperty('background', 'rgba(10, 132, 255, 0.3)', 'important');
        bubble.style.setProperty('backdrop-filter', 'none', 'important');
        bubble.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
        bubble.style.setProperty('box-shadow', 'none', 'important');
      } else {
        // 对方气泡：纯透明白色
        bubble.style.setProperty('background', 'rgba(255, 255, 255, 0.25)', 'important');
        bubble.style.setProperty('backdrop-filter', 'none', 'important');
        bubble.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
        bubble.style.setProperty('box-shadow', 'none', 'important');
      }
    });
    
    // 强制顶部导航栏透明
    document.querySelectorAll('.chat-header').forEach(function(header) {
      header.style.setProperty('background', 'rgba(255, 255, 255, 0.2)', 'important');
      header.style.setProperty('backdrop-filter', 'none', 'important');
      header.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    });
    
    // 强制输入栏完全透明
    document.querySelectorAll('.input-dock').forEach(function(dock) {
      dock.style.setProperty('background', 'transparent', 'important');
      dock.style.setProperty('backdrop-filter', 'none', 'important');
      dock.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
      dock.style.setProperty('border-top', 'none', 'important');
    });
    
    // 强制消息区透明
    document.querySelectorAll('.chat-stage').forEach(function(stage) {
      stage.style.setProperty('background', 'transparent', 'important');
    });
  }
  
  // 页面加载后执行
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(applyTransparentTheme, 100);
    });
  } else {
    setTimeout(applyTransparentTheme, 100);
  }
  
  // 监听新消息，确保新消息也应用透明效果
  var chatMessages = document.getElementById('chat-messages');
  if (chatMessages) {
    var observer = new MutationObserver(function(mutations) {
      setTimeout(applyTransparentTheme, 50);
    });
    observer.observe(chatMessages, { childList: true, subtree: true });
  }
})();
</script>

<script>
// 最后执行：保留旧主题的悬浮发送按钮；微信主题切换为微信式发送控件。
(function(){
  var HEART_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6c-2.2-2.2-5.7-2.2-7.9 0L12 5.5l-.9-.9c-2.2-2.2-5.7-2.2-7.9 0s-2.2 5.7 0 7.9L12 21l8.8-8.5c2.2-2.2 2.2-5.7 0-7.9Z"/></svg>';
  var SEND_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>';
  function isWechat(){
    var shell = document.querySelector('.phone-mockup');
    return !!(shell && shell.getAttribute('data-chat-theme-preset') === 'wechat');
  }
  function force(){
    var d = document.getElementById('chat-form');
    if(!d) return;
    var wechat = isWechat();
    d.style.setProperty('background', wechat ? '#F7F7F7' : 'transparent', 'important');
    d.style.setProperty('background-color', wechat ? '#F7F7F7' : 'transparent', 'important');
    d.style.setProperty('border-top', wechat ? '1px solid #E2E2E2' : 'none', 'important');
    d.style.setProperty('backdrop-filter','none','important');
    d.style.setProperty('-webkit-backdrop-filter','none','important');
    var sb = d.querySelector('.send-icon-btn');
    if(sb){
      sb.style.setProperty('display','flex','important');
      sb.style.setProperty('visibility','visible','important');
    }
  }
  function fixAll(){
    var d = document.getElementById('chat-form');
    var cap = document.querySelector('.input-capsule');
    var wechat = isWechat();
    if(cap) cap.style.marginRight = '50px';
    if(!d) return;
    var old = d.querySelector('.send-icon-btn');
    if(old) old.style.display = 'none';
    var b = document.getElementById('myFloatSend');
    if(!b){
      b = document.createElement('button');
      b.id = 'myFloatSend';
      b.type = 'button';
      b.onclick = function(){ if(typeof window.sendMsg==='function') window.sendMsg(); };
      d.appendChild(b);
    }
    b.style.cssText = wechat
      ? 'position:absolute;right:14px;bottom:8px;width:36px;height:36px;border-radius:6px;background:#07C160;border:none;box-shadow:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60;color:#fff;'
      : 'position:absolute;right:14px;bottom:8px;width:36px;height:36px;border-radius:50%;background:#fff;border:none;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60;color:#111;';
    b.innerHTML = wechat ? SEND_ICON : HEART_ICON;
  }
  function sync(){ force(); fixAll(); }
  sync();
  window.addEventListener('load', function(){ setTimeout(sync, 100); setTimeout(sync, 500); });
  window.addEventListener('pageshow', function(){ setTimeout(sync, 0); });
  window.addEventListener('maomao:chat-theme-change', function(){ setTimeout(sync, 0); });
  window.addEventListener('storage', function(event){
    if(!event || event.key === 'maomao_chat_theme_preset') setTimeout(sync, 0);
  });
})();</script>
