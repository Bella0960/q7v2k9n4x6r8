            background: rgba(255, 255, 255, 0.35);

        }
        .msg-row {
            display: flex;
            gap: 8px;
            max-width: var(--chat-bubble-max-width, 86%);
            align-items: center;
            /* Fix A（内容可见性）：离屏的行跳过布局/绘制，长会话全量重渲染时
               只真实计算视口内气泡，开销从 O(N) 降为 O(可见行数)。
               不支持的浏览器（旧 Safari/FF）会忽略此属性，行为回退为原样。
               ⚠️ 副作用：离屏行退化为 contain-intrinsic-size 的 64px 占位，
               scrollHeight 只约等于真实值的一半（实测 162 条：4657px vs 9552px），
               且新气泡进入视口前 scrollHeight 仍按占位计算。
               因此任何「滚到底」都不能只写一次 scrollTop = scrollHeight，
               必须走 scrollToBottom() 的多帧校正，否则会停在假底部
               （Bug #4：发完消息视口往上跑）。 */
            content-visibility: auto;
            contain-intrinsic-size: auto 64px;
        }
        .msg-row.received, .msg-row.left {
            align-self: flex-start;
        }
        .msg-row.sent, .msg-row.right {
            align-self: flex-end;
        }
        /* Fix A 配套（P3 虚拟列表）：窗口化渲染时，.vl-win 必须保持与 #chat-messages
           一致的 flex 列布局，否则 .msg-row 的 align-self 横向定位会失效（气泡全贴左）。
           .vl-spacer 仅用高度撑起滚动条，不参与布局。 */
        .vl-win {
            display: flex;
            flex-direction: column;
        }
        .vl-spacer {
            flex: 0 0 auto;
        }
/* 群聊成员名标签：QQ/微信风格，彩色名字在气泡上方 */
.msg-sender {

        .msg-avatar img {

            box-shadow: var(--chat-bubble-ta-shadow, 0 2px 8px rgba(0, 0, 0, 0.06));

            border: var(--chat-bubble-my-border-width, 0px) var(--chat-bubble-my-border-style, solid) var(--chat-bubble-my-border-color, rgba(30,30,35,0.68));
            box-shadow: var(--chat-bubble-my-shadow, 0 2px 10px rgba(0, 0, 0, 0.15));

        /* 搜索跳转定位：灰色光环脉冲（黑白气泡上均可见），1.9s 后自动移除 */
        .msg-bubble.hl-flash {

            100% { box-shadow: 0 0 0 4px rgba(142,142,147,0); }

        /* 多气泡回复：逐条轻微淡入，不改变消息本身的布局和内容。 */

            background: #FFFFFF;
            border-radius: 14px; padding: 6px 0;
            box-shadow: 0 10px 28px rgba(0,0,0,0.12);
            animation: ctxPop 0.15s ease-out;
        }
        .msg-menu::after {
            content: ''; position: absolute; left: var(--arrow-x, 22px);
            width: 10px; height: 10px; background: #FFFFFF;
            transform: rotate(45deg); border-radius: 2px;
        }
        .msg-menu.below::after { top: -5px; }

        .msg-sheet-item {
            display: flex; align-items: center; gap: 10px;

        /* ========== 转发：居中紧凑列表卡（与重玩弹窗同一范式） ========== */

        .fw-list { flex: 1; overflow-y: auto; padding: 0 6px; }
        .fw-item {
            display: flex; align-items: center; gap: 12px;

        .fw-avatar {

        .fw-empty { text-align: center; color: #B0B0B5; font-size: 0.875rem; padding: 36px 0; }

        }

        /* ========== 编辑消息：居中卡片 ========== */
        .edit-overlay {
            position: absolute; inset: 0; z-index: 420; display: none;
            align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        }
        .edit-overlay.active { display: flex; }
        .edit-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.25); }
        .edit-sheet {
            position: relative; width: 100%; max-width: 320px; box-sizing: border-box;
            background: #FFFFFF; border-radius: 18px; padding: 22px 20px 20px;
            animation: ctxPop 0.18s ease-out;
        }
        .edit-title { font-size: 1.063rem; font-weight: 700; color: #111111; text-align: center; margin: 0 0 14px; padding: 0; }
        .edit-input {

        .edit-cancel, .edit-confirm {

        }
        .edit-cancel { background: #F2F2F7; color: #666666; }
        .edit-confirm { background: #111111; color: #FFFFFF; }

        /* 译文小字 / 已编辑标记 */
        .msg-translation { font-size: 0.688rem; line-height: 1.45; color: #8E8E93; margin-top: 6px; padding-top: 6px; border-top: 0.5px solid rgba(0,0,0,0.08); }
        .msg-edited { font-size: 0.625rem; color: #C7C7CC; margin-top: 4px; }

        /* 语音气泡：单行波形 + 时长，转写文字常驻在气泡下方 */
        .bubble-voice { min-width: 104px; padding: 8px 12px; }
        .voice-row { display: flex; align-items: center; gap: 8px; height: 18px; }
        .voice-wave { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
        .voice-wave i { width: 2px; border-radius: 1px; background: currentColor; opacity: 0.4; }
        .voice-wave i.on { opacity: 1; }
        .voice-dur { font-size: 0.688rem; opacity: 0.7; }
        .msg-voice { display: flex; flex-direction: column; gap: 4px; max-width: min(260px, 100%); }
        .msg-row.sent .msg-voice, .msg-row.right .msg-voice { align-items: flex-end; }
        .msg-row.received .msg-voice, .msg-row.left .msg-voice { align-items: flex-start; }
        /* 转写常驻：不再用 <details> 折叠，直接铺开 */
        .voice-transcript {
            font-size: 0.688rem; line-height: 1.5; color: #66666B;
            max-width: 220px; text-align: left; word-break: break-word;
        }
        .bubble-media { padding: 0 !important; background: transparent !important; border: none !important; }
        .msg-media-img { width: 180px; max-width: 100%; border-radius: 16px; display: block; }
        .image-actions {
            display: flex; align-items: center; gap: 12px;
            padding: 6px 2px 0; max-width: 180px;
        }
        .image-action-button {
            border: 0; padding: 3px 0; background: transparent;

            text-decoration: underline; text-underline-offset: 3px;
        }

        .bubble-image-pending {
            min-width: 150px; padding: 12px 14px !important;
            color: #77777D !important; background: #F7F7F8 !important;
            border: 1px solid #E7E7EA !important; font-size: 0.75rem;
        }
        .image-pending-mark {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%;

        }
        @keyframes imagePendingPulse { 50% { opacity: .25; } }

        .msg-media-desc { font-size: 0.688rem; color: #8E8E93; margin-top: 6px; }
        /* 虚拟图片：AI 描述 + 可见的图片框 */
        .vimg-box {
            width: 180px; max-width: 100%; box-sizing: border-box;
            background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;

        }
        .vimg-icon svg { width: 22px; height: 22px; display: block; }
        /* ========== 心声卡：iOS 备忘录风格（方案 B · 严守黑白灰） ========== */
        .bubble-heart {
            display: block !important;
            max-width: 290px;
            background: #FFFFFF !important;
            border: none !important;
            border-radius: 16px !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06) !important;
            padding: 0 !important;
            color: #111 !important;
            overflow: hidden;
            animation: heartIn 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
            font-weight: 400 !important;
            line-height: normal !important;
            letter-spacing: 0 !important;
        }
        .heart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid #E5E5EA;
            padding: 10px 14px;

        .heart-back {

            font-size: 0.813rem;
            font-weight: 500;

        .heart-content {

        @keyframes heartIn { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .bubble-heart { animation: none; } }
        .input-capsule.is-blocked { opacity: 0.5; pointer-events: none; }

        /* 发送失败红色感叹号（拉黑/被对方拒收时） */
        .msg-send-failed {

        /* 名片消息 */
        .card-share { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
        .card-avatar {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
            background: #F2F2F7; color: #8E8E93; font-size: 0.875rem; font-weight: 700;

        }

        .card-info { min-width: 0; }
        .card-name { font-size: 0.875rem; font-weight: 600; color: #111111; }
        .card-label { font-size: 0.688rem; color: #8E8E93; margin-top: 2px; }

        .detail-toast {

        /* ========== 加号互动面板 ========== */
        .plus-panel-overlay {
            position: absolute;
            inset: 0;
            z-index: 300;
            display: none;
            align-items: flex-end;

        /* ========== 红包/转账底部抽屉 ========== */

        }

        .pay-drawer-backdrop {

            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .pay-drawer-overlay.active .pay-drawer-backdrop { opacity: 1; }
        .pay-drawer-sheet {

        /* ========== 通用弹窗（功能编辑） ========== */
        .x-modal-overlay {
            position: absolute;
            inset: 0;
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

            position: absolute;

        }

            position: relative;
            width: 100%;
            max-width: 340px;

            flex-direction: column;
            animation: popIn 0.22s ease-out;

    <script>
        // ===== 加载壁纸到手机背景（iMessage 透明主题，支持 IndexedDB + 明暗自动切换） =====
        (function loadWallpaper() {
            var store = window.MAOMAOWallpaperStore;
            var mockup = document.querySelector('.phone-mockup');
            if (!mockup) return;

            function applyWallpaper(dataUrl) {
                if (dataUrl) {
                    mockup.style.backgroundImage = 'url("' + dataUrl + '")';
                    mockup.style.backgroundSize = 'cover';
                    mockup.style.backgroundPosition = 'center';
                    mockup.style.backgroundRepeat = 'no-repeat';
                } else {
                    mockup.style.backgroundImage = 'none';
                }
                // 深色壁纸自动调整文字对比度
                if (store && typeof store.applyTone === 'function') {
                    store.applyTone(dataUrl || '');
                }
            }

            if (store && typeof store.get === 'function') {
                store.get().then(function (dataUrl) {
                    applyWallpaper(dataUrl || '');
                }).catch(function () {
                    // 回退到 localStorage
                    try {
                        var wp = localStorage.getItem('home_custom_wallpaper');
                        applyWallpaper(wp || '');
                    } catch (e) {}
                });
            } else {
                // 回退到 localStorage
                try {
                    var wp = localStorage.getItem('home_custom_wallpaper');
                    applyWallpaper(wp || '');
                } catch (e) {}
            }
        })();

        const STORAGE_KEY = 'ai_custom_characters';
        const DEFAULT_ROLES = [];

        function getRoleById(roleId) {
            if (!roleId) return null;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const roles = JSON.parse(raw);
                    if (Array.isArray(roles)) {
                        const target = roles.find(r => String(r.id) === String(roleId));
                        if (target) return target;
                    }
                }

        const NEAR_BOTTOM_PX = 96;

        function isNearBottom(px) {

                msg.call && typeof msg.call === 'object' ? JSON.stringify(msg.call) : ''

        // Async chat operations must append under the shared per-conversation lock.

        async function appendChatSafely(messages, guard) {

                return false;

            if (!saved || !saved.ok) {

                return false;

                return false;

        function saveMessages(list) {

                    showToast('聊天记录异常，未覆盖原始数据；请先备份并修复存储');
                }
                return false;
            }
            if (storageKey !== 'chat_history_' + currentCharacter.id) {
                console.warn('聊天角色标识发生变化，已阻止跨会话写入');
                if (typeof showToast === 'function') showToast('会话已切换，请重新进入聊天后再发送');
                return false;
            }

            // Fail closed rather than overwriting bytes which may still be recoverable.
            if (typeof localStorage !== 'undefined' && typeof localStorage.getItem === 'function') {
                try {

        // /photo 为用户显式触发，不自动判断意图、不随机生成；仅支持单人角色聊天。
        var _chatImageGenerationRunning = false;
        async function generateRoleImageFromChat(sceneHint) {
            if (_chatImageGenerationRunning) {
                if (typeof showToast === 'function') showToast('上一张图片还在生成，请稍等');
                return;
            }
            if (isGroupChat) {
                if (typeof showToast === 'function') showToast('角色生图目前支持单人聊天，请在单人聊天中使用 /photo');
                return;
            }
            if (!window.PhoneImageGeneration) {
                if (typeof showToast === 'function') showToast('生图模块未加载，请刷新页面后重试');
                return;
            }
            var input = document.getElementById('chat-input');
            var prior = loadMessages();
            var context = prior.slice(-14).map(function (message) {
                if (!message || typeof message !== 'object') return '';
                var type = String(message.type || '');
                if (type === 'image' || type === 'virtual-image' || type === 'sticker' || type === 'voice') return '';
                var body = String(message.text != null ? message.text : (message.content || '')).trim();
                if (!body) return '';
                var speaker = message.role === 'sent' || message.role === 'user' ? 'User' :
                    (message.name || currentCharacter.name || 'Character');
                return speaker + ': ' + body.slice(0, 900);
            }).filter(Boolean).join('\n').slice(-6500);
            var pending = {
                role: 'assistant',
                type: 'image-pending',
                text: '正在生成图片…',
                time: Date.now()
            };
            ensureMid(pending);
            var withPending = prior.slice();
            withPending.push(pending);
            if (!saveMessages(withPending)) {
                if (typeof showToast === 'function') showToast('聊天记录无法保存，暂未开始生图');
                return;
            }
            if (input) input.value = '';
            renderAllMessages();
            _chatImageGenerationRunning = true;
            try {
                var result = await window.PhoneImageGeneration.generate({
                    characterId: currentCharacter.id,
                    conversationContext: context,
                    sceneHint: sceneHint || '',
                    isPrivate: true,
                    chatMessageId: pending.mid
                });
                if (!result.chatReferenceAdded) {
                    throw new Error('图片已保存到角色图库，但聊天引用没有写入；请到设置中的角色图库查看。');
                }
                var latest = loadMessages();
                var index = latest.findIndex(function (item) { return String(item.mid || '') === String(pending.mid); });
                if (index < 0) return;
                latest[index] = Object.assign({}, latest[index], {
                    type: 'image',

                    imageRecordId: result.record.id,
                    desc: result.sceneDescription,

                }

        // 头像占位：极细线条 SVG 小人（黑白灰规范，无 Emoji）
        const USER_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';

        // 我的头像：从 myProfile.avatar 实时读取
        // Fix B（头像缓存）：原实现在每条"自己发的消息"渲染时都执行

        // 长会话全量重渲染时（N 条 = N/2 次自读），这是纯浪费。

        let _chatPairAvatarUrl = '';

            if (!isGroupChat && _chatPairAvatarUrl) return _chatPairAvatarUrl;
            try {
                const raw = localStorage.getItem('myProfile');
                if (raw === _myAvatarCache.raw) return _myAvatarCache.avatar; // 命中缓存，跳过 JSON.parse

        // Keep the per-chat B side of a matching pair separate from global myProfile.

        // ================= 消息稳定标识：单条操作（复制/转发/翻译/编辑/删除）都依赖 mid =================
        function ensureMid(msg) {
            if (!msg || typeof msg !== 'object') return '';

            if (!msg.time) msg.time = Date.now();
            if (!msg.mid) {
                msg.mid = 'm' + (msg.time || Date.now()) + Math.random().toString(36).slice(2, 5);
            }
            return msg.mid;
        }

        function findByMid(mid) {
            var list = loadMessages();
            for (var i = 0; i < list.length; i++) {
                if (ensureMid(list[i]) === mid) return list[i];

            return null;
        }

        // 按 bubbleId 取具体气泡（老记录 mid#index 也能定位），所有单条操作都走这里。
        function resolveBubbleInPage(bubbleId) {

                return window.ChatMessagePolicy.resolveBubble(loadMessages(), bubbleId);

        // 局部操作后统一重渲染，保证旁白、译文、气泡索引与存储一致。

        // ================= 发送失败重试：按 mid 复用原用户消息，不新增重复记录 =================
        // 旧数据可能没有 mid：找不到 mid 时退回 time 匹配，只为定位，不补写、不迁移历史数据。
        function _locateRetryMessage(list, mid, time) {
            if (!Array.isArray(list)) return -1;
            for (var i = 0; i < list.length; i++) {
                var m = list[i];
                if (!m || m.role !== 'user' || !m.sendFailed) continue;
                if (mid && m.mid === mid) return i;
                if (mid && !m.mid && time != null && String(m.time) === String(time)) return i;
                if (!mid && time != null && String(m.time) === String(time)) return i;
            }
            return -1;
        }

        // 只清除原记录上的失败标记并交给调用方落库；返回 previous 供保存失败时回滚。
        function _prepareRetryMessage(list, mid, time) {

            return { index: idx, message: message, previous: previous };

        function _locateUserMessageIndex(list, mid, time) {

                if (timeIndex === -1 && time != null && String(m.time) === String(time)) timeIndex = i;

                if (previousFailed) message.sendFailed = true;
                else delete message.sendFailed;
                if (previousReason != null) message.sendFailedReason = previousReason;
                else delete message.sendFailedReason;
                return false;
            }
            return true;

        // AI 回复清洗（保护 think/narratage 标签不被 cleanup 破坏）
        function cleanupAiReply(raw) {
            if (window.ChatMessagePolicy && typeof window.ChatMessagePolicy.cleanupReplyPreservingBlocks === 'function') {
                return window.ChatMessagePolicy.cleanupReplyPreservingBlocks(raw, applyAICleanup);
            }
            // Compatibility fallback: keep the original block protection and cleanup order.
            // 1) 提取 think 和 narratage 块，替换成占位符
            var THINK_PH = '\u0000THINK_BLOCK\u0000';
            var NARR_PH = '\u0000NARR_BLOCK\u0000';

                thinks.push(m[0]);
            }
            text = text.replace(thinkRegex, THINK_PH);
            var narrRegex = /<narratage>[\s\S]*?<\/narratage>/gi;
            while ((m = narrRegex.exec(text)) !== null) {
                narrations.push(m[0]);
            }
            text = text.replace(narrRegex, NARR_PH);

            text = applyAICleanup(text);

            });
            idx = 0;
            text = text.replace(new RegExp(NARR_PH.replace(/\u0000/g, '\\u0000'), 'g'), function () {
                return narrations[idx++] || '';
            });

        function stripInternalReasoning(raw) {

                bubble.classList.add('bubble-pay');

                    <div class="pay-card-main">
                        <span class="pay-card-label">${payLabel}</span>
                        <span class="pay-card-amount">¥${escHtml(String(msg.amount == null ? '0.00' : msg.amount))}</span>

            } else if (msg.type === 'transfer') {
                // 转账卡：纯白底 + 浅灰边框 + 黑色细线条双向箭头 + 右侧灰色细箭头
                bubble.classList.add('bubble-pay');
                const transferStatus = msg.status === 'received' ? '已收款'
                    : msg.status === 'returned' ? '已退回'
                    : msg.status === 'returning' ? '等待退回到账'
                    : msg.status === 'accepted' ? '对方已收下'
                    : (isSent ? '等待对方回应' : '待收款');
                bubble.innerHTML = `<div class="pay-card pay-card-transfer" data-index="${typeof idx === 'number' ? idx : ''}" data-mid="${escHtml(ensureMid(msg))}" data-type="transfer" onclick="handlePayCardClick(event)">
                    <svg class="pay-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    <div class="pay-card-main">
                        <span class="pay-card-label">转账</span>
                        <span class="pay-card-amount">¥${escHtml(String(msg.amount == null ? '0.00' : msg.amount))}</span>
                    </div>
                    <span class="pay-card-status">${transferStatus}</span>
                </div>`;
            } else if (msg.type === 'role_family_card') {
                bubble.classList.add('bubble-family-card');
                var familyCard = window.RoleFamilyCards && msg.cardId ? window.RoleFamilyCards.find(msg.cardId) : null;
                var cardKindLabel = familyCard && familyCard.kind === 'intimate' ? '亲密付' : '亲属卡';
                var cardStatus = familyCard ? familyCard.status : 'unavailable';
                var cardStatusText = cardStatus === 'pending' ? '等待领取'
                    : cardStatus === 'active' ? '已开通'
                    : cardStatus === 'paused' ? '已暂停'
                    : cardStatus === 'revoked' ? '已撤销'
                    : cardStatus === 'rejected' ? '已婉拒'
                    : '暂不可用';
                var familyCardButtons = '';
                var familyCardIdAttr = escHtml(String((familyCard && familyCard.id) || msg.cardId || ''));
                if (cardStatus === 'pending') {
                    familyCardButtons = '<div style="display:flex;gap:8px;margin-top:14px;">' +
                        '<button type="button" onclick="handleRoleFamilyCardAction(event, \'' + familyCardIdAttr + '\', \'accept\')" style="flex:1;border:0;border-radius:10px;background:#111;color:#fff;padding:10px 8px;font-size:12px;">领取亲属卡</button>' +
                        '<button type="button" onclick="handleRoleFamilyCardAction(event, \'' + familyCardIdAttr + '\', \'reject\')" style="border:1px solid #ddd;border-radius:10px;background:#fff;color:#666;padding:10px 12px;font-size:12px;">暂不接受</button>' +
                        '</div>';
                } else if (cardStatus === 'active') {
                    familyCardButtons = '<button type="button" onclick="handleRoleFamilyCardAction(event, \'' + familyCardIdAttr + '\', \'pause\')" style="margin-top:12px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#555;padding:8px 12px;font-size:12px;">暂停使用</button>';

                }
                var familyMonthly = familyCard ? Number(familyCard.monthlyLimit) || 0 : 0;
                var familySingle = familyCard ? Number(familyCard.singleLimit) || 0 : 0;
                var familyUsed = familyCard && window.RoleFamilyCards ? window.RoleFamilyCards.usedThisMonth(familyCard) : 0;
                var familyRemain = Math.max(0, familyMonthly - familyUsed);
                var familyNote = escHtml(String((familyCard && familyCard.note) || '给你准备的专属日常额度'));
                bubble.innerHTML = '<div style="width:224px;max-width:100%;border:1px solid #dedee3;border-radius:14px;overflow:hidden;background:#fff;color:#111;box-shadow:0 2px 12px rgba(0,0,0,.035);">' +
                    '<div style="padding:13px 14px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;">' +
                        '<span style="font-size:11px;letter-spacing:1.4px;">MAOMAO / BENEFIT</span><span style="font-size:10px;opacity:.7;">' + cardKindLabel + '</span></div>' +
                    '<div style="padding:15px 14px 13px;">' +
                        '<div style="font-size:12px;color:#888;">' + escHtml(String((familyCard && familyCard.roleName) || contactName || '角色')) + ' 给你的额度</div>' +
                        '<div style="font-size:25px;font-weight:700;letter-spacing:-.5px;margin:4px 0;">¥' + familyMonthly.toFixed(2) + '<span style="font-size:11px;font-weight:400;color:#888;letter-spacing:0;"> / 月</span></div>' +
                        '<div style="font-size:11px;color:#777;line-height:1.7;">单笔上限 ¥' + familySingle.toFixed(2) + ' · 本月剩余 ¥' + familyRemain.toFixed(2) + '</div>' +
                        '<div style="height:1px;background:#eee;margin:12px 0;"></div>' +
                        '<div style="font-size:12px;line-height:1.6;color:#444;">' + familyNote + '</div>' +
                        '<div style="margin-top:10px;font-size:10px;color:' + (cardStatus === 'active' ? '#111' : '#888') + ';">状态 · ' + cardStatusText + '</div>' +
                        familyCardButtons +
                        '<div style="margin-top:10px;font-size:9px;color:#aaa;">仅限应用内模拟商店与外卖使用</div>' +
                    '</div></div>';
            } else if (msg.type === 'card' && msg.card) {
                const cd = msg.card;
                const cdAvSrc = safeUrl(cd.avatar);
                const cdAv = cdAvSrc
                    ? '<img src="' + escHtml(cdAvSrc) + '" alt="">'
                    : escHtml(String(cd.name || '?').slice(0, 1));
                bubble.innerHTML = '<div class="msg-card card-share">' +
                    '<div class="card-avatar">' + cdAv + '</div>' +
                    '<div class="card-info"><div class="card-name">' + escHtml(cd.name || '') + '</div>' +
                    '<div class="card-label">个人名片</div></div>' +
                    '</div>';
            } else {
                var rawText = msg.text || msg.content || '';
                // AI 消息：解析思维链、旁白、双回车多气泡
                var isAiMsg = !isSent && !isError &&
                    (msg.role === 'assistant' || msg.role === 'received');
                var _pendingExtras = []; // 收集 think/narration/extra rows，主 row 之后再 append
                if (isAiMsg && rawText) {
                    var parsed = parseReplyContent(rawText);
                    // 旁白块（居中淡化）
                    parsed.narrations.forEach(function (nc) {
                        _pendingExtras.push(renderNarratageBlock(nc));
                    });
                    if (parsed.bubbles.length > 0) {
                        // 第一个气泡走正常 row 流程（含 avatar / group name / mid / 译文）
                        bubble.textContent = parsed.bubbles[0];
                        row.dataset.bubbleId = bubbleIdFor(msgMid, 0, parsed.bubbles.length);
                        // 双语聊天：每段外语正文底下挂一条灰色中文翻译
                        if (parsed.translations && parsed.translations[0]) {
                            var tr0 = document.createElement('div');
                            tr0.className = 'msg-translation';
                            tr0.textContent = parsed.translations[0];
                            bubble.appendChild(tr0);
                        }
                        // 后续气泡：只保留 bubble + avatar，不带 extra 装饰
                        for (var bi = 1; bi < parsed.bubbles.length; bi++) {
                            var extraRow = document.createElement('div');
                            extraRow.className = 'msg-row received';
                            extraRow.dataset.mid = msgMid;
                            extraRow.dataset.time = String(msg.time || '');
                            extraRow.dataset.bubbleId = bubbleIdFor(msgMid, bi, parsed.bubbles.length);
                            extraRow.dataset.bubbleIndex = String(bi);
                            var extraBubble = document.createElement('div');
                            extraBubble.className = 'msg-bubble';
                            extraBubble.textContent = parsed.bubbles[bi];
                            if (parsed.translations && parsed.translations[bi]) {
                                var trN = document.createElement('div');
                                trN.className = 'msg-translation';
                                trN.textContent = parsed.translations[bi];
                                extraBubble.appendChild(trN);
                            }
                            var extraAv = document.createElement('div');
                            extraAv.className = 'msg-avatar';
                            fillAvatar(extraAv, currentCharacter.avatar, USER_SVG);
                            extraRow.appendChild(extraAv);
                            extraRow.appendChild(extraBubble);
                            _pendingExtras.push(extraRow);
                        }
                    } else {
                        // 只有思维链/旁白没正文：直接挂 extras 并 return，主 row 丢弃
                        _pendingExtras.forEach(function (el) { host.appendChild(el); });
                        return;
                    }
                } else {
                    bubble.textContent = rawText;
                }
            }

            // 引用回复：将原消息快照和本条文字一起显示，历史记录重载后也不会丢失。
            if (msg.quote && msg.quote.text) {
                var quoteBox = document.createElement('div');
                quoteBox.className = 'msg-quoted-preview';
                var quoteAuthor = document.createElement('div');
                quoteAuthor.className = 'msg-quoted-author';
                quoteAuthor.textContent = '引用 ' + String(msg.quote.authorName || '原消息');
                var quoteText = document.createElement('div');
                quoteText.className = 'msg-quoted-text';
                quoteText.textContent = String(msg.quote.text);
                quoteBox.appendChild(quoteAuthor);
                quoteBox.appendChild(quoteText);
                bubble.insertBefore(quoteBox, bubble.firstChild);
            }

            // 译文小字（AI 翻译结果落库后随消息一起渲染）
            // 若 parseReplyContent 已经从 [中译:] 解析出翻译条（双语聊天模式），就不重复挂手动翻译
            if (msg.translation && !bubble.querySelector('.msg-translation')) {
                const trEl = document.createElement('div');
                trEl.className = 'msg-translation';
                trEl.textContent = String(msg.translation);
                bubble.appendChild(trEl);
            }

            if (isError) {
                // 黑白灰规范：系统提示为浅灰底深灰字
                bubble.style.backgroundColor = '#F2F2F7';
                bubble.style.color = '#666666';
            }

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            if (isSent) {
                fillAvatar(avatar, getMyAvatar(), USER_SVG);
            } else if (isError) {
                avatar.textContent = '!';
                avatar.style.backgroundColor = '#E5E5EA';
                avatar.style.color = '#666666';
            } else {
                fillAvatar(avatar, currentCharacter.avatar, USER_SVG);
            }

            // 群聊：AI 成员回复在气泡上方显示成员名（逐条落库的后续气泡不重复显示）
            if (isGroupChat && !isSent && !isError && msg.name && !(Number(msg.bubbleIndex) > 0)) {
                const nameTag = document.createElement('div');
                nameTag.className = 'msg-sender';
                nameTag.textContent = msg.name;
                row.appendChild(nameTag);
            }

            if (isSent) {
                // 发送失败（拉黑）：气泡前面加红色感叹号
                if (msg.sendFailed) {
                    var failedMark = document.createElement('span');
                    failedMark.className = 'msg-send-failed';
                    failedMark.textContent = '!';
                    failedMark.title = (msg.sendFailedReason === 'missing-api-key' ? '尚未配置 API Key；消息已保存' : '消息已发出，但被对方拒收了') + '，点击重试';
                    failedMark.setAttribute('role', 'button');
                    failedMark.setAttribute('tabindex', '0');
                    var startRetry = function (event) {
                        if (event) { event.preventDefault(); event.stopPropagation(); }
                        if (typeof window.retryFailedMessage === 'function') {
                            window.retryFailedMessage(row.dataset.mid, msg.time);
                        }
                    };
                    failedMark.addEventListener('click', startRetry);
                    failedMark.addEventListener('keydown', function (event) {
                        if (event && (event.key === 'Enter' || event.key === ' ')) startRetry(event);
                    });
                    row.appendChild(failedMark);
                }
                row.appendChild(attachEl);
                row.appendChild(avatar);
            } else {
                row.appendChild(avatar);
                row.appendChild(attachEl);
            }

            host.appendChild(row);
            // AI 消息的思维链块/旁白块/额外气泡：主 row 之后追加，保证正确渲染顺序
            if (typeof _pendingExtras !== 'undefined') {
                _pendingExtras.forEach(function (el) { host.appendChild(el); });
            }
        }

        // 多气泡回复逐条呈现。消息已经先完整落库；这里仅控制当前页面的显示节奏。
        // 使用 DocumentFragment 复用原渲染器，避免复制气泡、旁白、群成员名和译文的 DOM 规则。
        let aiBubblePacingRunId = 0;
        async function appendMessageNodesWithPacing(nodes) {
            const rowCount = nodes.filter(function (node) {
                return node.nodeType === 1 && node.classList && node.classList.contains('msg-row');
            }).length;

            const runId = ++aiBubblePacingRunId;
            const presencePolicy = window.ChatPresencePolicy;
            let reduceMotion = false;
            try {
                reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            } catch (e) {}

            if (rowCount < 2 || reduceMotion ||
                !presencePolicy || typeof presencePolicy.getBubbleDelayMs !== 'function') {
                for (let i = 0; i < nodes.length; i++) chatMessages.appendChild(nodes[i]);
                scrollToBottom(true);
                return;
            }

            let shownRows = 0;
            let previousText = '';
            for (let i = 0; i < nodes.length; i++) {
                const node = nodes[i];
                const isMessageRow = node.nodeType === 1 && node.classList && node.classList.contains('msg-row');

                // 只有下一条独立消息前才停顿；旁白节点沿用原有顺序，不额外制造空等。
                if (isMessageRow && shownRows > 0) {
                    const delay = presencePolicy.getBubbleDelayMs(previousText);
                    await new Promise(function (resolve) { setTimeout(resolve, delay); });
                }

                // 全量重渲染发生时取消尚未显示的旧节点，防止重复气泡。
                if (runId !== aiBubblePacingRunId) return;

                if (isMessageRow) {
                    node.classList.add('chat-bubble-arrive');
                    const bubble = node.querySelector('.msg-bubble');
                    previousText = bubble ? bubble.textContent : '';
                    shownRows += 1;
                }

                chatMessages.appendChild(node);
                scrollToBottom(true);
            }
        }
        async function appendAiMessageWithPacing(msg, idx) {
            const fragment = document.createDocumentFragment();
            appendMessageToDOM(msg, idx, fragment);
            await appendMessageNodesWithPacing(Array.prototype.slice.call(fragment.childNodes));
        }
        // 逐条落库后的一次回复可能包含多条消息，仍需保留逐条出现的节奏。
        async function appendReplyMessagesWithPacing(messages, startIdx) {
            const fragment = document.createDocumentFragment();
            messages.forEach(function (message, offset) {
                appendMessageToDOM(message, startIdx + offset, fragment);
            });
            await appendMessageNodesWithPacing(Array.prototype.slice.call(fragment.childNodes));
        }

        // ================= 虚拟列表（P3）：长会话窗口化渲染 =================
        // 仅当可见消息数 > VL_THRESHOLD 时启用；URL 参数 ?vl=1 强制开启、?vl=0 强制关闭（调试/安全开关）。
        // 把已全量载入内存的 visibleList 按滚动位置窗口化：DOM 中只保留视口附近 ± buffer 的行，
        // 其余用上下两个 .vl-spacer 占位撑起滚动高度。每行高度在渲染后实测回填，spacer 随之修正。
        // 收益：流式打字期间每帧只需重排「窗口大小」个节点（而非全部 N 个），彻底消除 2000 条时的掉帧；
        //       首屏/重渲染也只构建可见窗口，渲染耗时与消息总量解耦。
        // 设计要点：① 复用 appendMessageToDOM，不改动其任何消息类型/多气泡展开逻辑；
        //          ② 每个消息整块包进 .vl-item（fragment→wrap 技巧），data-idx 语义与全量渲染一致；
        //          ③ 交互（长按/引用/删除/编辑）走 findByMid 查数据数组，不依赖 DOM 节点存在；
        //          ④ 仅 hl= 跳转依赖 DOM，由 vlJumpTo 先渲染目标窗口再定位解决。
        const VL_THRESHOLD = 500;
        const VL_BUFFER_ROWS = 8;   // 窗口上下各多渲染的行数，避免快速滚动露白
        const VL_TAIL_PX = 1200;    // 视口之外额外渲染的像素，配合上者形成安全缓冲

        let _vl = null;             // 虚拟列表运行时状态

        function vlShouldEnable(visibleCount) {
            const force = new URLSearchParams(location.search).get('vl');
            if (force === '1') return true;
            if (force === '0') return false;
            // 默认关闭：虚拟列表经完整回归验证后再开放自动阈值（>VL_THRESHOLD 自动启用）。
            // 当前生产会话一律走已验证的全量渲染路径，开关仅用于 ?vl=1 手动开启测试。
            return false;
        }

        // 计算可见消息列表（补齐 mid/time、剥离推理草稿、清理定位失败残留、过滤隐藏消息）。
        // 抽成独立函数，renderAllMessages 与 vlRefresh 共用，避免逻辑分叉。
        function computeVisibleList() {
            const list = loadMessages();
            let midAdded = false, reasoningRemoved = false;
            list.forEach(function (m) {
                if (!m) return;
                if (m.role === 'assistant' || m.role === 'received') {
                    var field = typeof m.text === 'string' ? 'text' : (typeof m.content === 'string' ? 'content' : '');
                    if (field) {
                        var originalText = m[field];
                        var visibleText = stripInternalReasoning(originalText);
                        if (visibleText !== originalText) { m[field] = visibleText; reasoningRemoved = true; }
                    }
                }
                if (!m.mid || !m.time) { ensureMid(m); midAdded = true; }
            });
            if (midAdded || reasoningRemoved) saveMessages(list);
            const cleaned = list.filter(m => {
                const t = String((m && (m.text || m.content)) || '');
                return !(t.indexOf('定位失败') !== -1 || t.indexOf('Timeout expired') !== -1);
            });
            if (cleaned.length !== list.length) saveMessages(cleaned);
            return cleaned.filter(m => {
                if (window.ChatMessagePolicy && typeof window.ChatMessagePolicy.isHiddenFromOnlineTimeline === 'function') {
                    return !window.ChatMessagePolicy.isHiddenFromOnlineTimeline(m);
                }
                var mt = String((m && (m.text || m.content)) || '');
                return !(m && (m.mode === 'date' || m.silent || m.arrivalStart || mt.indexOf('[语音消息]') === 0));
            });
        }

        // 复用 appendMessageToDOM：先塞进 fragment，再整块移入 .vl-item 容器（不修改原函数）。
        function vlBuildItem(m, idx) {
            const frag = document.createDocumentFragment();
            appendMessageToDOM(m, idx, frag);
            const wrap = document.createElement('div');
            wrap.className = 'vl-item';
            wrap.dataset.idx = idx;
            wrap.appendChild(frag);
            return wrap;
        }

        // 行高策略：首屏一次性在「离屏、与聊天等宽」的容器里构建全部消息并测高，存入 heights[]。
        // 之后窗口化渲染、滚动定位、hl= 跳转全部基于精确 heights，无估计误差、无抖动/漂移。
        // 动态变更（流式收尾/新消息/删除）走增量测量（仅测尾部或重测当前窗口），不整表重测。
        function vlMeasureRange(list, from, to) {
            const probe = document.createElement('div');
            const w = (chatMessages.clientWidth || 390);
            probe.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;width:' + w + 'px;';
            document.body.appendChild(probe);
            for (let i = from; i < to; i++) probe.appendChild(vlBuildItem(list[i], i));
            const nodes = probe.children;
            const out = [];
            for (let i = 0; i < nodes.length; i++) out.push(nodes[i].getBoundingClientRect().height || 64);
            document.body.removeChild(probe);
            return out;
        }
        function vlMeasureAll(list) { return vlMeasureRange(list, 0, list.length); }

        function vlCum(from, to) {
            const h = _vl.heights;
            let s = 0;
            for (let i = from; i < to; i++) s += h[i] || 64;
            return s;
        }

        // 根据当前 scrollTop 计算应渲染的窗口 [start, end)
        function vlComputeWindow(scrollTop) {
            const h = _vl.heights, n = _vl.list.length, vp = chatMessages.clientHeight;
            let acc = 0, start = 0;
            while (start < n && acc + (h[start] || 64) <= scrollTop) { acc += (h[start] || 64); start++; }
            start = Math.max(0, start - VL_BUFFER_ROWS);
            let end = start, bottom = 0;
            const need = vp + VL_TAIL_PX;
            while (end < n && bottom < need) { bottom += (h[end] || 64); end++; }
            end = Math.min(n, end + VL_BUFFER_ROWS);
            return { start, end };
        }

        function vlPaint() {
            const { list, heights, start, end, win, topSpacer, botSpacer } = _vl;
            const frag = document.createDocumentFragment();
            for (let i = start; i < end; i++) frag.appendChild(vlBuildItem(list[i], i));
            win.innerHTML = '';
            win.appendChild(frag);
            topSpacer.style.height = vlCum(0, start) + 'px';
            botSpacer.style.height = vlCum(end, list.length) + 'px';
            _vl.start = start; _vl.end = end;
            vlScheduleMeasure();
        }

        // 渲染后实测当前窗口各行真实高度，回填 heights（修正动态内容如图片加载/流式收尾带来的变化）；
        // 仅当变化发生在「当前视口之上」时补偿 scrollTop，避免跳动。因首屏已全量测高，[0,start) 通常不变，故无漂移。
        let _vlMeasurePending = false;
        function vlScheduleMeasure() {
            if (_vlMeasurePending) return;
            _vlMeasurePending = true;
            requestAnimationFrame(function () {
                _vlMeasurePending = false;
                if (!_vl) return;
                const items = _vl.win.children;
                let delta = 0, changed = false;
                for (let k = 0; k < items.length; k++) {
                    const idx = +items[k].dataset.idx;
                    const h = items[k].getBoundingClientRect().height;
                    if (!h) continue;
                    const old = _vl.heights[idx] || 64;
                    if (Math.abs(h - old) > 0.5) {
                        if (vlCum(0, idx) < chatMessages.scrollTop) delta += (h - old);
                        _vl.heights[idx] = h; changed = true;
                    }
                }
                if (!changed) return;
                _vl.topSpacer.style.height = vlCum(0, _vl.start) + 'px';
                _vl.botSpacer.style.height = vlCum(_vl.end, _vl.list.length) + 'px';
                // 跳转过程中不补偿 scrollTop：否则会抵消跳转、把视口拉回原位。
                if (!_vl.jumping && delta) chatMessages.scrollTop += delta;
            });
        }

        function vlRenderToBottom() {
            const n = _vl.list.length, h = _vl.heights, vp = chatMessages.clientHeight;
            let acc = 0, start = n;
            while (start > 0 && acc < vp + VL_TAIL_PX) { start--; acc += (h[start] || 64); }
            start = Math.max(0, start - VL_BUFFER_ROWS);
            _vl.start = start; _vl.end = n;
            vlPaint();
            // 布局稳定后再滚到底（rAF 后 spacer 已就位）。若存在待处理的 hl= 跳转，则跳转而非回底。
            requestAnimationFrame(function () {
                if (!_vl) return;
                if (_vl.pendingJump != null) { const j = _vl.pendingJump; _vl.pendingJump = null; vlJumpTo(j); }
                else chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function vlInit(list) {
            if (typeof stopVoicePlay === 'function') { try { stopVoicePlay(); } catch (e) {} }
            chatMessages.innerHTML = '';
            const top = document.createElement('div'); top.className = 'vl-spacer vl-top';
            const win = document.createElement('div'); win.className = 'vl-win';
            const bot = document.createElement('div'); bot.className = 'vl-spacer vl-bot';
            chatMessages.appendChild(top); chatMessages.appendChild(win); chatMessages.appendChild(bot);
            _vl = {
                list: list,
                heights: vlMeasureAll(list),
                start: 0, end: 0,
                topSpacer: top, botSpacer: bot, win: win,
                streaming: false,
                jumping: false,
                pendingJump: null,
            };
            vlRenderToBottom();
        }

        // 重渲染到最新（发送/删除/插入等）：增量处理高度，避免每次 O(N) 整表重测。
        // 长度增长（追加/流式开始）→ 仅测新增尾部；长度缩短（删除）→ 重测全表（低频）；等长（原地改写）→ 重测全表修正变化项。
        function vlRefresh() {
            if (!_vl) return;
            const list = computeVisibleList();
            const oldLen = _vl.heights.length;
            const newLen = list.length;
            if (newLen > oldLen) {
                const tail = vlMeasureRange(list, oldLen, newLen);
                const merged = _vl.heights.slice(0, oldLen);
                for (let i = oldLen; i < newLen; i++) merged[i] = tail[i - oldLen];
                _vl.heights = merged;
            } else {
                _vl.heights = vlMeasureAll(list);
            }
            _vl.list = list;
            const atBottom = (chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight) < 4;
            if (atBottom) vlRenderToBottom();
            else { const w = vlComputeWindow(chatMessages.scrollTop); _vl.start = w.start; _vl.end = w.end; vlPaint(); }
        }

        // 流式收尾：仅重测最后一条（内容定稿，高度可能变化），O(1) 而非整表重测，避免逐条回复时的卡顿尖峰。
        function vlFinalizeLast() {
            if (!_vl || !_vl.list.length) return;
            const i = _vl.list.length - 1;
            _vl.heights[i] = vlMeasureRange(_vl.list, i, i + 1)[0] || _vl.heights[i] || 64;
            const atBottom = (chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight) < 4;
            if (atBottom) vlRenderToBottom();
            else { const w = vlComputeWindow(chatMessages.scrollTop); _vl.start = w.start; _vl.end = w.end; vlPaint(); }
        }

        // hl= 跳转：先把目标窗口渲染出来，再用「已渲染元素」的精确几何位置把该行居中滚入视口。
        // 跳转期间挂起 vlOnScroll 重排与 scrollTop 补偿，使目标窗口稳定在 DOM 中；place() 多帧自收敛（即使
        // 首屏测高与后续渲染上下文略有差异，也能在数帧内落到精确位置），收敛后恢复滚动响应。
        function vlJumpTo(idx) {
            if (!_vl || idx < 0 || idx >= _vl.list.length) return;
            _vl.jumping = true;
            _vl.start = Math.max(0, idx - VL_BUFFER_ROWS);
            _vl.end = Math.min(_vl.list.length, idx + VL_BUFFER_ROWS + 1);
            vlPaint();
            let guard = 0;
            const place = function () {
                if (!_vl) return;
                const el = _vl.win.querySelector('.vl-item[data-idx="' + idx + '"]');
                if (!el) { if (guard++ < 6) requestAnimationFrame(place); else _vl.jumping = false; return; }
                const topOff = parseFloat(_vl.topSpacer.style.height) || 0;
                const winRect = _vl.win.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                const within = elRect.top - winRect.top; // 元素相对窗口顶的偏移（与容器滚动无关）
                const target = topOff + within - (chatMessages.clientHeight - elRect.height) / 2;
                chatMessages.scrollTop = Math.max(0, target);
                if (guard++ < 6) requestAnimationFrame(place);
                else _vl.jumping = false;
            };
            place();
            requestAnimationFrame(place);
        }

        let _vlScrollRaf = 0;
        function vlOnScroll() {
            if (_vlScrollRaf) return;
            _vlScrollRaf = requestAnimationFrame(function () {
                _vlScrollRaf = 0;
                if (!_vl || _vl.streaming || _vl.jumping) return; // 流式/跳转期间不重排窗口
                const w = vlComputeWindow(chatMessages.scrollTop);
                // 必须先写回 _vl.start/_vl.end：vlPaint 内部读取这两个字段决定渲染窗口，
                // 否则会重绘旧窗口（此前 bug：滚动后窗口不刷新，始终停在底部）。
                if (w.start !== _vl.start || w.end !== _vl.end) {
                    _vl.start = w.start; _vl.end = w.end;
                    vlPaint();
                }
            });
        }

        window.__vlDebug = function () { if (!_vl) return null; return { start: _vl.start, end: _vl.end, est: Math.round(_vl.est), st: _vl.scrollTopBefore ? Math.round(_vl.scrollTopBefore) : null, pending: _vl.pendingJump, scrollTop: Math.round(chatMessages.scrollTop), max: Math.round(chatMessages.scrollHeight - chatMessages.clientHeight) }; };

        function renderAllMessages() {
            // 清空或全量重绘时终止尚未完成的逐条气泡呈现。
            aiBubblePacingRunId += 1;
            // 有语音播放动画在跑就先掐断——气泡会被整批替换，旧节点已失效。
            if (typeof stopVoicePlay === 'function') stopVoicePlay();
            const visibleList = computeVisibleList();
            // Fix A 配套（P3）：长会话走虚拟列表，避免 O(N) 全量 DOM 重建
            if (vlShouldEnable(visibleList.length)) {
                vlInit(visibleList);
                return;
            }
            chatMessages.innerHTML = `<div class="message-time">Just now</div>`;
            // 批量插入：先在 DocumentFragment 里离屏组装，再一次挂到文档。
            // 原来是逐条 appendChild 到 live DOM，N 条消息 = N 次潜在重排；
            // 长对话里这是"每收到一条回复就卡一下"的主要来源。
            var frag = document.createDocumentFragment();
            visibleList.forEach(function (m, i) { appendMessageToDOM(m, i, frag); });
            chatMessages.appendChild(frag);
            scrollToBottom(true);
        }

        // ================= 搜索页跳转定位：读取 URL 的 hl=<序号>，滚动并闪烁提示 =================
        function highlightMessageFromUrl() {
            const hl = parseInt(new URLSearchParams(window.location.search).get('hl'), 10);
            if (isNaN(hl) || hl < 0) return;
            // 虚拟列表模式：目标行此刻未必在 DOM 中，先渲染其所在窗口再定位。
            // 同时记录 pendingJump，避免 vlRenderToBottom 的「回底」rAF 覆盖本次跳转。
            if (_vl) {
                _vl.pendingJump = hl;
                vlJumpTo(hl);
                requestAnimationFrame(function () {
                    const target = _vl.win.querySelector('.msg-row[data-idx="' + hl + '"] .msg-bubble');
                    if (target) {
                        target.classList.add('hl-flash');
                        setTimeout(function () { target.classList.remove('hl-flash'); }, 1900);
                    }
                });
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('hl');
                    window.history.replaceState(null, '', url.toString());
                } catch (e) {}
                return;
            }
            const target = chatMessages.querySelector('.msg-row[data-idx="' + hl + '"] .msg-bubble');
            if (!target) return;
            // 等渲染布局完成后滚动到视口中部
            setTimeout(function () {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.classList.add('hl-flash');
                setTimeout(function () { target.classList.remove('hl-flash'); }, 1900);
            }, 120);
            // 消费后清掉定位参数，避免刷新重复闪烁
            try {
                const url = new URL(window.location.href);
                url.searchParams.delete('hl');
                window.history.replaceState(null, '', url.toString());
            } catch (e) {}
        }

        // ================= 读取 API 配置（纯 localStorage，不再编辑） =================
        const API_STORAGE_KEY = 'api_settings';

        function getAiConfig() {
            try {
                const raw = localStorage.getItem(API_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed) return parsed;
                }
            } catch (e) {}
            return {};
        }

        function sendMessage() {
            sendMsg();
        }

        // ---- AI 主动通话标记：从回复文本中剥离 [发起语音通话] ----
        const VOICE_CALL_MARKER = '[发起语音通话]';
        function extractVoiceCallMarker(raw) {
            const text = String(raw || '');
            const idx = text.indexOf(VOICE_CALL_MARKER);
            if (idx === -1) return { text: text, wantCall: false };
            // 移除标记，并清理遗留的行尾空白与多余空行
            const cleaned = (text.slice(0, idx) + text.slice(idx + VOICE_CALL_MARKER.length))
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, wantCall: true };
        }
        // 命中标记：在 AI 侧（左侧）插入一张黑底白字「发起语音通话」卡，并写入聊天记录
        // historyList 是 sendMsg 内的局部变量，由调用方传入
        function insertIncomingCallCard(historyList) {
            const cardMsg = {
                role: 'assistant', type: 'call',
                call: { type: 'voice', title: '发起语音通话', text: '', theme: 'dark' },
                time: Date.now()
            };
            var previousLength = historyList.length;
            historyList.push(cardMsg);
            if (!saveMessages(historyList)) {
                historyList.length = previousLength;
                if (typeof showToast === 'function') showToast('来电卡没有保存到聊天记录，未自动进入通话');
                return false;
            }
            if (_vl) {
                vlRefresh();
            } else {
                appendMessageToDOM(cardMsg);
                scrollToBottom(true);
            }
            return true;
        }
        // 自动来电：仅当该角色独立开关 chat_auto_call_<roleId> 为 'true' 时，延迟 1.5s 进入来电页
        // 关闭（false/null/脏值）时只保留卡片，绝不跳转
        function maybeAutoIncomingCall() {
            let enabled = false;
            try {
                enabled = localStorage.getItem('chat_auto_call_' + aliasRoleId) === 'true';
            } catch (e) { enabled = false; }
            if (!enabled) return;
            setTimeout(function () {
                window.location.href = '../call/call-ui.html?roleId=' + encodeURIComponent(aliasRoleId) + '&type=incoming';
            }, 1500);
        }

        // ---- AI 虚拟图片标记：从回复文本中剥离 [图片:描述]（前端渲染灰底占位图，不接受任何图片链接/代码） ----
        const VIMG_MARKER_REGEX = /\[图片[:：]([^\]]{1,80})\]/g;
        function extractVImageMarkers(raw) {
            const text = String(raw || '');
            const images = [];
            let m;
            VIMG_MARKER_REGEX.lastIndex = 0;
            while ((m = VIMG_MARKER_REGEX.exec(text)) !== null) {
                const desc = String(m[1] || '').trim();
                if (desc) images.push(desc);
            }
            const cleaned = text.replace(VIMG_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, images: images };
        }

        // ---- AI 心声标记：从回复文本中剥离 [心声:内容]（前端渲染浅灰心声卡，与正常台词区分） ----
        const HEART_MARKER_REGEX = /\[心声[:：]([^\]]{1,200})\]/g;
        function extractHeartMarkers(raw) {
            const text = String(raw || '');
            const hearts = [];
            let m;
            HEART_MARKER_REGEX.lastIndex = 0;
            while ((m = HEART_MARKER_REGEX.exec(text)) !== null) {
                const say = String(m[1] || '').trim();
                if (say) hearts.push(say);
            }
            const cleaned = text.replace(HEART_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, hearts: hearts };
        }

        // 虚拟图片落库：role=assistant + type=image（无 img 走占位图渲染），text 让 AI 后续也能"记得"发过图
        function insertVImageCards(historyList, descs) {
            var descriptions = Array.isArray(descs) ? descs : [];
            if (!descriptions.length) return true;
            var previousLength = historyList.length;
            var cards = descriptions.map(function (description) {
                return {
                    role: 'assistant',
                    type: 'image',
                    desc: description,
                    text: '[图片] ' + description,
                    time: Date.now()
                };
            });
            Array.prototype.push.apply(historyList, cards);
            if (!saveMessages(historyList)) {
                historyList.length = previousLength;
                if (typeof showToast === 'function') showToast('图片消息没有保存到聊天记录，请检查本地存储空间');
                return false;
            }
            if (_vl) {
                vlRefresh();
            } else {
                cards.forEach(function (card, offset) {
                    appendMessageToDOM(card, previousLength + offset);
                });
            }
            scrollToBottom(true);
            return true;
        }

        // 心声卡日期格式化：2026年6月28日 14:30（iOS 备忘录风格）
        function formatHeartTime(ts) {
            var d = new Date(ts || Date.now());
            var y = d.getFullYear();
            var mo = d.getMonth() + 1;
            var da = d.getDate();
            var hh = d.getHours();
            var mm = d.getMinutes();
            return y + '年' + mo + '月' + da + '日 ' + (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
        }

        // 心声落库：role=assistant + type=heart（text 即心声内容，会进入 AI 上下文）
        function insertHeartCards(historyList, texts) {
            (texts || []).forEach(function (t) {
                // 心声不再自动弹到聊天流里，存到 localStorage 供点头像查看
                try {
                    var key = 'latest_heart_' + currentRoleId;
                    localStorage.setItem(key, t);
                } catch (e) {}
            });
        }

        // ---- AI 主动赠送标记：从回复文本中剥离 [红包:金额:留言] / [转账:金额:留言] ----
        const PAY_MARKER_REGEX = /\[(红包|转账):(\d+(?:\.\d{1,2})?):([^\]]*)\]/g;
        function extractPayMarkers(raw) {
            const text = String(raw || '');
            const items = [];
            let m;
            PAY_MARKER_REGEX.lastIndex = 0;
            while ((m = PAY_MARKER_REGEX.exec(text)) !== null) {
                const type = m[1] === '转账' ? 'transfer' : 'redpacket';
                const amountNum = Number(m[2]);
                if (isFinite(amountNum) && amountNum > 0) {
                    items.push({
                        type: type,
                        amount: amountNum.toFixed(2),
                        message: m[3] ? m[3].trim() : (type === 'redpacket' ? '恭喜发财，大吉大利' : '')
                    });
                }
            }
            const cleaned = text.replace(PAY_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, items: items };
        }
        // ---- 转账决策标记：角色收下转账时更新对应卡片 ----
        const TRANSFER_ACCEPT_MARKER_REGEX = /\[收下转账:(\d+(?:\.\d{1,2})?)\]/g;
        function extractTransferDecisionMarkers(raw) {
            const text = String(raw || '');
            const amounts = [];
            let match;
            TRANSFER_ACCEPT_MARKER_REGEX.lastIndex = 0;
            while ((match = TRANSFER_ACCEPT_MARKER_REGEX.exec(text)) !== null) {
                const amount = Number(match[1]);
                if (isFinite(amount) && amount > 0) amounts.push(amount);
            }
            return {
                text: text.replace(TRANSFER_ACCEPT_MARKER_REGEX, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trimEnd(),
                amounts: amounts
            };
        }
        function applyTransferDecisionMarkers(historyList, amounts) {
            var snapshots = [];
            if (!Array.isArray(historyList) || !Array.isArray(amounts) || !amounts.length) return snapshots;
            amounts.forEach(function (amount) {
                for (var i = historyList.length - 1; i >= 0; i--) {
                    var previous = historyList[i];
                    if (previous && (previous.role === 'user' || previous.role === 'sent') &&
                        previous.type === 'transfer' && (!previous.status || previous.status === 'unopened') &&
                        Number(previous.amount) === Number(amount)) {
                        snapshots.push({
                            message: previous,
                            status: previous.status,
                            acceptedAt: previous.acceptedAt
                        });
                        previous.status = 'accepted';
                        previous.acceptedAt = Date.now();
                        break;
                    }
                }
            });
            return snapshots;
        }
        function rollbackTransferDecisionMarkers(snapshots) {
            (Array.isArray(snapshots) ? snapshots : []).forEach(function (snapshot) {
                if (!snapshot || !snapshot.message) return;
                if (snapshot.status == null) delete snapshot.message.status;
                else snapshot.message.status = snapshot.status;
                if (snapshot.acceptedAt == null) delete snapshot.message.acceptedAt;
                else snapshot.message.acceptedAt = snapshot.acceptedAt;
            });
        }

        // ---- 角色赠予亲属卡/亲密付：解析后只保存结构化虚拟额度，不涉及真实支付 ----
        const ROLE_FAMILY_CARD_MARKER_REGEX = /\[(亲属卡|亲密付):(\d+(?:\.\d{1,2})?):(\d+(?:\.\d{1,2})?):([^\]]{0,160})\]/g;
        const ROLE_FAMILY_CARD_ADJUST_REGEX = /\[调整(?:亲属卡|亲密付):(\d+(?:\.\d{1,2})?):(\d+(?:\.\d{1,2})?):([^\]]{0,160})\]/g;
        const ROLE_FAMILY_CARD_REVOKE_REGEX = /\[撤销(?:亲属卡|亲密付)\]/g;
        function extractRoleFamilyCardMarkers(raw) {
            var text = String(raw || '');
            var cards = [];
            var changes = [];
            var match;
            ROLE_FAMILY_CARD_MARKER_REGEX.lastIndex = 0;
            while ((match = ROLE_FAMILY_CARD_MARKER_REGEX.exec(text)) !== null) {
                var monthly = Number(match[2]);
                var single = Number(match[3]);
                if (isFinite(monthly) && monthly > 0 && isFinite(single) && single > 0) {
                    cards.push({
                        kind: match[1] === '亲密付' ? 'intimate' : 'family',
                        monthlyLimit: Math.min(1000000, monthly),
                        singleLimit: Math.min(1000000, single),
                        note: String(match[4] || '').trim().slice(0, 160)
                    });
                }
            }
            text = text.replace(ROLE_FAMILY_CARD_MARKER_REGEX, '');
            ROLE_FAMILY_CARD_ADJUST_REGEX.lastIndex = 0;
            while ((match = ROLE_FAMILY_CARD_ADJUST_REGEX.exec(text)) !== null) {
                var newMonthly = Number(match[1]);
                var newSingle = Number(match[2]);
                if (isFinite(newMonthly) && newMonthly > 0 && isFinite(newSingle) && newSingle > 0) {
                    changes.push({
                        action: 'adjust',
                        monthlyLimit: Math.min(1000000, newMonthly),
                        singleLimit: Math.min(1000000, newSingle),
                        note: String(match[3] || '').trim().slice(0, 160)
                    });
                }
            }
            text = text.replace(ROLE_FAMILY_CARD_ADJUST_REGEX, '');
            ROLE_FAMILY_CARD_REVOKE_REGEX.lastIndex = 0;
            if (ROLE_FAMILY_CARD_REVOKE_REGEX.test(text)) changes.push({ action: 'revoke' });
            text = text.replace(ROLE_FAMILY_CARD_REVOKE_REGEX, '');
            return {
                text: text.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/\s+$/, ''),
                cards: cards,
                changes: changes
            };
        }

        function applyRoleFamilyCardChanges(changes) {
            if (!Array.isArray(changes) || !changes.length || isGroupChat ||
                !window.RoleFamilyCards || typeof window.RoleFamilyCards.applyRoleChange !== 'function') return false;

        // ---- 自动记忆标记：[记住:xxx] 从 AI 回复中剥离，存进 user_memory ----
        const MEM_MARKER_REGEX = /\[记住:([^\]]+)\]/g;
        function extractMemoryMarkers(raw) {
            if (window.ChatMessagePolicy && typeof window.ChatMessagePolicy.extractMemoryMarkers === 'function') {
                return window.ChatMessagePolicy.extractMemoryMarkers(raw);

            // Compatibility fallback: preserve the original extraction and cleanup behavior.

            const memories = [];
            let m;
            MEM_MARKER_REGEX.lastIndex = 0;
            while ((m = MEM_MARKER_REGEX.exec(text)) !== null) {
                const content = m[1] && m[1].trim();
                if (content) memories.push(content);
            }
            const cleaned = text.replace(MEM_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')

        function saveUserMemories(memories) {

        // 命中红包/转账标记：在 AI 侧插入对应卡片并落库，role='assistant' 可被用户领取
        function insertPayCards(historyList, items) {

        // ===== AI 回复清洗：只做标点/空白收口，不删任何正文内容 =====
        // 之前按文字内容删的规则（动作描写/烂俗比喻/爹味/AI 废话）已全部撤回
        // 只保留：多空格压缩、行首行尾空白、连续标点合并、句首句尾残迹清理
        function applyAICleanup(text) {
            if (!text) return text;
            var out = String(text);
            // 1) 空白整理
            out = out.replace(/[ \t]+\n/g, '\n')
                     .replace(/\n[ \t]+/g, '\n')
                     .replace(/[ \t]{2,}/g, ' ')
                     .trim();
            // 2) 连续句号/问号/感叹号/逗号压成一个
            out = out.replace(/([。！？])\1+/g, '$1')
                     .replace(/，{2,}/g, '，');
            // 3) 逗号紧跟句末标点 / 句末标点紧跟逗号 → 去掉多余的逗号
            out = out.replace(/，([。！？])/g, '$1')
                     .replace(/([。！？])，/g, '$1');
            // 4) 句首句尾残留标点（只清逗号/句号/顿号，保留 ？！…）
            out = out.replace(/^[ \t，。、]+/, '')
                     .replace(/[ \t，、]+$/, '')
                     .trim();
            // 5) 用户在设置页自定义的规则（enabled:true 才跑）——保留入口，但不再硬编码删内容
            try {
                var userRules = JSON.parse(localStorage.getItem('regex_rules') || '[]');
                if (Array.isArray(userRules)) {
                    userRules.forEach(function (r) {
                        if (!r || !r.enabled || !r.pattern) return;
                        try { out = out.replace(new RegExp(r.pattern, 'g'), r.replacement || ''); } catch (e) {}
                    });
                }
            } catch (e) {}
            // 5b) 用户规则删完内容后可能留下 "。，。，" 这种句子边界标点残迹
            // 只清理：连续重复标点、逗号紧跟句号/句号紧跟逗号的组合；正常内部逗号不动
            out = out.replace(/([。！？])\1+/g, '$1')          // 。。。 → 。
                     .replace(/，{2,}/g, '，')                 // ，，， → ，
                     .replace(/，([。！？])/g, '$1')           // ，。 → 。
                     .replace(/([。！？])，/g, '$1')           // 。， → 。
                     .replace(/([。！？])([。！？])+/g, '$1');  // 。？。？ → 第一个
            // 6) 末尾如果是中文且无标点，补一个句号
            if (out && /[\u4e00-\u9fa5]$/.test(out)) {
                out += '。';
            }
            // 7) 兜底：末尾连续标点只留一个
            out = out.replace(/([。！？])\1+$/, '$1');
            return out;
        }


        // API 调用记录 — 委托 PhoneStorage
        var _storage = window.PhoneStorage;
