<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width:100%; height:100%; margin:0; background:#F7F7F9; color:#111; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; }
  body { overflow:hidden; }
  button, textarea { font:inherit; }
  .phone { width:min(430px,100vw); height:100dvh; min-height:0; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; background:#F7F7F9; position:relative; }
  .status-bar { flex:0 0 auto; height:42px; padding:13px 22px 0; font-size:12px; font-weight:650; background:rgba(247,247,249,.94); }
  .topbar { flex:0 0 auto; min-height:54px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 16px 8px; border-bottom:1px solid #E8E8EB; background:rgba(247,247,249,.94); }
  .topbar button { border:0; background:transparent; color:#222; padding:8px 2px; font-size:12px; cursor:pointer; }
  .topbar-actions { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .title-block { min-width:0; text-align:center; }
  .title { font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px; }
  .subtitle { margin-top:3px; color:#999; font-size:10px; }
  .notice { flex:0 0 auto; padding:8px 15px; border-bottom:1px solid #ECECEF; color:#8A8A90; font-size:10px; line-height:1.55; background:#F7F7F9; }
  .messages { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:16px 14px 20px; display:flex; flex-direction:column; gap:11px; scrollbar-width:thin; }
  .empty { margin:auto; max-width:240px; text-align:center; color:#A0A0A5; font-size:12px; line-height:1.8; padding:25px 10px; }
  .history-action { flex:0 0 auto; padding:8px 12px 0; text-align:center; background:#F7F7F9; }
  .history-action button { border:1px solid #E2E2E6; border-radius:999px; background:#fff; color:#666; padding:7px 15px; font-size:10px; }
  .history-action button:disabled { opacity:.5; }
  .msg-row { display:flex; flex-direction:column; align-items:flex-start; max-width:84%; gap:4px; }
  .msg-row.mine { align-self:flex-end; align-items:flex-end; }
  .bubble { padding:10px 13px; border-radius:16px 16px 16px 4px; border:1px solid #E9E9ED; background:#fff; color:#171717; font-size:13px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 5px rgba(0,0,0,.025); }
  .mine .bubble { color:#fff; background:#171717; border-color:#171717; border-radius:16px 16px 4px 16px; }
  .msg-meta { color:#A0A0A5; font-size:9px; padding:0 3px; }
  .message-tools { display:flex; align-items:center; gap:6px; min-height:22px; }
  .message-more { border:0; background:transparent; color:#999; font-size:15px; line-height:1; padding:2px 5px; cursor:pointer; }
  .message-menu { display:flex; align-items:center; gap:5px; }
  .message-menu[hidden] { display:none; }
  .message-hide { border:1px solid #E5E5E9; border-radius:999px; background:#fff; color:#555; font-size:9px; padding:4px 8px; cursor:pointer; }
  .pending .bubble { opacity:.62; }
  .pending .message-tools { display:none; }
  .composer { flex:0 0 auto; display:flex; align-items:flex-end; gap:9px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid #E8E8EB; background:rgba(255,255,255,.94); }
  .input-wrap { flex:1; min-width:0; background:#F2F2F5; border:1px solid #E9E9ED; border-radius:18px; padding:9px 12px; }
  textarea { display:block; resize:none; width:100%; max-height:116px; min-height:22px; outline:none; border:0; background:transparent; color:#111; font-size:13px; line-height:1.55; }
  textarea::placeholder { color:#A0A0A5; }
  .send { flex:0 0 auto; width:42px; height:42px; border:0; border-radius:50%; background:#111; color:#fff; font-size:12px; font-weight:650; cursor:pointer; }
  .send:disabled { opacity:.35; cursor:default; }
  .status { min-height:16px; padding:0 14px 7px; color:#999; background:#fff; font-size:10px; line-height:1.4; }
  .status.error { color:#8B3030; }
  @media (min-width:600px) { body { background:#E6E6E9; } .phone { height:min(900px,100dvh); box-shadow:0 12px 55px rgba(0,0,0,.1); } }
</style>
<link rel="stylesheet" href="../../shared/css/mobile-fit.css">

<body>
<div class="phone">
  <div class="status-bar">09:41</div>
  <header class="topbar">
    <button type="button" id="backBtn">‹ 返回</button>
    <div class="title-block">
      <div class="title" id="friendName">真人好友</div>
      <div class="subtitle">MAOMAO · DIRECT CHAT</div>
    </div>
    <!-- 低频管理操作不放在聊天窗口表面；聊天同步由后台自动完成。 -->
  </header>
  <div class="notice">消息保存在 MAOMAO 云端，尚未端到端加密。隐藏或清空只影响你自己的账号，好友仍保留原记录。</div>
  <div class="history-action" id="historyAction" hidden><button type="button" id="loadOlderBtn">载入更早的消息</button></div>
  <main class="messages" id="messages" aria-live="polite">
    <div class="empty" id="emptyState">正在连接好友聊天…</div>
  </main>
  <div class="status" id="statusText" role="status" aria-live="polite"></div>
  <form class="composer" id="composer">
    <div class="input-wrap"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="发送一条消息…" aria-label="消息内容"></textarea></div>
    <button class="send" id="sendBtn" type="submit" disabled>发送</button>
  </form>
</div>
<script src="../../shared/js/nav.js"></script>
<script src="../../shared/js/statusbar-control.js"></script>
<script>
(function () {
  'use strict';
  var api = window.MaomaoFriends;
  var params = new URLSearchParams(window.location.search);
  var friendId = String(params.get('friendId') || '').trim();
  var $ = function (id) { return document.getElementById(id); };
  var cursor = null;
  var olderCursor = null;
  var hasOlder = false;
  var known = Object.create(null);
  var hiddenMessageIds = Object.create(null);
  var conversationViewVersion = '';
  var conversationGenerationId = '';
  var messageViewVersion = 0;
  var pollTimer = 0;
  var pollBusy = false;
  var pollAgain = false;
  var messageScrollRevision = 0;
  var ready = false;
  var pendingSend = null;
  var blocked = false;
  var latestIncomingMessage = null;
  var lastReadReceiptId = '';
  var lastReadReceiptAt = 0;
  var readReceiptInFlight = false;
  var readReceiptRevision = 0;
  var blockedRetryAt = 0;
  var readReceiptTimer = 0;

  function setStatus(message, error) {
    $('statusText').textContent = message || '';
    $('statusText').classList.toggle('error', Boolean(error));
  }
  function formatTime(value) {
    try {
      return new Date(Number(value)).toLocaleString('zh-CN', {
        month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'
      });
    } catch (error) { return ''; }
  }
  function scrollToBottom() {
    var box = $('messages');
    box.scrollTop = box.scrollHeight;
  }
  function isNearBottom() {
    var box = $('messages');
    return box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  }

  function latestVisibleIncomingMessage() {
    var box = $('messages');
    var viewport = box.getBoundingClientRect();
    var rows = box.querySelectorAll('.msg-row[data-message-id]');
    var latest = null;
    rows.forEach(function (row) {
      if (row.dataset.senderId !== friendId || row.dataset.recipientId !== myUserId) return;
      var rect = row.getBoundingClientRect();
      if (rect.bottom <= viewport.top || rect.top >= viewport.bottom) return;
      var candidate = {
        id: row.dataset.messageId,
        createdAt: Number(row.dataset.createdAt) || 0
      };
      if (!latest ||
          candidate.createdAt > latest.createdAt ||
          (candidate.createdAt === latest.createdAt && candidate.id > latest.id)) {
        latest = candidate;
      }
    });
    return latest;
  }

  function isAfterReadCursor(message) {
    if (!message) return false;
    var createdAt = Number(message.createdAt) || 0;
    if (createdAt > lastReadReceiptAt) return true;
    if (createdAt < lastReadReceiptAt) return false;
    return String(message.id) > lastReadReceiptId;
  }
  function updateComposer() {
    $('messageInput').disabled = blocked || !ready;
    $('sendBtn').disabled = blocked || !ready || !$('messageInput').value.trim();
  }
  function showEmpty(message) {
    if (Object.keys(known).length) return;
    var node = $('emptyState');
    if (node) node.textContent = message;
    else {
      node = document.createElement('div');
      node.className = 'empty';
      node.id = 'emptyState';
      node.textContent = message;
      $('messages').appendChild(node);
    }
  }
  function removeEmpty() {
    var node = $('emptyState');
    if (node) node.remove();
  }
  function messageNode(message, pending) {
    var row = document.createElement('div');
    row.className = 'msg-row' + (message.senderId === myUserId ? ' mine' : '') + (pending ? ' pending' : '');
    row.dataset.messageId = message.id || '';
    row.dataset.senderId = message.senderId || '';
    row.dataset.recipientId = message.recipientId || '';
    row.dataset.createdAt = String(Number(message.createdAt) || 0);
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = String(message.body || '');
    var tools = document.createElement('div');
    tools.className = 'message-tools';
    var meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = formatTime(message.createdAt) + (pending ? ' · 正在发送' : '');
    tools.appendChild(meta);
    // 消息管理入口不显示在聊天气泡旁；相关能力保留在功能管理层。
    row.appendChild(bubble);
    row.appendChild(tools);
    return row;
  }
  function appendMessage(message, pending) {
    if (!message || !message.id || known[message.id] || hiddenMessageIds[message.id]) return false;
    removeEmpty();
    known[message.id] = true;
    $('messages').appendChild(messageNode(message, pending));
    return true;
  }

  function appendPendingMessage(body, clientMessageId) {
    removeEmpty();
    var node = messageNode({
      senderId: myUserId,
      body: body,
      createdAt: Date.now()
    }, true);
    node.dataset.clientMessageId = clientMessageId;
    $('messages').appendChild(node);
    scrollToBottom();
    return node;
  }
  function removePendingMessage(node) {
    if (node && node.parentNode) node.parentNode.removeChild(node);
  }
  function prependMessages(list) {
    var box = $('messages');
    var oldHeight = box.scrollHeight;
    var oldTop = box.scrollTop;
    var fragment = document.createDocumentFragment();
    var added = 0;
    (list || []).forEach(function (message) {
      if (!message || !message.id || known[message.id]) return;
      known[message.id] = true;
      fragment.appendChild(messageNode(message, false));
      added += 1;
    });
    if (added) {
      removeEmpty();
      box.insertBefore(fragment, box.firstChild);
      box.scrollTop = oldTop + (box.scrollHeight - oldHeight);
    }
  }
  function cursorFor(message) {
    return message ? String(Number(message.createdAt)) + '.' + String(message.id) : null;
  }

  function rememberIncoming(list) {
    (list || []).forEach(function (message) {
      if (!message || message.senderId !== friendId || message.recipientId !== myUserId) return;
      if (!latestIncomingMessage ||
          Number(message.createdAt) > Number(latestIncomingMessage.createdAt) ||
          (Number(message.createdAt) === Number(latestIncomingMessage.createdAt) &&
           String(message.id) > String(latestIncomingMessage.id))) {
        latestIncomingMessage = message;
      }
    });
  }

  function recomputeLatestIncomingFromDom() {
    latestIncomingMessage = null;
    var rows = $('messages').querySelectorAll('.msg-row[data-message-id]');
    rows.forEach(function (row) {
      if (row.dataset.senderId !== friendId || row.dataset.recipientId !== myUserId) return;
      var candidate = {
        id: row.dataset.messageId,
        senderId: row.dataset.senderId,
        recipientId: row.dataset.recipientId,
        createdAt: Number(row.dataset.createdAt) || 0
      };
      if (!latestIncomingMessage ||
          candidate.createdAt > Number(latestIncomingMessage.createdAt) ||
          (candidate.createdAt === Number(latestIncomingMessage.createdAt) &&
           candidate.id > latestIncomingMessage.id)) {
        latestIncomingMessage = candidate;
      }
    });
  }

  async function clearCurrentConversation() {
    if (!ready || blocked) return;
    var confirmed = window.confirm(
      '清空你这边的全部聊天记录？\n\n这只会隐藏你账号里的现有记录，好友仍会保留自己的聊天记录。之后的新消息仍会正常显示。'
    );
    if (!confirmed) return;
    $('clearChatBtn').disabled = true;
    messageViewVersion += 1;
    readReceiptRevision += 1;
    readReceiptInFlight = false;
    setStatus('正在清理你这边的聊天记录…');
    try {
      var result = await api.clearMessages(friendId, conversationGenerationId);
      $('messages').innerHTML = '';
      known = Object.create(null);
      hiddenMessageIds = Object.create(null);
      latestIncomingMessage = null;
      lastReadReceiptId = '';
      lastReadReceiptAt = 0;
      var clearedThrough = result.clearedThrough;
      cursor = clearedThrough
        ? String(Number(clearedThrough.createdAt)) + '.' + String(clearedThrough.messageId)
        : null;
      olderCursor = null;
      hasOlder = false;
      $('historyAction').hidden = true;
      showEmpty('你这边的聊天记录已清空。\n好友仍保留自己的记录，新消息会继续显示。');
      setStatus(result.empty ? '这段会话原本就是空的' : '已清空你这边的聊天记录');
      await pollMessages();
    } catch (error) {
      setStatus(error.message || '清理聊天记录失败，请稍后再试。', true);
    } finally {
      $('clearChatBtn').disabled = false;
    }
  }

  async function hideMessageForMe(button) {
    var row = button.closest('.msg-row');
    var messageId = button.dataset.hideMessage;
    if (!row || !messageId || blocked) return;
    var confirmed = window.confirm('只在你自己的账号中隐藏这条消息？好友仍然可以看到原消息。');
    if (!confirmed) return;
    button.disabled = true;
    try {
      await api.hideMessage(friendId, messageId);
      hiddenMessageIds[messageId] = true;
      row.remove();
      delete known[messageId];
      if (latestIncomingMessage && latestIncomingMessage.id === messageId) {
        lastReadReceiptId = '';
        recomputeLatestIncomingFromDom();
        markVisibleIncomingRead();
      }
      if (!Object.keys(known).length) showEmpty('你已隐藏当前显示的聊天记录。\n之后的新消息仍会正常显示。');
      setStatus('这条消息已仅在你这里隐藏');
    } catch (error) {
      setStatus(error.message || '隐藏消息失败，请稍后再试。', true);
      button.disabled = false;
    }
  }

  async function markVisibleIncomingRead() {
    if (!ready || blocked || document.hidden || readReceiptInFlight) return;
    var target = latestVisibleIncomingMessage();
    if (!target || !isAfterReadCursor(target)) return;
    var receiptSaved = false;
    var receiptRevision = readReceiptRevision;
    readReceiptInFlight = true;
    try {
      var result = await api.markRead(friendId, target.id);
      // Ignore a response from a previous relationship generation. A delayed
      // receipt must not overwrite the new conversation's local read cursor.
      if (receiptRevision !== readReceiptRevision) return;
      lastReadReceiptId = (result.read && result.read.lastReadMessageId) || target.id;
      lastReadReceiptAt = Number(result.read && result.read.lastReadAt) || target.createdAt;
      receiptSaved = true;
    } catch (error) {
      if (receiptRevision === readReceiptRevision && error && error.code === 'NOT_FRIENDS') {
        setBlocked('好友关系已失效，无法继续聊天。');
      }
    } finally {
      // An obsolete request must not clear the in-flight flag for a newer request.
      if (receiptRevision === readReceiptRevision) {
        readReceiptInFlight = false;
        var nextVisible = latestVisibleIncomingMessage();
        if (receiptSaved && isAfterReadCursor(nextVisible) && !document.hidden) {
          window.setTimeout(markVisibleIncomingRead, 0);
        }
      }
    }
  }
  function setBlocked(message) {
    blocked = true;
    blockedRetryAt = Date.now() + 15000;
    updateComposer();
    setStatus(message || '你们已经不是好友，暂时无法继续聊天。', true);
  }

  var myUserId = '';
  async function initialize() {
    if (!api) {
      setStatus('真人好友模块加载失败，请返回好友页后刷新。', true);
      showEmpty('聊天模块暂不可用');
      return;
    }
    if (!/^u_[A-Za-z0-9_-]{16,48}$/.test(friendId)) {
      setStatus('好友 ID 不正确。', true);
      showEmpty('没有找到这位好友');
      return;
    }
    try {
      var localProfile = window.PhoneStorage ? (window.PhoneStorage.getMyProfile() || {}) : {};
      var displayName = localProfile.nickname || localProfile.displayName || localProfile.name || 'MAOMAO 用户';
      await api.ensureAccount(displayName);
      var me = await api.getMe();
      myUserId = me.account.userId;
      var result = await api.getMessages(friendId);
      $('friendName').textContent = result.friend.displayName || 'MAOMAO 用户';
      var initialMessages = result.messages || [];
      conversationViewVersion = result.viewState && result.viewState.version || '';
      conversationGenerationId = result.viewState && result.viewState.generationId || '';
      initialMessages.forEach(function (message) { appendMessage(message, false); });
      rememberIncoming(initialMessages);
      cursor = result.nextCursor || cursorFor(initialMessages.slice(-1)[0]);
      olderCursor = result.olderCursor || cursorFor((result.messages || [])[0]);
      hasOlder = Boolean(result.hasMore);
      $('historyAction').hidden = !hasOlder;
      ready = true;
      updateComposer();
      setStatus('已连接 · 新消息自动同步');
      if (!result.messages || !result.messages.length) showEmpty('你们已经成为好友了。\n从第一条消息开始聊吧。');
      scrollToBottom();
      markVisibleIncomingRead();
      pollTimer = window.setInterval(pollMessages, 4500);
    } catch (error) {
      if (error && error.code === 'NOT_FRIENDS') {
        setBlocked('好友关系已失效，无法查看聊天记录。重新成为好友后，此页面会自动恢复。');
        // Account authentication is already complete. Keep a low-frequency
        // relationship probe alive so an open page can recover after re-add.
        ready = Boolean(myUserId);
        updateComposer();
        if (ready && !pollTimer) pollTimer = window.setInterval(pollMessages, 4500);
      } else {
        setStatus((error.message || '聊天连接失败') + '。请检查网络或好友账号状态。', true);
      }
      showEmpty('暂时无法载入聊天记录');
    }
  }

  async function reloadConversationView(expectedVersion, shouldStick, viewVersion) {
    var previousTop = $('messages').scrollTop;
    var page = await api.getMessages(friendId);
    if (viewVersion !== messageViewVersion) return;
    if (expectedVersion && page.viewState && page.viewState.version !== expectedVersion) {
      conversationViewVersion = page.viewState.version || '';
    } else {
      conversationViewVersion = (page.viewState && page.viewState.version) || expectedVersion || '';
    }
    conversationGenerationId = page.viewState && page.viewState.generationId || '';
    // A view-version change is a relationship boundary as well as a local
    // visibility change: invalidate receipts still in flight and reset cursors.
    readReceiptRevision += 1;
    readReceiptInFlight = false;
    lastReadReceiptId = '';
    lastReadReceiptAt = 0;
    blocked = false;
    blockedRetryAt = 0;
    updateComposer();
    $('messages').innerHTML = '';
    known = Object.create(null);
    hiddenMessageIds = Object.create(null);
    latestIncomingMessage = null;
    var list = page.messages || [];
    list.forEach(function (message) { appendMessage(message, false); });
    rememberIncoming(list);
    cursor = page.nextCursor || cursorFor(list.slice(-1)[0]);
    olderCursor = page.olderCursor || cursorFor(list[0]);
    hasOlder = Boolean(page.hasMore);
    $('historyAction').hidden = !hasOlder;
    if (!list.length) showEmpty('这段聊天记录已在其他设备更新。\n当前显示的是你账号里仍保留的消息。');
    if (shouldStick) scrollToBottom();
    else $('messages').scrollTop = Math.min(previousTop, $('messages').scrollHeight);
    markVisibleIncomingRead();
    setStatus('聊天视图已与其他设备同步');
  }

  async function pollMessages() {
    if (!ready || document.hidden || (blocked && Date.now() < blockedRetryAt)) return;
    if (pollBusy) {
      pollAgain = true;
      return;
    }
    pollBusy = true;
    var shouldStick = isNearBottom();
    var scrollRevision = messageScrollRevision;
    var viewVersion = messageViewVersion;
    try {
      var page;
      var guard = 0;
      do {
        page = await api.getMessages(friendId, cursor, 'after');
        if (viewVersion !== messageViewVersion) return;
        var recoveredRelationship = blocked;
        if (blocked) {
          // A previously removed friend may be added again while this page stays open.
          // A successful authenticated read proves the relationship is active again.
          blocked = false;
          blockedRetryAt = 0;
          updateComposer();
        }
        var pageViewVersion = page.viewState && page.viewState.version || '';
        if (!conversationGenerationId && page.viewState && page.viewState.generationId) {
          conversationGenerationId = page.viewState.generationId;
        }
        if (conversationViewVersion && pageViewVersion && pageViewVersion !== conversationViewVersion) {
          await reloadConversationView(pageViewVersion, shouldStick, viewVersion);
          break;
        }
        if (!conversationViewVersion) conversationViewVersion = pageViewVersion;
        var list = page.messages || [];
        list.forEach(function (message) { appendMessage(message, false); });
        rememberIncoming(list);
        if (page.nextCursor) cursor = page.nextCursor;
        if (recoveredRelationship && !list.length) {
          showEmpty('你们已经重新成为好友了。\n从第一条新消息开始聊吧。');
          setStatus('好友关系已恢复，聊天已重新连接');
        }
        guard += 1;
      } while (page.hasMore && guard < 5);
      if (shouldStick && scrollRevision === messageScrollRevision &&
          page && page.messages && page.messages.length) scrollToBottom();
      if (page && page.messages && page.messages.length) {
        markVisibleIncomingRead();
        setStatus('刚刚同步');
      }
    } catch (error) {
      if (error && error.code === 'NOT_FRIENDS') setBlocked('好友关系已失效，无法继续聊天。');
      else setStatus(error.message || '同步暂时失败，稍后会自动重试。', true);
    } finally {
      pollBusy = false;
      if (pollAgain && !document.hidden) {
        pollAgain = false;
        window.setTimeout(pollMessages, 0);
      }
    }
  }

  async function loadOlder() {
    if (!ready || !hasOlder || !olderCursor) return;
    var button = $('loadOlderBtn');
    button.disabled = true;
    var viewVersion = messageViewVersion;
    try {
      var page = await api.getMessages(friendId, olderCursor, 'before');
      if (viewVersion !== messageViewVersion) return;
      rememberIncoming(page.messages || []);
      prependMessages(page.messages || []);
      markVisibleIncomingRead();
      olderCursor = page.olderCursor || olderCursor;
      hasOlder = Boolean(page.hasMore);
      $('historyAction').hidden = !hasOlder;
      setStatus('更早的消息已载入');
    } catch (error) {
      setStatus(error.message || '载入历史消息失败', true);
    } finally {
      button.disabled = false;
    }
  }

  async function sendCurrentMessage(event) {
    event.preventDefault();
    if (!ready || blocked) return;
    var text = $('messageInput').value.replace(/\r\n?/g, '\n').trim();
    if (!text) return;
    if (!conversationGenerationId) {
      setStatus('好友关系凭据尚未同步，正在刷新聊天状态。请稍后再次发送。', true);
      await pollMessages();
      return;
    }
    var clientId = pendingSend && pendingSend.body === text
      ? pendingSend.id
      : api.createMessageId();
    pendingSend = { body: text, id: clientId };
    $('sendBtn').disabled = true;
    $('messageInput').disabled = true;
    setStatus('正在发送…');
    var pendingNode = appendPendingMessage(text, clientId);
    try {
      var result = await api.sendMessage(friendId, text, clientId, conversationGenerationId);
      removePendingMessage(pendingNode);
      appendMessage(result.message, false);
      cursor = cursorFor(result.message) || cursor;
      pendingSend = null;
      $('messageInput').value = '';
      $('messageInput').style.height = '22px';
      updateComposer();
      scrollToBottom();
      setStatus(result.duplicate ? '消息已确认送达' : '已发送');
    } catch (error) {
      removePendingMessage(pendingNode);
      if (error && error.code === 'NOT_FRIENDS') {
        setBlocked('好友关系已失效，无法继续发送消息。');
      } else if (error && error.code === 'STALE_FRIENDSHIP_GENERATION') {
        // The request was created against an older relationship. Synchronize
        // before allowing a retry; the server did not store this stale write.
        await pollMessages();
        if (!blocked) {
          setStatus('好友关系已经变化，聊天正在同步。同步后再次点击发送即可继续。', true);
          $('messageInput').disabled = false;
          $('messageInput').focus();
          $('sendBtn').disabled = false;
        }
      } else if (error && error.code === 'STALE_FRIENDSHIP_MESSAGE_RETRY') {
        // This client ID already belongs to a message in the retired generation.
        // Keep the text but rotate the id so it can be sent as a new message.
        pendingSend = { body: text, id: api.createMessageId() };
        setStatus('原发送编号属于上一轮好友关系，已为这条文字生成新编号。再次点击发送会作为新消息发送。', true);
        $('messageInput').disabled = false;
        $('messageInput').focus();
        $('sendBtn').disabled = false;
      } else {
        var retryHint = error && error.code === 'FRIEND_MESSAGE_RATE_LIMITED'
          ? '请稍后再发送，当前输入内容已保留。'
          : '再次点击发送会安全重试，不会重复落库。';
        setStatus((error.message || '发送失败') + '。' + retryHint, true);
        $('messageInput').disabled = false;
        $('messageInput').focus();
        $('sendBtn').disabled = false;
      }
    }
  }

  $('backBtn').addEventListener('click', function () {
    window.location.href = 'friend-center.html';
  });
  $('messages').addEventListener('scroll', function () {
    messageScrollRevision += 1;
    if (readReceiptTimer) window.clearTimeout(readReceiptTimer);
    readReceiptTimer = window.setTimeout(markVisibleIncomingRead, 140);
  });
  $('loadOlderBtn').addEventListener('click', loadOlder);
  $('composer').addEventListener('submit', sendCurrentMessage);
  $('messageInput').addEventListener('input', function () {
    var area = $('messageInput');
    var characters = Array.from(area.value);
    if (characters.length > 2000) {
      area.value = characters.slice(0, 2000).join('');
    }
    area.style.height = '22px';
    area.style.height = Math.min(area.scrollHeight, 116) + 'px';
    updateComposer();
    if (pendingSend && pendingSend.body !== area.value.trim()) pendingSend = null;
  });
  $('messageInput').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      $('composer').requestSubmit();
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) pollMessages();
  });
  window.addEventListener('pagehide', function () {
    if (pollTimer) window.clearInterval(pollTimer);
    if (readReceiptTimer) window.clearTimeout(readReceiptTimer);
  });
  initialize();
})();
</script>
</body>
</html>
