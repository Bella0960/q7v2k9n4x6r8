<html lang="zh-CN">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: #D6D6D6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
    color: #111111;
    user-select: none;
  }

  .phone-mockup {
    position: relative;
    width: min(390px, calc(100vw - 24px));
    height: min(844px, calc(100vh - 24px));
    min-height: 0;
    background-color: #FFFFFF;
    border-radius: 45px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    border: 8px solid #ffffff;
    display: flex;
    flex-direction: column;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 14px 28px;
    font-size: 0.875rem; font-weight: 600;
    color: #111111;
    z-index: 50;
    pointer-events: none;
  }

  /* mobile fullscreen: no rounded shell */
  .top-nav {
    flex: 0 0 auto;
    padding: 52px 14px 6px 14px;
    background: #FFFFFF;
    border-bottom: 0.5px solid rgba(0,0,0,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-nav-title {
    font-size: 16px;
    font-weight: 500;
    color: #111111;
    letter-spacing: -0.3px;
  }

  /* mobile fullscreen: no rounded shell */
  .search-wrap {
    padding: 6px 14px 8px 14px;
    background: #FFFFFF;
  }
  .search-box {
    background: #F0F0F0;
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    height: 30px;
  }
  .search-box svg { width: 13px; height: 13px; stroke: #999; margin-right: 5px; flex-shrink: 0; }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #111111;
    font-family: inherit;
  }
  .search-box input::placeholder { color: #AAA; }

  /* mobile fullscreen: no rounded shell */
  .contact-stage {
    flex: 1;
    overflow-y: auto;
    background: #FAFAFA;
    padding-bottom: 110px;
    scrollbar-width: none;
  }
  .contact-stage::-webkit-scrollbar { display: none; }

  /* mobile fullscreen: no rounded shell */
  .contact-section-title {
    padding: 8px 14px 3px 14px;
    font-size: 12px;
    color: #AAA;
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    padding: 9px 14px;
    background: #FFFFFF;
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
    cursor: pointer;
    transition: background 0.12s;
  }
  .contact-item:active { background: #F0F0F0; }

  .contact-item:last-child { border-bottom: none; }

  .contact-avatar {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    overflow: hidden;
    background: #EDEDED;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    font-weight: 500;
    color: #999;
  }
  .contact-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .contact-avatar svg { width: 22px; height: 22px; stroke: #999; }

  .contact-info {
    flex: 1;
    margin-left: 10px;
    min-width: 0;
  }
  .contact-name {
    font-size: 14px;
    font-weight: 500;
    color: #111111;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* mobile fullscreen: no rounded shell */
  .empty-state {
    text-align: center;
    padding: 60px 40px;
    color: #AAA;
  }
  .empty-state svg { width: 40px; height: 40px; stroke: #DDD; margin-bottom: 14px; }
  .empty-state .empty-text { font-size: 13px; line-height: 1.6; }
  .contact-group-manage { border:0;background:transparent;color:#777;font:inherit;font-size:11px;padding:6px 0;cursor:pointer; }
  .contact-group-bar { display:flex;align-items:center;gap:6px;overflow-x:auto;padding:7px 14px 9px;background:#fff;scrollbar-width:none; }
  .contact-group-bar::-webkit-scrollbar { display:none; }
  .contact-group-chip { flex:0 0 auto;border:1px solid #e5e5e5;background:#fff;color:#666;border-radius:3px;padding:6px 10px;font:inherit;font-size:11px;white-space:nowrap;cursor:pointer; }
  .contact-group-chip.active { background:#171717;border-color:#171717;color:#fff; }
  .contact-group-count { opacity:.65;margin-left:3px;font-size:10px; }
  .contact-group-overlay { position:absolute;inset:0;z-index:240;display:none;align-items:flex-end;justify-content:center; }
  .contact-group-overlay.open { display:flex; }
  .contact-group-backdrop { position:absolute;inset:0;background:rgba(0,0,0,.32); }
  .contact-group-sheet { position:relative;z-index:1;width:100%;max-height:78%;display:flex;flex-direction:column;background:#fff;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 28px rgba(0,0,0,.08); }
  .contact-group-sheet[hidden] { display:none!important; }
  .contact-group-sheet-head { display:flex;align-items:center;justify-content:space-between;padding:18px 18px 13px;border-bottom:1px solid #eee;font-family:Georgia,"Songti SC",serif;font-size:20px; }
  .contact-group-sheet-head button { border:0;background:none;color:#777;font:inherit;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:12px;cursor:pointer; }
  .contact-group-list { overflow-y:auto;padding:4px 18px; }
  .contact-group-row { display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #f0f0f0; }
  .contact-group-row:last-child { border-bottom:0; }
  .contact-group-row-main { flex:1;min-width:0; }
  .contact-group-row-name { font-size:13px;color:#222; }
  .contact-group-row-meta { margin-top:3px;color:#999;font-size:10px; }
  .contact-group-action { border:0;background:transparent;padding:7px 5px;font:inherit;font-size:11px;color:#666;cursor:pointer; }
  .contact-group-action.delete { color:#888; }
  .contact-group-primary { margin:10px 18px 15px;border:1px solid #171717;background:#171717;color:#fff;padding:12px;font:inherit;font-size:12px;cursor:pointer; }
  .contact-group-status { min-height:18px;padding:0 18px 8px;font-size:11px;color:#777; }
  .contact-group-field { padding:16px 18px 8px; }
  .contact-group-field label { display:block;margin-bottom:8px;color:#888;font-size:11px; }
  .contact-group-field input { width:100%;border:0;border-bottom:1px solid #ddd;border-radius:0;padding:9px 0;outline:none;background:transparent;color:#171717;font:inherit;font-size:14px; }
  .contact-group-member-title { padding:12px 18px 4px;color:#888;font-size:11px; }
  .contact-group-member-list { overflow-y:auto;padding:0 18px 8px; }
  .contact-group-member { display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f2f2f2;color:#333;font-size:12px; }
  .contact-group-member input { width:16px;height:16px;accent-color:#171717; }
  .contact-group-empty { padding:22px 0;text-align:center;font-size:12px;color:#aaa; }

  /* mobile fullscreen: no rounded shell */
  .quick-entry-list {
    background: #FFFFFF;
    margin-bottom: 6px;
  }
  .quick-entry {
    display: flex;
    align-items: center;
    padding: 9px 14px;
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
    cursor: pointer;
  }
  .quick-entry:active { background: #F0F0F0; }
  .quick-entry:last-child { border-bottom: none; }
  .quick-entry-icon {
    width: 28px; height: 28px;
    border-radius: 5px;
    background: #111111;
    display: flex; align-items: center; justify-content: center;
    margin-right: 10px;
  }
  .quick-entry-icon svg { width: 16px; height: 16px; stroke: #FFFFFF; fill: none; stroke-width: 2; }
  .quick-entry-label { font-size: 13px; color: #111111; letter-spacing: -0.2px; }
  .quick-entry-arrow { margin-left: auto; color: #CCC; }
  .quick-entry-arrow svg { width: 11px; height: 11px; stroke: #CCC; }

  /* mobile fullscreen: no rounded shell */


  /* mobile fullscreen: no rounded shell */
  @media (max-width: 480px) {
    html, body {
      background: #FFFFFF !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100vh !important;
      align-items: stretch !important;
      overflow: hidden !important;
    }
    .phone-mockup {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      margin: 0 !important;
    }
  }
</style>

<body>

  <div class="phone-mockup">
    <div class="status-bar"><span>4:41</span></div>

    <!-- 顶部 -->
    <div class="top-nav">
      <span class="top-nav-title">通讯录</span>
      <button type="button" class="contact-group-manage" id="btnManageContactGroups">管理分组</button>
    </div>

    <!-- 搜索框 -->
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

              <circle cx="8.5" cy="7" r="4"/>

      <div class="contact-group-bar" id="contactGroupBar" aria-label="联系人分组筛选"></div>

    <div class="contact-group-overlay" id="contactGroupOverlay" aria-hidden="true">
      <div class="contact-group-backdrop" id="contactGroupBackdrop"></div>
      <section class="contact-group-sheet" id="contactGroupManageSheet" aria-label="通讯录分组管理">
        <div class="contact-group-sheet-head"><span>通讯录分组</span><button type="button" id="btnCloseContactGroups">完成</button></div>
        <div class="contact-group-list" id="contactGroupManageList"></div>

  <script src="../../shared/js/nav.js"></script>
  <script>
  /* mobile fullscreen: no rounded shell */
    var CHARACTERS_KEY = 'ai_custom_characters';
    var _storage = window.PhoneStorage;
    var contactGroupApi = window.PhoneContactGroups;
    var currentContactGroupFilter = 'all';
    var editingContactGroupId = '';
    var editingContactGroupMembers = [];
    var editingContactGroupOtherRefs = [];

    function getContactGroups() {
      if (!contactGroupApi) return [];
      var result = typeof contactGroupApi.readStoredGroups === 'function'
        ? contactGroupApi.readStoredGroups() : { ok: true, groups: contactGroupApi.getGroups() };
      if (!result.ok) {
        var status = document.getElementById('contactGroupManageStatus');
        if (status) status.textContent = result.error === 'corrupt_data'
          ? '分组数据无法读取，原始数据已保留，没有覆盖。'
          : '浏览器存储暂不可用，分组数据未更改。';
        return [];
      }
      return result.groups || [];
    }
    function persistContactGroups(groups) {
      return contactGroupApi ? contactGroupApi.saveGroups(groups) : { ok: false, error: 'storage_unavailable' };
    }

    function loadCharacters() {
      if (_storage) return _storage.getCharacters();
      try {
        var raw = localStorage.getItem(CHARACTERS_KEY);
        if (!raw) return [];
        var arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function avatarFallback(name) {
      var ch = (name || '角').charAt(0);
      return '<div class="contact-avatar">' + escapeHtml(ch) + '</div>';
    }

    function contactInitial(role) {
      var source = role.pinyin || role.py || role.initial || role.sortName || role.name || '';
      var first = String(source).trim().charAt(0);
      var letter = first.toUpperCase();
      return /^[A-Z]$/.test(letter) ? letter : '#';
    }

    var contactNameCollator = (function () {
      try { return new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'}); }
      catch(e) { return null; }
    })();

    function compareContactNames(a,b) {
      var left = String(a.pinyin || a.py || a.sortName || a.name || '');
      var right = String(b.pinyin || b.py || b.sortName || b.name || '');
      if (contactNameCollator) return contactNameCollator.compare(left,right);
      return left.localeCompare(right,'zh-CN');
    }

    function getFilteredGroupCount(group) {
      return loadCharacters().filter(function (role) { return (group.memberIds || []).indexOf(String(role.id)) !== -1; }).length;
    }
    function renderGroupBar() {
      var bar = document.getElementById('contactGroupBar');
      var roles = loadCharacters(), groups = getContactGroups(), grouped = Object.create(null);
      groups.forEach(function (group) { (group.memberIds || []).forEach(function (id) { grouped[String(id)] = true; }); });
      var ungrouped = roles.filter(function (role) { return !grouped[String(role.id)]; }).length;
      var items = [{id:'all',label:'全部',count:roles.length},{id:'ungrouped',label:'未分组',count:ungrouped}];
      bar.innerHTML = items.map(function (item) {
        return '<button type="button" class="contact-group-chip' + (currentContactGroupFilter === item.id ? ' active' : '') +
          '" data-contact-group="' + item.id + '">' + item.label + '<span class="contact-group-count">' + item.count + '</span></button>';
      }).join('') + groups.map(function (group) {
        return '<button type="button" class="contact-group-chip' + (currentContactGroupFilter === group.id ? ' active' : '') +
          '" data-contact-group="' + escapeHtml(group.id) + '">' + escapeHtml(group.name) +
          '<span class="contact-group-count">' + getFilteredGroupCount(group) + '</span></button>';
      }).join('');
    }
    function showContactGroupPanel(panel) {
      var overlay = document.getElementById('contactGroupOverlay');
      document.getElementById('contactGroupManageSheet').hidden = panel !== 'manage';
      document.getElementById('contactGroupEditSheet').hidden = panel !== 'edit';
      overlay.classList.add('open'); overlay.setAttribute('aria-hidden', 'false');
    }
    function closeContactGroupPanel() {
      var overlay = document.getElementById('contactGroupOverlay');
      overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true');
    }
    function renderContactGroupManager() {
      var list = document.getElementById('contactGroupManageList'), groups = getContactGroups();
      if (!groups.length) { list.innerHTML = '<div class="contact-group-empty">还没有分组，创建一个开始整理联系人</div>'; return; }
      list.innerHTML = groups.map(function (group) {
        return '<div class="contact-group-row" data-group-id="' + escapeHtml(group.id) + '">' +
          '<div class="contact-group-row-main"><div class="contact-group-row-name">' + escapeHtml(group.name) +
          '</div><div class="contact-group-row-meta">' + getFilteredGroupCount(group) + ' 位联系人</div></div>' +
          '<button type="button" class="contact-group-action" data-group-action="edit">编辑</button>' +
          '<button type="button" class="contact-group-action delete" data-group-action="delete">删除</button></div>';
      }).join('');
    }
    function renderContactGroupMembers() {
      var picker = document.getElementById('contactGroupMemberPicker');
      var roles = loadCharacters().slice().sort(compareContactNames);
      if (!roles.length) { picker.innerHTML = '<div class="contact-group-empty">目前还没有可加入分组的联系人</div>'; return; }
      picker.innerHTML = roles.map(function (role) {
        var id = String(role.id), checked = editingContactGroupMembers.indexOf(id) !== -1 ? ' checked' : '';
        var identity = window.PhoneContactIdentity && window.PhoneContactIdentity.fromRole(role);
        var contactKey = identity ? identity.key : 'ai_role:' + encodeURIComponent(id);
        return '<label class="contact-group-member"><input type="checkbox" data-contact-member="' +
          escapeHtml(id) + '" data-contact-key="' + escapeHtml(contactKey) + '"' + checked + '><span>' + escapeHtml(role.name || '角色') + '</span></label>';
      }).join('');
    }
    function openContactGroupEditor(group) {
      editingContactGroupId = group ? String(group.id) : '';
      var storedMemberIds = group ? (group.memberIds || []).map(String) : [];
      editingContactGroupOtherRefs = [];
      if (group && Array.isArray(group.memberRefs) && window.PhoneContactIdentity) {
        group.memberRefs.forEach(function (value) {
          var ref = window.PhoneContactIdentity.normalize(value);
          if (ref && ref.type !== 'ai_role' && editingContactGroupOtherRefs.indexOf(ref.key) === -1) {
            editingContactGroupOtherRefs.push(ref.key);
          }
        });
      }
      var rosterRead = { ok: false, roles: [] };
      try {
        if (_storage && _storage.result && typeof _storage.result.getCharacters === 'function') {
          var result = _storage.result.getCharacters();
          if (result && result.ok && Array.isArray(result.value)) {
            rosterRead = { ok: true, roles: result.value };
          } else if (result && result.error && result.error.code === 'NOT_FOUND') {
            rosterRead = { ok: true, roles: [] };
          }
        } else {
          var raw = localStorage.getItem(CHARACTERS_KEY);
          var parsed = raw == null ? [] : JSON.parse(raw);
          if (Array.isArray(parsed)) rosterRead = { ok: true, roles: parsed };
        }
      } catch (e) {}
      var staleMemberCount = 0;
      if (rosterRead.ok) {
        var availableContactIds = rosterRead.roles.map(function (role) { return String(role.id); });
        editingContactGroupMembers = storedMemberIds.filter(function (id) {
          var exists = availableContactIds.indexOf(id) !== -1;
          if (!exists) staleMemberCount += 1;
          return exists;
        });
      } else {
        // Do not remove members when the current contact roster itself cannot be verified.
        editingContactGroupMembers = storedMemberIds.slice();
      }
      document.getElementById('contactGroupEditorTitle').textContent = group ? '编辑分组' : '新建分组';
      document.getElementById('contactGroupName').value = group ? group.name : '';
      document.getElementById('contactGroupEditStatus').textContent = !rosterRead.ok
        ? '当前联系人列表暂时无法读取；保存时会保留原分组成员，避免误删。'
        : (staleMemberCount ? '发现 ' + staleMemberCount + ' 位已不存在的联系人；保存时会从分组中清除，取消则保留原数据。' : '');
      renderContactGroupMembers(); showContactGroupPanel('edit');
      setTimeout(function () { document.getElementById('contactGroupName').focus(); }, 0);
    }
    function saveContactGroupFromEditor() {
      var name = document.getElementById('contactGroupName').value.trim();
      var status = document.getElementById('contactGroupEditStatus');
      if (!name) { status.textContent = '请先填写分组名称'; return; }
      var groups = getContactGroups();
      if (groups.some(function (group) { return group.id !== editingContactGroupId && group.name.toLowerCase() === name.toLowerCase(); })) {
        status.textContent = '已经有同名分组了'; return;
      }
      var next = groups.slice(), index = next.findIndex(function (group) { return group.id === editingContactGroupId; });
      var roleRefs = editingContactGroupMembers.map(function (id) {
        var ref = window.PhoneContactIdentity && window.PhoneContactIdentity.fromRole({ id: id });
        return ref ? ref.key : 'ai_role:' + encodeURIComponent(id);
      });
      var record = { id: editingContactGroupId || ('cg_' + Date.now().toString(36) + '_' + Math.floor(Math.random() * 10000).toString(36)),
        name: name.slice(0,24), memberIds: editingContactGroupMembers.slice(),
        memberRefs: editingContactGroupOtherRefs.concat(roleRefs) };
      if (index >= 0) next[index] = record; else next.push(record);
      var saved = persistContactGroups(next);
      if (!saved.ok) {
        status.textContent = saved.error === 'storage_full' ? '存储空间不足，分组没有保存'
          : saved.error === 'corrupt_data' ? '分组数据无法读取，为保护原数据没有覆盖它'
          : '保存失败，请检查浏览器存储权限';
        return;
      }
      currentContactGroupFilter = record.id; renderGroupBar(); renderList(document.getElementById('searchInput').value);
      renderContactGroupManager(); showContactGroupPanel('manage');
      document.getElementById('contactGroupManageStatus').textContent = '已保存';
    }
    function deleteContactGroup(groupId) {
      var saved = persistContactGroups(getContactGroups().filter(function (group) { return group.id !== groupId; }));
      if (!saved.ok) { document.getElementById('contactGroupManageStatus').textContent = '删除失败，原分组已保留'; return; }
      if (currentContactGroupFilter === groupId) currentContactGroupFilter = 'all';
      renderGroupBar(); renderList(document.getElementById('searchInput').value); renderContactGroupManager();
      document.getElementById('contactGroupManageStatus').textContent = '分组已删除，联系人没有被删除';
    }

    function renderList(filter) {
      var list = document.getElementById('contactList');
      var index = document.getElementById('contactAlphabet');
      var roles = loadCharacters();
      var query = String(filter || '').trim().toLowerCase();

      if (query) {
        roles = roles.filter(function (r) {
          return String(r.name || '').toLowerCase().indexOf(query) !== -1 ||
            String(r.pinyin || r.py || '').toLowerCase().indexOf(query) !== -1;
        });
      }
      if (currentContactGroupFilter === 'ungrouped') {
        roles = roles.filter(function (role) { return !contactGroupApi || contactGroupApi.getGroupIdsForContact(role.id).length === 0; });
      } else if (currentContactGroupFilter !== 'all') {
        var selectedGroup = getContactGroups().find(function (group) { return group.id === currentContactGroupFilter; });
        if (selectedGroup) roles = roles.filter(function (role) { return (selectedGroup.memberIds || []).indexOf(String(role.id)) !== -1; });
      }
      roles.sort(compareContactNames);

      if (!roles.length) {
        list.innerHTML =
          '<div class="empty-state">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
              '<circle cx="9" cy="7" r="4"/>' +
              '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/>' +
              '<path d="M16 3.13a4 4 0 0 1 0 7.75"/>' +
            '</svg>' +
            '<div class="empty-text">' + (query ? '没有找到匹配的联系人' : '还没有角色<br>点击上方"新的朋友"开始添加') + '</div>' +
          '</div>';
        index.innerHTML = '';
        return;
      }

      var groups = {};
      roles.forEach(function(role){
        var letter = contactInitial(role);
        if(!groups[letter])groups[letter]=[];
        groups[letter].push(role);
      });
      var letters = Object.keys(groups).sort(function(a,b){
        if(a==='#')return 1;if(b==='#')return -1;return a.localeCompare(b);
      });
      var html = '';
      letters.forEach(function(letter){
        html += '<section class="contact-letter-group" id="contactSection' + letter + '">' +
          '<div class="contact-section-title">' + letter + '</div>';
        html += groups[letter].map(function(role){
          var name = role.name || '角色';
          var avatar = role.avatar
            ? '<div class="contact-avatar"><img src="' + escapeHtml(role.avatar) + '" alt=""></div>'
            : avatarFallback(name);
          var contactRef = window.PhoneContactIdentity && window.PhoneContactIdentity.fromRole(role);
          var contactKey = contactRef ? contactRef.key : 'ai_role:' + encodeURIComponent(String(role.id));
          return '<div class="contact-item" data-id="' + escapeHtml(role.id) + '" data-contact-key="' + escapeHtml(contactKey) + '">' +
            avatar + '<div class="contact-info"><div class="contact-name">' + escapeHtml(name) + '</div></div>' +
          '</div>';
        }).join('');
        html += '</section>';
      });
      list.innerHTML = html;
      index.innerHTML = letters.map(function(letter){
        return '<button type="button" class="wechat-index-letter" data-letter="' + letter + '">' + letter + '</button>';
      }).join('');
    }

  /* mobile fullscreen: no rounded shell */
    document.getElementById('searchInput').addEventListener('input', function (e) {
      renderList(e.target.value);
    });
    document.getElementById('contactList').addEventListener('click',function(e){
      var item=e.target.closest('.contact-item');
      if(!item)return;
      var id=item.getAttribute('data-id');
      if(id)window.location.href='../chat/chat-detail.html?id='+encodeURIComponent(id);
    });
    document.getElementById('contactAlphabet').addEventListener('click',function(e){
      var button=e.target.closest('[data-letter]');
      if(!button)return;
      var target=document.getElementById('contactSection'+button.dataset.letter);
      if(!target)return;
      var stage=document.getElementById('contactStage');
      stage.scrollTo({top:target.getBoundingClientRect().top-stage.getBoundingClientRect().top+stage.scrollTop,behavior:'smooth'});
    });

  /* mobile fullscreen: no rounded shell */
    document.getElementById('goManageRole').addEventListener('click', function () {
      window.location.href = '../../worldbook/characters/characters.html?from=contacts';
    });

  /* mobile fullscreen: no rounded shell */
    document.getElementById('contactGroupBar').addEventListener('click', function (e) {
      var chip = e.target.closest('[data-contact-group]'); if (!chip) return;
      currentContactGroupFilter = chip.getAttribute('data-contact-group') || 'all';
      renderGroupBar(); renderList(document.getElementById('searchInput').value);
      document.getElementById('contactStage').scrollTop = 0;
    });
    document.getElementById('btnManageContactGroups').addEventListener('click', function () {
      renderContactGroupManager(); showContactGroupPanel('manage');
    });
    document.getElementById('btnCloseContactGroups').addEventListener('click', closeContactGroupPanel);
    document.getElementById('contactGroupBackdrop').addEventListener('click', closeContactGroupPanel);
    document.getElementById('btnNewContactGroup').addEventListener('click', function () { openContactGroupEditor(null); });
    document.getElementById('btnCancelContactGroupEdit').addEventListener('click', function () {
      renderContactGroupManager(); showContactGroupPanel('manage');
    });
    document.getElementById('btnSaveContactGroup').addEventListener('click', saveContactGroupFromEditor);
    document.getElementById('contactGroupMemberPicker').addEventListener('change', function (e) {
      var input = e.target.closest('[data-contact-member]'); if (!input) return;
      var id = input.getAttribute('data-contact-member'), index = editingContactGroupMembers.indexOf(id);
      if (input.checked && index < 0) editingContactGroupMembers.push(id);
      else if (!input.checked && index >= 0) editingContactGroupMembers.splice(index, 1);
    });
    document.getElementById('contactGroupManageList').addEventListener('click', function (e) {
      var button = e.target.closest('[data-group-action]'); if (!button) return;
      var row = button.closest('[data-group-id]'); if (!row) return;
      var id = row.getAttribute('data-group-id'), group = getContactGroups().find(function (item) { return item.id === id; });
      if (!group) return;
      if (button.getAttribute('data-group-action') === 'edit') openContactGroupEditor(group);
      else if (button.getAttribute('data-group-action') === 'delete' &&
          window.confirm('删除这个分组？联系人和聊天记录不会被删除。')) deleteContactGroup(id);
    });
    document.getElementById('contactGroupName').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); saveContactGroupFromEditor(); }
    });
    window.addEventListener('storage', function (e) {
      if (e.key === 'contact_groups_v1') {
        renderGroupBar(); renderList(document.getElementById('searchInput').value);
        if (document.getElementById('contactGroupOverlay').classList.contains('open')) renderContactGroupManager();
      }
    });

    renderGroupBar();
    renderList();
  </script>
  <script src="../../shared/js/statusbar-control.js"></script>
</body>
</html>
