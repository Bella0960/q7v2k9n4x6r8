plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maomao.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maomao.phone'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
