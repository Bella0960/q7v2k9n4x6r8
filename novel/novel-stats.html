<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>写作统计 · 小说工坊</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f6f7;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}.app{max-width:900px;min-height:100dvh;margin:auto;background:#fff}.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 22px 10px;border-bottom:1px solid #ececee;background:rgba(255,255,255,.97);position:sticky;top:0;z-index:5}.back{width:36px;height:36px;border:1px solid #ececee;border-radius:50%;background:#fff;font-size:20px;color:#333}.brand{font-size:11px;color:#666;font-weight:650;flex:1}.main{padding:0 24px 40px}.intro{padding:25px 0 20px;border-bottom:1px solid #ececee}.eyebrow{font-size:10px;color:#999;letter-spacing:.12em}.intro h1{font-size:25px;letter-spacing:-.04em;margin:9px 0 6px}.intro p{font-size:12px;line-height:1.8;color:#888;margin:0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px 0}.metric{border:1px solid #ececee;border-radius:10px;padding:15px;min-width:0}.metric small{display:block;font-size:10px;color:#999;margin-bottom:9px}.metric strong{font-size:23px;letter-spacing:-.04em;overflow-wrap:anywhere}.metric em{display:block;font-size:10px;font-style:normal;color:#999;margin-top:6px}.section{padding:20px 0;border-top:1px solid #ececee}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.head h2{font-size:14px;margin:0}.head span{font-size:10px;color:#999}.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;min-height:160px;padding:14px 0 0}.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-width:0;height:150px}.bar-wrap{height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:min(28px,70%);min-height:3px;background:#242424;border-radius:4px 4px 0 0;transition:height .25s}.bar.zero{background:#e7e7e9}.day strong{font-size:10px;color:#666;font-weight:500}.day small{font-size:9px;color:#999;white-space:nowrap}.rows{display:flex;flex-direction:column}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f0f1}.row:last-child{border-bottom:0}.row-no{font-size:15px;color:#aaa;width:27px}.row-main{flex:1;min-width:0}.row-title{font-size:12px;overflow-wrap:anywhere}.row-sub{font-size:10px;color:#999;margin-top:4px}.row-value{font-size:11px;color:#666;white-space:nowrap}.empty{padding:15px 0;font-size:12px;line-height:1.8;color:#999}.note{font-size:10px;line-height:1.8;color:#aaa;padding-top:16px}.btn{border:1px solid #e5e5e7;border-radius:8px;background:#fff;padding:9px 12px;font-size:11px;color:#444}.btn.dark{background:#222;color:#fff;border-color:#222}@media(max-width:520px){.main{padding:0 17px 30px}.metrics{gap:7px}.metric{padding:11px 9px;border-radius:8px}.metric strong{font-size:20px}.metric small{font-size:9px}.chart{gap:4px}.bar-wrap{height:100px}.day{height:140px}.day small{font-size:8px}}
</style></head><body><main class="app"><header class="top"><button class="back" id="back" aria-label="返回">‹</button><span class="brand">MAOMAO / 写作统计</span><button class="btn" id="write">继续写作</button></header><div class="main" id="main"><section class="intro"><div class="eyebrow">WRITING RECORDS</div><h1>写作统计</h1><p>根据当前浏览器里已保存的作品与章节记录汇总。不会为了填满图表而编造写作数据。</p></section><div class="empty">正在读取创作记录…</div></div></main>
<script>
(function(){
'use strict';const KEY='maomao_novel_author_v1';const $=id=>document.getElementById(id);let db={works:[],activeId:null};
const words=s=>(String(s||'').match(/[\u3400-\u9fff]|[a-zA-Z0-9]+/g)||[]).length;
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(v.works))db=v}catch(e){}render()}
function render(){const works=db.works||[];const chapters=works.flatMap(w=>(w.chapters||[]).map(c=>({work:w,chapter:c})));const total=chapters.reduce((n,x)=>n+words(x.chapter.body),0);const published=chapters.filter(x=>x.chapter.published).length;const notes=works.reduce((n,w)=>n+(w.notes||[]).length,0);const now=new Date();const today=dayKey(now);const days=[];for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push({date:d,key:dayKey(d),label:['日','一','二','三','四','五','六'][d.getDay()],words:0,chapters:0})}const map=new Map(days.map(d=>[d.key,d]));chapters.forEach(x=>{const stamp=x.chapter.updated||x.chapter.created;if(!stamp)return;const d=map.get(dayKey(stamp));if(d){d.words+=words(x.chapter.body);d.chapters++}});const max=Math.max(1,...days.map(d=>d.words));let streak=0;const activeDates=new Set(chapters.map(x=>x.chapter.updated||x.chapter.created).filter(Boolean).map(dayKey));let cursor=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(!activeDates.has(dayKey(cursor)))cursor.setDate(cursor.getDate()-1);while(activeDates.has(dayKey(cursor))&&streak<366){streak++;cursor.setDate(cursor.getDate()-1)}const mostRecent=works.slice().sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0));const recent=chapters.slice().sort((a,b)=>(b.chapter.updated||b.chapter.created||0)-(a.chapter.updated||a.chapter.created||0)).slice(0,8);
$('main').innerHTML='<section class="intro"><div class="eyebrow">WRITING RECORDS</div><h1>写作统计</h1><p>数据来自本机保存的作品与章节。没有记录更新时间的旧章节不会被算作本周新增。</p></section><section class="metrics"><div class="metric"><small>累计正文</small><strong>'+total.toLocaleString()+'</strong><em>按当前正文计算</em></div><div class="metric"><small>作品数量</small><strong>'+works.length+'</strong><em>'+published+' 章已发布</em></div><div class="metric"><small>连续更新</small><strong>'+streak+'</strong><em>天 · 按章节更新时间估算</em></div></section><section class="section"><div class="head"><h2>近 7 天写作量</h2><span>WORDS / DAY</span></div><div class="chart">'+days.map(d=>'<div class="day"><small>'+d.words.toLocaleString()+'</small><div class="bar-wrap"><div class="bar '+(d.words?'':'zero')+'" style="height:'+Math.max(3,Math.round(d.words/max*100))+'px"></div></div><strong>'+d.label+'</strong></div>').join('')+'</div><div class="note">图表按章节最后保存时间统计；如果一章反复修改，当前整章字数会归入最近保存的那一天，因此它是写作活动参考，不是精确的每日新增字数。</div></section><section class="section"><div class="head"><h2>作品进度</h2><span>'+works.length+' WORKS</span></div><div class="rows">'+(works.length?works.map((w,i)=>{const cs=w.chapters||[],n=cs.reduce((v,c)=>v+words(c.body),0),p=cs.filter(c=>c.published).length;return '<div class="row"><div class="row-no">'+String(i+1).padStart(2,'0')+'</div><div class="row-main"><div class="row-title">'+esc(w.title||'未命名的故事')+'</div><div class="row-sub">'+esc(w.status||'构思中')+' · '+cs.length+' 章 · 已发布 '+p+' 章</div></div><div class="row-value">'+n.toLocaleString()+' 字</div></div>'}).join(''):'<div class="empty">书架还没有作品。创建作品并保存章节后，这里会自动汇总。</div>')+'</div></section><section class="section"><div class="head"><h2>最近编辑的章节</h2><span>RECENT CHANGES</span></div><div class="rows">'+(recent.length?recent.map((x,i)=>'<div class="row"><div class="row-no">'+String(i+1).padStart(2,'0')+'</div><div class="row-main"><div class="row-title">'+esc(x.chapter.title||'未命名章节')+'</div><div class="row-sub">'+esc(x.work.title||'未命名的故事')+' · '+(x.chapter.updated||x.chapter.created?new Date(x.chapter.updated||x.chapter.created).toLocaleString():'时间未记录')+'</div></div><div class="row-value">'+words(x.chapter.body).toLocaleString()+' 字</div></div>').join(''):'<div class="empty">还没有章节记录。</div>')+'</div></section><section class="section"><div class="head"><h2>读者互动汇总</h2><span>LOCAL SIMULATION</span></div><div class="content">读者反馈记录：'+notes.toLocaleString()+' 条\n累计阅读量：'+works.reduce((n,w)=>n+Number(w.views||0),0).toLocaleString()+'\n收藏：'+works.reduce((n,w)=>n+Number(w.likes||0),0).toLocaleString()+'\n追更：'+works.reduce((n,w)=>n+Number(w.follows||0),0).toLocaleString()+'</div><div class="note">读者互动数字来自本地模拟系统，并非真实联网平台数据。</div></section>');
}
$('back').onclick=()=>{if(history.length>1)history.back();else location.href='novel.html'};$('write').onclick=()=>{location.href='novel-editor.html'};load();
})();
</script></body></html>
