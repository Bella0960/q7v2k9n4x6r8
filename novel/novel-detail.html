<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>作品详情 · 小说工坊</title>
<style>
:root{color-scheme:light;--ink:#1c1c1e;--muted:#8e8e93;--line:#ececee;--wash:#f6f6f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--wash);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}.app{max-width:900px;min-height:100dvh;margin:auto;background:#fff}.top{height:auto;min-height:58px;padding:calc(10px + env(safe-area-inset-top)) 22px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}.back{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:20px;color:#333}.brand{font-size:11px;font-weight:650;color:#666;flex:1}.btn{border:1px solid #e4e4e7;background:#fff;border-radius:8px;padding:10px 13px;font-size:12px;color:#333;cursor:pointer}.btn.dark{background:#202124;border-color:#202124;color:#fff}.body{padding:0 24px 40px}.heading{padding:26px 0 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;color:#999;letter-spacing:.12em}.title{font-size:27px;font-weight:700;letter-spacing:-.04em;line-height:1.35;margin:10px 0 8px;overflow-wrap:anywhere}.desc{font-size:12px;line-height:1.85;color:#777;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.status{display:inline-flex;border:1px solid var(--line);padding:5px 8px;border-radius:5px;font-size:10px;color:#666;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}.metric{min-width:0;padding:4px 0}.metric small{display:block;color:#999;font-size:10px;margin-bottom:8px}.metric strong{font-size:21px;font-weight:650;letter-spacing:-.03em;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 20px;border-bottom:1px solid var(--line)}.section{padding:22px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.section h2{font-size:15px;font-weight:700;margin:0}.section-head span{font-size:10px;color:#999}.content{font-size:12px;line-height:1.9;color:#555;white-space:pre-wrap;overflow-wrap:anywhere}.empty{font-size:12px;color:#aaa;line-height:1.8}.chapters{display:flex;flex-direction:column}.chapter{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #f0f0f1}.chapter:last-child{border-bottom:0}.num{font-size:16px;color:#aaa;font-variant-numeric:tabular-nums}.chapter-title{font-size:12px;overflow-wrap:anywhere}.chapter-meta{font-size:10px;color:#999;margin-top:4px}.tag{font-size:10px;color:#777;border:1px solid var(--line);padding:4px 6px;white-space:nowrap}.footer{padding:18px 0 0;color:#aaa;font-size:10px;line-height:1.8}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:20px;font-size:12px;display:none;max-width:90%;z-index:9}.toast.show{display:block}.error{padding:48px 0;text-align:center;color:#777;font-size:13px}.error button{margin-top:15px}@media(max-width:520px){.body{padding:0 17px 30px}.top{padding-left:15px;padding-right:15px}.title{font-size:24px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metric strong{font-size:22px}.actions .btn{flex:1;min-width:calc(50% - 8px)}}
</style></head><body><main class="app"><header class="top"><button class="back" id="back" aria-label="返回">‹</button><span class="brand">MAOMAO / 作品详情</span><button class="btn" id="edit">编辑设定</button></header><div class="body" id="body"><div class="error">正在读取作品…</div></div></main><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const KEY='maomao_novel_author_v1';const params=new URLSearchParams(location.search);let workId=params.get('id');let db={works:[],activeId:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countWords=s=>(String(s||'').match(/[\u3400-\u9fff]|[a-zA-Z0-9]+/g)||[]).length;
const toast=s=>{const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(parsed.works))db=parsed}catch(e){}if(!workId)workId=db.activeId;const w=(db.works||[]).find(x=>String(x.id)===String(workId));if(!w){$('body').innerHTML='<div class="error">没有找到这部作品。<br>作品可能已被删除，或当前浏览器没有这份本地数据。<br><button class="btn dark" onclick="location.href=\'novel.html\'">返回作品书架</button></div>';return}db.activeId=w.id;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}render(w)}
function render(w){const chapters=Array.isArray(w.chapters)?w.chapters:[];const words=countWords(chapters.map(c=>c.body||'').join(''));const published=chapters.filter(c=>c.published).length;const notes=Array.isArray(w.notes)?w.notes:[];const desc=String(w.description||w.outline||w.setting||'').trim();$('body').innerHTML='<section class="heading"><div class="eyebrow">WORK DETAILS / 作品档案</div><h1 class="title">'+esc(w.title||'未命名的故事')+'</h1><p class="desc">'+esc(desc||'还没有作品简介。可以先补充设定或故事大纲。')+'</p><span class="status">'+esc(w.status||'构思中')+'</span></section><section class="metrics"><div class="metric"><small>正文总字数</small><strong>'+words.toLocaleString()+'</strong></div><div class="metric"><small>章节数量</small><strong>'+chapters.length+'</strong></div><div class="metric"><small>已发布章节</small><strong>'+published+'</strong></div><div class="metric"><small>读者互动</small><strong>'+notes.length+'</strong></div></section><div class="actions"><button class="btn dark" id="write">继续写作</button><button class="btn" id="chaptersBtn">章节目录</button><button class="btn" id="bibleBtn">故事资料库</button><button class="btn" id="readersBtn">读者反馈</button></div><section class="section"><div class="section-head"><h2>作品设定</h2><span>WORLD & CHARACTERS</span></div><div class="content">'+esc(w.setting||'暂未填写作品设定。')+'</div></section><section class="section"><div class="section-head"><h2>故事大纲</h2><span>STORY OUTLINE</span></div><div class="content">'+esc(w.outline||'暂未填写故事大纲。')+'</div></section><section class="section"><div class="section-head"><h2>章节目录</h2><span>'+chapters.length+' CHAPTERS</span></div><div class="chapters">'+(chapters.length?chapters.map((c,i)=>'<div class="chapter"><div class="num">'+String(i+1).padStart(2,'0')+'</div><div><div class="chapter-title">'+esc(c.title||('第'+(i+1)+'章'))+'</div><div class="chapter-meta">'+countWords(c.body||'').toLocaleString()+' 字 · '+(c.published?'已发布':'草稿')+'</div></div><span class="tag">'+(c.published?'已发布':'未发布')+'</span></div>').join(''):'<div class="empty">还没有章节。进入写作页面即可创建第一章。</div>')+'</div></section><section class="section"><div class="section-head"><h2>作品数据</h2><span>LOCAL RECORDS</span></div><div class="content">题材：'+esc(w.genre||'未分类')+'\n创建时间：'+(w.created?new Date(w.created).toLocaleDateString():'未记录')+'\n最近更新：'+(w.updated?new Date(w.updated).toLocaleDateString():w.created?new Date(w.created).toLocaleDateString():'未记录')+'\n阅读量：'+Number(w.views||0).toLocaleString()+'\n收藏：'+Number(w.likes||0).toLocaleString()+'\n追更：'+Number(w.follows||0).toLocaleString()+'</div></section><div class="footer">作品内容来自本机浏览器的小说工坊记录。读者数据为本地模拟数据；此页面不会覆盖正文或更改作品数据结构。</div>';
$('write').onclick=()=>{location.href='novel-editor.html'};$('chaptersBtn').onclick=()=>{location.href='novel-editor.html?section=chapters'};$('bibleBtn').onclick=()=>{location.href='novel-bible.html'};$('readersBtn').onclick=()=>{location.href='novel-readers.html'} }
$('back').onclick=()=>{if(history.length>1)history.back();else location.href='novel.html'};$('edit').onclick=()=>{location.href='novel-setup.html'};load();
})();
</script></body></html>
