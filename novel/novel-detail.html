<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>作品详情 · 小说工坊</title>
<style>
:root{
  --bg:#F4F4F3;--surface:#FFFFFF;--ink-1:#1A1A1A;--ink-2:#6E6E6E;--ink-3:#9C9C9C;
  --line:#E7E7E4;--line-2:#D6D6D2;--fill:#F0F0EE;
  --radius-md:10px;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink-1);font-family:var(--font);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}
.phone{width:min(480px,100%);height:100dvh;min-height:600px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(11px + env(safe-area-inset-top)) 16px 11px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.back{flex:0 0 34px;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink-1);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.brand{font-size:17px;font-weight:700;letter-spacing:.01em;color:var(--ink-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:9px 13px;border:1px solid var(--line-2);border-radius:var(--radius-md);background:#fff;color:var(--ink-1);font-size:12px;cursor:pointer}
.btn.dark{background:var(--ink-1);border-color:var(--ink-1);color:#fff}
.scroll{flex:1;overflow:auto;width:100%;padding:0 16px calc(24px + env(safe-area-inset-bottom));background:var(--surface)}
.heading{padding:26px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10px;color:var(--ink-3);letter-spacing:.12em;font-weight:600}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin:10px 0 8px;overflow-wrap:anywhere}
.desc{font-size:12px;line-height:1.85;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.status{display:inline-flex;border:1px solid var(--line);padding:5px 8px;border-radius:6px;font-size:10px;color:var(--ink-2);margin-top:12px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}
.metric{min-width:0;padding:4px 0}
.metric small{display:block;color:var(--ink-3);font-size:10px;margin-bottom:8px}
.metric strong{font-size:21px;font-weight:650;letter-spacing:-.03em;overflow-wrap:anywhere;color:var(--ink-1)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 20px;border-bottom:1px solid var(--line)}
.section{padding:22px 0;border-bottom:1px solid var(--line)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.section-head h2{font-size:16px;font-weight:650;margin:0;color:var(--ink-1)}
.section-head span{font-size:10px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
.content{font-size:13px;line-height:1.8;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.chapters{display:flex;flex-direction:column;gap:8px}
.chapter{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.num{font-size:13px;font-weight:700;color:var(--ink-3);flex:none;width:24px;text-align:center}
.chapter>div:not(.num){flex:1;min-width:0}
.chapter-title{font-size:13px;font-weight:600;color:var(--ink-1);overflow-wrap:anywhere}
.chapter-meta{font-size:10px;color:var(--ink-3);margin-top:3px}
.tag{font-size:10px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:5px;padding:3px 7px;flex:none}
.error{font-size:13px;line-height:1.8;color:var(--ink-2);padding:30px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:var(--ink-1);color:#fff;font-size:12px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><main class="phone"><header class="top"><button class="back" id="back" aria-label="返回">‹</button><span class="brand">小说工坊</span><button class="btn" id="edit">编辑设定</button></header><div class="scroll" id="body"><div class="error">正在读取作品…</div></div></main><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const KEY='maomao_novel_author_v1';const params=new URLSearchParams(location.search);let workId=params.get('id');let db={works:[],activeId:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countWords=s=>(String(s||'').match(/[\u3400-\u9fff]|[a-zA-Z0-9]+/g)||[]).length;
const toast=s=>{const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(parsed.works))db=parsed}catch(e){}if(!workId)workId=db.activeId;const w=(db.works||[]).find(x=>String(x.id)===String(workId));if(!w){$('body').innerHTML='<div class="error">没有找到这部作品。<br>作品可能已被删除，或当前浏览器没有这份本地数据。<br><button class="btn dark" onclick="location.href=\'novel.html\'">返回作品书架</button></div>';return}db.activeId=w.id;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}render(w)}
function render(w){const chapters=Array.isArray(w.chapters)?w.chapters:[];const words=countWords(chapters.map(c=>c.body||'').join(''));const published=chapters.filter(c=>c.published).length;const notes=Array.isArray(w.notes)?w.notes:[];const desc=String(w.description||w.outline||w.setting||'').trim();$('body').innerHTML='<section class="heading"><div class="eyebrow">WORK DETAILS / 作品档案</div><h1 class="title">'+esc(w.title||'未命名的故事')+'</h1><p class="desc">'+esc(desc||'还没有作品简介。可以先补充设定或故事大纲。')+'</p><span class="status">'+esc(w.status||'构思中')+'</span></section><section class="metrics"><div class="metric"><small>正文总字数</small><strong>'+words.toLocaleString()+'</strong></div><div class="metric"><small>章节数量</small><strong>'+chapters.length+'</strong></div><div class="metric"><small>已发布章节</small><strong>'+published+'</strong></div><div class="metric"><small>读者互动</small><strong>'+notes.length+'</strong></div></section><div class="actions"><button class="btn dark" id="write">继续写作</button><button class="btn" id="readBtn">阅读</button><button class="btn" id="chaptersBtn">章节目录</button><button class="btn" id="bibleBtn">故事资料库</button><button class="btn" id="readersBtn">读者反馈</button></div><section class="section"><div class="section-head"><h2>作品设定</h2><span>WORLD & CHARACTERS</span></div><div class="content">'+esc(w.setting||'暂未填写作品设定。')+'</div></section><section class="section"><div class="section-head"><h2>故事大纲</h2><span>STORY OUTLINE</span></div><div class="content">'+esc(w.outline||'暂未填写故事大纲。')+'</div></section><section class="section"><div class="section-head"><h2>章节目录</h2><span>'+chapters.length+' CHAPTERS</span></div><div class="chapters">'+(chapters.length?chapters.map((c,i)=>'<div class="chapter"><div class="num">'+String(i+1).padStart(2,'0')+'</div><div><div class="chapter-title">'+esc(c.title||('第'+(i+1)+'章'))+'</div><div class="chapter-meta">'+countWords(c.body||'').toLocaleString()+' 字 · '+(c.published?'已发布':'草稿')+'</div></div><span class="tag">'+(c.published?'已发布':'未发布')+'</span></div>').join(''):'<div class="content">还没有章节。回到编辑器开始写作吧。</div>')+'</div></section>'
$('write').onclick=()=>{location.href='novel-editor.html'};$('chaptersBtn').onclick=()=>{location.href='novel-editor.html?section=chapters'};$('bibleBtn').onclick=()=>{location.href='novel-bible.html'};$('readersBtn').onclick=()=>{location.href='novel-readers.html'};$('readBtn').onclick=()=>{location.href='novel-read.html?id='+encodeURIComponent(workId)}}
$('back').onclick=()=>{if(history.length>1)history.back();else location.href='novel.html'};$('edit').onclick=()=>{location.href='novel-setup.html'};load();
})();
</script></body></html>
