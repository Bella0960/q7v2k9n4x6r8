<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>阅读 · 小说工坊</title>
<style>
/* ===== 小说工坊统一设计系统 · 黑白灰 · 自包含 ===== */
:root{
  --bg:#F4F4F3;
  --surface:#FFFFFF;
  --ink-1:#1A1A1A;
  --ink-2:#6E6E6E;
  --ink-3:#9C9C9C;
  --line:#E7E7E4;
  --line-2:#D6D6D2;
  --fill:#F0F0EE;
  --radius-lg:14px;
  --radius-md:10px;
  --radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --read-size:17px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink-1);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
.hidden{display:none!important}

/* ---- 手机框 ---- */
.phone{width:min(480px,100%);height:100dvh;min-height:600px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}

/* ---- 顶栏 ---- */
.top{display:flex;align-items:center;gap:12px;padding:calc(11px + env(safe-area-inset-top)) 16px 11px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);flex:0 0 auto}
.back{flex:0 0 34px;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink-1);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.brand{min-width:0;flex:1;font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--ink-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tool{flex:0 0 auto;min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink-2);font:13px/1 var(--font);cursor:pointer}
.tool:active{background:var(--fill)}

/* ---- 章节切换条 ---- */
.chapter-switch{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none;flex:0 0 auto}
.chapter-switch::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;max-width:180px;padding:7px 12px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink-2);font:12px/1.3 var(--font);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.active{background:var(--ink-1);border-color:var(--ink-1);color:#fff;font-weight:600}
.chip.empty{opacity:.5}

/* ---- 阅读区 ---- */
.scroll{flex:1;overflow:auto;width:100%;padding:0 20px calc(28px + env(safe-area-inset-bottom));background:var(--surface)}
.reader{max-width:38em;margin:0 auto;padding:24px 0 16px}
.reader-chapter-title{margin:0 0 20px;font-size:19px;line-height:1.45;font-weight:700;letter-spacing:-.02em;color:var(--ink-1);overflow-wrap:anywhere}
.reader-body{font-size:var(--read-size);line-height:1.85;color:var(--ink-1);overflow-wrap:anywhere}
.reader-body p{margin:0 0 1.1em}
.reader-body .blank{color:var(--ink-3);font-style:normal}

/* ---- 底部操作 ---- */
.reader-foot{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);flex:0 0 auto}
.reader-foot .btn{flex:1 1 0;min-width:0}

/* ---- 按钮 ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--radius-md);background:#fff;color:var(--ink-1);font:13px/1.2 var(--font);cursor:pointer}
.btn:hover{background:var(--fill)}
.btn.dark{background:var(--ink-1);border-color:var(--ink-1);color:#fff;font-weight:600}
.btn.dark:hover{background:#000}

/* ---- 空态 / 错误态 ---- */
.state{padding:48px 8px;text-align:center;color:var(--ink-2)}
.state strong{display:block;margin:0 0 8px;font-size:17px;font-weight:700;color:var(--ink-1)}
.state p{margin:0 0 18px;font-size:13px;line-height:1.8}

/* ---- Toast ---- */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:80%;padding:9px 16px;background:rgba(26,26,26,.92);color:#fff;font:12px/1.4 var(--font);border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
</style></head><body><main class="phone">
<header class="top">
  <button class="back" id="back" aria-label="返回">‹</button>
  <span class="brand" id="brand">阅读</span>
  <div class="reader-tools">
    <button class="tool" id="fontMinus" aria-label="缩小字号">A−</button>
    <button class="tool" id="fontPlus" aria-label="放大字号">A+</button>
  </div>
</header>
<nav class="chapter-switch" id="chapterSwitch" aria-label="章节切换"></nav>
<div class="scroll" id="scroll">
  <div id="readerHost"><div class="state"><p>正在读取作品…</p></div></div>
</div>
<footer class="reader-foot">
  <button class="btn" id="prevCh">上一章</button>
  <button class="btn dark" id="write">继续写作</button>
  <button class="btn" id="nextCh">下一章</button>
</footer>
</main><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const KEY='maomao_novel_author_v1';
const params=new URLSearchParams(location.search);
let workId=params.get('id');
let db={works:[],activeId:null};
let work=null;
let chapters=[];
let current=0;
const MIN=15,MAX=21,STEP=1;
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countWords=s=>(String(s||'').match(/[\u3400-\u9fff]|[a-zA-Z0-9]+/g)||[]).length;
const toast=s=>{const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function load(){
  try{const parsed=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(parsed.works))db=parsed}catch(e){}
  if(!workId)workId=db.activeId;
  work=(db.works||[]).find(x=>String(x.id)===String(workId));
  if(!work){renderNotFound();return}
  db.activeId=work.id;
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
  chapters=Array.isArray(work.chapters)?work.chapters:[];
  $('brand').textContent=work.title||'未命名的故事';
  $('brand').title=work.title||'未命名的故事';
  if(!chapters.length){renderEmpty();return}
  renderSwitch();
  current=0;
  renderChapter();
}
function renderNotFound(){
  $('brand').textContent='阅读';
  $('chapterSwitch').innerHTML='';
  $('readerHost').innerHTML='<div class="state"><strong>没有找到这部作品</strong><p>作品可能已被删除，或当前浏览器没有这份本地数据。</p><button class="btn dark" onclick="location.href=\'novel.html\'">返回作品书架</button></div>';
  $('prevCh').disabled=true;$('nextCh').disabled=true;
}
function renderEmpty(){
  $('chapterSwitch').innerHTML='';
  $('readerHost').innerHTML='<div class="state"><strong>这部作品还没有章节</strong><p>先去把第一章写出来，再回来这里阅读。</p><button class="btn dark" id="goWrite">去写作</button></div>';
  const g=$('goWrite');if(g)g.onclick=()=>{location.href='novel-editor.html'};
  $('prevCh').disabled=true;$('nextCh').disabled=true;
}
function renderSwitch(){
  const nav=$('chapterSwitch');
  nav.innerHTML='';
  chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='chip'+(i===current?' active':'');
    b.textContent=(i+1)+'. '+(c.title||('第'+(i+1)+'章'));
    b.onclick=()=>{current=i;syncScroll();renderChapter()};
    nav.appendChild(b);
  });
}
function renderChapter(){
  const c=chapters[current];
  const host=$('readerHost');
  if(!c){host.innerHTML='<div class="state"><p>这一章读取失败了。</p></div>';return}
  const body=String(c.body||'').trim();
  let paras;
  if(body){
    paras=body.split(/\n\s*\n/).map(p=>
      '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'
    ).join('');
  }else{
    paras='<p class="blank">（这一章还是空的，去编辑器里写点什么吧。）</p>';
  }
  host.innerHTML='<article class="reader"><h1 class="reader-chapter-title">'+esc(c.title||('第'+(current+1)+'章'))+'</h1><div class="reader-body">'+paras+'</div></article>';
  $('scroll').scrollTop=0;
  // sync switch active state + scroll into view
  const chips=$('chapterSwitch').children;
  for(let i=0;i<chips.length;i++)chips[i].classList.toggle('active',i===current);
  syncScroll();
  $('prevCh').disabled=current<=0;
  $('nextCh').disabled=current>=chapters.length-1;
}
function syncScroll(){
  const chips=$('chapterSwitch').children;
  const el=chips[current];
  if(el&&el.scrollIntoView)el.scrollIntoView({inline:'center',block:'nearest'});
}
function stepSize(d){
  let s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--read-size'))||17;
  s=Math.min(MAX,Math.max(MIN,s+d*STEP));
  document.documentElement.style.setProperty('--read-size',s+'px');
}
$('back').onclick=()=>{if(history.length>1)history.back();else location.href='novel.html'};
$('write').onclick=()=>{location.href='novel-editor.html'};
$('prevCh').onclick=()=>{if(current>0){current--;renderChapter()}};
$('nextCh').onclick=()=>{if(current<chapters.length-1){current++;renderChapter()}};
$('fontMinus').onclick=()=>stepSize(-1);
$('fontPlus').onclick=()=>stepSize(1);
load();
})();
</script></body></html>
