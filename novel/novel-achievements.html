<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>创作成就 · 小说工坊</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f6f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}.app{max-width:900px;min-height:100dvh;margin:auto;background:#fff}.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 22px 10px;border-bottom:1px solid #ececee;background:rgba(255,255,255,.97);position:sticky;top:0;z-index:5}.back{width:36px;height:36px;border:1px solid #ececee;border-radius:50%;background:#fff;font-size:20px;color:#333}.brand{font-size:11px;color:#666;font-weight:650;flex:1}.main{padding:0 24px 40px}.intro{padding:25px 0 20px;border-bottom:1px solid #ececee}.eyebrow{font-size:10px;color:#999;letter-spacing:.12em}.intro h1{font-size:25px;letter-spacing:-.04em;margin:9px 0 6px}.intro p{font-size:12px;line-height:1.8;color:#888;margin:0}.progress{display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid #ececee}.ring{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#222 var(--progress),#eeeeef 0);position:relative}.ring:before{content:"";position:absolute;inset:5px;background:white;border-radius:50%}.ring strong{position:relative;font-size:17px}.progress-info{flex:1;min-width:0}.progress-info strong{display:block;font-size:14px}.progress-info p{font-size:11px;color:#888;line-height:1.8;margin:6px 0 0}.section{padding:22px 0;border-bottom:1px solid #ececee}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.section-head h2{font-size:14px;margin:0}.section-head span{font-size:10px;color:#999}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.badge-card{border:1px solid #e9e9eb;border-radius:10px;padding:15px;min-width:0;background:#fff}.badge-card.unlocked{border-color:#cfcfd2;background:#fdfdfd}.badge-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.sigil{width:36px;height:36px;border:1px solid #e4e4e6;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:650;color:#555}.unlocked .sigil{background:#222;color:#fff;border-color:#222}.state{font-size:9px;color:#999;white-space:nowrap}.unlocked .state{color:#333}.badge-card h3{font-size:12px;margin:0 0 6px}.badge-card p{font-size:10px;color:#888;line-height:1.7;margin:0;min-height:34px}.meter{height:3px;background:#eeeeef;border-radius:4px;overflow:hidden;margin-top:13px}.meter span{display:block;height:100%;background:#333;border-radius:4px;transition:width .25s}.meter-label{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:9px;color:#999}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.summary div{padding:13px 10px;border:1px solid #ececee;border-radius:8px}.summary small{display:block;color:#999;font-size:10px;margin-bottom:7px}.summary strong{font-size:19px}.note{font-size:10px;line-height:1.8;color:#aaa;padding-top:15px}@media(max-width:520px){.main{padding:0 17px 30px}.grid{gap:8px}.badge-card{padding:12px}.badge-card p{min-height:50px}.ring{width:66px;height:66px}.progress{gap:13px}.intro h1{font-size:24px}.summary div{padding:11px 8px}}
</style></head><body><main class="app"><header class="top"><button class="back" id="back" aria-label="返回">‹</button><span class="brand">MAOMAO / 创作成就</span><button id="write" style="border:1px solid #e5e5e7;border-radius:8px;background:#fff;padding:9px 12px;font-size:11px;color:#444">继续写作</button></header><div class="main" id="main"><div class="intro"><div class="eyebrow">MILESTONES / AUTHOR RECORDS</div><h1>创作成就</h1><p>每一步都算数。成就根据当前本地作品记录自动计算。</p></div><p style="font-size:12px;color:#999">正在读取创作记录…</p></div></main>
<script>
(function(){
'use strict';const KEY='maomao_novel_author_v1';const $=id=>document.getElementById(id);let db={works:[],activeId:null};
const wordCount=s=>(String(s||'').match(/[\u3400-\u9fff]|[a-zA-Z0-9]+/g)||[]).length;
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(parsed.works))db=parsed}catch(e){}render()}
function render(){const works=db.works||[];const chapters=works.flatMap(w=>(w.chapters||[]).map(c=>({w,c})));const words=chapters.reduce((n,x)=>n+wordCount(x.c.body),0);const published=chapters.filter(x=>x.c.published).length;const dates=new Set(chapters.map(x=>x.c.updated||x.c.created).filter(Boolean).map(dayKey));const now=new Date();let streak=0,cursor=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(!dates.has(dayKey(cursor)))cursor.setDate(cursor.getDate()-1);while(dates.has(dayKey(cursor))&&streak<366){streak++;cursor.setDate(cursor.getDate()-1)}const complete=works.filter(w=>/完本|已完结|完结/.test(w.status||'')).length;const achievements=[
{symbol:'01',title:'落笔成书',desc:'创建第一部作品',value:works.length,target:1,unit:'部'},
{symbol:'02',title:'故事起航',desc:'为作品保存第一章',value:chapters.length,target:1,unit:'章'},
{symbol:'03',title:'初次发布',desc:'发布第一章正文',value:published,target:1,unit:'章'},
{symbol:'04',title:'千字初稿',desc:'累计正文达到 1,000 字',value:words,target:1000,unit:'字'},
{symbol:'05',title:'万字里程碑',desc:'累计正文达到 10,000 字',value:words,target:10000,unit:'字'},
{symbol:'06',title:'持续创作',desc:'记录到连续 3 天更新',value:streak,target:3,unit:'天'},
{symbol:'07',title:'多线并进',desc:'创建 3 部不同作品',value:works.length,target:3,unit:'部'},
{symbol:'08',title:'完结一卷',desc:'将一部作品标记为完结',value:complete,target:1,unit:'部'},
{symbol:'09',title:'读者来信',desc:'累计获得 10 条读者互动记录',value:works.reduce((n,w)=>n+(w.notes||[]).length,0),target:10,unit:'条'},
{symbol:'10',title:'十万字作者',desc:'累计正文达到 100,000 字',value:words,target:100000,unit:'字'}
];const unlocked=achievements.filter(a=>a.value>=a.target).length;const pct=Math.round(unlocked/achievements.length*100);
$('main').innerHTML='<section class="intro"><div class="eyebrow">MILESTONES / AUTHOR RECORDS</div><h1>创作成就</h1><p>每一步都算数。成就根据当前本地作品记录自动计算，进度会随着保存的创作内容变化。</p></section><section class="progress"><div class="ring" style="--progress:'+pct+'%"><strong>'+pct+'%</strong></div><div class="progress-info"><strong>已解锁 '+unlocked+' / '+achievements.length+' 项成就</strong><p>这里没有虚构的奖励和随机掉落。达到条件后，徽章会自动点亮。</p></div></section><section class="section"><div class="section-head"><h2>创作里程碑</h2><span>ACHIEVEMENTS</span></div><div class="grid">'+achievements.map(a=>{const got=a.value>=a.target;const progress=Math.min(100,Math.round(a.value/a.target*100));return '<article class="badge-card '+(got?'unlocked':'')+'"><div class="badge-top"><div class="sigil">'+a.symbol+'</div><span class="state">'+(got?'已解锁':'进行中')+'</span></div><h3>'+a.title+'</h3><p>'+a.desc+'</p><div class="meter"><span style="width:'+progress+'%"></span></div><div class="meter-label"><span>'+Math.min(a.value,a.target).toLocaleString()+' / '+a.target.toLocaleString()+' '+a.unit+'</span><span>'+progress+'%</span></div></article>'}).join('')+'</div></section><section class="section"><div class="section-head"><h2>创作概览</h2><span>YOUR RECORD</span></div><div class="summary"><div><small>作品</small><strong>'+works.length+'</strong></div><div><small>章节</small><strong>'+chapters.length+'</strong></div><div><small>正文总字数</small><strong>'+words.toLocaleString()+'</strong></div></div><div class="note">连续更新根据章节记录中的最后更新时间估算；旧数据若没有更新时间，不会被当作真实更新日期。成就进度保存在计算逻辑中，不会改写原有作品数据。</div></section>'}
$('back').onclick=()=>{if(history.length>1)history.back();else location.href='novel.html'};$('write').onclick=()=>{location.href='novel-editor.html'};load();
})();
</script></body></html>
