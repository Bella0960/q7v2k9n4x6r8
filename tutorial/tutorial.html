{id:'desktop',cat:'start',title:'认识桌面与应用入口',summary:'桌面图标、应用页面、Dock 与返回桌面的基本逻辑。',minutes:'3 分钟',link:'../index.html',linkText:'打开手机桌面',keywords:'桌面 首页 app 应用 图标 Dock 页面',lead:'MAOMAO 是一部由多个独立页面组成的互动小手机。桌面图标负责打开应用，每个应用有自己的页面；返回桌面后可以继续切换其他应用。',steps:[['打开桌面','从教程顶部点击「返回桌面」，回到 MAOMAO 主屏幕。桌面上的每个图标都对应一个独立应用。'],['认识应用入口','点击一个应用图标进入对应页面。比如「聊天」进入会话列表，「设置」进入系统与功能配置。'],['返回与继续使用','在应用页面使用页面自己的返回入口返回上一层；需要回到手机主屏时，使用应用提供的返回桌面入口。'],['认识 Dock','Dock 是桌面底部的固定快捷入口。当前默认布局中，聊天与店铺位于 Dock；其他图标按桌面分页排列。']],tips:[['页面与数据','不同应用的页面入口不同；编辑某个应用的设置前，先确认当前页面标题。'],['找不到图标','可以进入桌面编辑模式检查图标是否被移入隐藏仓库，或通过设置里的对应功能查找。']],quiz:{q:'桌面上的「设置」图标主要用于什么？',options:['配置系统与功能','生成图片','阅读小说'],answer:0,why:'设置页包含 API、图片生成、MiniMax 语音、外观、字体与数据管理等入口。'}},
{id:'desktop-edit',cat:'start',title:'编辑桌面、图标与组件',summary:'学习桌面编辑入口、移动应用和管理组件。',minutes:'4 分钟',link:'../index.html',linkText:'前往桌面',keywords:'编辑 桌面 移动 图标 组件 挂件 隐藏仓库',lead:'桌面布局可以自定义。MAOMAO 会保存桌面上的应用与组件位置；移除图标通常是移入隐藏仓库，而不是删除应用本身。',steps:[['进入桌面编辑状态','在桌面使用当前界面提供的编辑入口，进入编辑状态后再调整布局。不同设备的触发手势可能不同。'],['调整应用位置','拖动应用图标到希望放置的位置。松开后查看页面排列是否符合预期。'],['管理组件','通过桌面编辑区域的「挂件」入口打开挂件管理；添加或移除组件后，再检查它所在的页面。'],['确认并保存','点击编辑界面的「完成」退出编辑。重新进入桌面，确认布局仍然保留。']],tips:[['移除不等于删除','桌面隐藏仓库用于暂时收纳图标或组件；应用数据与应用页面不会因为图标移走而自动删除。'],['布局保存','换主题或刷新后，先确认桌面布局是否仍然正确，再继续调整其他项目。']],quiz:{q:'把一个应用从桌面移除，通常意味着什么？',options:['应用和数据都删除','图标被收纳，应用仍存在','API 配置被清空'],answer:1,why:'桌面隐藏仓库用于收纳入口，不等于删除应用本体或它的数据。'}},
{id:'settings-map',cat:'start',title:'先认识「设置」应用',summary:'API、语音、生图、字体、外观、数据与其他设置入口。',minutes:'3 分钟',link:'../settings/settings.html',linkText:'打开设置',keywords:'设置 API 图片生成 MiniMax 字体 备份 外观',lead:'设置是 MAOMAO 的配置中心。首次使用时建议先确认 API，再按需配置图片生成与语音；外观与数据管理可以稍后调整。',steps:[['打开设置','从桌面点击「设置」。先浏览页面分组，不需要一次把所有选项都改完。'],['找到 AI 配置','设置页面提供「API 设置」「角色生图与图库」「MiniMax 语音合成」等入口。它们各自负责不同功能。'],['找到外观选项','需要调整桌面、字体或主题时，回到设置中的外观相关入口，不要把聊天主题与桌面壁纸当成同一项。'],['找到数据管理','在 DATA / 数据相关分组查看导入、导出和备份选项。涉及 API 密钥的备份需要特别谨慎。']],tips:[['建议顺序','先把 API 测试成功，再配置图片模型、语音和角色资料。'],['不要急着改高级参数','Temperature、Top P、Tokens 等参数会改变模型回复行为，刚开始先保留默认值。']],quiz:{q:'首次使用，最建议先完成哪件事？',options:['测试 API 连接','先更换全部图标','先导入所有主题'],answer:0,why:'聊天与多项 AI 功能依赖 API 配置，建议先完成基础连接。'}},
{id:'api-connect',cat:'connect',title:'连接聊天 API：从零配置',summary:'创建配置方案、填写服务商、Base URL、API Key 与模型并测试。',minutes:'8 分钟',link:'../settings/settings.html#api',linkText:'打开 API 设置',keywords:'API Key Base URL 模型 服务商 连接 测试 方案',lead:'聊天 API 是 MAOMAO 调用大模型的基础。不同服务商提供的 Base URL、API Key 和模型名称不同，请以你所选服务商控制台显示的信息为准。',notice:'安全提醒：API Key 是账户凭证。不要把真实 Key 发给别人、贴进截图或提交到代码仓库。API 配置保存在本机浏览器的 localStorage；清理网站数据或更换浏览器可能影响本机配置。',steps:[['打开 API 设置','桌面 → 设置 →「API 设置」。页面会打开 API 配置面板。'],['创建或选择配置方案','在「配置方案」区域选择已有方案，或点击「新建方案」。可以为不同服务商分别保存配置。'],['选择服务商','在「服务商」中选择 OpenAI、DeepSeek、Moonshot Kimi、智谱 GLM、硅基流动或「自定义」。快捷预设可以辅助填写地址与模型，但不会替你填写 API Key。'],['填写 Base URL','把服务商给出的 API 根地址填入 Base URL。不要随意把聊天页面地址或官网首页当作 API 地址；是否需要 /v1 以服务商说明为准。'],['填写 API Key','将服务商控制台生成的密钥填入 API Key。输入框默认隐藏密钥；不要在教程练习或截图中填写真实 Key。'],['填写默认模型','在「默认模型」中手动输入模型名，或在已填 Key 后使用「拉取模型」。拉取失败时，按服务商提供的可用模型名称手动填写。'],['保存并测试','点击「保存全部设置」，再点击「测试连接」。只有页面显示连接成功，才算完成配置。'],['首次聊天验证','返回桌面打开聊天，选中一个角色发送简单测试消息。确认收到回复后，再继续配置高级参数。']],tips:[['常见状态码','401 通常表示 Key 错误或失效；403 表示没有访问权限；404 常见于地址或模型名错误；429 表示请求过多或额度用尽。'],['连接失败怎么办','先逐项核对 Base URL、Key、模型名和服务商兼容格式，再确认网络与账户额度。不要通过反复更换随机地址来排错。']],quiz:{q:'API 配置完成后，哪一步能验证服务是否真的可用？',options:['只看输入框有没有内容','保存后点击「测试连接」','只选择服务商'],answer:1,why:'填写内容不等于连接成功；需要保存并运行连接测试。'}},
{id:'api-profiles',cat:'connect',title:'多套 API 方案与模型参数',summary:'为不同服务商建立独立方案，理解温度、Tokens、Top P 与记忆条数。',minutes:'5 分钟',link:'../settings/settings.html#api',linkText:'管理 API 方案',keywords:'配置方案 多方案 Temperature Top P Tokens 记忆条数',lead:'如果你使用多个模型服务商，可以为每套连接分别建立配置方案。高级参数建议在默认连接稳定后再调整。',steps:[['为服务商建立独立方案','在 API 面板的「配置方案」区域新建方案，填写便于识别的名称，例如「日常聊天」。'],['切换前确认当前方案','切换方案前检查方案名称、Base URL 和模型，避免把密钥误填到另一套配置。'],['理解 Temperature','Temperature 控制输出随机性。页面默认值为 0.7；数值越高，回复通常越发散。先保留默认值，再根据实际体验微调。'],['理解最大回复 Tokens','此项限制单次回复长度。留空表示使用服务商默认上限。不要在不了解模型限制时随意设置过低数值。'],['理解 Top P','Top P 是核采样参数，页面提示默认 1。通常不要同时大幅调整 Temperature 和 Top P。'],['设置历史条数与时间感知','「记忆条数（历史条数）」影响发送给模型的历史范围；「AI 时间感知」控制是否注入当前日期。按需要设置并保存。']],tips:[['密钥安全','不同方案都可能保存密钥。删除方案前确认它是否仍在使用；不要把含密钥的截图或备份发给他人。'],['排错顺序','优先确认连接，再调整参数。模型无回复时不要先把多个高级参数一起改动。']],quiz:{q:'刚开始使用 API 时，最稳妥的高级参数策略是什么？',options:['全部调到最大','先保留默认值','同时随机修改所有参数'],answer:1,why:'先建立稳定基线，后续每次只调整一个参数，才容易判断影响。'}},
{id:'image-config',cat:'connect',title:'配置 AI 生图模型',summary:'在 API 设置中指定图片模型和可选图片接口地址。',minutes:'4 分钟',link:'../settings/settings.html#api',linkText:'打开 API 图片生成配置',keywords:'AI 生图 图片生成模型 image model endpoint API',lead:'MAOMAO 的图片生成模型与聊天模型分开填写，但共用当前 API Key。图片服务商需要兼容项目所使用的 OpenAI Images API 请求格式。',notice:'图片模型留空时会关闭生图能力。并非所有聊天模型或 API 服务商都支持图片生成；请先确认服务商支持的模型与接口格式。',steps:[['先完成聊天 API','打开设置 → API 设置，先确认 Base URL 和 API Key 已经能通过聊天连接测试。'],['填写图片生成模型','在 API 设置里的「图片生成」区域，填写服务商支持的图片模型名称。页面示例 gpt-image-1 仅作格式参考，实际以服务商支持为准。'],['确认图片接口地址','「图片生成接口 URL」是可选项。留空时使用 Base URL 加上 /images/generations；只有服务商要求独立地址时才填写。'],['保存配置','点击「保存全部设置」。聊天模型与图片模型分别配置，不要把图片模型名称填进默认聊天模型栏。'],['打开角色生图页','从设置选择「角色生图与图库」，进入角色生图页面，查看是否已识别图片模型。']],tips:[['共用密钥','当前图片模型共用聊天 API Key，不需要在图片设置里再复制一份密钥。'],['接口兼容','如果服务商只支持自有图片协议，可能无法直接使用；不要把普通聊天接口当成图片接口。']],quiz:{q:'图片生成模型应该填写在哪个位置？',options:['默认聊天模型','API 设置的「图片生成模型」','角色名称'],answer:1,why:'聊天模型与图片模型分别配置，图片模型在专门的图片生成区域。'}},
{id:'image-generate',cat:'connect',title:'生成角色图片与管理图库',summary:'保存固定外貌、画风关键词、填写场景并生成私密图片。',minutes:'6 分钟',link:'../settings/image-generation.html',linkText:'打开角色生图',keywords:'角色生图 画风 外貌 场景 /photo 私密 图库 图片',lead:'角色生图会把角色的固定外貌与临时场景分开处理。固定外貌用于保持角色一致性，场景补充则描述这一次图片里发生的事情。',notice:'角色生图页会把最近 14 条文字聊天消息与场景补充发送给当前聊天 API 服务商，用于整理画面描述。生成的图片默认以私密方式保存在本机图库。',steps:[['选择角色','打开「角色生图与图库」，在「选择角色」中选中要生成图片的角色。'],['填写固定外貌','填写不会随场景变化的发色、发型、瞳色、标志性配饰等稳定特征。未填写固定外貌时，页面不会开始生成。'],['填写画风关键词','添加希望保持的画风关键词。建议只写画风、光线、镜头氛围等，不要把临时场景塞进固定外貌。'],['保存角色设定','点击「保存角色设定」，确认页面出现已保存提示。'],['描述本次场景','在「场景补充」中写本次画面，例如地点、时间、动作与氛围。场景不会覆盖已保存的固定外貌。'],['选择隐私并生成','默认勾选「保存为私密图片」。确认后点击「生成图片」，等待页面状态提示完成或失败。'],['在图库查看','到「角色图库」中查看生成图片，可以使用「全部 / 私密 / 公开」筛选。']],tips:[['从聊天快速生成','单人聊天中可以输入 /photo，或输入 /photo 加场景补充，让当前角色生成图片。'],['生成失败','先确认 API Key、图片模型与服务商图片接口兼容，再检查网络；不要把 API Key 发给别人排错。']],quiz:{q:'固定外貌与场景补充有什么区别？',options:['固定外貌描述角色长期特征；场景描述本次画面','两者完全相同','场景补充会永久覆盖角色外貌'],answer:0,why:'固定外貌保持角色身份一致，场景补充只描述本次生成内容。'}},
{id:'minimax-tts',cat:'connect',title:'连接 MiniMax 语音合成',summary:'选择区域版本、填写 API Key 与 Group ID、选择 TTS 模型并保存。',minutes:'6 分钟',link:'../settings/minimax-tts.html',linkText:'打开 MiniMax 语音设置',keywords:'MiniMax TTS 语音合成 API Key Group ID speech-01 speech-02 voice ID',lead:'MiniMax TTS 是文字转语音服务。它与聊天 API 是两套配置：聊天 API 用于生成文字回复，MiniMax TTS 用于把文字合成为语音。',steps:[['打开 MiniMax 设置','桌面 → 设置 →「MiniMax 语音合成」。'],['选择 API 版本','页面提供国际版 Global（minimax.io）与官方版 / 大陆版（minimaxi.com）。根据你的 MiniMax 账户所属区域选择对应版本。'],['填写 MiniMax API Key','在 MiniMax 控制台获取 API Key，填入页面的 MiniMax API Key 输入框。不要把它与聊天 API Key 混为一谈。'],['填写 Group ID','到 MiniMax 账户管理 → 账户信息中复制 Group ID，填入对应输入框。'],['选择 TTS 模型','页面当前提供 speech-01 与 speech-02 两个选项；按页面介绍选择适合的模型。'],['启用并保存','打开「启用 MiniMax 语音合成」开关，点击「保存 TTS 设置」。配置未保存前不要离开页面。'],['完成角色与聊天侧配置','设置页提示：完整启用还需要角色资料中的 voice ID，以及对应聊天的聊天设置里的 MiniMax 语音开关。当前主分支角色编辑页未检索到明确的 voice ID 输入控件，因此此处不猜测入口；请以实际角色页面显示为准。']],tips:[['区域要对应','国际版账户选 Global，国内账户选官方版 / 大陆版。选择错误可能导致请求失败。'],['与语音输入不同','本页配置的是 TTS 文字转语音，不等于语音识别或语音转文字。']],quiz:{q:'MiniMax TTS 页面除了 API Key，还明确要求填写什么账户信息？',options:['Group ID','聊天角色昵称','桌面壁纸地址'],answer:0,why:'MiniMax 设置页把 Group ID 列为单独凭证字段。'}},
{id:'mix-service',cat:'connect',title:'MIX 服务连接说明',summary:'先确认 MIX 指的是哪项服务，避免把不同服务的密钥或地址填错。',minutes:'1 分钟',link:'../settings/settings.html',linkText:'查看当前设置入口',keywords:'MIX MIX连接 MIX语音 服务商',lead:'我已检查当前主分支里可检索到的设置页与连接代码，目前没有找到能够确认名称为「MIX」的独立配置入口、API 字段或连接协议。',notice:'<strong>当前状态：待确认。</strong>这不是已经接通的教程章节。为了避免把 MIX 与 MiniMax TTS 或其他服务混淆，本节暂不提供虚构的 API 地址、密钥字段或连接步骤。',steps:[['先区分服务名称','MiniMax TTS 已有独立设置页；「MIX」在当前代码中没有找到对应的明确入口。两者不能默认视为同一个服务。'],['确认 MIX 的具体指代','先确认你说的 MIX 是哪个平台、功能或设置页名称。'],['核对入口和配置项','确认后，再按实际页面记录官网入口、凭证字段、模型/音色、保存方式与测试方法。'],['补齐逐步教学','入口接入 MAOMAO 后，教程再增加逐步点击、测试与错误排查。']],tips:[['不混用密钥','不同语音平台的 API Key、Group ID、Endpoint 和模型名不能互相替代。'],['后续可补全','确认服务名称或设置页面后，这一节就能补成完整的交互式连接教程。']],quiz:{q:'当前代码中没有确认 MIX 的连接入口时，正确做法是什么？',options:['猜一个 API 地址试试','把 MiniMax Key 填进去','先确认具体服务，再编写步骤'],answer:2,why:'先核对实际服务与字段，才能避免误配凭证或教错操作。'}},
{id:'character-create',cat:'character',title:'创建与编辑角色',summary:'设置角色名称、人设、固定外貌、头像，并保存角色档案。',minutes:'5 分钟',link:'../worldbook/characters/characters.html',linkText:'打开角色库',keywords:'角色库 创建角色 人设 头像 外貌 JSON 保存',lead:'角色库用于建立角色档案。人设描述回答「TA 是谁、怎样思考和表达」；固定外貌则专门服务于生图时的身份一致性。',steps:[['打开角色库','从桌面打开「角色库」，进入角色档案列表。'],['新建角色档案','在角色库中使用新增角色入口，填写角色名称。名称是后续选择角色的重要识别信息。'],['上传头像并填写人设','按页面字段上传头像，填写角色身份、性格、背景等人设内容。尽量写清楚稳定信息。'],['补充固定外貌','在「固定外貌描述」中记录发型、发色、瞳色和标志性配饰等。此处用于生图，不要写临时剧情。'],['按需导入或绑定世界书','可以选择角色 JSON 文件导入；也可以在角色档案中绑定需要使用的世界书。导入前先确认文件来源可信。'],['保存并检查','点击「保存设定」，回到角色列表确认角色出现，再进入角色档案复核信息。']],tips:[['人设要可执行','与其只写「温柔」，不如补充角色如何说话、如何处理冲突、有什么习惯。'],['导入文件','只导入你信任的角色 JSON；导入后检查名称、人设和绑定内容是否正确。']],quiz:{q:'固定外貌描述主要用于什么？',options:['每次生图保持角色外观稳定','代替角色人设','修改桌面图标'],answer:0,why:'角色库把固定外貌与人设分开保存，供角色生图使用。'}},
{id:'chat-start',cat:'character',title:'开始聊天与管理会话',summary:'从角色进入会话，认识消息发送、会话列表与聊天设置。',minutes:'4 分钟',link:'../chat/chat/chat.html',linkText:'打开聊天',keywords:'聊天 会话 角色 消息 回复 聊天设置',lead:'聊天是 MAOMAO 的核心区域。先确认已经有可用角色和已通过测试的 API，再进入会话发送第一条消息。',steps:[['打开聊天','从桌面 Dock 或应用入口点击「聊天」，进入会话列表。'],['选择角色会话','选择已有角色会话；如尚未建立会话，先从角色库准备角色，再按聊天页提供的入口开启会话。'],['发送第一条消息','先发送简短测试消息，确认网络和 API 正常，再开始长对话或使用其他能力。'],['打开聊天设置','在对应会话中使用聊天页面提供的设置入口。不同角色的会话设置应在对应会话里核对。'],['检查消息与媒体','发送后确认消息出现在当前会话中；图片、语音、通话、红包等特殊内容要根据页面对应入口使用。']],tips:[['不要把所有问题都归因于角色','AI 不回复时先检查 API 测试、网络和模型，再检查角色提示词。'],['数据隔离','处理某个角色设置时，确认当前选中的角色。']],quiz:{q:'聊天功能出现 AI 不回复，最先应该确认什么？',options:['API 是否连接成功','先更换桌面壁纸','清空所有会话'],answer:0,why:'API 和网络是生成回复的基础；先排查连接，再处理其他问题。'}},
{id:'worldbook',cat:'character',title:'世界书：创建、条目与作用范围',summary:'区分全局/角色专属世界书，了解关键词、触发模式与导入导出。',minutes:'7 分钟',link:'../worldbook/worldbook/worldbook.html',linkText:'打开世界书',keywords:'世界书 global local 全局 角色专属 条目 关键词 概率 始终 导入 导出',lead:'世界书用来保存角色或故事需要参考的背景资料。当前页面支持全局与本地范围；条目还可以配置触发方式、位置与启用状态。',steps:[['打开世界书','从桌面打开「世界书」，查看世界书列表。'],['新建世界书','点击页面底部「新建世界书」，先填写名称，再按需要添加内容条目。'],['选择作用范围','全局世界书可供全局使用；本地 / 角色专属世界书用于限定范围。创建或编辑时确认 scope 选择正确。'],['添加条目内容','展开某本世界书，按页面入口添加条目。条目名称与内容要清晰，方便后续维护。'],['设置触发方式','条目可按页面提供的方式设置为「始终」「关键词」或「概率」触发；不要把触发条件误当成条目正文。'],['检查插入位置与启用状态','页面还提供前、中、后等插入位置与启用状态。修改后重新检查展开的条目。'],['导入或导出','右上角加号菜单提供本地文件导入与导出入口。导入后检查书名和条目内容，避免重复或错误覆盖。']],tips:[['写成可检索的资料','每个条目聚焦一个主题，减少互相矛盾的内容。'],['全局与本地分清楚','不希望其他角色引用的设定，不要误放到全局范围。']],quiz:{q:'只希望某个角色使用的背景设定，应该优先考虑哪种范围？',options:['全局','本地 / 角色专属','不需要范围设置'],answer:1,why:'本地范围用于限定角色或局部使用，全局范围则作用更广。'}},
{id:'memory',cat:'character',title:'记忆应用与角色上下文',summary:'认识记忆页面，查看与维护角色对话相关的记忆内容。',minutes:'4 分钟',link:'../worldbook/memory/memory.html',linkText:'打开记忆',keywords:'记忆 AI 记忆 总结 角色 历史',lead:'记忆页用于查看和管理 AI 对话相关的记忆内容。记忆不是世界书：世界书偏向预先编写的背景资料，记忆偏向对话中积累或整理的信息。',steps:[['打开记忆','从桌面打开「记忆」，先查看当前页面显示的记忆列表和角色范围。'],['确认当前角色','执行整理或管理操作前，确认当前记忆对应哪个角色，避免把不同角色的信息混在一起。'],['查看已有内容','检查记忆条目是否准确、是否过时，尤其注意角色姓名、关系和重要事件。'],['按页面入口执行整理','如页面提供总结或整理操作，先阅读提示，再执行。若提示 API 未配置，返回设置完成 API 配置。'],['回到聊天验证','返回对应角色会话，观察后续回复是否正确使用相关信息。发现错误时优先修正记忆来源。']],tips:[['与世界书的区别','世界书适合稳定设定；记忆适合对话中积累的事件和关系。两者可以配合，但不要重复堆叠矛盾内容。'],['避免无效内容','只保留对未来对话有帮助的信息，过时或错误的内容应及时修正。']],quiz:{q:'世界书与记忆最主要的区别是什么？',options:['世界书偏背景设定，记忆偏对话积累','两者完全相同','记忆用于更换壁纸'],answer:0,why:'世界书保存背景资料，记忆管理对话中形成的重要信息。'}},
{id:'voice-calls',cat:'character',title:'聊天语音、通话与声音设置',summary:'区分文字转语音、语音消息和语音/视频通话入口。',minutes:'4 分钟',link:'../chat/chat/chat.html',linkText:'打开聊天',keywords:'语音 通话 视频通话 TTS MiniMax 声音',lead:'MAOMAO 中的「语音合成」「语音消息」和「语音 / 视频通话」不是同一项能力。MiniMax 设置页配置的是 TTS 文字转语音。',steps:[['先区分能力','TTS 是把文字转换为语音；语音输入/转写是把声音识别成文字；通话则属于会话互动功能。不要用同一套配置推断三者都已启用。'],['确认 TTS 配置','如需角色朗读文字，先完成本教程的 MiniMax TTS 连接章节。'],['检查会话设置','进入对应角色聊天，在聊天设置中查看页面提供的语音开关。开关状态应与当前角色会话对应。'],['尝试通话入口','在聊天页面按实际提供的通话入口发起语音或视频通话；通话音频权限由浏览器或设备系统控制。'],['排查无声','先检查设备音量、浏览器音频权限、TTS 是否启用与会话设置，再检查 API 服务状态。']],tips:[['权限提示','浏览器可能要求麦克风或音频播放权限；只在信任的 MAOMAO 页面授予需要的权限。'],['不同服务分开排查','MiniMax TTS 失败不代表聊天 API 也失败，反过来也一样。']],quiz:{q:'MiniMax TTS 主要负责什么？',options:['把文字合成为语音','把壁纸裁切成头像','导入角色 JSON'],answer:0,why:'TTS 是 Text to Speech，即文字转语音。'}},
{id:'custom-icons',cat:'personal',title:'更换应用图标与图标套装',summary:'使用单个图标上传与整套预设管理，保持桌面视觉统一。',minutes:'4 分钟',link:'../settings/settings.html',linkText:'打开设置',keywords:'图标 上传 图标套装 预设 管理 默认',lead:'桌面图标可以逐个自定义，也可以通过图标套装统一管理。更换图标不会改变应用实际打开的页面。',steps:[['打开图标设置','进入设置页面，找到图标管理相关区域。'],['单独更换图标','选择目标应用，上传对应图片并预览。确认图片对应的是正确应用。'],['保存整套配置','在图标管理区域底部使用「图标套装 / 预设管理」，将当前整套图标配置保存为预设。'],['切换已保存套装','从已保存的套装中选择一套应用，检查桌面图标是否按预期更新。'],['恢复默认','需要还原时，在图标套装管理区域使用恢复默认操作；确认提示后再执行。']],tips:[['不要混淆单个图标与整套预设','单个上传用于改一个应用；套装管理用于保存或切换整组配置。'],['原图留存','上传前保留原图副本，方便以后重新使用。']],quiz:{q:'想保存当前所有应用图标，应该使用什么功能？',options:['单个图标上传','图标套装 / 预设管理','API 设置'],answer:1,why:'图标套装管理用于保存、切换整套图标配置。'}},
{id:'wallpaper-widgets',cat:'personal',title:'壁纸与桌面组件',summary:'设置主页背景、上传组件图片并检查保存状态。',minutes:'4 分钟',link:'../index.html',linkText:'打开桌面',keywords:'壁纸 背景 桌面组件 组件 上传 图片墙 拍立得',lead:'桌面壁纸与组件图片是不同的设置对象。更换全局桌面壁纸，不代表每个组件自己的封面图片也会一起改变。',steps:[['进入桌面外观设置','从设置中打开桌面外观或壁纸相关入口，选择图片并预览。'],['确认主页背景','保存后回到桌面，检查主页背景是否正确显示。'],['单独设置组件图片','需要更换拍立得、图片墙、头像等组件内容时，直接在对应组件的上传位置操作。'],['检查上传是否保存','上传后退出编辑状态，再返回桌面确认图片仍然存在。不要只看上传瞬间的预览。'],['调整组件布局','如需移动或隐藏组件，回到桌面编辑状态进行操作，完成后退出编辑。']],tips:[['壁纸与组件分开','主页封面、组件图片和聊天背景可能分别保存，不能假设一次上传会同步所有位置。'],['上传后复查','尤其在手机网络不稳定时，确认图片再次进入页面仍能显示。']],quiz:{q:'主页壁纸更换后，组件自己的图片会自动同步吗？',options:['一定会','不会自动保证同步，需要分别检查','会清空所有组件'],answer:1,why:'主页壁纸与各组件图片属于不同内容，应该分开检查。'}},
{id:'fonts',cat:'personal',title:'导入字体与预览',summary:'从字体设置入口导入字体文件，预览后应用或恢复默认。',minutes:'4 分钟',link:'../settings/font-settings.html',linkText:'打开字体设置',keywords:'字体 导入 TTF WOFF WOFF2 预览 恢复默认',lead:'MAOMAO 支持通过字体设置入口管理自定义字体。请使用自己有权使用的字体文件，并在导入后先预览，再确认应用效果。',steps:[['打开字体设置','桌面 → 设置 → 字体设置。'],['选择字体文件','按照页面支持的格式选择字体文件，常见格式包括 TTF、OTF、WOFF 或 WOFF2；以当前文件选择器提示为准。'],['填写预设名称','给字体预设起一个容易识别的名称，避免多套字体混淆。'],['预览与应用','先在预览区域检查中文、数字和符号显示，再应用到页面。'],['恢复默认','如果出现字体不完整、页面排版异常或加载变慢，可在字体设置中恢复默认字体后再排查文件。']],tips:[['字体授权','仅导入你有权使用的字体文件。'],['先小范围检查','导入后先切换几个页面观察加载和排版，不要一次连续导入很多字体。']],quiz:{q:'导入字体后最稳妥的下一步是什么？',options:['立即导入更多字体','先预览并检查多个页面','删除原字体文件'],answer:1,why:'预览与页面检查可以尽早发现缺字、排版或加载问题。'}},
{id:'chat-beauty',cat:'personal',title:'聊天美化与主题',summary:'区分聊天外观、全局主题和桌面图标风格。',minutes:'3 分钟',link:'../beauty/beauty.html',linkText:'打开聊天美化',keywords:'聊天美化 主题 壁纸 气泡 外观',lead:'聊天美化用于调整聊天页面的视觉呈现；它与桌面壁纸、应用图标和系统主题不是同一层设置。',steps:[['打开聊天美化','从桌面点击「聊天美化」，查看当前可用的主题或美化方案。'],['选择方案并预览','切换方案前先预览效果，确认聊天列表与聊天详情页的呈现符合预期。'],['应用后检查页面','回到聊天列表，再打开一个会话，分别检查列表和聊天详情页面。'],['区分不同页面外观','桌面主题、聊天列表主题和聊天详情主题可能分别生效；需要逐页确认。']],tips:[['出现不一致','先确认修改的是聊天美化还是桌面外观设置，再检查对应页面是否支持当前方案。'],['保留喜欢的方案','切换前记录当前方案名称，方便回退。']],quiz:{q:'聊天气泡外观应该优先从哪里调整？',options:['聊天美化','世界书','钱包'],answer:0,why:'聊天美化是聊天界面视觉方案的专门入口。'}},
{id:'forum',cat:'daily',title:'论坛与社区互动',summary:'从论坛入口查看主题内容，并参与页面提供的互动。',minutes:'3 分钟',link:'../forum/forum.html',linkText:'打开论坛',keywords:'论坛 帖子 评论 社区 动态',lead:'论坛是手机中的社区类应用。页面内容和可用操作以当前主题及论坛页面显示为准。',steps:[['打开论坛','从桌面点击「论坛」，进入社区首页。'],['浏览主题内容','查看帖子标题、作者、正文与配图，点开感兴趣的内容进入详情。'],['参与互动','在帖子详情页使用页面实际提供的评论或互动入口。发送前确认当前帖子与回复对象。'],['检查内容是否发布','提交后返回帖子详情，确认内容已显示；网络失败时不要连续重复提交。']],tips:[['角色内容与用户内容','辨认帖子作者与内容来源，避免把 AI 角色动态当成自己的用户发帖。'],['重复提交','点击发布后先等页面反馈，再决定是否重试。']],quiz:{q:'发布或评论后，如何确认操作成功？',options:['只看按钮点击动画','检查帖子详情是否出现新内容','刷新后不看结果'],answer:1,why:'最终应以帖子详情里的实际内容为准。'}},
{id:'wallet',cat:'daily',title:'钱包、记账、店铺与外卖',summary:'认识钱包相关应用入口，区分不同生活功能。',minutes:'4 分钟',link:'../wallet/wallet.html',linkText:'打开钱包',keywords:'钱包 记账 店铺 外卖 订单 余额',lead:'钱包、记账、店铺和外卖是不同的生活类入口。它们可能共享部分生活数据，但不要把一个页面的操作结果当成另一个页面已同步。',steps:[['打开钱包','从桌面点击「钱包」，先查看当前页面的账户与交易入口。'],['查看记账','使用桌面「记账」入口进入收支记录页面，按页面字段创建记录并检查保存结果。'],['查看店铺','从桌面「店铺」入口浏览商品或服务，具体下单规则以页面显示为准。'],['查看外卖','打开「外卖」，按页面分类浏览内容；加入购物车或提交订单前，确认商品详情与数量。'],['确认操作结果','涉及金额、订单或删除记录时，提交前再次核对信息，提交后检查订单或记录状态。']],tips:[['这是模拟应用','钱包、记账、店铺和外卖的具体数据与交易能力以 MAOMAO 页面实际实现为准，不等于真实银行或外部支付账户。'],['先核对再提交','金额、数量和订单信息提交前都要检查。']],quiz:{q:'钱包类应用中，提交金额或订单前应该做什么？',options:['核对内容和金额','连续快速点击提交','忽略页面确认'],answer:0,why:'涉及金额与订单的操作都应先核对，再确认提交。'}},
{id:'cafe',cat:'daily',title:'咖啡馆与陪伴类应用',summary:'认识咖啡馆、情侣空间、共同成长、陪伴日历与直播间。',minutes:'4 分钟',link:'../cafe/cafe.html',linkText:'打开咖啡馆',keywords:'咖啡馆 情侣空间 共同成长 陪伴日历 直播间',lead:'这些应用分别承担经营互动、关系记录、共同成长、日历与直播互动等体验。进入后先阅读页面的当前状态与操作提示。',steps:[['进入咖啡馆','打开「咖啡馆」，查看营业状态、菜单和页面提供的经营或互动入口。'],['查看情侣空间','从桌面打开「情侣空间」，浏览双方资料与页面提供的互动功能。'],['查看共同成长','打开「共同成长」，了解成长记录和当前目标，再按页面提示进行互动。'],['查看陪伴日历','打开「陪伴日历」，查看日期与陪伴记录；编辑前先确认当前选中的日期。'],['进入直播间','打开「直播间」，查看当前直播内容与评论入口，按页面实际提供的操作参与。']],tips:[['不同应用独立','这些应用的记录和设置入口各自不同；需要修改时回到对应应用操作。'],['保留真实状态','营业中、直播中或日历状态以页面显示为准，不要把示例内容当成真实事件。']],quiz:{q:'要管理某一天的陪伴记录，应该打开哪个应用？',options:['陪伴日历','主题商城','API 设置'],answer:0,why:'陪伴日历是日历和陪伴记录入口。'}},
{id:'reading-writing',cat:'daily',title:'阅读、小说工坊、日记与信封',summary:'阅读书架、创作、私人记录与信件应用的入口。',minutes:'5 分钟',link:'../library/library.html',linkText:'打开阅读',keywords:'阅读 书架 TXT DOCX 小说工坊 日记 信封 书籍',lead:'MAOMAO 将阅读、小说创作、日记和信件拆成不同应用。导入文件前先确认格式和内容，保存后再返回列表检查。',steps:[['打开阅读','从桌面点击「阅读」，进入私人藏书室与书架。'],['导入书籍','按书架页面提供的导入入口选择支持的文件。导入时填写书名与目录等页面要求的信息，导入后检查章节是否完整。'],['打开小说工坊','点击「小说工坊」，查看创作、作品管理与阅读相关页面入口。具体编辑能力以当前页面为准。'],['记录日记','打开「日记」，按页面提供的编辑入口创建记录。保存后返回列表确认内容。'],['使用信封','打开「信封」，按页面提供的寄件人、收件人和信件编辑入口创建信件，并预览展开效果。']],tips:[['文件导入','导入前保留源文件副本；遇到编码或目录问题时先检查文件本身。'],['私人内容','日记、信件和书籍可能包含私人信息，分享截图或文件前先检查内容。']],quiz:{q:'导入书籍后，最需要检查哪两项？',options:['书名与目录','桌面时钟与壁纸','API Key 与 Group ID'],answer:0,why:'书名与目录决定书架识别和章节组织是否正确。'}},
{id:'creative',cat:'daily',title:'视觉档案、角色足迹、触梦旅行与游戏',summary:'认识创作、探索和娱乐类应用的独立入口。',minutes:'4 分钟',link:'../poster/poster.html',linkText:'打开视觉档案',keywords:'视觉档案 海报 角色足迹 触梦旅行 游戏大厅 查手机',lead:'这些应用提供视觉创作、足迹记录、幻想旅行、游戏和手机检查等体验。不同模块的具体互动流程以应用内部当前页面为准。',steps:[['视觉档案','打开「视觉档案」，查看互动海报与视觉档案页面，先熟悉预览与编辑入口。'],['角色足迹','打开「角色足迹」，查看角色活动或足迹记录；注意当前选择的角色。'],['触梦旅行','打开「触梦旅行」，浏览幻想目的地与页面给出的探索入口。'],['游戏大厅','进入「游戏大厅」，选择当前已提供的游戏入口。不同游戏有独立规则，开始前阅读页面说明。'],['查手机','打开「查手机」，按页面提示检查手机模拟器相关状态。']],tips:[['游戏进度','开始游戏前先确认是否会创建新进度或覆盖已有记录。'],['角色归属','角色足迹和角色互动页面都要确认当前角色，避免查看错对象。']],quiz:{q:'开始某个游戏前，应该先做什么？',options:['阅读该游戏页面的规则说明','先清空所有数据','直接连续点击所有按钮'],answer:0,why:'每个游戏模块的规则与操作入口可能不同，先阅读页面提示。'}},
{id:'backup',cat:'data',title:'备份、恢复与密钥保护',summary:'了解数据导出、导入，以及为什么 API 密钥默认不随普通备份导出。',minutes:'5 分钟',link:'../settings/settings.html',linkText:'打开设置',keywords:'备份 导出 导入 恢复 数据 API Key 密钥 安全',lead:'备份适合迁移或保存角色、聊天与应用数据。API Key 等凭证属于敏感信息，当前备份工具默认不会把它们放进普通备份。',steps:[['打开设置的数据区域','从桌面打开「设置」，找到 DATA / 数据相关分组。'],['先查看导出说明','使用导出前阅读页面提示，确认导出范围和文件用途。'],['默认不导出密钥','普通备份默认排除 API Key、API 配置方案与 MiniMax TTS 密钥，降低分享文件泄露凭证的风险。'],['仅在必要时处理密钥','如果整机迁移确实需要包含密钥，必须使用页面明确提供的密钥导出选项并完成二次确认。不要把含密钥的文件发给别人。'],['恢复前先备份当前数据','导入备份可能覆盖部分本地数据。恢复前先导出当前数据，并确认文件来源可靠。'],['恢复后检查','导入完成后逐项检查角色、聊天、世界书与应用数据；API 配置若未包含在备份中，需要在本机重新配置。']],tips:[['分享备份','给别人排查问题时，优先使用不包含密钥的备份。'],['设备迁移','新设备恢复后重新测试 API；不要因为旧设备能聊天就假设新设备密钥已迁移。']],quiz:{q:'普通备份默认如何处理 API 密钥？',options:['自动公开导出','默认排除密钥','发送给所有角色'],answer:1,why:'备份代码将 API 与 TTS 凭证列为敏感项，默认不导出。'}},
{id:'api-errors',cat:'data',title:'API 连接失败排查',summary:'按 401、403、404、429 与网络问题逐项检查。',minutes:'4 分钟',link:'../settings/settings.html#api',linkText:'返回 API 设置',keywords:'API 401 403 404 429 超时 失败 网络 Key',lead:'遇到连接失败时，一次只检查一个变量。先看测试连接返回的错误，再核对地址、密钥、模型、账户权限和额度。',steps:[['先运行测试连接','回到设置 → API 设置，点击「测试连接」，记录页面提示或错误码。'],['401：检查密钥','重新确认复制的 API Key 完整、没有多余空格、没有被撤销或过期。'],['403：检查权限','确认账户有权调用该模型或接口，服务商账户状态与权限正常。'],['404：检查地址与模型','核对 Base URL 是否为 API 根地址，模型名是否确实存在且服务商支持。'],['429：检查频率与额度','查看服务商账户额度、速率限制与账单状态，避免连续重复发送请求。'],['网络或超时','检查当前网络、浏览器代理和服务商状态；网络恢复后再测试，不要把随机地址当作修复方法。']],tips:[['先记下错误','错误码能缩小排查范围；不要只说「连不上」而不保留页面提示。'],['别泄漏密钥','分享报错截图前遮住 API Key、Group ID 和账户信息。']],quiz:{q:'API 测试返回 401，最优先检查什么？',options:['API Key 是否正确有效','桌面图标是否完整','字体文件格式'],answer:0,why:'401 通常表示认证失败，应先核对密钥。'}},
{id:'image-errors',cat:'data',title:'生图失败与图片不显示',summary:'检查图片模型、接口兼容、角色外貌、隐私与图库。',minutes:'3 分钟',link:'../settings/image-generation.html',linkText:'打开角色生图',keywords:'生图失败 图片不显示 模型 API 图片接口 角色图库',lead:'生图失败不一定是提示词问题。先确认图片模型与 API，再检查角色资料和图片隐私设置。',steps:[['检查图片模型','设置 → API 设置 → 图片生成，确认图片模型字段已填写。'],['确认接口兼容','确认服务商支持项目当前使用的 Images API 格式；如要求独立 URL，再填写图片接口地址。'],['确认固定外貌','角色生图页面选择角色并填写固定外貌描述，否则页面不会开始生成。'],['查看生成状态','生成时观察页面状态提示。失败后先看错误信息，再决定是否修改设置。'],['检查图库筛选','生成后到图库查看「全部 / 私密 / 公开」筛选，确认图片是否被当前筛选条件隐藏。']],tips:[['私密图片','默认私密图片可能不会出现在公开筛选中。'],['不要反复盲试','先核对模型、接口和 API，再尝试调整场景描述。']],quiz:{q:'生成图片后在图库里找不到，先检查什么？',options:['图库筛选条件','聊天角色昵称','Dock 图标顺序'],answer:0,why:'图库有全部、私密、公开筛选，筛选条件可能隐藏目标图片。'}},
{id:'page-errors',cat:'data',title:'页面打不开、数据异常怎么办',summary:'从页面路径、网络缓存、浏览器数据和备份恢复顺序排查。',minutes:'4 分钟',link:'../index.html',linkText:'返回桌面',keywords:'页面打不开 无法打开网页 加载失败 数据 丢失 缓存',lead:'如果某个应用打不开，先确认是否只有一个页面异常，再检查网络和浏览器缓存。不要一开始就清空全部网站数据，因为这可能同时清除本地角色和配置。',steps:[['确认具体哪个页面失败','记录应用名称、页面标题和出现问题的操作。先尝试从桌面重新打开同一应用。'],['检查网络和页面地址','确认页面地址仍属于当前 MAOMAO 站点，没有跳到无关或错误域名。'],['刷新前保留重要内容','输入框里尚未保存的内容先复制到安全位置，再刷新页面。'],['不要贸然清理网站数据','localStorage 与 IndexedDB 可能保存角色、聊天、壁纸和设置；清理前必须做好可用备份。'],['更新后复查','正式版本更新后重新打开应用，检查页面是否来自最新版本；必要时关闭旧页面再进入。'],['恢复前确认备份','如果怀疑数据异常，先确认备份文件存在且可用，再按设置页的恢复流程操作。']],tips:[['本地数据很重要','MAOMAO 多项设置保存在浏览器本机。清缓存、换浏览器或换设备可能导致本机数据不可见。'],['遇到回归','记录发生问题的页面和步骤，比反复卸载或清除数据更有助于定位问题。']],quiz:{q:'页面异常时，最不建议一开始就做什么？',options:['记录具体页面与错误','贸然清空全部网站数据','检查网络与地址'],answer:1,why:'清空网站数据可能同时删除本地角色、聊天与配置。'}}
];

var progress=loadProgress(),activeCategory='start',activeLesson=null,searchQuery='';
var $=function(id){return document.getElementById(id);};
function loadProgress(){try{var v=JSON.parse(localStorage.getItem(KEY)||'{}');return v&&typeof v==='object'?{done:v.done||{},steps:v.steps||{},last:v.last||'desktop'}:{done:{},steps:{},last:'desktop'};}catch(e){return{done:{},steps:{},last:'desktop'};}}
function saveProgress(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){}updateProgress();}
function updateProgress(){var n=lessons.length,d=lessons.filter(function(x){return!!progress.done[x.id];}).length,p=n?Math.round(d/n*100):0;$('progressNumber').textContent=p+'%';$('progressFill').style.width=p+'%';$('progressNote').textContent=d+' / '+n+' 节已完成 · 进度保存在本机';$('statLessons').textContent=n;$('statApps').textContent=apps.length;}
function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('show');window.clearTimeout(toast.timer);toast.timer=window.setTimeout(function(){el.classList.remove('show');},1900);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function categoryFor(id){return categories.find(function(c){return c.id===id;});}
function lessonById(id){return lessons.find(function(l){return l.id===id;});}
function renderNav(){$('categoryNav').innerHTML=categories.map(function(c){var n=c.id==='apps'?apps.length:lessons.filter(function(l){return l.cat===c.id;}).length;return'<button type="button" class="nav-category '+(activeCategory===c.id?'active':'')+'" data-category="'+esc(c.id)+'"><span>'+esc(c.title)+'</span><span class="nav-count">'+n+'</span></button>';}).join('');$('categoryNav').querySelectorAll('[data-category]').forEach(function(b){b.addEventListener('click',function(){activeCategory=b.dataset.category;activeLesson=null;searchQuery='';$('searchInput').value='';render();});});}
function renderCategory(){var c=categoryFor(activeCategory),list=lessons.filter(function(l){return l.cat===activeCategory;});var h='<div class="panel-head"><div><div class="panel-kicker">'+esc(c.en)+'</div><h2>'+esc(c.title)+'</h2><div class="panel-desc">'+esc(c.desc)+'</div></div><div class="lesson-count">'+(activeCategory==='apps'?apps.length:list.length)+' 项内容</div></div><div class="panel-body">';
if(activeCategory==='apps'){h+='<div class="app-map">'+apps.map(function(a){return'<div class="app-entry"><strong>'+esc(a[0])+'</strong><span>'+esc(a[1])+'</span><a href="'+esc(a[2])+'">打开应用 ↗</a></div>';}).join('')+'</div>';}
else{h+='<div class="lesson-grid">'+list.map(function(l,i){return'<button type="button" class="lesson-card" data-lesson="'+esc(l.id)+'"><span class="lesson-num">'+String(i+1).padStart(2,'0')+'</span><span class="lesson-copy"><span class="lesson-title">'+esc(l.title)+'</span><span class="lesson-summary">'+esc(l.summary)+'</span><span class="lesson-meta"><i class="done-dot '+(progress.done[l.id]?'done':'')+'"></i>'+(progress.done[l.id]?'已完成':'未完成')+' · '+esc(l.minutes)+'</span></span></button>';}).join('')+'</div>';}
$('contentPanel').innerHTML=h+'</div>';$('contentPanel').querySelectorAll('[data-lesson]').forEach(function(b){b.addEventListener('click',function(){openLesson(b.dataset.lesson);});});}
function renderPractice(l){if(l.id!=='api-connect')return'';return'<div class="practice"><h3>安全练习 · 模拟填写 API 配置</h3><p>这里只检查格式，不连接服务器、不写入设置、不保存内容。请使用示例数据，不要填写真实密钥。</p><div class="practice-grid"><label>Base URL<input id="demoUrl" value="https://example.com/v1" autocomplete="off"></label><label>示例 API Key<input id="demoKey" value="demo-key-not-real" autocomplete="off"></label><label>模型名称<input id="demoModel" value="demo-model" autocomplete="off"></label></div><button class="action-secondary" type="button" id="practiceCheck">检查示例填写</button><div class="practice-result" id="practiceResult" aria-live="polite"></div></div>';}
function renderLesson(id){var l=lessonById(id);if(!l){activeLesson=null;renderCategory();return;}var c=categoryFor(l.cat),checked=progress.steps[l.id]||[];var h='<div class="panel-body"><div class="reader-top"><button class="back-list" id="backList">← '+esc(c.title)+'</button><span class="reader-progress">'+(progress.done[l.id]?'本节已完成':'本节学习中')+'</span></div><div class="panel-kicker">'+esc(c.en)+' / LESSON</div><h2 class="reader-title">'+esc(l.title)+'</h2><p class="reader-lead">'+esc(l.lead)+'</p><div class="reader-actions">'+(l.link?'<a class="action-primary" href="'+esc(l.link)+'">'+esc(l.linkText||'打开对应页面')+' ↗</a>':'')+'<span class="muted-tag">'+esc(l.minutes)+'</span></div>';
if(l.notice)h+='<div class="notice">'+l.notice+'</div>';
h+='<div class="section-label">FOLLOW ALONG · 跟着步骤操作</div><div class="step-list">'+l.steps.map(function(s,i){var yes=checked.indexOf(i)!==-1;return'<div class="step '+(yes?'checked':'')+'"><div class="step-index">'+(yes?'✓':String(i+1).padStart(2,'0'))+'</div><div class="step-copy"><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div><button type="button" class="step-toggle" data-step="'+i+'" aria-pressed="'+yes+'">'+(yes?'已完成':'我已完成')+'</button></div>';}).join('')+'</div>';
if(l.tips&&l.tips.length)h+='<div class="section-label">SMALL DETAILS · 容易忽略的小细节</div><div class="tip-list">'+l.tips.map(function(t){return'<div class="tip"><b>'+esc(t[0])+'</b><p>'+esc(t[1])+'</p></div>';}).join('')+'</div>';
h+=renderPractice(l);
if(l.quiz)h+='<div class="quiz"><div class="section-label" style="margin-top:0">QUICK CHECK · 学会了吗</div><h3>'+esc(l.quiz.q)+'</h3><div class="quiz-options">'+l.quiz.options.map(function(o,i){return'<button type="button" class="quiz-option" data-answer="'+i+'">'+esc(o)+'</button>';}).join('')+'</div><div class="quiz-feedback" id="quizFeedback"></div></div>';
h+='<div class="reader-footer"><button type="button" id="prevLesson">上一节</button><button type="button" class="complete" id="completeLesson">'+(progress.done[l.id]?'取消完成':'标记本节已学会')+'</button><button type="button" id="nextLesson">下一节 →</button></div></div>';
$('contentPanel').innerHTML=h;$('backList').addEventListener('click',function(){activeLesson=null;render();});
$('contentPanel').querySelectorAll('[data-step]').forEach(function(b){b.addEventListener('click',function(){toggleStep(l.id,Number(b.dataset.step));});});
$('completeLesson').addEventListener('click',function(){progress.done[l.id]=!progress.done[l.id];if(!progress.done[l.id])delete progress.done[l.id];saveProgress();renderLesson(l.id);toast(progress.done[l.id]?'已记录本节完成':'已取消完成标记');});
$('prevLesson').addEventListener('click',function(){moveLesson(l.id,-1);});$('nextLesson').addEventListener('click',function(){moveLesson(l.id,1);});if(l.quiz)bindQuiz(l);if(l.id==='api-connect')bindPractice();}
function toggleStep(id,i){var arr=progress.steps[id]||[],p=arr.indexOf(i);if(p>=0)arr.splice(p,1);else arr.push(i);progress.steps[id]=arr;saveProgress();renderLesson(id);}
function bindQuiz(l){$('contentPanel').querySelectorAll('[data-answer]').forEach(function(b){b.addEventListener('click',function(){var pick=Number(b.dataset.answer);$('contentPanel').querySelectorAll('[data-answer]').forEach(function(x){x.classList.toggle('selected',x===b);});$('quizFeedback').textContent=pick===l.quiz.answer?'✓ '+l.quiz.why:'再想一想。'+l.quiz.why;});});}
function bindPractice(){$('practiceCheck').addEventListener('click',function(){var u=$('demoUrl').value.trim(),k=$('demoKey').value.trim(),m=$('demoModel').value.trim(),ok=false;try{var p=new URL(u);ok=/^https?:$/.test(p.protocol)&&!!p.host;}catch(e){}$('practiceResult').textContent=ok&&k&&m?'练习通过：示例字段完整、Base URL 格式可识别。没有发出网络请求，也没有保存任何内容。':'还没通过：请检查 Base URL 是否为有效 http/https 地址，并填写示例 Key 与模型名称。';});}
function moveLesson(id,d){var list=lessons.filter(function(l){return l.cat===activeCategory;}),i=list.findIndex(function(l){return l.id===id;}),n=list[i+d];if(n)openLesson(n.id);else{activeLesson=null;render();toast(d>0?'本分类已到最后一节':'本分类已到第一节');}}
function openLesson(id){var l=lessonById(id);if(!l)return;activeCategory=l.cat;activeLesson=id;progress.last=id;saveProgress();renderNav();renderLesson(id);window.scrollTo({top:0,behavior:'smooth'});}
function renderSearch(q){var s=q.trim().toLowerCase();if(!s){activeLesson=null;renderCategory();return;}var found=lessons.filter(function(l){return[l.title,l.summary,l.lead,l.keywords||''].join(' ').toLowerCase().indexOf(s)!==-1;}),af=apps.filter(function(a){return a.join(' ').toLowerCase().indexOf(s)!==-1;});var h='<div class="panel-head"><div><div class="panel-kicker">SEARCH / SEARCH RESULTS</div><h2>搜索结果</h2><div class="panel-desc">关键词：'+esc(q)+'</div></div><div class="lesson-count">'+(found.length+af.length)+' 条结果</div></div><div class="panel-body">';if(!found.length&&!af.length)h+='<div class="empty">没有找到相关内容。试试「API」「语音」「角色」「图标」或「备份」。</div>';else h+='<div class="search-results">'+found.map(function(l){return'<button class="search-result" data-search-lesson="'+esc(l.id)+'"><strong>'+esc(l.title)+'</strong><span>'+esc(l.summary)+'</span></button>';}).join('')+af.map(function(a){return'<a class="search-result" href="'+esc(a[2])+'"><strong>'+esc(a[0])+' · 打开应用 ↗</strong><span>'+esc(a[1])+'</span></a>';}).join('')+'</div>'; $('contentPanel').innerHTML=h+'</div>';$('contentPanel').querySelectorAll('[data-search-lesson]').forEach(function(b){b.addEventListener('click',function(){openLesson(b.dataset.searchLesson);});});}
function render(){updateProgress();renderNav();if(searchQuery){renderSearch(searchQuery);return;}if(activeLesson){renderLesson(activeLesson);return;}renderCategory();}
$('searchInput').addEventListener('input',function(){searchQuery=$('searchInput').value;activeLesson=null;render();});
$('continueBtn').addEventListener('click',function(){var remaining=lessons.find(function(l){return!progress.done[l.id];});openLesson(lessonById(progress.last)&&!progress.done[progress.last]?progress.last:(remaining?remaining.id:'desktop'));});
updateProgress();render();
})();
</script>
</body></html>
