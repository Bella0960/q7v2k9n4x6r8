<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>挂件管理</title>
    <style>
      /* ===== 挂件管理页：黑白灰杂志风 ===== */
      * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
      *::-webkit-scrollbar { display: none; width: 0; height: 0; }
      html, body { margin: 0; padding: 0; background: #F7F7F9; color: #111; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 24px 20px 16px;
      }
      .back-btn {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        color: #111;
      }
      .back-btn svg { width: 18px; height: 18px; fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .back-txt {
        font-family: Georgia, "Songti SC", serif;
        font-style: italic;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .page-title {
        text-align: right;
      }
      .page-title h1 {
        margin: 0;
        font-family: Georgia, "Songti SC", serif;
        font-weight: 400;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: #111;
        line-height: 1;
      }
      .page-title em {
        display: block;
        margin-top: 6px;
        font-style: normal;
        font-size: 11px;
        color: #8E8E93;
        letter-spacing: 0.2em;
      }

      .page-note {
        margin: 0 20px 16px;
        font-size: 12px;
        color: #8E8E93;
        line-height: 1.6;
      }

      .widget-list {
        list-style: none;
        margin: 0;
        padding: 0 16px 40px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .widget-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 14px;
        background: #FFFFFF;
        border: 1px solid #E5E5E5;
        border-radius: 8px;
        transition: border-color .2s ease, background-color .2s ease;
      }
      .widget-item.is-target { background: #F2F2F4; border-color: #111; }
      @media (prefers-reduced-motion: reduce) {
        .widget-item { transition: none; }
      }
      .w-glyph {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 34px;
      }
      .w-glyph i {
        display: block;
        border: 1px solid #111;
        border-radius: 3px;
        background: #F7F7F9;
      }
      .w-meta {
        flex: 1;
        min-width: 0;
      }
      .w-name {
        display: block;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #111;
      }
      .w-size {
        display: inline-block;
        font-size: 10px;
        font-weight: 500;
        color: #999;
        letter-spacing: 0.05em;
        margin-right: 6px;
        padding: 2px 5px;
        background: #f2f2f4;
        border-radius: 4px;
      }
      .w-desc {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        color: #8E8E93;
        letter-spacing: 0.03em;
      }
      .w-state {
        flex: none;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: #C7C7CC;
      }
      .widget-item.is-on .w-state { color: #111; }
      .w-btn {
        flex: none;
        min-width: 64px;
        height: 32px;
        border: 1px solid #111;
        border-radius: 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        cursor: pointer;
        background: #111;
        color: #FFFFFF;
      }
      .w-btn.is-remove {
        background: #FFFFFF;
        color: #111;
      }
      .w-btn:active { opacity: 0.75; }
    </style>
  </head>
  <body>
    <header class="page-header">
      <button class="back-btn" type="button" onclick="location.href='../index.html'" aria-label="返回桌面">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span class="back-txt">Back</span>
      </button>
      <div class="page-title">
        <h1>WIDGETS</h1>
        <em>挂件管理</em>
      </div>
    </header>

    <p class="page-note">在桌面上添加或移除挂件。添加后回到桌面即可看到；移除的挂件可随时再加回来。</p>

    <ul class="widget-list" id="widgetList"></ul>

    <script>
      // ===== 挂件管理：读写桌布局（ds_layout_v14），添加/移除挂件 =====
      (function () {
        var LS_KEY = 'ds_layout_v14';
        var CATALOG = [
          { id: 'postcard', name: '明信片', cols: 4, rows: 2, desc: '头像、昵称与个性签名' },
          { id: 'image', name: '图片', cols: 4, rows: 2, desc: '点击上传一张图片' },
          { id: 'clock', name: '时钟', cols: 2, rows: 2, desc: '实时时间与日期' },
          { id: 'clock-lg', name: '大时钟天气', cols: 4, rows: 2, desc: '时间+日期+天气+地址，全部可编辑' },
          { id: 'polaroid', name: '拍立得相框', cols: 2, rows: 2, desc: '点击上传一张照片' },
          { id: 'dialog', name: '小对话', cols: 2, rows: 2, desc: '两个头像的聊天气泡' },
          { id: 'duo', name: '双人头像', cols: 2, rows: 2, desc: '两个圆头像挨在一起，昵称可改' },
          { id: 'triple', name: '三图横排', cols: 4, rows: 2, desc: '三张图片横向排列，点击上传' },
          { id: 'photowall', name: '照片墙', cols: 2, rows: 2, desc: '2×2 四张图片，点击上传' },
          { id: 'ins', name: 'ins 信息卡', cols: 4, rows: 2, desc: '头像+天数+消息+天气，灰粉色调' },
          { id: 'profile', name: 'ins 资料卡', cols: 4, rows: 2, desc: '头像+id+文案+粉丝获赞数据' },
          { id: 'stack', name: 'ins 堆叠照片', cols: 4, rows: 2, desc: '六张错落排列，每张底下可编辑小字' },
          { id: 'music', name: '音乐箱', cols: 2, rows: 2, desc: '歌名、歌手与播放条' },
          { id: 'todo', name: '待办', cols: 2, rows: 2, desc: '勾选今日要做的小事' },
          { id: 'calendar', name: '月历', cols: 2, rows: 2, desc: '当月迷你日历，今天高亮' },
          { id: 'countdown', name: '倒数日', cols: 2, rows: 2, desc: '距离目标还有多少天' },
          { id: 'note', name: '便签', cols: 2, rows: 2, desc: '随手写一张小纸条' },
          { id: 'social', name: '社交资料卡', cols: 4, rows: 3, desc: '清透卡片，文字照片都能点改' }
        ];

        var listEl = document.getElementById('widgetList');

        var MAX_PAGES = 4;
        // Match the four-column grid used by the desktop, not an item-count limit.
        var MAX_ROWS = 6;
        var FALLBACK_LAYOUT = {
          v: 14,
          pages: [
            ['clock-lg', 'app_inspect', 'app_worldbook', 'app_memory', 'app_forum', 'duo', 'photowall', 'app_wallet', 'app_music', 'app_beauty', 'app_theme_store'],
            ['app_characters', 'app_footprint', 'app_settings', 'app_tutorial', 'app_finance', 'app_takeout', 'app_couple', 'app_growth', 'app_companion', 'app_games', 'app_cafe', 'app_live_room', 'app_poster'],
            ['app_library', 'app_envelope', 'app_diary', 'app_novelstudio', 'app_dreamtravel', 'app_date']
          ],
          dock: ['app_chat', 'app_shop'],
          removed: ['image', 'postcard', 'polaroid', 'dialog', 'music', 'clock', 'todo', 'calendar', 'countdown', 'note', 'social', 'triple', 'ins', 'profile', 'stack']
        };
        var catalogById = {};
        CATALOG.forEach(function (widget) { catalogById[widget.id] = widget; });
        var highlightDone = false;
        var noteEl = document.querySelector('.page-note');
        var originalNoteText = noteEl ? noteEl.textContent : '';

        function showStatus(message) {
          if (noteEl) noteEl.textContent = message || originalNoteText;
        }

        function isValidLayout(layout) {
          return !!(layout && Array.isArray(layout.pages) && layout.pages.length > 0 &&
            layout.pages.every(function (page) { return Array.isArray(page); }) &&
            Array.isArray(layout.dock));
        }

        function parseLayout(key) {
          try { return JSON.parse(localStorage.getItem(key)); }
          catch (e) { return null; }
        }

        function readLayout() {
          var result = parseLayout(LS_KEY);
          if (!isValidLayout(result)) {
            result = null;
            for (var version = 13; version >= 1; version--) {
              var oldLayout = parseLayout('ds_layout_v' + version);
              if (isValidLayout(oldLayout)) {
                result = oldLayout;
                break;
              }
            }
          }
          if (!result) result = FALLBACK_LAYOUT;
          // Never mutate the shared fallback or a value taken directly from storage.
          var layout = JSON.parse(JSON.stringify(result));
          if (!Array.isArray(layout.removed)) layout.removed = [];
          layout.v = 14;
          return layout;
        }

        function saveLayout(layout) {
          try {
            var serialized = JSON.stringify(layout);
            localStorage.setItem(LS_KEY, serialized);
            return localStorage.getItem(LS_KEY) === serialized;
          } catch (e) {
            return false;
          }
        }

        function isOnDesktop(layout, id) {
          return !!(layout && layout.pages.some(function (page) { return page.indexOf(id) !== -1; }));
        }

        function dimensions(id) {
          var item = catalogById[id];
          return item ? [Math.min(4, item.cols), Math.min(MAX_ROWS, item.rows)] : [1, 1];
        }

        // Simulate grid-auto-flow: row with no dense packing: a candidate must fit
        // the first six rows without overlapping a wider widget.
        function fitsPage(ids) {
          var used = new Set();
          var cursor = 0;
          for (var i = 0; i < ids.length; i++) {
            var dims = dimensions(ids[i]);
            var w = dims[0], h = dims[1];
            var found = false;
            for (var cell = cursor; cell < 4 * MAX_ROWS; cell++) {
              var x = cell % 4, y = Math.floor(cell / 4);
              if (x + w > 4 || y + h > MAX_ROWS) continue;
              var clear = true;
              for (var dy = 0; dy < h && clear; dy++) {
                for (var dx = 0; dx < w; dx++) {
                  if (used.has((y + dy) * 4 + x + dx)) { clear = false; break; }
                }
              }
              if (!clear) continue;
              for (var dy = 0; dy < h; dy++) {
                for (var dx = 0; dx < w; dx++) used.add((y + dy) * 4 + x + dx);
              }
              cursor = cell + w;
              found = true;
              break;
            }
            if (!found) return false;
          }
          return true;
        }

        function addWidget(layout, id) {
          if (!layout || isOnDesktop(layout, id)) return true;
          var placed = false;
          for (var i = 0; i < layout.pages.length; i++) {
            if (fitsPage(layout.pages[i].concat(id))) {
              layout.pages[i].push(id);
              placed = true;
              break;
            }
          }
          if (!placed) {
            if (layout.pages.length >= MAX_PAGES || !fitsPage([id])) {
              showStatus('桌面空间不足：请先移除部分组件，或整理其他页面。');
              return false;
            }
            layout.pages.push([id]);
          }
          var removeIndex = layout.removed.indexOf(id);
          if (removeIndex !== -1) layout.removed.splice(removeIndex, 1);
          if (!saveLayout(layout)) {
            showStatus('保存失败：桌面存储空间不足，请先备份并清理空间。');
            return false;
          }
          showStatus('');
          return true;
        }

        function removeWidget(layout, id) {
          if (!layout) return false;
          layout.pages.forEach(function (page) {
            var i = page.indexOf(id);
            if (i !== -1) page.splice(i, 1);
          });
          if (layout.removed.indexOf(id) === -1) layout.removed.push(id);
          if (!saveLayout(layout)) {
            showStatus('保存失败：原有桌面布局未被覆盖。');
            return false;
          }
          showStatus('');
          return true;
        }

        function render() {
          var layout = readLayout();
          listEl.innerHTML = '';
          CATALOG.forEach(function (w) {
            var on = isOnDesktop(layout, w.id);
            var li = document.createElement('li');
            li.className = 'widget-item' + (on ? ' is-on' : '');
            li.dataset.widget = w.id;

            var glyph = document.createElement('span');
            glyph.className = 'w-glyph';
            glyph.innerHTML = '<i style="width:' + (w.cols * 12) + 'px;height:' + (w.rows * 12) + 'px"></i>';

            var meta = document.createElement('span');
            meta.className = 'w-meta';
            meta.innerHTML = '<span class="w-name"><span class="w-size">' + w.cols + '×' + w.rows + '</span> ' + w.name + '</span><span class="w-desc">' + w.desc + '</span>';

            var state = document.createElement('span');
            state.className = 'w-state';
            state.textContent = on ? '已在桌面' : '未添加';

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'w-btn' + (on ? ' is-remove' : '');
            btn.textContent = on ? '移除' : '添加';
            btn.addEventListener('click', function () {
              var cur = readLayout();
              if (isOnDesktop(cur, w.id)) {
                removeWidget(cur, w.id);
              } else {
                addWidget(cur, w.id);
              }
              render();
            });

            li.appendChild(glyph);
            li.appendChild(meta);
            li.appendChild(state);
            li.appendChild(btn);
            listEl.appendChild(li);
          });
          if (!highlightDone) { highlightDone = true; highlightFromRoute(); }
        }

        function highlightFromRoute() {
          if (typeof location === 'undefined' || typeof URLSearchParams === 'undefined') return;
          var params = new URLSearchParams(location.search || '');
          var id = params.get('widget');
          if (!id || !catalogById[id]) return;
          var target = listEl.querySelector('[data-widget="' + id + '"]');
          if (!target) return;
          var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          target.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
          target.classList.add('is-target');
          window.setTimeout(function () {
            target.classList.remove('is-target');
          }, reduce ? 0 : 1600);
        }

        render();
      })();
    </script>
  <script src="../shared/js/home-indicator.js?v=20261023v1"></script>
</body>
</html>
