<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0eb">
<title>情侣空间</title>
<script src="../shared/js/native-feel.js"></script>
<script src="../shared/js/phone/phone_storage.js"></script>
<link rel="stylesheet" href="../shared/css/mobile-fit.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar { display:none; }
  html { background:#f8f6f4; }
  body {
    font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    background:#f8f6f4; color:#2a2525;
    min-height:100vh; max-width:390px; margin:0 auto;
    padding-bottom:40px;
    -webkit-font-smoothing:antialiased;
  }

  /* 顶部白纱 */
  .hero {
    position:relative; overflow:hidden;
    margin:0 0 20px;
    animation:rise 0.6s ease both;
  }
  .hero-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(248,246,244,0.05) 0%,rgba(248,246,244,0.4) 70%,rgba(248,246,244,1) 100%);
  }
  .hero-content {
    position:relative; z-index:1; padding:16px 28px;
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:36px;
  }
  .top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:30px; }
  .back-btn, .top-set {
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.5); backdrop-filter:blur(6px);
    border:1px solid rgba(180,150,130,0.2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .back-btn svg, .top-set svg { stroke:#6a5a52; }
  .top-title {
    font-size:0.7rem; letter-spacing:0.4em; text-transform:uppercase;
    color:#6a5a52; font-weight:400;
  }

  /* 缠绕头像 */
  .twist-avatars {
    position:relative; width:110px; height:60px; margin:6px auto 20px;
  }
  .twist-avatars .av {
    position:absolute; width:60px; height:60px; border-radius:50%;
    overflow:hidden; border:1px solid rgba(255,255,255,0.9);
    outline:1px solid rgba(180,170,160,0.4); outline-offset:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; font-weight:400; color:#8a7a72;
    cursor:pointer; transition:transform 0.2s;
    background:#fff;
  }
  .twist-avatars .av:active { transform:scale(0.95); }
  .twist-avatars .av-a { left:0; top:0; }
  .twist-avatars .av-b { right:0; top:8px; background:#f5f3f1; }
  .twist-avatars .av img { width:100%; height:100%; object-fit:cover; }
  .twist-heart {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:24px; height:24px; border-radius:50%;
    background:#fff; outline:1px solid rgba(180,170,160,0.4);
    display:flex; align-items:center; justify-content:center; z-index:2;
    animation:beat 1.4s ease-in-out infinite;
  }
  @keyframes beat { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.1);} }

  .couple-names {
    text-align:center; font-size:1.15rem; font-weight:400; color:#2a2525;
    letter-spacing:0.08em; margin-bottom:6px;
  }
  .couple-since {
    text-align:center; font-size:0.65rem; color:#a89e96;
    letter-spacing:0.25em; text-transform:uppercase;
  }

  .days-num {
    text-align:center; font-size:3.5rem; font-weight:300; color:#2a2525;
    margin-top:28px; line-height:1; letter-spacing:0.05em; font-family:Georgia,serif;
  }
  .days-label {
    text-align:center; font-size:0.65rem; color:#a89e96;
    margin-top:10px; letter-spacing:0.3em; text-transform:uppercase;
  }
  .love-date {
    text-align:center; font-size:0.65rem; color:#b8b0aa; margin-top:8px;
    letter-spacing:0.15em;
  }
  .divider-ornament {
    display:flex; align-items:center; justify-content:center; gap:10px; margin:20px auto 0;
  }
  .divider-ornament::before, .divider-ornament::after {
    content:''; width:40px; height:1px; background:#d0cac4;
  }
  .divider-ornament svg { color:#c8c0b8; }
  .chat-btn-wrap { text-align:center; margin-top:18px; }
  .chat-btn {
    display:none; border:1px solid #a89e96; background:transparent; color:#6a5a52;
    border-radius:0; padding:10px 28px; font-size:0.72rem; font-weight:400;
    letter-spacing:0.2em; text-transform:uppercase; cursor:pointer;
    font-family:inherit;
  }

  /* 亲密度 */
  .intimacy {
    margin:0 28px 24px; padding:18px 0;
    border-top:1px solid #e0dcd8; border-bottom:1px solid #e0dcd8;
  }
  .inti-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .inti-label { font-size:0.65rem; letter-spacing:0.25em; text-transform:uppercase; color:#8a7a72; }
  .inti-value { font-size:0.7rem; color:#8a7a72; letter-spacing:0.1em; }
  .inti-bar { height:1px; background:#e8e5e1; position:relative; }
  .inti-fill { height:100%; background:#5a4a42; transition:width 0.6s ease; }
  .checkin-btn {
    width:100%; margin-top:14px; padding:12px;
    border:1px solid #8a7a72; background:transparent; color:#6a5a52;
    font-size:0.72rem; font-weight:400; cursor:pointer;
    letter-spacing:0.25em; text-transform:uppercase; font-family:inherit;
  }
  .checkin-btn:disabled { border-color:#d8d4d0; color:#c0b8b0; cursor:default; }

  /* 功能目录 */
  .fn-section { margin:0 28px; }
  .fn-item {
    display:flex; align-items:center; padding:18px 0;
    border-bottom:1px solid #e8e5e1; cursor:pointer;
    transition:padding-left 0.2s;
  }
  .fn-item:active { padding-left:6px; }
  .fn-item:first-child { border-top:1px solid #e8e5e1; }
  .fn-icon {
    width:36px; height:36px; border:1px solid #d8d4d0;
    display:flex; align-items:center; justify-content:center;
    margin-right:14px; flex-shrink:0;
  }
  .fn-text { flex:1; }
  .fn-name { font-size:0.85rem; font-weight:400; color:#2a2525; letter-spacing:0.12em; }
  .fn-en { font-size:0.58rem; color:#b8b0aa; margin-top:3px; letter-spacing:0.2em; text-transform:uppercase; }
  .fn-desc { font-size:0.65rem; color:#b8b0aa; margin-right:12px; letter-spacing:0.05em; }
  .fn-arrow { color:#c8c0b8; }

  /* 弹层 */
  .sheet-backdrop {
    position:fixed; inset:0; background:rgba(42,31,31,0.3);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
    backdrop-filter:blur(2px);
  }
  .sheet-backdrop.show { display:flex; }
  .sheet {
    width:390px; max-width:100%; max-height:85vh;
    background:#faf9f7; border-top:1px solid #e0dcd8;
    padding:24px 24px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto; animation:slideUp 0.25s ease;
  }
  @keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet-head {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    padding-bottom:14px; border-bottom:1px solid #e0d4c8;
  }
  .sheet-head h3 { font-size:0.85rem; font-weight:400; color:#2a1f1f; letter-spacing:0.2em; text-transform:uppercase; }
  .sheet-close {
    border:1px solid #d0c0b0; background:none; width:28px; height:28px; border-radius:0;
    cursor:pointer; color:#8a7060; font-size:0.7rem;
  }

  .input-row { display:flex; gap:8px; margin-bottom:16px; }
  .input-row input, .input-row textarea {
    flex:1; border:1px solid #d8d4d0; border-radius:0;
    padding:11px 13px; font-size:0.813rem; outline:none;
    background:#fff; color:#2a2525; font-family:inherit;
  }
  .input-row input::placeholder { color:#b8b0aa; }
  .input-row button {
    border:1px solid #6a5a52; background:transparent; color:#6a5a52;
    padding:0 18px; font-size:0.72rem; font-weight:400; cursor:pointer;
    letter-spacing:0.15em; font-family:inherit;
  }
  .list-item {
    background:#fff; border:1px solid #e8e5e1; padding:13px 14px; margin-bottom:8px;
    display:flex; align-items:flex-start; gap:10px;
  }
  .list-item.done .li-text { text-decoration:line-through; color:#b8b0aa; }
  .li-check {
    width:18px; height:18px; border-radius:0; border:1px solid #c8c0b8;
    margin-top:2px; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:transparent; font-size:10px;
  }
  .list-item.done .li-check { background:#2a2525; border-color:#2a2525; color:#fff; }
  .li-text { flex:1; font-size:0.813rem; line-height:1.6; color:#2a2525; }
  .li-meta { font-size:0.6rem; color:#b8b0aa; margin-top:4px; letter-spacing:0.05em; }
  .li-del { border:none; background:none; color:#c8c0b8; font-size:0.813rem; cursor:pointer; padding:0 2px; }

  .msg-item { background:#fff; border:1px solid #e8e5e1; padding:12px 14px; margin-bottom:10px; }
  .msg-row-me { text-align:right; }
  .msg-bubble {
    display:inline-block; max-width:80%; text-align:left;
    background:#2a2525; color:#f8f6f4;
    padding:10px 14px; font-size:0.813rem; line-height:1.6;
  }
  .msg-row-them .msg-bubble { background:#f0efed; color:#2a2525; }
  .msg-time { font-size:0.58rem; color:#b8b0aa; margin-top:6px; letter-spacing:0.08em; }

  .set-row { margin-bottom:16px; }
  .set-row label { display:block; font-size:0.62rem; color:#8a7a72; margin-bottom:6px; letter-spacing:0.2em; text-transform:uppercase; }
  .set-row input, .set-row select {
    width:100%; border:1px solid #d8d4d0; border-radius:0;
    padding:11px 13px; font-size:0.875rem; outline:none;
    background:#fff; color:#2a2525; font-family:inherit;
  }
  .save-set-btn {
    width:100%; padding:13px; border:1px solid #2a2525; background:#2a2525;
    color:#f8f6f4; font-size:0.75rem; font-weight:400; cursor:pointer;
    letter-spacing:0.25em; text-transform:uppercase; font-family:inherit; margin-top:8px;
  }

  .toast {
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(10px);
    background:#2a2525; color:#f8f6f4; padding:10px 22px;
    font-size:0.75rem; letter-spacing:0.1em;
    opacity:0; pointer-events:none; transition:0.25s; z-index:999;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .empty { text-align:center; color:#c8c0b8; font-size:0.75rem; padding:30px 0; letter-spacing:0.1em; }

  @keyframes rise { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>

<div class="hero">
  <img class="hero-bg" src="../assets/couple-bg.jpg" alt="">
  <div class="hero-content">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='../index.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a5a52" stroke-width="1.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="top-title">Our Story</div>
      <button class="top-set" onclick="openSet()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a5a52" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <div class="twist-avatars">
      <div class="av av-a" id="avA" onclick="pickAvatar('my')">我</div>
      <div class="twist-heart">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#6a5a52"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <div class="av av-b" id="avB" onclick="pickAvatar('ta')">TA</div>
    </div>

    <div class="couple-names" id="coupleNames">我们</div>
    <div class="couple-since" id="coupleSince">点击右上角设置开始</div>

    <div class="days-num" id="daysNum">0</div>
    <div class="days-label">Days Together</div>
    <div class="love-date" id="loveDate"></div>

    <div class="divider-ornament">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3L12 16.5 5.8 21l2.4-7.3L2 9.2h7.6z"/></svg>
    </div>

    <div class="chat-btn-wrap">
      <button class="chat-btn" id="chatBtn" onclick="chatWithTa()">Message</button>
    </div>
  </div>
</div>

<div class="intimacy">
  <div class="inti-row">
    <span class="inti-label">Intimacy</span>
    <span class="inti-value" id="intiVal">Lv.1 · 100</span>
  </div>
  <div class="inti-bar"><div class="inti-fill" id="intiFill" style="width:10%"></div></div>
  <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">Check In</button>
</div>

<div class="fn-section">
  <div class="fn-item" onclick="openSheet('bucket')">
    <div class="fn-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a5a52" stroke-width="1"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <div class="fn-text">
      <div class="fn-name">恋爱清单</div>
      <div class="fn-en">Bucket List</div>
    </div>
    <div class="fn-desc" id="bucketDesc">0 件</div>
    <svg class="fn-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
  </div>
  <div class="fn-item" onclick="openSheet('moments')">
    <div class="fn-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a5a52" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    </div>
    <div class="fn-text">
      <div class="fn-name">共同记忆</div>
      <div class="fn-en">Moments</div>
    </div>
    <div class="fn-desc" id="momentsDesc">0 段</div>
    <svg class="fn-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
  </div>
  <div class="fn-item" onclick="openSheet('msg')">
    <div class="fn-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a5a52" stroke-width="1"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="fn-text">
      <div class="fn-name">悄悄话</div>
      <div class="fn-en">Whispers</div>
    </div>
    <div class="fn-desc" id="msgDesc">留言板</div>
    <svg class="fn-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
  </div>
  <div class="fn-item" onclick="openSheet('mood')">
    <div class="fn-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a5a52" stroke-width="1"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    </div>
    <div class="fn-text">
      <div class="fn-name">今日心情</div>
      <div class="fn-en">Today's Mood</div>
    </div>
    <div class="fn-desc">记录</div>
    <svg class="fn-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheetBody"></div>
</div>

<div class="sheet-backdrop" id="setBackdrop" onclick="if(event.target===this)closeSet()">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Profile</h3>
      <button class="sheet-close" onclick="closeSet()">✕</button>
    </div>
    <div class="set-row">
      <label>你的名字</label>
      <input id="setNameA" maxlength="12" placeholder="比如：小猫">
    </div>
    <div class="set-row">
      <label>TA 的名字</label>
      <input id="setNameB" maxlength="12" placeholder="比如：狗狗">
    </div>
    <div class="set-row">
      <label>绑定聊天里的 TA</label>
      <select id="setPartner">
        <option value="">不绑定</option>
      </select>
    </div>
    <div class="set-row">
      <label>在一起的日子</label>
      <input id="setDate" type="date">
    </div>
    <button class="save-set-btn" onclick="saveSet()">Save</button>
  </div>
</div>

<input type="file" id="avatarFile" accept="image/*" style="display:none;">
<div class="toast" id="toast"></div>

<script>
(function(){
  const K = {
    profile:'maoer_couple_profile_v1',
    bucket:'maoer_couple_bucket_v1',
    moments:'maoer_couple_moments_v1',
    msgs:'maoer_couple_msgs_v1',
    checkin:'maoer_couple_checkin_v1',
    mood:'maoer_couple_mood_v1'
  };
  const $ = id => document.getElementById(id);
  const read = (k,d) => { try { let v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; } catch(e){ return d; } };
  const write = (k,v) => localStorage.setItem(k, JSON.stringify(v));
  const today = () => { let d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let profile = read(K.profile, {nameA:'', nameB:'', startDate:'', partnerId:'', myAvatar:'', taAvatar:''});
  let bucket = read(K.bucket, []);
  let moments = read(K.moments, []);
  let msgs = read(K.msgs, []);
  let checkins = read(K.checkin, []);
  let mood = read(K.mood, {});

  function toast(s){ const t=$('toast'); t.textContent=s; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

  function renderProfile(){
    let avA = $('avA'), avB = $('avB');
    let sharedAvatar = '';
    try {
      const me = window.PhoneStorage && typeof PhoneStorage.getMyProfile === 'function'
        ? PhoneStorage.getMyProfile() : null;
      sharedAvatar = me && typeof me.avatar === 'string' ? me.avatar : '';
    } catch(e) {}
    const myPortrait = profile.myAvatar || sharedAvatar;
    if(myPortrait){ avA.innerHTML = '<img src="'+myPortrait+'" alt="" style="width:100%;height:100%;object-fit:cover;">'; }
    else { avA.textContent = (profile.nameA||'我')[0]; }
    if(profile.taAvatar){ avB.innerHTML = '<img src="'+profile.taAvatar+'" style="width:100%;height:100%;object-fit:cover;">'; }
    else { avB.textContent = (profile.nameB||'TA')[0]; }
    $('coupleNames').textContent = (profile.nameA||'我') + ' × ' + (profile.nameB||'TA');
    if(profile.startDate){
      let s = profile.startDate, n = today();
      let days = s && s<=n ? Math.floor((new Date(n+'T00:00:00')-new Date(s+'T00:00:00'))/86400000)+1 : 0;
      $('daysNum').textContent = days;
      $('loveDate').textContent = '— Since ' + s + ' —';
      $('coupleSince').textContent = 'Our Story Begins';
    } else {
      $('daysNum').textContent = '0';
      $('loveDate').textContent = '';
      $('coupleSince').textContent = 'Tap Settings to Begin';
    }
    renderIntimacy();
  }

  function renderIntimacy(){
    let base = 100, bonus = checkins.length, total = base + bonus;
    let lv = Math.floor(total/100)+1, pct = total%100;
    $('intiVal').textContent = 'Lv.'+lv+' · '+total;
    $('intiFill').style.width = Math.max(8,pct)+'%';
    let todayChecked = checkins.includes(today());
    $('checkinBtn').disabled = todayChecked;
    $('checkinBtn').textContent = todayChecked ? 'Checked In' : 'Check In';
  }
  function doCheckin(){ let t=today(); if(checkins.includes(t)) return; checkins.push(t); write(K.checkin,checkins); renderIntimacy(); toast('亲密度 +1'); }

  function renderDesc(){
    $('bucketDesc').textContent = bucket.filter(x=>x.done).length+'/'+bucket.length+' 件';
    $('momentsDesc').textContent = moments.length+' 段';
    $('msgDesc').textContent = msgs.length+' 条';
  }

  let currentSheet = '';
  function openSheet(type){
    currentSheet = type;
    let body = $('sheetBody');
    if(type==='bucket') body.innerHTML = bucketHTML();
    else if(type==='moments') body.innerHTML = momentsHTML();
    else if(type==='msg') body.innerHTML = msgHTML();
    else if(type==='mood') body.innerHTML = moodHTML();
    $('sheetBackdrop').classList.add('show');
  }
  function closeSheet(){ $('sheetBackdrop').classList.remove('show'); currentSheet=''; }

  function bucketHTML(){
    let list = bucket.map(x =>
      '<div class="list-item '+(x.done?'done':'')+'">'
      + '<div class="li-check" onclick="toggleBucket(\''+x.id+'\')">'+(x.done?'✓':'')+'</div>'
      + '<div style="flex:1"><div class="li-text">'+esc(x.text)+'</div><div class="li-meta">'+(x.done?'已完成':'加入于 '+esc(x.created))+'</div></div>'
      + '<button class="li-del" onclick="delBucket(\''+x.id+'\')">✕</button></div>'
    ).join('');
    return '<div class="sheet-head"><h3>Bucket List</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>'
      + '<div class="input-row"><input id="bucketInput" placeholder="想一起做的事…" maxlength="50"><button onclick="addBucket()">添加</button></div>'
      + (list || '<div class="empty">— 还没有想做的事 —</div>');
  }
  function momentsHTML(){
    let list = moments.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(x =>
      '<div class="list-item" style="display:block;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
      + '<span style="font-size:0.62rem;color:#b09888;letter-spacing:0.1em;">'+esc(x.created)+'</span>'
      + '<button class="li-del" onclick="delMoment(\''+x.id+'\')">✕</button></div>'
      + '<div class="li-text" style="white-space:pre-wrap;">'+esc(x.text)+'</div></div>'
    ).join('');
    return '<div class="sheet-head"><h3>Moments</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>'
      + '<div style="margin-bottom:16px;"><textarea id="momentInput" placeholder="今天发生了什么值得记住的事？" maxlength="500" style="width:100%;border:1px solid #d8c8b8;padding:11px 13px;font-size:0.813rem;outline:none;background:#fff;color:#2a1f1f;min-height:80px;font-family:inherit;resize:vertical;"></textarea>'
      + '<button onclick="addMoment()" style="margin-top:8px;width:100%;border:1px solid #2a1f1f;background:#2a1f1f;color:#f5efe5;padding:12px;font-size:0.72rem;letter-spacing:0.2em;cursor:pointer;font-family:inherit;">保存记忆</button></div>'
      + (list || '<div class="empty">— 还没有回忆 —</div>');
  }
  function msgHTML(){
    let list = msgs.slice().sort((a,b)=>a.ts-b.ts).map(x =>
      '<div class="msg-item '+(x.who==='me'?'msg-row-me':'msg-row-them')+'">'
      + '<div class="msg-bubble">'+esc(x.text)+'</div>'
      + '<div class="msg-time">'+(x.who==='me'?esc(profile.nameA||'我'):esc(profile.nameB||'TA'))+' · '+esc(x.time)+'</div></div>'
    ).join('');
    return '<div class="sheet-head"><h3>Whispers</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>'
      + '<div class="input-row"><input id="msgInput" placeholder="写下想对TA说的话…" maxlength="100"><button onclick="addMsg()">发送</button></div>'
      + (list || '<div class="empty">— 还没有留言 —</div>');
  }
  function moodHTML(){
    let t = today(), cur = mood[t] || ['',''];
    return '<div class="sheet-head"><h3>Today</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>'
      + '<div style="font-size:0.62rem;color:#8a7060;margin-bottom:6px;letter-spacing:0.15em;">'+esc(profile.nameA||'我')+'</div>'
      + '<textarea id="moodA" maxlength="200" placeholder="今天感觉…" style="width:100%;border:1px solid #d8c8b8;padding:11px 13px;font-size:0.813rem;outline:none;background:#fff;color:#2a1f1f;min-height:60px;font-family:inherit;resize:vertical;margin-bottom:14px;">'+esc(cur[0]||'')+'</textarea>'
      + '<div style="font-size:0.62rem;color:#8a7060;margin-bottom:6px;letter-spacing:0.15em;">'+esc(profile.nameB||'TA')+'</div>'
      + '<textarea id="moodB" maxlength="200" placeholder="TA今天感觉…" style="width:100%;border:1px solid #d8c8b8;padding:11px 13px;font-size:0.813rem;outline:none;background:#fff;color:#2a1f1f;min-height:60px;font-family:inherit;resize:vertical;margin-bottom:14px;">'+esc(cur[1]||'')+'</textarea>'
      + '<button onclick="saveMood()" style="width:100%;border:1px solid #2a1f1f;background:transparent;color:#2a1f1f;padding:12px;font-size:0.72rem;letter-spacing:0.2em;cursor:pointer;font-family:inherit;">保存</button>';
  }

  window.addBucket = function(){ let v=$('bucketInput').value.trim(); if(!v) return; bucket.push({id:Date.now().toString(36),text:v,done:false,created:today()}); write(K.bucket,bucket); $('sheetBody').innerHTML=bucketHTML(); renderDesc(); toast('已加入清单'); };
  window.toggleBucket = function(id){ bucket=bucket.map(x=>x.id===id?{...x,done:!x.done}:x); write(K.bucket,bucket); $('sheetBody').innerHTML=bucketHTML(); renderDesc(); };
  window.delBucket = function(id){ if(!confirm('删除这项？')) return; bucket=bucket.filter(x=>x.id!==id); write(K.bucket,bucket); $('sheetBody').innerHTML=bucketHTML(); renderDesc(); };
  window.addMoment = function(){ let v=$('momentInput').value.trim(); if(!v) return; moments.push({id:Date.now().toString(36),text:v,created:today()}); write(K.moments,moments); $('sheetBody').innerHTML=momentsHTML(); renderDesc(); toast('已保存'); };
  window.delMoment = function(id){ if(!confirm('删除这段记忆？')) return; moments=moments.filter(x=>x.id!==id); write(K.moments,moments); $('sheetBody').innerHTML=momentsHTML(); renderDesc(); };
  window.addMsg = function(){ let v=$('msgInput').value.trim(); if(!v) return; let now=new Date(); msgs.push({who:'me',text:v,time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),ts:Date.now()}); write(K.msgs,msgs); $('sheetBody').innerHTML=msgHTML(); renderDesc(); };
  window.saveMood = function(){ mood[today()]=[$('moodA').value.trim(),$('moodB').value.trim()]; write(K.mood,mood); toast('已保存'); };

  window.openSet = function(){
    $('setNameA').value = profile.nameA||'';
    $('setNameB').value = profile.nameB||'';
    $('setDate').value = profile.startDate||'';
    let sel = $('setPartner');
    sel.innerHTML = '<option value="">不绑定</option>';
    try { JSON.parse(localStorage.getItem('ai_custom_characters')||'[]').forEach(c => { let o=document.createElement('option'); o.value=c.id; o.textContent=c.name||c.id; if(profile.partnerId===c.id) o.selected=true; sel.appendChild(o); }); } catch(e){}
    $('setBackdrop').classList.add('show');
  };
  window.closeSet = function(){ $('setBackdrop').classList.remove('show'); };
  $('setPartner').addEventListener('change', function(){ let id=this.value; if(!id) return; try { let c=JSON.parse(localStorage.getItem('ai_custom_characters')||'[]').find(x=>x.id===id); if(c){ $('setNameB').value=c.name||''; if(c.avatar) profile.taAvatar=c.avatar; } } catch(e){} });
  window.chatWithTa = function(){ if(!profile.partnerId){ toast('先在设置里绑定TA'); return; } window.location.href='../chat/chat/chat-detail.html?id='+encodeURIComponent(profile.partnerId); };

  let avatarTarget = '';
  window.pickAvatar = function(w){ avatarTarget=w; $('avatarFile').click(); };
  $('avatarFile').addEventListener('change', function(e){
    let f=e.target.files[0]; if(!f) return;
    let reader=new FileReader();
    reader.onload=function(ev){ let img=new Image(); img.onload=function(){ let c=document.createElement('canvas'); let s=200; c.width=s; c.height=s; let ctx=c.getContext('2d'); let r=Math.min(img.width,img.height); ctx.drawImage(img,(img.width-r)/2,(img.height-r)/2,r,r,0,0,s,s); let data=c.toDataURL('image/jpeg',0.8); if(avatarTarget==='my') profile.myAvatar=data; else profile.taAvatar=data; write(K.profile,profile); renderProfile(); toast('头像已更新'); }; img.src=ev.target.result; };
    reader.readAsDataURL(f); e.target.value='';
  });

  window.saveSet = function(){
    profile = { nameA:$('setNameA').value.trim(), nameB:$('setNameB').value.trim(), startDate:$('setDate').value, partnerId:$('setPartner').value, myAvatar:profile.myAvatar||'', taAvatar:profile.taAvatar||'' };
    write(K.profile, profile); renderProfile(); closeSet();
    $('chatBtn').style.display = profile.partnerId ? 'inline-block' : 'none';
    toast('已保存');
  };
  window.closeSheet = closeSheet;

  renderProfile(); renderDesc();
  $('chatBtn').style.display = profile.partnerId ? 'inline-block' : 'none';
})();
</script>
</body>
</html>
