<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>VISUAL ARCHIVE · 互动海报</title>
<style>
:root{--paper:#f7f7f5;--ink:#171717;--muted:#777;--line:#d8d8d4;--white:#fff}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
body{margin:0;min-height:100vh;background:var(--paper)}
button,input,textarea{font:inherit}
button{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.18em}
.top a{color:inherit;text-decoration:none;letter-spacing:0;font-size:12px}
main{max-width:980px;margin:auto;padding:28px 20px 70px}
.kicker{font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.hero{position:relative;padding:22px 0 24px;border-bottom:1px solid var(--ink);overflow:hidden}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(54px,12vw,112px);font-weight:400;line-height:.82;letter-spacing:-.075em;margin:22px 0 16px}
.hero h1 span{display:block;text-align:right;font-style:italic;font-size:.58em;letter-spacing:-.06em;padding-right:5%}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.hero-foot p{font-size:12px;line-height:1.7;max-width:260px;margin:0;color:#555}
.count{font:italic 34px Georgia,serif}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;gap:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill,.plain{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 12px;font-size:11px;cursor:pointer}
.pill.active,.pill:hover{background:var(--ink);color:white;border-color:var(--ink)}
.plain{border-radius:3px;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}
.item{position:relative;min-height:260px;cursor:pointer;border:0;padding:0;text-align:left;background:#e7e7e3;overflow:hidden;isolation:isolate;transition:transform .25s ease}
.item:nth-child(6n+1){grid-column:span 7;min-height:330px}
.item:nth-child(6n+2){grid-column:span 5;min-height:330px}
.item:nth-child(6n+3),.item:nth-child(6n+4){grid-column:span 4;min-height:245px}
.item:nth-child(6n+5){grid-column:span 5;min-height:275px}
.item:nth-child(6n){grid-column:span 7;min-height:275px}
.item:hover{transform:translateY(-3px)}
.art{position:absolute;inset:0;overflow:hidden;background:#e6e6e2}
.art:before,.art:after{content:"";position:absolute;display:block}
.art.a1:before{width:54%;height:120%;left:21%;top:-8%;border-radius:50% 50% 4% 4%;background:#bdbdb8;transform:rotate(13deg)}
.art.a1:after{width:31%;height:65%;left:35%;top:15%;border-radius:50% 50% 42% 42%;background:#777;box-shadow:30px 95px 0 -20px #333}
.art.a2{background:#d4d4d0}
.art.a2:before{width:70%;height:70%;left:16%;top:15%;border:1px solid #777;transform:rotate(-11deg);box-shadow:13px 13px 0 #b4b4af,26px 26px 0 #ededeb}
.art.a2:after{width:32%;height:130%;left:39%;top:-15%;background:#999;transform:rotate(23deg)}
.art.a3{background:#c8c8c3}
.art.a3:before{width:46%;height:72%;left:28%;top:14%;border-radius:48% 48% 8% 8%;background:#f5f5f1;transform:rotate(-7deg)}
.art.a3:after{width:70%;height:1px;left:15%;top:50%;background:#333;transform:rotate(38deg);box-shadow:0 36px 0 #777}
.art.a4{background:#efefec}
.art.a4:before{width:45%;height:45%;left:28%;top:20%;border-radius:50%;background:#a1a19b;box-shadow:22px 35px 0 -10px #555}
.art.a4:after{width:120%;height:1px;top:75%;left:-10%;background:#777;transform:rotate(-18deg)}
.art.a5{background:#b8b8b2}
.art.a5:before{width:62%;height:85%;left:19%;top:7%;background:#f7f7f3;clip-path:polygon(50% 0,100% 100%,0 100%)}
.art.a5:after{width:20%;height:64%;left:40%;top:22%;background:#73736e;clip-path:polygon(50% 0,100% 100%,0 100%)}
.art.a6{background:#e4e4df}
.art.a6:before{width:52%;height:90%;left:24%;top:8%;border:1px solid #555;border-radius:48% 48% 0 0;transform:rotate(18deg)}
.art.a6:after{width:38%;height:38%;left:32%;top:30%;border-radius:50%;background:#aaa}
.item-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);z-index:1}
.item-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.62));z-index:2}
.item-copy{position:absolute;z-index:3;left:17px;right:17px;bottom:16px;color:white}
.item-no{font:italic 12px Georgia,serif;opacity:.8}
.item-title{font:clamp(22px,4vw,37px) Georgia,"Songti SC",serif;letter-spacing:-.04em;margin:7px 0 5px}
.item-caption{font-size:10px;letter-spacing:.12em;opacity:.82}
.star{position:absolute;z-index:4;right:13px;top:12px;width:31px;height:31px;border:1px solid rgba(255,255,255,.6);border-radius:50%;color:white;background:rgba(0,0,0,.1);cursor:pointer}
.star.saved{background:white;color:#111}
footer{border-top:1px solid var(--line);margin-top:28px;padding-top:15px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.12em}
.modal{position:fixed;inset:0;z-index:20;background:rgba(15,15,15,.48);display:none;align-items:flex-end;justify-content:center;padding:12px}
.modal.open{display:flex;animation:fade .2s ease}
.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--paper);padding:20px;border-radius:4px 4px 0 0;animation:rise .25s ease}
.sheet-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:12px}
.close{border:0;background:none;font-size:25px;cursor:pointer}
.detail-art{height:190px;position:relative;overflow:hidden;background:#ddd;margin:18px 0}
.detail-art .art{position:absolute;inset:0}
.detail-no{font:italic 13px Georgia,serif;color:var(--muted)}
.detail-title{font:clamp(35px,8vw,64px) Georgia,"Songti SC",serif;letter-spacing:-.06em;margin:10px 0}
.detail-desc{font-size:13px;line-height:1.8;color:#555;white-space:pre-wrap}
.edit-grid{display:grid;gap:12px;margin-top:18px}
label{display:grid;gap:6px;font-size:11px;color:#555}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:white;padding:11px;color:#111;border-radius:2px}
textarea{min-height:82px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions button{padding:10px 14px;border:1px solid #171717;background:#171717;color:white;cursor:pointer;font-size:12px}
.actions .secondary{background:transparent;color:#171717}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(max-width:560px){main{padding:22px 14px 48px}.top{padding:16px}.item:nth-child(n){grid-column:span 6;min-height:220px}.item:nth-child(3n+1){grid-column:span 12;min-height:285px}.item-title{font-size:25px}.hero h1{font-size:clamp(52px,14vw,80px)}.hero-foot p{max-width:210px}.sheet{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><span>MAOMAO / OBJECT NO. 07</span><a href="../index.html">← 返回桌面</a></header>
<main>
<section class="hero">
<div class="kicker">Independent visual collection · 2026</div>
<h1>VISUAL<span>Archive.</span></h1>
<div class="hero-foot"><p>一些被留住的片刻。点击作品进入档案，也可以替换图片、修改文字，把这里变成自己的收藏展。</p><div class="count" id="total">06 <small style="font:10px Arial;letter-spacing:.15em">WORKS</small></div></div>
</section>
<div class="toolbar"><div class="filters"><button class="pill active" data-filter="all">全部</button><button class="pill" data-filter="portrait">人物</button><button class="pill" data-filter="still">静物</button><button class="pill" data-filter="space">空间</button></div><button class="plain" id="addWork">＋ 新建档案</button></div>
<section class="grid" id="grid" aria-label="视觉档案"></section>
<footer><span>PERSONAL COLLECTION</span><span>BLACK / WHITE / GREY</span><span id="savedCount">0 SAVED</span></footer>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
<section class="sheet">
<div class="sheet-head"><span class="kicker" id="modalKicker">ARCHIVE DETAIL</span><button class="close" id="close" aria-label="关闭">×</button></div>
<div class="detail-art" id="detailArt"></div>
<div class="detail-no" id="detailNo">NO. 01 / PORTRAIT</div>
<h2 class="detail-title" id="detailTitle">Still, Here</h2>
<p class="detail-desc" id="detailDesc"></p>
<div class="edit-grid">
<label>作品标题<input type="text" id="editTitle" maxlength="70"></label>
<label>档案注释<textarea id="editDesc" maxlength="600"></textarea></label>
<label>替换作品图片（可选）<input type="file" id="editImage" accept="image/*"></label>
</div>
<div class="actions"><button id="save">保存修改</button><button class="secondary" id="favorite">加入收藏</button><button class="secondary" id="removeImage">恢复抽象封面</button></div>
</section>
</div>
<script>
const KEY='maomao_visual_archive_v1';
const seed=[
{id:1,title:'Still, Here',caption:'A STUDY OF PRESENCE',type:'portrait',desc:'有些时刻不需要被解释，只需要被好好留下。\n\n这是一份关于存在感的视觉笔记。',art:'a1'},
{id:2,title:'Objects in Silence',caption:'ORDINARY OBJECTS',type:'still',desc:'日常物件也有自己的秩序。把平凡的一角，收进私人档案。',art:'a2'},
{id:3,title:'The Other Side',caption:'A SMALL DISCOVERY',type:'space',desc:'从另一个角度重新看见熟悉的事物。',art:'a3'},
{id:4,title:'Soft Geometry',caption:'FORM / LIGHT / SHADOW',type:'still',desc:'形状、光线与留白之间，刚好有一处安静的位置。',art:'a4'},
{id:5,title:'Almost a Dream',caption:'FRAGMENT NO. 05',type:'portrait',desc:'像梦一样模糊的片段，也值得有自己的编号。',art:'a5'},
{id:6,title:'Room for Quiet',caption:'A PLACE TO RETURN',type:'space',desc:'为自己留一小块不被打扰的空间。',art:'a6'}];
let works;try{works=JSON.parse(localStorage.getItem(KEY))||seed.map(x=>({...x}));if(!Array.isArray(works))works=seed.map(x=>({...x}));}catch(e){works=seed.map(x=>({...x}));}
let filter='all',current=null;
const grid=document.getElementById('grid'),modal=document.getElementById('modal');
const typeName=t=>({portrait:'PORTRAIT',still:'STILL LIFE',space:'SPACE'})[t]||'PERSONAL';
function persist(){
  try{
    var payload=JSON.stringify(works);
    // 阈值：4,000,000 字符。localStorage 常见上限约 5MB，但各浏览器的实际配额口径（按字符数还是按 UTF-16 字节）和剩余空间都不统一，这里用 payload.length 本身做一个保守的提前提示，真正的写失败仍由下面的 try/catch 兜底。
    if(payload.length>4000000){
      alert('存储空间不足。档案累计约 '+Math.round(payload.length/1024)+' KB（字符数），请先删除或替换较大的作品图片后再保存。这次修改没有写入。');
      return false;
    }
    localStorage.setItem(KEY,payload);
    return true;
  }catch(e){
    alert('本地存储空间不足或读写异常，请先移除较大的图片后再保存。这次修改没有写入。');
    return false;
  }
}
function render(){
 grid.innerHTML='';
 const visible=works.filter(w=>filter==='all'||w.type===filter);
 visible.forEach((w,index)=>{
  const b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('aria-label','打开档案：'+w.title);
  const art=document.createElement('div');art.className='art '+(w.art||'a2');b.appendChild(art);
  if(w.image){const img=document.createElement('img');img.className='item-image';img.src=w.image;img.alt=w.title;b.appendChild(img);}
  const shade=document.createElement('div');shade.className='item-shade';b.appendChild(shade);
  const copy=document.createElement('div');copy.className='item-copy';copy.innerHTML='<div class="item-no">NO. '+String(works.indexOf(w)+1).padStart(2,'0')+' / '+typeName(w.type)+'</div><div class="item-title"></div><div class="item-caption"></div>';copy.querySelector('.item-title').textContent=w.title;copy.querySelector('.item-caption').textContent=w.caption||typeName(w.type);b.appendChild(copy);
  const star=document.createElement('button');star.type='button';star.className='star'+(w.favorite?' saved':'');star.textContent=w.favorite?'★':'☆';star.setAttribute('aria-label',w.favorite?'取消收藏':'收藏作品');star.onclick=e=>{e.stopPropagation();var prev=w.favorite;w.favorite=!w.favorite;if(!persist()){w.favorite=prev;return;}render();};b.appendChild(star);
  b.onclick=()=>openWork(w.id);grid.appendChild(b);
 });
 document.getElementById('total').innerHTML=String(works.length).padStart(2,'0')+' <small style="font:10px Arial;letter-spacing:.15em">WORKS</small>';
 document.getElementById('savedCount').textContent=works.filter(w=>w.favorite).length+' SAVED';
 document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));
}
function openWork(id){
 current=works.find(w=>w.id===id);if(!current)return;
 document.getElementById('detailArt').innerHTML='<div class="art '+(current.art||'a2')+'"></div>';
 if(current.image){const img=document.createElement('img');img.src=current.image;img.alt=current.title;img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1)';document.getElementById('detailArt').appendChild(img);}
 document.getElementById('detailNo').textContent='NO. '+String(works.indexOf(current)+1).padStart(2,'0')+' / '+typeName(current.type);
 document.getElementById('detailTitle').textContent=current.title;document.getElementById('detailDesc').textContent=current.desc||'尚未添加注释。';
 document.getElementById('editTitle').value=current.title;document.getElementById('editDesc').value=current.desc||'';document.getElementById('editImage').value='';
 document.getElementById('favorite').textContent=current.favorite?'取消收藏':'加入收藏';modal.classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(){modal.classList.remove('open');document.body.style.overflow='';current=null;}
document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{filter=x.dataset.filter;render();});
document.getElementById('close').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('save').onclick=()=>{
 if(!current)return;const title=document.getElementById('editTitle').value.trim();if(!title){alert('请填写作品标题。');return;}
 current.title=title;current.desc=document.getElementById('editDesc').value.trim();
 const file=document.getElementById('editImage').files[0];
 const commit=()=>{if(!persist())return;render();openWork(current.id);};
 if(file){if(file.size>1.5*1024*1024){alert('图片建议小于 1.5MB，避免占用过多手机存储。');return;}const reader=new FileReader();reader.onload=()=>{current.image=reader.result;commit();};reader.readAsDataURL(file);}else commit();
};
document.getElementById('favorite').onclick=()=>{if(!current)return;current.favorite=!current.favorite;if(!persist())return;render();openWork(current.id);};
document.getElementById('removeImage').onclick=()=>{if(!current)return;var prevImg=current.image;delete current.image;if(!persist()){current.image=prevImg;return;}render();openWork(current.id);};
document.getElementById('addWork').onclick=()=>{
 const id=works.reduce((m,w)=>Math.max(m,w.id),0)+1;
 const w={id,title:'New Fragment',caption:'PERSONAL NOTE',type:'still',desc:'',art:'a'+((id-1)%6+1),favorite:false};works.push(w);
 if(!persist()){works.pop();return;}
 filter='all';render();openWork(id);
};
render();
</script>
</body>
</html>
