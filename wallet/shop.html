<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F7F9" />
<title>商店</title>
<script src="../shared/js/native-feel.js"></script>
<script src="../shared/js/phone/phone_storage.js"></script>
<script src="../shared/js/phone/role_family_cards.js?v=20261028v3"></script>
<link rel="stylesheet" href="../shared/css/mobile-fit.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  html { background: #E8E8EC; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #F7F7F9; color: #111;
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 90px; position: relative;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .cart-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 1px solid #ECECEF;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    position: relative;
  }
  .cart-badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: #FF3B30; color: #fff;
    border-radius: 9px; font-size: 0.625rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-badge:empty, .cart-badge[data-zero="1"] { display: none; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 0;
    background: transparent; border: 0; border-bottom: 1px solid #bdbdbd;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .back-btn:active { transform: translateY(1px); border-color: #171717; }
  .brand-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .brand-title small { display: block; font-size: 0.875rem; font-weight: 700; opacity: 0.5; letter-spacing: 0.05em; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.875rem; font-weight: 600;
    cursor: pointer;
  }

  .search-box {
    margin: 0 20px 16px;
    background: #fff; border: 1px solid #ECECEF;
    border-radius: 14px; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    color: #999; font-size: 0.875rem;
  }

  .cats {
    display: flex; gap: 18px;
    padding: 0 20px 16px;
    overflow-x: auto; scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    font-size: 0.813rem; font-weight: 700;
    letter-spacing: 0.05em;
    color: #ccc; cursor: pointer;
    padding-bottom: 4px;
  }
  .cat-tab.active { color: #111; border-bottom: 2px solid #111; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 0 20px;
  }
  .product {
    background: #fff; border: 1px solid #ECECEF;
    border-radius: 18px; overflow: hidden; cursor: pointer;
  }
  .p-img {
    width: 100%; aspect-ratio: 1;
    background: #F4F4F6;
    display: flex; align-items: center; justify-content: center;
  }
  .p-body { padding: 12px; text-align: center; }
  .p-name { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.03em; }
  .p-cn { font-size: 0.65rem; color: #999; margin-top: 2px; }
  .p-price { font-size: 0.813rem; font-weight: 700; margin-top: 4px; }

  .detail-view { display: none; }
  .detail-view.show { display: block; }
  .list-view.hide { display: none; }

  .detail-hero {
    margin: 0 20px;
    background: #fff; border: 1px solid #ECECEF;
    border-radius: 24px;
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .detail-title { padding: 24px 24px 8px; }
  .detail-title h2 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .detail-desc { padding: 0 24px 20px; font-size: 0.813rem; color: #999; line-height: 1.6; }

  .buy-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; max-width: 100%;
    background: #111; color: #fff;
    padding: 16px 20px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100;
  }
  .buy-price small { display: block; font-size: 0.625rem; opacity: 0.5; margin-bottom: 2px; }
  .buy-price .v { font-size: 1.25rem; font-weight: 700; }
  .buy-btn {
    background: #fff; color: #111;
    border: none; padding: 14px 28px;
    border-radius: 24px; font-size: 0.938rem; font-weight: 700;
    cursor: pointer; letter-spacing: 0.05em;
  }

  .cart-bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff;
    padding: 10px 20px; border-radius: 24px;
    font-size: 0.75rem; font-weight: 600;
    cursor: pointer; z-index: 99;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }

  .toast {
    position: fixed; bottom: 120px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111; color: #fff;
    padding: 10px 18px; border-radius: 20px; font-size: 0.813rem;
    opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Banner */
  .banner {
    margin: 0 20px 16px;
    border-radius: 18px; overflow: hidden;
    position: relative; aspect-ratio: 2.1/1;
    background: #ECECEF;
  }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .banner-text {
    position: absolute; left: 14px; top: 14px;
    background: rgba(255,255,255,0.88); backdrop-filter: blur(8px);
    padding: 10px 14px; border-radius: 12px;
  }
  .banner-tag { font-size: 0.58rem; letter-spacing: 0.18em; color: #999; font-weight: 700; }
  .banner-title { font-size: 1rem; font-weight: 800; margin-top: 3px; letter-spacing: -0.01em; }
  .banner-sub { font-size: 0.66rem; color: #666; margin-top: 2px; }

  /* 优惠券条 */
  .coupon-bar { display: flex; gap: 10px; padding: 0 20px 16px; overflow-x: auto; scrollbar-width: none; }
  .coupon-bar::-webkit-scrollbar { display: none; }
  .coupon {
    flex-shrink: 0; background: #111; color: #fff;
    border-radius: 12px; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 2px; min-width: 96px;
    cursor: pointer;
  }
  .coupon b { font-size: 0.938rem; font-weight: 800; }
  .coupon span { font-size: 0.6rem; opacity: 0.65; letter-spacing: 0.05em; }
  .coupon.light { background: #fff; color: #111; border: 1px solid #ECECEF; }

  /* 区块标题 */
  .section-head {
    padding: 4px 20px 10px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .section-head h3 { font-size: 0.938rem; font-weight: 800; letter-spacing: -0.01em; }
  .section-head .more { font-size: 0.66rem; color: #999; }

  /* 热销横排 */
  .hot-row { display: flex; gap: 10px; padding: 0 20px 18px; overflow-x: auto; scrollbar-width: none; }
  .hot-row::-webkit-scrollbar { display: none; }
  .hot-item {
    flex-shrink: 0; width: 116px;
    background: #fff; border: 1px solid #ECECEF; border-radius: 14px;
    overflow: hidden; cursor: pointer;
  }
  .hot-item .h-img { width: 100%; aspect-ratio: 1; background: #F4F4F6; overflow: hidden; }
  .hot-item .h-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hot-item .h-body { padding: 8px 10px 10px; }
  .hot-item .h-price { font-size: 0.813rem; font-weight: 800; }
  .hot-item .h-sold { font-size: 0.6rem; color: #999; margin-top: 2px; }

  /* 商品图 */
  .p-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 物流详情 */
  .logi-card { margin: 0 20px 12px; background: #fff; border: 1px solid #ECECEF; border-radius: 14px; padding: 16px; }
  .logi-latest { font-size: 0.875rem; font-weight: 700; line-height: 1.5; }
  .logi-time { font-size: 0.688rem; color: #999; margin-top: 4px; }
  .logi-steps { margin: 16px 20px 12px; background: #fff; border: 1px solid #ECECEF; border-radius: 14px; padding: 16px; }
  .logi-step { display: flex; gap: 12px; position: relative; padding-bottom: 18px; }
  .logi-step:last-child { padding-bottom: 0; }
  .logi-step::before {
    content: ''; position: absolute; left: 5px; top: 14px; bottom: 0;
    width: 1.5px; background: #ECECEF;
  }
  .logi-step:last-child::before { display: none; }
  .logi-step.done::before { background: #111; }
  .logi-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #E0E0E0; flex-shrink: 0; margin-top: 3px; z-index: 1;
  }
  .logi-step.done .logi-dot { background: #111; }
  .logi-step.now .logi-dot { background: #111; box-shadow: 0 0 0 4px rgba(0,0,0,0.08); }
  .logi-step-body { flex: 1; }
  .logi-step-title { font-size: 0.813rem; font-weight: 700; }
  .logi-step.now .logi-step-title { color: #111; }
  .logi-step:not(.done):not(.now) .logi-step-title { color: #ccc; }
  .logi-step-desc { font-size: 0.688rem; color: #999; margin-top: 2px; }
  .logi-step-time { font-size: 0.625rem; color: #bbb; margin-top: 2px; }
  .order-item-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #F2F2F4; }
  .order-item-row:last-child { border-bottom: none; }
  .order-item-row .oi-name { flex: 1; font-size: 0.813rem; }
  .order-item-row .oi-price { font-size: 0.813rem; font-weight: 700; }

  /* 小票 */
  .receipt-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 300;
    animation: fadeIn 0.25s ease;
  }
  .receipt-backdrop.show { display: flex; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes printOut {
    0% { transform: translateY(-120%) scale(0.95); opacity: 0; }
    60% { transform: translateY(2%) scale(1.02); opacity: 1; }
    80% { transform: translateY(-1%) scale(1); }
    100% { transform: translateY(0) scale(1); }
  }
  .receipt {
    width: 280px;
    background: #fff;
    color: #111;
    position: relative;
    animation: printOut 0.6s cubic-bezier(.2,.8,.2,1) both;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .receipt::before, .receipt::after {
    content: '';
    position: absolute; left: 0; right: 0; height: 10px;
    background:
      radial-gradient(circle at 8px -2px, transparent 8px, #fff 8.5px) repeat-x;
    background-size: 16px 10px;
  }
  .receipt::before { top: -9px; }
  .receipt::after { bottom: -9px; transform: scaleY(-1); }
  .r-head {
    text-align: center; padding: 20px 20px 12px;
    border-bottom: 1px dashed #ccc;
  }
  .r-shop { font-size: 0.938rem; font-weight: 800; letter-spacing: 0.1em; }
  .r-sub { font-size: 0.625rem; color: #999; margin-top: 4px; letter-spacing: 0.1em; }
  .r-body { padding: 14px 20px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.72rem; }
  .r-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .r-row .name { flex: 1; padding-right: 10px; }
  .r-divider { border-top: 1px dashed #ccc; margin: 10px 0; }
  .r-total { font-size: 0.938rem; font-weight: 800; }
  .r-foot { text-align: center; padding: 10px 20px 20px; font-size: 0.625rem; color: #999; letter-spacing: 0.1em; }
  .r-done {
    display: block; width: calc(100% - 40px); margin: 0 20px 20px;
    background: #111; color: #fff; border: none;
    padding: 12px; border-radius: 20px;
    font-size: 0.875rem; font-weight: 700; cursor: pointer;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

  <div class="list-view" id="listView">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='../index.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand-title">NEW<small>ARRIVALS</small></div>
      </div>
      <div class="header-right">
        <div class="cart-icon" onclick="openOrders()" title="订单">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg>
        </div>
        <div class="cart-icon" onclick="openCart()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge" id="cartBadge" data-zero="1"></span>
        </div>
        <div class="avatar" onclick="window.location.href='shop-admin.html'">店</div>
      </div>
    </div>

    <div class="banner">
      <img src="../assets/shop/banner.jpg" alt="banner">
      <div class="banner-text">
        <div class="banner-tag">NEW SEASON 2026</div>
        <div class="banner-title">极简生活系列</div>
        <div class="banner-sub">秋季新品已上架 · 全场包邮</div>
      </div>
    </div>

    <div class="coupon-bar">
      <div class="coupon" onclick="showToast('优惠券已领取 ¥50')">
        <b>¥50</b><span>新人立减券</span>
      </div>
      <div class="coupon light" onclick="showToast('满500减50 已领取')">
        <b>满500减50</b><span>限时 3 天</span>
      </div>
      <div class="coupon light" onclick="showToast('2件9折叠加中')">
        <b>2件9折</b><span>搭配购更划算</span>
      </div>
    </div>

    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      I'M LOOKING FOR...
    </div>

    <div class="cats" id="catTabs"></div>

    <div class="section-head">
      <h3>热销榜 · TOP 4</h3>
      <span class="more">本周热卖 ›</span>
    </div>
    <div class="hot-row" id="hotRow"></div>

    <div class="section-head">
      <h3>全部商品</h3>
      <span class="more" id="gridCount"></span>
    </div>
    <div class="grid" id="productGrid"></div>
  </div>

  <div class="detail-view" id="detailView">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="goBack()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand-title">DETAIL</div>
      </div>
      <div class="avatar" onclick="window.location.href='shop-admin.html'">店</div>
    </div>

    <div class="detail-hero" id="detailHero"></div>
    <div class="detail-title"><h2 id="detailName"></h2></div>
    <div class="detail-desc" id="detailDesc"></div>

    <div class="buy-bar">
      <div class="buy-price">
        <small>PRICE</small>
        <span class="v" id="detailPrice"></span>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <button onclick="addCart()" aria-label="加入购物车" style="width:44px;height:44px;border-radius:50%;background:transparent;border:1.5px solid rgba(255,255,255,0.3);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </button>
        <button class="buy-btn" onclick="buyNow()">BUY NOW</button>
      </div>
    </div>
  </div>

  <!-- 订单视图 -->
  <div class="detail-view" id="ordersView" style="display:none;">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="closeOrders()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand-title">ORDERS</div>
      </div>
      <div style="width:40px"></div>
    </div>
    <div id="ordersList" style="padding:20px;"></div>
  </div>

  <!-- 购物车视图 -->
  <div class="detail-view" id="cartView" style="display:none;">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="closeCart()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand-title">CART</div>
      </div>
      <div style="width:40px"></div>
    </div>
    <div id="cartList" style="padding:0 20px;"></div>
    <div id="cartEmpty" style="text-align:center;padding:60px 20px;color:#999;font-size:0.875rem;">购物车是空的</div>
    <div class="buy-bar">
      <div class="buy-price">
        <small>TOTAL</small>
        <span class="v" id="cartTotal">¥0</span>
      </div>
      <button class="buy-btn" onclick="checkout()">结算</button>
    </div>
  </div>

  <!-- 订单物流详情视图 -->
  <div class="detail-view" id="orderDetailView" style="display:none;">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="closeOrderDetail()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand-title">物流详情</div>
      </div>
      <div style="width:40px"></div>
    </div>
    <div id="orderDetailBody" style="padding-bottom:20px;"></div>
  </div>

  <!-- 支付视图 -->
  <div class="detail-view" id="payView" style="display:none;">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="closePay()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand-title">PAYMENT</div>
      </div>
      <div style="width:40px"></div>
    </div>

    <div style="padding:30px 24px 10px;text-align:center;">
      <div style="font-size:0.75rem;color:#999;margin-bottom:8px;">支付金额</div>
      <div style="font-size:2.5rem;font-weight:800;letter-spacing:-0.02em;" id="payAmount">¥0</div>
    </div>

    <div style="padding:24px 20px;">
      <div style="font-size:0.75rem;color:#999;margin-bottom:10px;">选择支付方式</div>
      <div id="payMethods"></div>
    </div>

    <div class="buy-bar">
      <div class="buy-price">
        <small>TOTAL</small>
        <span class="v" id="payTotal">¥0</span>
      </div>
      <button class="buy-btn" onclick="doPay()">确认支付</button>
    </div>
  </div>

  <!-- 支付成功/派送视图 -->
  <div class="detail-view" id="doneView" style="display:none;">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="backHome()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand-title">ORDER</div>
      </div>
      <div style="width:40px"></div>
    </div>
    <div style="padding:60px 24px;text-align:center;">
      <div style="width:72px;height:72px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>

<script>
  const CATS = ['ALL','数码','食品','美食','服装'];
  let activeCat = 'ALL';
  let cart = [];

  const DEFAULTS = [

    { id: 9, name: 'DIP COFFEE BOX', cn: '挂耳咖啡礼盒', price: 89, cat: '食品', icon: 'coffee', desc: '精选产地挂耳咖啡，10片装。' },
    { id: 10, name: 'MIXED NUTS', cn: '混合坚果罐装', price: 69, cat: '食品', icon: 'nuts', desc: '每日坚果混合装，净含量500g。' },

    { id: 12, name: 'BUTTER COOKIE', cn: '黄油曲奇铁盒', price: 59, cat: '美食', icon: 'cookie', desc: '法式黄油曲奇，手工制作。' },
    { id: 13, name: 'DARK CHOC 72%', cn: '黑巧克力排块', price: 39, cat: '美食', icon: 'chocolate', desc: '72%可可黑巧，比利时进口。' },
    { id: 14, name: 'GRANOLA BAG', cn: '燕麦脆麦片', price: 49, cat: '美食', icon: 'granola', desc: '即食烤燕麦，早餐伴侣。' },
    { id: 15, name: 'HEAVY HOODIE', cn: '重磅连帽卫衣', price: 299, cat: '服装', icon: 'hoodie', desc: '480g重磅棉，落肩宽松版型。' },
    { id: 16, name: 'BASIC TEE', cn: '纯棉基础T恤', price: 99, cat: '服装', icon: 'tshirt', desc: '230g重磅棉，百搭基础款。' },
    { id: 17, name: 'KNIT BEANIE', cn: '灰色针织冷帽', price: 79, cat: '服装', icon: 'beanie', desc: '羊毛混纺针织帽，秋冬保暖。' },
  ];

  function loadProducts() {
    let arr;
    try { arr = JSON.parse(localStorage.getItem('shop_products') || 'null'); }
    catch(e) { arr = null; }
    if (!arr || !arr.length) {
      arr = JSON.parse(JSON.stringify(DEFAULTS));
      localStorage.setItem('shop_products', JSON.stringify(arr));
      return arr;
    }
    // 自动补入 DEFAULTS 里新增的商品（id 不存在则追加）
    DEFAULTS.forEach(d => {
      if (!arr.find(p => p.id === d.id)) arr.push(JSON.parse(JSON.stringify(d)));
    });
    localStorage.setItem('shop_products', JSON.stringify(arr));
    return arr;
  }
  let PRODUCTS = loadProducts();

  function productIcon(type) {
    const map = {
      headphone: '../assets/shop/p-headphone.jpg',
      earbud: '../assets/shop/p-earbud.jpg',
      speaker: '../assets/shop/p-speaker.jpg',
      watch: '../assets/shop/p-watch.jpg',
      bag: '../assets/shop/p-bag.jpg',
      keyboard: '../assets/shop/p-keyboard.jpg',
      lamp: '../assets/shop/p-lamp.jpg',
      pen: '../assets/shop/p-pen.jpg',
      coffee: '../assets/shop/p-coffee.jpg',
      nuts: '../assets/shop/p-nuts.jpg',
      matcha: '../assets/shop/p-matcha.jpg',
      cookie: '../assets/shop/p-cookie.jpg',
      chocolate: '../assets/shop/p-chocolate.jpg',
      granola: '../assets/shop/p-granola.jpg',
      hoodie: '../assets/shop/p-hoodie.jpg',
      tshirt: '../assets/shop/p-tshirt.jpg',
      beanie: '../assets/shop/p-beanie.jpg',
    };
    const src = map[type] || map.headphone;
    return '<img src="' + src + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">';
  }

  function renderCats() {
    document.getElementById('catTabs').innerHTML = CATS.map(c =>
      `<div class="cat-tab ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</div>`
    ).join('');
  }
  function setCat(c) { activeCat = c; renderCats(); renderProducts(); }

  function renderProducts() {
    const list = activeCat === 'ALL' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);
    document.getElementById('productGrid').innerHTML = list.map(p => `
      <div class="product" onclick="openDetail(${p.id})">
        <div class="p-img">${productIcon(p.icon)}</div>
        <div class="p-body">
          <div class="p-name">${p.name}</div>
          <div class="p-cn">${p.cn}</div>
          <div class="p-price">¥${p.price}.00</div>
        </div>
      </div>
    `).join('');
    document.getElementById('gridCount').textContent = list.length + ' 件在售';
  }

  function renderHot() {
    const hot = PRODUCTS.slice(0, 4);
    const sold = [328, 256, 189, 142];
    document.getElementById('hotRow').innerHTML = hot.map((p, i) => `
      <div class="hot-item" onclick="openDetail(${p.id})">
        <div class="h-img">${productIcon(p.icon)}</div>
        <div class="h-body">
          <div class="h-price">¥${p.price}.00</div>
          <div class="h-sold">已售 ${sold[i] || 99}</div>
        </div>
      </div>
    `).join('');
  }

  let currentProduct = null;
  function openDetail(id) {
    currentProduct = PRODUCTS.find(p => p.id === id);
    if (!currentProduct) return;
    document.getElementById('listView').classList.add('hide');
    document.getElementById('detailView').classList.add('show');
    document.getElementById('detailHero').innerHTML = productIcon(currentProduct.icon);
    document.getElementById('detailName').textContent = currentProduct.name;
    document.getElementById('detailDesc').textContent = currentProduct.desc;
    document.getElementById('detailPrice').textContent = '¥' + currentProduct.price + '.00';
    window.scrollTo(0, 0);
  }
  function goBack() {
    document.getElementById('detailView').classList.remove('show');
    document.getElementById('listView').classList.remove('hide');
  }

  function buyNow() {
    if (!currentProduct) return;
    // 直接走支付：临时把当前商品作为订单
    const tmpCart = [{ id: currentProduct.id, name: currentProduct.name, cn: currentProduct.cn, price: currentProduct.price }];
    const total = tmpCart[0].price;
    document.getElementById('payAmount').textContent = '¥' + total;
    document.getElementById('payTotal').textContent = '¥' + total;
    payMethod = 'normal';
    renderPayMethods(total);
    // 使用临时订单支付，不覆盖真实购物车
    payItems = tmpCart;
    payFromCart = false;
    document.getElementById('detailView').classList.remove('show');
    document.getElementById('payView').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function updateCart() {
    let bar = document.getElementById('cartBar');
    if (!bar && cart.length > 0) {
      bar = document.createElement('div');
      bar.id = 'cartBar'; bar.className = 'cart-bar';
      bar.onclick = () => showToast('购物车 ' + cart.length + ' 件');
      document.body.appendChild(bar);
    }
    if (bar) bar.textContent = cart.length + ' ITEM SELECTED';
  }

  // === 购物车（持久化）===
  function loadCart() {
    try { return JSON.parse(localStorage.getItem('shop_cart') || '[]'); }
    catch(e) { return []; }
  }
  function saveCart(c) { localStorage.setItem('shop_cart', JSON.stringify(c)); updateBadge(); }
  let shopCart = loadCart();
  // 支付流程使用的商品快照（避免污染真实购物车）
  let payItems = [];
  let payFromCart = false;
  let payMethod = 'normal'; // 'normal' | 'close_pay'

  // 读取亲密付配置（用户给角色代付，保留原有方向）
  function getClosePay() {
    try {
      var d = JSON.parse(localStorage.getItem('close_pay') || 'null');
      if (d && typeof d === 'object') return d;
    } catch (e) {}
    return null;
  }

  function escapeFamilyCardText(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }
  function getRoleCardFromMethod(method) {
    if (!window.RoleFamilyCards || String(method || '').indexOf('role_card:') !== 0) return null;
    return window.RoleFamilyCards.find(String(method).slice('role_card:'.length));
  }
  function canUseRoleCard(card, total) {
    return !!(window.RoleFamilyCards && window.RoleFamilyCards.canUse(card, total));
  }
  function appendChatHistoryMessage(roleId, message) {
    if (!roleId || !message) return false;
    try {
      var storage = window.PhoneStorage;
      var history = storage && typeof storage.getChatHistory === 'function'
        ? storage.getChatHistory(roleId)
        : JSON.parse(localStorage.getItem('chat_history_' + roleId) || '[]');
      if (!Array.isArray(history)) throw new Error('聊天记录格式无法识别');

      var next = history.slice();
      next.push(message);
      var saved = false;
      if (storage && typeof storage.saveChatHistory === 'function') {
        saved = storage.saveChatHistory(roleId, next) === true;
      } else {
        localStorage.setItem('chat_history_' + roleId, JSON.stringify(next));
        saved = true;
      }
      if (!saved) throw new Error('聊天记录写入失败');

      var verified = storage && typeof storage.getChatHistory === 'function'
        ? storage.getChatHistory(roleId)
        : JSON.parse(localStorage.getItem('chat_history_' + roleId) || '[]');
      var last = Array.isArray(verified) && verified.length ? verified[verified.length - 1] : null;
      if (!Array.isArray(verified) || verified.length !== next.length ||
          !last || last.role !== message.role || last.type !== message.type ||
          last.time !== message.time ||
          (message.text !== undefined && last.text !== message.text) ||
          (message.gift && (!last.gift || last.gift.name !== message.gift.name ||
            last.gift.price !== message.gift.price))) {
        throw new Error('聊天记录写入后校验失败');
      }
      return true;
    } catch (error) {
      console.error('[Wallet:shop] chat history persistence failed:', error);
      return false;
    }
  }
  function notifyRoleCardIssuer(card, message) {
    if (!card || !card.roleId) return false;
    var saved = appendChatHistoryMessage(card.roleId, {
      role: 'user', type: 'text', text: message, time: Date.now()
    });
    if (!saved) showToast('业务操作已完成，但聊天通知没有保存，请稍后在聊天中补发');
    return saved;
  }

  // 动态渲染支付方式列表：日常账户 + 可选亲密付
  function renderPayMethods(total) {
    var box = document.getElementById('payMethods');
    var cp = getClosePay();
    var canClose = cp && cp.enabled && cp.roleName &&
                   (Number(cp.used) || 0) + total <= (Number(cp.limit) || 0);
    var roleCardApi = window.RoleFamilyCards;
    var roleCards = roleCardApi ? roleCardApi.readAll().filter(function (card) {
      return card && card.status === 'active';
    }) : [];
    if (payMethod.indexOf('role_card:') === 0) {
      var selectedRoleCard = getRoleCardFromMethod(payMethod);
      if (!selectedRoleCard || !canUseRoleCard(selectedRoleCard, total)) payMethod = 'normal';
    }

    var normalHtml =
      '<div data-method="normal" style="padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1.5px solid ' + (payMethod==='normal' ? '#111' : '#E5E5EA') + ';background:#fff;cursor:pointer;">' +
        '<div>' +
          '<div style="font-size:0.875rem;font-weight:600;">日常账户</div>' +
          '<div style="font-size:0.688rem;color:#999;letter-spacing:0.1em;margin-top:4px;">5292 •••• •••• 3123</div>' +
        '</div>' +
        '<div style="width:18px;height:18px;border-radius:50%;border:1.5px solid ' + (payMethod==='normal' ? '#111' : '#E5E5EA') + ';display:flex;align-items:center;justify-content:center;">' +
          (payMethod==='normal' ? '<div style="width:10px;height:10px;border-radius:50%;background:#111;"></div>' : '') +
        '</div>' +
      '</div>';

    var cpHtml = '';
    if (canClose) {
      cpHtml =
        '<div data-method="close_pay" style="padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1.5px solid ' + (payMethod==='close_pay' ? '#111' : '#E5E5EA') + ';background:#fff;cursor:pointer;">' +
          '<div>' +
            '<div style="font-size:0.875rem;font-weight:600;">亲密付 · ' + escapeFamilyCardText(cp.roleName) + '</div>' +
            '<div style="font-size:0.688rem;color:#999;margin-top:4px;">剩余 ¥' + Math.max(0,(Number(cp.limit)-Number(cp.used))).toFixed(2) + ' / 月</div>' +
          '</div>' +
          '<div style="width:18px;height:18px;border-radius:50%;border:1.5px solid ' + (payMethod==='close_pay' ? '#111' : '#E5E5EA') + ';display:flex;align-items:center;justify-content:center;">' +
            (payMethod==='close_pay' ? '<div style="width:10px;height:10px;border-radius:50%;background:#111;"></div>' : '') +
          '</div>' +
        '</div>';
    } else if (cp && cp.enabled && !cp.roleName) {
      cpHtml = '<div style="padding:12px 14px;border-radius:14px;background:#F7F7F7;font-size:0.75rem;color:#999;margin-bottom:10px;">你设置的亲密付还没有绑定角色</div>';
    }

    var roleCardsHtml = roleCards.map(function (card) {
      var method = 'role_card:' + card.id;
      var available = Math.max(0, (Number(card.monthlyLimit) || 0) - roleCardApi.usedThisMonth(card));
      var usable = canUseRoleCard(card, total);
      var selected = payMethod === method;
      var kind = card.kind === 'intimate' ? '亲密付' : '亲属卡';
      var disabledHint = total > (Number(card.singleLimit) || 0)
        ? '超过单笔上限'
        : (available < total ? '本月额度不足' : '暂不可用');
      return '<div ' + (usable ? 'data-method="' + escapeFamilyCardText(method) + '"' : '') +
        ' style="padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1.5px solid ' + (selected ? '#111' : '#E5E5EA') + ';background:#fff;cursor:' + (usable ? 'pointer' : 'not-allowed') + ';opacity:' + (usable ? '1' : '.56') + ';">' +
          '<div style="min-width:0;flex:1;">' +
            '<div style="font-size:0.875rem;font-weight:600;">' + kind + ' · ' + escapeFamilyCardText(card.roleName || '角色') + ' 赠予</div>' +
            '<div style="font-size:0.688rem;color:#888;margin-top:4px;">本月剩余 ¥' + available.toFixed(2) + ' · 单笔上限 ¥' + (Number(card.singleLimit) || 0).toFixed(2) + '</div>' +
            (usable ? '' : '<div style="font-size:0.688rem;color:#888;margin-top:4px;">' + disabledHint + '</div>') +
          '</div>' +
          '<div style="width:18px;height:18px;border-radius:50%;border:1.5px solid ' + (selected ? '#111' : '#E5E5EA') + ';display:flex;align-items:center;justify-content:center;margin-left:10px;">' +
            (selected ? '<div style="width:10px;height:10px;border-radius:50%;background:#111;"></div>' : '') +
          '</div>' +
        '</div>';
    }).join('');

    box.innerHTML = normalHtml + cpHtml + roleCardsHtml;
    box.querySelectorAll('[data-method]').forEach(function(el){
      el.addEventListener('click', function(){
        payMethod = el.dataset.method;
        renderPayMethods(total);
      });
    });
  }

  function updateBadge() {
    const b = document.getElementById('cartBadge');
    if (!b) return;
    if (shopCart.length > 0) { b.textContent = shopCart.length; b.removeAttribute('data-zero'); }
    else { b.setAttribute('data-zero','1'); b.textContent = ''; }
  }

  // === 订单（含角色送礼）===
  function loadOrders() {
    try { return JSON.parse(localStorage.getItem('shop_orders') || '[]'); }
    catch(e) { return []; }
  }
  function saveOrders(o) { localStorage.setItem('shop_orders', JSON.stringify(o)); }

  function orderStatus(ts) {
    const hr = (Date.now() - ts) / 3600000;
    if (hr < 1) return { label: '已下单', color: '#999' };
    if (hr < 3) return { label: '打包中', color: '#666' };
    if (hr < 24) return { label: '派送中', color: '#111' };
    return { label: '已签收', color: '#999' };
  }

  function openOrders() {
    document.getElementById('listView').classList.add('hide');
    document.getElementById('cartView').style.display = 'none';
    document.getElementById('payView').style.display = 'none';
    document.getElementById('doneView').style.display = 'none';
    document.getElementById('ordersView').style.display = 'block';
    renderOrders();
    window.scrollTo(0, 0);
  }
  function closeOrders() {
    document.getElementById('ordersView').style.display = 'none';
    document.getElementById('listView').classList.remove('hide');
  }

  function renderOrders() {
    const all = loadOrders().reverse();
    const orders = all.filter(o => o.roleName === '我');
    const box = document.getElementById('ordersList');
    if (orders.length === 0) {
      box.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#999;font-size:0.875rem;">还没有订单</div>';
      return;
    }
    box.innerHTML = orders.map((o, i) => {
      const st = orderStatus(o.ts);
      const itemNames = o.items.map(it => it.cn).join('、');
      return `
        <div style="background:#fff;border:1px solid #ECECEF;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;" onclick="openOrderDetail(${i})">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <div style="width:36px;height:36px;border-radius:50%;background:${o.roleBg||'#111'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.813rem;font-weight:700;">${o.roleName[0]}</div>
            <div style="flex:1;">
              <div style="font-size:0.813rem;font-weight:700;">${o.roleName === '我' ? '我的订单' : o.roleName}</div>
              <div style="font-size:0.688rem;color:#999;">${new Date(o.ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
            </div>
            <div style="font-size:0.688rem;font-weight:700;color:${st.color};border:1px solid ${st.color};padding:3px 10px;border-radius:10px;">${st.label}</div>
          </div>
          <div style="font-size:0.78rem;color:#666;">${itemNames}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
            <div style="font-size:0.875rem;font-weight:700;">¥${o.total}.00</div>
            <div style="font-size:0.688rem;color:#999;">查看物流 ›</div>
          </div>
        </div>`;
    }).join('');
  }

  function openOrderDetail(i) {
    const all = loadOrders().reverse();
    const orders = all.filter(o => o.roleName === '我');
    const o = orders[i];
    if (!o) return;
    const box = document.getElementById('orderDetailBody');
    const now = Date.now();
    const hr = (now - o.ts) / 3600000;
    const fmt = (t) => new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-');
    // 物流步骤：[标题, 描述, 相对小时偏移, 已完成?]
    const steps = [
      { title: '订单已下单', desc: '等待仓库发货', off: 0 },
      { title: '仓库已打包', desc: '包裹已打包，等待快递揽收', off: 1 },
      { title: '商品已发货', desc: '快递已揽收，包裹正在发往转运中心', off: 3 },
      { title: '运输中', desc: '包裹已到达转运中心，正在发往派送点', off: 24 },
      { title: '派送中', desc: '快递员正在为您派送，请保持电话畅通', off: 48 },
      { title: '已签收', desc: '感谢购买，欢迎再次光临', off: 72 },
    ];
    let curIdx = 0;
    steps.forEach((s, idx) => { if (hr >= s.off) curIdx = idx; });
    const latest = steps[curIdx];
    const latestTime = fmt(o.ts + latest.off * 3600000);

    let stepsHtml = steps.map((s, idx) => {
      let state = '';
      if (idx < curIdx) state = 'done';
      else if (idx === curIdx) state = 'now';
      const t = idx <= curIdx ? fmt(o.ts + s.off * 3600000) : '';
      return `
        <div class="logi-step ${state}">
          <div class="logi-dot"></div>
          <div class="logi-step-body">
            <div class="logi-step-title">${s.title}</div>
            <div class="logi-step-desc">${s.desc}</div>
            ${t ? `<div class="logi-step-time">${t}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    let itemsHtml = o.items.map(it => `
      <div class="order-item-row">
        <div style="flex:1;">
          <div style="font-size:0.813rem;font-weight:600;">${it.cn}</div>
        </div>
        <div class="oi-price">¥${it.price}.00</div>
      </div>
    `).join('');

    box.innerHTML = `
      <div class="logi-card">
        <div class="logi-latest">${latest.title} · ${latest.desc}</div>
        <div class="logi-time">${latestTime}</div>
      </div>
      <div class="logi-steps">${stepsHtml}</div>
      <div class="logi-card">
        <div style="font-size:0.75rem;color:#999;margin-bottom:8px;">包裹信息 · 极简速运</div>
        ${itemsHtml}
        <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #F2F2F4;">
          <span style="font-size:0.813rem;color:#666;">合计</span>
          <span style="font-size:1rem;font-weight:800;">¥${o.total}.00</span>
        </div>
      </div>
      <div style="margin:0 20px;font-size:0.688rem;color:#bbb;">订单号 #${String(o.ts).slice(-6)} · 下单时间 ${fmt(o.ts)}</div>
    `;
    document.getElementById('ordersView').style.display = 'none';
    document.getElementById('orderDetailView').style.display = 'block';
    window.scrollTo(0, 0);
  }
  function closeOrderDetail() {
    document.getElementById('orderDetailView').style.display = 'none';
    document.getElementById('ordersView').style.display = 'block';
  }

  function simulateCharOrder() {
    let chars = [];
    try { chars = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]'); } catch(e) {}
    if (chars.length === 0) {
      chars = [{ id:'baby', name:'宝宝', avatarBg:'#111' }];
    }
    const c = chars[Math.floor(Math.random()*chars.length)];
    const p = PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];
    const orders = loadOrders();
    orders.push({
      roleName: c.name || '神秘人',
      roleBg: c.avatarBg || '#111',
      items: [{ cn: p.cn, price: p.price }],
      total: p.price,
      ts: Date.now() - Math.random()*3600000*10  // 随机10小时内
    });
    saveOrders(orders);
    renderOrders();
  }

  function addCart() {
    if (!currentProduct) return;
    shopCart.push({ id: currentProduct.id, name: currentProduct.name, cn: currentProduct.cn, price: currentProduct.price });
    saveCart(shopCart);
    showToast('已加入购物车');
  }

  function openCart() {
    document.getElementById('listView').classList.add('hide');
    document.getElementById('detailView').classList.remove('show');
    const cv = document.getElementById('cartView');
    cv.style.display = 'block';
    renderCart();
    window.scrollTo(0, 0);
  }
  function closeCart() {
    document.getElementById('cartView').style.display = 'none';
    document.getElementById('listView').classList.remove('hide');
  }
  function removeFromCart(i) {
    shopCart.splice(i, 1);
    saveCart(shopCart); renderCart();
  }
  function renderCart() {
    const box = document.getElementById('cartList');
    const empty = document.getElementById('cartEmpty');
    if (shopCart.length === 0) {
      box.innerHTML = ''; empty.style.display = 'block';
      document.getElementById('cartTotal').textContent = '¥0';
      return;
    }
    empty.style.display = 'none';
    let total = 0;
    box.innerHTML = shopCart.map((c,i) => {
      total += c.price;
      return `
        <div style="display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #ECECEF;border-radius:12px;padding:12px;margin-bottom:8px;">
          <div style="flex:1;">
            <div style="font-size:0.813rem;font-weight:700;">${c.name}</div>
            <div style="font-size:0.688rem;color:#999;margin-top:2px;">${c.cn}</div>
          </div>
          <div style="font-size:0.875rem;font-weight:700;">¥${c.price}.00</div>
          <button onclick="removeFromCart(${i})" style="width:28px;height:28px;border-radius:8px;background:#F4F4F6;border:none;color:#999;cursor:pointer;">×</button>
        </div>`;
    }).join('');
    document.getElementById('cartTotal').textContent = '¥' + total;
  }

  function checkout() {
    if (shopCart.length === 0) return;
    payItems = shopCart.slice();
    payFromCart = true;
    const total = shopCart.reduce((s,c) => s + c.price, 0);
    document.getElementById('payAmount').textContent = '¥' + total;
    document.getElementById('payTotal').textContent = '¥' + total;
    payMethod = 'normal';
    renderPayMethods(total);
    document.getElementById('cartView').style.display = 'none';
    document.getElementById('payView').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function closePay() {
    document.getElementById('payView').style.display = 'none';
    document.getElementById('cartView').style.display = 'block';
  }

  function doPay() {
    const total = payItems.reduce((s,c) => s + c.price, 0);
    var roleFamilyCard = getRoleCardFromMethod(payMethod);
    if (payMethod.indexOf('role_card:') === 0) {
      if (!roleFamilyCard || !canUseRoleCard(roleFamilyCard, total)) {
        showToast('这张亲属卡的额度不足或已停用');
        payMethod = 'normal';
        renderPayMethods(total);
        return;
      }
      var roleCardSpend = window.RoleFamilyCards.consume(
        roleFamilyCard.id, total, '商店 · ' + payItems.map(function (item) { return item.cn; }).join('、'), 'shop'
      );
      if (!roleCardSpend || !roleCardSpend.ok) {
        showToast(roleCardSpend && roleCardSpend.reason === 'storage' ? '亲属卡记录保存失败，请重试' : '亲属卡额度已变化，请重新选择支付方式');
        renderPayMethods(total);
        return;
      }
      roleFamilyCard = roleCardSpend.card;
    }
    const now = new Date();
    const timeStr = (now.getMonth()+1) + '月' + now.getDate() + '日';
    const itemsDesc = payItems.map(c => c.cn).join('、');

    // 记账：写 finance_records
    try {
      const list = JSON.parse(localStorage.getItem('finance_records') || '[]');
      payItems.forEach(c => {
        list.push({ amount: c.price, type: 'expense',
          category: payMethod === 'close_pay' ? '亲密付' : (payMethod.indexOf('role_card:') === 0 ? '亲属卡' : '购物'),
          note: (payMethod === 'close_pay'
            ? '亲密付给' + ((getClosePay()||{}).roleName||'TA') + ' · '
            : (roleFamilyCard ? roleFamilyCard.roleName + ' 亲属卡代付 · ' : '商店 · ')) + c.cn,
          time: timeStr });
      });
      localStorage.setItem('finance_records', JSON.stringify(list));
    } catch(e) {}

    // 亲密付：扣钱包余额 + 写钱包明细 + 更新额度 + 发聊天消息
    if (payMethod === 'close_pay') {
      try {
        var cp = getClosePay();
        if (cp) {
          // 扣钱包余额
          var wd = JSON.parse(localStorage.getItem('workData') || 'null') || { balance: 1000, history: [] };
          if (typeof wd.balance !== 'number') wd.balance = 1000;
          if (!Array.isArray(wd.history)) wd.history = [];
          wd.balance = Math.round((wd.balance - total) * 100) / 100;
          wd.history.unshift({ type: 'expense', category: 'close_pay',
            title: '亲密付 · ' + cp.roleName + ' · ' + itemsDesc,
            amount: total, time: Date.now() });
          localStorage.setItem('workData', JSON.stringify(wd));

          // 更新亲密付额度
          cp.used = Math.round(((Number(cp.used)||0) + total) * 100) / 100;
          if (!Array.isArray(cp.history)) cp.history = [];
          cp.history.push({ amount: total, note: '商店 · ' + itemsDesc, time: Date.now() });
          localStorage.setItem('close_pay', JSON.stringify(cp));

          // 给对方发一条聊天消息；支付状态独立保存，通知失败单独提示。
          if (cp.roleId) {
            var noticeSaved = appendChatHistoryMessage(cp.roleId, {
              role: 'user',
              type: 'text',
              text: '刚刚帮你付了 ¥' + total + '（' + itemsDesc + '），喜欢就好。',
              time: Date.now()
            });
            if (!noticeSaved) showToast('付款已完成，但聊天通知未保存，请稍后补发');
          }
        }
      } catch(e) {}
    }

    if (roleFamilyCard) {
      notifyRoleCardIssuer(roleFamilyCard,
        '我刚刚使用你给我的' + (roleFamilyCard.kind === 'intimate' ? '亲密付' : '亲属卡') +
        '在商店买了' + payItems.map(function (item) { return item.cn; }).join('、') +
        '，共 ¥' + total.toFixed(2) + '。本月已经使用 ¥' +
        window.RoleFamilyCards.usedThisMonth(roleFamilyCard).toFixed(2) + '。');
    }

    // 写入订单
    const orders = loadOrders();
    orders.push({ roleName: '我', roleBg: '#111', items: payItems.map(c=>({cn:c.cn,price:c.price})), total, ts: Date.now(), payMethod });
    saveOrders(orders);
    // 弹小票
    document.getElementById('rOrder').textContent = String(Math.floor(Math.random()*9000)+1000);
    document.getElementById('rBody').innerHTML =
      payItems.map(c => `
        <div class="r-row"><span class="name">${c.cn}</span><span>¥${c.price}</span></div>
      `).join('') +
      `<div class="r-divider"></div>
       <div class="r-row"><span>商品件数</span><span>${payItems.length} 件</span></div>
       <div class="r-row r-total"><span>合计</span><span>¥${total}.00</span></div>`;
    document.getElementById('rFoot').textContent =
      new Date().toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-') + ' · 谢谢惠顾';
    document.getElementById('doneItems').innerHTML = payItems.map(c =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:0.813rem;">
         <span>${c.cn}</span><span style="font-weight:600;">¥${c.price}</span>
       </div>`).join('');
    document.getElementById('payView').style.display = 'none';
    document.getElementById('receiptBox').classList.add('show');
  }

  function closeReceipt() {
    document.getElementById('receiptBox').classList.remove('show');
    // 仅购物车结算时清空真实购物车；“立即购买”不动购物车
    if (payFromCart) { shopCart = []; saveCart(shopCart); }
    payItems = [];
    document.getElementById('doneView').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function backHome() {
    document.getElementById('doneView').style.display = 'none';
    document.getElementById('cartView').style.display = 'none';
    document.getElementById('listView').classList.remove('hide');
    window.scrollTo(0, 0);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  }

  renderCats();
  renderProducts();
  renderHot();
  updateBadge();

  // 给指定角色发一条礼物消息（模拟 TA 送你东西）
  function sendGiftToRole(roleId, product) {
    if (!product) return false;
    var saved = appendChatHistoryMessage(roleId, {
      role: 'ai',
      type: 'gift',
      gift: { name: product.cn, price: product.price, status: '正在派送中' },
      time: Date.now()
    });
    if (!saved) showToast('礼物通知没有保存到聊天记录，请稍后重试');
    return saved;
  }
  window.sendGiftToRole = sendGiftToRole;
</script>
</body>
</html>
