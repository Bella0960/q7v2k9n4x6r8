<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F7F9" />
<title>记账</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background: #E8E8EC; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #F7F7F9;
    color: #111;
    min-height: 100vh;
    max-width: 390px;
    margin: 0 auto;
    padding-bottom: 90px;
    position: relative;
  }

  /* 顶部 */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 1px solid #ECECEF;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.938rem; font-weight: 600;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
  .hello { font-size: 0.75rem; color: #999; }
  .name { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; }
  .bell {
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 1px solid #ECECEF;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    position: relative;
  }
  .bell::after {
    content: ''; position: absolute; top: 9px; right: 10px;
    width: 6px; height: 6px; border-radius: 50%; background: #FF3B30;
  }

  /* 主体：左竖排按钮 + 右黑卡堆叠 */
  .main-row {
    display: flex;
    gap: 16px;
    padding: 0 20px;
    margin-bottom: 28px;
  }
  .side-actions {
    display: flex; flex-direction: column; gap: 20px;
    padding-top: 20px;
  }
  .side-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .side-circle {
    width: 48px; height: 48px; border-radius: 50%;
    background: #fff; border: 1px solid #ECECEF;
    display: flex; align-items: center; justify-content: center;
  }
  .side-label { font-size: 0.688rem; color: #666; }

  /* 银行卡堆叠：中间完整黑卡，上下各露一角 */
  .card-stack {
    flex: 1;
    position: relative;
    height: 200px;
  }
  .stack-peek {
    position: absolute;
    left: 12px; right: 12px;
    height: 130px;
    border-radius: 16px;
    background: #D8D8DE;
  }
  .stack-peek.top {
    top: 0;
    background: #E4E4E9;
  }
  .stack-peek.bottom {
    bottom: 0;
    background: #C8C8CE;
  }
  .card {
    position: absolute;
    left: 6px; right: 6px;
    top: 30px;
    height: 140px;
    background: #111;
    border-radius: 20px;
    padding: 22px 20px;
    color: #fff;
    z-index: 3;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    right: -24px; bottom: -24px;
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.08);
  }
  .card-amount {
    font-size: 1.625rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .card-bank { font-size: 0.813rem; font-weight: 600; }
  .card-no {
    font-size: 0.625rem; opacity: 0.5;
    letter-spacing: 0.1em; margin-top: 5px;
  }
  .card-logo { display: flex; }
  .card-logo .l1 {
    width: 18px; height: 18px; border-radius: 50%;
    background: #EB001B; opacity: 0.9;
  }
  .card-logo .l2 {
    width: 18px; height: 18px; border-radius: 50%;
    background: #F79E1B; opacity: 0.9;
    margin-left: -7px; mix-blend-mode: screen;
  }

  /* Recent Transactions */
  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px 12px;
  }
  .section-head h3 { font-size: 1.063rem; font-weight: 700; }
  .section-head .see { font-size: 0.75rem; color: #111; opacity: 0.4; }

  .record-list { padding: 0 20px; }
  .record-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid #F0F0F3;
  }
  .record-item:last-child { border-bottom: none; }
  .r-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: #F4F4F6;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .r-info { flex: 1; min-width: 0; }
  .r-name { font-size: 0.875rem; font-weight: 600; }
  .r-merchant { font-size: 0.72rem; color: #999; margin-top: 2px; }
  .r-right { text-align: right; }
  .r-amount { font-size: 0.875rem; font-weight: 700; }
  .r-date { font-size: 0.688rem; color: #ccc; margin-top: 2px; }
  .r-char-note { margin-top: 5px; font-size: 0.688rem; color: #aaa; line-height: 1.55; overflow-wrap: anywhere; }
  .r-char-note .cc-role { color: #888; font-weight: 600; margin-right: 4px; }
  .r-after-sales {
    margin-top: 6px; padding: 6px 8px; border-radius: 8px;
    background: #F4F4F6; color: #555; font-size: .656rem; line-height: 1.5;
  }
  .r-after-sales strong { color: #222; font-weight: 650; }
  .r-after-sales-id { color: #999; margin-left: 4px; font-variant-numeric: tabular-nums; }


  .empty {
    text-align: center; padding: 40px 20px; color: #999; font-size: 0.875rem;
  }

  /* 底部 dock */
  .dock {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; max-width: 100%;
    background: #111;
    border-radius: 24px 24px 0 0;
    padding: 14px 20px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100;
  }
  .dock-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; color: #fff;
  }
  .dock-item.active { opacity: 1; }
  .dock-item:not(.active) { opacity: 0.6; }
  .dock-label { font-size: 0.625rem; }
  .dock-add {
    width: 44px; height: 44px; border-radius: 50%;
    background: #fff; color: #111;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; cursor: pointer;
    margin-top: -20px;
  }

  /* 记账弹窗 */
  .modal-backdrop {
    position: fixed; top: 0; bottom: 0;
    left: 50%; transform: translateX(-50%);
    width: 390px; max-width: 100%;
    background: rgba(0,0,0,0.3);
    display: none; align-items: flex-end;
    z-index: 200;
  }
  .modal-backdrop.show { display: flex; }
  .modal-sheet {
    background: #fff; width: 100%;
    border-radius: 24px 24px 0 0;
    padding: 20px 20px 40px;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }
  .sheet-handle {
    width: 36px; height: 4px; background: #E5E5EA;
    border-radius: 2px; margin: 0 auto 18px;
  }
  .sheet-title { font-size: 1.063rem; font-weight: 700; margin-bottom: 16px; text-align: center; }
  .amount-input {
    width: 100%; font-size: 2rem; font-weight: 700; text-align: center;
    border: none; border-bottom: 2px solid #ECECEF;
    padding: 10px; margin-bottom: 16px; outline: none; color: #111;
  }
  .cat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
  .cat-chip { padding: 10px 4px; text-align: center; font-size: 0.75rem; border-radius: 12px; background: #F4F4F6; cursor: pointer; }
  .cat-chip.active { background: #111; color: #fff; }
  .sheet-input {
    width: 100%; padding: 12px; border: 1px solid #ECECEF; border-radius: 12px;
    font-size: 0.875rem; margin-bottom: 16px; outline: none;
  }
  .sheet-btns { display: flex; gap: 10px; }
  .sheet-btn { flex: 1; padding: 14px; border-radius: 14px; border: none; font-size: 0.938rem; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #F4F4F6; color: #666; }
  .btn-confirm { background: #111; color: #fff; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .type-chip { flex: 1; padding: 8px; text-align: center; font-size: 0.813rem; border-radius: 10px; background: #F4F4F6; cursor: pointer; }
  .type-chip.active { background: #111; color: #fff; }

  .toast {
    position: fixed; bottom: 120px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111; color: #fff;
    padding: 10px 18px; border-radius: 20px; font-size: 0.813rem;
    opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='../index.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="avatar" id="financeUserAvatar">我</div>
      <div>
        <div class="hello">Hello,</div>
        <div class="name">我的账本</div>
      </div>
    </div>
    <div class="bell" id="bellBtn" title="Char 偷看开关">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
  </div>

  <div class="main-row">
    <div class="side-actions">
      <div class="side-btn" onclick="openSheet('expense')">
        <div class="side-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </div>
        <div class="side-label">支出</div>
      </div>
      <div class="side-btn" onclick="openSheet('income')">
        <div class="side-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </div>
        <div class="side-label">收入</div>
      </div>
      <div class="side-btn" onclick="openSheet('expense')">
        <div class="side-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v4"/></svg>
        </div>
        <div class="side-label">账单</div>
      </div>
    </div>

    <div class="card-stack">
      <div class="stack-peek top"></div>
      <div class="stack-peek bottom"></div>
      <div class="card">
        <div class="card-amount" id="balanceNum">¥0.00</div>
        <div class="card-bottom">
          <div>
            <div class="card-bank">日常账户</div>
            <div class="card-no">5292 •••• •••• 3123</div>
          </div>
          <div class="card-logo"><div class="l1"></div><div class="l2"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="section-head">
    <h3>Recent Transactions</h3>
    <span class="see" id="peekStatus">See all</span>
  </div>
  <div class="record-list" id="recordList"></div>

  <!-- 记账弹窗 -->
  <div class="modal-backdrop" id="sheet">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">记一笔</div>
      <div class="type-toggle">
        <div class="type-chip active" data-type="expense" onclick="setType('expense')">支出</div>
        <div class="type-chip" data-type="income" onclick="setType('income')">收入</div>
      </div>
      <input class="amount-input" id="amountInput" type="number" placeholder="0.00" step="0.01" />
      <div class="cat-grid" id="catGrid"></div>
      <input class="sheet-input" id="noteInput" type="text" placeholder="备注（可选）" maxlength="30" />
      <div class="sheet-btns">
        <button class="sheet-btn btn-cancel" onclick="closeSheet()">取消</button>
        <button class="sheet-btn btn-confirm" onclick="saveRecord()">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const CATS = ['餐饮','交通','购物','住房','娱乐','工资','医疗','其他'];
  const CAT_ICONS = {
    '餐饮': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><path d="M6 1v7M10 1v7"/></svg>',
    '交通': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16M8 19v2M16 19v2"/></svg>',
    '购物': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>',
    '住房': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    '娱乐': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>',
    '工资': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>',
    '医疗': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
    '其他': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="12" cy="12" r="1"/></svg>',
  };

  let currentType = 'expense';
  let currentCat = '餐饮';

  function readFinanceRecordsState() {
    var raw;
    try { raw = localStorage.getItem('finance_records'); }
    catch (error) { return { ok: false, reason: 'storage', value: null }; }
    if (raw == null) return { ok: true, reason: '', value: [] };

    var list;
    try { list = JSON.parse(raw); }
    catch (error) { return { ok: false, reason: 'invalid', value: null }; }
    if (!Array.isArray(list)) return { ok: false, reason: 'invalid', value: null };

    for (var i = 0; i < list.length; i++) {
      var row = list[i];
      if (!row || typeof row !== 'object' || Array.isArray(row)) {
        return { ok: false, reason: 'invalid', value: null };
      }
      if (!Object.prototype.hasOwnProperty.call(row, 'amount') ||
          row.amount == null || row.amount === '' ||
          !isFinite(Number(row.amount)) || Number(row.amount) < 0) {
        return { ok: false, reason: 'invalid', value: null };
      }
      if (Object.prototype.hasOwnProperty.call(row, 'type') && typeof row.type !== 'string') {
        return { ok: false, reason: 'invalid', value: null };
      }
    }
    return { ok: true, reason: '', value: list };
  }

  function loadRecords() {
    var state = readFinanceRecordsState();
    if (!state.ok) return null;
    var list = state.value;
    // 给旧记录补稳定 id（按数组下标+时间+分类生成，保证多次 load 一致）
    list.forEach(function(r, i) {
      if (!r.id) r.id = 'f_legacy_' + i + '_' + (r.time || '') + '_' + (r.category || '');
      if (r.amount != null) r.amount = Number(r.amount);
    });
    return list;
  }

  async function mutateFinanceRecords(mutator) {
    var ledger = window.MaoMaoWalletLedger;
    if (!ledger || typeof ledger.runExclusive !== 'function') {
      return { ok: false, reason: 'module' };
    }
    // Manual entries and AI comments share the same finance rows as checkout.
    // A page-local queue can lose those rows when a second tab is open.
    if (typeof ledger.supportsCrossTabLock !== 'function' ||
        !ledger.supportsCrossTabLock()) {
      return { ok: false, reason: 'cross-tab-lock-unavailable' };
    }
    try {
      return await ledger.runExclusive(function () {
        // Always re-read under the same wallet lock used by checkouts and receipts.
        var state = readFinanceRecordsState();
        if (!state.ok) return { ok: false, reason: state.reason || 'invalid' };
        var list = state.value;
        // Preserve the same deterministic IDs used by loadRecords() for legacy rows
        // so an AI annotation can still locate a pre-ID transaction after re-reading.
        list.forEach(function (row, index) {
          if (!row.id) row.id = 'f_legacy_' + index + '_' + (row.time || '') + '_' + (row.category || '');
        });
        var result = typeof mutator === 'function' ? mutator(list) : null;
        if (result && result.abort) return { ok: false, reason: result.abort };

        var serialized = JSON.stringify(list);
        localStorage.setItem('finance_records', serialized);
        if (localStorage.getItem('finance_records') !== serialized) {
          return { ok: false, reason: 'storage' };
        }
        var verified = readFinanceRecordsState();
        if (!verified.ok || JSON.stringify(verified.value) !== serialized) {
          return { ok: false, reason: 'storage' };
        }
        return { ok: true, records: verified.value, result: result };
      }, {
        onFallback: function () {
          showToast('当前浏览器不支持跨页面账本锁，请避免同时修改账本和提交订单');
        }
      });
    } catch (error) {
      console.warn('[finance] 财务记录保存失败', error);
      return { ok: false, reason: 'storage' };
    }
  }

  function financeMutationError(reason) {
    if (reason === 'invalid') return '账本数据异常，已暂停写入；原始记录未被修改';
    if (reason === 'storage') return '账本保存失败，请检查手机存储空间';
    if (reason === 'module') return '钱包保护模块未加载，请刷新页面后重试';
    if (reason === 'cross-tab-lock-unavailable') return '当前浏览器不支持跨页面钱包锁，记账与 AI 批注已暂停，未修改账目';
    return '账本暂不可用，请恢复原始记录后重试';
  }

  function escapeFinanceText(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }

  function renderAfterSalesNote(record) {
    if (!record || !record.afterSalesRequestId) return '';
    var requestId = String(record.afterSalesRequestId);
    var shortId = escapeFinanceText(requestId.slice(-6));
    var channelLabel = record.afterSalesChannel === 'takeout' ? '外卖' :
      (record.afterSalesChannel === 'shop' ? '商店' : '订单');
    var typeLabel = record.afterSalesType === 'cancel' ? '取消申请' : '售后申请';
    if (record.afterSalesStatus === 'pending_review') {
      return '<div class="r-after-sales"><strong>' + channelLabel + typeLabel +
        ' · 待处理</strong><span class="r-after-sales-id">编号 ' + shortId +
        '</span><div>仍按原支出记账；申请处理前不会自动退款或改动余额。</div></div>';
    }
    return '<div class="r-after-sales"><strong>' + channelLabel +
      '售后记录待核对</strong><span class="r-after-sales-id">编号 ' + shortId +
      '</span></div>';
  }

  function render() {
    const list = loadRecords();
    const sideActions = document.querySelector('.side-actions');
    const box = document.getElementById('recordList');
    if (!list) {
      document.getElementById('balanceNum').textContent = '—';
      const ps = document.getElementById('peekStatus');
      if (ps) ps.textContent = '账本数据异常';
      if (sideActions) {
        sideActions.style.pointerEvents = 'none';
        sideActions.style.opacity = '.45';
      }
      box.innerHTML = '<div class="empty">账本数据异常，已暂停新增和批注。原始财务记录未被覆盖，请先恢复本地数据。</div>';
      return;
    }
    if (sideActions) {
      sideActions.style.pointerEvents = '';
      sideActions.style.opacity = '';
    }
    let balance = 0;
    list.forEach(r => { balance += r.type === 'income' ? r.amount : -r.amount; });
    document.getElementById('balanceNum').textContent = '¥' + balance.toFixed(2);

    const ps = document.getElementById('peekStatus');
    if (ps) {
      const ccCount = list.reduce((n, r) => n + (Array.isArray(r.charComments) ? r.charComments.length : 0), 0);
      ps.textContent = 'Char偷看' + (peekEnabled() ? '开' : '关') + ' · ' + ccCount + '条';
    }

    if (list.length === 0) {
      box.innerHTML = '<div class="empty">还没有记录，点底部 + 记一笔</div>';
      return;
    }
    box.innerHTML = list.slice().reverse().slice(0, 20).map(r => {
      const ccList = Array.isArray(r.charComments) ? r.charComments : [];
      const ccLast = ccList[ccList.length - 1];
      const ccHtml = ccLast ? `<div class="r-char-note"><span class="cc-role">${ccLast.characterName || 'TA'}</span>${String(ccLast.text || '').slice(0, 44)}</div>` : '';
      const afterSalesHtml = renderAfterSalesNote(r);
      return `
      <div class="record-item">
        <div class="r-icon">${CAT_ICONS[r.category] || CAT_ICONS['其他']}</div>
        <div class="r-info">
          <div class="r-name">${r.category}</div>
          <div class="r-merchant">${r.note || '—'}</div>
          ${ccHtml}
          ${afterSalesHtml}
        </div>
        <div class="r-right">
          <div class="r-amount">${r.type === 'income' ? '+' : '-'}¥${r.amount.toFixed(2)}</div>
          <div class="r-date">${r.time}</div>
        </div>
      </div>`;
    }).join('');
  }

  function renderCats() {
    document.getElementById('catGrid').innerHTML = CATS.map(c =>
      `<div class="cat-chip ${c === currentCat ? 'active' : ''}" onclick="pickCat('${c}')">${c}</div>`
    ).join('');
  }
  function pickCat(c) { currentCat = c; renderCats(); }
  function setType(t) {
    currentType = t;
    document.querySelectorAll('.type-chip').forEach(el =>
      el.classList.toggle('active', el.dataset.type === t));
  }
  function openSheet(type) {
    if (loadRecords() === null) {
      showToast('账本数据异常，已暂停记账；原始记录未被修改');
      return;
    }
    currentType = type; setType(type); renderCats();
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('sheet').classList.add('show');
  }
  function closeSheet() { document.getElementById('sheet').classList.remove('show'); }

  async function saveRecord() {
    const amt = parseFloat(document.getElementById('amountInput').value);
    if (!amt || amt <= 0) { showToast('请输入金额'); return; }
    const note = document.getElementById('noteInput').value.trim();
    const now = new Date();
    const time = (now.getMonth()+1) + '月' + now.getDate() + '日';
    const record = {
      id: 'f_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6),
      amount: amt, type: currentType, category: currentCat, note, time, ts: now.getTime()
    };
    const outcome = await mutateFinanceRecords(function (list) {
      list.push(record);
      return { id: record.id };
    });
    if (!outcome.ok) {
      showToast(financeMutationError(outcome.reason));
      return;
    }
    closeSheet(); render(); showToast('已记录');
    setTimeout(maybeAutoPeek, 800);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  }

  // ===== Char 自动偷看账单（反向手机·便签涂鸦）=====
  let peekBusy = false;
  function peekEnabled() {
    try { return localStorage.getItem('char_peek_enabled') !== '0'; } catch(e) { return true; }
  }
  function peekCurrentRole() {
    let roles = [];
    try { roles = window.PhoneStorage ? PhoneStorage.getCharacters() : []; } catch(e) {}
    if (!roles || !roles.length) return null;
    let cid = null;
    try { cid = window.PhoneStorage && PhoneStorage.getCurrentContactId ? PhoneStorage.getCurrentContactId() : null; } catch(e) {}
    if (cid) {
      const hit = roles.find(r => String(r.id) === String(cid));
      if (hit) return hit;
    }
    return roles[0];
  }
  function maybeAutoPeek() {
    if (peekBusy || !peekEnabled()) return;
    if (!window.PhoneAPI || typeof PhoneAPI.complete !== 'function') return;
    const role = peekCurrentRole();
    if (!role) return;
    const list = loadRecords();
    if (!list) return;
    // 找最近一条：有 id、还没被当前角色批注过
    const target = list.slice().reverse().find(r => {
      if (!r.id) return false;
      const cs = Array.isArray(r.charComments) ? r.charComments : [];
      return !cs.some(c => String(c.characterId) === String(role.id));
    });
    if (!target) return;
    peekBusy = true;
    const setting = [role.persona, role.description, role.systemPrompt, role.prompt, role.characterPrompt, role.background, role.setting].filter(v => typeof v === 'string' && v.trim()).join('\n').slice(0, 2000);
    const kind = target.type === 'income' ? '收入' : '支出';
    const system = '你在偷看用户的手机账本。用角色「' + role.name + '」的身份，像在账单旁边随手写一句涂鸦批注。要求：20-50字，语气自然符合人设；支出可以吐槽乱花钱、心疼她省吃俭用、催她好好吃饭；收入可以开心、鼓励。不要加引号或标题，不要复述金额，直接写批注。\n角色设定：' + (setting || '根据角色名字自然回应。');
    const user = '用户一笔账单：\n' + kind + ' ¥' + Number(target.amount).toFixed(2) + '\n分类：' + (target.category || '其他') + '\n备注：' + (target.note || '（无）');
    PhoneAPI.complete({ system: system, user: user, temperature: 0.85, timeoutMs: 20000 }).then(async function(text) {
      text = String(text || '').trim().replace(/^["「『]+|["」』]+$/g, '').slice(0, 120);
      if (!text) return;
      const outcome = await mutateFinanceRecords(function (all) {
        const live = all.find(r => r.id === target.id);
        if (!live) return { abort: 'missing' };
        if (!Array.isArray(live.charComments)) live.charComments = [];
        live.charComments.push({
          id: 'peek_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6),
          characterId: role.id, characterName: role.name, text: text,
          createdAt: new Date().toISOString(), auto: true
        });
        return { id: live.id };
      });
      if (!outcome.ok) {
        if (outcome.reason !== 'missing') showToast(financeMutationError(outcome.reason));
        return;
      }
      render();
      console.log('[Char Peek] 已在账单旁涂鸦:', text);
    }).catch(function(err) {
      console.warn('[Char Peek] 账单偷看失败:', err && err.message ? err.message : err);
      if (err && /API Key|未配置|api/i.test(String(err && err.message || ''))) showToast('Char 偷看失败：还没配 AI API Key，去设置配一下');
    }).then(function() { peekBusy = false; });
  }

  document.getElementById('bellBtn').addEventListener('click', function() {
    var willOn = !peekEnabled();
    try { localStorage.setItem('char_peek_enabled', willOn ? '1' : '0'); } catch(e) {}
    showToast(willOn ? '已开启 Char 偷看' : '已关闭 Char 偷看');
    render();
    if (willOn) setTimeout(maybeAutoPeek, 600);
  });

  render();
  setTimeout(maybeAutoPeek, 1800);
</script>
<script>
(function () {
  var avatarEl = document.getElementById('financeUserAvatar');
  if (!avatarEl) return;
  try {
    var profile = window.PhoneStorage && typeof PhoneStorage.getMyProfile === 'function'
      ? PhoneStorage.getMyProfile() : {};
    var src = profile && typeof profile.avatar === 'string' ? profile.avatar : '';
    if (src && /^(?:data:image\/(?:png|jpe?g|gif|webp|bmp|svg\+xml|avif);|https?:\/\/|blob:|\.|\/)/i.test(src)) {
      var image = document.createElement('img');
      image.src = src;
      image.alt = '';
      avatarEl.replaceChildren(image);
    }
  } catch (e) {}
})();
</script>
</body>
