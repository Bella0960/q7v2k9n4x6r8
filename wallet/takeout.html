<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F7F9" />
<title>外卖 · 小手机</title>
<script src="../shared/js/native-feel.js"></script>
<script src="../shared/js/phone/phone_storage.js"></script>
<script src="../shared/js/phone/role_family_cards.js?v=20261107v3"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  html { background: #E8E8EC; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #F7F7F9; color: #111;
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 90px; position: relative;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .order-after-sales {
    background:#fff; border:1px solid #ECECEF; border-radius:14px;
    padding:14px; margin:12px 0 16px;
  }
  .order-after-sales-title { font-size:.813rem; font-weight:700; }
  .order-after-sales-note { margin-top:7px; color:#888; font-size:.688rem; line-height:1.6; }
  .order-after-sales-select {
    width:100%; height:40px; margin-top:10px; padding:0 10px;
    border:1px solid #E5E5EA; border-radius:9px; background:#F7F7F9;
    color:#333; font-size:.75rem;
  }
  .order-after-sales-button {
    width:100%; height:40px; margin-top:10px; border:0;
    border-radius:10px; background:#111; color:#fff;
    font-size:.813rem; font-weight:600; cursor:pointer;
  }
  .order-card { background:#fff; border:1px solid #ECECEF; border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; }
  .order-card-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .order-card-shop { font-size:.875rem; font-weight:700; min-width:0; }
  .order-card-status { flex-shrink:0; font-size:.688rem; color:#555; border:1px solid #D8D8DD; border-radius:12px; padding:3px 9px; }
  .order-card-meta { font-size:.688rem; color:#999; margin-top:7px; line-height:1.5; }
  .order-card-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:.813rem; }
  .order-timeline { background:#fff; border:1px solid #ECECEF; border-radius:14px; padding:16px; margin-bottom:12px; }
  .order-timeline-row { display:flex; gap:12px; position:relative; padding-bottom:17px; }
  .order-timeline-row:last-child { padding-bottom:0; }
  .order-timeline-row::before { content:''; position:absolute; left:4px; top:12px; bottom:0; width:1px; background:#ECECEF; }
  .order-timeline-row:last-child::before { display:none; }
  .order-timeline-row.done::before { background:#111; }
  .order-timeline-dot { width:9px; height:9px; border-radius:50%; background:#DDD; flex-shrink:0; margin-top:3px; z-index:1; }
  .order-timeline-row.done .order-timeline-dot,.order-timeline-row.now .order-timeline-dot { background:#111; }
  .order-timeline-copy { flex:1; min-width:0; }
  .order-timeline-label { font-size:.813rem; font-weight:600; }
  .order-timeline-desc,.order-timeline-time { font-size:.688rem; color:#999; margin-top:3px; }
  .order-detail-card { background:#fff; border:1px solid #ECECEF; border-radius:14px; padding:15px; margin-bottom:12px; }
  .order-detail-line { display:flex; justify-content:space-between; gap:12px; padding:8px 0; font-size:.813rem; border-bottom:1px solid #F2F2F4; }
  .order-detail-line:last-child { border-bottom:0; }

  .back-btn {
    width: 36px; height: 36px; border: 0; background: transparent;
    border-bottom: 1px solid #bdbdbd; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .back-btn:active { transform: translateY(1px); border-color: #171717; }
  .back-btn svg { width: 16px; height: 16px; stroke: #333; fill: none; stroke-width: 1.5; }
  .brand-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
  .brand-title small { display: block; font-size: 0.7rem; font-weight: 600; opacity: 0.5; letter-spacing: 0.05em; }
  .cart-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 1px solid #ECECEF;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    position: relative;
  }
  .cart-icon svg { width: 18px; height: 18px; stroke: #333; fill: none; stroke-width: 1.5; }
  .cart-badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: #FF3B30; color: #fff; border-radius: 9px;
    font-size: 0.625rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-badge:empty, .cart-badge[data-zero="1"] { display: none; }

  .search-box {
    margin: 0 20px 16px;
    background: #fff; border: 1px solid #ECECEF;
    border-radius: 14px; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    color: #999; font-size: 0.875rem;
  }
  .search-box svg { width: 16px; height: 16px; stroke: #999; fill: none; stroke-width: 1.5; }

  .cats {
    display: flex; gap: 18px;
    padding: 0 20px 16px;
    overflow-x: auto;
  }
  .cat-tab {
    flex-shrink: 0; font-size: 0.813rem; font-weight: 700;
    color: #ccc; cursor: pointer; padding-bottom: 4px;
  }
  .cat-tab.active { color: #111; border-bottom: 2px solid #111; }

  /* 餐厅卡片 */
  .shop-list { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .shop-card {
    background: #fff; border-radius: 16px; padding: 14px;
    display: flex; gap: 12px; cursor: pointer;
    border: 1px solid #ECECEF;
  }
  .shop-logo {
    width: 68px; height: 68px; border-radius: 12px;
    background: #F4F4F6; flex-shrink: 0; overflow: hidden;
  }
  .shop-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shop-info { flex: 1; min-width: 0; }
  .shop-name { font-size: 0.938rem; font-weight: 700; }
  .shop-meta {
    display: flex; gap: 10px; margin-top: 6px;
    font-size: 0.688rem; color: #888;
  }
  .shop-meta .rating { color: #FF9500; font-weight: 700; }
  .shop-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .shop-tag {
    font-size: 0.6rem; color: #666;
    background: #F2F2F7; padding: 2px 6px; border-radius: 4px;
  }
  .shop-delivery {
    font-size: 0.688rem; color: #999; margin-top: 6px;
  }

  /* 菜品页 */
  .dish-list { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .dish-card {
    background: #fff; border-radius: 14px; padding: 12px;
    display: flex; gap: 12px; border: 1px solid #ECECEF;
  }
  .dish-img {
    width: 72px; height: 72px; border-radius: 10px;
    background: #F4F4F6; flex-shrink: 0; overflow: hidden;
  }
  .dish-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dish-info { flex: 1; display: flex; flex-direction: column; }
  .dish-name { font-size: 0.875rem; font-weight: 700; }
  .dish-desc { font-size: 0.688rem; color: #999; margin-top: 3px; line-height: 1.4; }
  .dish-bottom {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
  }
  .dish-price { font-size: 0.938rem; font-weight: 700; }
  .dish-price small { font-size: 0.688rem; color: #999; font-weight: 400; }
  .add-btn {
    width: 26px; height: 26px; border-radius: 50%;
    background: #111; color: #fff; border: none;
    font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn:active { transform: scale(0.9); }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid #ddd; background: #fff;
    font-size: 0.875rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-num { font-size: 0.813rem; font-weight: 600; min-width: 16px; text-align: center; }

  /* 底部购物车条 */
  .cart-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    background: #111; color: #fff;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; z-index: 50;
  }
  .cart-bar-info { font-size: 0.875rem; }
  .cart-bar-info small { display: block; font-size: 0.625rem; opacity: 0.6; }
  .cart-bar-btn {
    background: #fff; color: #111; border: none;
    padding: 10px 22px; border-radius: 20px;
    font-size: 0.875rem; font-weight: 700; cursor: pointer;
  }
  .cart-bar-btn:disabled { opacity: 0.4; }

  /* 弹层 */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; z-index: 100;
  }
  .overlay.open { display: block; }
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #fff; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 70vh; overflow-y: auto;
  }
  .sheet-title {
    font-size: 1rem; font-weight: 700; text-align: center;
    margin-bottom: 16px; letter-spacing: 1px;
  }
  .sheet-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; font-size: 1.2rem;
    color: #999; cursor: pointer;
  }
  .cart-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #F2F2F7;
  }
  .cart-row:last-child { border-bottom: none; }
  .cart-row-name { font-size: 0.875rem; }
  .cart-row-price { font-size: 0.875rem; font-weight: 600; }
  .cart-row-meta { margin-top: 3px; font-size: 0.688rem; color: #999; }
  .cart-clear-btn {
    width: 100%; height: 40px; margin-top: 14px; border: 1px solid #E5E5EA;
    border-radius: 12px; background: #F7F7F9; color: #666;
    font-size: 0.813rem; cursor: pointer;
  }

  /* 支付方式 */
  .pay-method {
    padding: 14px; border-radius: 14px; margin-bottom: 10px;
    border: 1.5px solid #E5E5EA; background: #fff;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .pay-method.active { border-color: #111; }
  .pay-method-radio {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1.5px solid #E5E5EA;
    display: flex; align-items: center; justify-content: center;
  }
  .pay-method.active .pay-method-radio { border-color: #111; }
  .pay-method.active .pay-method-radio::after {
    content: ''; width: 10px; height: 10px; border-radius: 50%; background: #111;
  }
  .pay-method-name { font-size: 0.875rem; font-weight: 600; }
  .pay-method-sub { font-size: 0.688rem; color: #999; margin-top: 3px; }

  .primary-btn {
    width: 100%; height: 46px; border: none; border-radius: 14px;
    background: #111; color: #fff; font-size: 0.938rem; font-weight: 600;
    cursor: pointer; margin-top: 12px;
  }
  .primary-btn:active { opacity: 0.85; }

  /* 转发给TA */
  .forward-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 12px; cursor: pointer;
  }
  .forward-row:active { background: #F2F2F7; }
  .forward-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #E9E9EB; color: #888;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .forward-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .forward-name { font-size: 0.938rem; }

  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #111; color: #fff;
    padding: 10px 18px; border-radius: 20px;
    font-size: 0.813rem; opacity: 0;
    transition: all .25s ease; z-index: 200; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .view { display: none; }
  .view.active { display: block; }
</style>
</head>

<!-- 外卖订单中心 -->
<div class="view" id="viewOrders">
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="closeTakeoutOrders()">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>

      <div class="brand-title">我的订单<small>ORDERS</small></div>
    </div>
    <div style="width:36px;"></div>
  </div>
  <div id="takeoutOrdersList" style="padding:0 20px 24px;"></div>
</div>

<div class="view" id="viewOrderDetail">
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="closeTakeoutOrderDetail()">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand-title">订单详情<small>ORDER DETAIL</small></div>
    </div>
    <div style="width:36px;"></div>
  </div>
  <div id="takeoutOrderDetailBody" style="padding:0 20px 24px;"></div>
</div>

<!-- 底部购物车条 -->
<div class="cart-bar" id="cartBar" style="display:none;">
  <div class="cart-bar-info">
    <small id="cartBarCount">0 件</small>
    <span id="cartBarTotal">¥0</span>
  </div>
  <button class="cart-bar-btn" id="checkoutBtn" onclick="openCheckout()">去结算</button>
</div>

<!-- 购物车弹层 -->
<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="closeCart()">×</button>
    <div class="sheet-title">购物车</div>
    <div id="cartItems"></div>
  </div>
</div>

<!-- 结算弹层 -->
<div class="overlay" id="checkoutOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="closeCheckout()">×</button>
    <div class="sheet-title">确认订单</div>
    <div id="checkoutItems"></div>
    <div style="margin-top:16px;" id="payMethods"></div>
    <button class="primary-btn" onclick="doPay()">提交订单</button>
    <button class="primary-btn" style="background:#F2F2F7;color:#111;margin-top:8px;" onclick="openForward()">转发给TA</button>
  </div>
</div>

<!-- 转发给TA弹层 -->
<div class="overlay" id="forwardOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="closeForward()">×</button>
    <div class="sheet-title">转发给谁？</div>
    <div id="forwardList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  function loadCart() {
    try {
      var stored = JSON.parse(localStorage.getItem('takeout_cart') || '{}');
      cart = stored && typeof stored === 'object' && !Array.isArray(stored) ? stored : {};
    } catch(e) { cart = {}; }
    cartShopId = localStorage.getItem('takeout_cart_shop_id') || '';
    var ownerIds = [];
    Object.keys(cart).forEach(function (key) {
      var entry = cart[key];
      var qty = Math.floor(Number(entry && entry.qty) || 0);
      var dishId = entry && entry.dish && entry.dish.id ? entry.dish.id : key;
      var owner = SHOPS.find(function (shop) {
        return shop.dishes.some(function (dish) { return dish.id === dishId; });
      });
      if (!owner || qty <= 0) { delete cart[key]; return; }
      var canonicalDish = owner.dishes.find(function (dish) { return dish.id === dishId; });
      cart[key] = { dish: canonicalDish, qty: qty };
      if (ownerIds.indexOf(owner.id) === -1) ownerIds.push(owner.id);
    });
    if (ownerIds.length > 1) cartShopId = 'mixed';

      cartShopId = cartShopId && cartShopId !== ownerIds[0] ? 'mixed' : ownerIds[0];

  const TAKEOUT_ORDER_STATUS_LABELS = {

        for (var itemIndex = 0; itemIndex < row.items.length; itemIndex++) {

  function takeoutOrderStages(order) {
    var found = String(order.delivery || '').match(/\d+/);
    var parsed = parseInt(found ? found[0] : '30', 10);
    var etaMinutes = Math.max(5, Math.min(180, isFinite(parsed) ? parsed : 30));
    var duration = etaMinutes * 60000;
    return [
      { status:'placed', label:'已下单', desc:'订单已提交，等待餐厅确认', offset:0 },
      { status:'accepted', label:'商家已接单', desc:'餐厅开始处理订单', offset:Math.round(duration * 0.08) },
      { status:'preparing', label:'备餐中', desc:'餐品正在制作', offset:Math.round(duration * 0.25) },
      { status:'picked_up', label:'骑手已取餐', desc:'骑手已取餐，准备出发', offset:Math.round(duration * 0.52) },
      { status:'delivering', label:'配送中', desc:'餐品正在送往收货地址', offset:Math.round(duration * 0.78) },
      { status:'delivered', label:'已送达', desc:'本次模拟配送已完成', offset:duration }
    ];
  }
  function advanceOrderLifecycle(order, stages, now) {
    if (!order || !Array.isArray(stages) || !stages.length) return null;
    var createdAt = Number(order.ts);
    if (!isFinite(createdAt) || createdAt <= 0) return null;
    if (Object.prototype.hasOwnProperty.call(order, 'statusHistory') &&
        !Array.isArray(order.statusHistory)) return null;
    var history = order.statusHistory || [];
    for (var hi = 0; hi < history.length; hi++) {
      var event = history[hi];
      if (!event || typeof event !== 'object' ||
          !stages.some(function (stage) { return stage.status === event.status; }) ||
          !isFinite(Number(event.time))) return null;
    }
    var targetIndex = -1;
    stages.forEach(function (stage, index) {
      if (Number(now) - createdAt >= stage.offset) targetIndex = index;
    });
    history.forEach(function (event) {
      var eventIndex = stages.findIndex(function (stage) { return stage.status === event.status; });
      if (eventIndex > targetIndex) targetIndex = eventIndex;
    });
    if (order.status != null) {
      var storedIndex = stages.findIndex(function (stage) { return stage.status === order.status; });
      if (storedIndex < 0) return null;
      if (storedIndex > targetIndex) targetIndex = storedIndex;
    }
    if (targetIndex < 0) targetIndex = 0;
    var changed = !Array.isArray(order.statusHistory);
    for (var si = 0; si <= targetIndex; si++) {
      var stage = stages[si];
      if (!history.some(function (event) { return event.status === stage.status; })) {
        history.push({ status:stage.status, label:stage.label, time:createdAt + stage.offset });
        changed = true;
      }
    }
    history.sort(function (a, b) { return Number(a.time) - Number(b.time); });
    var lastEvent = history.find(function (event) { return event.status === stages[targetIndex].status; });
    if (order.status !== stages[targetIndex].status) { order.status = stages[targetIndex].status; changed = true; }
    if (order.statusUpdatedAt !== Number(lastEvent.time)) { order.statusUpdatedAt = Number(lastEvent.time); changed = true; }
    if (!Array.isArray(order.statusHistory)) order.statusHistory = history;
    return changed;
  }
  function syncTakeoutOrders() {
    var rows = loadTakeoutOrders();
    if (!rows) return null;
    var changed = false;
    for (var i = 0; i < rows.length; i++) {
      var result = advanceOrderLifecycle(rows[i], takeoutOrderStages(rows[i]), Date.now());
      if (result === null) return null;
      if (result) changed = true;
    }
    if (changed && !saveTakeoutOrders(rows)) return null;
    return rows;
  }

      '<div class="order-after-sales-note">申请会关联原支付流水并进入待处理状态；不会自动退款、修改钱包余额或直接取消模拟配送。</div></div>';

  async function submitTakeoutAfterSales() {
    var journal = window.MaoMaoOrderAfterSales;
    if (!journal || typeof journal.submit !== 'function') {
      toast('售后模块尚未加载，请刷新页面后重试');
      return;
    }
    var rows = syncTakeoutOrders();
    if (!rows) { toast('订单数据无法读取，未提交售后申请'); return; }
    var order = rows.find(function (row) { return row && row.paymentId === currentTakeoutOrderPaymentId; });
    if (!order) { toast('找不到原订单，未提交售后申请'); return; }
    var stages = takeoutOrderStages(order);
    var stageIndex = stages.findIndex(function (stage) { return stage.status === order.status; });
    var type = order.afterSales ? order.afterSales.type : (stageIndex <= 1 ? 'cancel' : 'after_sales');
    var reasonEl = document.getElementById('takeoutAfterSalesReason');
    var reason = order.afterSales ? order.afterSales.reason : (reasonEl ? reasonEl.value : '');
    var result = await journal.submit({
      channel: 'takeout',
      ordersKey: 'takeout_orders',
      financeKey: 'finance_records',
      paymentId: order.paymentId,
      amount: Number(order.total),
      paymentMethod: String(order.payMethod || ''),
      type: type,
      reason: reason
    });
    if (!result.ok) {
      var messages = {
        'payment-lines-missing': '找不到这笔订单的原支出明细，已停止申请',
        'payment-amount-mismatch': '原订单金额与支出明细不一致，已停止申请',
        'another-request-linked': '这笔支付流水已关联其他售后申请',
        'order-payment-conflict': '订单支付信息与原流水不一致，已停止申请',
        'finance-invalid': '财务记录异常，已停止申请',
        'finance-missing': '找不到财务记录，已停止申请',
        'request-conflict': '已有售后申请与当前信息冲突',
        'cross-tab-lock-unavailable': '当前浏览器不支持安全的跨页面钱包锁，已暂停售后申请，未修改账目'
      };
      toast(messages[result.reason] || '申请暂未同步成功，可再次点击恢复');
    } else {
      toast(result.replayed ? '原售后申请已存在' : '申请已关联原支付流水，等待处理');
    }
    var updatedRows = syncTakeoutOrders();
    if (updatedRows) openTakeoutOrderDetail(currentTakeoutOrderPaymentId);
  }

      '支付方式：' + escapeFamilyCardText(order.payMethod === 'normal' ? '日常账户' : (order.payMethod === 'close_pay' ? '亲密付' : '角色赠予额度')) + '<br>' +
      '下单时间：' + new Date(order.ts).toLocaleString('zh-CN') + '</div>' +

    var list = currentCat === 'all' ? SHOPS : SHOPS.filter(s => s.cat === currentCat);
    document.getElementById('shopList').innerHTML = list.map(s =>
      '<div class="shop-card" onclick="openShop(\'' + s.id + '\')">' +
        '<div class="shop-logo"><img src="' + s.img + '" alt="' + s.name + '" loading="lazy"></div>' +
        '<div class="shop-info">' +
          '<div class="shop-name">' + s.name + '</div>' +
          '<div class="shop-meta">' +
            '<span class="rating">' + s.rating + '分</span>' +
            '<span>' + s.sales + '</span>' +
          '</div>' +
          '<div class="shop-tags">' + s.tags.map(t => '<span class="shop-tag">' + t + '</span>').join('') + '</div>' +
          '<div class="shop-delivery">' + s.delivery + ' · ' + s.fee + '</div>' +
        '</div>' +
      '</div>'
    ).join('');
  }

  // ===== 进入餐厅 =====
  function openShop(id) {
    currentShop = SHOPS.find(s => s.id === id);
    if (!currentShop) return;
    document.getElementById('shopTitle').textContent = currentShop.name;
    document.getElementById('viewShops').classList.remove('active');
    document.getElementById('viewDishes').classList.add('active');
    renderDishes();
  }
  function backToShops() {
    document.getElementById('viewDishes').classList.remove('active');
    document.getElementById('viewShops').classList.add('active');
    closeCart();
  }

  function renderDishes() {
    var shop = currentShop;
    document.getElementById('dishList').innerHTML = shop.dishes.map(d => {
      var item = cart[d.id];
      var qty = item ? item.qty : 0;
      var ctrl = qty === 0
        ? '<button class="add-btn" onclick="addDish(\'' + d.id + '\')">+</button>'
        : '<div class="qty-ctrl">' +
            '<button class="qty-btn" onclick="decDish(\'' + d.id + '\')">−</button>' +
            '<span class="qty-num">' + qty + '</span>' +
            '<button class="qty-btn" onclick="addDish(\'' + d.id + '\')">+</button>' +
          '</div>';
      var imgHtml = d.img
        ? '<img src="' + d.img + '" alt="' + d.name + '" loading="lazy">'
        : d.emoji;
      return '<div class="dish-card">' +
        '<div class="dish-img">' + imgHtml + '</div>' +
        '<div class="dish-info">' +
          '<div class="dish-name">' + d.name + '</div>' +
          '<div class="dish-desc">' + d.desc + '</div>' +
          '<div class="dish-bottom">' +
            '<div class="dish-price">¥' + d.price + '</div>' +
            ctrl +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    updateCartUI();
  }

  // ===== 购物车操作 =====
  function addDish(dishId) {
    if (!currentShop) return;
    var dish = currentShop.dishes.find(function (item) { return item.id === dishId; });
    var ownerShopId = getDishShopId(dishId);
    if (!dish || !ownerShopId || ownerShopId !== currentShop.id) return;

    if (cartCount() > 0 && cartShopId !== currentShop.id) {
      var previousShop = getCartShop();
      var previousName = previousShop ? previousShop.name : '其他餐厅';
      var shouldReplace = window.confirm(
        '购物车中已有「' + previousName + '」的商品。\n外卖订单一次只能结算一家店铺，是否清空旧购物车并添加「' + currentShop.name + '」？'
      );
      if (!shouldReplace) return;
      cart = {};
    }

    cartShopId = currentShop.id;
    if (!cart[dishId]) cart[dishId] = { dish: dish, qty: 0 };
    cart[dishId].qty++;
    saveCart();
    renderDishes();
  }
  function decDish(dishId) {
    if (!cart[dishId]) return;
    cart[dishId].qty--;
    if (cart[dishId].qty <= 0) delete cart[dishId];
    if (cartCount() === 0) cartShopId = '';
    saveCart();
    renderDishes();
  }

  function cartItems() {
    return Object.keys(cart).map(function (key) {
      var item = cart[key];
      return {
        dish: item.dish,
        qty: item.qty,
        dishId: key,
        shopId: getDishShopId(item.dish && item.dish.id ? item.dish.id : key)
      };
    });
  }
  function cartTotal() {
    return cartItems().reduce((s, it) => s + it.dish.price * it.qty, 0);
  }
  function cartCount() {
    return cartItems().reduce((s, it) => s + it.qty, 0);
  }

  function updateCartUI() {
    var n = cartCount();
    var total = cartTotal();
    ['cartBadge','cartBadge2'].forEach(id => {
      var el = document.getElementById(id);
      el.textContent = n || '';
      if (n > 0) el.removeAttribute('data-zero');
      else el.setAttribute('data-zero','1');
    });
    var bar = document.getElementById('cartBar');
    if (n > 0) {
      bar.style.display = 'flex';
      document.getElementById('cartBarCount').textContent = n + ' 件';
      document.getElementById('cartBarTotal').textContent = '¥' + total.toFixed(0);
    } else {
      bar.style.display = 'none';
    }
  }

  // ===== 购物车弹层 =====
  function clearCart() {
    if (!cartCount()) return;
    cart = {};
    cartShopId = '';
    saveCart();
    openCart();
    toast('购物车已清空');
  }
  function openCart() {
    var box = document.getElementById('cartItems');
    var items = cartItems();
    if (!items.length) {
      box.innerHTML = '<div style="text-align:center;color:#999;padding:30px 0;font-size:0.875rem;">购物车是空的</div>';
    } else {
      var mixedNote = cartShopId === 'mixed'
        ? '<div style="padding:10px 12px;margin-bottom:8px;border-radius:10px;background:#F4F4F6;color:#666;font-size:0.75rem;line-height:1.5;">检测到旧购物车中有多家店铺的商品。请先清空，再从同一家店重新添加，避免订单店铺与商品不一致。</div>'
        : '';
      box.innerHTML = mixedNote + items.map(function (it) {
        var shop = getShopById(it.shopId);
        return '<div class="cart-row">' +
          '<div><div class="cart-row-name">' + it.dish.name + ' × ' + it.qty + '</div>' +
          '<div class="cart-row-meta">' + (shop ? shop.name : '未知店铺') + '</div></div>' +
          '<div class="cart-row-price">¥' + (it.dish.price * it.qty) + '</div>' +
        '</div>';
      }).join('') +
      '<div style="margin-top:14px;display:flex;justify-content:space-between;font-weight:700;">' +
        '<span>合计</span><span>¥' + cartTotal().toFixed(0) + '</span>' +
      '</div>' +
      '<button class="cart-clear-btn" onclick="clearCart()">清空购物车</button>';
    }
    document.getElementById('cartOverlay').classList.add('open');
  }
  function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); }

  // ===== 结算 =====
  let payMethod = 'normal';
  let pendingTakeoutCheckoutSignature = '';

  function buildTakeoutCheckoutSignature(items, orderShop, total) {
    return JSON.stringify({
      shopId: orderShop.id,
      items: items.map(function (item) {
        return { id: item.dish.id || item.dish.name, name: item.dish.name, price: item.dish.price, qty: item.qty };
      }),
      total: total
    });
  }

  function openCheckout() {
    closeCart();
    var items = cartItems();
    if (!items.length) { toast('购物车是空的'); return; }
    var orderShop = getCartShop();
    if (!orderShop) {
      toast('购物车包含多家店铺，请清空后从同一家店重新添加');
      return;
    }
    var total = cartTotal();
    var checkoutSignature = buildTakeoutCheckoutSignature(items, orderShop, total);
    var checkoutLedger = window.MaoMaoWalletLedger;
    var pending = checkoutLedger && typeof checkoutLedger.getPendingCheckout === 'function'
      ? checkoutLedger.getPendingCheckout('takeout') : undefined;
    if (pending === null) {
      toast('未完成结算记录无法读取，已停止恢复');
      return;
    }
    var resumingPending = !!(pending && pending.signature === checkoutSignature);
    if (pending && !resumingPending) {
      toast('检测到另一笔未完成外卖结算；已停止新结算，请先恢复原购物车');
      return;
    }
    if (resumingPending) {
      payMethod = String(pending.paymentMethod);
      pendingTakeoutCheckoutSignature = String(pending.signature);
    } else if (pendingTakeoutCheckoutSignature && pendingTakeoutCheckoutSignature !== checkoutSignature) {
      toast('当前购物车与原外卖交易不一致，已停止结算');
      return;
    }

    // 商品列表
    document.getElementById('checkoutItems').innerHTML =
      '<div style="font-size:0.75rem;color:#777;margin-bottom:8px;">' + orderShop.name + ' · ' + orderShop.delivery + '送达</div>' +
      items.map(it =>
      '<div class="cart-row">' +
        '<div class="cart-row-name">' + it.dish.name + ' × ' + it.qty + '</div>' +
        '<div class="cart-row-price">¥' + (it.dish.price * it.qty) + '</div>' +
      '</div>'
    ).join('') +
    '<div style="margin-top:12px;display:flex;justify-content:space-between;font-weight:700;">' +
      '<span>合计</span><span>¥' + total.toFixed(0) + '</span>' +
    '</div>';

    // 原有的「我给角色代付」亲密付继续保留；下面另列出角色赠予我的卡。
    var cpState = window.MaoMaoWalletLedger &&
      typeof window.MaoMaoWalletLedger.readClosePayState === 'function'
      ? window.MaoMaoWalletLedger.readClosePayState('close_pay') : { ok: false, reason: 'module' };
    var cp = cpState.ok ? cpState.value : null;
    var closePayDataInvalid = !cpState.ok && cpState.reason !== 'module';
    var canClose = cp && cp.enabled && cp.roleName &&
                   (Number(cp.used)||0) + total <= (Number(cp.limit)||0);
    var roleCardApi = window.RoleFamilyCards;
    var roleCardState = roleCardApi && typeof roleCardApi.readState === 'function'
      ? roleCardApi.readState() : { ok: !roleCardApi, value: [] };
    var roleCardDataInvalid = !!(roleCardApi && !roleCardState.ok);
    var roleCards = roleCardApi && roleCardState.ok
      ? roleCardState.value.filter(function (card) { return card && card.status === 'active'; })
      : [];
    if (!resumingPending && payMethod.indexOf('role_card:') === 0) {
      var selectedCard = getRoleCardFromMethod(payMethod);
      if (!selectedCard || !canUseRoleCard(selectedCard, total)) payMethod = 'normal';
    }
    if (!resumingPending && (!payMethod || (payMethod === 'close_pay' && !canClose))) payMethod = 'normal';

    var html = resumingPending
      ? '<div style="padding:12px 14px;border-radius:14px;background:#F7F7F9;color:#555;font-size:.75rem;line-height:1.6;margin-bottom:10px;">检测到一笔未完成结算，已恢复原商品与支付方式。请确认继续原交易，不会创建第二笔订单。</div>'
      : '';
    html += closePayDataInvalid
      ? '<div style="padding:12px 14px;border-radius:14px;background:#F7F7F9;color:#666;font-size:.75rem;line-height:1.6;margin-bottom:10px;">亲密付设置数据异常，已暂停扣款。原设置与交易记录未被修改，请先恢复数据。</div>'
      : '';
    html +=
      '<div class="pay-method' + (payMethod==='normal'?' active':'') + '" data-m="normal">' +
        '<div><div class="pay-method-name">日常账户</div>' +
        '<div class="pay-method-sub">5292 •••• •••• 3123</div></div>' +
        '<div class="pay-method-radio"></div>' +
      '</div>';
    if (canClose || (resumingPending && payMethod === 'close_pay' && cp)) {
      html += '<div class="pay-method' + (payMethod==='close_pay'?' active':'') + '" data-m="close_pay">' +
        '<div><div class="pay-method-name">亲密付 · ' + escapeFamilyCardText(cp.roleName) + '</div>' +
        '<div class="pay-method-sub">剩余 ¥' + Math.max(0, Number(cp.limit)-Number(cp.used)).toFixed(2) + ' / 月</div></div>' +
        '<div class="pay-method-radio"></div>' +
      '</div>';
    }
    if (roleCardDataInvalid) {
      html += '<div style="padding:12px 14px;border-radius:14px;background:#F7F7F9;color:#666;font-size:.75rem;line-height:1.6;margin-bottom:10px;">亲属卡数据异常，已暂停使用和扣款。原始卡片记录未被修改，请先恢复卡片数据。</div>';
    }
    roleCards.forEach(function (card) {
      var method = 'role_card:' + card.id;
      var available = Math.max(0, (Number(card.monthlyLimit) || 0) - roleCardApi.usedThisMonth(card));
      var usable = canUseRoleCard(card, total);
      var selected = payMethod === method;
      var kind = card.kind === 'intimate' ? '亲密付' : '亲属卡';
      var reason = total > (Number(card.singleLimit) || 0) ? '超过单笔上限'
        : (available < total ? '本月额度不足' : '暂不可用');
      html += '<div class="pay-method' + (selected?' active':'') + '" ' +
        (usable ? 'data-m="' + escapeFamilyCardText(method) + '"' : '') +
        ' style="' + (!usable ? 'opacity:.55;cursor:not-allowed;' : '') + '">' +
        '<div><div class="pay-method-name">' + kind + ' · ' + escapeFamilyCardText(card.roleName || '角色') + ' 赠予</div>' +
        '<div class="pay-method-sub">' + (usable ? '本月剩余 ¥' + available.toFixed(2) : reason) +
        ' · 单笔上限 ¥' + (Number(card.singleLimit)||0).toFixed(2) + '</div></div>' +
        '<div class="pay-method-radio"></div>' +
      '</div>';
    });
    document.getElementById('payMethods').innerHTML = html;
    document.querySelectorAll('#payMethods .pay-method').forEach(el => {
      el.addEventListener('click', function(){
        if (!el.dataset.m) return;
        if (pendingTakeoutCheckoutSignature && el.dataset.m !== payMethod) {
          toast('这笔结算必须沿用原支付方式；请先完成原交易恢复');
          return;
        }
        payMethod = el.dataset.m;
        openCheckout();
      });
    });

    document.getElementById('checkoutOverlay').classList.add('open');
  }
    function closeCheckout() { document.getElementById('checkoutOverlay').classList.remove('open'); }

  function restorePendingTakeoutCheckout() {
    var ledger = window.MaoMaoWalletLedger;
    if (!ledger || typeof ledger.getPendingCheckout !== 'function') return;
    var pending = ledger.getPendingCheckout('takeout');
    if (pending === undefined) return;
    if (pending === null) {
      toast('未完成外卖结算记录无法读取，已停止自动恢复');
      return;
    }
    var snapshot;
    try { snapshot = JSON.parse(pending.signature); }
    catch (error) { toast('原外卖订单快照损坏，已停止恢复'); return; }
    var shop = snapshot && getShopById(snapshot.shopId);
    if (!shop || !Array.isArray(snapshot.items) || !snapshot.items.length ||
        !isFinite(Number(snapshot.total)) || Number(snapshot.total) < 0 || !pending.paymentMethod) {
      toast('原外卖订单快照缺少必要信息，已停止恢复');
      return;
    }
    var restoredCart = {};
    var computedTotal = 0;
    for (var i = 0; i < snapshot.items.length; i++) {
      var saved = snapshot.items[i];
      var dish = saved && shop.dishes.find(function (item) { return String(item.id) === String(saved.id); });
      var qty = Number(saved && saved.qty);
      if (!dish || dish.name !== saved.name || Number(dish.price) !== Number(saved.price) ||
          !Number.isInteger(qty) || qty < 1 || restoredCart[dish.id]) {
        toast('原菜品与当前餐厅菜单不一致，已停止恢复');
        return;
      }
      restoredCart[dish.id] = { dish:dish, qty:qty };
      computedTotal += Number(dish.price) * qty;
    }
    if (Math.round(computedTotal * 100) !== Math.round(Number(snapshot.total) * 100)) {
      toast('原外卖订单金额校验未通过，已停止恢复');
      return;
    }
    var oldCart = cart;
    var oldShopId = cartShopId;
    var oldCartRaw = localStorage.getItem('takeout_cart');
    var oldShopRaw = localStorage.getItem('takeout_cart_shop_id');
    cart = restoredCart;
    cartShopId = shop.id;
    if (!saveCart()) {
      cart = oldCart;
      cartShopId = oldShopId;
      try {
        if (oldCartRaw == null) localStorage.removeItem('takeout_cart');
        else localStorage.setItem('takeout_cart', oldCartRaw);
        if (oldShopRaw == null) localStorage.removeItem('takeout_cart_shop_id');
        else localStorage.setItem('takeout_cart_shop_id', oldShopRaw);
      } catch (restoreError) {}
      updateCartUI();
      toast('原外卖购物车恢复失败，未继续结算');
      return;
    }
    pendingTakeoutCheckoutSignature = String(pending.signature);
    payMethod = String(pending.paymentMethod);
    updateCartUI();
    openCheckout();
    toast('已恢复原餐厅、菜品和支付方式；点击确认只会继续原交易');
  }


  var takeoutPaymentInProgress = false;

  async function doPay() {
    if (takeoutPaymentInProgress) return;
    takeoutPaymentInProgress = true;
    try {
      var ledger = window.MaoMaoWalletLedger;
      if (!ledger || typeof ledger.runExclusive !== 'function') {
        toast('钱包保护模块尚未加载，请刷新页面后重试');
        return;
      }
      if (typeof ledger.supportsCrossTabLock !== 'function' ||
          !ledger.supportsCrossTabLock()) {
        toast('当前浏览器不支持跨页面钱包锁，外卖结算已暂停，未扣款');
        return;
      }
      await ledger.runExclusive(function () {
        
            var items = cartItems();
            if (!items.length) { toast('购物车是空的'); return; }
            var orderShop = getCartShop();
            if (!orderShop) {
              toast('购物车包含多家店铺，请清空后重新添加');
              closeCheckout();
              return;
            }
            var total = cartTotal();
            var currentCheckoutSignature = buildTakeoutCheckoutSignature(items, orderShop, total);
            if (pendingTakeoutCheckoutSignature && pendingTakeoutCheckoutSignature !== currentCheckoutSignature) {
              toast('当前购物车与未完成原交易不一致，已停止结算；请恢复原购物车后重试');
              return;
            }
            var checkoutSignature = pendingTakeoutCheckoutSignature || currentCheckoutSignature;
            var transactionId = ledger.getOrCreatePendingCheckout('takeout', checkoutSignature, payMethod);
            if (!transactionId) {
              toast('存在未完成的结算；请恢复上次商品和支付方式后继续，避免重复扣款');
              return;
            }
            var roleFamilyCard = getRoleCardFromMethod(payMethod);
            if (payMethod.indexOf('role_card:') === 0) {
              var roleCardState = window.RoleFamilyCards && typeof window.RoleFamilyCards.readState === 'function'
                ? window.RoleFamilyCards.readState() : { ok: false, reason: 'module' };
              if (!roleCardState.ok) {
                ledger.cancelPendingCheckout(transactionId);
                toast('亲属卡数据异常，已停止扣款；请先恢复卡片数据');
                return;
              }
              if (!roleFamilyCard) {
                ledger.cancelPendingCheckout(transactionId);
                toast('这张亲属卡不存在或已失效');
                payMethod = 'normal';
                closeCheckout();
                openCheckout();
                return;
              }
              var familySpend = window.RoleFamilyCards.consume(
                roleFamilyCard.id, total, '外卖 · ' + items.map(function (it) { return it.dish.name + '×' + it.qty; }).join('、'), 'takeout', transactionId
              );
              if (!familySpend || !familySpend.ok) {
                if (familySpend && ['limit', 'missing', 'invalid'].indexOf(familySpend.reason) !== -1) {
                  ledger.cancelPendingCheckout(transactionId);
                }
                toast(familySpend && familySpend.reason === 'invalid'
                  ? '亲属卡数据异常，已停止扣款；请先恢复卡片数据'
                  : (familySpend && familySpend.reason === 'storage'
                    ? '亲属卡记录保存失败，请重试' : '亲属卡额度已变化，请重新选择'));
                closeCheckout();
                openCheckout();
                return;
              }
              roleFamilyCard = familySpend.card;
            }
            var now = new Date();
            var timeStr = (now.getMonth()+1) + '月' + now.getDate() + '日';
            var itemsDesc = items.map(it => it.dish.name + '×' + it.qty).join('、');
        
            // 2. 亲密付：扣钱包 + 更新额度 + 发聊天
            if (payMethod === 'close_pay') {
              var oldWalletRaw = null;
              var walletSerialized = '';
              var closePaySerialized = '';
              var closePayQuotaCommitted = false;
              try {
                var cp = getClosePay();
                if (!cp) {
                  toast('亲密付设置不可用，原交易仍保留待恢复；请恢复亲密付设置后重试');
                  return;
                }
                if (cp) {
                  if (!Array.isArray(cp.history)) cp.history = [];
          var quotaAlreadyCommitted = cp.history.some(function (row) {
            return row && row.paymentId === transactionId;
          });
          oldWalletRaw = localStorage.getItem('workData');
          var wd = ledger.readWalletForMutation('workData', oldWalletRaw);
          if (!wd) {
            toast('钱包数据异常，已停止亲密付扣款；请先修复或恢复钱包数据，原交易编号保留');
            return;
          }
          var walletAlreadyCommitted = wd.history.some(function (row) {
            return row && row.paymentId === transactionId;
          });

          // A partial prior commit must be completed even if settings changed afterward.
          if (!walletAlreadyCommitted && !quotaAlreadyCommitted && !cp.enabled) {
            ledger.cancelPendingCheckout(transactionId);
            toast('亲密付已关闭，订单未完成');
            return;
          }
          if (!walletAlreadyCommitted && !quotaAlreadyCommitted &&
              (Number(cp.used) || 0) + total > (Number(cp.limit) || 0)) {
            ledger.cancelPendingCheckout(transactionId);
            toast('亲密付额度已变化，订单未完成');
            return;
          }
          if (!walletAlreadyCommitted) {
            if (wd.balance < total) {
              ledger.cancelPendingCheckout(transactionId);
              toast('钱包余额不足，未完成支付');
              return;
            }
            wd.balance = Math.round((wd.balance - total) * 100) / 100;
            wd.history.unshift({ type:'expense', category:'close_pay',
              title: '外卖亲密付 · ' + cp.roleName + ' · ' + itemsDesc,
              amount: total, time: Date.now(), paymentId: transactionId });
            var walletCommit = ledger.commitWalletSnapshot(wd, oldWalletRaw);
            if (!walletCommit.ok) {
              toast('钱包扣款未能确认；再次提交会核对原交易，不会盲目重复扣款');
              return;
            }
            walletSerialized = walletCommit.raw;
          } else {
            walletSerialized = oldWalletRaw || JSON.stringify(wd);
          }

          if (!quotaAlreadyCommitted) {
            cp.used = Math.round(((Number(cp.used)||0) + total) * 100) / 100;
            cp.history.push({ amount: total, note: '外卖 · ' + itemsDesc,
              time: Date.now(), paymentId: transactionId });
            closePaySerialized = JSON.stringify(cp);
            localStorage.setItem('close_pay', closePaySerialized);
            if (localStorage.getItem('close_pay') !== closePaySerialized) {
              try {
                ledger.restoreWalletSnapshot(walletSerialized, oldWalletRaw);
              } catch (rollbackError) {}
              toast('亲密付额度未能保存，已尝试撤回钱包扣款；请重试核对原交易');
              return;
            }
          }
          closePayQuotaCommitted = true;

          if (cp.roleId) {
                    var key = 'chat_history_' + cp.roleId;
                    var arr = JSON.parse(localStorage.getItem(key) || '[]');
                    if (!arr.some(function (row) { return row && row.paymentId === transactionId; })) {
                      arr.push({ role:'user', type:'text',
                        text: '刚刚帮你点了外卖：' + itemsDesc + '，¥' + total + '，等好吃的到吧～',
                        time: Date.now(),
                        paymentId: transactionId });
                      var chatSerialized = JSON.stringify(arr);
                      localStorage.setItem(key, chatSerialized);
                      if (localStorage.getItem(key) !== chatSerialized) {
                        toast('亲密付已扣款，但聊天记录暂未保存；再次提交会恢复原交易');
                        return;
                      }
                    }
                  }
                }
              } catch(e) {
                if (!closePayQuotaCommitted && walletSerialized) {
                  try {
                    ledger.restoreWalletSnapshot(walletSerialized, oldWalletRaw);
                  } catch (rollbackError) {}
                }
                toast('亲密付操作未能确认，订单未完成');
                return;
              }
            }

            // 共享账本严格校验原流水，再按 paymentId + 菜品序号幂等补齐。
            var financeRows = items.map(function (item, index) {
              return {
                amount: item.dish.price * item.qty,
                type: 'expense',
                category: payMethod === 'close_pay' ? '亲密付' : (payMethod.indexOf('role_card:') === 0 ? '亲属卡' : '外卖'),
                note: (payMethod === 'close_pay'
                  ? '亲密付给' + (getClosePay()||{}).roleName + ' · '
                  : (roleFamilyCard ? roleFamilyCard.roleName + ' 亲属卡代付 · ' : '外卖 · ')) + itemsDesc,
                time: timeStr,
                paymentLineIndex: index
              };
            });
            var financeResult = ledger.recordFinanceLines(transactionId, financeRows, 'finance_records');
            if (!financeResult.ok) {
              toast('财务流水异常或与原交易冲突，已停止写入；原交易仍保留待恢复');
              return;
            }


        

        
            // 订单按 paymentId 去重，且以精确读回作为保存成功标准。
            try {
              var orders = loadTakeoutOrders();
              if (!orders) throw new Error('takeout_orders data is invalid; refusing to overwrite');
              var existingOrder = orders.find(function (row) { return row.paymentId === transactionId; });
              if (existingOrder) {
                var sameItems = Array.isArray(existingOrder.items) &&
                  existingOrder.items.length === items.length &&
                  existingOrder.items.every(function (storedItem, index) {
                    var currentItem = items[index];
                    return storedItem.name === currentItem.dish.name &&
                      Number(storedItem.price) === Number(currentItem.dish.price) &&
                      Number(storedItem.qty) === Number(currentItem.qty);
                  });
                if (!sameItems || Number(existingOrder.total) !== Number(total) ||
                    String(existingOrder.shopId || '') !== String(orderShop.id) ||
                    String(existingOrder.payMethod || '') !== String(payMethod)) {
                  throw new Error('payment ID is already attached to a different order payload');
                }
              } else {
                var orderCreatedAt = Date.now();
                orders.push({
                  orderId: transactionId,
                  paymentId: transactionId,
                  items: items.map(function (item) {
                    return { name: item.dish.name, price: item.dish.price, qty: item.qty };
                  }),
                  total: total,
                  shop: orderShop.name,
                  shopId: orderShop.id,
                  delivery: orderShop.delivery,
                  payMethod: payMethod,
                  ts: orderCreatedAt,
                  status: 'placed',
                  statusUpdatedAt: orderCreatedAt,
                  statusHistory: [{ status: 'placed', label: '已下单', time: orderCreatedAt }],
                  statusSource: 'simulation'
                });
              }
              if (!saveTakeoutOrders(orders)) {
                toast('支付已记录，但订单暂未保存；再次提交会补齐订单且不会重复扣款');
                return;
              }
            } catch (orderError) {
              console.warn('[takeout] 订单保存失败', orderError);
              toast('订单保存失败；再次提交可恢复原交易');
              return;
            }


            // 订单落盘后再清空购物车；清理未确认时保留原购物车与待恢复交易。
            var cartSnapshot = cart;
            var cartShopSnapshot = cartShopId;
            var cartStorageSnapshot = localStorage.getItem('takeout_cart');
            var cartShopStorageSnapshot = localStorage.getItem('takeout_cart_shop_id');
            cart = {};
            cartShopId = '';
            if (!saveCart()) {
              cart = cartSnapshot;
              cartShopId = cartShopSnapshot;
              updateCartUI();
              toast('订单已保存，但购物车未能清空；再次提交会恢复原交易');
              return;
            }
            if (!ledger.completePendingCheckout(transactionId)) {
              if (ledger.isPendingCheckout(transactionId) === true) {
                cart = cartSnapshot;
                cartShopId = cartShopSnapshot;
                try {
                  if (cartStorageSnapshot == null) localStorage.removeItem('takeout_cart');
                  else localStorage.setItem('takeout_cart', cartStorageSnapshot);
                  if (cartShopStorageSnapshot == null) localStorage.removeItem('takeout_cart_shop_id');
                  else localStorage.setItem('takeout_cart_shop_id', cartShopStorageSnapshot);
                } catch (restoreError) {}
                updateCartUI();
                toast('订单已保存，结算确认暂未完成；已恢复购物车，可再次提交完成确认');
              } else {
                toast('订单已保存，但结算确认暂未完成；请勿重新购买这笔外卖');
              }
              return;
            }
            pendingTakeoutCheckoutSignature = '';
            try {
              if (roleFamilyCard) {
                            notifyRoleCardIssuer(roleFamilyCard,
                              '我刚刚使用你给我的' + (roleFamilyCard.kind === 'intimate' ? '亲密付' : '亲属卡') +
                              '点了外卖：' + itemsDesc + '，共 ¥' + total.toFixed(2) + '。本月已使用 ¥' +
                              window.RoleFamilyCards.usedThisMonth(roleFamilyCard).toFixed(2) + '。');
                          }
            } catch (notifyError) {
              console.warn('[takeout] 亲属卡通知未能发送', notifyError);
            }
            closeCheckout();
            if (currentShop) renderDishes();
            else updateCartUI();
            toast('下单成功，预计 ' + orderShop.delivery + ' 送达');
      }, {
        onFallback: function () {
          toast('当前浏览器不支持跨页面支付互斥，请避免同时从多个页面结算');
        }
      });
    } catch (error) {
      console.warn('[takeout] 支付操作未完成', error);
      toast('支付暂未完成，请检查钱包记录后重试');
    } finally {
      takeoutPaymentInProgress = false;
    }
  }

  // ===== 转发给TA =====
  function openForward() {
    var chars = getCharacters();
    var box = document.getElementById('forwardList');
    if (!chars.length) {
      box.innerHTML = '<div style="text-align:center;color:#999;padding:20px 0;font-size:0.875rem;">还没有角色，先去聊天里添加吧</div>';
    } else {
      box.innerHTML = chars.map(c => {
        var ch = c.name || '角色';
        var av = c.avatar
          ? '<img src="' + c.avatar + '" alt="">'
          : ch.charAt(0);
        return '<div class="forward-row" data-id="' + (c.id||'') + '" data-name="' + ch + '">' +
          '<div class="forward-avatar">' + av + '</div>' +
          '<div class="forward-name">' + ch + '</div>' +
        '</div>';
      }).join('');
    }
    document.getElementById('forwardOverlay').classList.add('open');
  }
  function closeForward() { document.getElementById('forwardOverlay').classList.remove('open'); }

  document.getElementById('takeoutOrdersList').addEventListener('click', function (event) {
    var card = event.target.closest('[data-order-id]');
    if (card) openTakeoutOrderDetail(card.getAttribute('data-order-id'));
  });

  document.getElementById('forwardList').addEventListener('click', function(e){
    var row = e.target.closest('.forward-row');
    if (!row) return;
    var roleId = row.dataset.id;
    var roleName = row.dataset.name;
    var items = cartItems();
    if (!items.length) { toast('购物车是空的'); return; }
    var total = cartTotal();
    var itemsDesc = items.map(it => it.dish.name + '×' + it.qty).join('、');
    try {
      var key = 'chat_history_' + roleId;
      var arr = JSON.parse(localStorage.getItem(key) || '[]');
      arr.push({ role:'user', type:'text',
        text: '我在外卖上挑了这些：' + itemsDesc + '，一共 ¥' + total + '。想吃哪个？帮我点单～',
        time: Date.now() });
      localStorage.setItem(key, JSON.stringify(arr));
    } catch(e) {}
    closeForward();
    closeCheckout();
    toast('已转发给 ' + roleName);
  });

  // ===== 初始化 =====
  loadCart();
  renderCats();
  renderShops();
  updateCartUI();
  restorePendingTakeoutCheckout();
</script>
</body>
</html>
