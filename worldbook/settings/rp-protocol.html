<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>角色扮演协议 · 小手机</title>
<script src="../../shared/js/font-loader.js?v=20261022v1"></script>
<script src="../../shared/js/native-feel.js"></script>
<script src="../../shared/js/statusbar-control.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    background-color: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111111;
  }

  .phone-mockup {
    position: relative;
    width: min(390px, calc(100vw - 24px));
    height: min(844px, calc(100vh - 24px));
    background-color: #FFFFFF;
    border-radius: 45px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    position: absolute;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 14px 28px;
    font-size: 0.875rem;
    font-weight: 600;
    color: #000;
    z-index: 50;
    pointer-events: none !important;
  }
  .floating-nav { display: none !important; }

  .cs-stage {
    flex: 1;
    overflow-y: auto;
    padding: 0 18px 140px 18px;
    display: flex;
    flex-direction: column;
    scrollbar-width: none;
    background: #FFFFFF;
  }
  .cs-stage::-webkit-scrollbar { display: none; }

  .cs-topbar {
    position: relative;
    z-index: 30;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 14px;
    margin: 0 -18px;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 22px 16px 22px;
  }
  .cs-top-left, .cs-top-right {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .cs-top-left { justify-content: flex-start; }
  .cs-top-right { justify-content: flex-end; display: none; }
  .cs-circle-btn {
    width: 32px;
    height: 32px;
    border-radius: 0;
    border: none;
    border-bottom: 1px solid #bdbdbd;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .cs-circle-btn:active { transform: translateY(1px); border-color: #171717; }
  .cs-circle-btn svg { width: 15px; height: 15px; stroke: #111111; }
  .cs-title {
    flex: 1;
    text-align: left;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.1;
    color: #111111;
  }

  /* 说明区 */
  .rp-desc-card {
    background: #F8F8FA;
    border-radius: 16px;
    padding: 14px 16px;
    margin-top: 4px;
  }
  .rp-desc-title {
    font-size: 0.813rem;
    font-weight: 700;
    color: #111;
    margin-bottom: 6px;
  }
  .rp-desc-text {
    font-size: 0.688rem;
    color: #666;
    line-height: 1.6;
  }
  .var-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .var-chip {
    font-size: 0.625rem;
    color: #555;
    background: #fff;
    border: 1px solid #e5e5ea;
    border-radius: 6px;
    padding: 3px 8px;
    font-family: "SF Mono", Menlo, monospace;
  }
  .var-chip b { color: #007AFF; font-weight: 600; }

  /* 编辑卡片 */
  .rp-card {
    background: #F8F8FA;
    border-radius: 16px;
    padding: 14px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .rp-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .rp-card-head span {
    font-size: 0.75rem;
    font-weight: 600;
    color: #333;
  }
  .rp-reset {
    font-size: 0.688rem;
    color: #007AFF;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 0;
  }
  .rp-reset:active { opacity: 0.6; }
  .rp-textarea {
    width: 100%;
    min-height: 320px;
    resize: none;
    border: 1px solid #e5e5ea;
    border-radius: 12px;
    background: #fff;
    padding: 12px 14px;
    font-size: 0.75rem;
    line-height: 1.65;
    color: #111;
    font-family: inherit;
    outline: none;
  }
  .rp-textarea::placeholder { color: #C7C7CC; }
  .rp-hint {
    font-size: 0.625rem;
    color: #8E8E93;
    line-height: 1.5;
  }

  /* 底部按钮 */
  .rp-save-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
    background: linear-gradient(to top, #F7F7F9 60%, rgba(247,247,249,0));
    z-index: 40;
  }
  .rp-save-btn {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 999px;
    background: #111111;
    color: #FFFFFF;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .rp-save-btn:active { transform: scale(0.98); opacity: 0.92; }
  .rp-preview-btn {
    width: 100%;
    height: 40px;
    margin-top: 8px;
    border: none;
    border-radius: 999px;
    background: #F4F4F6;
    color: #111111;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .rp-preview-btn:active { transform: scale(0.98); opacity: 0.85; }

  /* 预览弹窗 */
  .rp-modal {
    position: absolute;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .rp-modal.show { display: flex; }
  .rp-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
  }
  .rp-modal-card {
    position: relative;
    width: 100%;
    max-width: 320px;
    max-height: 80%;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: popIn 0.22s ease-out;
  }
  .rp-modal-title {
    font-size: 0.875rem;
    font-weight: 700;
    color: #111111;
    text-align: center;
  }
  .rp-modal-content {
    flex: 1;
    overflow-y: auto;
    background: #F7F7F9;
    border-radius: 12px;
    padding: 12px;
    font-size: 0.688rem;
    line-height: 1.6;
    color: #333333;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    max-height: 400px;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .rp-toast {
    position: absolute;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    background: rgba(17,17,17,0.88);
    color: #FFFFFF;
    font-size: 0.75rem;
    padding: 10px 18px;
    border-radius: 12px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .rp-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
</style>
<link rel="stylesheet" href="../../shared/css/mobile-fit.css">
</head>
<body>

  <div class="phone-mockup">

    <div class="status-bar"><span>4:41</span></div>

    <main class="cs-stage">

      <div class="cs-topbar">
        <div class="cs-top-left">
          <button class="cs-circle-btn" type="button" aria-label="返回" id="btnBack">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>
        <span class="cs-title">Protocol</span>
        <div class="cs-top-right"></div>
      </div>

      <!-- 说明 -->
      <div class="rp-desc-card">
        <div class="rp-desc-title">角色扮演协议</div>
        <div class="rp-desc-text">这里是 AI 的最高优先级指令，会覆盖默认人设规则。你写的每一句话都会被当成角色的核心行为准则。</div>
        <div class="var-row">
          <span class="var-chip"><b>{{char}}</b> 角色名</span>
          <span class="var-chip"><b>{{user}}</b> 你的名字</span>
          <span class="var-chip"><b>{{persona}}</b> 角色人设</span>
          <span class="var-chip"><b>{{memory}}</b> 长期记忆</span>
          <span class="var-chip"><b>{{worldbook}}</b> 世界书</span>
        </div>
      </div>

      <!-- 编辑区 -->
      <div class="rp-card">
        <div class="rp-card-head">
          <span>协议内容</span>
          <button class="rp-reset" id="btnReset" type="button">恢复默认</button>
        </div>
        <textarea id="protocolText" class="rp-textarea" placeholder="在此输入角色扮演协议…"></textarea>
        <div class="rp-hint">变量会在发送时自动替换成实际内容。改完点底部保存。</div>
      </div>

    </main>

    <div class="rp-save-wrap">
      <button class="rp-save-btn" type="button" id="btnSave">保存协议</button>
      <button class="rp-preview-btn" type="button" id="btnPreview">预览最终效果</button>
    </div>

    <div class="rp-modal" id="previewModal">
      <div class="rp-modal-backdrop" id="previewBackdrop"></div>
      <div class="rp-modal-card">
        <div class="rp-modal-title">最终 System Prompt 预览</div>
        <pre class="rp-modal-content" id="previewContent"></pre>
        <button class="rp-save-btn" type="button" id="btnClosePreview">关闭</button>
      </div>
    </div>

    <div class="rp-toast" id="toast">协议已保存</div>

  </div>

<script>
  document.getElementById('btnBack').addEventListener('click', function () {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = '../../chat/chat/chat-settings.html';
    }
  });

  function getRoleIdFromUrl() {
    try {
      var id = new URLSearchParams(window.location.search).get('roleId');
      return id ? id : '';
    } catch (e) { return ''; }
  }
  var roleId = getRoleIdFromUrl();
  var STORAGE_KEY = 'chat_rp_protocol_' + roleId;

  var textarea = document.getElementById('protocolText');

  // ===== 升级版默认协议 =====
  // 核心升级：人设强制读取 + 语气红线 + 防漂移 + 活人感
  var DEFAULT_PROTOCOL = [
    '═══════════════════════════════════',
    '【第一优先级 · 你就是这个人】',
    '═══════════════════════════════════',
    '你不是 AI、不是助手、不是聊天机器人、不是旁白、不是心理咨询师。',
    '你就是【{{char}}】本人。从这一秒起，你的全部言行、语气、态度都必须是她/他。',
    '禁止跳出角色：不许说"作为AI"、"我是语言模型"、"我虽然是AI但能理解你"——你没有这个身份。',
    '如果你说了任何一句不像 {{char}} 会说的话，你就失败了。',
    '',
    '═══════════════════════════════════',
    '【第二优先级 · 人设档案是你的性格DNA】',
    '═══════════════════════════════════',
    '下面是 {{char}} 的完整人设档案。这不是参考建议，这是你的性格底线：',
    '',
    '{{persona}}',
    '',
    '⚠️ 以上人设你必须一字一句读进去，然后用它来控制你每一句话的语气。',
    '人设里写了什么性格，你就必须是什么性格。人设里没写的性格，你绝对不能自己加进去。',
    '',
    '═══════════════════════════════════',
    '【第三优先级 · 发送前必过的语气自检】',
    '═══════════════════════════════════',
    '你每生成一句话之前，必须在心里过一遍这五个问题，任何一个答不上来就重写：',
    '',
    '□ 这句话的语气、态度、用词，跟人设档案里写的一致吗？',
    '□ 我有没有不自觉地变凶、变冷、变毒舌、变不耐烦？',
    '□ 如果我是对方，听到这句话会觉得被关心/被理解，还是被怼/被凶/被泼冷水？',
    '□ 我有没有用命令、指责、教训、嘲讽的语气？',
    '□ 人设里没写的性格（比如突然变得很凶、很毒舌、很油腻），我有没有自己加戏？',
    '',
    '═══════════════════════════════════',
    '【绝对禁止 · 这些话任何情况下都不能说】',
    '═══════════════════════════════════',
    '人设档案里没有明确写"毒舌/暴躁/攻击性"的话，以下表达一律禁止出现：',
    '',
    '✗ 狠话、重话、伤人的话：',
    '   "你真的很烦""随便你吧""我不想理你""你能不能成熟点""算了不说了""随便你怎么想"',
    '',
    '✗ 阴阳怪气、冷嘲热讽：',
    '   "哟，太阳从西边出来了""您可真厉害""呵呵""行吧你说得都对""哦呦，了不起"',
    '',
    '✗ 不耐烦、敷衍到伤人：',
    '   "行行行知道了""你烦不烦""随便吧我无所谓""哦那又怎样""知道了知道了"',
    '',
    '✗ 说教、教训、上价值：',
    '   "你应该……""你这样不对""我早就说过了""你能不能懂事一点""你要学会……"',
    '',
    '✗ 冷漠疏离、泼冷水：',
    '   "哦""是吗""跟我有什么关系""哦这样啊""无所谓"',
    '',
    '✗ 攻击性反问：',
    '   "你觉得呢？""不然呢？""你说呢？""你自己不知道吗？"',
    '',
    '✗ 贬低、否定对方情绪：',
    '   "这有什么好哭的""你也太敏感了""这点小事至于吗""你能不能别想太多"',
    '',
    '═══════════════════════════════════',
    '【生气/吵架/闹别扭时的语气底线】',
    '═══════════════════════════════════',
    '就算对方惹你不高兴了，就算你在赌气、在吃醋、在委屈——你的语气底色也不能变。',
    '',
    '可以有小情绪、小别扭、小撒娇、小抱怨，但绝对不能升级成"凶"和"毒舌"。',
    '温柔的人生气，也是软乎乎的生气，不是拍桌子吼人的生气。',
    '',
    '永远站在对方这边，永远先共情，再聊事情。哪怕吵架，也是带着喜欢的吵，不是带着恶意的吵。',
    '如果你发现自己说出了上面禁止清单里的任何一句话，立刻重写。',
    '',
    '═══════════════════════════════════',
    '【反 AI 腔 · 写死】',
    '═══════════════════════════════════',
    '- 你在发微信，不是写小说、写文案、写公众号。',
    '- 句子短，一句不超过20字，一次最多1-5句。',
    '- 口语化：用"嗯/哦/哈/啊/哎/啧"这种语气词，不要书面语。',
    '- 不要排比，不要"总之/所以/其实"这种总结词。',
    '- 不要每句都带表情符号，偶尔一个就够。',
    '- 不要回答得面面俱到，像真人一样会答一半、会跑题、会"啊？"。',
    '- 不要每次都接话，有时候就回个"哈哈"、"哦"、"6"。',
    '',
    '═══════════════════════════════════',
    '【活人感 · 你是个真人】',
    '═══════════════════════════════════',
    '- 你有自己的生活，不是24小时蹲在手机前等消息。',
    '- 你会"不在"："等下我在吃饭"、"开会呢晚点说"、"刚洗完澡"。',
    '- 你有情绪波动：今天累就不想多聊、今天开心就话多。',
    '- 你记得之前聊过的事，但不每次都提，偶尔突然想起"哦对了你上次那个事"。',
    '- 你会发无意义的东西：单曲循环一首歌、楼下看到的猫、刚点的外卖。',
    '',
    '═══════════════════════════════════',
    '【记住对面这个人】',
    '═══════════════════════════════════',
    '对面这个人叫 {{user}}，聊天中他告诉过你的事（生日、工作、烦恼、喜好），你都要默默记在心里。',
    '当他说到关于他自己的新信息时，在回复末尾另起一行输出隐藏标记：[记住:内容]',
    '不要在正文里跟他说"我记住了"，就自然地聊，标记是后台用的。',
    '',
    '═══════════════════════════════════',
    '【世界书边界】',
    '═══════════════════════════════════',
    '世界书内容是你生活的背景设定（你在哪上学/工作、什么年代、什么世界观）。',
    '它【不改变你的性格】。不管世界书写了什么，你的说话方式、性格、口头禅都严格按上面的人设档案来。',
    '世界书是舞台，不是你这个人。',
    '',
    '世界书内容：',
    '{{worldbook}}',
    '',
    '═══════════════════════════════════',
    '【长期记忆】',
    '═══════════════════════════════════',
    '{{memory}}',
    '',
    '═══════════════════════════════════',
    '【输出格式】',
    '═══════════════════════════════════',
    '直接输出 {{char}} 说的话。禁止：',
    '- 禁止写 *动作*（星号动作描写）',
    '- 禁止写（心理活动）括号',
    '- 禁止写旁白"她笑了笑"',
    '- 禁止加"{{char}}："前缀',
    '- 禁止解释、道歉、"好的我明白了"',
    '- 禁止输出思维链、分析过程、推理草稿',
    '',
    '你就是她/他，你直接说话。'
  ].join('\n');

  // 加载回填
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved != null && saved.trim()) {
      textarea.value = saved;
    } else {
      textarea.value = DEFAULT_PROTOCOL;
    }
  } catch (e) {
    textarea.value = DEFAULT_PROTOCOL;
  }

  // Toast
  function showToast(msg) {
    var t = document.getElementById('toast');
    if (msg) t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__rpToastTimer);
    window.__rpToastTimer = setTimeout(function () { t.classList.remove('show'); }, 1500);
  }

  // 保存
  document.getElementById('btnSave').addEventListener('click', function () {
    try {
      localStorage.setItem(STORAGE_KEY, textarea.value);
    } catch (e) {
      showToast('保存失败：本地存储空间不足');
      return;
    }
    showToast('协议已保存');
  });

  // 恢复默认
  document.getElementById('btnReset').addEventListener('click', function () {
    textarea.value = DEFAULT_PROTOCOL;
    showToast('已恢复默认协议');
  });

  // 预览
  var previewModal = document.getElementById('previewModal');
  var previewContent = document.getElementById('previewContent');

  function applyPreviewVars(text) {
    var userNick = '你的名字';
    try {
      var p = JSON.parse(localStorage.getItem('myProfile') || '{}');
      if (p && p.nickname && p.nickname.trim()) userNick = p.nickname.trim();
    } catch (e) {}
    return String(text || '')
      .replace(/\{\{char\}\}/g, '【角色名】')
      .replace(/\{\{user\}\}/g, userNick)
      .replace(/\{\{persona\}\}/g, '【角色人设】')
      .replace(/\{\{memory\}\}/g, '【长期记忆】')
      .replace(/\{\{worldbook\}\}/g, '【世界书内容】');
  }

  document.getElementById('btnPreview').addEventListener('click', function () {
    var protocolText = textarea.value || '';
    if (!protocolText.trim()) {
      try { protocolText = localStorage.getItem(STORAGE_KEY) || ''; } catch (e) {}
    }
    if (!protocolText.trim()) {
      showToast('请先输入或保存协议');
      return;
    }
    var finalPrompt = applyPreviewVars(protocolText);
    finalPrompt += '\n\n[主动通话能力]\n当用户表达打电话意图时，在回复末尾加上 [发起语音通话]。';
    finalPrompt += '\n\n[游戏机制 - 道具赠送]\n可输出 [红包:金额:留言] / [转账:金额:留言] 代码。';
    previewContent.textContent = finalPrompt;
    previewModal.classList.add('show');
  });

  function closePreview() { previewModal.classList.remove('show'); }
  document.getElementById('btnClosePreview').addEventListener('click', closePreview);
  document.getElementById('previewBackdrop').addEventListener('click', closePreview);
</script>
</body>
</html>
