<script>
(function(){'use strict';const phone=document.getElementById('phone'),nav=document.getElementById('nav'),screens=document.getElementById('screens');const svg=name=>`<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${name}"></use></svg>`;const art=(kind='botanical')=>`<div class="print-photo"><svg class="botanic" viewBox="0 0 400 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#botanical"/></svg><span class="photo-label">FIG. 0${kind==='botanical'?1:2} — ARCHIVE</span><span class="print-caption">AN ORDINARY DAY / 11.12</span></div>`;const portrait=(i=0)=>`<div class="portrait ${'abcd'[i%4]}" aria-hidden="true"><svg viewBox="0 0 70 70"><use href="#portrait${'ABCD'[i%4]}"/></svg></div>`;const escape=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const iconButton=(icon,action,label,extra='')=>`<button class="ico tactile ${extra}" data-act="${action}" aria-label="${label}" title="${label}">${svg(icon)}</button>`;
const threads=[{id:'a',name:'林舟',preview:'我把那张照片留下来了。',time:'09:28',unread:1,group:false,avatar:0},{id:'b',name:'许知夏',preview:'刚走过花店，突然想到你。',time:'08:16',unread:0,group:false,avatar:1},{id:'c',name:'周末慢谈',preview:'乔宁：今晚的计划定了吗？',time:'昨天',unread:1,group:true,avatar:2},{id:'d',name:'乔宁',preview:'给你听一首我最近喜欢的歌。',time:'周二',unread:0,group:false,avatar:3}];const posts=[{id:1,name:'林舟',avatar:0,time:'2 小时前',text:'偶然在旧书里翻到了去年秋天的车票。\n原来日子真的会留下痕迹。',image:true,likes:12,liked:false,comments:['许知夏：这个光影真好看。']},{id:2,name:'许知夏',avatar:1,time:'昨天 · 20:18',text:'有时候晚一点回家也很好。街灯亮起来以后，城市像另一封信。',image:false,likes:8,liked:false,comments:[]},{id:3,name:'你',avatar:3,time:'11 月 10 日',text:'把今天收藏进小小的日子里。',image:true,likes:5,liked:false,comments:['林舟：这张照片很像电影。']}];const store={screen:'chats',previous:'chats',tone:'light',tab:'all',momentTab:'all',homeTab:'all',person:'a',draft:'',messages:{a:[{who:'them',text:'刚才翻到一张旧照片。',when:'09:23'},{who:'them',text:'那时的风好像比现在轻一些。',when:''},{who:'me',text:'你还留着吗？',when:'09:26'},{who:'them',text:'留着呢。等你有空，给你看。',when:'09:28'}],b:[{who:'them',text:'路边的花开了。',when:'08:16'}],c:[{who:'them',text:'今晚八点，大家都有空吗？',when:'昨天'}],d:[{who:'them',text:'有一首很适合夜里的歌。',when:'周二'}]},tool:'',drawer:false,sheet:'',searchText:'',coverUrl:'',likedPosts:new Set()};
function top(title='CHATS',left='menu',right='search'){return `<header class="topbar"><div class="top-actions">${iconButton(left,left,left==='menu'?'打开侧栏':'返回')}${iconButton('tone','tone','切换黑白模式','round-switch')}</div><span class="top-title">${title}</span><div class="top-actions right">${iconButton(right,right,'搜索')}${iconButton('plus','add','新增')}</div></header>`}
function renderNav(){let active=store.screen==='detail'?'chats':store.screen==='home'?'me':store.screen;nav.innerHTML=[['chats','chat','聊天'],['contacts','people','联系人'],['moments','image','空间'],['me','me','我的']].map(([key,icon,label])=>`<button class="nav-btn ${active===key?'active':''}" data-page="${key}" aria-label="${label}" aria-current="${active===key?'page':'false'}"><span class="icon-shell">${svg(icon)}</span><small>${label}</small></button>`).join('');nav.classList.toggle('hide',store.screen==='detail')}
function renderChats(){const visible=threads.filter(t=>store.tab==='all'||(store.tab==='group'?t.group:!t.group));document.getElementById('chats').innerHTML=top('CHATS')+`<div class="intro"><div><span class="eyebrow">PERSONAL JOURNAL / 001</span><h1>Messages<i>.</i></h1></div><span class="date">THURSDAY<br>NOV 12, 2026</span></div><div class="hero-composition"><div>${art()}</div><div class="hero-side"><span class="eyebrow">NOTES / 07</span><div class="hero-word">Still<br>here.</div><p>一个温柔的停顿，<br>一些正在发生的日常。</p><span class="number">EST. NOVEMBER</span></div></div><div class="horizontal-title"><h2>Recent messages</h2><span>0${threads.length} / RECENT</span></div><div class="thin-tabs" role="tablist" aria-label="会话类型">${[['all','全部'],['private','私聊'],['group','群聊']].map(([k,n])=>`<button role="tab" aria-selected="${store.tab===k}" class="thin-tab ${store.tab===k?'active':''}" data-filter="${k}">${n}</button>`).join('')}</div><div id="threadList">${visible.map(t=>`<button class="thread" data-person="${t.id}">${portrait(t.avatar)}<span class="meta"><span class="meta-head"><strong class="name">${t.name}</strong><span class="time">${t.time}</span></span><span class="preview">${t.preview}</span></span>${t.unread?'<span class="unread"></span>':''}</button>`).join('')}</div><div class="music-strip"><div class="music-cover">${art()}</div><div class="music-copy"><strong>Notes on a quiet day</strong><small>MUSIC / OPEN PLAYER</small></div>${iconButton('music','music','试听音乐')}</div><p class="eyebrow" style="text-align:center;margin:16px 0 0;letter-spacing:.12em">DEMO DATA · NO ACCOUNT SYNC</p>`}
function renderDetail(){const contact=threads.find(t=>t.id===store.person)||threads[0];document.getElementById('detail').innerHTML=`<header class="detail-top"><div>${iconButton('back','back','返回聊天首页')}</div><div class="titlebox"><strong>${contact.name}</strong><small>ONLINE · AT THE MOMENT</small></div><div class="top-actions right">${iconButton('search','search','搜索聊天')}${iconButton('dots','more','更多')}</div></header><div class="detail-cover">${art()}<div class="detail-avatar">${portrait(contact.avatar)}</div><div class="detail-info">${contact.name} &amp; YOU</div></div><div class="story-kicker">TODAY / 11.12</div><div class="message-list" id="messageList">${store.messages[contact.id].map((m,i)=>`<div class="message ${m.who==='me'?'self':''}">${m.who==='them'?`<div class="mini-avatar">${portrait(contact.avatar)}</div>`:''}<div class="bubble" data-quote="${i}">${escape(m.text)}</div><span class="when">${m.when||''}</span></div>`).join('')}</div><p class="system-note">— 文字留白，记录每一次真实的对话 —</p><div class="receipt">${svg('heart')} 留言已保存 · 演示中</div>`;renderComposer()}
function renderComposer(){const el=document.getElementById('composerWrap');el.hidden=store.screen!=='detail';if(store.screen!=='detail')return;el.innerHTML=`<div class="tool-panel ${store.tool?'open':''}" id="toolPanel">${getToolContent()}</div><div class="quick-tool-row">${[['image','photo','照片'],['camera','sticker','表情'],['mic','voice','语音'],['pin','location','位置'],['plus','moretools','更多']].map(([icon,action,label])=>`<button class="${store.tool===action?'active':''}" data-tool="${action}" aria-label="${label}">${svg(icon)}<span>${label}</span></button>`).join('')}</div><form class="composer-row" id="sendForm"><textarea class="composer-input" id="composerInput" rows="1" placeholder="说点什么…" aria-label="输入消息">${escape(store.draft)}</textarea><button class="ico composer-send" type="submit" aria-label="发送消息">${svg('send')}</button></form>`}
function getToolContent(){const n=store.tool; if(!n)return '';const title=({'photo':'PHOTO ALBUM / 选择照片','sticker':'STICKERS / 贴纸','voice':'VOICE NOTES / 语音','location':'LOCATION / 位置','moretools':'QUICK ACCESS / 更多'})[n];let inner='';if(n==='photo')inner=`<div class="photo-tiles">${[1,2,3,4].map(i=>`<button data-tool-item="photo" aria-label="发送照片 ${i}">${art()}</button>`).join('')}</div>`;if(n==='sticker')inner='<div class="sticker-strip">'+['☼','✧','✿','♡','☾'].map(x=>`<button data-tool-item="sticker">${x}</button>`).join('')+'</div>';if(n==='voice')inner='<p style="color:var(--muted);font-size:11px">演示中不录制真实音频。点击下方可发送语音占位消息。</p><button class="plain-action" data-tool-item="voice">发送示例语音</button>';if(n==='location')inner='<p style="color:var(--muted);font-size:11px">演示位置：旧书店附近 · 不读取设备定位。</p><button class="plain-action" data-tool-item="location">发送虚构位置</button>';if(n==='moretools')inner=`<div class="tool-tiles">${[['bookmark','quote','引用'],['music','music','听歌'],['share','share','分享'],['settings','settings','设置']].map(([icon,a,l])=>`<button data-tool-item="${a}">${svg(icon)}${l}</button>`).join('')}</div>`;return `<div class="row-label"><span>${title}</span><button data-tool="close" aria-label="收起工具">${svg('close')}</button></div>${inner}`}
function renderMoments(){document.getElementById('moments').innerHTML=top('FIELD NOTES')+`<div class="page-mast"><div class="eyebrow">SOCIAL / LITTLE MOMENTS</div><h1 class="headline">Life, lately.</h1><div class="mini-desc"><span>发生在身边的事</span><span>NOVEMBER · 2026</span></div></div><div class="moments-hero">${art()}<div class="copy"><span class="eyebrow">COLLECTION</span><strong>Small<br>things<br>matter.</strong><small>记下一些微不足道，<br>却很重要的瞬间。</small></div></div><div class="thin-tabs" role="tablist" aria-label="动态分类">${[['all','全部'],['photo','图文'],['text','文字']].map(([k,t])=>`<button role="tab" aria-selected="${store.momentTab===k}" class="thin-tab ${store.momentTab===k?'active':''}" data-moment-filter="${k}">${t}</button>`).join('')}</div><div id="momentList">${posts.filter(p=>store.momentTab==='all'||(store.momentTab==='photo'?p.image:!p.image)).map(p=>renderPost(p)).join('')}</div>`}
function renderPost(p){return `<article class="post" id="post-${p.id}"><div class="post-head">${portrait(p.avatar)}<span class="info"><strong>${p.name}</strong><small>${p.time}</small></span>${iconButton('dots','postmore','帖子选项')}</div><p class="post-text">${escape(p.text)}</p>${p.image?`<button class="post-image" data-act="expandimage" aria-label="查看动态照片">${art()}</button>`:''}<div class="post-actions"><button data-like="${p.id}" class="${p.liked?'liked':''}">${svg('heart')} ${p.likes}</button><button data-comment="${p.id}">${svg('chat')} ${p.comments.length}</button><button data-share="${p.id}">${svg('share')} 分享</button></div>${p.comments.length?`<div style="color:var(--muted);font-size:10px;margin-top:9px;line-height:1.7">${p.comments.map(escape).join('　·　')}</div>`:''}</article>`}
function renderMe(){document.getElementById('me').innerHTML=top('MY PROFILE')+`<div class="profile-cover">${art()}<button class="cover-edit" data-act="cover">${svg('camera')}　更换封面</button></div><div class="identity">${portrait(3)}<div class="eyebrow">AT THE BEGINNING OF SOMETHING</div><h2>未央</h2><p>把喜欢的日子，慢慢地留下来。</p></div><div class="profile-stats"><div><strong>024</strong><small>记录</small></div><div><strong>012</strong><small>收藏</small></div><div><strong>006</strong><small>好友</small></div></div><div class="eyebrow" style="margin-top:14px">PERSONAL SPACE / 个人空间</div><div class="me-menu">${[['me','openhome','我的主页'],['bookmark','collections','我的收藏'],['image','albums','照片记录'],['music','music','我的音乐'],['settings','settings','外观与设置']].map(([icon,act,name])=>`<button data-act="${act}"><span class="leading">${svg(icon)}${name}</span><span class="arrow">›</span></button>`).join('')}</div><div class="more-home">这是演示专用的个人空间。封面、留言与点赞只在当前页面展示，不会同步或修改你的 MAOMAO 数据。</div>`}
function renderHome(){const own=posts.filter(p=>p.name==='你' || p.image);document.getElementById('home').innerHTML=top('MY SPACE','back')+`<div class="home-cover" id="homeCover">${store.coverUrl?`<div style="background-image:url('${store.coverUrl}');background-position:center;background-size:cover;width:100%;height:100%"></div>`:art()}<span class="overlay-label">MY LITTLE ARCHIVE / VOL.01</span></div><div class="home-identity">${portrait(3)}<div><span class="eyebrow">PERSONAL JOURNAL</span><h2>未央</h2><small>比昨天更加自由一点。</small></div><button style="margin-left:auto" class="ico" data-act="cover" aria-label="编辑封面">${svg('camera')}</button></div><div class="home-tags"><span><strong>08</strong> POSTS</span><span><strong>12</strong> FAVORITES</span><span><strong>06</strong> FRIENDS</span></div><div class="album-head"><h3>Photo notes</h3><button data-home-filter="photo">查看全部照片　→</button></div><div class="album-rail" id="albumRail">${[1,3,1,3,1].map((id,i)=>`<button class="tactile" data-album="${id}" aria-label="查看第${i+1}张照片">${art()}</button>`).join('')}</div><div class="notes-title"><h3>Entries</h3><span class="eyebrow">0${own.length} / RECENT</span></div><div class="thin-tabs" role="tablist" aria-label="主页动态分类">${[['all','全部'],['photo','照片'],['text','文字']].map(([key,label])=>`<button role="tab" class="thin-tab ${store.homeTab===key?'active':''}" aria-selected="${store.homeTab===key}" data-home-filter="${key}">${label}</button>`).join('')}</div><div id="homePosts">${posts.filter(p=>store.homeTab==='all'||(store.homeTab==='photo'?p.image:!p.image)).map(renderPost).join('')}</div>`}
function render(){renderNav();renderChats();renderDetail();renderMoments();renderMe();renderHome();document.querySelectorAll('.screen').forEach(x=>{x.classList.toggle('active',x.dataset.name===store.screen)});document.getElementById('composerWrap').hidden=store.screen!=='detail';document.getElementById('phone').classList.toggle('dark',store.tone==='dark');nav.classList.toggle('hide',store.screen==='detail');}
function show(which){const before=store.screen;store.previous=before;store.screen=which;store.tool='';closeLayers();render();const sc=document.querySelector(`.screen[data-name="${which}"]`);if(sc)sc.scrollTop=0;}
function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function closeLayers(){document.getElementById('overlay').classList.remove('open');document.getElementById('drawer').classList.remove('open');document.getElementById('sheet').classList.remove('open');store.drawer=false;store.sheet=''}
function openDrawer(){document.getElementById('drawer').innerHTML=`<div class="eyebrow">THE LITTLE ARCHIVE / 001</div><h2>Spaces.</h2><div class="drawer-cover">${art()}</div><nav>${[['chats','chat','聊天与消息'],['moments','image','动态与片段'],['home','me','我的主页']].map(([n,i,t])=>`<button data-page="${n}">${svg(i)} ${t}</button>`).join('')}<button data-act="tone">${svg('tone')} 切换深浅外观</button><button data-act="search">${svg('search')} 寻找一段记忆</button></nav><p class="eyebrow" style="margin-top:36px">A COLLECTION OF ORDINARY DAYS</p>`;document.getElementById('overlay').classList.add('open');document.getElementById('drawer').classList.add('open');store.drawer=true}
function openSheet(title,inner,type=''){const s=document.getElementById('sheet');s.innerHTML=`<div class="handle"></div><div class="sheet-heading"><h3>${title}</h3>${iconButton('close','close','关闭')}</div>${inner}`;document.getElementById('overlay').classList.add('open');s.classList.add('open');store.sheet=type}
function doAction(action,el){if(action==='tone'){store.tone=store.tone==='dark'?'light':'dark';phone.classList.toggle('dark',store.tone==='dark');closeLayers();return;}if(action==='menu'){openDrawer();return;}if(action==='close'){closeLayers();return;}if(action==='back'){show(store.screen==='detail'?'chats':store.screen==='home'?'me':'chats');return;}if(action==='search'){openSheet('寻找记录',`<input id="searchInput" placeholder="搜索消息、名字或文字…"><div id="searchResult" class="suggested"></div>`,'search');document.getElementById('searchInput').focus();return;}if(action==='add'){openSheet('发起新的对话',`<div class="suggested">${threads.map(t=>`<button data-person="${t.id}">${t.name}</button>`).join('')}</div>`,'add');return;}if(action==='openhome'){show('home');return;}if(action==='cover'){document.getElementById('coverUpload').click();return;}if(action==='collections'){openSheet('我的收藏',`<div class="me-menu">${[['music','music','音乐收藏'],['image','albums','照片记录'],['bookmark','openhome','我的日常']].map(([icon,a,t])=>`<button data-act="${a}">${svg(icon)}　${t}</button>`).join('')}</div>`,'collection');return;}if(action==='albums'){show('home');setTimeout(()=>document.getElementById('albumRail')?.scrollIntoView({block:'center',behavior:'smooth'}),100);return;}if(action==='music'){openSheet('正在聆听',`<div class="music-strip" style="margin-top:12px"><div class="music-cover">${art()}</div><div class="music-copy"><strong>Notes on a quiet day</strong><small>DEMO MUSIC · NO AUDIO</small></div>${svg('music')}</div><p style="font-size:11px;color:var(--muted)">这里展示的是音乐入口的交互样式；演示不会播放有版权的音乐。</p>`,'music');return;}if(action==='settings'||action==='more'){openSheet('快捷设置',`<div class="tool-tiles"><button data-act="tone">${svg('tone')}切换外观</button><button data-act="collections">${svg('bookmark')}收藏</button><button data-act="search">${svg('search')}搜索</button><button data-act="close">${svg('close')}关闭</button></div>`);return;}if(action==='postmore'){openSheet('帖子选项',`<div class="me-menu"><button data-act="share">${svg('share')}　分享</button><button data-act="close">${svg('bookmark')}　收藏至日记</button></div>`);return;}if(action==='expandimage'){openSheet('照片记忆',`<div style="height:190px;overflow:hidden">${art()}</div>`);return;}if(action==='share'){showToast('演示已准备好分享');return;}if(action==='compose'){show('detail');return;}}
function sendMessage(text,auto=true){text=text.trim();if(!text)return;const id=store.person;const time=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());store.messages[id].push({who:'me',text,when:time});store.draft='';renderDetail();const sc=document.getElementById('detail');sc.scrollTop=sc.scrollHeight;if(auto){setTimeout(()=>{if(store.messages[id])store.messages[id].push({who:'them',text:'嗯，我记下了。慢慢说，我在听。',when:''});if(store.screen==='detail'&&store.person===id){renderDetail();document.getElementById('detail').scrollTop=document.getElementById('detail').scrollHeight}},980)}}
function updateSearch(){const input=document.getElementById('searchInput'),box=document.getElementById('searchResult');if(!input||!box)return;const s=input.value.trim();box.innerHTML=threads.filter(t=>!s||t.name.includes(s)||t.preview.includes(s)).map(t=>`<button data-person="${t.id}">${escape(t.name)}</button>`).join('')||'<small>没有搜索结果</small>'}
phone.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const page=el.dataset.page;if(page==='contacts'){openSheet('选择联系人',`<div class="me-menu">${threads.map(t=>`<button data-person="${t.id}">${portrait(t.avatar)}<span>${t.name}</span><span class="arrow">›</span></button>`).join('')}</div>`,'contacts');return;}if(page){show(page);return;}const person=el.dataset.person;if(person){store.person=person;show('detail');return;}const filter=el.dataset.filter;if(filter){store.tab=filter;renderChats();return;}const momentFilter=el.dataset.momentFilter;if(momentFilter){store.momentTab=momentFilter;renderMoments();return;}const homeFilter=el.dataset.homeFilter;if(homeFilter){store.homeTab=homeFilter;renderHome();return;}const album=el.dataset.album;if(album){store.homeTab='photo';renderHome();const p=document.querySelector('#homePosts .post');if(p){p.scrollIntoView({block:'center',behavior:'smooth'});p.style.outline='1px solid var(--ink)';setTimeout(()=>{p.style.outline=''},1200)}return;}const like=el.dataset.like;if(like){const p=posts.find(v=>v.id===+like);p.liked=!p.liked;p.likes+=p.liked?1:-1;if(store.screen==='moments')renderMoments();else renderHome();return;}const comment=el.dataset.comment;if(comment){const p=posts.find(v=>v.id===+comment);openSheet('评论 · '+p.name,`<form id="commentForm" data-comment-id="${p.id}"><input id="commentInput" placeholder="写一句话…" maxlength="90" required autocomplete="off"><button class="plain-action" type="submit">发送评论</button></form><div style="color:var(--muted);font-size:11px;margin-top:12px">${p.comments.map(escape).join('　/　')||'还没有评论'}</div>`);document.getElementById('commentInput').focus();return;}const share=el.dataset.share;if(share){showToast('分享入口已展开 · 演示版');return;}const tool=el.dataset.tool;if(tool){store.tool=tool==='close'||tool===store.tool?'':tool;renderComposer();return;}const ti=el.dataset.toolItem;if(ti){if(ti==='quote'){showToast('长按消息可以引用原文');store.tool='';renderComposer();return;}if(ti==='music'){doAction('music');return;}if(ti==='share'||ti==='settings'){doAction(ti);return;}sendMessage(ti==='voice'?'[语音消息 · 8秒]':ti==='location'?'[位置 · 旧书店附近]':ti==='photo'?'[照片 · 今天的光影]':`[贴纸 · ${el.textContent.trim()}]`);return;}const act=el.dataset.act;if(act){doAction(act,el);return;}});
phone.addEventListener('submit',e=>{if(e.target.id==='sendForm'){e.preventDefault();const input=document.getElementById('composerInput');sendMessage(input.value)}if(e.target.id==='commentForm'){e.preventDefault();const text=document.getElementById('commentInput').value.trim();if(!text)return;const p=posts.find(v=>v.id===+e.target.dataset.commentId);p.comments.push('你：'+text);closeLayers();if(store.screen==='moments')renderMoments();else renderHome();showToast('评论已添加 · 仅本次预览')}});
phone.addEventListener('keydown',e=>{if(e.target.id==='composerInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(e.target.value)}if(e.key==='Escape')closeLayers()});phone.addEventListener('input',e=>{if(e.target.id==='searchInput')updateSearch();if(e.target.id==='composerInput')store.draft=e.target.value});document.getElementById('overlay').addEventListener('click',closeLayers);document.getElementById('coverUpload').addEventListener('change',e=>{const file=e.target.files?.[0];if(file&&file.type.startsWith('image/')){if(store.coverUrl)URL.revokeObjectURL(store.coverUrl);store.coverUrl=URL.createObjectURL(file);if(store.screen==='home')renderHome();else show('home');showToast('仅预览本地封面，不上传和保存')}});
render();})();
</script></body></html>
