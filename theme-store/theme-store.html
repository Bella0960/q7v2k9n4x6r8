    .product-card{flex:0 0 min(72vw,248px);min-width:0;min-height:296px;scroll-snap-align:start;background:#f7f7f8;border-radius:17px;padding:12px 12px 13px;display:flex;flex-direction:column;gap:10px;overflow:hidden;transform:translateY(0);transition:transform .28s cubic-bezier(.2,.75,.25,1),box-shadow .28s ease,background .28s ease;will-change:transform}
    .product-art{height:112px;background:#fff;border-radius:12px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:15px 12px;overflow:hidden;transition:background .28s ease,transform .28s ease}.product-art:after{content:"";position:absolute;inset:-40% auto -40% -65%;width:42%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);opacity:0;pointer-events:none;transition:transform .65s ease,opacity .25s ease}
    .product-art:before{content:"";position:absolute;left:12px;right:12px;top:11px;height:2px;background:#f0f0f2}
    .art-bubble{position:relative;display:block;max-width:84%;padding:7px 9px;border-radius:12px;font-size:9px;line-height:1.5;z-index:1;transition:transform .32s cubic-bezier(.2,.75,.25,1),box-shadow .32s ease}
    .art-bubble.left{align-self:flex-start;background:#ededf0;color:#222;border-bottom-left-radius:3px}
    .art-bubble.right{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:3px}

    .chat-list-theme-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:0 0 24px}

<body>
  <div class="store-app">
    <header class="topbar">
      <button class="back-mark" type="button" id="backButton" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        <span class="back-copy"><small>RETURN</small><span>返回</span></span>
      </button>
      <div class="top-title"><div class="kicker">STYLE COLLECTION / 01</div><h1>主题商城</h1></div>
      <button class="top-count" type="button" id="myThemesShortcut"><strong id="ownedCount">—</strong><span>我的主题</span></button>
    </header>

    <section class="intro">
      <div class="intro-kicker">A LITTLE CHANGE, A NEW FEELING</div>
      <h2>让每一次对话，<br>都有自己的样子。</h2>
      <p>挑选聊天主题、气泡样式与字体。已经保存的美化预设和字体方案，会自动出现在这里。</p>

      <button class="category-tab" data-category="fonts" type="button">字体 <small>03</small></button>
      <button class="category-tab" data-category="mine" type="button">我的主题 <small>04</small></button>
    </nav>

    <main class="main-content" id="storeContent" aria-live="polite"></main>
    <footer class="store-foot">LOCAL COLLECTION · YOUR SETTINGS STAY ON THIS DEVICE</footer>
  </div>
  <div class="toast" id="storeToast" role="status" aria-live="polite"></div>

  <script>

    var OWN_KEY='maomao_theme_store_owned_v1';

    var categories=['themes','bubbles','fonts','mine'];
    var categoryNames={themes:'主题',bubbles:'聊天气泡',fonts:'字体',mine:'我的主题'};
    var currentCategory='themes';
    var mineFilter='all';
    var fontRecords=[];
    var fontPreviewUrls={};
    var fontFaceStates={};
    var fontPreviewFailures={};
    var bubbleScopeValue='global';
    var toastTimer=null;
    var defaultThemes=[
      {id:'default',name:'原生黑白',eyebrow:'01 / ORIGINAL',desc:'保留当前聊天界面的黑白基调与原有布局。'},

      });
    }

      html+='</div>';
      if(!count)html+='<div class="empty-state"><strong>还没有收录内容</strong><p>获取主题、保存气泡预设或导入字体后，它们都会集中显示在这里。</p></div>';
      html+='<div class="helper-row"><p>已保存的聊天美化预设、字体方案会自动同步到本页。</p><button class="text-link" data-action="refresh" type="button">刷新列表</button></div>';
      return html;
    }
    function updateOwnedCount(){
      var owned=getOwned(),presets=readVisualPresets();
      var activeBuiltinCount=builtinBubblePresets.filter(function(p){return isBubblePresetActive(p,bubbleScopeValue);}).length;
      document.getElementById('ownedCount').textContent=String(owned.length+presets.length+activeBuiltinCount+fontRecords.length+(activeFontUrl()?1:0)).padStart(2,'0');
    }
    function enableProductDrag(){
      var rail=document.querySelector('.product-grid');if(!rail||rail.dataset.dragReady)return;
      rail.dataset.dragReady='1';
      rail.tabIndex=0;
      rail.setAttribute('role','region');
      rail.setAttribute('aria-label','主题预览横向列表，可左右滑动或使用键盘方向键浏览');
      var start=null;
      rail.addEventListener('pointerdown',function(event){
        if(event.pointerType!=='mouse'||event.button!==0||event.target.closest('button,a,input,select'))return;
        start={x:event.clientX,scroll:rail.scrollLeft,pointerId:event.pointerId,moved:false};
        try{rail.setPointerCapture(event.pointerId);}catch(e){}
      });
      rail.addEventListener('pointermove',function(event){
        if(!start||event.pointerId!==start.pointerId)return;
        var dx=event.clientX-start.x;
        if(Math.abs(dx)>4){start.moved=true;rail.classList.add('dragging');event.preventDefault();rail.scrollLeft=start.scroll-dx;}
      });
      function end(event){
        if(!start|| (event&&event.pointerId!=null&&event.pointerId!==start.pointerId))return;
        var pointerId=start.pointerId;
        start=null;
        rail.classList.remove('dragging');
        try{if(rail.hasPointerCapture(pointerId))rail.releasePointerCapture(pointerId);}catch(e){}
      }
      rail.addEventListener('pointerup',end);
      rail.addEventListener('pointercancel',end);
      rail.addEventListener('lostpointercapture',end);
      rail.addEventListener('keydown',function(event){
        if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
          event.preventDefault();
          rail.scrollBy({left:(event.key==='ArrowRight'?1:-1)*Math.max(180,rail.clientWidth*.72),behavior:'smooth'});
        }
      });
    }
    function render(){
      var content=document.getElementById('storeContent');
      document.querySelectorAll('.category-tab').forEach(function(button){button.classList.toggle('active',button.dataset.category===currentCategory);});
      if(currentCategory==='themes')content.innerHTML=renderThemes();
      else if(currentCategory==='bubbles')content.innerHTML=renderBubbles();
      else if(currentCategory==='fonts')content.innerHTML=renderFonts();
      else content.innerHTML=renderMine();
      if(currentCategory==='bubbles')fillScope();
      if(currentCategory==='fonts')bindFontSpecimens();
      if(currentCategory==='mine')document.querySelectorAll('[data-filter]').forEach(function(button){button.classList.toggle('active',button.dataset.filter===mineFilter);});
      if(currentCategory==='themes')enableProductDrag();
      updateOwnedCount();
    }
    function setCategory(category){
      if(categories.indexOf(category)<0)return;
      currentCategory=category;render();
      document.getElementById('storeContent').scrollTop=0;
    }
    function applyBubblePreset(id){
      var preset=availableBubblePresets().filter(function(p){return String(p.id)===String(id);})[0];
      if(!preset||!window.ChatBeauty||!ChatBeauty.save){toast('没有找到这条预设，请刷新列表');return;}
      var scope=bubbleScopeValue;
      var data=preset.data||{},payload={},keys=bubbleKeys();
      keys.forEach(function(key){if(Object.prototype.hasOwnProperty.call(data,key))payload[key]=data[key];});
      if(!Object.keys(payload).length){toast('这条预设没有可应用的气泡参数');return;}
      if(!ChatBeauty.save(scope,payload)){toast('应用失败，请检查本机存储空间');return;}
      try{window.dispatchEvent(new CustomEvent('maomao:chat-theme-change',{detail:{scope:scope,presetId:preset.id}}));}catch(e){}
      toast(scope==='global'?'已应用到全部聊天':'已应用到所选角色');
      render();
    }
    function applyChatListTheme(){
      var enabling=getChatListTheme()!=='editorial';
      if(enabling){
        var owned=getOwned();
        if(owned.indexOf('messages-editorial')<0){owned.push('messages-editorial');if(!setOwned(owned)){toast('收录失败，请检查本机存储空间');return;}}
        try{localStorage.setItem(CHAT_LIST_THEME_KEY,'editorial');}catch(e){toast('主题保存失败，请检查本机存储空间');return;}
      }else{
        try{localStorage.removeItem(CHAT_LIST_THEME_KEY);}catch(e){toast('恢复失败，请检查本机存储空间');return;}
      }
      try{window.dispatchEvent(new CustomEvent('maomao:chat-list-theme-change',{detail:{theme:enabling?'editorial':'default'}}));}catch(e){}
      toast(enabling?'已应用「留白 Messages」':'已恢复聊天列表默认样式');
      render();
    }
    function applyTheme(id){
      if(!window.ChatBeauty||!ChatBeauty.setThemePreset){toast('聊天主题模块暂不可用');return;}
      var owned=getOwned();
      if(owned.indexOf(id)<0){owned.push(id);if(!setOwned(owned)){toast('收录失败，请检查本机存储空间');return;}}
      if(!ChatBeauty.setThemePreset(id)){toast('主题应用失败');return;}
      try{window.dispatchEvent(new CustomEvent('maomao:chat-theme-change',{detail:{theme:id}}));}catch(e){}
      toast('已应用「'+(defaultThemes.filter(function(t){return t.id===id;})[0]||{}).name+'」');
      render();
    }
    function openFontDBRecord(id){
      return openFontDB().then(function(db){
        return new Promise(function(resolve,reject){
          var tx=db.transaction(FONT_STORE,'readonly'),req=tx.objectStore(FONT_STORE).get(id);
          req.onsuccess=function(){resolve(req.result||null);};
          req.onerror=function(){reject(req.error||new Error('字体读取失败'));};
          tx.oncomplete=function(){db.close();};
          tx.onerror=function(){db.close();reject(tx.error||new Error('字体读取失败'));};
        });
      });
    }
    function applyFont(id){
      openFontDBRecord(id).then(function(record){
        if(!record){toast('字体方案不存在，可能已被删除');return;}
        try{localStorage.setItem('active_font_preset_id',record.id);localStorage.removeItem('custom_font_url');}catch(e){}
        if(window.MAOMAOFontRuntime){
          if(record.type==='file'&&record.blob)window.MAOMAOFontRuntime.applyBlob(record.blob,record.format||'truetype');
          else if(record.url)window.MAOMAOFontRuntime.applyUrl(record.url,record.format||'woff');
        }
        toast('已应用字体「'+(record.name||'未命名字体')+'」');
        render();
      }).catch(function(){toast('读取字体方案失败');});
    }
    function useSystemFont(){
      try{localStorage.removeItem('active_font_preset_id');localStorage.removeItem('custom_font_url');}catch(e){}
      if(window.MAOMAOFontRuntime)window.MAOMAOFontRuntime.clear();
      toast('已恢复系统默认字体');render();
    }
    function isBlobPreviewUrl(url){return typeof url==='string'&&/^blob:/.test(url);}
    /* IndexedDB 每次读取都会返回新的 Blob 实例，不能用对象引用判断记录是否变化。 */
    function previewIdentity(record){
      if(record.type==='file'&&record.blob){
        return 'blob:'+(record.blob.size||0)+':'+(record.createdAt||0)+':'+(record.blob.type||'');
      }
      return 'url:'+(record.url||'');
    }
    /* 释放单个字体预览：撤销 ObjectURL、注销 FontFace、清空状态。 */
    function releaseFontPreview(cacheKey){
      var state=fontFaceStates[cacheKey];
      if(state&&state.face&&document.fonts&&document.fonts.delete){
        try{document.fonts.delete(state.face);}catch(e){}
      }
      delete fontFaceStates[cacheKey];
      var url=fontPreviewUrls[cacheKey];
      if(isBlobPreviewUrl(url)){
        try{URL.revokeObjectURL(url);}catch(e){}
      }
      delete fontPreviewUrls[cacheKey];
    }
    /* 字体记录删除、刷新或记录内容变化后，回收不再对应任何记录的预览资源。 */
    function pruneFontPreviews(){
      var live={};
      fontRecords.forEach(function(record){live[String(record.id)]=record;});
      Object.keys(fontFaceStates).forEach(function(cacheKey){
        var record=live[cacheKey];
        if(!record){releaseFontPreview(cacheKey);delete fontPreviewFailures[cacheKey];return;}
        var state=fontFaceStates[cacheKey];
        if(state.identity!==previewIdentity(record)){releaseFontPreview(cacheKey);delete fontPreviewFailures[cacheKey];}
      });
      Object.keys(fontPreviewUrls).forEach(function(cacheKey){
        var record=live[cacheKey];
        if(!record){releaseFontPreview(cacheKey);delete fontPreviewFailures[cacheKey];return;}
        var source=fontPreviewUrls[cacheKey];
        if(isBlobPreviewUrl(source)){
          if(!(record.type==='file'&&record.blob)){releaseFontPreview(cacheKey);delete fontPreviewFailures[cacheKey];}
        }else if(record.url!==source){
          releaseFontPreview(cacheKey);delete fontPreviewFailures[cacheKey];
        }
      });
      Object.keys(fontPreviewFailures).forEach(function(cacheKey){
        var record=live[cacheKey];
        if(!record||previewIdentity(record)!==fontPreviewFailures[cacheKey])delete fontPreviewFailures[cacheKey];
      });
    }
    function applyFontPreviewFamily(cacheKey,family){
      document.querySelectorAll('[data-font-specimen]').forEach(function(node){
        if(String(node.dataset.fontSpecimen)===cacheKey)node.style.fontFamily='"'+family+'",sans-serif';
      });
    }
    function bindFontSpecimens(){
      if(!window.FontFace||!window.URL||!URL.createObjectURL)return;
      pruneFontPreviews();
      document.querySelectorAll('[data-font-specimen]').forEach(function(el){
        var cacheKey=String(el.dataset.fontSpecimen);
        var record=fontRecords.filter(function(r){return String(r.id)===cacheKey;})[0];
        if(!record)return;
        var family='StorePreview_'+cacheKey.replace(/[^a-z0-9_-]/gi,'');
        /* 同一字体只创建一个 FontFace 并加载一次；列表重绘/切换分类时复用结果。 */
        var state=fontFaceStates[cacheKey];
        if(state&&state.ready){el.style.fontFamily='"'+family+'",sans-serif';return;}
        if(state)return;
        /* 同一方案已知加载失败时不再重复解码；记录变化或刷新后由 pruneFontPreviews 清除。 */
        if(fontPreviewFailures[cacheKey]===previewIdentity(record))return;
        if(!fontPreviewUrls[cacheKey])fontPreviewUrls[cacheKey]=record.type==='file'&&record.blob?URL.createObjectURL(record.blob):(record.url||'');
        var source=fontPreviewUrls[cacheKey];if(!source){delete fontPreviewUrls[cacheKey];return;}
        state=fontFaceStates[cacheKey]={
          family:family,ready:false,face:null,identity:previewIdentity(record)
        };
        var face;
        try{face=new FontFace(family,'url("'+String(source).replace(/["']/g,'')+'")');}catch(e){releaseFontPreview(cacheKey);return;}
        state.face=face;
        face.load().then(function(loaded){
          /* 加载期间方案被删除/刷新：不再注册字体，也不再触碰旧 DOM 节点。 */
          if(fontFaceStates[cacheKey]!==state)return;
          try{document.fonts.add(loaded);}catch(e){}
          state.ready=true;
          state.face=loaded;
          delete fontPreviewFailures[cacheKey];
          applyFontPreviewFamily(cacheKey,family);
        }).catch(function(){
          /* 加载失败：标记失败并撤销本次创建的 ObjectURL，后续重绘不再重复解码。 */
          if(fontFaceStates[cacheKey]===state){
            fontPreviewFailures[cacheKey]=previewIdentity(record);
            releaseFontPreview(cacheKey);
          }
        });
      });
    }
    function openPage(relative){
      window.location.href=relative;
    }
    document.getElementById('categoryNav').addEventListener('click',function(event){
      var button=event.target.closest('[data-category]');if(button)setCategory(button.dataset.category);
    });
    document.getElementById('myThemesShortcut').addEventListener('click',function(){setCategory('mine');});
    document.getElementById('backButton').addEventListener('click',function(){
      if(window.history.length>1)window.history.back();else openPage('../index.html');
    });
    document.getElementById('storeContent').addEventListener('click',function(event){
      var filter=event.target.closest('[data-filter]');
      if(filter){mineFilter=filter.dataset.filter;render();return;}
      var select=event.target.closest('#bubbleScope');
      if(select){return;}
      var action=event.target.closest('[data-action]');if(!action)return;
      var id=action.dataset.id;
      if(action.dataset.action==='chat-list-theme-toggle')applyChatListTheme();
      else if(action.dataset.action==='theme-apply')applyTheme(id);
      else if(action.dataset.action==='bubble-apply')applyBubblePreset(id);
      else if(action.dataset.action==='font-apply')applyFont(id);
      else if(action.dataset.action==='font-default')useSystemFont();
      else if(action.dataset.action==='open-beauty')openPage('../beauty/beauty.html');
      else if(action.dataset.action==='open-font-settings')openPage('../settings/font-settings.html');
      else if(action.dataset.action==='refresh'){refreshAll();}
    });
    document.getElementById('storeContent').addEventListener('change',function(event){
      if(event.target&&event.target.id==='bubbleScope'){bubbleScopeValue=event.target.value||'global';render();}
    });
    document.getElementById('storeContent').addEventListener('touchstart',function(event){
      if(event.target.closest&&event.target.closest('.product-grid')){this._swipeX=null;this._swipeY=null;return;}
      if(!event.touches||!event.touches.length)return;
      this._swipeX=event.touches[0].clientX;this._swipeY=event.touches[0].clientY;
    },{passive:true});
    document.getElementById('storeContent').addEventListener('touchend',function(event){
      if(this._swipeX==null||!event.changedTouches||!event.changedTouches.length)return;
      var dx=event.changedTouches[0].clientX-this._swipeX,dy=event.changedTouches[0].clientY-this._swipeY;
      this._swipeX=null;this._swipeY=null;
      if(Math.abs(dx)>75&&Math.abs(dy)<55){
        var index=categories.indexOf(currentCategory),next=index+(dx<0?1:-1);
        if(next>=0&&next<categories.length)setCategory(categories[next]);
      }
    },{passive:true});
    function refreshAll(){
      loadFonts().then(function(){render();});
      if(currentCategory==='bubbles'||currentCategory==='mine')render();
    }
    window.addEventListener('pageshow',refreshAll);
    window.addEventListener('storage',function(event){
      if(!event.key||[VISUAL_KEY,DELETED_KEY,'beauty_chat_global_v1','maomao_chat_theme_preset','active_font_preset_id',OWN_KEY,CHAT_LIST_THEME_KEY].indexOf(event.key)>=0)refreshAll();
    });
    document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshAll();});
    /* 页面卸载/进入后台缓存时释放全部预览资源，避免 ObjectURL 与 FontFace 常驻。 */
    window.addEventListener('pagehide',function(){
      Object.keys(fontFaceStates).concat(Object.keys(fontPreviewUrls)).forEach(function(key){releaseFontPreview(key);});
    });
    loadFonts().then(function(){render();bindFontSpecimens();});
  })();
  </script>
</body>
