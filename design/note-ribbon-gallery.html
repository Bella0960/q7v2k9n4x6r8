<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小手机 · 音符丝带 / 记忆长廊</title>
<style>
  /* ============================================================
     设计基调：极致克制的黑白 + 毛玻璃（Glassmorphism）
     仅用灰阶，无彩色；核心交互区用半透明磨砂质感。
     ============================================================ */
  :root{
    --paper:#F4F3F0;          /* 干净浅色底 */
    --paper-2:#ECEAE5;
    --ink:#16161A;            /* 近黑文字 */
    --ink-soft:#5B5B60;       /* 次级灰 */
    --hair:rgba(20,20,26,.10);/* 发丝分隔线 */
    --glass:rgba(255,255,255,.45);
    --glass-line:rgba(255,255,255,.65);
    --glass-shadow:0 24px 60px -24px rgba(20,20,26,.35);
    --serif:"Noto Serif SC","Songti SC",Georgia,serif;
    --sans:"Inter","Noto Sans SC",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    /* 极淡的灰阶色块，给毛玻璃一点可"磨"的内容 */
    background-image:
      radial-gradient(60vw 60vw at 12% -5%, rgba(0,0,0,.05), transparent 60%),
      radial-gradient(50vw 50vw at 100% 30%, rgba(0,0,0,.04), transparent 55%),
      radial-gradient(55vw 55vw at 40% 110%, rgba(0,0,0,.05), transparent 60%);
  }

  /* ============ 1. 音符丝带 Preloader ============ */
  .preloader{
    position:fixed; inset:0; z-index:100; background:var(--paper);
    display:grid; place-items:center; transition:opacity .6s ease, visibility .6s;
  }
  .preloader.done{ opacity:0; visibility:hidden; }
  .preloader .ribbon-wrap{ width:200px; }
  .preloader .cap{
    margin-top:22px; text-align:center; font-size:12px; letter-spacing:4px;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .ribbon-path{
    fill:none; stroke:url(#ribbonGrad); stroke-width:3.2; stroke-linecap:round;
    filter:url(#softShadow);
  }

  /* ============ Hero ============ */
  .hero{
    position:relative; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:80px 24px;
    overflow:hidden;
  }
  .hero .ribbon-bg{
    position:absolute; top:50%; left:50%; width:min(720px,92vw);
    transform:translate(-50%,-50%); opacity:.5; pointer-events:none;
    animation:float 9s ease-in-out infinite;   /* 微弱浮动 */
  }
  .hero .ribbon-bg path{
    fill:none; stroke:url(#ribbonGrad); stroke-width:2.4; stroke-linecap:round;
    filter:drop-shadow(0 0 18px rgba(20,20,26,.18));  /* 柔和渐变阴影 */
    animation:breathe 5s ease-in-out infinite;          /* 呼吸灯 */
  }
  .hero .eyebrow{ font-size:12px; letter-spacing:5px; text-transform:uppercase; color:var(--ink-soft); position:relative; }
  .hero h1{
    font-family:var(--serif); font-weight:600; font-size:clamp(38px,7vw,76px);
    line-height:1.08; margin:18px 0 14px; letter-spacing:2px; position:relative;
  }
  .hero p.sub{ font-size:clamp(15px,2vw,18px); color:var(--ink-soft); letter-spacing:3px; position:relative; }
  .scroll-hint{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:3px; color:var(--ink-soft); text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .scroll-hint .line{ width:1px; height:34px; background:linear-gradient(var(--ink-soft),transparent); animation:drop 2s infinite; }

  /* ============ 2. 记忆长廊 / S 型故事流 ============ */
  .gallery-section{ max-width:1100px; margin:0 auto; padding:40px 24px 120px; }
  .section-head{ text-align:center; margin-bottom:10px; }
  .section-head .eyebrow{ font-size:11px; letter-spacing:5px; text-transform:uppercase; color:var(--ink-soft); }
  .section-head h2{ font-family:var(--serif); font-size:clamp(26px,4vw,40px); font-weight:600; letter-spacing:2px; margin-top:8px; }

  .gallery{ position:relative; height:1500px; margin-top:30px; }
  .gallery svg.spine{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .gallery svg.spine path{ fill:none; stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; }
  .node{
    position:absolute; transform:translate(-50%,-50%) translateY(24px);
    opacity:0; transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);
    width:min(320px,80vw); will-change:transform,opacity;
  }
  .node.in{ opacity:1; transform:translate(-50%,-50%) translateY(0); }
  .node .connector{ position:absolute; top:50%; width:9px; height:9px; border-radius:50%;
    background:var(--paper); border:1.5px solid var(--ink); transform:translateY(-50%); }

  /* 毛玻璃通用卡片 */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
    backdrop-filter:blur(16px) saturate(120%);
    border:1px solid var(--glass-line);
    box-shadow:var(--glass-shadow);
    border-radius:20px; padding:20px 22px;
  }
  /* 变体 A：对话气泡 */
  .bubble{ position:relative; }
  .bubble .who{ font-size:11px; letter-spacing:2px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px; }
  .bubble .text{ font-family:var(--serif); font-size:18px; line-height:1.55; }
  .bubble .tail{ position:absolute; bottom:-9px; width:18px; height:18px; background:var(--glass);
    border-right:1px solid var(--glass-line); border-bottom:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); transform:rotate(45deg); }
  /* 变体 B：功能模块卡 */
  .module .tag{ font-size:11px; letter-spacing:2px; color:var(--ink-soft); text-transform:uppercase; }
  .module h3{ font-family:var(--serif); font-size:22px; font-weight:600; margin:6px 0 8px; letter-spacing:1px; }
  .module p{ font-size:14px; line-height:1.7; color:var(--ink-soft); }
  /* 变体 C：时间线节点 */
  .timeline .date{ font-size:12px; letter-spacing:2px; color:var(--ink-soft); }
  .timeline h3{ font-family:var(--serif); font-size:20px; font-weight:600; margin:6px 0 4px; }
  .timeline p{ font-size:13px; color:var(--ink-soft); }

  /* ============ 3. 核心交互区（磨砂主控面板） ============ */
  .console-section{ max-width:900px; margin:0 auto 140px; padding:0 24px; }
  .console{
    background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(130%);
    backdrop-filter:blur(20px) saturate(130%); border:1px solid var(--glass-line);
    box-shadow:var(--glass-shadow); border-radius:28px; padding:30px;
  }
  .console .row{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .console .stat{ flex:1 1 140px; border:1px solid var(--hair); border-radius:16px; padding:16px; background:rgba(255,255,255,.35); }
  .console .stat b{ font-family:var(--serif); font-size:30px; display:block; }
  .console .stat span{ font-size:12px; color:var(--ink-soft); letter-spacing:1px; }
  .console .bar{ height:1px; background:var(--hair); margin:22px 0; }
  .console .cta{ border:1px solid var(--ink); background:transparent; color:var(--ink);
    font-family:var(--sans); font-size:14px; letter-spacing:2px; padding:13px 26px;
    border-radius:14px; cursor:pointer; transition:background .2s,color .2s; }
  .console .cta:hover{ background:var(--ink); color:var(--paper); }
  .console .cta:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  footer{ text-align:center; padding:40px 24px 70px; color:var(--ink-soft); font-size:12px; letter-spacing:2px; }

  /* ============ 动效 ============ */
  @keyframes float{ 0%,100%{ transform:translate(-50%,-50%) translateY(0); } 50%{ transform:translate(-50%,-50%) translateY(-14px); } }
  @keyframes breathe{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  @keyframes drop{ 0%{ transform:scaleY(.2); transform-origin:top; opacity:0; } 40%{ opacity:1; } 100%{ transform:scaleY(1); transform-origin:top; opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .node{ opacity:1; transform:translate(-50%,-50%); }
    .preloader{ display:none; }
  }
  @media (max-width:680px){
    .gallery{ height:1700px; }
    .node{ width:78vw; }
  }
</style>
</head>
<body>

<!-- 共享 SVG 渐变与柔影定义 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ribbonGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9A9A9E"/>
      <stop offset="0.5" stop-color="#3A3A40"/>
      <stop offset="1" stop-color="#16161A"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16161A" flood-opacity="0.25"/>
    </filter>
  </defs>
</svg>

<!-- ===== 1. 音符丝带 Preloader ===== -->
<div class="preloader" id="preloader">
  <div class="ribbon-wrap">
    <svg viewBox="0 0 200 320" aria-hidden="true">
      <path class="ribbon-path" id="preRibbon"
        d="M100,310 C70,272 132,244 100,206 C68,168 132,140 100,102 C82,76 122,48 100,16"/>
    </svg>
    <div class="cap">正在调音</div>
  </div>
</div>

<!-- ===== Hero ===== -->
<header class="hero">
  <svg class="ribbon-bg" viewBox="0 0 200 320" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
    <path d="M100,310 C70,272 132,244 100,206 C68,168 132,140 100,102 C82,76 122,48 100,16"/>
  </svg>
  <div class="eyebrow">一部为 AI 角色而生的手机</div>
  <h1>把每一次对话<br>谱成记忆</h1>
  <p class="sub">聊 天 · 赴 约 · 世 界 书 · 记 忆 空 间</p>
  <div class="scroll-hint"><span>向下滚动</span><span class="line"></span></div>
</header>

<!-- ===== 2. 记忆长廊 / S 型故事流 ===== -->
<section class="gallery-section">
  <div class="section-head">
    <div class="eyebrow">Memory Gallery</div>
    <h2>记忆长廊</h2>
  </div>

  <div class="gallery" id="gallery">
    <svg class="spine" id="spine" preserveAspectRatio="none" aria-hidden="true"><path id="spinePath"/></svg>
    <!-- 节点由 JS 沿 S 曲线生成 -->
  </div>
</section>

<!-- ===== 3. 核心交互区：磨砂主控面板 ===== -->
<section class="console-section">
  <div class="console">
    <div class="row">
      <div class="stat"><b>12</b><span>今日对话</span></div>
      <div class="stat"><b>38</b><span>沉淀记忆</span></div>
      <div class="stat"><b>1</b><span>今晚赴约</span></div>
    </div>
    <div class="bar"></div>
    <div class="row">
      <span style="font-family:var(--serif);font-size:18px;flex:1">和你的角色，继续未完的对话。</span>
      <button class="cta" type="button">打开小手机</button>
    </div>
  </div>
</section>

<footer>小手机 · 纯原生 Web · 黑白克制 / 毛玻璃质感</footer>

<script>
  /* ===================== Preloader：丝带描绘 ===================== */
  const preRibbon = document.getElementById('preRibbon');
  const len = preRibbon.getTotalLength();
  preRibbon.style.strokeDasharray = len;
  preRibbon.style.strokeDashoffset = len;
  // 入场描绘动画（约 1.8s 自下而上盘旋升起）
  requestAnimationFrame(() => {
    preRibbon.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1)';
    preRibbon.style.strokeDashoffset = 0;
  });
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) setTimeout(() => document.getElementById('preloader').classList.add('done'), 2200);

  /* ===================== 2. S 型故事流生成 ===================== */
  const gallery = document.getElementById('gallery');
  const spinePath = document.getElementById('spinePath');
  // 内容：对话气泡 / 功能模块 / 时间线 交替错落
  const NODES = [
    { type:'bubble', who:'毛毛', text:'今天也辛苦啦，记得喝口水再睡。' },
    { type:'timeline', date:'今晚 22:30', title:'赴约 · 老地方', desc:'和角色线下剧情已就绪' },
    { type:'module', tag:'Worldbook', title:'世界书', desc:'把人设、设定与 lore 注入每一次对话的上下文。' },
    { type:'bubble', who:'你', text:'上次你说想去海边，我记下了。' },
    { type:'module', tag:'Cafe', title:'咖啡馆经营', desc:'和 AI 搭档一起，把街角小店慢慢做起来。' },
    { type:'timeline', date:'本周', title:'记忆 +12', desc:'自动总结长期记忆，赴约 1 次' }
  ];

  const H = gallery.clientHeight;          // 画廊高度
  const pad = 60;                          // 上下留白
  const cx = 50;                           // 中心 x（百分比）
  const A = 30;                            // 振幅（百分比）
  const loops = 1.5;                       // S 弯曲次数

  // 隐形 S 曲线函数（百分比坐标）
  const spineX = t => cx + A * Math.sin(t * Math.PI * 2 * loops);
  const spineY = t => pad + t * (H - 2 * pad);

  // 生成 spine 路径（细线，scroll 时描绘展开）
  let d = '';
  for (let s = 0; s <= 100; s += 2){
    const t = s / 100;
    const x = spineX(t), y = spineY(t);
    d += (s === 0 ? 'M' : 'L') + x + ',' + y + ' ';
  }
  spinePath.setAttribute('d', d);
  const spineLen = spinePath.getTotalLength();
  spinePath.style.strokeDasharray = spineLen;
  spinePath.style.strokeDashoffset = spineLen;   // 初始未展开

  // 生成节点
  NODES.forEach((n, i) => {
    const t = (i + 0.5) / NODES.length;
    const x = spineX(t), y = spineY(t);
    const onRight = x > cx;   // 曲线在右侧 → 卡片放左侧，错落交替

    const el = document.createElement('div');
    el.className = 'node';
    el.style.left = x + '%';
    el.style.top = y + 'px';
    el.style.textAlign = onRight ? 'right' : 'left';

    let inner = '';
    if (n.type === 'bubble'){
      inner = `<div class="glass bubble">
        <div class="who">${n.who}</div>
        <div class="text">${n.text}</div>
        <span class="tail" style="${onRight ? 'right:-9px' : 'left:-9px'}"></span>
      </div>`;
    } else if (n.type === 'module'){
      inner = `<div class="glass module">
        <div class="tag">${n.tag}</div><h3>${n.title}</h3><p>${n.desc}</p>
      </div>`;
    } else {
      inner = `<div class="glass timeline">
        <div class="date">${n.date}</div><h3>${n.title}</h3><p>${n.desc}</p>
      </div>`;
    }
    // 连接点：放在卡片朝向曲线的一侧
    const connector = `<span class="connector" style="${onRight ? 'left:-22px' : 'right:-22px'}"></span>`;
    el.innerHTML = connector + inner;
    gallery.appendChild(el);
  });

  /* ===================== 滚动驱动：线条展开 + 节点入场 ===================== */
  const nodes = [...document.querySelectorAll('.node')];
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
  }, { threshold:0.2 });
  nodes.forEach(n => io.observe(n));

  let ticking = false;
  function onScroll(){
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const rect = gallery.getBoundingClientRect();
      const vh = window.innerHeight;
      // 画廊进入视口的比例 → 控制 spine 描绘进度
      const progress = Math.min(1, Math.max(0, (vh * 0.85 - rect.top) / (rect.height * 0.9)));
      spinePath.style.strokeDashoffset = spineLen * (1 - progress);
      ticking = false;
    });
  }
  if (!reduce){ window.addEventListener('scroll', onScroll, { passive:true }); onScroll(); }
  else { spinePath.style.strokeDashoffset = 0; nodes.forEach(n => n.classList.add('in')); }
</script>
</body>
</html>
