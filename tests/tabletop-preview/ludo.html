<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞行棋 · 独立预览</title>
<link rel="stylesheet" href="../../games/tabletop/ludo-board.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:14px/1.5 system-ui,sans-serif}main{max-width:430px;margin:auto;padding:22px 14px}
h1{font:400 29px/1.2 Georgia,"Songti SC",serif;margin:8px 0 12px}p{margin:8px 0;color:#666;font-size:12px}
[hidden]{display:none!important}fieldset{border:0;margin:18px 0;padding:0}legend{font-size:13px;margin-bottom:10px}label{display:flex;gap:12px;align-items:center;min-height:44px}input{accent-color:#222}main>section button:not(.mao-ludo__piece){font:inherit;color:#222;background:#fff;border:1px solid #ddd;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer}button:disabled{opacity:.5}.primary{background:#222;color:#fff;border-color:#222;width:100%}
#board .mao-ludo{padding:4px 0 10px}#board .mao-ludo__title{display:none}.toolbar{display:flex;gap:8px;justify-content:flex-end;margin:8px 0}details{padding:12px 0;border-top:1px solid #eee}summary{cursor:pointer;min-height:44px;padding:10px 0}ul{padding:0;list-style:none;max-height:120px;overflow:auto}li{padding:6px 0;overflow-wrap:anywhere}form{display:flex;gap:6px}form input{min-width:0;flex:1;min-height:44px;border:1px solid #ddd;border-radius:8px;padding:10px;font:inherit}#preview-status{min-height:1.5em}small{font-size:12px;color:#666}
</style>
</head>
<body><main>
<header><h1>飞行棋</h1><small>独立开发预览 · 本地测试棋手，不联网、不保存</small></header>
<section id="setup"><fieldset><legend>选择同行棋手（1—3 位）</legend>
<label><input type="checkbox" name="player" value="fixture-1" checked>测试棋手 1</label>
<label><input type="checkbox" name="player" value="fixture-2">测试棋手 2</label>
<label><input type="checkbox" name="player" value="fixture-3">测试棋手 3</label>
</fieldset><p id="selection-count" aria-live="polite"></p><button id="start" type="button" class="primary">开始游戏</button></section>
<section id="game" hidden><div id="board"></div><div class="toolbar"><button id="resume" type="button" hidden>继续自动回合</button><button id="end" type="button">结束本局</button></div>
<details id="chat"><summary>游戏聊天</summary><p>此预览仅支持本局发言，不生成角色回复。</p><ul id="messages" aria-live="polite"></ul><form id="message-form"><input id="message" aria-label="游戏发言" maxlength="1000" autocomplete="off" placeholder="说点什么"><button type="submit">发送</button></form><p id="chat-status" role="status"></p></details></section>
<p id="preview-status" role="status"></p>
<details><summary>玩法</summary><p>每人四架飞机，掷六点起飞并再掷一次。选择可移动的飞机，同色格跳跃，特殊格飞行，落点碰撞对手返回停机区。终点需要准确抵达，超出则反弹。四架飞机全部抵达即获胜。当前为暂定规则。</p></details>
</main><script type="module" src="./ludo-preview-page.js"></script></body></html>
