<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>共同成长</title>
<script src="../shared/js/native-feel.js"></script>
<link rel="stylesheet" href="../shared/css/mobile-fit.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar { display:none; }
  html { background:#141414; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#141414; color:#f0f0f0;
    min-height:100vh; max-width:390px; margin:0 auto;
    padding-bottom:40px;
  }

  .top {
    padding:16px 20px;
    padding-top:calc(16px + env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between;
  }
  .back-btn {
    width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.1); backdrop-filter:blur(8px);
    border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .back-btn svg { stroke:#fff; }
  .top-title { font-size:0.875rem; font-weight:700; color:#fff; }
  .top-space { width:36px; }

  /* 等级大卡：灰调背景图 */
  .level-card {
    margin:8px 20px 16px;
    border-radius:24px; overflow:hidden; position:relative;
    aspect-ratio:9/12;
    box-shadow:0 16px 40px rgba(0,0,0,0.4);
    animation:rise 0.6s ease both;
  }
  .level-card img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .level-card::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0.5) 100%);
  }
  .level-content {
    position:absolute; inset:0; padding:24px 20px;
    display:flex; flex-direction:column; justify-content:flex-end;
    z-index:1;
  }
  .level-label { font-size:0.625rem; letter-spacing:0.2em; color:rgba(255,255,255,0.6); }
  .level-name { font-size:1.75rem; font-weight:800; color:#fff; margin:6px 0 2px; letter-spacing:-0.02em; }
  .level-note { font-size:0.75rem; color:rgba(255,255,255,0.7); }
  .points-row { display:flex; justify-content:space-between; align-items:flex-end; margin-top:20px; }
  .points-num { font-size:2.5rem; font-weight:800; color:#fff; line-height:1; letter-spacing:-0.03em; }
  .points-label { font-size:0.625rem; color:rgba(255,255,255,0.5); margin-top:4px; letter-spacing:0.15em; }
  .progress-wrap { margin-top:16px; }
  .progress-track { height:4px; background:rgba(255,255,255,0.2); border-radius:2px; overflow:hidden; }
  .progress-fill {
    height:100%; background:#fff; border-radius:2px;
    width:0; transition:width 1.2s cubic-bezier(0.2,0.8,0.2,1);
  }
  .progress-text { font-size:0.625rem; color:rgba(255,255,255,0.5); margin-top:8px; }

  /* 三统计 */
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:0 20px 16px; }
  .stat-card {
    background:#1f1f1f; border-radius:16px; padding:16px 10px; text-align:center;
    border:1px solid rgba(255,255,255,0.05);
    animation:rise 0.5s ease both;
  }
  .stat-card:nth-child(2){ animation-delay:0.08s; }
  .stat-card:nth-child(3){ animation-delay:0.16s; }
  .stat-num { font-size:1.5rem; font-weight:800; color:#fff; }
  .stat-label { font-size:0.625rem; color:#888; margin-top:4px; }

  /* 区块标题 */
  .sec-head { padding:8px 20px 12px; display:flex; justify-content:space-between; align-items:baseline; }
  .sec-head h3 { font-size:0.938rem; font-weight:800; color:#fff; }
  .sec-head .count { font-size:0.75rem; color:#666; font-weight:600; }

  /* 徽章 */
  .badges { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 20px; }
  .badge-card {
    background:#1f1f1f; border-radius:16px; padding:14px;
    border:1px solid rgba(255,255,255,0.05);
    animation:rise 0.5s ease both;
    transition:transform 0.15s ease;
  }
  .badge-card:active { transform:scale(0.97); }
  .badge-card.locked { opacity:0.4; }
  .badge-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .badge-mark {
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:0.813rem; font-weight:800;
    background:#333; color:#888;
  }
  .badge-card:not(.locked) .badge-mark {
    background:#fff; color:#111;
    box-shadow:0 0 20px rgba(255,255,255,0.2);
  }
  .state { font-size:0.6rem; padding:3px 8px; border-radius:8px; font-weight:700; }
  .badge-card:not(.locked) .state { background:#fff; color:#111; }
  .badge-card.locked .state { background:#2a2a2a; color:#666; }
  .badge-card h4 { font-size:0.813rem; font-weight:700; color:#fff; margin-bottom:3px; }
  .badge-card p { font-size:0.66rem; color:#777; line-height:1.5; }

  /* 清单 */
  .goal-wrap { margin:0 20px; }
  .goal-form { display:flex; gap:8px; margin-bottom:12px; }
  .goal-form input {
    flex:1; border:1px solid rgba(255,255,255,0.1); border-radius:12px;
    padding:12px 14px; font-size:0.813rem; outline:none;
    background:#1f1f1f; color:#fff;
  }
  .goal-form input::placeholder { color:#555; }
  .goal-form button {
    border:none; background:#fff; color:#111; border-radius:12px;
    padding:0 18px; font-size:0.813rem; font-weight:700; cursor:pointer;
    transition:transform 0.15s;
  }
  .goal-form button:active { transform:scale(0.95); }
  .goal-item {
    background:#1f1f1f; border:1px solid rgba(255,255,255,0.05);
    border-radius:12px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; gap:10px;
    animation:rise 0.3s ease both;
  }
  .goal-check {
    width:22px; height:22px; border-radius:50%; border:2px solid #444;
    flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.2s; background:transparent; color:transparent;
  }
  .goal-item.done .goal-check {
    background:#fff; border-color:#fff; color:#111;
  }
  .goal-item.done .goal-text { text-decoration:line-through; color:#555; }
  .goal-text { flex:1; font-size:0.813rem; line-height:1.4; color:#eee; }
  .goal-del { border:none; background:none; color:#555; font-size:0.875rem; cursor:pointer; padding:4px; }
  .empty { text-align:center; color:#555; font-size:0.813rem; padding:30px 0; }

  .note { font-size:0.625rem; color:#444; line-height:1.6; padding:20px; text-align:center; }

  .toast {
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(10px);
    background:#fff; color:#111; padding:10px 18px; border-radius:20px;
    font-size:0.813rem; opacity:0; pointer-events:none; transition:0.25s; z-index:999;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @keyframes rise { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>

<div class="top">
  <button class="back-btn" onclick="window.location.href='../index.html'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="top-title">共同成长</div>
  <div class="top-space"></div>
</div>

<div class="level-card">
  <img src="../assets/growth-bg.jpg" alt="">
  <div class="level-content">
    <div class="level-label">OUR CURRENT CHAPTER</div>
    <div class="level-name" id="levelName">Chapter 01</div>
    <div class="level-note" id="levelNote">从记录第一件小事开始</div>
    <div class="points-row">
      <div>
        <div class="points-num" id="points">0</div>
        <div class="points-label">GROWTH POINTS</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
      <div class="progress-text" id="progressText">再获得 100 点升级</div>
    </div>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-num" id="memoryStat">0</div><div class="stat-label">共同记忆</div></div>
  <div class="stat-card"><div class="stat-num" id="planStat">0</div><div class="stat-label">已完成计划</div></div>
  <div class="stat-card"><div class="stat-num" id="moodStat">0</div><div class="stat-label">心情记录日</div></div>
</div>

<div class="sec-head">
  <h3>成长清单</h3>
  <span class="count" id="goalCount">0/0</span>
</div>
<div class="goal-wrap" style="margin-bottom:8px;">
  <form class="goal-form" id="goalForm">
    <input id="goalInput" maxlength="100" placeholder="写下一个小目标…">
    <button type="submit">添加</button>
  </form>
  <div class="goal-list" id="goalList"></div>
</div>

<div class="sec-head">
  <h3>一起解锁</h3>
  <span class="count" id="earnedCount">0/9</span>
</div>
<div class="badges" id="badges"></div>

<p class="note">成长点数根据情侣空间里的记录自动计算<br>数据仅保存在本机</p>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const KEY = {
    profile:'maoer_couple_profile_v1',
    mood:'maoer_couple_mood_v1',
    bucket:'maoer_couple_bucket_v1',
    moments:'maoer_couple_moments_v1',
    goals:'maoer_growth_goals_v1'
  };
  function read(k, d){ try { let v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; } catch(e){ return d; } }
  function write(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  function toast(s){ let t=$('toast'); t.textContent=s; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function safeDate(s){ if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; let d=new Date(s+'T00:00:00'); return isNaN(d.getTime())?null:d; }

  const milestones = [
    {id:'first-memory', mark:'01', title:'第一段共同记忆', desc:'记录下你们的第一个片刻', test:d=>d.moments.length>=1},
    {id:'memory-five', mark:'05', title:'珍藏五个瞬间', desc:'共同记忆累计达到 5 条', test:d=>d.moments.length>=5},
    {id:'first-plan', mark:'→', title:'把计划变成回忆', desc:'完成清单里的第一件事', test:d=>d.bucket.some(x=>x.done)},
    {id:'plans-five', mark:'05', title:'行动派搭档', desc:'一起完成 5 件小计划', test:d=>d.bucket.filter(x=>x.done).length>=5},
    {id:'mood-first', mark:'日', title:'认真听见彼此', desc:'至少有一天留下双方心情', test:d=>Object.values(d.moods).some(a=>Array.isArray(a)&&a.filter(x=>String(x||'').trim()).length===2)},
    {id:'mood-seven', mark:'07', title:'七日心情档案', desc:'至少 7 个不同日期有心情记录', test:d=>Object.values(d.moods).filter(a=>Array.isArray(a)&&a.some(x=>String(x||'').trim())).length>=7},
    {id:'week-one', mark:'7天', title:'一起一周', desc:'从设定的开始日期走过 7 天', test:d=>{ let dt=safeDate(d.profile.startDate); return !!dt && Math.floor((new Date(new Date().toDateString())-dt)/86400000)+1>=7; }},
    {id:'month-one', mark:'30', title:'第一个月', desc:'从设定的开始日期走过 30 天', test:d=>{ let dt=safeDate(d.profile.startDate); return !!dt && Math.floor((new Date(new Date().toDateString())-dt)/86400000)+1>=30; }},
    {id:'first-goal', mark:'＋', title:'认真许下目标', desc:'添加第一项共同成长目标', test:d=>d.goals.length>=1}
  ];

  function animateNum(el, target){
    let start = 0, dur = 800, t0 = null;
    function step(ts){
      if(!t0) t0 = ts;
      let p = Math.min((ts-t0)/dur, 1);
      el.textContent = Math.floor(start + (target-start)*p);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function render(){
    let d = {
      profile: read(KEY.profile, {}),
      moods: read(KEY.mood, {}),
      bucket: read(KEY.bucket, []),
      moments: read(KEY.moments, []),
      goals: read(KEY.goals, [])
    };
    let completed = d.bucket.filter(x=>x.done).length;
    let moodDays = Object.values(d.moods).filter(a=>Array.isArray(a)&&a.some(x=>String(x||'').trim())).length;
    let earned = milestones.filter(m => { try { return m.test(d); } catch(e){ return false; } }).length;
    let points = d.moments.length*10 + completed*15 + moodDays*5 + d.goals.filter(x=>x.done).length*15;
    let level = Math.floor(points/100)+1;
    let within = points%100;

    $('levelName').textContent = 'Chapter ' + String(level).padStart(2,'0');
    $('levelNote').textContent = level===1 ? '从记录第一件小事开始' : level<4 ? '你们正在积累属于自己的故事' : '每一个小小的认真，都有了回响';
    animateNum($('points'), points);
    animateNum($('memoryStat'), d.moments.length);
    animateNum($('planStat'), completed);
    animateNum($('moodStat'), moodDays);

    setTimeout(()=>{ $('progressBar').style.width = within + '%'; }, 300);
    $('progressText').textContent = '再获得 ' + (100-within) + ' 点升级';
    $('earnedCount').textContent = earned + '/' + milestones.length;

    $('badges').innerHTML = milestones.map(m => {
      let ok = false;
      try { ok = m.test(d); } catch(e){}
      return '<div class="badge-card '+(ok?'':'locked')+'">'
        + '<div class="badge-top"><div class="badge-mark">'+m.mark+'</div><span class="state">'+(ok?'已解锁':'未解锁')+'</span></div>'
        + '<h4>'+esc(m.title)+'</h4><p>'+esc(m.desc)+'</p></div>';
    }).join('');

    renderGoals(d.goals);
  }

  function renderGoals(goals){
    $('goalCount').textContent = goals.filter(x=>x.done).length + '/' + goals.length;
    if(!goals.length){ $('goalList').innerHTML = '<div class="empty">清单还空着，加一个小目标吧</div>'; return; }
    $('goalList').innerHTML = goals.map(g =>
      '<div class="goal-item '+(g.done?'done':'')+'">'
      + '<div class="goal-check" onclick="toggleGoal(\''+g.id+'\')">'+(g.done?'✓':'')+'</div>'
      + '<div class="goal-text">'+esc(g.text)+'</div>'
      + '<button class="goal-del" onclick="delGoal(\''+g.id+'\')">✕</button>'
      + '</div>'
    ).join('');
  }

  window.toggleGoal = function(id){
    let goals = read(KEY.goals, []).map(g => g.id===id ? {...g, done:!g.done} : g);
    write(KEY.goals, goals); render();
    toast('完成一项小目标 +15');
  };
  window.delGoal = function(id){
    if(!confirm('删除这个目标？')) return;
    write(KEY.goals, read(KEY.goals, []).filter(g => g.id!==id));
    render(); toast('已删除');
  };

  $('goalForm').addEventListener('submit', e => {
    e.preventDefault();
    let v = $('goalInput').value.trim();
    if(!v) return;
    let goals = read(KEY.goals, []);
    goals.push({id:Date.now().toString(36), text:v, done:false, created:new Date().toISOString().slice(0,10)});
    write(KEY.goals, goals);
    $('goalInput').value = '';
    render(); toast('已加入成长清单');
  });

  window.addEventListener('pageshow', render);
  render();
})();
</script>
</body>
</html>
