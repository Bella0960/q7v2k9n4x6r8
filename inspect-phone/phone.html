<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>查手机</title>
<script src="../shared/js/phone/phone_storage.js"></script>
<script src="../shared/js/phone/phone_api.js"></script>
<style>
:root{color-scheme:light;--ink:#222226;--muted:#8d8d95;--line:#e5e5ea;--bg:#f7f7f9;--card:#fff;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#e5e5e5;color:var(--ink);display:flex;justify-content:center;align-items:center;
  min-height:100dvh;margin:0;overflow:hidden;
  /* 桌面预览：让浏览器尽快派发 tap 事件，不要等 300ms */
  touch-action:manipulation;
}
.device{
  position:relative;flex:0 0 auto;
  width:min(390px,calc(100vw - 24px));
  height:min(844px,calc(100dvh - 24px));
  background:var(--bg);overflow:hidden;
  border:8px solid #fff;border-radius:45px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}
.screen{position:absolute;inset:0}
.lock{position:absolute;inset:0;z-index:6;display:grid;place-items:center;
  /* 关键修复：把触摸事件完全交给 JS，不让浏览器把上滑识别为系统 pan 手势而吞掉 touchend。
     原来是 touch-action:pan-y，浏览器会等待系统手势确认，首次上滑 touchend 被暂缓/丢弃。 */
  touch-action:none;
  background:radial-gradient(circle at 25% 18%,rgba(255,255,255,.62),transparent 55%),repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 1px,transparent 1px 8px),linear-gradient(180deg,#ececef,#dedfe4);transition:opacity .28s ease,transform .28s ease}
.lock.hide{opacity:0;transform:translateY(-16px);pointer-events:none}
.lock-top{position:absolute;top:64px;left:0;right:0;text-align:center}
.lock-time{font-size:52px;font-weight:200;letter-spacing:.04em;line-height:1}
.lock-date{margin-top:7px;font-size:13px;color:#6d6d75}
.lock-hint{position:absolute;bottom:36px;left:0;right:0;text-align:center;color:#787880;font-size:12px}
.lock-hint svg{width:20px;height:20px;display:block;margin:0 auto 7px}
.phone{position:absolute;inset:0;display:grid;grid-template-rows:34px 1fr;opacity:0;transition:opacity .24s ease}
.phone.show{opacity:1}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;color:#333;background:transparent;z-index:2}
.status-icons{display:flex;align-items:center;gap:7px;color:#4d4d55}
.status-icons svg{display:block}
.main{position:relative;overflow:hidden}
.wallpaper{position:absolute;inset:0;background:radial-gradient(circle at 22% 12%,rgba(255,255,255,.72),transparent 58%),repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 1px,transparent 1px 9px),linear-gradient(180deg,#f2f2f5,#e6e7eb);z-index:0}
.home{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 18px 0;z-index:1}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;align-content:start}
.app{position:relative;background:none;border:0;padding:0;display:grid;justify-items:center;gap:7px;cursor:pointer;color:inherit}
.icon{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid #d9d9df;display:grid;place-items:center;color:#55555d;transition:transform .15s ease,box-shadow .15s ease}
.app:active .icon{transform:scale(.94)}
.icon svg{width:24px;height:24px}
.badge{position:absolute;top:-4px;right:8px;min-width:17px;height:17px;border-radius:999px;background:#e03131;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid #f6f6f8}
.label{font-size:11px;color:#5c5c64}
.dock{margin-top:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:12px 10px 26px;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);border-top:1px solid rgba(0,0,0,.05)}
.gesture{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(0,0,0,.22);z-index:3}
.app-layer{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;background:var(--bg);transform:scale(.28);opacity:0;pointer-events:none;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease}
.app-layer.open{transform:scale(1);opacity:1;pointer-events:auto}
.app-bar{height:50px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85)}
.app-title{margin:0;text-align:center;font-size:15px;font-weight:500}
.back{width:38px;height:38px;margin-left:6px;background:none;border:0;color:#333;display:grid;place-items:center;cursor:pointer}
.app-body{flex:1;overflow:auto;padding:16px}
.panel-title{font-size:14px;font-weight:600;margin:0 0 16px;color:#333338}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#ececef;display:grid;place-items:center;color:#b3b3bb}
.cell svg{width:22px;height:22px}
.list{display:grid;gap:0}
.item{padding:14px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:inherit}
.item strong{display:block;font-size:14px;font-weight:500}
.item small{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}
.note{padding:14px 0;border-bottom:1px solid var(--line)}
.note time{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.note p{margin:0;font-size:13px;line-height:1.7;color:#43434a}
.bubbles{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.row{display:flex;max-width:82%}
.row.ai{align-self:flex-start}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:9px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.6;color:#3b3b41}
.me .bubble{background:#222226;border-color:#222226;color:#f7f7f9}
.browser{display:grid;gap:16px}
.search{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#6d6d75}
.search svg{width:16px;height:16px}
.simple{margin:20px 0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}
.simple div{font-size:12px;color:var(--muted)}
.simple strong{display:block;margin-top:6px;font-size:15px;font-weight:500}
.empty{text-align:center;margin-top:38px;font-size:13px;color:var(--muted);line-height:1.7}

/* ============================================================
 * 真机窄屏（≤480px）独立规则 —— 解决左右白边
 *
 * 根因分析：
 *   手机真机（如 390px）打开时，body 用 flex 居中，.device 用
 *   width:min(390px, calc(100vw-24px)) → 实际 366px，两侧各有
 *   (390-366)/2 = 12px 白边（来自 body 背景 #e5e5e5）；再加 8px 白
 *   border 视觉上更宽。本页面不引入 mobile-fit.css，所以 shared
 *   里的窄屏壳覆盖一个都没命中。
 *
 * 桌面浏览器预览（>480px）保留原手机模拟器外壳（圆角、边框、
 * 居中固定宽度），仅窄屏拉满。viewport-fit=cover 已在 meta 声明。
 * ============================================================ */
@media (max-width: 480px) {
  html{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    overscroll-behavior:none;
  }
  body{
    justify-content:flex-start !important;
    align-items:stretch !important;
    padding:0 !important;
    margin:0 !important;
    background:#fff !important;
    overflow:hidden !important;
    /* safe-area：iPhone 刘海/底部 Home Indicator 的内容区域 */
    padding-top:env(safe-area-inset-top, 0px) !important;
    padding-bottom:env(safe-area-inset-bottom, 0px) !important;
    padding-left:env(safe-area-inset-left, 0px) !important;
    padding-right:env(safe-area-inset-right, 0px) !important;
  }
  .device{
    width:100vw !important;
    height:100vh !important;
    height:100dvh !important;
    max-width:none !important;
    max-height:none !important;
    border:0 !important;
    border-radius:0 !important;
    box-shadow:none !important;
    margin:0 !important;
    padding:0 !important;
  }
}
</style>
</head>
<body>
<main class="device">
  <section class="screen">
    <div class="lock" id="lock">
      <div class="lock-top">
        <div class="lock-time" id="lockTime">--:--</div>
        <div class="lock-date" id="lockDate"></div>
      </div>
      <div class="lock-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
        <span>上滑解锁</span>
      </div>
    </div>
    <section class="phone" id="phone">
      <header class="statusbar">
        <span id="clock">--:--</span>
        <span class="status-icons">
          <svg width="15" height="12" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 15h3v-4H2zM8 15h3V8H8zM14 15h3V4h-3z"/></svg>
          <svg width="15" height="12" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 6a14 14 0 0 1 20 0"/><path d="M6 10a9 9 0 0 1 12 0"/><path d="M10 14a4 4 0 0 1 4 0"/></svg>
          <svg width="21" height="12" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="3" width="20" height="10" rx="3"/><path d="M25 7v2"/><rect x="4" y="5" width="14" height="6" rx="2" fill="currentColor" stroke="none"/></svg>
        </span>
      </header>
      <div class="main">
        <div class="wallpaper"></div>
        <section class="home">
          <div class="grid">
            <button class="app" type="button" data-app="album">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 17l4.5-4.5 3.5 3.5L16 11l4 4.5"/></svg></span>
              <span class="label">相册</span>
            </button>
            <button class="app" type="button" data-app="notes">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>
              <span class="label">备忘录</span>
            </button>
            <button class="app" type="button" data-app="forum">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 12a8 8 0 1 0-15 4L4 21l5-1.5A8 8 0 0 0 20 12z"/><path d="M8 10h8M8 14h5"/></svg></span>
              <span class="badge">3</span>
              <span class="label">论坛</span>
            </button>
            <button class="app" type="button" data-app="settings">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg></span>
              <span class="label">设置</span>
            </button>
          </div>
          <div class="dock">
            <button class="app" type="button" data-app="chat">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 12a8 8 0 1 0-15 4L4 21l5-1.5A8 8 0 0 0 20 12z"/></svg></span>
              <span class="badge">2</span>
              <span class="label">聊天</span>
            </button>
            <button class="app" type="button" data-app="browser">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 4 3 14 0 18M12 3c-3 4-3 14 0 18"/></svg></span>
              <span class="label">浏览器</span>
            </button>
          </div>
        </section>
        <div class="gesture"></div>
        <section class="app-layer" id="appLayer">
          <header class="app-bar">
            <button class="back" id="appBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
            <h2 class="app-title" id="appTitle"></h2>
          </header>
          <div class="app-body" id="appBody"></div>
        </section>
      </div>
    </section>
  </section>
</main>
<script>
(function(){
  // ---- 初始化：角色解析 ----
  var params=new URLSearchParams(location.search);
  var requestedId=params.get('id')||'';
  var roles=[];
  try{
    roles=JSON.parse(localStorage.getItem('ai_custom_characters')||'[]')||[];
  }catch(e){
    console.error('[inspect-phone] localStorage 中角色列表 JSON 损坏，用空列表继续', e);
    roles=[];
  }
  roles=roles.filter(function(r){return r&&r.name;});
  var role=roles.find(function(r,i){return String(r.id!==undefined&&r.id!==null?r.id:i)===String(requestedId);})||roles[0]||null;
  if(!role){location.href='select.html';return;}

  // ---- 初始化：DOM 查询 ----
  var lock=null, phone=null, appLayer=null, appBody=null, appTitle=null;
  try{
    lock=document.getElementById('lock');
    phone=document.getElementById('phone');
    appLayer=document.getElementById('appLayer');
    appBody=document.getElementById('appBody');
    appTitle=document.getElementById('appTitle');
    if(!lock||!phone||!appLayer){
      throw new Error('缺少关键 DOM 元素: lock='+!!lock+' phone='+!!phone+' appLayer='+!!appLayer);
    }
  }catch(e){
    console.error('[inspect-phone] DOM 初始化失败:', e.message);
    // 没法继续了，至少让锁屏可见
    try{ if(lock)lock.classList.remove('hide'); }catch(_){}
    return;
  }
  var currentApp='';
  var chatOpen=false;
  var forumOpen=false;
  var chatIndex=0;
  var forumIndex=0;

  function pad(n){return n<10?'0'+n:''+n;}
  function updateTime(){
    var now=new Date();
    var time=pad(now.getHours())+':'+pad(now.getMinutes());
    var week=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    document.getElementById('lockTime').textContent=time;
    document.getElementById('lockDate').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日 '+week;
    document.getElementById('clock').textContent=time;
  }
  // 时间更新——独立 try/catch，因为 DOM 查询已在前面校验过
  try{
    updateTime();
    setInterval(updateTime,10000);
  }catch(e){
    console.error('[inspect-phone] 时间更新初始化失败:', e.message);
  }

  // --- 常量 ---
  /** 上滑解锁的纵向位移硬阈值：严格 < -36px 才够，边界 -36 不触发 */
  var SWIPE_UP_THRESHOLD_PX = 36;
  /** 上滑方向判定：纵向位移必须明显大于横向（|dy| > |dx| * 1.15）才认作上滑 */
  var SWIPE_DOMINANCE_RATIO = 1.15;
  /** tap vs 滑动的位移容差：手指起点到本次手势末端的欧氏距离超过此值，
   *  视为"不是轻点"，click 兜底一律不解锁。8px 落在 iOS/Android 常见 6-10px tap
   *  容差区间中段，能有效拦截 Chrome 对 <15px 位移自动生成的 synthetic click。 */
  var TAP_MOVE_TOLERANCE_PX = 8;

  // --- 解锁手势状态 ---
  var lockStartY=0;
  var lockStartX=0;
  var lockPointerId=null;
  var lockTracking=false;
  var unlockFired=false;
  var unlocked=false;
  /** 本次手势从起点到最远点的欧氏距离平方（避免 sqrt 开销）；reset 时清 0 */
  var gestureMaxDistSq = 0;

  function unlockPhone(){
    if(unlocked)return;
    unlocked=true;
    unlockFired=true;
    lock.classList.add('hide');
    phone.classList.add('show');
  }
  /** 复位手势追踪状态（不含 gestureMaxDistSq）——pointerup/touchend 里先 reset 再等 click 到达。
   *  gestureMaxDistSq 必须保留到 click 处理完，这样 synthetic click 到来时守卫能读到真实位移。
   *  清零的地方有两处：下一次 pointerdown/touchstart 开始新手势时、click 处理完时。 */
  function resetLockState(){
    lockTracking=false;
    lockStartY=0;
    lockStartX=0;
    lockPointerId=null;
    unlockFired=false;
  }
  /** 更新本次手势的最大位移（欧氏距离平方），pointermove/touchmove 都调这个
   *  双通道可能同时抵达（Chromium touch 也派发 pointer），取 max 即可，
   *  平方值避免重复 sqrt 开销。 */
  function updateMaxMove(curX,curY){
    var dx=curX-lockStartX;
    var dy=curY-lockStartY;
    var d2=dx*dx+dy*dy;
    if(d2>gestureMaxDistSq)gestureMaxDistSq=d2;
  }
  /** tap 守卫：本次手势的最大位移是否在 tap 容差内（欧氏距离 ≤ TAP_MOVE_TOLERANCE_PX） */
  function isTapGesture(){
    return gestureMaxDistSq <= TAP_MOVE_TOLERANCE_PX*TAP_MOVE_TOLERANCE_PX;
  }
  /** 上滑解锁判定：向上 ≥ 36px 且纵向位移明显大于横向 */
  function shouldUnlock(dy,dx){
    return dy < -SWIPE_UP_THRESHOLD_PX && Math.abs(dy) > Math.abs(dx)*SWIPE_DOMINANCE_RATIO;
  }

  // === 解锁手势 ===
  // 事件通道：pointer 为主（鼠标+触摸+触控笔），touch 为老 WebView 兜底。
  // .lock 上 touch-action:none 让浏览器完全不拦截系统手势，事件立即派发。
  // 幂等：unlockFired 标记确保多通道（pointer+touch+click）同时到达时只解锁一次。
  // 复位顺序：先取出起点算好 dx/dy，再 resetLockState 清空，避免起点被清成 0 导致 dy 算错。
  // 位移守卫：click 通道只在本次手势的最大位移 ≤ 8px（tap）时才解锁；任何滑动手势
  //  （包括 Chrome 对小位移自动生成的 synthetic click）都会被拦截，强制走 pointer/touch
  //  的 shouldUnlock 通道。

  lock.addEventListener('pointerdown',function(e){
    if(unlocked)return;
    lockPointerId=e.pointerId;
    lockStartY=e.clientY;
    lockStartX=e.clientX;
    lockTracking=true;
    unlockFired=false;
    gestureMaxDistSq=0;
    try{lock.setPointerCapture(e.pointerId);}catch(_){}
  });
  lock.addEventListener('pointermove',function(e){
    if(!lockTracking||e.pointerId!==lockPointerId)return;
    updateMaxMove(e.clientX,e.clientY);
  });
  lock.addEventListener('pointerup',function(e){
    if(!lockTracking||e.pointerId!==lockPointerId)return;
    // 关键：先取出当前起点算位移，再复位。不能反过来——reset 会把起点清 0。
    updateMaxMove(e.clientX,e.clientY);
    var dy=e.clientY-lockStartY;
    var dx=e.clientX-lockStartX;
    resetLockState();
    if(!unlockFired && shouldUnlock(dy,dx))unlockPhone();
  });
  lock.addEventListener('pointercancel',function(e){
    if(e.pointerId!==lockPointerId)return;
    // cancel 不做判定，只复位状态。unlockFired 会被清，下一次手势可重新触发。
    resetLockState();
  });

  lock.addEventListener('touchstart',function(e){
    if(unlocked||!e.touches||!e.touches[0])return;
    lockStartY=e.touches[0].clientY;
    lockStartX=e.touches[0].clientX;
    lockTracking=true;
    unlockFired=false;
    gestureMaxDistSq=0;
  },{passive:true});
  lock.addEventListener('touchmove',function(e){
    if(!lockTracking||!e.touches||!e.touches[0])return;
    updateMaxMove(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  lock.addEventListener('touchend',function(e){
    if(!lockTracking)return;
    var t=e.changedTouches&&e.changedTouches[0];
    if(t){
      updateMaxMove(t.clientX,t.clientY);
      // 同样先算再复位，避免起点被提前清零
      var dy=t.clientY-lockStartY;
      var dx=t.clientX-lockStartX;
      resetLockState();
      if(!unlockFired && shouldUnlock(dy,dx))unlockPhone();
    }else{
      resetLockState();
    }
  },{passive:true});
  lock.addEventListener('touchcancel',function(){
    resetLockState();
  },{passive:true});

  // 点击解锁——独立路径，但受"位移守卫"约束：
  //   - 原地轻点（位移 ≤ 8px）：正常解锁
  //   - 任何滑动手势导致的 click（包括 Chrome 对 <15px touch 自动生成的 synthetic click）：
  //     本次 gestureMaxDistSq > 64，isTapGesture() 返回 false，click 被忽略，强制走上面
  //     pointer/touch 的 shouldUnlock 通道（必须达到 -36px 阈值才解锁）
  //   - 幂等：unlockFired 避免滑动通道已解锁后 click 再进来重复触发
  lock.addEventListener('click',function(){
    if(unlockFired)return;          // 幂等：滑动通道已解锁
    if(!isTapGesture())return;      // 守卫：不是轻点，强制走滑动通道
    resetLockState();               // click 处理完也必须清状态，防下次被污染
    unlockPhone();
  });

  var titles={album:'相册',chat:'聊天',notes:'备忘录',forum:'论坛',browser:'浏览器',settings:'设置'};
  var roleName=String(role.name||'角色');
  var roleBio=[role.description,role.bio,role.personality,role.character,role.speechStyle,role.prompt,role.systemPrompt]
    .filter(Boolean).join('\n').replace(/\s+/g,' ').trim().slice(0,2600);
  var roleId=String(role.id!==undefined&&role.id!==null?role.id:(requestedId||roles.indexOf(role)));
  function localDateKey(date){
    var d=date||new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function escHtml(value){
    return String(value==null?'':value).replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function safeText(value,max){
    return String(value==null?'':value).replace(/[\u0000-\u001f]/g,' ').trim().slice(0,max||240);
  }
  function makeFallbackContent(){
    var dateLabel=(new Date().getMonth()+1)+'月'+new Date().getDate()+'日';
    return {
      notes:[
        {date:dateLabel,text:roleName+'把今天想记住的一件小事留在这里。'},
        {date:'最近',text:'有空的时候，想把还没完成的事情慢慢整理好。'},
        {date:'备忘',text:'不必把每一天都安排得很满，留一点时间给自己。'}
      ],
      chats:[
        {name:'熟悉的人',messages:[
          {side:'ai',text:'今天过得怎么样？'},
          {side:'me',text:'还不错，刚好有一点自己的时间。'},
          {side:'ai',text:'那就好，记得早点休息。'}
        ]},
        {name:'联系人',messages:[
          {side:'ai',text:'上次说的事情，后来怎么样了？'},
          {side:'me',text:'我记着呢，等忙完这阵再和你说。'},
          {side:'ai',text:'好，不着急。'}
        ]}
      ],
      posts:[
        {title:'留给今天的一句话',text:'有些想法不需要马上得到答案，先把它记下来就好。'},
        {title:'最近的小发现',text:'日常里总有一些不起眼的瞬间，回头想想却值得留下。'},
        {title:'随手记录',text:'今天也有认真生活，剩下的事情明天再慢慢处理。'}
      ],
      history:['天气与出行','收藏的网页','最近查过的资料']
    };
  }
  var contentCacheKey='inspect_phone_content_v2_'+encodeURIComponent(roleId)+'_'+localDateKey();
  var phoneContent=makeFallbackContent();
  var hasCachedContent=false;
  function normalizePhoneContent(data){
    if(!data||typeof data!=='object')return null;
    var notes=Array.isArray(data.notes)?data.notes.slice(0,5).map(function(n){
      return {date:safeText(n&&n.date,30)||'最近',text:safeText(n&&n.text,320)};
    }).filter(function(n){return n.text;}):[];
    var chats=Array.isArray(data.chats)?data.chats.slice(0,4).map(function(c){
      var messages=Array.isArray(c&&c.messages)?c.messages.slice(0,8).map(function(m){
        return {side:m&&m.side==='me'?'me':'ai',text:safeText(m&&m.text,220)};
      }).filter(function(m){return m.text;}):[];
      return {name:safeText(c&&c.name,36)||'联系人',messages:messages};
    }).filter(function(c){return c.messages.length;}):[];
    var posts=Array.isArray(data.posts)?data.posts.slice(0,5).map(function(p){
      return {title:safeText(p&&p.title,80),text:safeText(p&&p.text,360)};
    }).filter(function(p){return p.title||p.text;}):[];
    var history=Array.isArray(data.history)?data.history.slice(0,6).map(function(v){return safeText(v,80);}).filter(Boolean):[];
    if(!notes.length&&!chats.length&&!posts.length&&!history.length)return null;
    return {notes:notes.length?notes:phoneContent.notes,chats:chats.length?chats:phoneContent.chats,
      posts:posts.length?posts:phoneContent.posts,history:history.length?history:phoneContent.history};
  }
  function applyPhoneContent(data){
    if(!data)return;
    phoneContent=data;
    notes=phoneContent.notes;
    chats=phoneContent.chats;
    posts=phoneContent.posts;
    history=phoneContent.history;
    if(currentApp)renderApp();
  }
  try{
    var cached=JSON.parse(localStorage.getItem(contentCacheKey)||'null');
    var normalized=normalizePhoneContent(cached);
    if(normalized){applyPhoneContent(normalized);hasCachedContent=true;}
  }catch(e){}
  var notes=phoneContent.notes;
  var chats=phoneContent.chats;
  var posts=phoneContent.posts;
  var history=phoneContent.history;

  function generateRolePhoneContent(){
    if(hasCachedContent)return;
    var cfg=window.PhoneStorage&&PhoneStorage.getApiConfig?PhoneStorage.getApiConfig():{};
    if(!cfg||!String(cfg.apiKey||'').trim()||!window.PhoneAPI||typeof PhoneAPI.completeJSON!=='function')return;
    var today=localDateKey();
    var systemPrompt='你正在为一个虚构角色生成其私人手机里的日常内容。你必须严格依据角色设定写作，角色是手机主人；聊天记录中 side=me 的发言属于角色本人，side=ai 属于联系人。所有内容要像真实生活留下的记录，不要客服腔、不要说明你在生成数据，不要凭空写夸张剧情。只返回 JSON 对象，不要 Markdown。';
    var userPrompt='今天日期：'+today+'\n角色姓名：'+roleName+'\n角色人设：'+(roleBio||'请根据角色姓名创作克制、可信的普通日常')+
      '\n请生成以下 JSON：{"notes":[{"date":"日期","text":"备忘录内容"}],"chats":[{"name":"联系人昵称","messages":[{"side":"ai或me","text":"消息内容"}]}],"posts":[{"title":"帖子标题","text":"帖子正文"}],"history":["浏览记录"]}。'+
      '\n要求：备忘录 3 条；聊天 2 组，每组 3-5 条来回消息；论坛帖子 3 条；浏览记录 3-5 条。语气、兴趣、作息、表达习惯必须符合该角色；不要所有角色都写海边、咖啡、天气等相同内容；内容自然、具体但日常，不要透露角色设定文本本身。';
    PhoneAPI.completeJSON({system:systemPrompt,user:userPrompt,temperature:0.85,timeoutMs:22000}).then(function(result){
      if(!result||!result.ok)return;
      var normalized=normalizePhoneContent(result.data);
      if(!normalized)return;
      applyPhoneContent(normalized);
      try{localStorage.setItem(contentCacheKey,JSON.stringify(normalized));}catch(e){}
    }).catch(function(error){
      console.warn('[InspectPhone] 角色内容生成失败，保留本地日常内容',error);
    });
  }
  generateRolePhoneContent();

  function renderApp(){
    if(!currentApp)return;
    appTitle.textContent=titles[currentApp];
    if(currentApp==='album'){
      appBody.innerHTML='<h3 class="panel-title">相册</h3><div class="album">'+Array.from({length:9},function(){return '<div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M5 16l4-4 3 3 3-3 4 4"/></svg></div>';}).join('')+'</div>';
      return;
    }
    if(currentApp==='chat'){
      if(!chatOpen){
        appBody.innerHTML='<h3 class="panel-title">聊天</h3><div class="list">'+chats.map(function(c,i){var last=(c.messages||[]).slice(-1)[0];return '<button class="item" type="button" data-chat="'+i+'"><strong>'+escHtml(c.name)+'</strong><small>'+escHtml(last&&last.text||'暂无消息')+'</small></button>';}).join('')+'</div>';
      }else{
        var c=chats[chatIndex]||chats[0];
        appBody.innerHTML='<div class="bubbles">'+c.messages.map(function(m){return '<div class="row '+(m.side==='me'?'me':'ai')+'"><div class="bubble">'+escHtml(m.text)+'</div></div>';}).join('')+'</div>';
      }
      return;
    }
    if(currentApp==='notes'){
      appBody.innerHTML='<h3 class="panel-title">备忘录</h3>'+notes.map(function(n){return '<article class="note"><time>'+escHtml(n.date)+'</time><p>'+escHtml(n.text)+'</p></article>';}).join('');
      return;
    }
    if(currentApp==='forum'){
      if(!forumOpen){
        appBody.innerHTML='<h3 class="panel-title">论坛</h3><div class="list">'+posts.map(function(p,i){return '<button class="item" type="button" data-post="'+i+'"><strong>'+escHtml(p.title)+'</strong><small>'+escHtml(p.text)+'</small></button>';}).join('')+'</div>';
      }else{
        var p=posts[forumIndex]||posts[0];
        appBody.innerHTML='<h3 class="panel-title">'+escHtml(p.title)+'</h3><p style="font-size:13px;line-height:1.7;color:#43434a">'+escHtml(p.text)+'</p>';
      }
      return;
    }
    if(currentApp==='browser'){
      appBody.innerHTML='<div class="browser"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg><span>最近浏览</span></div><div class="list">'+history.map(function(h){return '<div class="item"><strong>'+escHtml(h)+'</strong></div>';}).join('')+'</div></div>';
      return;
    }
    if(currentApp==='settings'){
      appBody.innerHTML='<h3 class="panel-title">设置</h3><div class="simple"><div>Device Owner</div><strong>'+escHtml(roleName)+'</strong><div>System</div><strong>Phone OS 1.0</strong></div>';
      return;
    }
    appBody.innerHTML='<div class="empty">暂无内容</div>';
  }

  function openApp(name,event){
    currentApp=name;
    chatOpen=false;
    forumOpen=false;
    renderApp();
    if(event){
      var r=event.currentTarget.getBoundingClientRect();
      var s=event.currentTarget.closest('.main').getBoundingClientRect();
      var x=r.left+r.width/2-s.left;
      var y=r.top+r.height/2-s.top;
      appLayer.style.transformOrigin=x+'px '+y+'px';
    }
    appLayer.classList.add('open');
  }

  document.querySelectorAll('.app').forEach(function(btn){
    btn.addEventListener('click',function(event){openApp(btn.dataset.app,event);});
  });

  appBody.addEventListener('click',function(event){
    var chatItem=event.target.closest('[data-chat]');
    if(chatItem){chatIndex=+chatItem.dataset.chat;chatOpen=true;renderApp();return;}
    var postItem=event.target.closest('[data-post]');
    if(postItem){forumIndex=+postItem.dataset.post;forumOpen=true;renderApp();}
  });

  var appBack=document.getElementById('appBack');
  if(appBack){
    appBack.addEventListener('click',function(){
      if(currentApp==='chat'&&chatOpen){chatOpen=false;renderApp();return;}
      if(currentApp==='forum'&&forumOpen){forumOpen=false;renderApp();return;}
      appLayer.classList.remove('open');
      currentApp='';
    });
  }else{
    console.warn('[inspect-phone] appBack 按钮未找到，返回功能不可用');
  }
})();
</script>
</body>
</html>
