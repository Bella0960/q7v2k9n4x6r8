<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>选择查看的角色</title>
<style>
:root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#f7f7f9;color:#333;overflow:hidden}
.page{width:min(340px,calc(100% - 40px));animation:fade .35s ease both}
.tip{text-align:center;font-size:13px;color:#9a9aa2;letter-spacing:.08em;margin:0 0 26px}
.roles{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.role{width:70px;background:none;border:0;padding:0;text-align:center;cursor:pointer;transition:transform .18s ease}
.role:hover{transform:translateY(-3px)}
.avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;border:1px solid #d6d6dc;background:#fbfbfc;color:#76767e;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 24px rgba(30,30,35,.05)}
.avatar svg{width:27px;height:27px}
.name{margin-top:9px;font-size:12px;color:#55555d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;font-size:13px;color:#8d8d95;line-height:1.7}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<main class="page">
<p class="tip">选择查看的角色</p>
<div class="roles" id="roles"></div>
</main>
<script>
(function(){
  var roles=[];
  try{roles=JSON.parse(localStorage.getItem('ai_custom_characters')||'[]')||[];}catch(e){roles=[];}
  roles=roles.filter(function(r){return r&&r.name;});
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
  function avatarSrc(value){var v=String(value||'').trim();return /^(https?:\/\/|data:image\/|blob:|\.?\.?\/)/i.test(v)?esc(v):'';}
  var box=document.getElementById('roles');
  if(!roles.length){box.innerHTML='<div class="empty">暂无可查看的角色<br>请先在角色库中创建</div>';return;}
  box.innerHTML=roles.map(function(role,index){
    var avatar=avatarSrc(role.avatar)
      ?'<img class="avatar" src="'+role.avatar+'" alt="">'
      :'<div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.5 4.2-5.2 7.5-5.2s6.1 1.7 7.5 5.2"/></svg></div>';
    return '<button class="role" type="button" data-id="'+encodeURIComponent(role.id!==undefined&&role.id!==null?role.id:index)+'">'+avatar+'<div class="name">'+esc(role.name)+'</div></button>';
  }).join('');
  box.addEventListener('click',function(event){
    var item=event.target.closest('.role');
    if(!item)return;
    location.href='phone.html?id='+item.dataset.id;
  });
  document.body.addEventListener('click',function(event){
    if(event.target.closest('.role'))return;
    if(history.length>1)history.back();
    else location.href='../index.html';
  });
})();
</script>
</body>
</html>
