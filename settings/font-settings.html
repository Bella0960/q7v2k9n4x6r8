<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>字体设置</title>
<script src="../shared/js/font-loader.js?v=20261022v1"></script>
<script src="../shared/js/native-feel.js"></script>
<script src="../shared/js/statusbar-control.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: #E5E5E5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
        color: #111111;
        user-select: none;
    }

    /* 项目统一手机外壳 */
    .phone-mockup {
        position: relative;
        width: min(390px, calc(100vw - 24px));
        height: min(844px, calc(100vh - 24px));
        background-color: #FFFFFF;
        border-radius: 45px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
    }
    .status-bar {
        position: absolute;
        top: 0;
        width: 100%;
        padding: 14px 28px;
        font-size: 0.875rem;
        font-weight: 600;
        color: #000;
        z-index: 50;
        pointer-events: none;
    }

    /* ===== 顶部导航：圆形返回 + 大英文标题左对齐 ===== */
    .topbar {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        gap: 14px;
        padding: calc(56px + env(safe-area-inset-top, 0px)) 22px 16px 22px;
    }
    .back-btn {
        width: 32px;
        height: 32px;
        border-radius: 0;
        border: none;
        border-bottom: 1px solid #bdbdbd;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #111;
        text-decoration: none;
        flex-shrink: 0;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .back-btn:active { transform: translateY(1px); border-color: #171717; }
    .back-btn svg { width: 15px; height: 15px; }
    .topbar-title {
        flex: 1;
        text-align: left;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.3px;
        line-height: 1.1;
        text-transform: none;
        color: #111;
    }

    /* ===== 可滚动内容区：卡片间距 12px ===== */
    .stage {
        flex: 1;
        overflow-y: auto;
        padding: 4px 16px 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }

    /* ===== 卡片：内边距 14px 16px，圆角 16px ===== */
    .card {
        background: #F8F8FA;
        border-radius: 20px;
        padding: 14px 16px;
        flex-shrink: 0;
    }
    .card-label {
        display: block;
        font-size: 0.75rem;
        color: #8E8E93;
        font-weight: 500;
    }

    /* ===== 卡片一：自定义字体 ===== */
    .url-input {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 10px 12px;
        background: #F2F2F7;
        border: none;
        border-radius: 10px;
        font-size: 0.813rem;
        color: #111;
        font-family: inherit;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
    }
    .url-input::placeholder { color: #AEAEB2; }

    .font-divider { height: 1px; background: #EAEAEA; margin: 14px 0; }
    .file-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .file-pick {
        flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
        min-height: 38px; padding: 0 14px; border: 1px solid #E1E1E5; border-radius: 999px;
        background: #FFFFFF; color: #222; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .file-name { min-width: 0; color: #8E8E93; font-size: 0.72rem; line-height: 1.4; overflow-wrap: anywhere; }
    .scheme-name { margin-top: 12px; }
    .scheme-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .scheme-select {
        min-width: 0; flex: 1; height: 42px; padding: 0 10px; border: 0; border-radius: 10px;
        background: #F2F2F7; color: #333; font-family: inherit; font-size: 0.78rem; outline: none;
    }
    .text-action { border: 0; background: transparent; color: #8E8E93; font: inherit; font-size: 0.75rem; padding: 8px 2px; }
    .text-action:disabled { opacity: 0.35; }
    .restore-default {
        width: 100%; flex-shrink: 0; padding: 16px 8px 20px; border: 0; background: transparent;
        color: #D92D20; font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .restore-default:active { opacity: 0.55; }
    .apply-btn {
        width: 100%;
        margin-top: 10px;
        height: 44px;
        background: #000000;
        color: #FFFFFF;
        border: none;
        border-radius: 999px;
        font-size: 0.813rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .apply-btn:active { opacity: 0.8; transform: scale(0.98); }
    .hint {
        display: none;
        margin-top: 8px;
        font-size: 0.75rem;
        color: #8E8E93;
        line-height: 1.5;
    }
    .hint.show { display: block; }
    .preview-block {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #F0F0F0;
    }
    .preview-text {
        margin-top: 6px;
        font-size: 0.938rem;
        color: #111;
        font-weight: 500;
        line-height: 1.5;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
    }

    /* ===== 卡片二：全局字号（左 A- / 中预览 / 右 A+ 水平对齐） ===== */
    .fs-row {
        display: flex;
        align-items: center;
        margin-top: 12px;
    }
    .fs-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #F2F2F7;
        border: none;
        color: #111;
        font-size: 0.813rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        flex-shrink: 0;
        transition: opacity 0.15s ease;
    }
    .fs-btn:active { opacity: 0.7; }
    .fs-btn:disabled { opacity: 0.35; cursor: default; }
    .fs-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
    }
    .fs-preview {
        font-size: 0.875rem;
        color: #111;
        font-weight: 600;
        line-height: 1.2;
    }
    .fs-value {
        font-size: 0.813rem;
        color: #000;
        font-weight: 700;
    }

    /* ===== 卡片三：字体颜色（色块水平对齐） ===== */
    .color-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-top: 12px;
        padding: 0 4px;
    }
    .color-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 0;
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
    }
    .color-dot {
        display: block;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
        transition: box-shadow 0.15s ease;
    }
    .color-chip.active .color-dot {
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06), 0 0 0 2px #FFFFFF, 0 0 0 3.5px #111111;
    }
    .color-name {
        font-size: 0.75rem;
        color: #8E8E93;
    }
    .color-chip.active .color-name {
        color: #111;
        font-weight: 600;
    }
</style>
<link rel="stylesheet" href="../shared/css/mobile-fit.css">
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar"><span>09:41</span></div>

        <header class="topbar">
            <a class="back-btn" href="settings.html" aria-label="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </a>
            <h1 class="topbar-title">Font Settings</h1>
        </header>

        <main class="stage">
            <!-- 卡片一：字体导入、方案与预览 -->
            <section class="card">
                <h2 class="card-label">自定义字体</h2>
                <input id="fontUrlInput" class="url-input" type="url"
                       placeholder="粘贴 TTF / WOFF 字体链接 URL" autocomplete="off" spellcheck="false">
                <button id="applyFontBtn" class="apply-btn" type="button">应用链接字体</button>

                <div class="font-divider"></div>
                <div class="file-row">
                    <label class="file-pick" for="fontFileInput">导入字体文件</label>
                    <span id="fontFileName" class="file-name">支持 TTF / WOFF / WOFF2</span>
                    <input id="fontFileInput" type="file" accept=".ttf,.woff,.woff2,font/ttf,font/woff,font/woff2" hidden>
                </div>

                <input id="fontSchemeName" class="url-input scheme-name" type="text"
                       maxlength="30" placeholder="给字体方案起个名称，例如：清爽圆体" autocomplete="off">
                <button id="saveFontPresetBtn" class="apply-btn" type="button">保存并应用字体方案</button>

                <div class="scheme-row">
                    <select id="fontPresetSelect" class="scheme-select" aria-label="已保存的字体方案">
                        <option value="">选择已保存的字体方案</option>
                    </select>
                    <button id="deleteFontPresetBtn" class="text-action" type="button" disabled>删除</button>
                </div>

                <p id="fontHint" class="hint"></p>
                <div class="preview-block">
                    <span class="card-label">字体预览</span>
                    <p id="fontPreview" class="preview-text">你好，世界。让文字呈现自己的气质。<br>Aa Bb Cc · 1234567890</p>
                </div>
            </section>

            <!-- 卡片二：全局字号调节 -->
            <section class="card">
                <h2 class="card-label">全局字号</h2>
                <div class="fs-row">
                    <button id="fontMinus" class="fs-btn" type="button">A-</button>
                    <div class="fs-center">
                        <span id="fontSizePreview" class="fs-preview">A</span>
                        <span id="fontSizeValue" class="fs-value">14px</span>
                    </div>
                    <button id="fontPlus" class="fs-btn" type="button">A+</button>
                </div>
            </section>

            <!-- 卡片三：字体颜色 -->
            <section class="card">
                <h2 class="card-label">字体颜色</h2>
                <div class="color-row" id="colorRow">
                    <button class="color-chip" type="button" data-color="#111111">
                        <span class="color-dot" style="background: #111111;"></span>
                        <span class="color-name">纯黑</span>
                    </button>
                    <button class="color-chip" type="button" data-color="#555555">
                        <span class="color-dot" style="background: #555555;"></span>
                        <span class="color-name">深灰</span>
                    </button>
                    <button class="color-chip" type="button" data-color="#8E8E93">
                        <span class="color-dot" style="background: #8E8E93;"></span>
                        <span class="color-name">中灰</span>
                    </button>
                    <button class="color-chip" type="button" data-color="#AEAEB2">
                        <span class="color-dot" style="background: #AEAEB2;"></span>
                        <span class="color-name">浅灰</span>
                    </button>
                </div>
            </section>
            <button id="restoreFontDefaults" class="restore-default" type="button">恢复默认</button>
        </main>
    </div>

<script>
(function () {
    'use strict';

    var MIN = 12, MAX = 20, DEFAULT = 14, DEFAULT_COLOR = '#111111';
    var DB_NAME = 'maomao-font-presets', DB_VERSION = 1, STORE_NAME = 'presets';
    var FALLBACK_STACK = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', sans-serif";

    var input = document.getElementById('fontUrlInput');
    var applyBtn = document.getElementById('applyFontBtn');
    var fileInput = document.getElementById('fontFileInput');
    var fileName = document.getElementById('fontFileName');
    var schemeName = document.getElementById('fontSchemeName');
    var savePresetBtn = document.getElementById('saveFontPresetBtn');
    var presetSelect = document.getElementById('fontPresetSelect');
    var deletePresetBtn = document.getElementById('deleteFontPresetBtn');
    var restoreBtn = document.getElementById('restoreFontDefaults');
    var hint = document.getElementById('fontHint');
    var preview = document.getElementById('fontPreview');
    var minusBtn = document.getElementById('fontMinus');
    var plusBtn = document.getElementById('fontPlus');
    var sizePreview = document.getElementById('fontSizePreview');
    var sizeValue = document.getElementById('fontSizeValue');
    var colorRow = document.getElementById('colorRow');
    var colorChips = colorRow.querySelectorAll('.color-chip');

    var pendingSource = null;
    var previewObjectUrl = '';

    function openDB() {
        return new Promise(function (resolve, reject) {
            if (!window.indexedDB) { reject(new Error('当前浏览器不支持本地字体库')); return; }
            var request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = function () {
                var db = request.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            };
            request.onsuccess = function () { resolve(request.result); };
            request.onerror = function () { reject(request.error || new Error('字体库打开失败')); };
            request.onblocked = function () { reject(new Error('字体库正在升级，请关闭其他页面后重试')); };
        });
    }

    function dbGetAll() {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var request = tx.objectStore(STORE_NAME).getAll();
                request.onsuccess = function () { resolve(request.result || []); };
                request.onerror = function () { reject(request.error || new Error('读取字体方案失败')); };
                tx.oncomplete = function () { db.close(); };
            });
        });
    }

    function dbGet(id) {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var request = tx.objectStore(STORE_NAME).get(id);
                request.onsuccess = function () { resolve(request.result || null); };
                request.onerror = function () { reject(request.error || new Error('读取字体方案失败')); };
                tx.oncomplete = function () { db.close(); };
            });
        });
    }

    function dbPut(record) {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(record);
                tx.oncomplete = function () { db.close(); resolve(); };
                tx.onerror = function () { db.close(); reject(tx.error || new Error('保存字体方案失败')); };
                tx.onabort = function () { db.close(); reject(tx.error || new Error('保存字体方案失败')); };
            });
        });
    }

    function dbDelete(id) {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(id);
                tx.oncomplete = function () { db.close(); resolve(); };
                tx.onerror = function () { db.close(); reject(tx.error || new Error('删除字体方案失败')); };
            });
        });
    }

    function showHint(message) {
        hint.textContent = message;
        hint.classList.add('show');
    }

    function getFormat(fileOrUrl) {
        var name = typeof fileOrUrl === 'string' ? fileOrUrl : (fileOrUrl && fileOrUrl.name) || '';
        var match = name.toLowerCase().match(/\.(ttf|woff2?|)(?:[?#]|$)/);
        var ext = match && match[1] ? match[1] : '';
        return ext === 'ttf' ? 'truetype' : (ext === 'woff2' ? 'woff2' : 'woff');
    }

    function revokePreviewUrl() {
        if (previewObjectUrl) {
            try { URL.revokeObjectURL(previewObjectUrl); } catch (e) {}
            previewObjectUrl = '';
        }
    }

    function previewSource(source) {
        var url = '';
        if (source.type === 'file') {
            revokePreviewUrl();
            previewObjectUrl = URL.createObjectURL(source.blob);
            url = previewObjectUrl;
        } else {
            url = source.url;
        }
        var style = document.getElementById('fontPreviewStyle');
        if (!style) {
            style = document.createElement('style');
            style.id = 'fontPreviewStyle';
            document.head.appendChild(style);
        }
        var safeUrl = String(url).replace(/["'\\\r\n]/g, '');
        style.textContent = '@font-face{font-family:"MAOMAOUserFont";src:url("' + safeUrl + '") format("' + source.format + '");font-display:swap;}'
            + '#fontPreview{font-family:"MAOMAOUserFont",' + FALLBACK_STACK + ' !important;}';
    }

    function applyGlobalSource(source) {
        if (!window.MAOMAOFontRuntime) return Promise.resolve(false);
        if (source.type === 'file') return window.MAOMAOFontRuntime.applyBlob(source.blob, source.format);
        window.MAOMAOFontRuntime.applyUrl(source.url, source.format);
        return Promise.resolve(true);
    }

    function normalizeUrl(raw) {
        var parsed;
        try { parsed = new URL(raw, window.location.href); }
        catch (e) { throw new Error('请输入有效的字体链接'); }
        if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') throw new Error('字体链接仅支持 HTTP 或 HTTPS');
        return parsed.href;
    }

    function getSize() {
        try {
            var n = parseInt(localStorage.getItem('font_size_global'), 10);
            if (!isNaN(n)) return Math.min(MAX, Math.max(MIN, n));
            n = parseInt(localStorage.getItem('font_size'), 10);
            if (!isNaN(n)) return Math.min(MAX, Math.max(MIN, n));
        } catch (e) {}
        return DEFAULT;
    }

    function renderSize(n) {
        sizePreview.style.fontSize = n + 'px';
        sizeValue.textContent = n + 'px';
        minusBtn.disabled = n <= MIN;
        plusBtn.disabled = n >= MAX;
        document.documentElement.style.setProperty('--base-font-size', n + 'px');
        document.documentElement.style.setProperty('--global-font-scale', String(Math.round(n / 14 * 1000) / 1000));
    }

    function changeSize(delta) {
        var n = Math.min(MAX, Math.max(MIN, getSize() + delta));
        try { localStorage.setItem('font_size_global', String(n)); } catch (e) {}
        renderSize(n);
    }

    function getColor() {
        try { return (localStorage.getItem('custom_font_color') || '').trim(); }
        catch (e) { return ''; }
    }

    function renderColor(color) {
        preview.style.color = color;
        document.documentElement.style.setProperty('--global-font-color', color);
        if (document.body && !document.documentElement.classList.contains('dark')) {
            document.body.style.color = color;
        }
        Array.prototype.forEach.call(colorChips, function (chip) {
            chip.classList.toggle('active', chip.getAttribute('data-color') === color);
        });
    }

    function pickColor(e) {
        var color = e.currentTarget.getAttribute('data-color');
        try { localStorage.setItem('custom_font_color', color); } catch (err) {}
        renderColor(color);
    }

    function applyUrlFont() {
        var raw = (input.value || '').trim();
        if (!raw) { showHint('请先粘贴字体链接，或导入字体文件'); return; }
        try {
            var url = normalizeUrl(raw);
            pendingSource = { type: 'url', url: url, format: getFormat(url) };
            previewSource(pendingSource);
            try {
                localStorage.setItem('custom_font_url', url);
                localStorage.removeItem('active_font_preset_id');
            } catch (e) {}
            applyGlobalSource(pendingSource);
            presetSelect.value = '';
            showHint('链接字体已应用。填写方案名称后，可保存为随时切换的预设。若预览无变化，请检查链接及字体服务器的跨域设置。');
        } catch (e) {
            showHint(e.message || '字体链接无效');
        }
    }

    function handleFileImport() {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (!/\.(ttf|woff2?)$/i.test(file.name)) {
            fileInput.value = '';
            showHint('目前只支持 TTF、WOFF 或 WOFF2 字体文件');
            return;
        }
        if (file.size > 30 * 1024 * 1024) {
            fileInput.value = '';
            showHint('字体文件较大，请选择 30 MB 以内的文件');
            return;
        }
        pendingSource = { type: 'file', blob: file.slice(0, file.size, file.type || 'application/octet-stream'), format: getFormat(file), fileName: file.name };
        fileName.textContent = file.name;
        previewSource(pendingSource);
        showHint('字体已导入并可预览。填写方案名称，再点“保存并应用字体方案”即可全局使用。');
    }

    function makeId() {
        return 'font_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    function renderPresetOptions(records) {
        var activeId = '';
        try { activeId = localStorage.getItem('active_font_preset_id') || ''; } catch (e) {}
        presetSelect.innerHTML = '<option value="">选择已保存的字体方案</option>';
        records.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
        records.forEach(function (record) {
            var option = document.createElement('option');
            option.value = record.id;
            option.textContent = record.name || '未命名字体';
            presetSelect.appendChild(option);
        });
        presetSelect.value = activeId;
        deletePresetBtn.disabled = !presetSelect.value;
    }

    function refreshPresets() {
        return dbGetAll().then(function (records) {
            renderPresetOptions(records);
            return records;
        });
    }

    function activatePreset(record) {
        if (!record) return;
        pendingSource = record.type === 'file'
            ? { type: 'file', blob: record.blob, format: record.format || 'truetype', fileName: record.fileName || '' }
            : { type: 'url', url: record.url, format: record.format || getFormat(record.url) };
        try {
            localStorage.setItem('active_font_preset_id', record.id);
            localStorage.removeItem('custom_font_url');
        } catch (e) {}
        previewSource(pendingSource);
        var applied = applyGlobalSource(pendingSource);
        if (record.fileName) fileName.textContent = record.fileName;
        showHint('正在应用字体方案：' + record.name);
        deletePresetBtn.disabled = false;
        return applied;
    }

    function savePreset() {
        var name = (schemeName.value || '').trim();
        if (!name) { showHint('先给这套字体起一个方案名称'); schemeName.focus(); return; }

        if (!pendingSource) {
            var raw = (input.value || '').trim();
            if (!raw) { showHint('请先输入字体链接，或导入一个字体文件'); return; }
            try {
                var url = normalizeUrl(raw);
                pendingSource = { type: 'url', url: url, format: getFormat(url) };
            } catch (e) { showHint(e.message || '字体链接无效'); return; }
        }

        var record = {
            id: makeId(), name: name, type: pendingSource.type,
            format: pendingSource.format, createdAt: Date.now()
        };
        if (pendingSource.type === 'file') {
            record.blob = pendingSource.blob;
            record.fileName = pendingSource.fileName || '';
        } else {
            record.url = pendingSource.url;
        }

        savePresetBtn.disabled = true;
        showHint('正在保存字体方案，并准备跨应用字体缓存…');
        dbPut(record).then(function () {
            try {
                localStorage.setItem('active_font_preset_id', record.id);
                localStorage.removeItem('custom_font_url');
            } catch (e) {}
            return Promise.resolve(activatePreset(record)).then(function (cacheReady) {
                schemeName.value = '';
                return refreshPresets().then(function () { return cacheReady; });
            });
        }).then(function (cacheReady) {
            showHint(cacheReady === false
                ? '字体方案已保存并应用。当前浏览器未能建立字体缓存，仍会使用兼容加载方式。'
                : '字体方案已保存并应用，跨应用字体缓存已准备好。之后打开其他应用不必重复读取字体文件。');
        }).catch(function (e) {
            showHint(e.message || '保存失败，请检查浏览器本地存储空间');
        }).then(function () {
            savePresetBtn.disabled = false;
        });
    }

    function choosePreset() {
        var id = presetSelect.value;
        deletePresetBtn.disabled = !id;
        if (!id) return;
        dbGet(id).then(activatePreset).catch(function () { showHint('读取字体方案失败'); });
    }

    function removePreset() {
        var id = presetSelect.value;
        if (!id) return;
        dbDelete(id).then(function () {
            if (window.MAOMAOFontRuntime && window.MAOMAOFontRuntime.removeCached) {
                window.MAOMAOFontRuntime.removeCached(id);
            }
            var activeId = '';
            try { activeId = localStorage.getItem('active_font_preset_id') || ''; } catch (e) {}
            if (activeId === id) {
                try { localStorage.removeItem('active_font_preset_id'); } catch (e) {}
                if (window.MAOMAOFontRuntime) window.MAOMAOFontRuntime.clear();
                var legacyUrl = '';
                try { legacyUrl = localStorage.getItem('custom_font_url') || ''; } catch (e) {}
                if (legacyUrl && window.MAOMAOFontRuntime) window.MAOMAOFontRuntime.applyUrl(legacyUrl);
            }
            return refreshPresets();
        }).then(function () {
            showHint('字体方案已删除');
            presetSelect.value = '';
            deletePresetBtn.disabled = true;
        }).catch(function (e) { showHint(e.message || '删除失败'); });
    }

    function restoreDefaults() {
        try {
            localStorage.removeItem('custom_font_url');
            localStorage.removeItem('active_font_preset_id');
            localStorage.removeItem('font_size_global');
            localStorage.removeItem('font_size');
            localStorage.removeItem('custom_font_color');
        } catch (e) {}
        if (window.MAOMAOFontRuntime) window.MAOMAOFontRuntime.clear();
        revokePreviewUrl();
        var previewStyle = document.getElementById('fontPreviewStyle');
        if (previewStyle) previewStyle.remove();
        pendingSource = null;
        input.value = '';
        fileInput.value = '';
        fileName.textContent = '支持 TTF / WOFF / WOFF2';
        schemeName.value = '';
        presetSelect.value = '';
        deletePresetBtn.disabled = true;
        renderSize(DEFAULT);
        renderColor(DEFAULT_COLOR);
        showHint('已恢复系统默认字体、字号和颜色；已保存的字体方案不会被删除。');
    }

    Array.prototype.forEach.call(colorChips, function (chip) { chip.addEventListener('click', pickColor); });
    minusBtn.addEventListener('click', function () { changeSize(-1); });
    plusBtn.addEventListener('click', function () { changeSize(1); });
    applyBtn.addEventListener('click', applyUrlFont);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') applyUrlFont(); });
    fileInput.addEventListener('change', handleFileImport);
    savePresetBtn.addEventListener('click', savePreset);
    presetSelect.addEventListener('change', choosePreset);
    deletePresetBtn.addEventListener('click', removePreset);
    restoreBtn.addEventListener('click', restoreDefaults);

    renderSize(getSize());
    renderColor(getColor() || DEFAULT_COLOR);
    (function initFontSettings() {
        var activeId = '';
        var savedUrl = '';
        try {
            activeId = localStorage.getItem('active_font_preset_id') || '';
            savedUrl = (localStorage.getItem('custom_font_url') || '').trim();
        } catch (e) {}
        if (savedUrl) {
            input.value = savedUrl;
            pendingSource = { type: 'url', url: savedUrl, format: getFormat(savedUrl) };
            previewSource(pendingSource);
        }
        refreshPresets().then(function (records) {
            if (activeId) {
                return dbGet(activeId).then(function (record) {
                    if (record) {
                        presetSelect.value = record.id;
                        activatePreset(record);
                    } else {
                        try { localStorage.removeItem('active_font_preset_id'); } catch (e) {}
                    }
                });
            }
        }).catch(function (e) {
            showHint(e.message || '字体库暂不可用，仍可使用字体链接导入');
        });
    })();
})();
</script>
</body>
</html>
