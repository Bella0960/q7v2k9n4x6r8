<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons · 自定义图标</title>
    <script src="../shared/js/font-loader.js?v=20261022v1"></script>
    <script src="../shared/js/native-feel.js"></script>
    <script src="../shared/js/statusbar-control.js"></script>
    <script src="../shared/js/wallpaper-store.js?v=20261026v2"></script>
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="../shared/css/mobile-fit.css">
    <style>
      .icon-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(128,128,128,0.12);
      }
      .icon-row:last-child { border-bottom: 0; }
      .icon-preview {
        flex: none;
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: rgba(128,128,128,0.15);
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .icon-preview svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .icon-info { flex: 1; min-width: 0; }
      .icon-name { font-size: 14px; color: var(--text, #111); }
      .icon-state { font-size: 11px; color: var(--aux, #888); margin-top: 2px; }
      .icon-btns { display: flex; gap: 6px; flex: none; }
      .icon-btns button {
        border: 1px solid rgba(128,128,128,0.3);
        background: transparent;
        color: var(--text, #111);
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .icon-btns button:active { opacity: 0.6; }
      .icon-btns button.restore { color: #c0392b; border-color: rgba(192,57,43,0.3); }
      .tip { font-size: 12px; color: var(--aux, #888); padding: 0 4px 12px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar">
            <span class="status-time">09:41</span>
            <div class="status-icons">
                <svg width="15" height="10" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 8.5V3.5M5.5 9.5V2.5M10 10V1.5M14.5 8V4"/></svg>
                <svg width="18" height="10" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="13" height="8" rx="2"/><path d="M16 5v2"/></svg>
            </div>
        </div>

        <header class="header">
            <div class="header-left">
                <button type="button" class="icon-btn back-btn" onclick="location.href='settings.html'" aria-label="返回设置">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 5 12l7 8"/><path d="M5 12h13"/></svg>
                </button>
                <h1 class="header-title">Icons</h1>
            </div>
        </header>

        <main class="content">
            <div class="group-title">APP ICONS</div>
            <p class="tip">点右边「更换」上传一张图片作为该应用图标；点「恢复」回到默认图标。设置完返回桌面即可看到。</p>
            <section class="card" id="iconList"></section>
        </main>
    </div>

    <script>
      // 与 index.html 桌面图标的 data-drag 一一对应
      var APPS = [
        { id: 'app_chat',        name: '聊天',     svg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
        { id: 'app_shop',        name: '商店',     svg: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>' },
        { id: 'app_inspect',     name: '查手机',   svg: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><circle cx="11.7" cy="11.7" r="2.7"/>' },
        { id: 'app_worldbook',   name: '世界书',   svg: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' },
        { id: 'app_memory',      name: '记忆',     svg: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>' },
        { id: 'app_forum',       name: '论坛',     svg: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>' },
        { id: 'app_wallet',      name: '钱包',     svg: '<path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><circle cx="18" cy="14" r="1"/>' },
        { id: 'app_music',       name: '音乐',     svg: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>' },
        { id: 'app_beauty',      name: '聊天美化', svg: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>' },
        { id: 'app_characters',  name: '角色库',   svg: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
        { id: 'app_settings',    name: '设置',     svg: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>' },
        { id: 'app_finance',     name: '记账',     svg: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
        { id: 'app_diary',       name: '日记',     svg: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' },
        { id: 'app_games',       name: '游戏大厅', svg: '<rect x="2" y="6" width="20" height="12" rx="3"/><line x1="7" y1="12" x2="11" y2="12"/><line x1="9" y1="10" x2="9" y2="14"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>' },
        { id: 'app_cafe',        name: '咖啡馆',   svg: '<path d="M4 8h13v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h2a3 3 0 0 1 0 6h-3"/><path d="M8 3c0 1.5 1.5 1.5 1.5 3M13 3c0 1.5 1.5 1.5 1.5 3"/>' },
        { id: 'app_library',     name: '阅读',     svg: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' },
        { id: 'app_dreamtravel', name: '触梦旅行', svg: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>' },
        { id: 'app_shopadmin',   name: '商店管理', svg: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 13h6"/>' }
      ];

      var KEY_PREFIX = 'home_icon_img_';
      var store = window.MAOMAOWallpaperStore;
      var listEl = document.getElementById('iconList');

      function renderRow(app) {
        var row = document.createElement('div');
        row.className = 'icon-row';
        row.innerHTML =
          '<div class="icon-preview" data-id="' + app.id + '">' +
            '<svg viewBox="0 0 24 24">' + app.svg + '</svg>' +
          '</div>' +
          '<div class="icon-info">' +
            '<div class="icon-name">' + app.name + '</div>' +
            '<div class="icon-state" data-state>默认图标</div>' +
          '</div>' +
          '<div class="icon-btns">' +
            '<button type="button" data-act="change">更换</button>' +
            '<button type="button" class="restore" data-act="restore">恢复</button>' +
          '</div>';

        var preview = row.querySelector('.icon-preview');
        var state = row.querySelector('[data-state]');

        store.getByKey(KEY_PREFIX + app.id).then(function (dataUrl) {
          if (dataUrl) {
            preview.style.backgroundImage = 'url("' + dataUrl + '")';
            preview.textContent = '';
            state.textContent = '已自定义';
          }
        });

        row.querySelector('[data-act="change"]').addEventListener('click', function () {
          var fi = document.createElement('input');
          fi.type = 'file';
          fi.accept = 'image/*';
          fi.onchange = function () {
            if (!fi.files[0]) return;
            var file = fi.files[0];
            if (!/^image\//.test(file.type)) { alert('请选择图片文件'); return; }
            var img = new Image();
            var url = URL.createObjectURL(file);
            img.onload = function () {
              URL.revokeObjectURL(url);
              var side = Math.min(256, Math.max(img.width, img.height));
              var scale = side / Math.max(img.width, img.height);
              var w = Math.round(img.width * scale);
              var h = Math.round(img.height * scale);
              var canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              var ctx = canvas.getContext('2d');
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
              store.saveByKey(KEY_PREFIX + app.id, dataUrl).then(function () {
                preview.style.backgroundImage = 'url("' + dataUrl + '")';
                preview.textContent = '';
                state.textContent = '已自定义';
              }).catch(function (err) {
                alert('保存失败：' + (err && err.message ? err.message : err));
              });
            };
            img.onerror = function () { alert('图片读取失败，请换一张'); };
            img.src = url;
          };
          fi.click();
        });

        row.querySelector('[data-act="restore"]').addEventListener('click', function () {
          store.removeByKey(KEY_PREFIX + app.id).then(function () {
            preview.style.backgroundImage = '';
            preview.innerHTML = '<svg viewBox="0 0 24 24">' + app.svg + '</svg>';
            state.textContent = '默认图标';
          }).catch(function () {
            alert('恢复失败');
          });
        });

        listEl.appendChild(row);
      }

      APPS.forEach(renderRow);
    </script>
</body>
</html>
