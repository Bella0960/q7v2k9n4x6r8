<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14101f">
<title>直播间 · MAOER</title>
<link rel="stylesheet" href="../shared/css/mobile-fit.css">
<style>
:root{
  --bg:#14101f;
  --bg2:#1d1630;
  --ink:#fff;
  --muted:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.12);
  --accent:#ff5c8a;
  --gold:#ffc86b;
  --glass:rgba(20,14,32,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
  user-select:none;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ============ 舞台 ============ */
.live-room{
  position:relative;
  width:100%;max-width:480px;
  height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:var(--stage-bg,
    radial-gradient(120% 60% at 50% -10%, #3a2560 0%, transparent 55%),
    radial-gradient(90% 50% at 85% 110%, #4a2040 0%, transparent 60%),
    radial-gradient(70% 40% at 5% 100%, #1f2a55 0%, transparent 55%),
    linear-gradient(180deg,#1a1330 0%,#14101f 50%,#0e0b18 100%));
}
/* 漂浮微尘 */
.stage-dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stage-dust i{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.18);
  animation:dustFloat linear infinite;
}
@keyframes dustFloat{
  0%{transform:translateY(110vh) scale(.6);opacity:0}
  15%{opacity:.7}
  85%{opacity:.5}
  100%{transform:translateY(-10vh) scale(1.1);opacity:0}
}

/* ============ 顶部栏 ============ */
.top-bar{
  position:relative;z-index:20;
  display:flex;align-items:center;gap:7px;
  padding:calc(env(safe-area-inset-top) + 10px) 10px 8px;
}
.top-right{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
}
.icon-btn{
  width:32px;height:32px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;
}
.icon-btn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.host-chip{
  min-width:0;
  display:flex;align-items:center;gap:8px;
  padding:4px 8px 4px 4px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.host-avatar{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,#ff8fb3,#7c6bff);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
  overflow:hidden;border:1.5px solid rgba(255,255,255,.35);
}
.host-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.host-meta{flex:1;min-width:0;line-height:1.25}
.host-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host-sub{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow-btn{
  flex:0 0 auto;
  padding:5px 10px;border-radius:999px;
  background:linear-gradient(90deg,#ff5c8a,#ff7a5c);
  font-size:11px;font-weight:600;color:#fff;
}
.follow-btn.followed{background:rgba(255,255,255,.14);font-weight:400}
.viewer-box{
  display:flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:999px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:11px;color:#fff;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 6px #ff4d4d;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* ============ 中央主播舞台 ============ */
.host-stage{
  position:relative;z-index:5;
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;
  padding:18px 0 6px;
}
.host-halo{
  position:absolute;top:50%;left:50%;
  width:190px;height:190px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(180,130,255,.35) 0%,rgba(255,92,138,.18) 40%,transparent 70%);
  animation:haloBreath 3.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes haloBreath{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}}
.portrait-wrap{position:relative;display:inline-block}
.host-portrait{
  width:118px;height:118px;border-radius:50%;
  background:linear-gradient(135deg,#ff8fb3 0%,#7c6bff 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:700;color:#fff;
  overflow:hidden;
  border:2.5px solid rgba(255,255,255,.5);
  box-shadow:0 12px 40px rgba(124,107,255,.45);
}
.host-portrait img{width:100%;height:100%;object-fit:cover;display:block}
.live-badge{
  position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  padding:2.5px 10px;border-radius:999px;z-index:3;
  background:linear-gradient(90deg,#ff4d4d,#ff7a5c);
  font-size:9.5px;font-weight:700;letter-spacing:1.5px;
  white-space:nowrap;
}
.host-title{
  margin-top:16px;
  font-size:14px;color:rgba(255,255,255,.85);
  text-align:center;padding:0 30px;
  max-width:100%;line-height:1.5;
}
.room-tag{
  margin-top:7px;
  font-size:10.5px;color:var(--muted);
  display:flex;align-items:center;gap:5px;
}
.room-tag::before,.room-tag::after{content:"";width:14px;height:1px;background:rgba(255,255,255,.25)}

/* ============ 弹幕流 ============ */
.chat-stream{
  position:relative;z-index:10;
  flex:1;min-height:0;
  margin:8px 10px 0;
  display:flex;flex-direction:column;justify-content:flex-end;
  gap:7px;
  overflow:hidden;
  mask-image:linear-gradient(180deg,transparent 0%,#000 22%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%);
}
.bubble{
  align-self:flex-start;max-width:86%;
  padding:6px 11px;border-radius:14px;
  background:var(--glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:12.5px;line-height:1.55;
  animation:bubbleIn .28s cubic-bezier(.2,.9,.3,1.2) both;
  word-break:break-word;
}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.bubble .uname{font-weight:600;margin-right:5px}
.bubble .utext{color:rgba(255,255,255,.92)}
.bubble.system{
  background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;
  color:var(--gold);font-size:11.5px;padding:2px 6px;
}
.bubble.host{
  background:linear-gradient(90deg,rgba(255,200,107,.22),rgba(255,92,138,.18));
  border:1px solid rgba(255,200,107,.35);
}
.bubble.host .uname{color:var(--gold)}
.bubble .host-tag{
  display:inline-block;margin-left:6px;padding:0 5px;
  font-size:9px;border-radius:4px;
  background:linear-gradient(90deg,#ffc86b,#ff8fb3);color:#3a1c00;
  font-weight:700;vertical-align:1px;
}
.bubble.me{background:rgba(124,107,255,.28);border:1px solid rgba(180,160,255,.3)}
.bubble.me .uname{color:#b9a5ff}
.bubble.gift-msg{background:linear-gradient(90deg,rgba(255,200,107,.2),rgba(255,150,150,.12))}
.bubble.gift-msg .utext{color:#ffd98a}

/* ============ 飘心层 ============ */
.heart-layer{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.heart-fly{
  position:absolute;bottom:80px;right:24px;
  width:22px;height:22px;
  animation:heartFly 2.6s ease-out forwards;
}
.heart-fly svg{width:100%;height:100%;fill:#ff5c8a}
@keyframes heartFly{
  0%{transform:translate(0,0) scale(.4) rotate(0deg);opacity:0}
  12%{opacity:1;transform:translate(var(--dx,0),-30px) scale(1) rotate(var(--r,0deg))}
  100%{transform:translate(calc(var(--dx,0)*1.6),-480px) scale(.9) rotate(calc(var(--r,0deg) * -1));opacity:0}
}

/* ============ 礼物特效：从下往上飘，渐隐 ============ */
.gift-layer{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.gift-pop{
  position:absolute;left:50%;bottom:120px;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  padding:10px 18px;border-radius:999px;
  background:rgba(20,14,32,.6);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,200,107,.4);
  animation:giftFloat 2.8s ease-out forwards;
  white-space:nowrap;
}
@keyframes giftFloat{
  0%{opacity:0;transform:translate(-50%,30px) scale(.7)}
  12%{opacity:1;transform:translate(-50%,0) scale(1)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-260px) scale(.95)}
}
.gift-pop .gift-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.gift-pop .gift-icon svg{width:22px;height:22px}
.gift-pop .gift-info{line-height:1.3}
.gift-pop .gift-from{font-size:11px;color:#ffd98a;font-weight:600}
.gift-pop .gift-name{font-size:13px;color:#fff;font-weight:700}

/* ============ 底部操作栏 ============ */
.live-controls{
  position:relative;z-index:20;
  display:flex;align-items:center;gap:7px;
  padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
}
.ctrl-group{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.comment-box{
  flex:1;min-width:0;
  height:38px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:0 14px;
  display:flex;align-items:center;
}
.comment-box input{
  flex:1;min-width:0;width:100%;border:0;outline:none;background:transparent;
  font-size:13px;color:#fff;
}
.comment-box input::placeholder{color:rgba(255,255,255,.45)}
.ctrl-btn{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.ctrl-btn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctrl-btn.liked svg{fill:#ff5c8a;stroke:#ff5c8a;animation:likePop .35s ease}
@keyframes likePop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.like-count{
  position:absolute;top:-4px;right:-4px;
  min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:#ff5c8a;
  font-size:10px;font-weight:700;color:#fff;
  display:flex;align-items:center;justify-content:center;
}

/* ============ 礼物面板 ============ */
.gift-sheet{position:absolute;inset:0;z-index:50;display:none}
.gift-sheet.open{display:block}
.gift-sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.gift-panel{
  position:absolute;left:0;right:0;bottom:0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:rgba(24,18,38,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px 22px 0 0;
  animation:panelUp .28s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes panelUp{from{transform:translateY(100%)}to{transform:none}}
.gift-panel-title{font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gift-item{
  padding:14px 8px;border-radius:14px;
  background:rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;gap:7px;
}
.gift-item:active{background:rgba(255,255,255,.14)}
.gift-item .g-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.gift-item .g-icon svg{width:30px;height:30px}
.gift-item .g-name{font-size:11px;color:rgba(255,255,255,.85)}
.gift-item .g-desc{font-size:9.5px;color:var(--muted)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:110px;
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:rgba(0,0,0,.8);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:12px;
  transition:.25s;z-index:99;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 背景面板 ============ */
.bg-sheet{position:absolute;inset:0;z-index:60;display:none}
.bg-sheet.open{display:block}
.bg-sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.bg-panel{
  position:absolute;left:0;right:0;bottom:0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:rgba(24,18,38,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px 22px 0 0;
  animation:panelUp .28s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes panelUp{from{transform:translateY(100%)}to{transform:none}}
.bg-panel-title{font-size:12px;color:var(--muted);margin-bottom:14px}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bg-item{
  height:72px;border-radius:14px;cursor:pointer;
  border:2px solid transparent;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;
  padding:6px;
}
.bg-item:active{border-color:#fff}
.bg-item.active{border-color:#ff5c8a}
.bg-item span{font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:999px}
.bg-item.upload{background:rgba(255,255,255,.08);align-items:center;justify-content:center;color:#fff;font-size:11px}
.bg-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg-item{position:relative}
.viewer-box{cursor:pointer}
.viewer-box.ai-on{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.audience-sheet{position:fixed;inset:0;z-index:60;display:none}
.audience-sheet.open{display:block}
.audience-mask{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.audience-panel{
  position:absolute;left:0;right:0;bottom:0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  background:#141416;border-radius:20px 20px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
.audience-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.audience-kicker{font-size:9px;letter-spacing:.18em;color:var(--muted)}
.audience-title{font-size:15px;font-weight:600;margin-top:2px}
.audience-state{font-size:10.5px;color:var(--muted);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);white-space:nowrap}
.audience-note{margin:12px 0 16px;font-size:11.5px;line-height:1.7;color:rgba(255,255,255,.62)}
.audience-toggle{
  width:100%;padding:12px;border-radius:14px;
  background:rgba(255,255,255,.1);color:#fff;font-size:12.5px;font-weight:600;
}
.audience-toggle.is-on{background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);font-weight:400}
</style>
</head>
<body>
<main class="live-room">
  <div class="stage-dust" id="dustLayer"></div>

  <!-- 顶部栏 -->
  <header class="top-bar">
    <button class="icon-btn" id="backBtn" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="host-chip">
      <div class="host-avatar" id="hostAvatarTop">?</div>
      <div class="host-meta">
        <div class="host-name" id="hostNameTop">主播</div>
        <div class="host-sub" id="hostSub">刚刚开播</div>
      </div>
    </div>
    <div class="top-right">
      <button class="follow-btn" id="followBtn">+ 关注</button>
      <div class="viewer-box" id="viewerBox" role="button" tabindex="0" aria-label="观众设置">
        <span class="live-dot"></span>
        <span id="viewerNum">128</span>
      </div>
      <button class="icon-btn" id="bgBtn" aria-label="背景">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      </button>
      <button class="icon-btn" id="closeBtn" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <!-- 中央主播 -->
  <section class="host-stage">
    <div class="host-halo"></div>
    <div class="portrait-wrap"><div class="host-portrait" id="hostPortrait">?</div><div class="live-badge">LIVE</div></div>
    <div class="host-title" id="roomTitle">今晚慢慢聊</div>
    <div class="room-tag">PRIVATE ROOM</div>
  </section>

  <!-- 弹幕流 -->
  <section class="chat-stream" id="chatStream" aria-live="polite"></section>

  <!-- 飘心 & 礼物特效 -->
  <div class="heart-layer" id="heartLayer"></div>
  <div class="gift-layer" id="giftLayer"></div>

  <!-- 底部操作栏 -->
  <footer class="live-controls">
    <form class="comment-box" id="commentForm">
      <input id="messageInput" maxlength="80" placeholder="说点什么…" autocomplete="off">
    </form>
    <div class="ctrl-group">
      <button class="ctrl-btn" id="likeBtn" aria-label="点赞">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12c-2 4.3-9.5 9-9.5 9z"/></svg>
        <span class="like-count" id="likeCount">0</span>
      </button>
      <button class="ctrl-btn" id="giftBtn" aria-label="礼物">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8s-4 0-4-3c0-2 4-1 4 3zM12 8s4 0 4-3c0-2-4-1-4 3z"/></svg>
      </button>
      <button class="ctrl-btn" id="shareBtn" aria-label="分享">
        <svg viewBox="0 0 24 24"><path d="M12 3v13M8 7l4-4 4 4M5 12v8h14v-8"/></svg>
      </button>
    </div>
  </footer>

  <!-- 礼物面板 -->
  <div class="gift-sheet" id="giftSheet">
    <div class="gift-sheet-mask" id="giftMask"></div>
    <div class="gift-panel">
      <div class="gift-panel-title"><span>送个小礼物</span><span>本地互动 · 不消耗 API</span></div>
      <div class="gift-grid" id="giftGrid"></div>
    </div>
  </div>

  <!-- 背景面板 -->
  <div class="bg-sheet" id="bgSheet">
    <div class="bg-sheet-mask" id="bgMask"></div>
    <div class="bg-panel">
      <div class="bg-panel-title">直播间背景</div>
      <div class="bg-grid" id="bgGrid"></div>
      <input type="file" id="bgUpload" accept="image/*" hidden>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<!-- 观众设置面板 -->
<div class="audience-sheet" id="audienceSheet">
  <div class="audience-mask" id="audienceMask"></div>
  <div class="audience-panel" role="dialog" aria-modal="true" aria-labelledby="audienceTitle">
    <div class="audience-head">
      <div>
        <div class="audience-kicker">AUDIENCE</div>
        <div class="audience-title" id="audienceTitle">观众</div>
      </div>
      <span class="audience-state" id="audienceState">未开启</span>
    </div>
    <p class="audience-note" id="audienceNote">AI 观众是虚拟角色，不是实时真人。</p>
    <button class="audience-toggle" type="button" id="audienceToggle">开启 AI 观众</button>
  </div>
</div>

<script src="../shared/js/phone/phone_storage.js"></script>
<script src="../shared/js/phone/phone_api.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);

/* ========== 数据读取：当前角色 ========== */
/* 角色来源：优先用共享 PhoneStorage（与聊天/世界书同一套正式角色 ID），
   共享模块不可用时才回落到旧键，避免直播间把人显示成无名的「TA」。 */
function characterPersona(c){
  return [c.persona,c.description,c.personality,c.character,c.speechStyle,c.prompt,c.systemPrompt]
    .filter(Boolean).join('\n').slice(0,1600);
}
function readCurrentCharacter(){
  try{
    if(window.PhoneStorage&&typeof PhoneStorage.getCharacters==='function'){
      const list=PhoneStorage.getCharacters()||[];
      if(Array.isArray(list)&&list.length){
        let cid='';
        try{cid=PhoneStorage.getCurrentContactId?String(PhoneStorage.getCurrentContactId()||''):'';}catch(e){cid='';}
        const hit=list.find(x=>x&&String(x.id)===cid)||list[0];
        if(hit)return {name:hit.name||'TA',avatar:hit.avatar||'',persona:characterPersona(hit)};
      }
    }
  }catch(e){}
  try{
    const cid=localStorage.getItem('phone_current_contact')||'';
    const list=JSON.parse(localStorage.getItem('ai_custom_characters')||'[]');
    if(Array.isArray(list)&&list.length){
      let me=list.find(x=>String(x.id||'')===String(cid))||list[0];
      return {name:me.name||'TA',avatar:me.avatar||'',persona:characterPersona(me)};
    }
  }catch(e){}
  return {name:'TA',avatar:'',persona:''};
}

/* ========== 工具 ========== */
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1800);
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function rand(a,b){return a+Math.random()*(b-a)}

/* ========== 弹幕渲染 ========== */
const stream=$('chatStream');
const NAME_COLORS=['#ffb199','#9bd1ff','#c9b1ff','#a8e6a1','#ffd98a','#ff9ec6'];
function pushBubble({name,text,type,color}){
  const row=document.createElement('div');
  row.className='bubble '+type;
  if(type==='system'){
    row.textContent=text;
  }else{
    const n=document.createElement('span');
    n.className='uname';n.textContent=name;
    n.style.color=color||pick(NAME_COLORS);
    if(type==='host'){
      const tag=document.createElement('span');tag.className='host-tag';tag.textContent='主播';
      row.append(n,tag);
    }else{
      row.append(n);
    }
    const tx=document.createElement('span');tx.className='utext';tx.textContent=text;
    row.append(tx);
  }
  stream.append(row);
  while(stream.children.length>18)stream.removeChild(stream.firstChild);
}

/* 配置读取：与设置页保持一致，PhoneStorage 优先，旧键仅作兜底。 */
function liveApiConfig(){
  try{
    if(window.PhoneStorage&&typeof PhoneStorage.getApiConfig==='function'){
      /* 共享配置存在时以当前选中方案为准：即使这一方案没有 key，也不再回落到旧
         api_settings，避免未经当前方案授权就动用遗留密钥产生费用。 */
      return PhoneStorage.getApiConfig()||{};
    }
  }catch(e){}
  /* 只有共享模块整体不可用时，才走旧键兼容 */
  try{return JSON.parse(localStorage.getItem('api_settings')||'{}')}catch(e){return{}}
}
async function callHostAI(userText){
  const cfg=liveApiConfig();
  const key=String(cfg.apiKey||'').trim();
  if(!key){
    // 没配 API：本地兜底一句温柔的话
    const fallbacks=['嗯，我在听呀。','哈哈，你说得对。','今晚有你在，房间一下子就热闹了。','我也这么觉得。','慢慢聊，不着急。'];
    pushBubble({name:me.name,text:pick(fallbacks),type:'host'});
    aiPending=false;return;
  }
  aiPending=true;
  const persona=String(me.persona||'自然、温柔的日常口吻').slice(0,1600);
  const recent=[...stream.querySelectorAll('.bubble')].slice(-6).map(b=>b.textContent).join('\n');
  const system='你正在直播间里扮演「'+me.name+'」主播。人设：'+persona+'。你在和看直播的人轻松聊天，像真实主播一样自然接话，中文1-2句，口语化，带一点直播感（偶尔可以接梗），不要复述弹幕，不要说教。';
  const user='观众刚发了一条弹幕：「'+userText+'」\n最近弹幕：\n'+recent+'\n请以主播身份回应。';
  try{
    /* 统一走 PhoneAPI：与聊天等应用同一套传输/超时/重试，避免各自维护一份请求实现。 */
    if(!window.PhoneAPI||typeof PhoneAPI.complete!=='function')throw new Error('api-unavailable');
    const raw=await PhoneAPI.complete({system,user,temperature:.85,timeoutMs:20000});
    const text=String(raw==null?'':raw).trim();
    if(text)pushBubble({name:me.name,text,type:'host'});
    else throw new Error('empty');
  }catch(e){
    pushBubble({name:me.name,text:'（信号不太好，等一下再说哦）',type:'host'});
  }finally{
    aiPending=false;
  }
}

/* ========== AI 观众（默认关闭 · 付费护栏 · 可降级） ==========
   设计要点：
   1. 默认关闭，只有用户主动开启才会调用付费接口；本地模拟观众始终可用且零费用。
   2. 单次请求批量生成多条弹幕，本地按时间调度播出，不为每个路人单独请求。
   3. 频率上限：每场最多 6 批、两批间隔≥3 分钟、每天最多 12 批（本机限制）。
   4. 关闭模式 / 切后台 / 换页面后立刻作废 token，旧结果不串入。
   5. 失败不重试，直接降级本地模拟并等下次间隔到点再试。
   6. 礼物只是动效与剧情，不触碰钱包、余额与交易。 */
var AI_AUDIENCE_KEY='maomao_live_ai_audience_v1';
var AI_AUDIENCE_DAILY_LIMIT=12;
var AI_AUDIENCE_SESSION_LIMIT=6;
var AI_AUDIENCE_MIN_INTERVAL=3*60*1000;
var AI_AUDIENCE_MAX_LINES=6;
var AI_AUDIENCE_LINE_MAX=40;

/* 稳定的观众人设：昵称与兴趣固定，跨批次保持同一个人 */
var AI_AUDIENCE_ROSTER=[
  {name:'奶盖不加糖',interest:'甜食与深夜便利店'},
  {name:'月亮邮递员',interest:'写信与旧邮票'},
  {name:'气泡水',interest:'livehouse 与贝斯'},
  {name:'早睡冠军',interest:'熬夜失败的日常'},
  {name:'一颗西柚',interest:'盆栽与手冲咖啡'}
];

var aiAudience={
  enabled:false,
  busy:false,
  token:0,
  sessionUsed:0,
  lastAt:0,
  degraded:false,
  recent:[],
  released:0
};

function aiAudienceStore(){
  try{return JSON.parse(localStorage.getItem(AI_AUDIENCE_KEY)||'{}')||{};}catch(e){return{};}
}
function aiAudienceDay(){return new Date().toISOString().slice(0,10);}
/* 总控 P1：原来 aiAudienceUsedToday() 只读 localStorage，一旦 setItem 抛异常（配额满/隐私模式），
   日次数永远不增加；而 setAiAudience 又把 sessionUsed 清零 → 关掉再打开就能绕开全部限额。
   现在加一层会话内单调镜像：跨日才归零，落盘失败也照样推进，开关不重置。 */
var aiAudienceDaily={day:'',used:0,persistBroken:false};
function aiAudienceDailySync(){
  if(aiAudienceDaily.day!==aiAudienceDay()){
    aiAudienceDaily.day=aiAudienceDay();
    aiAudienceDaily.used=0;
    aiAudienceDaily.persistBroken=false;
  }
}
function aiAudienceStoredUsed(){
  var s=aiAudienceStore();
  return s.day===aiAudienceDay()?Number(s.used)||0:0;
}
function aiAudienceUsedToday(){
  aiAudienceDailySync();
  return Math.max(aiAudienceStoredUsed(),aiAudienceDaily.used);
}
function aiAudienceRemaining(){
  return Math.max(0,AI_AUDIENCE_DAILY_LIMIT-aiAudienceUsedToday());
}
function aiAudienceBudgetNote(){
  return '本场剩余 '+Math.max(0,AI_AUDIENCE_SESSION_LIMIT-aiAudience.sessionUsed)+' 批 · 今日剩余 '+aiAudienceRemaining()+' 批（仅本机限制）'
    +(aiAudienceDaily.persistBroken?' · 本机预算写入失败，已按保守计数继续限制':'');
}
/* 总控 P1：写预算必须写进去并读回一致，才允许发付费请求。
   之前第一批请求在写失败后仍然发出，刷新后内存 persistBroken 消失，
   长期限额可被反复绕过。写不进去就 fail-closed：0 请求，直接本地模拟。 */
function persistAiAudienceVerified(){
  try{
    var payload={day:aiAudienceDay(),used:aiAudienceUsedToday()};
    localStorage.setItem(AI_AUDIENCE_KEY,JSON.stringify(payload));
    var back=JSON.parse(localStorage.getItem(AI_AUDIENCE_KEY)||'{}')||{};
    return back.day===payload.day&&Number(back.used)===Number(payload.used);
  }catch(e){return false;}
}
function persistAiAudience(){
  try{
    localStorage.setItem(AI_AUDIENCE_KEY,JSON.stringify({day:aiAudienceDay(),used:aiAudienceUsedToday(),enabled:aiAudience.enabled}));
    return true;
  }catch(e){return false;}
}
/* 记账：返回 false 表示这次不允许发请求。 */
function consumeAiAudienceBudget(){
  aiAudienceDailySync();
  if(aiAudienceUsedToday()>=AI_AUDIENCE_DAILY_LIMIT)return false;
  aiAudienceDaily.used=aiAudienceUsedToday()+1;
  aiAudience.sessionUsed+=1;
  aiAudience.lastAt=Date.now();
  if(!persistAiAudienceVerified()){
    aiAudienceDaily.persistBroken=true;
    return false;                     /* fail-closed：0 请求 */
  }
  return true;
}

function bumpAiAudienceToken(){
  aiAudience.token++;
  aiAudience.busy=false;
}

function setAiAudience(on){
  var next=!!on;
  if(next===aiAudience.enabled){renderAiAudiencePanel();return;}
  aiAudience.enabled=next;
  bumpAiAudienceToken();                 /* 关掉时旧结果全部作废 */
  aiAudience.degraded=false;
  /* 注意：不清 sessionUsed / lastAt。开关来回切不能刷新本场额度，也不能顺手抹掉 3 分钟间隔。 */
  aiAudienceDailySync();
  if(!persistAiAudience()){
    aiAudienceDaily.persistBroken=true;
    toast('本机预算没能写入，AI 观众会按保守计数继续限制');
  }
  $('viewerBox').classList.toggle('ai-on',next);
  renderAiAudiencePanel();
  pushBubble({text:next?'AI 观众已开启 · 这些观众是虚拟角色，不是真人':'AI 观众已关闭，回到本地模拟观众',type:'system'});
  if(next)scheduleAiAudience(6000+Math.random()*6000);
}

function openAudienceSheet(){
  renderAiAudiencePanel();
  $('audienceSheet').classList.add('open');
}
function closeAudienceSheet(){$('audienceSheet').classList.remove('open')}

function renderAiAudiencePanel(){
  var box=$('audienceToggle');
  if(box){
    box.textContent=aiAudience.enabled?'关闭 AI 观众':'开启 AI 观众';
    box.classList.toggle('is-on',aiAudience.enabled);
  }
  var note=$('audienceNote');
  if(note){
    note.textContent=aiAudience.enabled
      ? '已开启：AI 观众是虚拟角色，会调用你配置的付费 AI 接口批量生成弹幕。'+aiAudienceBudgetNote()
      : 'AI 观众是虚拟角色，不是实时真人。开启后会调用你配置的付费 AI 接口，'+'默认每场 6 批、间隔至少 3 分钟、每天 12 批（仅本机限制）。不开启时用本地模拟观众，零费用。';
  }
  var state=$('audienceState');
  if(state)state.textContent=aiAudience.enabled?(aiAudienceDaily.persistBroken?'已暂停（预算写入失败）':(aiAudience.degraded?'已降级为本地模拟':'运行中')):'未开启';
}

function scheduleAiAudience(delay){
  var token=aiAudience.token;
  setTimeout(function(){
    if(token!==aiAudience.token||!aiAudience.enabled)return;
    aiAudienceTick();
  },delay);
}

function aiAudienceTick(){
  if(!aiAudience.enabled)return;
  if(document.hidden)return;                       /* 切后台不请求 */
  if(aiAudience.busy)return;
  if(aiAudience.sessionUsed>=AI_AUDIENCE_SESSION_LIMIT)return;
  if(aiAudienceRemaining()<=0)return;
  var cooldown=AI_AUDIENCE_MIN_INTERVAL-(Date.now()-aiAudience.lastAt);
  if(cooldown>0){scheduleAiAudience(cooldown);return;}
  requestAiAudienceBatch();
}

function parseAiAudienceBatch(raw){
  var txt=String(raw==null?'':raw).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'');
  var a=txt.indexOf('['),z=txt.lastIndexOf(']');
  if(a<0||z<=a)throw new Error('bad-json');
  var list=JSON.parse(txt.slice(a,z+1));
  if(!Array.isArray(list)||!list.length)throw new Error('bad-shape');
  var names=AI_AUDIENCE_ROSTER.map(function(r){return r.name;});
  var out=[];
  list.forEach(function(item){
    if(!item||typeof item.text!=='string')return;
    var text=item.text.replace(/\s+/g,' ').trim().slice(0,AI_AUDIENCE_LINE_MAX);
    if(!text)return;
    var name=names.indexOf(String(item.name||''))>=0?String(item.name):names[out.length%names.length];
    out.push({name:name,text:text});
  });
  if(!out.length)throw new Error('empty-lines');
  return out.slice(0,AI_AUDIENCE_MAX_LINES);
}

/* 本地按时间播出：每条间隔 4–11 秒，播完再等下一批 */
function releaseAiAudienceLines(lines,token){
  var i=0;
  (function next(){
    if(token!==aiAudience.token||!aiAudience.enabled)return;
    if(document.hidden){scheduleAiAudience(20000);return;}
    if(i>=lines.length){scheduleAiAudience(AI_AUDIENCE_MIN_INTERVAL+3000);return;}
    var line=lines[i++];
    pushBubble({name:line.name,text:line.text,type:'viewer ai-viewer'});
    aiAudience.recent.push(line.name+'：'+line.text);
    if(aiAudience.recent.length>8)aiAudience.recent=aiAudience.recent.slice(-8);
    aiAudience.released++;
    setTimeout(next,4000+Math.random()*7000);
  })();
}

function requestAiAudienceBatch(){
  var cfg=liveApiConfig();
  if(!String(cfg.apiKey||'').trim()||!window.PhoneAPI||typeof PhoneAPI.complete!=='function'){
    /* 没有可用接口：保持本地模拟，不重试、不弹窗骚扰 */
    aiAudience.degraded=true;renderAiAudiencePanel();scheduleAiAudience(AI_AUDIENCE_MIN_INTERVAL);return;
  }
  if(aiAudience.sessionUsed>=AI_AUDIENCE_SESSION_LIMIT||aiAudienceRemaining()<=0){
    aiAudience.degraded=true;renderAiAudiencePanel();return;
  }
  /* fail-closed：预算写不进本机，就无法保证跨刷新/跨天真的只花 12 次——
     直接停止新的付费调用，用户重新清出空间后再开启。 */
  if(aiAudienceDaily.persistBroken){
    aiAudience.busy=false;
    aiAudience.degraded=true;
    renderAiAudiencePanel();
    toast('本机预算没能写入，AI 观众已暂停付费调用（避免绕开限额）');
    return;
  }
  if(!consumeAiAudienceBudget()){       /* 先记账：写不进本机就一次也不请求 */
    aiAudience.busy=false;
    aiAudience.degraded=true;
    renderAiAudiencePanel();
    toast('本机预算没能写入，AI 观众已暂停付费调用（避免绕开限额）');
    return;
  }
  var token=aiAudience.token;
  aiAudience.busy=true;
  var roster=AI_AUDIENCE_ROSTER.map(function(r){return r.name+'（喜欢'+r.interest+'）';}).join('；');
  var recentDanmaku=[...stream.querySelectorAll('.bubble')].slice(-6).map(b=>b.textContent).join('\n');
  var system='你正在为一个虚构的直播间接写弹幕。直播间主播叫「'+me.name+'」。观众固定为这几位虚拟观众：'+roster+'。请只用这些名字发言，写出自然、互相接得上、围绕同一话题的弹幕，可以有一个人追问、一个人附和、一个人跑题一句。不要出现真人身份、不要提 AI、不要提礼物价格或收入。只返回 JSON 数组，元素形如 {"name":"观众名","text":"弹幕"}，共 4-6 条，每条不超过 40 字。';
  var user='最近的弹幕：\n'+(recentDanmaku||'（刚开播，还没有弹幕）')+'\n\n请接着这个气氛，让这几位观众自然地继续聊。';
  PhoneAPI.complete({system:system,user:user,temperature:.9,timeoutMs:20000}).then(function(raw){
    if(token!==aiAudience.token||!aiAudience.enabled)return;   /* 过期结果直接丢弃 */
    var lines=parseAiAudienceBatch(raw);
    aiAudience.degraded=false;
    aiAudience.busy=false;
    renderAiAudiencePanel();
    releaseAiAudienceLines(lines,token);
  }).catch(function(){
    if(token!==aiAudience.token)return;
    aiAudience.busy=false;
    aiAudience.degraded=true;           /* 失败只降级，不立即重试 */
    renderAiAudiencePanel();
    scheduleAiAudience(AI_AUDIENCE_MIN_INTERVAL);
  });
}

/* 切后台 / 离开页面：作废进行中的结果与排期 */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    bumpAiAudienceToken();
  }else if(aiAudience.enabled){
    scheduleAiAudience(8000);
  }
});
window.addEventListener('pagehide',bumpAiAudienceToken);
$('viewerBox').addEventListener('click',openAudienceSheet);

$('audienceToggle').addEventListener('click',function(){setAiAudience(!aiAudience.enabled);});
renderAiAudiencePanel();

/* ========== 背景自定义 ========== */
const BG_KEY='maomao_live_bg_v1';
const BG_PRESETS=[
  {key:'neon',name:'霓虹紫',css:''},
  {key:'sunset',name:'粉橙',css:'radial-gradient(120% 60% at 50% -10%,#5a2040 0%,transparent 55%),radial-gradient(90% 50% at 85% 110%,#6b3020 0%,transparent 60%),linear-gradient(180deg,#2a1525 0%,#1a1020 100%)'},
  {key:'midnight',name:'深夜黑',css:'radial-gradient(80% 40% at 50% 0%,#1a1a2e 0%,transparent 60%),linear-gradient(180deg,#0a0a12 0%,#050508 100%)'},
  {key:'mint',name:'青绿',css:'radial-gradient(120% 60% at 50% -10%,#1a4a4a 0%,transparent 55%),radial-gradient(90% 50% at 85% 110%,#2a3a5a 0%,transparent 60%),linear-gradient(180deg,#10202a 0%,#0a1520 100%)'},
  {key:'rose',name:'玫瑰金',css:'radial-gradient(120% 60% at 50% -10%,#4a2030 0%,transparent 55%),radial-gradient(90% 50% at 85% 110%,#3a2a4a 0%,transparent 60%),linear-gradient(180deg,#251520 0%,#150f18 100%)'},
];
function applyBg(bg){
  const root=document.querySelector('.live-room');
  if(!bg)return;
  if(bg.type==='image'&&bg.data){
    root.style.setProperty('--stage-bg','url('+bg.data+') center/cover no-repeat, #14101f');
  }else{
    const p=BG_PRESETS.find(x=>x.key===bg.key);
    root.style.setProperty('--stage-bg',p?p.css:'');
  }
}
function renderBgGrid(){
  const grid=$('bgGrid');
  let html=BG_PRESETS.map(p=>
    '<button class="bg-item" data-bg="'+p.key+'" style="background:'+(p.css||'radial-gradient(120% 60% at 50% -10%,#3a2560 0%,transparent 55%),linear-gradient(180deg,#1a1330,#0e0b18)')+'"><span>'+p.name+'</span></button>'
  ).join('');
  html+='<button class="bg-item upload" id="bgUploadBtn">上传图片</button>';
  grid.innerHTML=html;
  const saved=readBg();
  grid.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('active',saved.key===b.dataset.bg&&saved.type==='preset'));
  grid.querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click',()=>{
    const savedOk=saveBg({type:'preset',key:b.dataset.bg});applyBg({type:'preset',key:b.dataset.bg});closeBgSheet();bgToast(savedOk);
  }));
  $('bgUploadBtn').addEventListener('click',()=>$('bgUpload').click());
}
function readBg(){try{return JSON.parse(localStorage.getItem(BG_KEY)||'{}')}catch(e){return{}}}
function saveBg(b){try{localStorage.setItem(BG_KEY,JSON.stringify(b));return true}catch(e){return false}}
function bgToast(ok){toast(ok?'背景已切换':'背景只在这次显示，本机存储空间不足，没能保存')}
function openBgSheet(){$('bgSheet').classList.add('open');renderBgGrid()}
function closeBgSheet(){$('bgSheet').classList.remove('open')}
$('bgBtn').addEventListener('click',openBgSheet);
$('bgMask').addEventListener('click',closeBgSheet);
$('bgUpload').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const savedOk=saveBg({type:'image',data:r.result});applyBg({type:'image',data:r.result});closeBgSheet();bgToast(savedOk);};
  r.readAsDataURL(f);
});
// 恢复上次背景
applyBg(readBg());
