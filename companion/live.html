<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><title>直播间 · MAOMAO</title>
<link rel="stylesheet" href="../shared/css/mobile-fit.css">
<style>
:root{color-scheme:light;--ink:#111;--paper:#fff;--muted:#96969b;--line:#e7e7e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f1f1f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:480px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
header{height:58px;padding:calc(env(safe-area-inset-top) + 8px) 20px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.back{border:0;background:none;font-size:14px;padding:8px 0;color:#333}
.live-mark{font-size:10px;letter-spacing:2px;color:#777}
.stage{height:clamp(300px,46dvh,430px);background:#111;color:#fff;position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.stage:before,.stage:after{content:"";position:absolute;border:1px solid #353535;border-radius:50%;pointer-events:none}
.stage:before{width:320px;height:320px;right:-140px;top:-100px}
.stage:after{width:220px;height:220px;left:-130px;bottom:-110px}
.stage-top,.stage-bottom{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.live-tag{font-size:10px;letter-spacing:1.8px;border:1px solid #555;padding:7px 9px}
.viewer{font-size:11px;color:#bbb}
.broadcast{position:relative;z-index:1;margin:auto 0}
.broadcast small{font-size:10px;letter-spacing:2px;color:#aaa}
.broadcast h1{font:400 clamp(42px,12vw,62px)/.95 Georgia,serif;letter-spacing:-2px;margin:14px 0 10px;max-width:310px;overflow-wrap:anywhere}
.broadcast p{font-size:12px;color:#aaa;margin:0;max-width:260px;line-height:1.7}
.stage-bottom button{border:1px solid #555;background:transparent;color:#fff;padding:10px 13px;font-size:12px}
.stage-bottom .invite{background:#fff;color:#111;border-color:#fff}
.room-body{flex:1;min-height:0;display:flex;flex-direction:column}
.room-head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.room-head h2{font-size:18px;font-weight:600;margin:0}
.room-head span{font:11px Georgia,serif;color:#888}
.comments{flex:1;min-height:130px;max-height:30dvh;overflow:auto;padding:8px 20px 14px}
.comment{display:flex;gap:11px;padding:10px 0;align-items:flex-start;font-size:12px;line-height:1.65}
.comment-name{color:#777;flex:0 0 auto;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment-text{color:#222;overflow-wrap:anywhere}
.comment.system .comment-name{color:#aaa}
.composer{display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:center}
.composer input{flex:1;min-width:0;border:0;border-bottom:1px solid #d9d9dd;border-radius:0;padding:12px 2px;outline:none;font-size:13px}
.composer button{border:0;background:#111;color:#fff;padding:12px 16px;font-size:12px}
.composer .heart{background:#f3f3f5;color:#111;padding:12px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#111;color:#fff;padding:10px 14px;font-size:12px;transition:.2s;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:no-preference){.stage{animation:enter .45s ease both}.comment{animation:comment-in .2s ease both}@keyframes enter{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes comment-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="app">
<header><button class="back" onclick="history.length>1?history.back():location.href='../index.html'">← 返回</button><span class="live-mark">MAOMAO / LIVE</span></header>
<section class="stage">
 <div class="stage-top"><span class="live-tag">LIVE ROOM</span><span class="viewer" id="viewerCount">01 VIEWER</span></div>
 <div class="broadcast"><small>ON AIR · PRIVATE CHANNEL</small><h1 id="roleTitle">A little<br>room.</h1><p id="roomSubtitle">把此刻留给正在喜欢的故事。</p></div>
 <div class="stage-bottom"><button id="changeTitle">更换主题</button><button class="invite" id="askRole">邀请角色回应</button></div>
</section>
<section class="room-body">
 <div class="room-head"><h2>现场留言</h2><span id="commentCount">00</span></div>
 <div class="comments" id="comments" aria-live="polite"></div>
 <form class="composer" id="commentForm"><input id="message" maxlength="120" placeholder="说点什么…" autocomplete="off" required><button class="heart" type="button" id="like">＋</button><button type="submit">发送</button></form>
</section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const $=id=>document.getElementById(id),KEY='maomao_live_room_v1';
let state={role:'',comments:[],likes:0};
try{state=Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const toast=msg=>{const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
const role=()=>state.role||'TA';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function renderTitle(){$('roleTitle').textContent=role()+' 的直播间';document.title=role()+' 的直播间 · MAOMAO'}
function add(name,text,system){state.comments.push({name,text,system:!!system});state.comments=state.comments.slice(-60);save();renderComments()}
function renderComments(){const box=$('comments');box.replaceChildren();(state.comments||[]).forEach(item=>{const row=document.createElement('div');row.className='comment'+(item.system?' system':'');const name=document.createElement('span');name.className='comment-name';name.textContent=item.name;const text=document.createElement('span');text.className='comment-text';text.textContent=item.text;row.append(name,text);box.append(row)});box.scrollTop=box.scrollHeight;$('commentCount').textContent=String(state.comments.length).padStart(2,'0')}
$('commentForm').addEventListener('submit',e=>{e.preventDefault();const v=$('message').value.trim();if(!v)return;add('你',v,false);$('message').value=''});
$('like').addEventListener('click',()=>{state.likes=(state.likes||0)+1;save();add('系统','互动 +1',true);toast('已点亮互动')});
$('changeTitle').addEventListener('click',()=>{const topics=['今晚慢慢聊','正在播放：此刻','把日常调成静音','只留一点点光'];$('roomSubtitle').textContent=topics[Math.floor(Math.random()*topics.length)]});
async function reply(){
 const btn=$('askRole');const cfg=(()=>{try{return JSON.parse(localStorage.getItem('api_settings')||'{}')}catch(e){return {}}})();
 const key=String(cfg.apiKey||'').trim(),base=String(cfg.baseUrl||'https://api.openai.com/v1').trim().replace(/\/+$/,''),model=String(cfg.model||'gpt-3.5-turbo').trim();
 if(!key){toast('请先配置 API');return}
 let profile={};try{const list=JSON.parse(localStorage.getItem('ai_custom_characters')||'[]');if(Array.isArray(list))profile=list.find(x=>String(x.name||'')===String(state.role||''))||{}}catch(e){}
 const persona=String(profile.personality||profile.description||profile.prompt||profile.systemPrompt||profile.characterDescription||'自然、有个性的日常口吻').slice(0,1600);
 const recent=(state.comments||[]).slice(-10).map(x=>x.name+'：'+x.text).join('\n')||'直播间刚刚开始';
 btn.disabled=true;btn.textContent='回应中…';
 try{const res=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:'你正在 MAOMAO 的私人直播间扮演「'+role()+'」。人设：'+persona+'。根据留言自然回应，中文1-3句。不要声称真实直播或看见现实用户。'},{role:'user',content:'最近留言：\n'+recent+'\n请回应。'}],temperature:.8,max_tokens:180})});if(!res.ok)throw new Error('API 请求失败（HTTP '+res.status+'）');const data=await res.json(),text=String(data.choices?.[0]?.message?.content||'').trim();if(!text)throw new Error('角色没有返回内容');add(role(),text,false);toast('角色已回应')}catch(e){toast(e.message||'请求失败')}finally{btn.disabled=false;btn.textContent='邀请角色回应'}
}
$('askRole').addEventListener('click',reply);
renderTitle();renderComments();$('viewerCount').textContent='01 VIEWER';if(!state.comments.length)add('系统','直播间已开启。留下第一条留言吧。',true);
})();
</script>
</body>
</html>
