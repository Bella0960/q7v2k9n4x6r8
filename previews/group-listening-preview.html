'use strict';const $=id=>document.getElementById(id),tracks=[{title:'晚风经过',artist:'示例歌手',duration:216},{title:'雨落之前',artist:'示例歌手',duration:198},{title:'空白的夜',artist:'示例歌手',duration:240},{title:'窗边的光',artist:'示例歌手',duration:185},{title:'慢一点',artist:'示例歌手',duration:205}];let selected=new Set(),queue=[],index=0,playing=false,elapsed=0,returnFocus=null;const time=v=>Math.floor(v/60)+':'+String(v%60).padStart(2,'0');function menu(open){$('menu').hidden=!open;$('plusBtn').setAttribute('aria-expanded',String(open))}function sheet(kind){returnFocus=document.activeElement;menu(false);$('overlay').hidden=false;$('picker').hidden=kind!=='picker';$('detail').hidden=kind!=='detail';(kind==='picker'?$('picker'):$('detail')).querySelector('[data-close]').focus()}function close(){if($('overlay').hidden)return;$('overlay').hidden=true;$('picker').hidden=true;$('detail').hidden=true;if(returnFocus&&returnFocus.isConnected&&!returnFocus.closest('[hidden]'))returnFocus.focus();else $('plusBtn').focus()}function refresh(){const t=queue[index];$('strip').hidden=!t;if(!t)return;$('stripTitle').textContent=t.title;$('stripMeta').textContent=(playing?'模拟播放中':'已暂停')+' · 3 位示例成员';$('nowTitle').textContent=t.title;$('nowArtist').textContent=t.artist;$('seek').max=t.duration;$('seek').value=elapsed;$('elapsed').textContent=time(elapsed);$('duration').textContent=time(t.duration);for(const id of ['strip','detail']){$(id+'Glyph').setAttribute('href',playing?'#pause':'#play');$(id+'Toggle').setAttribute('aria-label',playing?'暂停':'播放')} $('queue').replaceChildren(...queue.map((item,i)=>{const b=document.createElement('button');b.type='button';b.textContent=item.title;const s=document.createElement('span');s.textContent=i===index?'当前曲目':time(item.duration);b.append(s);b.onclick=()=>{index=i;elapsed=0;refresh()};return b}));}function toggle(){if(queue.length){playing=!playing;refresh()}}function step(n){if(queue.length){index=(index+n+queue.length)%queue.length;elapsed=0;refresh()}}function end(){queue=[];selected.clear();playing=false;elapsed=0;close();refresh();$('plusBtn').focus()}function picker(){selected.clear();$('catalog').replaceChildren(...tracks.map((t,i)=>{const row=document.createElement('label');row.className='track';row.innerHTML='<span class="cover"><svg><use href="#music"/></svg></span><span class="track-text"><span class="track-title"></span><span class="meta"></span></span><input type="checkbox">';row.querySelector('.track-title').textContent=t.title;row.querySelector('.meta').textContent=t.artist+' · '+time(t.duration);const cb=row.querySelector('input');cb.setAttribute('aria-label',t.title);cb.onchange=()=>{if(cb.checked)selected.add(i);else selected.delete(i);$('start').disabled=!selected.size;$('start').textContent=selected.size?'开始播放（'+selected.size+' 首）':'开始播放'};return row}));$('start').disabled=true;$('start').textContent='开始播放';sheet('picker')}$('plusBtn').onclick=()=>menu($('menu').hidden);$('musicBtn').onclick=()=>queue.length?sheet('detail'):picker();$('start').onclick=()=>{if(!selected.size)return;queue=Array.from(selected,i=>tracks[i]);index=0;playing=true;elapsed=0;close();refresh();$('openDetail').focus()};$('openDetail').onclick=()=>sheet('detail');$('stripToggle').onclick=$('detailToggle').onclick=toggle;$('prevBtn').onclick=()=>step(-1);$('nextBtn').onclick=()=>step(1);$('endBtn').onclick=end;$('backBtn').onclick=()=>{close();menu(false)};$('seek').oninput=e=>{elapsed=Number(e.target.value);$('elapsed').textContent=time(elapsed)};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();menu(false)}if(e.key==='Tab'&&!$('overlay').hidden){const active=$('picker').hidden?$('detail'):$('picker'),items=Array.from(active.querySelectorAll('button:not(:disabled),input:not(:disabled)'));if(items.length&&e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(items.length&&!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}});$('composer').onsubmit=e=>{e.preventDefault();const value=$('draft').value.trim();if(!value)return;const row=document.createElement('div');row.className='row me';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=value;row.append(bubble);$('timeline').append(row);$('draft').value='';$('timeline').scrollTop=$('timeline').scrollHeight};
