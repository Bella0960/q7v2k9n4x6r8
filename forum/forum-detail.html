<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>讨论档案 — 帖子详情</title>
<script src="../shared/js/font-loader.js?v=20261022v1"></script>
<script src="../shared/js/native-feel.js"></script>
<script src="../shared/js/phone/phone_storage.js"></script>
<script src="../shared/js/phone/storage/repository.js"></script>
<script src="../shared/js/phone/storage/media-repository.js"></script>

<link rel="stylesheet" href="../shared/css/mobile-fit.css">
<style>
  :root{
    color-scheme:light;
    --ink:#181818;--body:#454545;--muted:#969696;--faint:#b9b9b9;
    --line:#e7e7e7;--paper:#fff;--wash:#f7f7f6;
    --serif:Georgia,"Times New Roman","Songti SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: var(--sans);
    background: repeating-linear-gradient(0deg,rgba(0,0,0,.008) 0,rgba(0,0,0,.008) 1px,transparent 1px,transparent 5px),#fff;
    color: var(--ink);
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: max(90px, var(--maomao-forum-detail-reserved-bottom, 90px)); -webkit-font-smoothing: antialiased;
  }
  .topbar {
    height: 59px; padding: 0 22px;
    padding-top: calc(env(safe-area-inset-top,0px) + 12px);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid rgba(0,0,0,.055);
    background: rgba(255,255,255,.93);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .brand-rule { height: 24px; width: 1px; background: #dedede; flex-shrink: 0; }
  .brand-copy { min-width: 0; display: flex; flex-direction: column; }
  .brand-name { font: 400 15px/1 var(--serif); letter-spacing: .04em; color: var(--ink); }
  .brand-copy small { font-size: 8px; font-weight: 400; letter-spacing: .16em; color: #a0a0a0; margin-top: 5px; display: block; }
  .back-btn { border:0; background:transparent; padding:6px 8px 6px 0; color:#444; display:grid; place-items:center; border-radius:0; border-bottom:1px solid #d0d0d0; transition:transform .2s ease,border-color .2s ease; }
  .back-btn:active { transform:translateY(1px); border-color:#171717; }
  .back-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.45; stroke-linecap:round; stroke-linejoin:round; }

  #postCover { background: transparent; }
  #postCover img { filter: grayscale(1) contrast(1.03); display: block; width: 100%; border: 1px solid #eee; }

  .post-body { padding: 26px 22px 8px; position: relative; background: transparent; }
  .post-body::after { display: none; }

  .p-head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; position: relative; }
  .p-head::before {
    content: "FORUM · DISCUSSION";
    position: absolute; top: -22px; left: 0;
    font-size: 8px; font-weight: 650; letter-spacing: .19em; color: #9a9a9a;
  }
  .p-avatar {
    width: 27px; height: 27px; border-radius: 50%;
    background: #ececec; color: #505050;
    display: grid; place-items: center;
    font: 11px var(--serif); font-weight: 400;
    box-shadow: none; flex-shrink: 0;
    overflow: hidden;
  }
  .p-name { font-size: 9px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 6px; }
  .p-time { font-size: 8px; color: #aaa; margin-top: 3px; letter-spacing: .04em; }
  .p-tag {
    display: inline-block; font-size: 7px; color: #888;
    padding: 3px 4px; border: 1px solid #e6e6e6;
    margin-left: 0; vertical-align: 1px; letter-spacing: .04em;
    border-radius: 0; background: transparent;
  }
  .p-tag.ai { border-color: #444; color: #444; background: transparent; }
  .p-tag.me { border-color: #ddd; color: #888; background: transparent; }

  /* 正文：参考 post-title 版式 */
  .p-content {
    font-size: 15px; line-height: 1.55; font-weight: 650; letter-spacing: -.025em;
    color: var(--ink); margin-bottom: 14px; overflow-wrap: anywhere;
  }

  .p-actions {
    display: flex; gap: 13px; color: #999; font-size: 9px;
    padding-top: 13px; border-top: 1px solid #e8e8e8;
  }
  .p-act { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .p-act svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .p-act.liked { color: #171717; }
  .p-act.liked svg { fill: #171717; stroke: #171717; }

  /* 评论区：参考 feed-header + post 行 */
  .comments { padding: 0 22px; }
  .ai-community-status { padding: 10px 0 4px; color:#aaa; font-size:9px; letter-spacing:.04em; }
  .ai-community-status:empty { display:none; }
  .world-thread-tools[hidden]{display:none}
  .world-thread-tools{margin:8px 0 16px}
  .world-thread-progress{font-size:10px;line-height:1.8;color:#777;margin-bottom:7px}
  .forum-world-author{border-left:2px solid #888;padding-left:11px;scroll-margin-top:90px}
  .forum-world-author .c-text{white-space:pre-wrap;line-height:2;color:#333}
  .gossip-continue { border:1px solid #dedede;background:#fff;color:#222;font:600 11px var(--sans);padding:12px 16px;margin:10px 0 13px;width:100%;text-align:left;cursor:pointer;letter-spacing:.01em; }
  .gossip-continue:disabled { color:#999;cursor:default;background:#f7f7f7; }
  .gossip-continue[hidden] { display:none; }
  .gossip-series { width:100%;padding:11px 15px;min-height:38px;margin:0 0 7px;border:1px solid #dedede;background:#f8f8f8;color:#424242;text-align:left;font:600 11px var(--sans);cursor:pointer; }
  .gossip-series[hidden] { display:none; }
  .gossip-series:disabled { color:#999;cursor:default; }
  .gossip-series-note { font-size:9px;line-height:1.65;color:#999;margin:0 0 12px; }
  .gossip-series-note[hidden] { display:none; }
  .gossip-author-tag { font-size:9px;font-weight:600;color:#333;margin-left:7px; }
  .gossip-reader-tools { margin:10px 0 12px; padding:12px 0; border-top:1px solid #ededed; border-bottom:1px solid #ededed; }
  .gossip-reader-tools[hidden] { display:none; }
  .gossip-reader-top { display:flex;align-items:center;justify-content:space-between;gap:10px; }
  .gossip-reader-actions {display:flex;align-items:center;justify-content:flex-start;gap:16px;margin-top:6px;flex-wrap:wrap;}
  .gossip-read-sentinel {display:block;width:1px;height:1px;pointer-events:none;}
  .gossip-read-manual {border:0;background:transparent;color:#909090;font:10px var(--sans);padding:7px 0 3px;cursor:pointer;}
  .gossip-read-manual:disabled {color:#aaa;cursor:default;}
  .gossip-reader-progress { font-size:11px;color:#4b4b4b;font-weight:600; }
  .gossip-reader-jump { background:transparent;border:0;border-bottom:1px solid #aaa;color:#555;font:11px var(--sans);padding:7px 1px;cursor:pointer; }
  .gossip-reader-jump:disabled { color:#aaa;border-bottom-color:#ddd;cursor:default; }
  .gossip-reader-tabs { display:flex;gap:8px;margin-top:10px; }
  .gossip-reader-tab { border:1px solid #e5e5e5;background:#fff;color:#666;padding:9px 13px;min-height:36px;font:11px var(--sans);cursor:pointer; }
  .gossip-reader-tab[aria-pressed="true"] { background:#191919;color:#fff;border-color:#191919; }
  .gossip-author-update { padding-left:11px;border-left:2px solid #333;scroll-margin-top:88px; }
  .gossip-author-update .c-text { color:#343434;font-size:12px;line-height:2;white-space:pre-wrap; }
  @media (prefers-reduced-motion: reduce) { .gossip-author-update { scroll-behavior:auto; } }

  .c-title {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin: 12px 0 0; padding-bottom: 11px; border-bottom: 1px solid #202020;
    font-size: 15px; font-weight: 650; letter-spacing: -.045em; color: var(--ink);
  }
  .c-title::after {
    content: "COMMENTS / " attr(data-count) "";
    font-size: 7px; letter-spacing: .17em; color: #aaa; font-weight: 400;
    font-family: var(--sans); font-style: normal;
  }
  .comment { display: grid; grid-template-columns: 27px minmax(0,1fr); gap: 11px; padding: 17px 0 16px; border-bottom: 1px solid #e8e8e8; }
  .comment:last-child { border-bottom: none; }
  .c-avatar {
    width: 27px; height: 27px; border-radius: 50%;
    background: #ececec; color: #505050;
    display: grid; place-items: center;
    font: 11px var(--serif); font-weight: 400;
    flex-shrink: 0; box-shadow: none;
    overflow: hidden;
  }
.p-avatar img,.c-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
  .c-body { min-width: 0; }
  .c-name { font-size: 9px; font-weight: 600; color: #444; }
  .c-text { font-size: 11px; line-height: 1.95; color: #656565; margin-top: 3px; overflow-wrap: anywhere; }
  .c-time { font-size: 8px; color: #aaa; margin-top: 4px; letter-spacing: .04em; }
  .c-reply { font-size: 8px; color: #999; margin-top: 4px; margin-left: 10px; cursor: pointer; }
  .c-reply:hover { color: #171717; }
  .c-like { font-size: 8px; color: #999; margin-top: 4px; margin-left: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
  .c-like svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.4; }
  .c-like.liked { color: #171717; }
  .c-follow { font-size: 8px; color: #999; background: transparent; border: 1px solid #ddd; padding: 3px 6px; border-radius: 0; margin-left: 10px; cursor: pointer; }
  .c-follow.followed { background: transparent; color: #aaa; border-color: #eee; }
  .c-actions { display: flex; align-items: center; margin-top: 4px; }
  .c-replies { margin-left: 4px; margin-right: 30px; margin-top: 10px; padding-left: 0; border-left: 0; }
  .c-replies .comment { grid-template-columns: 22px minmax(0,1fr); gap: 9px; padding: 9px 0; border-bottom: 1px solid #ededed; }
  .c-replies .comment:last-child { border-bottom: none; }
  .c-replies .c-avatar { width: 22px; height: 22px; font: 9px var(--serif); }
  .c-replies .c-time { margin-top: 3px; }

  /* 评论输入栏：毛玻璃 + 下划线字段 */
  .forum-media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px;max-width:100%}.forum-media-item{margin:0;min-width:0;overflow:hidden;background:#f1f1f1;aspect-ratio:4/3}.forum-media-item img{display:block;width:100%;height:100%;object-fit:cover}.forum-media-item img.media-load-failed{object-fit:contain;padding:12px;color:#888;font-size:9px}.post-detail-media{margin-top:15px}.comment-media{max-width:230px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:9px}.comment-media .forum-media-item{aspect-ratio:1/1}.forum-preview-item{width:58px;height:58px;flex:0 0 58px;margin:0;overflow:hidden;background:#f1f1f1}.forum-preview-item img{width:100%;height:100%;object-fit:cover}.forum-image-preview{display:flex;gap:7px;overflow-x:auto;max-width:100%}.comment-bar{flex-direction:column;align-items:stretch;gap:7px}.comment-input-row{display:flex;align-items:center;gap:8px;width:100%}.comment-input-row input{min-width:0}.comment-image-button{width:30px;height:30px;flex:0 0 30px;border:1px solid #ddd;background:#fff;color:#555;font-size:17px;line-height:1}.comment-bar .forum-image-preview:empty{display:none}
  .comment-bar {
    /* Keep the existing comment input above the independent Home Indicator. */
    position: fixed; bottom: var(--maomao-home-indicator-comment-bottom, calc(24px + env(safe-area-inset-bottom,0px))); left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-top: 1px solid #e8e8e8;
    display: flex; gap: 12px; align-items: center;
    padding: 10px 22px;
    padding-bottom: var(--maomao-home-indicator-comment-padding-bottom, 10px);
  }
  /* mobile-fit.css uses !important for generic bottom bars. On this forum page
     the Home Indicator owner supplies a more precise per-page padding setting. */
  @media (max-width: 480px) {
    body .comment-bar {
      padding-bottom: var(--maomao-home-indicator-comment-padding-bottom, 10px) !important;
    }
  }
  .comment-bar input {
    flex: 1; height: auto; background: transparent;
    border: 0; border-bottom: 1px solid #ddd;
    outline: none; padding: 6px 0; font-size: 12px;
    border-radius: 0; font-family: var(--sans); color: #252525;
  }
  .comment-bar input::placeholder { color: #b8b8b8; }
  .send-btn {
    width: auto; height: auto; border-radius: 2px;
    background: #181818; color: #fff; border: none;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 10px 14px; font-size: 10px; letter-spacing: .05em; font-family: var(--sans);
  }
  .send-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.45; stroke-linecap: round; }
  .comment-bar{flex-direction:column;align-items:stretch;gap:7px}.comment-input-row{display:flex;align-items:center;gap:8px;width:100%}.comment-input-row input{min-width:0}.comment-bar .forum-image-preview{width:100%}
  /* 正文两段式：粗标题在上、细正文在下（编辑式） */
  .p-title { font-size: 15px; line-height: 1.55; font-weight: 650; letter-spacing: -.025em; color: var(--ink); overflow-wrap: anywhere; }
  .p-body { font-size: 11px; line-height: 1.95; color: #656565; margin: 9px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  /* 回复提示条：清晰显示回复对象 */
  .reply-hint {
    position: fixed; bottom: calc(var(--maomao-home-indicator-comment-bottom, calc(24px + env(safe-area-inset-bottom,0px))) + 66px); left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 22px;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e8e8e8;
    font-size: 8px; color: #999; letter-spacing: .04em; z-index: 15;
  }
  .reply-hint .rh-label { color: #444; font-weight: 600; }
  .reply-hint button {
    border: 0; background: transparent; cursor: pointer; margin-left: auto;
    font-family: var(--serif); font-style: italic; font-size: 10px; color: #888;
    border-bottom: 1px solid #ccc; padding: 0 0 2px; letter-spacing: .03em;
  }
  /* 删除自己的评论 */
  .c-del { font-size: 8px; color: #999; margin-top: 4px; margin-left: 10px; cursor: pointer; }
  .c-del:hover { color: #171717; }
  .c-replies .c-del { margin-left: 8px; }
  /* 回复对象标注 */
  .c-at { font-size: 8px; color: #999; font-weight: 400; letter-spacing: .03em; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <button class="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand-rule"></div>
      <div class="brand-copy">
        <span class="brand-name">The Forum</span>
        <small>一个认真说话的地方</small>
      </div>
    </div>
  </div>

  <div id="postCover" style="display:none"></div>
  <div class="post-body">
    <div class="p-head">
      <div class="p-avatar" id="pAvatar"></div>
      <div>
        <div class="p-name" id="pName"></div>
        <div class="p-time" id="pTime"></div>
      </div>
    </div>
    <div class="p-content" id="pContent"></div>
    <div class="p-actions">
      <div class="p-act" id="likeBtn" onclick="toggleLike()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="likeCount">0</span>
      </div>
      <div class="p-act">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span id="commentCount">0</span>
      </div>
      <div class="p-act" onclick="aiReply()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 7.7H23l-6.2 4.5 2.4 7.3L12 16.8l-7.2 4.7 2.4-7.3L1 9.7h8.5z"/></svg>
        AI
      </div>
      <div class="p-act" onclick="sharePost()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
        分享
      </div>
      <div class="p-act" onclick="deletePost()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        删除
      </div>
    </div>
  </div>

  <div class="comments">
    <div class="c-title" data-count="0">评论与回复</div>
    <div id="aiCommentStatus" class="ai-community-status" aria-live="polite"></div>
    <div id="gossipReaderTools" class="gossip-reader-tools" hidden>
      <div class="gossip-reader-top"><span id="gossipReaderProgress" class="gossip-reader-progress">连载 · 正在开篇</span></div>
      <div class="gossip-reader-actions">
        <button id="gossipResume" class="gossip-reader-jump" type="button" onclick="resumeGossipReading()" disabled>接着读</button>
        <button id="gossipJumpLatest" class="gossip-reader-jump" type="button" onclick="jumpToGossipLatest()" disabled>跳到最新一更</button>
      </div>
      <div class="gossip-reader-tabs" role="group" aria-label="八卦连载阅读模式">
        <button id="gossipViewAll" class="gossip-reader-tab" type="button" aria-pressed="true" onclick="setGossipView('all')">全部讨论</button>
        <button id="gossipViewAuthor" class="gossip-reader-tab" type="button" aria-pressed="false" onclick="setGossipView('author')">只看楼主</button>
      </div>
    </div>
    <button id="gossipContinue" class="gossip-continue" type="button" onclick="continueGossip()" hidden>让楼主继续讲</button>
    <button id="gossipFinishAll" class="gossip-series" type="button" onclick="finishGossipSeries()" hidden>连续讲到结局</button>
    <p id="gossipSeriesNote" class="gossip-series-note" hidden>连续追更会逐章调用你配置的 API，每更保存一次；点“停止”后不会再开始下一更。</p>
    <div id="forumWorldTools" class="world-thread-tools" hidden>
      <p id="forumWorldProgress" class="world-thread-progress" aria-live="polite"></p>
      <button id="forumWorldContinue" class="gossip-continue" type="button" onclick="continueForumWorld()">让楼主补充新进展</button>
    </div>
    <div id="commentList"></div>
  </div>

  <div class="reply-hint" id="replyHint" style="display:none">
    <span>回复</span><span class="rh-label" id="replyTargetName"></span>
    <button onclick="cancelReply()">取消</button>
  </div>

  <div class="comment-bar">
    <div class="comment-input-row"><input type="text" id="commentInput" placeholder="给这段表达留一句回应…">
    <button type="button" class="comment-image-button" id="commentImageButton" aria-label="添加图片">＋</button>
    <button class="send-btn" onclick="sendComment()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button></div>
    <input type="file" id="commentImages" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/heic,image/heif" multiple hidden>
    <div class="forum-image-preview" id="commentImagePreview" aria-live="polite"></div>
  </div>

<script>
/* Keep the reply target above the real composer, including image previews.
 * The composer can grow or move when the independent Home Indicator toggles;
 * the old fixed 64px reply hint could cover the input. */
(function keepReplyHintAboveComposer() {
  var composer = document.querySelector('.comment-bar');
  var hint = document.getElementById('replyHint');
  if (!composer || !hint) return;

function buildPreviousSeedSets(stored,seedIds){
 const themes=new Set();
 (Array.isArray(stored)?stored:[]).forEach(item=>{

  if(!seedIds.has(String(item.id)))return;

  if(themeId)themes.add(themeId);
 });
 const previous=new Map();
 themes.forEach(themeId=>{
  const seeds=getSeededPosts(themeId).map(p=>({...p}));

/* 按字段判断种子帖是否被用户改过：只有存储值仍等于「上一次种子默认值」时才同步为新默认值。 */
function mergeForumPosts(stored,seedPosts,previousSeedSets){
 const syncFields=['id','name','avatar','topic','title','body','featured','owner','themeId'];
 const seedById=new Map(seedPosts.map(p=>[String(p.id),p]));
 const previousByTheme=previousSeedSets instanceof Map?previousSeedSets:new Map();
 const seenSeeds=new Set(),merged=[];
 (Array.isArray(stored)?stored:[]).forEach(item=>{
  if(!item||typeof item!=='object'||Array.isArray(item)||item.id==null)return;
  const id=String(item.id),seed=seedById.get(id);
  if(seed){
   const themeId=typeof item.themeId==='string'?item.themeId.trim():'';
   const previousSeeds=previousByTheme.get(themeId);
   const previousSeed=previousSeeds instanceof Map?previousSeeds.get(id):null;
   const combined={...seed,...item};
   syncFields.forEach(key=>{
    if(!Object.prototype.hasOwnProperty.call(seed,key))return;
    const nextDefault=seed[key];
    const hasValue=Object.prototype.hasOwnProperty.call(item,key);
    const previousDefault=previousSeed&&Object.prototype.hasOwnProperty.call(previousSeed,key)?previousSeed[key]:nextDefault;
    const untouched=hasValue?item[key]===previousDefault:true;
    if(untouched)combined[key]=nextDefault;
    else if(hasValue)combined[key]=item[key];
    else combined[key]=nextDefault;
   });
   merged.push(combined);seenSeeds.add(id);return;
  }
  if(id.indexOf('seed_')===0&&item.owner!=='me'&&item.tag!=='me')return;
  merged.push({...item});
 });
 seedPosts.forEach(seed=>{if(!seenSeeds.has(String(seed.id)))merged.push({...seed})});
 return merged;
}

      // 打开帖子时自动触发的后台生成：评论区内联 status 已是可见提示，再弹 toast 会在每次打开帖子时重复打扰，故此处只用状态文案。
      if(status)status.textContent=(post.mediaAssetIds||[]).length?'图片已经保留；当前 API 或模型可能不支持看图，暂时无法生成图片讨论':'路人暂时没有赶来，稍后重新打开帖子再试试';
    }
  }

  function getPostId() {
    return new URLSearchParams(location.search).get('id');
  }
  function loadPosts() {
    const seedPosts = getSeededPosts().map(item => ({ ...item }));
    let forumCfg={};
    try { forumCfg=JSON.parse(localStorage.getItem('forum_config')||'{}'); } catch(error) {}
    const seedThemeId=forumCfg.theme||'reality';
    const fillSeedDefaults=()=>seedPosts.forEach(item=>ensureSeedCommentsDetail(item,seedThemeId));
    const seedIds = new Set(seedPosts.map(p => String(p.id)));
    let raw;
    try { raw = localStorage.getItem('forum_posts'); }
    catch (error) {
      console.warn('[Forum] 读取本地帖子失败，先展示默认内容', error);
      toast('读取本机帖子失败，先显示默认内容');
      fillSeedDefaults();
      return seedPosts;
    }
    if (raw === null) {
      fillSeedDefaults();
      try { savePosts(seedPosts); }
      catch (error) {
        console.warn('[Forum] 首次写入种子帖子失败，默认内容仍可浏览', error);
        toast('本机存储暂时无法写入，本次内容不会保留');
      }
      return seedPosts;
    }
    let stored;
    try { stored = JSON.parse(raw); }
    catch (error) {
      console.warn('[Forum] 帖子数据损坏，保留页面外壳并展示默认内容', error);
      toast('本地帖子数据无法读取，先显示默认内容');
      fillSeedDefaults();
      return seedPosts;
    }
    if (!Array.isArray(stored)) {
      console.warn('[Forum] 帖子数据不是列表，保留页面外壳并展示默认内容');
      toast('本地帖子数据格式异常，先显示默认内容');
      fillSeedDefaults();
      return seedPosts;
    }
    const merged = mergeForumPosts(stored, seedPosts, buildPreviousSeedSets(stored, seedIds));
    merged.forEach(item=>{
      if(!(item.owner==='seed'||String(item.id||'').indexOf('p')===0)){
        if(typeof item.comments==='number'){item.comments=[];item.seedCommentsFilled=true;}
        else if(!Array.isArray(item.comments)){item.comments=[];}
        return;
      }
      ensureSeedCommentsDetail(item,seedThemeId);
      if(!Array.isArray(item.comments))item.comments=[];
    });
    try {
      if (JSON.stringify(merged) !== JSON.stringify(stored)) savePosts(merged);
    } catch (error) {
      console.warn('[Forum] 合并结果回写失败，已读出的帖子继续展示', error);
      toast('本次改动未写入本机，下次打开可能不会保留');
    }
    return merged;
  }
  function savePosts(arr) {
    localStorage.setItem('forum_posts', JSON.stringify(arr));
  }
  function timeAgo(ts) {
    const h = Math.floor((Date.now() - ts) / 3600000);
    if (h < 1) return '刚刚';
    if (h < 24) return h + '小时前';
    return Math.floor(h/24) + '天前';
  }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function safeTime(t){ return (typeof t==='number') ? timeAgo(t) : (t || '刚刚'); }
  function postTitle(){ return post.title || ''; }
  function postBody(){ return post.body || post.content || ''; }

  let post = null;
  let commentImageFiles=[];
  let gossipReplyBusy=false;
  let gossipSeriesRunning=false;
  let gossipSeriesStopRequested=false;
  let gossipView='all';
  let worldReplyBusy=false,worldPageHidden=false;
  let gossipReadObserver=null;
  function gossipLocalStore(){try{return window.localStorage}catch(error){return null}}
  function syncGossipReading(){
    if(!post||!window.ForumGossip||!ForumGossip.isGossipPost(post))return;
    const progress=ForumGossip.progress(post);
    const store=gossipLocalStore();
    const unread=ForumGossip.unreadCount(post,store);
    const label=document.getElementById('gossipReaderProgress');
    if(label)label.textContent='虚构连载 · '+(progress.finished?'已完结':'更新中')+
      ' · '+progress.chapter+'/'+progress.maxChapters+' 更'+(unread?' · 未读 '+unread+' 更':'');
    const resume=document.getElementById('gossipResume');
    if(resume)resume.disabled=!ForumGossip.nextUnreadChapter(post,store);
    document.querySelectorAll('#commentList [data-gossip-mark-read]').forEach(function(button){
      const chapter=Number(button.getAttribute('data-gossip-mark-read'));
      const saved=ForumGossip.readChapter(post,store)>=chapter;
      button.disabled=saved;
      button.textContent=saved?'已读':'读完这一更';
    });
  }
  function markGossipRead(chapter){
    if(!post||!window.ForumGossip||!ForumGossip.isGossipPost(post))return false;
    const saved=ForumGossip.markReadChapter(post,chapter,gossipLocalStore());
    if(saved)syncGossipReading();
    return saved;
  }
  function observeGossipRead(){
    if(gossipReadObserver){gossipReadObserver.disconnect();gossipReadObserver=null}
    if(!post||!window.ForumGossip||!ForumGossip.isGossipPost(post))return;
    if(!('IntersectionObserver' in window))return;
    gossipReadObserver=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting||document.hidden)return;
        const chapter=Number(entry.target.getAttribute('data-gossip-read-chapter'));
        if(markGossipRead(chapter)&&gossipReadObserver)gossipReadObserver.unobserve(entry.target);
      });
    },{root:null,rootMargin:'0px 0px -18% 0px',threshold:0.75});
    document.querySelectorAll('#commentList [data-gossip-read-chapter]').forEach(function(marker){
      gossipReadObserver.observe(marker);
    });
  }
  function resumeGossipReading(){
    if(!post||!window.ForumGossip||!ForumGossip.isGossipPost(post))return;
    const chapter=ForumGossip.nextUnreadChapter(post,gossipLocalStore());
    if(!chapter){toast('已经读到最新一更了');return}
    const target=document.querySelector('#commentList [data-gossip-chapter="'+chapter+'"]');
    if(!target){toast('这一更暂时未能加载，请重新打开帖子');return}
    target.scrollIntoView({behavior:window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  }
  function setGossipView(mode){

  function jumpToGossipLatest(){
    if(!post||!window.ForumGossip||!ForumGossip.isGossipPost(post))return;
    const updates=document.querySelectorAll('#commentList [data-gossip-chapter]');
    const latest=updates.length?updates[updates.length-1]:null;

  function loadPost() {
    const id = getPostId();
    const posts = loadPosts();
    post = posts.find(p => p.id === id);
    if (!post) {
      const head = document.querySelector('.p-head');
      const actions = document.querySelector('.p-actions');
      const content = document.getElementById('pContent');
      const commentList = document.getElementById('commentList');
      const commentInput = document.getElementById('commentInput');
      const sendButton = document.querySelector('.comment-bar .send-btn');
      if (head) head.style.display = 'none';
      if (actions) actions.style.display = 'none';
      if (content) content.textContent = '这条帖子暂时无法找到，可能已被删除或本地数据暂不可用。';
      if (commentList) commentList.textContent = '暂时无法加载这条帖子的评论。';
      if (commentInput) { commentInput.disabled = true; commentInput.placeholder = '帖子暂不可用'; }
      if (sendButton) sendButton.disabled = true;
      return;
    }
    if (!Array.isArray(post.comments)) post.comments = [];
    renderPost();
    renderComments();
    if(post.aiCommentBatch!=='v1')generateInitialAIComments();
    if (new URLSearchParams(location.search).get('focus') === 'comment') {
      setTimeout(() => {

      const progress=ForumGossip.progress(post);

        gossipButton.textContent=progress.finished?'这条瓜已经讲完':gossipReplyBusy?'楼主正在写后续…':'让楼主继续讲 · '+progress.chapter+' / '+progress.maxChapters;
      }
    }
    const seriesButton=document.getElementById('gossipFinishAll');
    const seriesNote=document.getElementById('gossipSeriesNote');
    if(seriesButton){
      seriesButton.hidden=!hasGossipStory;
      if(hasGossipStory){
        const progress=ForumGossip.progress(post);
        seriesButton.disabled=(progress.finished&&!gossipSeriesRunning)||(gossipReplyBusy&&!gossipSeriesRunning);
        seriesButton.textContent=gossipSeriesRunning?(gossipSeriesStopRequested?'将在这一更后停止':'停止连续追更'):'连续讲到结局';
      }
    }

    const eventTools=document.getElementById('forumWorldTools');

    if(eventTools){

  function isSafeAvatarImage(src) {

  function avatarContent(item, isUserPost) {
    const own = !!isUserPost || isOwn(item);
    const src = own ? getMyForumAvatar() : (item && item.avatar);
    if (isSafeAvatarImage(src)) return '<img src="' + esc(src) + '" alt="">';
    const value = item && item.avatar;
    return esc(value && value.length === 1 ? value : ((item && item.name) || '?')[0]);
  }

  function likeComment(i) {
    const c = post?.comments?.[i];
    if (!c) return;
    const wasLiked = Boolean(c.liked);
    const oldLikes = Number(c.likes) || 0;
    c.liked = !wasLiked;
    c.likes = Math.max(0, oldLikes + (c.liked ? 1 : -1));
    if (!saveNow()) { c.liked = wasLiked; c.likes = oldLikes; }
    renderComments();
  }

  function likeReply(i, j) {
    const r = post?.comments?.[i]?.replies?.[j];
    if (!r) return;
    const wasLiked = Boolean(r.liked);
    const oldLikes = Number(r.likes) || 0;
    r.liked = !wasLiked;
    r.likes = Math.max(0, oldLikes + (r.liked ? 1 : -1));
    if (!saveNow()) { r.liked = wasLiked; r.likes = oldLikes; }
    renderComments();
  }

  let replyToIdx = -1;
  function replyTo(idx) {
    replyToIdx = idx;
    document.getElementById('replyTargetName').textContent = '@' + (post.comments[idx].name || '匿名');
    document.getElementById('replyHint').style.display = 'flex';
    const input = document.getElementById('commentInput');
    input.placeholder = '回复 @' + (post.comments[idx].name || '匿名') + '…';
    input.focus();

  function cancelReply() {
    replyToIdx = -1;
    document.getElementById('replyHint').style.display = 'none';
    document.getElementById('commentInput').placeholder = '给这段表达留一句回应…';
  }

  function saveNow() {
    try {
      const posts = loadPosts();
      const idx = posts.findIndex(p => p.id === post.id);
      if (idx < 0) throw new Error('帖子已不存在，无法保存');
      posts[idx] = post;
      const serialized = JSON.stringify(posts);
      localStorage.setItem('forum_posts', serialized);
      // Mobile storage can silently refuse writes. Do not report success without readback.
      if (localStorage.getItem('forum_posts') !== serialized) {
        throw new Error('本机存储回读不一致');
      }
      return true;
    } catch(e) { console.warn('[Forum] 保存帖子改动失败，当前页面继续显示已读出的内容', e); }
    toast('保存失败，请重试');
    return false;
  }
  function toast(msg) {
    let t = document.getElementById('pageToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'pageToast';
      t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;background:rgba(22,22,22,.92);color:#fff;padding:9px 13px;font-size:10px;border-radius:2px;letter-spacing:.02em;pointer-events:none;opacity:0;transition:opacity .2s;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.style.opacity = '0'; }, 1600);
  }

  function deleteComment(i) {
    const removed=post.comments[i];
    if (!isOwn(removed)) return;
    post.comments.splice(i,1);
    if(!saveNow()){
      post.comments.splice(i,0,removed);
      renderComments();renderPost();
      return;
    }
    if(replyToIdx>=i)cancelReply();
    if(removed.id&&Array.isArray(removed.mediaAssetIds)&&window.ForumMedia)
      ForumMedia.release(removed.mediaAssetIds,'forum-comment',removed.id);
    renderComments();renderPost();
    toast('评论已删除');
  }
  function deleteReply(i, j) {
    const c = post.comments[i],removed=c&&c.replies&&c.replies[j];
    if (!removed || !isOwn(removed)) return;
    c.replies.splice(j,1);
    if(!saveNow()){
      c.replies.splice(j,0,removed);
      renderComments();renderPost();
      return;
    }
    if(removed.id&&Array.isArray(removed.mediaAssetIds)&&window.ForumMedia)
      ForumMedia.release(removed.mediaAssetIds,'forum-comment',removed.id);
    renderComments();renderPost();
    toast('回复已删除');
  }

  function toggleLike() {
    if (!post) return;
    const wasLiked = Boolean(post.liked);
    const oldLikes = Number(post.likes) || 0;
    post.liked = !wasLiked;
    post.likes = Math.max(0, oldLikes + (post.liked ? 1 : -1));
    if (!saveNow()) { post.liked = wasLiked; post.likes = oldLikes; }
    renderPost();
  }

  // Serialized gossip: a commenter can ask for more; the original fictional poster continues.
  async function generateGossipAuthorContinuation(target,readerText){
    if(!post||!window.ForumGossip||!ForumGossip.isGossipPost(post)||gossipReplyBusy)return false;
    const story=post.gossipStory,progress=ForumGossip.progress(post);
    if(progress.finished){toast('楼主已经把这个故事讲完了');return false}
    const status=document.getElementById('aiCommentStatus');
    const nextChapter=progress.nextChapter;
    const maxChapters=progress.maxChapters;
    const ending=nextChapter>=maxChapters;
    gossipReplyBusy=true;
    renderPost();
    if(status)status.textContent='楼主正在整理第 '+nextChapter+' 段后续…';
    try{
      const updates=post.comments.filter(function(c){return c&&c.source==='gossip-author'}).map(function(c){
        return {chapter:c.gossipChapter,text:String(c.text||'').slice(0,950)};
      });
      const context={
        outline:story.outline,storyPremise:story.premise,storyCast:story.cast,
        establishedFacts:Array.isArray(story.facts)?story.facts.slice(-22):[],
        title:postTitle(),originalPost:postBody(),previousUpdates:updates.slice(-6),
        readerQuestion:String(readerText||'请继续讲后面的事情').slice(0,250),
        chapter:nextChapter,totalChapters:maxChapters,finalChapter:ending
      };
      const prompt='现在请扮演这条【完全虚构的八卦帖子】的原楼主，在评论区继续讲故事，给追更读者带来新的实质进展。只返回 JSON。\\n全部设定和已发生事实：'+JSON.stringify(context)+
        '\\n写作规则：1. 不是摘要或重写原文。你必须延续上次说到的位置，每一更给出至少两个此前没有披露的新事实、行动、对话或关系变化，前后时间线、人物与已发生事件绝不能冲突。2. 语气像原帖作者随手回来爆后续：自然、细节多、有情绪和口语，可以说“我又来更新了”，但不要每一回都这样开头。正文 180-420 个汉字，分两到四个自然段，不能列提纲、写分析或用同一套反转模板。3. 只在故事早期埋疑点；情节要一回比一回更接近答案，不能无限挖坑。'+(ending?'4. 这是最终一更：交代完整结果、人物最终选择以及之前悬念的答案，明确收尾，不要再留“下次再说”。':'4. 这次必须揭晓一个之前留下的重要线索，同时自然留下尚未解决的问题，但不要重复前一更内容。')+
        '\\n人物都要是虚构的普通成年人，不能指向现实可识别人物，不能声称现实人物的隐私或未经证实的负面事实。不要把 AI、故事设定、提示词写到正文。\\nJSON 格式：{"update":"楼主本次长篇后续","newFacts":["本次新增事实1","本次新增事实2"],"reactions":[{"residentId":"路人id","text":"一句自然的催更或讨论"}],"finished":'+(ending?'true':'false')+'}。reactions 可为空，最多两条，不要全都说蹲。';
      const result=await forumAIJSON(prompt,0.93,[]);
      if(!result||!result.ok||!result.data)throw new Error('楼主没有生成有效后续');
      const data=result.data;
      const checked=ForumGossip.validateUpdate(data,[postBody()].concat(updates.map(function(u){return u.text})),story.facts);
      if(!checked.ok)throw new Error(checked.reason);
      const update=checked.update;
      const previousLength=post.comments.length;
      const previousStory=JSON.parse(JSON.stringify(story));
      const stamp=Date.now();
      post.comments.push({id:'gossip_author_'+stamp.toString(36)+'_'+nextChapter,
        name:post.name,avatar:post.avatar,residentId:post.residentId,owner:'community',
        source:'gossip-author',gossipChapter:nextChapter,text:update,time:stamp,
        replyTo:target&&target.name?String(target.name):'',likes:0,replies:[]});
      (Array.isArray(data.reactions)?data.reactions:[]).slice(0,2).forEach(function(item,i){
        const c=makeDetailAIComment(item,i+nextChapter);
        if(c&&!ForumGossip.isRepeat(c.text,post.comments.map(function(x){return x.text})))post.comments.push(c);
      });
      const oldFacts=Array.isArray(story.facts)?story.facts.slice():[];
      story.facts=oldFacts.concat(checked.newFacts).slice(-25);
      story.chapter=nextChapter;
      story.maxChapters=maxChapters;
      // Only the final scheduled update can close the serial, even when the model says otherwise.
      story.finished=ending;
      story.updatedAt=stamp;
      if(!saveNow()){
        post.comments.splice(previousLength);
        post.gossipStory=previousStory;
        renderComments();renderPost();
        return false;
      }
      renderComments();renderPost();
      if(!target&&!gossipSeriesRunning)jumpToGossipLatest();
      if(status){
        const message=story.finished?'楼主已经更新完结局了':'楼主更新了第 '+nextChapter+' 段后续';
        status.textContent=message;
        setTimeout(function(){if(status.textContent===message)status.textContent=''},4600);
      }
      return true;
    }catch(error){
      console.warn('[Forum] 楼主连续爆料生成失败，未写入重复或不完整内容',error);
      if(status)status.textContent='这次没续上：'+String(error&&error.message||'检查 API 后重试').slice(0,76);
      return false;
    }finally{
      gossipReplyBusy=false;
      renderPost();
    }
  }

  async function finishGossipSeries(){
    if(gossipSeriesRunning){
      gossipSeriesStopRequested=true;
      renderPost();
      return false;
    }
    if(!post||!window.ForumGossip||!ForumGossip.isGossipPost(post)||gossipReplyBusy||ForumGossip.progress(post).finished)return false;
    gossipSeriesRunning=true;
    gossipSeriesStopRequested=false;
    renderPost();
    let completed=false;
    try{
      // Upper bound prevents a malformed chapter cursor from issuing endless API requests.
      for(let i=0;i<8;i++){
        if(gossipSeriesStopRequested)break;
        if(ForumGossip.progress(post).finished){completed=true;break}
        const ok=await generateGossipAuthorContinuation(null,'请继续讲清下一段，按已保存的剧情和时间线逐步推进到结局');
        if(!ok)break;
        if(ForumGossip.progress(post).finished){completed=true;break}
      }
    }finally{
      const stopped=gossipSeriesStopRequested;
      gossipSeriesRunning=false;
      gossipSeriesStopRequested=false;
      renderPost();
      if(completed&&!stopped)jumpToGossipLatest();
      const status=document.getElementById('aiCommentStatus');
      if(status&&stopped)status.textContent='已停止连续追更，生成成功的章节都已保存';
      else if(status&&completed)status.textContent='这个故事已经讲到结局了';
    }
    return completed;
  }

  function sharePost() {
    let roles = [];
    try { roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]'); } catch(e) {
      console.warn('[Forum] sharePost 解析 ai_custom_characters 失败', e);
      alert('联系人列表暂时无法读取，请重试');
      return;
    }
    if (!Array.isArray(roles) || !roles.length || !roles[0] || !roles[0].id) {
      alert('还没有可分享的联系人，请先去添加联系人');
      return;
    }

    const target = roles[0];
    const msg = '【分享帖子】' + (postBody() || postTitle()).substring(0, 50);
    const message = { role: 'user', text: msg, time: Date.now(), type: 'text' };

    try {
      const storage = window.PhoneStorage;
      let history;
      if (storage && typeof storage.getChatHistory === 'function') {
        history = storage.getChatHistory(target.id);
      } else {
        const raw = localStorage.getItem('chat_history_' + target.id);
        history = raw ? JSON.parse(raw) : [];
      }
      if (!Array.isArray(history)) throw new Error('聊天记录格式无法识别');

      const next = history.slice();
      next.push(message);
      let saved = false;
      if (storage && typeof storage.saveChatHistory === 'function') {
        saved = storage.saveChatHistory(target.id, next) === true;
      } else {
        localStorage.setItem('chat_history_' + target.id, JSON.stringify(next));
        saved = true;
      }
      if (!saved) throw new Error('聊天记录写入失败');

      const verified = storage && typeof storage.getChatHistory === 'function'
        ? storage.getChatHistory(target.id)
        : JSON.parse(localStorage.getItem('chat_history_' + target.id) || '[]');
      const last = Array.isArray(verified) && verified.length ? verified[verified.length - 1] : null;
      if (!Array.isArray(verified) || verified.length !== next.length ||
          !last || last.role !== message.role || last.type !== message.type ||
          last.time !== message.time || last.text !== message.text) {
        throw new Error('聊天记录写入后校验失败');
      }

      alert('已分享给 ' + (target.name || '该联系人'));
    } catch (error) {
      console.error('[Forum] sharePost chat history persistence failed:', error);
      alert('帖子分享失败：聊天记录没有保存成功，请检查存储空间后重试');
    }
  }

  function isFollowing(name) {

  function toggleFollow(name) {
    const follows=getFollows();
    if(!follows){toast('关注记录无法读取，未覆盖原数据');return;}
    const next=follows.includes(name)?follows.filter(x=>x!==name):follows.concat([name]);
    const serialized=JSON.stringify(next);
    try {
      localStorage.setItem('forum_follows',serialized);
      if(localStorage.getItem('forum_follows')!==serialized)throw new Error('关注状态未持久保存');
    } catch(error) {
      console.warn('[Forum] 关注状态保存失败',error);
      toast('关注状态未保存，请检查存储空间后重试');

  if(commentImageButton&&commentImagesInput){
    commentImageButton.addEventListener('click',function(){commentImagesInput.click()});
    commentImagesInput.addEventListener('change',function(){commentImageFiles=Array.from(this.files||[]);ForumMedia.preview(commentImageFiles,document.getElementById('commentImagePreview'));document.querySelector('.comment-bar').classList.toggle('has-images',commentImageFiles.length>0)});
  }
  window.addEventListener('pagehide',function(){
    gossipSeriesStopRequested=true;
    worldPageHidden=true;
    if(gossipReadObserver){gossipReadObserver.disconnect();gossipReadObserver=null}
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden)gossipSeriesStopRequested=true});
  loadPost();
</script>
</body>
</html>
