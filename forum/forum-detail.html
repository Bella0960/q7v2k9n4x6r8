function buildPreviousSeedSets(stored,seedIds){
 const themes=new Set();
 (Array.isArray(stored)?stored:[]).forEach(item=>{
  if(!item||typeof item!=='object'||Array.isArray(item)||item.id==null)return;
  if(!seedIds.has(String(item.id)))return;
  const themeId=typeof item.themeId==='string'?item.themeId.trim():'';
  if(themeId)themes.add(themeId);
 });
 const previous=new Map();
 themes.forEach(themeId=>{
  const seeds=getSeededPosts(themeId).map(p=>({...p}));
  previous.set(themeId,new Map(seeds.map(p=>[String(p.id),p])));
 });
 return previous;
}
/* 按字段判断种子帖是否被用户改过：只有存储值仍等于「上一次种子默认值」时才同步为新默认值。 */
function mergeForumPosts(stored,seedPosts,previousSeedSets){
 const syncFields=['id','name','avatar','topic','title','body','featured','owner','themeId'];
 const seedById=new Map(seedPosts.map(p=>[String(p.id),p]));
 const previousByTheme=previousSeedSets instanceof Map?previousSeedSets:new Map();
 const seenSeeds=new Set(),merged=[];
 (Array.isArray(stored)?stored:[]).forEach(item=>{
  if(!item||typeof item!=='object'||Array.isArray(item)||item.id==null)return;
  const id=String(item.id),seed=seedById.get(id);
  if(seed){
   const themeId=typeof item.themeId==='string'?item.themeId.trim():'';
   const previousSeeds=previousByTheme.get(themeId);
   const previousSeed=previousSeeds instanceof Map?previousSeeds.get(id):null;
   const combined={...seed,...item};
   syncFields.forEach(key=>{
    if(!Object.prototype.hasOwnProperty.call(seed,key))return;
    const nextDefault=seed[key];
    const hasValue=Object.prototype.hasOwnProperty.call(item,key);
    const previousDefault=previousSeed&&Object.prototype.hasOwnProperty.call(previousSeed,key)?previousSeed[key]:nextDefault;
    const untouched=hasValue?item[key]===previousDefault:true;
    if(untouched)combined[key]=nextDefault;
    else if(hasValue)combined[key]=item[key];
    else combined[key]=nextDefault;
   });
   merged.push(combined);seenSeeds.add(id);return;
  }
  if(id.indexOf('seed_')===0&&item.owner!=='me'&&item.tag!=='me')return;
  merged.push({...item});
 });
 seedPosts.forEach(seed=>{if(!seenSeeds.has(String(seed.id)))merged.push({...seed})});
 return merged;
}

    const config=window.PhoneStorage&&PhoneStorage.getApiConfig?PhoneStorage.getApiConfig():{};
    if(!config||!String(config.apiKey||'').trim())throw new Error('尚未配置 API Key');
    const system=getForumThreadWorldbook();
    const options={system:system,user:userPrompt,temperature:temperature==null?0.9:temperature,timeoutMs:28000};
    const ids=Array.from(new Set((Array.isArray(imageAssetIds)?imageAssetIds:[]).filter(Boolean))).slice(0,2);
    if(ids.length){
      if(!window.ForumMedia||typeof ForumMedia.toDataUrls!=='function')throw new Error('图片读取模块尚未加载');
      const dataUrls=await ForumMedia.toDataUrls(ids);
      const content=[{type:'text',text:userPrompt}].concat(dataUrls.map(function(url){return {type:'image_url',image_url:{url:url}}}));
      options.messages=[{role:'system',content:system},{role:'user',content:content}];
    }
    return PhoneAPI.completeJSON(options);
  }
  function makeDetailAIComment(item,index){
    const r=detailResident(item&&item.residentId,index),text=String(item&&item.text||'').trim().slice(0,260);
    if(!text)return null;
    const now=Date.now();
    const replies=(Array.isArray(item.replies)?item.replies:[]).slice(0,2).map((x,j)=>{
      const rr=detailResident(x.residentId,index+j+3),replyText=String(x.text||'').trim().slice(0,220);
      return replyText?{name:rr.name,avatar:'#'+['333333','555555','777777','444444'][j%4],residentId:rr.id,owner:'community',source:'forum-ai',text:replyText,time:now-(j+1)*70000,replyTo:String(x.replyTo||r.name),likes:0}:null;
    }).filter(Boolean);
    return {name:r.name,avatar:'#'+['333333','555555','777777','444444'][index%4],residentId:r.id,owner:'community',source:'forum-ai',text:text,time:now-index*50000,likes:0,replies:replies};
  }
  async function generateInitialAIComments(){
    if(!post||post.aiCommentBatch==='v1')return;
    const status=document.getElementById('aiCommentStatus');
    if(status)status.textContent='社区里有人正在看这条帖子…';
    try{
      const residents=DETAIL_RESIDENTS.map(r=>({id:r.id,name:r.name,style:r.style}));
      const existing=post.comments.slice(-5).map(c=>({name:c.name,text:c.text,replies:(c.replies||[]).map(x=>x.text)}));
      const prompt='请为下面这条论坛帖子补上第一批自然的网友讨论。只返回 JSON。\n固定路人：'+JSON.stringify(residents)+'\n帖子：'+JSON.stringify({author:post.name,title:postTitle(),body:postBody(),topic:post.topic||''})+'\n已有评论（不要重复）：'+JSON.stringify(existing)+'\n要求：生成 3-4 条评论，至少有两种不同态度；评论要抓住帖子细节，有人追问、有人分享经历、有人补充或温和反对。选择 1-2 条评论加一条楼中楼回复，让讨论有来有回。禁止每条都夸楼主或只说“确实”“哈哈”。所有 residentId 必须来自固定路人。格式：{"comments":[{"residentId":"路人id","text":"评论内容","replies":[{"residentId":"路人id","text":"回复内容","replyTo":"被回复昵称"}]}]}';
      const result=await forumAIJSON(prompt,0.93,post.mediaAssetIds);
      if(!result||!result.ok||!result.data||!Array.isArray(result.data.comments))throw new Error('评论生成结果无效');
      const added=result.data.comments.slice(0,4).map((x,i)=>makeDetailAIComment(x,i)).filter(Boolean);
      if(added.length){
        const previousComments=post.comments;
        const previousBatch=post.aiCommentBatch,previousBatchAt=post.aiCommentBatchAt;
        post.comments=post.comments.concat(added);
        post.aiCommentBatch='v1';
        post.aiCommentBatchAt=Date.now();
        if(!saveNow()){
          post.comments=previousComments;
          post.aiCommentBatch=previousBatch;
          post.aiCommentBatchAt=previousBatchAt;
          renderComments();renderPost();
          return;
        }
        renderComments();renderPost();
        if(status){status.textContent='又有 '+added.length+' 位网友加入了讨论';setTimeout(()=>{if(status.textContent.indexOf('又有 ')===0)status.textContent=''},4200)}
      }else if(status){status.textContent='暂时还没人接话，过会儿再来看看'}
    }catch(error){
      console.warn('[Forum] 首批路人评论生成失败',error);
      // 打开帖子时自动触发的后台生成：评论区内联 status 已是可见提示，再弹 toast 会在每次打开帖子时重复打扰，故此处只用状态文案。
      if(status)status.textContent=(post.mediaAssetIds||[]).length?'图片已经保留；当前 API 或模型可能不支持看图，暂时无法生成图片讨论':'路人暂时没有赶来，稍后重新打开帖子再试试';
    }

  function getPostId() {
    return new URLSearchParams(location.search).get('id');

  function loadPosts() {
    const seedPosts = getSeededPosts().map(item => ({ ...item }));
    let forumCfg={};
    try { forumCfg=JSON.parse(localStorage.getItem('forum_config')||'{}'); } catch(error) {}
    const seedThemeId=forumCfg.theme||'reality';
    const fillSeedDefaults=()=>seedPosts.forEach(item=>ensureSeedCommentsDetail(item,seedThemeId));
    const seedIds = new Set(seedPosts.map(p => String(p.id)));
    let raw;
    try { raw = localStorage.getItem('forum_posts'); }
    catch (error) {
      console.warn('[Forum] 读取本地帖子失败，先展示默认内容', error);
      toast('读取本机帖子失败，先显示默认内容');
      fillSeedDefaults();
      return seedPosts;
    }
    if (raw === null) {
      fillSeedDefaults();
      try { savePosts(seedPosts); }
      catch (error) {
        console.warn('[Forum] 首次写入种子帖子失败，默认内容仍可浏览', error);
        toast('本机存储暂时无法写入，本次内容不会保留');
      }
      return seedPosts;
    }
    let stored;
    try { stored = JSON.parse(raw); }
    catch (error) {
      console.warn('[Forum] 帖子数据损坏，保留页面外壳并展示默认内容', error);
      toast('本地帖子数据无法读取，先显示默认内容');
      fillSeedDefaults();
      return seedPosts;
    }
    if (!Array.isArray(stored)) {
      console.warn('[Forum] 帖子数据不是列表，保留页面外壳并展示默认内容');
      toast('本地帖子数据格式异常，先显示默认内容');
      fillSeedDefaults();
      return seedPosts;
    }
    const merged = mergeForumPosts(stored, seedPosts, buildPreviousSeedSets(stored, seedIds));
    merged.forEach(item=>{
      if(!(item.owner==='seed'||String(item.id||'').indexOf('p')===0)){
        if(typeof item.comments==='number'){item.comments=[];item.seedCommentsFilled=true;}
        else if(!Array.isArray(item.comments)){item.comments=[];}
        return;
      }
      ensureSeedCommentsDetail(item,seedThemeId);
      if(!Array.isArray(item.comments))item.comments=[];
    });
    try {
      if (JSON.stringify(merged) !== JSON.stringify(stored)) savePosts(merged);
    } catch (error) {
      console.warn('[Forum] 合并结果回写失败，已读出的帖子继续展示', error);
      toast('本次改动未写入本机，下次打开可能不会保留');
    }
    return merged;
  }
  function savePosts(arr) {
    localStorage.setItem('forum_posts', JSON.stringify(arr));

  function timeAgo(ts) {
    const h = Math.floor((Date.now() - ts) / 3600000);
    if (h < 1) return '刚刚';
    if (h < 24) return h + '小时前';
    return Math.floor(h/24) + '天前';
  }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function safeTime(t){ return (typeof t==='number') ? timeAgo(t) : (t || '刚刚'); }
  function postTitle(){ return post.title || ''; }
  function postBody(){ return post.body || post.content || ''; }

  let post = null;

  function loadPost() {
    const id = getPostId();
    const posts = loadPosts();
    post = posts.find(p => p.id === id);
    if (!post) {
      const head = document.querySelector('.p-head');
      const actions = document.querySelector('.p-actions');
      const content = document.getElementById('pContent');
      const commentList = document.getElementById('commentList');
      const commentInput = document.getElementById('commentInput');
      const sendButton = document.querySelector('.comment-bar .send-btn');
      if (head) head.style.display = 'none';
      if (actions) actions.style.display = 'none';
      if (content) content.textContent = '这条帖子暂时无法找到，可能已被删除或本地数据暂不可用。';
      if (commentList) commentList.textContent = '暂时无法加载这条帖子的评论。';
      if (commentInput) { commentInput.disabled = true; commentInput.placeholder = '帖子暂不可用'; }
      if (sendButton) sendButton.disabled = true;
      return;
    }
    if (!Array.isArray(post.comments)) post.comments = [];
    renderPost();
    renderComments();
    if(post.aiCommentBatch!=='v1')generateInitialAIComments();
    if (new URLSearchParams(location.search).get('focus') === 'comment') {
      setTimeout(() => {
        const el = document.getElementById('commentInput');
        if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); el.focus(); }
      }, 180);
    }
  }

  function renderPost() {
    const cover = document.getElementById('postCover');
    if (post.img && cover) {
      cover.style.display = 'block';
      cover.innerHTML = `<img src="${post.img}" style="width:100%;display:block">`;
    } else if (cover) cover.style.display = 'none';
    const avatarEl = document.getElementById('pAvatar');
    const ownPost = post.owner === 'me' || post.tag === 'me' || String(post.id || '').indexOf('user_') === 0;
    avatarEl.style.background = avatarBackground(post, ownPost);
    avatarEl.innerHTML = avatarContent(post, ownPost);
    const tagHtml = post.tag === 'ai' ? '<span class="p-tag">AI</span>' : post.tag === 'me' ? '<span class="p-tag">ME</span>' : (post.role ? '<span class="p-tag">' + esc(post.role) + '</span>' : '');
    document.getElementById('pName').innerHTML = esc(post.name) + tagHtml;
    document.getElementById('pTime').textContent = safeTime(post.time);

      (window.ForumMedia?ForumMedia.markup(post.mediaAssetIds,'post-detail-media'):'');
    if(window.ForumMedia)ForumMedia.hydrate(pContent);
    document.getElementById('likeCount').textContent = post.likes || 0;
    const shownCount = post.comments.length;
    document.getElementById('commentCount').textContent = shownCount;
    const ct = document.querySelector('.c-title'); if (ct) ct.setAttribute('data-count', shownCount);
    document.getElementById('likeBtn').classList.toggle('liked', !!post.liked);
    const gossipButton=document.getElementById('gossipContinue');
    if(gossipButton){
      const hasStory=window.ForumGossip&&ForumGossip.isGossipPost(post);

        const progress=ForumGossip.progress(post);

  function isOwn(c) { return c.name === '我' || c.owner === 'me'; }

  function isSafeAvatarImage(src) {
    return typeof src === 'string' && /^(?:data:image\/(?:png|jpe?g|gif|webp|bmp|svg\+xml|avif);|https?:\/\/|blob:|\.|\/)/i.test(src);
  }
  function avatarContent(item, isUserPost) {
    const own = !!isUserPost || isOwn(item);
    const src = own ? getMyForumAvatar() : (item && item.avatar);
    if (isSafeAvatarImage(src)) return '<img src="' + esc(src) + '" alt="">';
    const value = item && item.avatar;
    return esc(value && value.length === 1 ? value : ((item && item.name) || '?')[0]);
  }
  function avatarBackground(item, isUserPost) {
    const own = !!isUserPost || isOwn(item);
    const value = item && item.avatar;
    return !own && typeof value === 'string' && value.indexOf('#') === 0 ? value : '#ececec';
  }

  function likeComment(i) {
    const c = post.comments[i];
    c.liked = !c.liked;
    c.likes = (c.likes || 0) + (c.liked ? 1 : -1);
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
  }

  function likeReply(i, j) {
    const r = post.comments[i].replies[j];
    r.liked = !r.liked;
    r.likes = (r.likes || 0) + (r.liked ? 1 : -1);
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }

  function saveNow() {
    try {
      const posts = loadPosts();
      const idx = posts.findIndex(p => p.id === post.id);
      if (idx >= 0) { posts[idx] = post; savePosts(posts); return true; }
    } catch(e) { console.warn('[Forum] 保存帖子改动失败，当前页面继续显示已读出的内容', e); }

  function toast(msg) {
    let t = document.getElementById('pageToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'pageToast';
      t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;background:rgba(22,22,22,.92);color:#fff;padding:9px 13px;font-size:10px;border-radius:2px;letter-spacing:.02em;pointer-events:none;opacity:0;transition:opacity .2s;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(toast._t);

  function deleteComment(i) {
    const removed=post.comments[i];
    if (!isOwn(removed)) return;
    post.comments.splice(i,1);
    if(!saveNow()){
      post.comments.splice(i,0,removed);
      renderComments();renderPost();
      return;
    }
    if(replyToIdx>=i)cancelReply();
    if(removed.id&&Array.isArray(removed.mediaAssetIds)&&window.ForumMedia)
      ForumMedia.release(removed.mediaAssetIds,'forum-comment',removed.id);
    renderComments();renderPost();
    toast('评论已删除');
  }
  function deleteReply(i, j) {
    const c = post.comments[i],removed=c&&c.replies&&c.replies[j];
    if (!removed || !isOwn(removed)) return;
    c.replies.splice(j,1);
    if(!saveNow()){
      c.replies.splice(j,0,removed);
      renderComments();renderPost();
      return;
    }
    if(removed.id&&Array.isArray(removed.mediaAssetIds)&&window.ForumMedia)
      ForumMedia.release(removed.mediaAssetIds,'forum-comment',removed.id);
    renderComments();renderPost();
    toast('回复已删除');
  }

  function toggleLike() {
    post.liked = !post.liked;

    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderPost();
  }

      const prompt='现在请扮演这条【完全虚构的八卦帖子】的原楼主，在评论区继续讲故事，给追更读者带来新的实质进展。只返回 JSON。\\n全部设定和已发生事实：'+JSON.stringify(context)+
        '\\n写作规则：1. 不是摘要或重写原文。你必须延续上次说到的位置，每一更给出至少两个此前没有披露的新事实、行动、对话或关系变化，前后时间线、人物与已发生事件绝不能冲突。2. 语气像原帖作者随手回来爆后续：自然、细节多、有情绪和口语，可以说“我又来更新了”，但不要每一回都这样开头。正文 180-420 个汉字，分两到四个自然段，不能列提纲、写分析或用同一套反转模板。3. 只在故事早期埋疑点；情节要一回比一回更接近答案，不能无限挖坑。'+(ending?'4. 这是最终一更：交代完整结果、人物最终选择以及之前悬念的答案，明确收尾，不要再留“下次再说”。':'4. 这次必须揭晓一个之前留下的重要线索，同时自然留下尚未解决的问题，但不要重复前一更内容。')+
        '\\n人物都要是虚构的普通成年人，不能指向现实可识别人物，不能声称现实人物的隐私或未经证实的负面事实。不要把 AI、故事设定、提示词写到正文。\\nJSON 格式：{"update":"楼主本次长篇后续","newFacts":["本次新增事实1","本次新增事实2"],"reactions":[{"residentId":"路人id","text":"一句自然的催更或讨论"}],"finished":'+(ending?'true':'false')+'}。reactions 可为空，最多两条，不要全都说蹲。';
      const result=await forumAIJSON(prompt,0.93,[]);
      if(!result||!result.ok||!result.data)throw new Error('楼主没有生成有效后续');
      const data=result.data;
      const checked=ForumGossip.validateUpdate(data,[postBody()].concat(updates.map(function(u){return u.text})),story.facts);
      if(!checked.ok)throw new Error(checked.reason);
      const update=checked.update;
      const previousLength=post.comments.length;
      const previousStory=JSON.parse(JSON.stringify(story));
      const stamp=Date.now();
      post.comments.push({id:'gossip_author_'+stamp.toString(36)+'_'+nextChapter,
        name:post.name,avatar:post.avatar,residentId:post.residentId,owner:'community',
        source:'gossip-author',gossipChapter:nextChapter,text:update,time:stamp,
        replyTo:target&&target.name?String(target.name):'',likes:0,replies:[]});
      (Array.isArray(data.reactions)?data.reactions:[]).slice(0,2).forEach(function(item,i){
        const c=makeDetailAIComment(item,i+nextChapter);
        if(c&&!ForumGossip.isRepeat(c.text,post.comments.map(function(x){return x.text})))post.comments.push(c);
      });
      const oldFacts=Array.isArray(story.facts)?story.facts.slice():[];
      story.facts=oldFacts.concat(checked.newFacts).slice(-25);
      story.chapter=nextChapter;
      story.maxChapters=maxChapters;
      // Only the final scheduled update can close the serial, even when the model says otherwise.
      story.finished=ending;
      story.updatedAt=stamp;
      if(!saveNow()){
        post.comments.splice(previousLength);
        post.gossipStory=previousStory;
        renderComments();renderPost();
        return false;
      }
      renderComments();renderPost();
      if(status){
        status.textContent=story.finished?'楼主已经更新完结局了':'楼主更新了第 '+nextChapter+' 段后续';
        setTimeout(function(){if(status.textContent.indexOf('楼主')===0)status.textContent=''},4600);
      }
      return true;
    }catch(error){
      console.warn('[Forum] 楼主连续爆料生成失败，未写入重复或不完整内容',error);
      if(status)status.textContent='这次没续上：'+String(error&&error.message||'检查 API 后重试').slice(0,76);
      return false;
    }finally{
      gossipReplyBusy=false;
      renderPost();
    }
  }
  async function continueGossip(){
    return generateGossipAuthorContinuation(null,'蹲后续，楼主继续讲，想听完整故事');
  }

  async function generateRepliesToUserComment(target,text,submittedImageIds){
    if(!target)return;
    if(window.ForumGossip&&ForumGossip.isGossipPost(post)&&!ForumGossip.progress(post).finished&&
       readForumConfig().gossipAutoContinue!==false&&ForumGossip.wantsContinuation(text)){
      await generateGossipAuthorContinuation(target,text);
      return;
    }
    const status=document.getElementById('aiCommentStatus');
    if(status)status.textContent='有人看到你的留言，正在接话…';
    try{
      const residents=DETAIL_RESIDENTS.map(r=>({id:r.id,name:r.name,style:r.style}));
      const threadContext={anchorName:target.name,anchorText:target.text,hasAttachedImages:!!((target.mediaAssetIds||[]).length||(submittedImageIds||[]).length),replies:(target.replies||[]).slice(-5).map(r=>({name:r.name,text:r.text}))};
      const prompt='论坛里刚出现一条新留言，请让 1-2 位不同的路人自然回应它。只返回 JSON。\n路人资料：'+JSON.stringify(residents)+'\n帖子：'+JSON.stringify({title:postTitle(),body:postBody(),topic:post.topic||''})+'\n当前讨论串：'+JSON.stringify(threadContext)+'\n用户刚刚说：'+JSON.stringify(text)+'\n要求：回复要直接回应这句话和上下文，不要泛泛夸赞或重复已有内容；可以追问、分享相似经历或有礼貌地提出不同看法。最多两条，第二条可以接第一条的话。每条 10-55 字，保持口语和各自性格。格式：{"replies":[{"residentId":"路人id","text":"回复","replyTo":"我"}]}';
      const imageIds=Array.from(new Set([].concat(post.mediaAssetIds||[],target.mediaAssetIds||[],submittedImageIds||[]))).slice(0,2);
      const result=await forumAIJSON(prompt,0.94,imageIds);
      if(!result||!result.ok||!result.data||!Array.isArray(result.data.replies))throw new Error('回复生成结果无效');
      const previousReplies=Array.isArray(target.replies)?target.replies.slice():[];
      if(!Array.isArray(target.replies))target.replies=[];
      result.data.replies.slice(0,2).forEach((x,i)=>{
        const c=makeDetailAIComment({residentId:x.residentId,text:x.text},i);
        if(c)target.replies.push({name:c.name,avatar:c.avatar,residentId:c.residentId,owner:'community',source:'forum-ai',text:c.text,time:Date.now()+i*1000,replyTo:String(x.replyTo||'我'),likes:0});
      });
      if(!saveNow()){
        target.replies=previousReplies;
        renderComments();renderPost();
        if(status)status.textContent='网友回复没保存成功，请检查本机存储空间';
        return;
      }
      renderComments();renderPost();
      if(status){status.textContent='有网友回应了你的留言';setTimeout(()=>{if(status.textContent==='有网友回应了你的留言')status.textContent=''},4200)}
    }catch(error){
      console.warn('[Forum] 网友回应失败',error);
      // 用户留言本身已发送成功，失败的只是追加的 AI 回应；内联 status 已就地说明，再弹 toast 会与「留言已发出」混淆，故保持状态文案。
      if(status)status.textContent=((post.mediaAssetIds||[]).length||(target.mediaAssetIds||[]).length||(submittedImageIds||[]).length)?'评论和图片已经保存；当前 API 或模型可能不支持看图，暂时无法生成图片回复':'暂时没有新的回应，稍后再看看';
    }
  }
  function clearCommentImages(){
    commentImageFiles=[];
    const input=document.getElementById('commentImages');
    if(input)input.value='';
    if(window.ForumMedia)ForumMedia.clearPreview(document.getElementById('commentImagePreview'));
    const bar=document.querySelector('.comment-bar');
    if(bar)bar.classList.remove('has-images');
  }
  async function sendComment() {
    const input=document.getElementById('commentInput'),text=input.value.trim();
    const files=commentImageFiles.slice();
    if(!text&&!files.length){toast('写一句话或添加一张图片吧');input.focus();return}
    const button=document.querySelector('.comment-bar .send-btn');
    if(button&&button.disabled)return;
    if(button)button.disabled=true;
    const replying=replyToIdx;
    const commentId='forum_comment_'+Date.now().toString(36);
    let assetIds=[];
    try{
      assetIds=await ForumMedia.upload(files,'forum-comment',commentId);
      let replyContainer,savedItem;
      if(replying>=0){
        const target=post.comments[replying];
        if(!target.replies)target.replies=[];
        savedItem={id:commentId,name:'我',avatar:'#222',owner:'me',text:text,time:Date.now(),replyTo:target.name,mediaAssetIds:assetIds};
        target.replies.push(savedItem);
        replyContainer=target;
      }else{
        savedItem={id:commentId,name:'我',avatar:'#222',owner:'me',text:text,time:Date.now(),replies:[],mediaAssetIds:assetIds};
        post.comments.push(savedItem);
        replyContainer=savedItem;
      }
      if(!saveNow()){
        if(replying>=0){const target=post.comments[replying];target.replies=target.replies.filter(item=>item!==savedItem)}
        else post.comments=post.comments.filter(item=>item!==savedItem);
        await ForumMedia.release(assetIds,'forum-comment',commentId);
        return;
      }
      input.value='';
      clearCommentImages();
      cancelReply();
      renderComments();renderPost();
      await generateRepliesToUserComment(replyContainer,text||'（只附了一张图片）',assetIds);
    }catch(error){
      toast(error&&error.message?error.message:'评论图片保存失败，请重试');
    }finally{
      if(button)button.disabled=false;
    }
  }

  function sharePost() {
    let roles = [];
    try { roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]'); } catch(e) {
      console.warn('[Forum] sharePost 解析 ai_custom_characters 失败', e);
      alert('联系人列表暂时无法读取，请重试');
      return;
    }
    if (!Array.isArray(roles) || !roles.length || !roles[0] || !roles[0].id) {
      alert('还没有可分享的联系人，请先去添加联系人');
      return;
    }

    const target = roles[0];
    const msg = '【分享帖子】' + (postBody() || postTitle()).substring(0, 50);
    const message = { role: 'user', text: msg, time: Date.now(), type: 'text' };

    try {
      const storage = window.PhoneStorage;
      let history;
      if (storage && typeof storage.getChatHistory === 'function') {
        history = storage.getChatHistory(target.id);
      } else {
        const raw = localStorage.getItem('chat_history_' + target.id);
        history = raw ? JSON.parse(raw) : [];
      }
      if (!Array.isArray(history)) throw new Error('聊天记录格式无法识别');

      const next = history.slice();
      next.push(message);
      let saved = false;
      if (storage && typeof storage.saveChatHistory === 'function') {
        saved = storage.saveChatHistory(target.id, next) === true;
      } else {
        localStorage.setItem('chat_history_' + target.id, JSON.stringify(next));
        saved = true;
      }
      if (!saved) throw new Error('聊天记录写入失败');

      const verified = storage && typeof storage.getChatHistory === 'function'
        ? storage.getChatHistory(target.id)
        : JSON.parse(localStorage.getItem('chat_history_' + target.id) || '[]');
      const last = Array.isArray(verified) && verified.length ? verified[verified.length - 1] : null;
      if (!Array.isArray(verified) || verified.length !== next.length ||
          !last || last.role !== message.role || last.type !== message.type ||
          last.time !== message.time || last.text !== message.text) {
        throw new Error('聊天记录写入后校验失败');
      }

      alert('已分享给 ' + (target.name || '该联系人'));
    } catch (error) {
      console.error('[Forum] sharePost chat history persistence failed:', error);
      alert('帖子分享失败：聊天记录没有保存成功，请检查存储空间后重试');
    }
  }

  function deletePost() {
    if (!confirm('确定要删除这条帖子吗？')) return;
    try {
      const posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');
      const filtered = posts.filter(p => p.id !== post.id);
      localStorage.setItem('forum_posts', JSON.stringify(filtered));
      alert('帖子已删除');
      window.location.href = 'forum.html';
    } catch(e) {
      alert('删除失败，请重试');
    }
  }

  function getFollows() { return JSON.parse(localStorage.getItem('forum_follows') || '[]'); }
  function isFollowing(name) { return getFollows().indexOf(name) >= 0; }
  function toggleFollow(name) {
    let f = getFollows();
    if (isFollowing(name)) f = f.filter(x => x !== name);
    else f.push(name);
    localStorage.setItem('forum_follows', JSON.stringify(f));
    renderComments();
  }

  async function aiReply() {
    const residents=DETAIL_RESIDENTS.map(r=>({id:r.id,name:r.name,style:r.style}));
    try{
      const prompt='你是一个固定社区成员，请读完这条帖子后写一条自然的网友评论。只返回 JSON。\n路人资料：'+JSON.stringify(residents)+'\n帖子：'+JSON.stringify({title:postTitle(),body:postBody(),topic:post.topic||''})+'\n要求：选择一位路人，评论 12-60 字，回应具体细节，不要泛泛夸赞，也不要说自己是 AI。格式：{"residentId":"路人id","text":"评论"}';
      const result=await forumAIJSON(prompt,0.93,post.mediaAssetIds);
      if(!result||!result.ok||!result.data)throw new Error('评论生成失败');
      const c=makeDetailAIComment(result.data,post.comments.length);
      if(c){
        post.comments.push(c);
        if(!saveNow()){post.comments.pop();renderComments();renderPost();return}
        renderComments();renderPost();toast('一位网友加入了讨论');
      }
    }catch(error){console.warn('[Forum] 手动生成评论失败',error);toast((post.mediaAssetIds||[]).length?'图片已保留；当前 API 或模型可能不支持看图':'暂时没能生成回复')}
  }

  const commentImageButton=document.getElementById('commentImageButton');
  const commentImagesInput=document.getElementById('commentImages');
  if(commentImageButton&&commentImagesInput){
    commentImageButton.addEventListener('click',function(){commentImagesInput.click()});
    commentImagesInput.addEventListener('change',function(){commentImageFiles=Array.from(this.files||[]);ForumMedia.preview(commentImageFiles,document.getElementById('commentImagePreview'));document.querySelector('.comment-bar').classList.toggle('has-images',commentImageFiles.length>0)});
  }
  loadPost();
</script>
