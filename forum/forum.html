function loadPosts(){
 const seedPosts=getSeededPosts().map(x=>({...x}));
 const themeId=getForumTheme().id||'reality';
 let storedList=null;
 try{const raw=localStorage.getItem(STORE);if(raw){try{storedList=JSON.parse(raw)}catch(e){storedList=null}}}catch(e){storedList=null}
 const hasStore=Array.isArray(storedList)&&storedList.length;
 let merged;
 if(hasStore){
  const isUser=p=>p.owner==='me'||p.tag==='me'||String(p.id).indexOf('user_')===0;
  const isLegacySeed=p=>String(p.id).indexOf('seed_')===0;
  const isRefSeed=p=>p.title&&p.body&&String(p.id).indexOf('user_')!==0;
  const keep=storedList.filter(p=>isUser(p)||(isRefSeed(p)&&!isLegacySeed(p)));
  merged=seedPosts.map(x=>({...x}));
  /* store 里的种子帖子（含用户改动）覆盖 fresh clone 版本 */
  keep.forEach(u=>{const existing=merged.find(m=>m.id===u.id);if(existing){Object.assign(existing,u)}else{merged.unshift({...u})}});
 }else{merged=seedPosts.map(x=>({...x}))}
 merged.forEach(p=>{
  /* 存量：不是种子但 comments 是数字 → 归零并标记 */
  if(!(p.owner==='seed'||String(p.id||'').indexOf('p')===0)){
   if(typeof p.comments==='number'){p.comments=[];p.seedCommentsFilled=true}
   else if(!Array.isArray(p.comments)){p.comments=[]}
   return;
  }
  /* 种子帖：填充预置评论（如果 store 里已有 seedCommentsFilled=true，会被跳过） */
  ensureSeedComments(p,themeId);
  if(!Array.isArray(p.comments))p.comments=[];
 });
 try{
  const serialized=JSON.stringify(merged);
  if(serialized!==localStorage.getItem(STORE))localStorage.setItem(STORE,serialized);
 }catch(e){console.warn('[Forum] 帖子回写失败，当前视图不受影响',e)}
 return merged;
}

let prStartY=0,prPulling=false,prReady=false;
const prEl=()=>document.getElementById('pullRefresh');
const prText=()=>document.getElementById('pullRefreshText');
const prSpinner=()=>document.getElementById('pullRefreshSpinner');
scroll.addEventListener('touchstart',e=>{if(scroll.scrollTop<=0){prStartY=e.touches[0].clientY;prPulling=true;prReady=false}},{passive:true});
scroll.addEventListener('touchmove',e=>{
  if(!prPulling)return;
  const dy=e.touches[0].clientY-prStartY;
  const el=prEl();
  if(dy<=0){prReady=false;el.classList.remove('show','pulling');el.style.height='';return}
  prReady=dy>70;
  el.classList.add('show','pulling');
  el.style.height=Math.min(dy*0.6,58)+'px';
  prSpinner().style.transform='rotate('+Math.min(dy*3,300)+'deg)';
  prText().textContent=prReady?'松开刷新':'下拉刷新';
},{passive:true});
scroll.addEventListener('touchend',()=>{
  const el=prEl();
  el.classList.remove('pulling');
  if(prPulling&&prReady){
    el.classList.add('show','loading');
    el.style.height='';
    prSpinner().style.transform='';
    prText().textContent='正在刷新';
    refreshFeed().then(ok=>{
      el.classList.remove('loading');
      el.classList.add('done');
      prText().textContent=ok?'已更新':'暂未更新';
      setTimeout(()=>{el.classList.remove('show','done');prText().textContent='下拉刷新'},900);
    });
  }else if(el.classList.contains('show')){el.classList.remove('show');el.style.height=''}
  prPulling=false;prReady=false;
},{passive:true});

 const roster=FORUM_RESIDENTS.map(r=>({id:r.id,name:r.name,style:r.style}));
 const system=forumWorldbook()+'\n\n你现在负责维护论坛的真实讨论流。写作要像不同网友各自在空闲时间打开手机时发的内容：有具体细节，有不同脾气，有人简短，有人会追问；禁止模板化、排比式和客服式表达。';
 const user='请为这个论坛生成一次新的社区动态。必须只输出 JSON。\n可用话题：'+JSON.stringify(topics)+'\n固定路人资料（请复用这些昵称，保持性格稳定）：'+JSON.stringify(roster)+'\n最近已经存在的帖子（不要改写、复刻这些内容）：'+JSON.stringify(recent)+'\n生成规则：\n1. 新增 2-3 篇全新帖子，每篇作者从固定路人中选一位；这批帖子尽量由不同居民发布，不要同一居民连续刷屏；标题自然，正文约 35-140 字，不要都像公告。\n2. 每篇新帖子自带 1-3 条真实感评论；其中部分评论可以有 1 条楼中楼回复。评论彼此有呼应，允许观点不同，不要统一夸楼主。\n3. 再从最近帖子里挑 1 篇，追加 1-2 条新评论，postId 必须照抄给定的真实 id；不要重复已有评论。\n4. 所有 residentId 必须来自固定路人资料；话题必须从可用话题中选择。\nJSON 格式：{"posts":[{"residentId":"路人id","title":"标题","body":"正文","topic":"话题","likes":3,"comments":[{"residentId":"路人id","text":"评论","replies":[{"residentId":"路人id","text":"楼中楼回复","replyTo":"被回复昵称"}]}]}],"activity":[{"postId":"现有帖子id","comments":[{"residentId":"路人id","text":"追加评论","replies":[]}]}]}';
 try{
  toast('正在等社区成员发帖…');
  const result=await PhoneAPI.completeJSON({system:system,user:user,temperature:0.92,timeoutMs:32000});
  if(!result||!result.ok||!result.data||!Array.isArray(result.data.posts))throw new Error('AI 没有返回有效帖子');
  const data=result.data,now=Date.now(),existingTitles=new Set(posts.map(p=>String(p.title||'').trim()).filter(Boolean));
  const fresh=[];
  data.posts.slice(0,3).forEach((item,i)=>{
   if(!item||!item.title||!item.body)return;
   const title=String(item.title).trim().slice(0,90),body=String(item.body).trim().slice(0,700);
   if(!title||!body||existingTitles.has(title))return;
   const author=forumResident(item.residentId,i);
   const comments=(Array.isArray(item.comments)?item.comments:[]).slice(0,3).map((c,j)=>forumMakeAIComment(c,j)).filter(Boolean);
   fresh.push({id:'forum_ai_'+now.toString(36)+'_'+i,name:author.name,avatar:'#333333',residentId:author.id,role:'社区成员',tag:'resident',owner:'community',topic:topics.includes(item.topic)?item.topic:topics[i%topics.length],time:now-i*5*60000,created:now-i*5*60000,title:title,body:body,likes:Math.max(0,Math.min(30,Number(item.likes)||0)),comments:comments,liked:false,generatedBy:'community-ai',themeId:theme.id,aiCommentBatch:comments.length?'v1':''});
   existingTitles.add(title);
  });
  if(!fresh.length)throw new Error('这次没有生成新的帖子，请稍后再刷新');
  const before=posts.slice();
  posts=fresh.concat(posts);
  let activityCount=0;
  (Array.isArray(data.activity)?data.activity:[]).slice(0,2).forEach(entry=>{
   const target=posts.find(p=>String(p.id)===String(entry.postId));
   if(!target||!Array.isArray(entry.comments))return;
   if(!Array.isArray(target.comments)){target.comments=[]}
   entry.comments.slice(0,2).forEach((c,j)=>{
    const normalized=forumMakeAIComment(c,j);
    if(normalized&&!target.comments.some(old=>old.source==='forum-ai'&&old.text===normalized.text)){target.comments.push(normalized);activityCount++}
   });
  });
  if(!save()){posts=before;return false}
  render();scroll.scrollTop=0;
  toast('社区又有 '+fresh.length+' 篇新帖'+(activityCount?'，旧帖也有新回复':''));
  return true;
 }catch(error){
  console.warn('[Forum] 社区增量刷新失败',error);
  toast('这次没能更新，检查 API 后再试试');
  return false;
 }finally{forumRefreshBusy=false}
}

// 自动为角色生成帖子：每个角色至少发一条
// 自动为每个角色保留一条帖子；有 API 时按该角色人设生成真实内容。
function forumRoleList(){
  let roles=[];
  try{
    if(window.PhoneStorage&&typeof PhoneStorage.getCharacters==='function')roles=PhoneStorage.getCharacters()||[];
  }catch(e){}
  if(!Array.isArray(roles)||!roles.length){
    try{roles=JSON.parse(localStorage.getItem('ai_custom_characters')||'[]')}catch(e){roles=[]}
  }
  return Array.isArray(roles)?roles.filter(r=>r&&r.name).slice(0,12):[];
}
function forumRoleId(role){
  return String(role&&role.id!==undefined&&role.id!==null?role.id:(role&&role.name||''));
}
function forumRoleBio(role){
  return [role.description,role.bio,role.personality,role.character,role.speechStyle,role.prompt,role.systemPrompt]
    .filter(Boolean).join('\n').replace(/\s+/g,' ').trim().slice(0,1800);
}
function forumFallbackPost(role,index){
  const id=forumRoleId(role),theme=getForumTheme(),topics=theme.roleTopics.length?theme.roleTopics:['日常交流'];
  const baguaTitles=['这条消息我先存个疑问，等有出处再来更新','评论区的两种说法，感觉都还缺一点上下文','今天看到一个讨论，想听听大家怎么判断','先不急着站队，想看看有没有更早的原始信息','吃瓜之余也想提醒一句：别把猜测当实锤'];
  const baguaBodies=['刷到一段转述，但暂时没找到最初来源。有没有人能补一下时间线？在证据完整前，先把它当作待核实信息。','同一件事被截成了不同版本，单看其中一张图很容易误会。有没有完整内容可以对照？','这件事目前看到的都是网友讨论，我更想知道最初发生了什么。欢迎贴出处，没证实的部分先不下结论。','评论区已经有好几种解释了，不过目前都缺少完整上下文。先把线索放这里，等可靠来源出来再聊。','转发之前最好先看看原帖和发布时间。讨论可以热闹，但别把未经证实的内容说成事实。'];
  const titles=theme.id==='bagua'?baguaTitles:['今天在「'+theme.name+'」里遇到的一件小事','关于「'+theme.name+'」，有个问题想问问大家','刚刚看到一个和「'+theme.name+'」有关的讨论','留一条今天的主题观察','有没有人也关注「'+theme.name+'」这件事'];
  const bodies=theme.id==='bagua'?baguaBodies:['刚刚遇到一个挺有意思的情况，想放到这里和大家交流。没有急着下结论，也欢迎补充不同经历。','最近在留意这方面的信息，发现每个人的体验差异还挺大。想听听大家怎么理解。','把刚看到的线索记一下，之后有新信息再回来补充。欢迎有经验的人分享具体情况。','事情不算大，但很符合这个主题。顺手记下来，也许能碰到有相同兴趣的人。','想问问大家平时会怎么处理这种情况？比起单一答案，更想看看不同做法背后的原因。'];
  const title=titles[index%titles.length],body=bodies[index%bodies.length];
  return {id:'role_'+id,name:role.name,avatar:String(role.name).slice(0,1),role:'role',topic:topics[index%topics.length],time:'刚刚',title:title,body:body,likes:0,comments:[],liked:false,owner:'role',roleId:id,created:Date.now()-index*1000,tag:'role',content:title+'\n'+body,generatedBy:'fallback',themeId:theme.id};
}
function ensureRolePosts(){
  const roles=forumRoleList(),activeTheme=getForumTheme();
  let changed=false;
  const pending=[];
  roles.forEach(function(role,index){
    const roleId=forumRoleId(role);
    if(!roleId)return;
    const postId='role_'+roleId;
    let post=posts.find(p=>String(p.id)===postId);
    if(!post||post.themeId!==activeTheme.id){
      const replacement=forumFallbackPost(role,index);
      if(post){replacement.likes=Number(post.likes||0);replacement.comments=Array.isArray(post.comments)?post.comments.slice():Number(post.comments||0);replacement.liked=!!post.liked;Object.assign(post,replacement)}
      else {post=replacement;posts.unshift(post)}
      changed=true;
    }
    // 主题切换后重新按当前论坛语境生成，原有互动数据保留。
    if(post.generatedBy!=='ai'){
      pending.push({roleId:roleId,name:String(role.name),persona:forumRoleBio(role)});
    }
  });
  if(changed)save();
  if(pending.length)generateRolePosts(pending);
}
function generateRolePosts(targets){
  const cfg=window.PhoneStorage&&PhoneStorage.getApiConfig?PhoneStorage.getApiConfig():{};
  if(!cfg||!String(cfg.apiKey||'').trim()||!window.PhoneAPI||typeof PhoneAPI.completeJSON!=='function')return;
  const requested=targets.slice(0,12),theme=getForumTheme(),allowedTopics=theme.roleTopics.length?theme.roleTopics:['日常交流'];
  const systemPrompt='你正在扮演一组独立的虚构角色，为他们各自的社区账号写一条帖子。必须符合角色人设，也必须自然融入当前论坛主题「'+theme.name+'」。论坛世界书：'+(theme.world||'按当前主题自然交流')+'。不同角色不能写成同一种声音，不要写泛泛的生活感悟。只返回 JSON，不要 Markdown。';
  const userPrompt='请分别为以下角色写一条符合论坛主题的帖子。角色资料：'+JSON.stringify(requested)+
    '\n话题必须从以下列表中选择：'+JSON.stringify(allowedTopics)+
    '\n返回结构：{"posts":[{"roleId":"必须原样对应角色 ID","title":"标题","body":"正文","topic":"必须使用上面列表中的一个话题"}]}'+
    '\n每条标题 4-22 个汉字，正文 35-120 个汉字。内容像真实论坛用户发帖，有具体事件、观察或问题；遵循角色人设和论坛世界书。不要编造现实人物未经证实的负面事实。';
  PhoneAPI.completeJSON({system:systemPrompt,user:userPrompt,temperature:0.88,timeoutMs:26000}).then(function(result){
    if(!result||!result.ok||!result.data||!Array.isArray(result.data.posts))return;
    let changed=false;
    result.data.posts.forEach(function(item){
      if(!item)return;
      const roleId=String(item.roleId==null?'':item.roleId);
      if(!requested.some(r=>r.roleId===roleId))return;
      const post=posts.find(p=>String(p.id)==='role_'+roleId);
      if(!post)return;
      const title=String(item.title||'').trim().slice(0,80);
      const body=String(item.body||'').trim().slice(0,400);
      if(!title&&!body)return;
      post.title=title||'今天的一点记录';
      post.body=body||'把今天想到的事情留在这里。';
      post.topic=allowedTopics.includes(item.topic)?item.topic:allowedTopics[0];
      post.themeId=theme.id;
      post.content=post.title+'\n'+post.body;
      post.generatedBy='ai';
      post.time='刚刚';
      post.created=Date.now();
      changed=true;
    });
    if(changed){save();render();}
  }).catch(function(error){
    console.warn('[Forum] 角色帖子生成人设内容失败，保留本地兜底帖子',error);
  });
}


ensureRolePosts();
render();
})();
</script>
