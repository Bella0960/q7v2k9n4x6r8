<body>
<div class="forum-app">
  <header class="topbar">
    <div class="brand"><button class="back-button" id="backButton" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="brand-rule"></div><div class="brand-copy"><div class="brand-name">The Forum</div><div class="brand-caption">一个认真说话的地方</div></div></div>
    <div class="head-actions">
      <button class="head-action" id="searchToggle" aria-label="搜索帖子"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
      <button class="compose-top" id="composeTop"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>发帖</span></button>
    </div>
  </header>
  <main class="scroll-area" id="scrollArea">
    <div class="pull-refresh" id="pullRefresh">
      <span class="pr-spinner" id="pullRefreshSpinner" aria-hidden="true"></span>
      <span class="pr-text" id="pullRefreshText">下拉刷新</span>
    </div>
    <div id="viewRoot"></div>
  </main>
  <nav class="bottom-nav" aria-label="论坛导航">
    <button class="nav-item active" data-page="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H4V10.5"/><path d="M9 21v-7h6v7"/></svg><span>讨论</span></button>
    <button class="nav-item" data-page="discover"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>发现</span></button>
    <button class="nav-item" data-page="notice"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>消息</span><i class="nav-dot" id="noticeDot" hidden></i></button>
    <button class="nav-item" data-page="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>我的</span></button>
  </nav>
  <div class="overlay" id="composeOverlay" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
    <section class="sheet"><div class="grabber"></div><div class="sheet-head"><div><div class="sheet-title" id="composeTitle">写点什么。</div><div class="sheet-subtitle">A NOTE TO THE COMMUNITY</div></div><button class="sheet-close" id="closeCompose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <label class="field-label" for="draftTitle">标题 · 可留空</label><input class="field" id="draftTitle" maxlength="80" placeholder="给这段话一个名字">
      <label class="field-label" for="draftBody">正文</label><textarea class="field-area" id="draftBody" maxlength="3000" placeholder="你可以从一个小发现、一句疑问，或者今天的某个瞬间开始……"></textarea>
      <div class="draft-media-tools"><button type="button" class="draft-media-button" id="draftImageButton">＋ 添加图片</button><span id="draftImageCount">最多 4 张 · 单张不超过 8 MB</span><input type="file" id="draftImages" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/heic,image/heif" multiple hidden></div><div class="forum-image-preview" id="draftImagePreview" aria-live="polite"></div>
      <div class="sheet-row"><div><label class="field-label" for="draftTopic">话题</label><select class="field-select" id="draftTopic"><option>今日话题</option><option>深夜食堂</option><option>碎碎念</option><option>生活观察</option><option>随手分享</option></select></div><div><label class="field-label" for="draftAlias">显示昵称</label><input class="field" id="draftAlias" maxlength="20" value="路过的人" placeholder="你的昵称"></div></div>

    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
(function(){
'use strict';
const STORE='forum_posts';

function buildSeedComment(post,themeId,index){
 const pool=SEED_COMMENT_POOL[themeId]&&SEED_COMMENT_POOL[themeId][post.id]||SEED_COMMENT_POOL_FALLBACK;
 const pair=pool[index%pool.length];
 if(!pair)return null;
 const now=Date.now();
 return {name:pair[0],avatar:'#'+['333333','555555','777777','444444'][index%4],residentId:'seed_'+post.id+'_'+index,owner:'seed',source:'seed-comments',text:pair[1],time:now-(index+1)*180000,likes:0,replies:[]};
}
function ensureSeedComments(post,themeId){
 if(!post||typeof post!=='object')return;
 const isSeed=post.owner==='seed'||String(post.id||'').indexOf('p')===0;
 if(!isSeed)return;
 /* 幂等标记已设置 → 尊重现状，不管 comments 是空还是已有数组 */
 if(post.seedCommentsFilled)return;
 /* comments 已经是数组 → 用户可能之前加过/删过评论，不覆盖 */
 if(Array.isArray(post.comments)&&post.comments.length){post.seedCommentsFilled=true;return}
 /* 迁移前：数字型 comments → 预置评论 */
 if(typeof post.comments==='number'&&post.comments>0){/* 继续下面填充预置评论 */}
 /* comments 是空数组或非数组 → 填充预置评论 */
 const count=3;
 const built=[];
 for(let i=0;i<count;i++){const c=buildSeedComment(post,themeId,i);if(c)built.push(c)}
 post.comments=built;
 post.seedCommentsFilled=true;
}

function buildPreviousSeedSets(stored,seedIds){
 const themes=new Set();
 (Array.isArray(stored)?stored:[]).forEach(item=>{
  if(!item||typeof item!=='object'||Array.isArray(item)||item.id==null)return;
  if(!seedIds.has(String(item.id)))return;
  const themeId=typeof item.themeId==='string'?item.themeId.trim():'';
  if(themeId)themes.add(themeId);
 });
 const previous=new Map();
 themes.forEach(themeId=>{
  const seeds=getSeededPosts(themeId).map(p=>({...p}));
  previous.set(themeId,new Map(seeds.map(p=>[String(p.id),p])));
 });
 return previous;
}
/* 按字段判断种子帖是否被用户改过：只有存储值仍等于「上一次种子默认值」时才同步为新默认值。 */
function mergeForumPosts(stored,seedPosts,previousSeedSets){
 const syncFields=['id','name','avatar','topic','title','body','featured','owner','themeId'];
 const seedById=new Map(seedPosts.map(p=>[String(p.id),p]));
 const previousByTheme=previousSeedSets instanceof Map?previousSeedSets:new Map();
 const seenSeeds=new Set(),merged=[];
 (Array.isArray(stored)?stored:[]).forEach(item=>{
  if(!item||typeof item!=='object'||Array.isArray(item)||item.id==null)return;
  const id=String(item.id),seed=seedById.get(id);
  if(seed){
   const themeId=typeof item.themeId==='string'?item.themeId.trim():'';
   const previousSeeds=previousByTheme.get(themeId);
   const previousSeed=previousSeeds instanceof Map?previousSeeds.get(id):null;
   const combined={...seed,...item};
   syncFields.forEach(key=>{
    if(!Object.prototype.hasOwnProperty.call(seed,key))return;
    const nextDefault=seed[key];
    const hasValue=Object.prototype.hasOwnProperty.call(item,key);
    const previousDefault=previousSeed&&Object.prototype.hasOwnProperty.call(previousSeed,key)?previousSeed[key]:nextDefault;
    const untouched=hasValue?item[key]===previousDefault:true;
    if(untouched)combined[key]=nextDefault;
    else if(hasValue)combined[key]=item[key];
    else combined[key]=nextDefault;
   });
   merged.push(combined);seenSeeds.add(id);return;
  }
  if(id.indexOf('seed_')===0&&item.owner!=='me'&&item.tag!=='me')return;
  merged.push({...item});
 });
 seedPosts.forEach(seed=>{if(!seenSeeds.has(String(seed.id)))merged.push({...seed})});
 return merged;
}
function loadPosts(){
 const seedPosts=getSeededPosts().map(x=>({...x}));
 const themeId=getForumTheme().id||'reality';
 const fillSeedDefaults=()=>seedPosts.forEach(p=>ensureSeedComments(p,themeId));
 const seedIds=new Set(seedPosts.map(p=>String(p.id)));
 let raw;
 try{raw=localStorage.getItem(STORE)}
 catch(error){console.warn('[Forum] 读取本地帖子失败，先展示默认内容',error);toast('读取本机帖子失败，先显示默认内容');fillSeedDefaults();return seedPosts}
 if(raw===null){
  fillSeedDefaults();
  try{localStorage.setItem(STORE,JSON.stringify(seedPosts))}
  catch(error){console.warn('[Forum] 首次写入种子帖子失败，默认内容仍可浏览',error);toast('本机存储暂时无法写入，本次内容不会保留')}
  return seedPosts;
 }
 let stored;
 try{stored=JSON.parse(raw)}
 catch(error){console.warn('[Forum] 帖子数据损坏，保留页面外壳并展示默认内容',error);toast('本地帖子数据无法读取，先显示默认内容');fillSeedDefaults();return seedPosts}
 if(!Array.isArray(stored)){console.warn('[Forum] 帖子数据不是列表，保留页面外壳并展示默认内容');toast('本地帖子数据格式异常，先显示默认内容');fillSeedDefaults();return seedPosts}
 const merged=mergeForumPosts(stored,seedPosts,buildPreviousSeedSets(stored,seedIds));
 merged.forEach(p=>{
  if(!(p.owner==='seed'||String(p.id||'').indexOf('p')===0)){
   if(typeof p.comments==='number'){p.comments=[];p.seedCommentsFilled=true}
   else if(!Array.isArray(p.comments))p.comments=[];
   return;
  }
  ensureSeedComments(p,themeId);
  if(!Array.isArray(p.comments))p.comments=[];
 });
 try{
  if(JSON.stringify(merged)!==JSON.stringify(stored))localStorage.setItem(STORE,JSON.stringify(merged));
 }catch(error){
  console.warn('[Forum] 合并结果回写失败，已读出的帖子继续展示',error);
  toast('本次改动未写入本机，下次打开可能不会保留');
 }
 return merged;
}

/* ===== 下拉刷新：适配内部滚动容器 ===== */
let prStartY=0,prPulling=false,prReady=false;
const prEl=()=>document.getElementById('pullRefresh');
const prText=()=>document.getElementById('pullRefreshText');
const prSpinner=()=>document.getElementById('pullRefreshSpinner');
scroll.addEventListener('touchstart',e=>{if(scroll.scrollTop<=0){prStartY=e.touches[0].clientY;prPulling=true;prReady=false}},{passive:true});
scroll.addEventListener('touchmove',e=>{
  if(!prPulling)return;
  const dy=e.touches[0].clientY-prStartY;
  const el=prEl();
  if(dy<=0){prReady=false;el.classList.remove('show','pulling');el.style.height='';return}
  prReady=dy>70;
  el.classList.add('show','pulling');
  el.style.height=Math.min(dy*0.6,58)+'px';
  prSpinner().style.transform='rotate('+Math.min(dy*3,300)+'deg)';
  prText().textContent=prReady?'松开刷新':'下拉刷新';
},{passive:true});
scroll.addEventListener('touchend',()=>{
  const el=prEl();
  el.classList.remove('pulling');
  if(prPulling&&prReady){
    el.classList.add('show','loading');
    el.style.height='';
    prSpinner().style.transform='';
    prText().textContent='正在刷新';
    refreshFeed().then(ok=>{
      el.classList.remove('loading');
      el.classList.add('done');
      prText().textContent=ok?'已更新':'暂未更新';
      setTimeout(()=>{el.classList.remove('show','done');prText().textContent='下拉刷新'},900);
    });
  }else if(el.classList.contains('show')){el.classList.remove('show');el.style.height=''}
  prPulling=false;prReady=false;
},{passive:true});
let forumRefreshBusy=false;
async function refreshFeed(){
 if(forumRefreshBusy)return false;
 if(!window.PhoneAPI||typeof PhoneAPI.completeJSON!=='function'){toast('AI 接口暂不可用');return false}
 const apiCfg=window.PhoneStorage&&PhoneStorage.getApiConfig?PhoneStorage.getApiConfig():{};
 if(!apiCfg||!String(apiCfg.apiKey||'').trim()){toast('先配置 API，路人才会来发帖');return false}
 forumRefreshBusy=true;
 const theme=getForumTheme(),topics=theme.roleTopics&&theme.roleTopics.length?theme.roleTopics:['日常交流'];
 const recent=posts.filter(p=>p&&p.title&&p.body).slice(0,8).map(p=>({id:p.id,name:p.name,title:p.title,body:String(p.body||'').slice(0,150),topic:p.topic,comments:Array.isArray(p.comments)?p.comments.slice(-4).map(c=>({name:c.name,text:String(c.text||'').slice(0,110),replies:Array.isArray(c.replies)?c.replies.slice(-2).map(r=>({name:r.name,text:String(r.text||'').slice(0,90)})):[]})):[],legacyCommentCount:typeof p.comments==='number'?p.comments:0}));
 const roster=FORUM_RESIDENTS.map(r=>({id:r.id,name:r.name,style:r.style}));
 const system=forumWorldbook()+'\n\n你现在负责维护论坛的真实讨论流。写作要像不同网友各自在空闲时间打开手机时发的内容：有具体细节，有不同脾气，有人简短，有人会追问；禁止模板化、排比式和客服式表达。';
 const user='请为这个论坛生成一次新的社区动态。必须只输出 JSON。\n可用话题：'+JSON.stringify(topics)+'\n固定路人资料（请复用这些昵称，保持性格稳定）：'+JSON.stringify(roster)+'\n最近已经存在的帖子（不要改写、复刻这些内容）：'+JSON.stringify(recent)+'\n生成规则：\n1. 新增 2-3 篇全新帖子，每篇作者从固定路人中选一位；这批帖子尽量由不同居民发布，不要同一居民连续刷屏；标题自然，正文约 35-140 字，不要都像公告。\n2. 每篇新帖子自带 1-3 条真实感评论；其中部分评论可以有 1 条楼中楼回复。评论彼此有呼应，允许观点不同，不要统一夸楼主。\n3. 再从最近帖子里挑 1 篇，追加 1-2 条新评论，postId 必须照抄给定的真实 id；不要重复已有评论。\n4. 所有 residentId 必须来自固定路人资料；话题必须从可用话题中选择。\nJSON 格式：{"posts":[{"residentId":"路人id","title":"标题","body":"正文","topic":"话题","likes":3,"comments":[{"residentId":"路人id","text":"评论","replies":[{"residentId":"路人id","text":"楼中楼回复","replyTo":"被回复昵称"}]}]}],"activity":[{"postId":"现有帖子id","comments":[{"residentId":"路人id","text":"追加评论","replies":[]}]}]}';
 try{
  toast('正在等社区成员发帖…');
  const result=await PhoneAPI.completeJSON({system:system,user:user,temperature:0.92,timeoutMs:32000});
  if(!result||!result.ok||!result.data||!Array.isArray(result.data.posts))throw new Error('AI 没有返回有效帖子');
  const data=result.data,now=Date.now(),existingTitles=new Set(posts.map(p=>String(p.title||'').trim()).filter(Boolean));
  const fresh=[];
  data.posts.slice(0,3).forEach((item,i)=>{
   if(!item||!item.title||!item.body)return;
   const title=String(item.title).trim().slice(0,90),body=String(item.body).trim().slice(0,700);
   if(!title||!body||existingTitles.has(title))return;
   const author=forumResident(item.residentId,i);
   const comments=(Array.isArray(item.comments)?item.comments:[]).slice(0,3).map((c,j)=>forumMakeAIComment(c,j)).filter(Boolean);
   fresh.push({id:'forum_ai_'+now.toString(36)+'_'+i,name:author.name,avatar:'#333333',residentId:author.id,role:'社区成员',tag:'resident',owner:'community',topic:topics.includes(item.topic)?item.topic:topics[i%topics.length],time:now-i*5*60000,created:now-i*5*60000,title:title,body:body,likes:Math.max(0,Math.min(30,Number(item.likes)||0)),comments:comments,liked:false,generatedBy:'community-ai',themeId:theme.id,aiCommentBatch:comments.length?'v1':''});
   existingTitles.add(title);
  });
  if(!fresh.length)throw new Error('这次没有生成新的帖子，请稍后再刷新');
  const before=posts.slice();
  posts=fresh.concat(posts);
  let activityCount=0;
  (Array.isArray(data.activity)?data.activity:[]).slice(0,2).forEach(entry=>{
   const target=posts.find(p=>String(p.id)===String(entry.postId));
   if(!target||!Array.isArray(entry.comments))return;
   if(!Array.isArray(target.comments)){target.comments=[]}
   entry.comments.slice(0,2).forEach((c,j)=>{
    const normalized=forumMakeAIComment(c,j);
    if(normalized&&!target.comments.some(old=>old.source==='forum-ai'&&old.text===normalized.text)){target.comments.push(normalized);activityCount++}
   });
  });
  if(!save()){posts=before;return false}
  render();scroll.scrollTop=0;
  toast('社区又有 '+fresh.length+' 篇新帖'+(activityCount?'，旧帖也有新回复':''));
  return true;
 }catch(error){
  console.warn('[Forum] 社区增量刷新失败',error);
  toast('这次没能更新，检查 API 后再试试');
  return false;
 }finally{forumRefreshBusy=false}
}

function forumRoleList(){

    if(window.PhoneStorage&&typeof PhoneStorage.getCharacters==='function')roles=PhoneStorage.getCharacters()||[];
  }catch(e){console.warn('[Forum] forumRoleList 读取 PhoneStorage.getCharacters 失败，改用本地角色缓存',e)}

  const id=forumRoleId(role),theme=getForumTheme(),topics=theme.roleTopics.length?theme.roleTopics:['日常交流'];
  const baguaTitles=['这条消息我先存个疑问，等有出处再来更新','评论区的两种说法，感觉都还缺一点上下文','今天看到一个讨论，想听听大家怎么判断','先不急着站队，想看看有没有更早的原始信息','吃瓜之余也想提醒一句：别把猜测当实锤'];
  const baguaBodies=['刷到一段转述，但暂时没找到最初来源。有没有人能补一下时间线？在证据完整前，先把它当作待核实信息。','同一件事被截成了不同版本，单看其中一张图很容易误会。有没有完整内容可以对照？','这件事目前看到的都是网友讨论，我更想知道最初发生了什么。欢迎贴出处，没证实的部分先不下结论。','评论区已经有好几种解释了，不过目前都缺少完整上下文。先把线索放这里，等可靠来源出来再聊。','转发之前最好先看看原帖和发布时间。讨论可以热闹，但别把未经证实的内容说成事实。'];
  const titles=theme.id==='bagua'?baguaTitles:['今天在「'+theme.name+'」里遇到的一件小事','关于「'+theme.name+'」，有个问题想问问大家','刚刚看到一个和「'+theme.name+'」有关的讨论','留一条今天的主题观察','有没有人也关注「'+theme.name+'」这件事'];
  const bodies=theme.id==='bagua'?baguaBodies:['刚刚遇到一个挺有意思的情况，想放到这里和大家交流。没有急着下结论，也欢迎补充不同经历。','最近在留意这方面的信息，发现每个人的体验差异还挺大。想听听大家怎么理解。','把刚看到的线索记一下，之后有新信息再回来补充。欢迎有经验的人分享具体情况。','事情不算大，但很符合这个主题。顺手记下来，也许能碰到有相同兴趣的人。','想问问大家平时会怎么处理这种情况？比起单一答案，更想看看不同做法背后的原因。'];
  const title=titles[index%titles.length],body=bodies[index%bodies.length];
  return {id:'role_'+id,name:role.name,avatar:String(role.name).slice(0,1),role:'role',topic:topics[index%topics.length],time:'刚刚',title:title,body:body,likes:0,comments:[],liked:false,owner:'role',roleId:id,created:Date.now()-index*1000,tag:'role',content:title+'\n'+body,generatedBy:'fallback',themeId:theme.id};
}
function ensureRolePosts(){
  const roles=forumRoleList(),activeTheme=getForumTheme();
  let changed=false;
  posts.forEach(function(post){
    if(post&&post.imageGenerationStatus==='generating'){
      post.imageGenerationStatus='failed';
      post.imageGenerationError='页面刷新时生成中断，请重试';
      changed=true;
    }
  });
  const pending=[];
  roles.forEach(function(role,index){
    const roleId=forumRoleId(role);
    if(!roleId)return;
    const postId='role_'+roleId;
    let post=posts.find(p=>String(p.id)===postId);
    if(!post||post.themeId!==activeTheme.id){
      const replacement=forumFallbackPost(role,index);
      if(post){replacement.likes=Number(post.likes||0);replacement.comments=Array.isArray(post.comments)?post.comments.slice():Number(post.comments||0);replacement.liked=!!post.liked;Object.assign(post,replacement)}
      else {post=replacement;posts.unshift(post)}
      changed=true;
    }
    // 主题切换后重新按当前论坛语境生成，原有互动数据保留。
    if(post.generatedBy!=='ai'){
      pending.push({roleId:roleId,name:String(role.name),persona:forumRoleBio(role)});
    }
  });
  if(changed)save();
  if(pending.length)generateRolePosts(pending);
}

let roleImageQueueBusy=false;
async function generateRolePostImage(postId){
 const post=posts.find(p=>String(p.id)===String(postId));
 if(!post||!post.imagePrompt)return false;
 const cfg=window.PhoneStorage&&PhoneStorage.getApiConfig?PhoneStorage.getApiConfig():{};
 if(!cfg||!String(cfg.imageModel||'').trim()){toast('请先在设置中填写图片生成模型');return false}
 if(!window.PhoneAPI||typeof PhoneAPI.generateImage!=='function'||!window.ForumMedia){toast('图片生成组件尚未加载，请刷新页面');return false}
 if(post.imageGenerationStatus==='generating')return false;
 post.imageGenerationStatus='generating';delete post.imageGenerationError;save();render();
 try{
  const generated=await PhoneAPI.generateImage({prompt:String(post.imagePrompt).slice(0,900),size:'1024x1024',timeoutMs:90000});
  if(!generated||!generated.blob)throw new Error('图片生成服务没有返回文件');
  const mime=String(generated.mimeType||generated.blob.type||'image/png').toLowerCase();
  const ext=mime==='image/jpeg'?'jpg':mime==='image/webp'?'webp':'png';
  const safeId=String(post.id).replace(/[^a-z0-9_-]/gi,'_');
  const file=new File([generated.blob],'forum-'+safeId+'.'+ext,{type:mime});
  const assetIds=await ForumMedia.upload([file],'forum-post',String(post.id));
  if(!assetIds||!assetIds.length)throw new Error('生成图片没有成功保存到媒体仓库');
  if(!posts.some(p=>String(p.id)===String(post.id))){
   await ForumMedia.release(assetIds,'forum-post',String(post.id));
   return false;
  }
  post.mediaAssetIds=Array.from(new Set((Array.isArray(post.mediaAssetIds)?post.mediaAssetIds:[]).concat(assetIds))).slice(0,4);
  post.imageGenerationStatus='ready';post.imageGeneratedAt=Date.now();
  save();render();return true;
 }catch(error){
  post.imageGenerationStatus='failed';
  post.imageGenerationError=String(error&&error.message||error).slice(0,140);
  save();render();
  console.warn('[Forum] AI 角色帖配图失败，正文和帖子仍保留',error);
  return false;
 }
}
async function queuePendingRolePostImages(){
 if(roleImageQueueBusy)return;
 const cfg=window.PhoneStorage&&PhoneStorage.getApiConfig?PhoneStorage.getApiConfig():{};
 if(!cfg||!String(cfg.imageModel||'').trim()||!window.PhoneAPI||typeof PhoneAPI.generateImage!=='function'||!window.ForumMedia)return;
 const pending=posts.filter(function(p){
  return p&&p.generatedBy==='ai'&&p.imagePrompt&&
   !(Array.isArray(p.mediaAssetIds)&&p.mediaAssetIds.length)&&
   p.imageGenerationStatus!=='failed'&&p.imageGenerationStatus!=='generating';
 }).slice(0,3);
 if(!pending.length)return;
 roleImageQueueBusy=true;
 try{for(const post of pending){await generateRolePostImage(post.id)}}finally{roleImageQueueBusy=false}
}

function generateRolePosts(targets){
  const cfg=window.PhoneStorage&&PhoneStorage.getApiConfig?PhoneStorage.getApiConfig():{};
  if(!cfg||!String(cfg.apiKey||'').trim()||!window.PhoneAPI||typeof PhoneAPI.completeJSON!=='function')return;
  const requested=targets.slice(0,12),theme=getForumTheme(),allowedTopics=theme.roleTopics.length?theme.roleTopics:['日常交流'];
  const systemPrompt='你正在扮演一组独立的虚构角色，为他们各自的社区账号写一条帖子。必须符合角色人设，也必须自然融入当前论坛主题「'+theme.name+'」。论坛世界书：'+(theme.world||'按当前主题自然交流')+'。不同角色不能写成同一种声音，不要写泛泛的生活感悟。只返回 JSON，不要 Markdown。';
  const userPrompt='请分别为以下角色写一条符合论坛主题的帖子。角色资料：'+JSON.stringify(requested)+
    '\n话题必须从以下列表中选择：'+JSON.stringify(allowedTopics)+
    '\n返回结构：{"posts":[{"roleId":"必须原样对应角色 ID","title":"标题","body":"正文","topic":"必须使用上面列表中的一个话题","imagePrompt":"与正文场景一致的无文字图片描述，不适合配图时留空"}]}'+
    '\n每条标题 4-22 个汉字，正文 35-120 个汉字。内容像真实论坛用户发帖，有具体事件、观察或问题；遵循角色人设和论坛世界书。不要编造现实人物未经证实的负面事实。imagePrompt 应为 20-100 字的具体画面描述，适合生成一张无文字、无水印、1:1 的生活摄影或氛围插画；不要出现现实可识别人物、受版权保护角色或品牌标识；确实没有合适画面时填写空字符串。';
  PhoneAPI.completeJSON({system:systemPrompt,user:userPrompt,temperature:0.88,timeoutMs:26000}).then(function(result){
    if(!result||!result.ok||!result.data||!Array.isArray(result.data.posts))return;
    let changed=false;
    result.data.posts.forEach(function(item){
      if(!item)return;
      const roleId=String(item.roleId==null?'':item.roleId);
      if(!requested.some(r=>r.roleId===roleId))return;
      const post=posts.find(p=>String(p.id)==='role_'+roleId);
      if(!post)return;
      const title=String(item.title||'').trim().slice(0,80);
      const body=String(item.body||'').trim().slice(0,400);
      if(!title&&!body)return;
      post.title=title||'今天的一点记录';
      post.body=body||'把今天想到的事情留在这里。';
      post.topic=allowedTopics.includes(item.topic)?item.topic:allowedTopics[0];
      post.imagePrompt=String(item.imagePrompt||'').trim().slice(0,500);
      if(!post.imagePrompt){delete post.imageGenerationStatus;delete post.imageGenerationError}
      post.themeId=theme.id;
      post.content=post.title+'\n'+post.body;
      post.generatedBy='ai';
      post.time='刚刚';
      post.created=Date.now();
      changed=true;
    });
    if(changed){save();render();queuePendingRolePostImages();}
  }).catch(function(error){
    console.warn('[Forum] 角色帖子生成人设内容失败，保留本地兜底帖子',error);
  });
}


ensureRolePosts();
render();
queuePendingRolePostImages();
})();
</script>
