name: Free Model Gateway Contract

on:
  push:
    branches:
      - feature/free-model-unified-gateway
    paths:
      - '.cloudflare/**'
      - 'settings/**'
      - 'wrangler.jsonc'
      - 'tests/free-model-gateway.test.mjs'
      - '.github/workflows/free-model-gateway.yml'
      - 'package.json'
  pull_request:
    paths:
      - '.cloudflare/**'
      - 'settings/**'
      - 'wrangler.jsonc'
      - 'tests/free-model-gateway.test.mjs'
      - '.github/workflows/free-model-gateway.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test unified free model gateway
        run: npm run test:free-gateway
