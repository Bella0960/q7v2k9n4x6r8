name: Performance Budget Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'chat/chat/**'
      - 'shared/js/phone/**'
      - 'perf/**'
      - 'tests/p0-02-page-load-perf.browser.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/perf-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Edge
        run: npx playwright install --with-deps msedge
      - name: Run performance budget gate
        run: npm run perf:gate
      - name: Run P0-02 page load browser regression (msedge)
        run: node tests/p0-02-page-load-perf.browser.mjs
