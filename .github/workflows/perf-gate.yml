name: Performance Budget Gate

on:
  push:
    branches: [main]
    paths:
      - 'chat/**'
      - 'wallet/**'
      - 'shared/js/phone/**'
      - 'shared/css/**'
      - 'perf/**'
      - 'tests/takeout-add-button.browser.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/perf-gate.yml'
  pull_request:
    paths:
      - 'chat/**'
      - 'wallet/**'
      - 'shared/js/phone/**'
      - 'shared/css/**'
      - 'perf/**'
      - 'tests/takeout-add-button.browser.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/perf-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright (Edge channel) for performance gate
        run: npx playwright install --with-deps msedge || npx playwright install msedge
      - name: Run performance budget gate
        run: npm run perf:gate
      - name: Run BUG-P1-02 takeout add button browser regression (msedge)
        run: node tests/takeout-add-button.browser.mjs
