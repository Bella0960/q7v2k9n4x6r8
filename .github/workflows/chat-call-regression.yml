name: Chat Call Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'chat/call/call-overlay.js'
      - 'chat/call/call-overlay.css'
      - 'chat/chat/chat-detail.html'
      - 'chat/chat/js/chat-extras.js'
      - 'tests/chat-call-experience.test.mjs'
      - 'package.json'
      - '.github/workflows/chat-call-regression.yml'
  push:
    branches: [main]
    paths:
      - 'chat/call/call-overlay.js'
      - 'chat/call/call-overlay.css'
      - 'chat/chat/chat-detail.html'
      - 'chat/chat/js/chat-extras.js'
      - 'tests/chat-call-experience.test.mjs'
      - 'package.json'
      - '.github/workflows/chat-call-regression.yml'

permissions:
  contents: read

jobs:
  call-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify in-chat voice and video call contracts
        run: npm run test:chat:call
