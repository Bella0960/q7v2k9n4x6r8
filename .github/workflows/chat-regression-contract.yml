name: Chat Regression Contract

on:
  push:
    branches: [main]
    paths:
      - 'chat/**'
      - 'desktop/**'
      - 'index.html'
      - 'apps/**'
      - 'settings/**'
      - 'shared/js/phone/phone_storage.js'
      - 'shared/js/app-shell-*.js'
      - 'shared/css/app-shell.css'
      - 'library/**'
      - 'shared/js/phone/**'
      - 'sw.js'
      - 'tests/**'
      - 'docs/chat-architecture-contract.md'
      - 'docs/chat-regression-baseline.md'
      - 'package.json'
      - '.github/workflows/chat-regression-contract.yml'
  pull_request:
    paths:
      - 'chat/**'
      - 'desktop/**'
      - 'index.html'
      - 'apps/**'
      - 'settings/**'
      - 'shared/js/app-shell-*.js'
      - 'shared/css/app-shell.css'
      - 'library/**'
      - 'shared/js/phone/**'
      - 'sw.js'
      - 'tests/**'
      - 'docs/chat-architecture-contract.md'
      - 'docs/chat-regression-baseline.md'
      - 'package.json'
      - '.github/workflows/chat-regression-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-regression-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Install Chromium for app-shell browser tests
        run: npx playwright install --with-deps chromium
      - name: Run chat regression contract tests
        run: npm run test:chat:contract
      - name: Run app shell tests
        run: npm run test:app-shell
