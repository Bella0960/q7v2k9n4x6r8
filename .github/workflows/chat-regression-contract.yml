name: Chat Regression Contract

on:
  push:
    branches: [main]
    paths:
      - 'chat/**'
      - 'library/**'
      - 'shared/js/phone/**'
      - 'sw.js'
      - 'tests/**'
      - 'docs/chat-architecture-contract.md'
      - 'docs/chat-regression-baseline.md'
      - 'package.json'
      - '.github/workflows/chat-regression-contract.yml'
  pull_request:
    paths:
      - 'chat/**'
      - 'library/**'
      - 'shared/js/phone/**'
      - 'sw.js'
      - 'tests/**'
      - 'docs/chat-architecture-contract.md'
      - 'docs/chat-regression-baseline.md'
      - 'package.json'
      - '.github/workflows/chat-regression-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-regression-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run chat regression contract tests
        run: npm run test:chat:contract
