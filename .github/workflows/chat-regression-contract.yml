name: Chat Regression Contract

on:
  push:
    branches: [main]
    paths:
      - 'chat/**'
      - 'forum/**'
      - 'library/**'
      - 'shared/js/phone/**'
      - 'shared/js/chat-beauty.js'
      - 'shared/js/wallpaper-store.js'
      - 'beauty/beauty.html'
      - 'settings/settings.html'
      - 'settings/appearance.html'
      - 'shared/js/statusbar-control.js'
      - 'shared/js/native-feel.js'
      - 'music/music.html'
      - 'inspect-phone/phone.html'
      - 'travel/dream-travel.html'
      - 'sw.js'
      - 'tests/**'
      - 'docs/chat-architecture-contract.md'
      - 'docs/chat-regression-baseline.md'
      - 'package.json'
      - '.github/workflows/chat-regression-contract.yml'
  pull_request:
    paths:
      - 'chat/**'
      - 'forum/**'
      - 'library/**'
      - 'shared/js/phone/**'
      - 'shared/js/chat-beauty.js'
      - 'shared/js/wallpaper-store.js'
      - 'beauty/beauty.html'
      - 'settings/settings.html'
      - 'settings/appearance.html'
      - 'shared/js/statusbar-control.js'
      - 'shared/js/native-feel.js'
      - 'music/music.html'
      - 'inspect-phone/phone.html'
      - 'travel/dream-travel.html'
      - 'sw.js'
      - 'tests/**'
      - 'docs/chat-architecture-contract.md'
      - 'docs/chat-regression-baseline.md'
      - 'package.json'
      - '.github/workflows/chat-regression-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-regression-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check global status bar wiring and preference behavior
        run: node --test tests/global-statusbar-wiring.test.mjs
      - name: Install Chromium for mobile viewport checks
        run: npx playwright install --with-deps chromium
      - name: Check global status bar DOM behavior in Chromium
        run: node tests/global-statusbar-browser.mjs
      - name: Run chat regression contract tests
        run: |
          npm run test:chat:reply
          npm run test:chat:bubbles
          npm run test:chat:contract
          npm run test:desktop:layout
          npm run test:bugfix:blockers
          npm run test:media:backup
          npm run test:forum:media
          npm run test:api:image
          npm run test:images
          npm run test:forum:seed
          npm run build
          npm run test:fanwai:browser:build
          npm run test:forum:mobile
          npm run test:group:ui
          npm run test:group:invite-e2e
          npm run test:wechat:browser
      - name: Run chat data isolation behavior tests
        run: |
          npm run test:chat:isolation
          npm run test:chat:isolation:browser
      - name: Save fanwai browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fanwai-browser-failure-${{ github.run_id }}
          path: test-results/fanwai-browser/
          if-no-files-found: ignore
          retention-days: 5
