name: Chat Regression Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'chat/**'
      - 'forum/**'
      - 'library/**'
      - 'shared/js/phone/**'
      - 'shared/js/chat-beauty.js'
      - 'shared/js/wallpaper-store.js'
      - 'sw.js'
      - 'tests/chat-regression-contract.test.mjs'
      - 'tests/chat-call-experience.test.mjs'
      - 'tests/default-desktop-layout.test.mjs'
      - 'tests/forum-chat-blockers.test.mjs'
      - 'tests/media-backup.test.mjs'
      - 'tests/forum-media.test.mjs'
      - 'tests/phone-api-image-generation.test.mjs'
      - 'tests/image-generation-pipeline.test.mjs'
      - 'tests/forum-seed-comments.test.mjs'
      - 'tests/forum-media-mobile.mjs'
      - 'tests/group-ui-collapse-invite.test.mjs'
      - 'tests/group-chat-invite-e2e.test.mjs'
      - 'tests/wechat-theme-browser.mjs'
      - 'tests/chat-data-isolation.test.mjs'
      - 'tests/chat-data-isolation-browser.mjs'
      - 'docs/chat-architecture-contract.md'
      - 'docs/chat-regression-baseline.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chat-regression-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for mobile viewport checks
        run: npx playwright install --with-deps chromium
      - name: Run chat and related regression contracts
        run: |
          npm run test:chat:contract
          npm run test:chat:call
          npm run test:desktop:layout
          npm run test:bugfix:blockers
          npm run test:media:backup
          npm run test:forum:media
          npm run test:api:image
          npm run test:images
          npm run test:forum:seed
          npm run build
          npm run test:forum:mobile
          npm run test:group:ui
          npm run test:group:invite-e2e
          npm run test:wechat:browser
      - name: Run chat data isolation behavior tests
        run: |
          npm run test:chat:isolation
          npm run test:chat:isolation:browser
