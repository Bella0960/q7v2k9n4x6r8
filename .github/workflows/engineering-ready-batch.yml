name: MAOMAO ready-task batch

on:
  workflow_dispatch:
    inputs:
      qa_baseline_sha:
        description: Exact source SHA from the latest successful QA-only release (verify runs do not count)
        type: string
        required: true

permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: maomao-qa-batch-${{ inputs.qa_baseline_sha }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover, verify, assemble and push one immutable candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QA_BASELINE: ${{ inputs.qa_baseline_sha }}
        run: |
          set -o pipefail
          npm run --silent eng:batch:auto -- "$QA_BASELINE" --push | tee -a "$GITHUB_STEP_SUMMARY"
