name: MCP Client Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-client-regression.yml'
      - 'settings/mcp-connections.html'
      - 'shared/js/phone/mcp-client.js'
      - 'shared/js/phone/mcp-role-permissions.js'
      - 'tests/mcp-client.test.mjs'
      - 'tests/mcp-role-permissions.test.mjs'
      - 'package.json'
      - 'sw.js'
  pull_request:
    paths:
      - '.github/workflows/mcp-client-regression.yml'
      - 'settings/mcp-connections.html'
      - 'shared/js/phone/mcp-client.js'
      - 'shared/js/phone/mcp-role-permissions.js'
      - 'tests/mcp-client.test.mjs'
      - 'tests/mcp-role-permissions.test.mjs'
      - 'package.json'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MCP client contract tests
        run: npm run test:mcp

  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build MAOMAO
        run: npm run build
