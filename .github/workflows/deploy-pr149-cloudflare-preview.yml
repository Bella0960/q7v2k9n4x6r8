name: Deploy PR 149 preview to Cloudflare Workers

on:
  push:
    branches:
      - sync/local-plus-origin-main-20261106
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'assets/**'
      - 'games/assets/**'
      - 'shared/**'
      - 'apps/**'
      - 'diary/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '!tests/**'
      - '!docs/**'
      - '!perf/**'
      - '!android/**'

permissions:
  contents: read

concurrency:
  group: pr149-preview-deploy
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build latest MAOMAO
        run: npm run build

      - name: Create isolated preview Worker config
        run: |
          cat > wrangler.pr149-preview.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "maomao-pr149-preview",
            "compatibility_date": "2026-10-27",
            "workers_dev": true,
            "assets": {
              "directory": "./dist"
            }
          }
          EOF

      - name: Deploy isolated preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.pr149-preview.jsonc
