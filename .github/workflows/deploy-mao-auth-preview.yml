name: Deploy isolated MAO auth preview

on:
  push:
    branches:
      - feat/mao-account-auth-foundation
    paths:
      - '.github/workflows/deploy-mao-auth-preview.yml'
      - 'wrangler.preview.jsonc'
      - 'wrangler.jsonc'
      - 'worker.js'
      - 'worker/**'
      - 'account/**'
      - 'admin/**'
      - 'shared/**'
      - 'sw.js'
      - '**/*.html'
      - '**/*.css'
      - 'assets/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'scripts/check-syntax.mjs'
      - 'scripts/run-account-auth-gate.mjs'
      - 'docs/engineering/MAO_ACCOUNT_AUTH.md'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-isolated-preview:
    runs-on: ${{ vars.MAO_AUTH_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Check out the account-auth development branch
        uses: actions/checkout@v4
        with:
          ref: feat/mao-account-auth-foundation

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate isolated preview configuration and dedicated credentials
        shell: pwsh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          MAO_PREVIEW_DEVICE_SECRET_PEPPER: ${{ secrets.MAO_PREVIEW_DEVICE_SECRET_PEPPER }}
          MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET: ${{ secrets.MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) { throw "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_PREVIEW_API_TOKEN)) { throw "Missing GitHub secret: CLOUDFLARE_PREVIEW_API_TOKEN" }
          if ([string]::IsNullOrWhiteSpace($env:MAO_PREVIEW_DEVICE_SECRET_PEPPER) -or $env:MAO_PREVIEW_DEVICE_SECRET_PEPPER.Length -lt 32) { throw "MAO_PREVIEW_DEVICE_SECRET_PEPPER must contain at least 32 characters" }
          if ([string]::IsNullOrWhiteSpace($env:MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET) -or $env:MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET.Length -lt 32) { throw "MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET must contain at least 32 characters" }

      - name: Run the complete account-auth validation gate before deployment
        shell: pwsh
        run: |
          npm run check:syntax
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:accounts:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy only the isolated preview Worker
        id: deploy-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          secrets: |
            DEVICE_SECRET_PEPPER
            MAO_SUPER_ADMIN_BOOTSTRAP_SECRET
        env:
          DEVICE_SECRET_PEPPER: ${{ secrets.MAO_PREVIEW_DEVICE_SECRET_PEPPER }}
          MAO_SUPER_ADMIN_BOOTSTRAP_SECRET: ${{ secrets.MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET }}

      - name: Smoke-test the deployed preview and publish its phone link
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.deployment-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previewUrl = $env:PREVIEW_URL
          if ([string]::IsNullOrWhiteSpace($previewUrl)) { throw "Wrangler did not return a preview deployment URL" }
          if (-not $previewUrl.StartsWith('https://', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Preview deployment URL must use HTTPS"
          }

          @(
            "## MAO account-auth preview"
            "[Open the isolated MAO preview on a phone]($previewUrl)"
            ""
            "Account entry: $previewUrl/account/index.html"
            "Creator bootstrap: $previewUrl/account/bootstrap.html"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $accountPage = Join-Path $env:RUNNER_TEMP 'mao-preview-account-entry.html'
          $bootstrapPage = Join-Path $env:TEMP 'mao-preview-bootstrap.html'
          & curl.exe --fail --silent --show-error "$previewUrl/account/index.html" --output $accountPage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & curl.exe --fail --silent --show-error "$previewUrl/account/bootstrap.html" --output $bootstrapPage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $statusJson = & curl.exe --fail --silent --show-error "$previewUrl/api/admin/bootstrap/status"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bootstrapStatus = $statusJson | ConvertFrom-Json
          if ($bootstrapStatus.ok -ne $true -or $bootstrapStatus.initialized -isnot [bool]) {
            throw "Preview bootstrap status endpoint returned an unexpected response"
          }
          Write-Output ("Preview bootstrap endpoint: reachable; initialized=" + $bootstrapStatus.initialized)

          $adminStatus = & curl.exe --silent --show-error --output (Join-Path $env:TEMP 'mao-preview-admin-response.html') --write-out '%{http_code}' "$previewUrl/admin/admin-center.html"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($adminStatus.Trim() -ne '302') {
            throw "Unauthenticated admin page should redirect to account entry (expected 302, got $adminStatus)"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Unauthenticated admin-page gate: HTTP 302 (passed)'
