name: Deploy isolated MAO auth preview

on:
  push:
    branches:
      - feat/mao-account-auth-foundation
    paths:
      - '.github/workflows/deploy-mao-auth-preview.yml'
      - 'wrangler.preview.jsonc'
      - 'wrangler.jsonc'
      - 'worker.js'
      - 'worker/**'
      - 'account/**'
      - 'admin/**'
      - 'shared/**'
      - 'sw.js'
      - '**/*.html'
      - '**/*.css'
      - 'assets/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'scripts/check-syntax.mjs'
      - 'scripts/run-account-auth-gate.mjs'
      - 'docs/engineering/MAO_ACCOUNT_AUTH.md'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-isolated-preview:
    runs-on: ${{ vars.MAO_AUTH_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Check out the account-auth development branch
        uses: actions/checkout@v4
        with:
          ref: feat/mao-account-auth-foundation

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate isolated preview configuration and dedicated credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          MAO_PREVIEW_DEVICE_SECRET_PEPPER: ${{ secrets.MAO_PREVIEW_DEVICE_SECRET_PEPPER }}
          MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET: ${{ secrets.MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_PREVIEW_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_PREVIEW_API_TOKEN"; exit 1; }
          test "${#MAO_PREVIEW_DEVICE_SECRET_PEPPER}" -ge 32 || { echo "MAO_PREVIEW_DEVICE_SECRET_PEPPER must contain at least 32 characters"; exit 1; }
          test "${#MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET}" -ge 32 || { echo "MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET must contain at least 32 characters"; exit 1; }

      - name: Run the complete account-auth validation gate before deployment
        run: |
          set -eu
          npm run check:syntax
          npm run test:accounts:all

      - name: Deploy only the isolated preview Worker
        id: deploy-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          secrets: |
            DEVICE_SECRET_PEPPER
            MAO_SUPER_ADMIN_BOOTSTRAP_SECRET
        env:
          DEVICE_SECRET_PEPPER: ${{ secrets.MAO_PREVIEW_DEVICE_SECRET_PEPPER }}
          MAO_SUPER_ADMIN_BOOTSTRAP_SECRET: ${{ secrets.MAO_PREVIEW_SUPER_ADMIN_BOOTSTRAP_SECRET }}

      - name: Smoke-test the deployed preview and publish its phone link
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.deployment-url }}
        run: |
          set -eu
          test -n "$PREVIEW_URL" || { echo "Wrangler did not return a preview deployment URL"; exit 1; }
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "Preview deployment URL must use HTTPS"; exit 1 ;;
          esac

          echo "## MAO account-auth preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the isolated MAO preview on a phone]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Account entry: $PREVIEW_URL/account/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Creator bootstrap: $PREVIEW_URL/account/bootstrap.html" >> "$GITHUB_STEP_SUMMARY"

          curl --fail --silent --show-error "$PREVIEW_URL/account/index.html" --output /dev/null
          curl --fail --silent --show-error "$PREVIEW_URL/account/bootstrap.html" --output /dev/null

          curl --fail --silent --show-error "$PREVIEW_URL/api/admin/bootstrap/status" \
            | node --input-type=module -e '
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              const result = JSON.parse(raw);
              if (result.ok !== true || typeof result.initialized !== "boolean") {
                throw new Error("Preview bootstrap status endpoint returned an unexpected response");
              }
              console.log("Preview bootstrap endpoint: reachable; initialized=" + result.initialized);
            '

          admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/admin/admin-center.html")"
          test "$admin_status" = "302" || {
            echo "Unauthenticated admin page should redirect to account entry (expected 302, got $admin_status)"
            exit 1
          }
          echo "Unauthenticated admin-page gate: HTTP 302 (passed)" >> "$GITHUB_STEP_SUMMARY"
