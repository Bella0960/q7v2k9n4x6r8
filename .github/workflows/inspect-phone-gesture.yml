name: Inspect Phone Gesture & Layout

# 独立 job：只验证 inspect-phone/phone.html 的窄屏布局和首次上滑解锁。
# 仅 main 目标 PR 自动运行；功能分支之间的堆叠 PR 可手动 dispatch。
on:
  pull_request:
    branches: [main]
    paths:
      - 'inspect-phone/phone.html'
      - 'tests/inspect-phone-gesture.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-phone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start vite preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 3000 > preview.log 2>&1 &
          echo $! > preview.pid
          READY=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "preview server ready on attempt $i (after ${i}s)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "preview server failed to start after 40s"
            tail -n 30 preview.log || true
            exit 1
          fi

      - name: Run inspect-phone regression tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          echo "Testing against $BASE_URL"
          node tests/inspect-phone-gesture.test.mjs

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true
          fi
          if [ -f preview.log ]; then
            tail -n 20 preview.log || true
          fi
