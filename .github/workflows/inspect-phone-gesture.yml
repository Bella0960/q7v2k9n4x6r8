name: Inspect Phone Gesture & Layout

# 独立 job：验证 inspect-phone/phone.html 的两项修复
#   - 窄屏 ≤480px 下左右白边消除、无横向溢出
#   - 首次上滑解锁（真实 CDP touch 事件，不是 click 兜底）
#
# 与 perf-gate 互不依赖、互不影响；失败只标记此 workflow 红灯。

on:
  push:
    branches: [main, fix/home-gesture-white-edge]
    paths:
      - 'inspect-phone/phone.html'
      - 'tests/inspect-phone-gesture.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/inspect-phone-gesture.yml'
  pull_request:
    paths:
      - 'inspect-phone/phone.html'
      - 'tests/inspect-phone-gesture.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/inspect-phone-gesture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start vite preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 3000 &
          echo $! > preview.pid
          # 等端口起来（最多 15s）
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "preview server ready after ${i}*0.5s"
              break
            fi
            sleep 0.5
          done

      - name: Run inspect-phone regression tests
        env:
          BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_BROWSERS_PATH: $GITHUB_WORKSPACE/.cache/ms-playwright
        run: node tests/inspect-phone-gesture.test.mjs

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true
          fi
