name: Luck Room Feature Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'luck-room/**'
      - 'tests/luck-room-contract.test.mjs'
      - 'index.html'
      - 'settings/icon-settings.html'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: luck-room-feature-contract
  cancel-in-progress: true

jobs:
  luck-room-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Luck room contract tests
        run: npm run test:luck-room
