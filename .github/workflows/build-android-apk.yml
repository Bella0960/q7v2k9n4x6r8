name: Build MAOMAO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'vite.config.js'
      - 'package.json'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'assets/**'
      - 'games/assets/**'
      - 'chat/**'
      - 'shared/**'
      - 'apps/**'
      - 'android/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Run contract tests before build
        run: npm test

      - name: Install image compression dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Compress large game images for Android WebView
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image

          folder = Path("games/assets")
          if not folder.is_dir():
              raise SystemExit("games/assets folder is missing")

          total_before = 0
          total_after = 0
          for path in sorted(folder.iterdir()):
              if not path.is_file() or path.suffix.lower() not in (".png", ".jpg", ".jpeg"):
                  continue
              original = path.read_bytes()
              before = len(original)
              with Image.open(path) as source:
                  source.load()
                  width, height = source.size
                  target_width = 400 if path.name.lower().startswith("char") else 800
                  if width > target_width:
                      target_height = max(1, round(height * target_width / width))
                      image = source.resize((target_width, target_height), Image.Resampling.LANCZOS)
                  else:
                      image = source.copy()

                  buffer = BytesIO()
                  if path.suffix.lower() == ".png":
                      if image.mode not in ("RGB", "RGBA", "L", "LA", "P"):
                          image = image.convert("RGBA" if "A" in image.getbands() else "RGB")
                      image.save(buffer, format="PNG", optimize=True)
                  else:
                      if image.mode not in ("RGB", "L"):
                          image = image.convert("RGB")
                      image.save(buffer, format="JPEG", quality=75, optimize=True, progressive=True)

              compressed = buffer.getvalue()
              if len(compressed) < before:
                  path.write_bytes(compressed)
                  after = len(compressed)
              else:
                  after = before
              total_before += before
              total_after += after
              action = "compressed" if after < before else "kept original"
              print(f"{path.name}: {before // 1024} KB -> {after // 1024} KB ({action})")
          print(f"Game images total: {total_before // 1024} KB -> {total_after // 1024} KB")
          PY

      - name: Build MAOMAO web pages
        run: npm run build

      - name: Refresh PWA cache version for this APK
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("dist/sw.js")
          content = path.read_text(encoding="utf-8")
          version = os.environ["GITHUB_SHA"][:10]
          updated, count = re.subn(
              r"const CACHE_NAME = ['\"]phone-app-pwa-[^'\"]+['\"];",
              f"const CACHE_NAME = 'phone-app-pwa-apk-{version}';",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update service-worker cache version")
          path.write_text(updated, encoding="utf-8")
          print(f"Service-worker cache version set to phone-app-pwa-apk-{version}")
          PY

      - name: Bundle built pages into Android app assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/sw.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAOMAO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
