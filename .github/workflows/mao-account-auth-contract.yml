name: MAO Account Auth Contract

on:
  push:
    branches: [feat/mao-account-auth-foundation]
    paths:
      - 'account/**'
      - 'admin/**'
      - 'worker/**'
      - 'shared/js/mao-account-scope.js'
      - 'sw.js'
      - 'tests/account-*.test.mjs'
      - 'tests/pwa-navigation-cache.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/mao-account-auth-contract.yml'
  pull_request:
    paths:
      - 'account/**'
      - 'admin/**'
      - 'worker/**'
      - 'shared/js/mao-account-scope.js'
      - 'sw.js'
      - 'tests/account-*.test.mjs'
      - 'tests/pwa-navigation-cache.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/mao-account-auth-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-auth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MAO account, authorization and data-isolation tests
        run: npm run test:accounts

      - name: Build production bundle
        run: npm run build

      - name: Verify desktop compatibility and Service Worker cache boundaries
        run: |
          npm run test:desktop:layout
          npm run test:pwa:navigation
