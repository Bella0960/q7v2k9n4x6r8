name: PWA Mobile Navigation Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'sw.js'
      - 'vite.config.js'
      - 'package.json'
      - 'tests/pwa-navigation-cache.test.mjs'
      - 'tests/sw-navigation-cache-lifecycle.test.mjs'
      - 'tests/desktop-app-navigation.browser.mjs'
      - 'fortune/**'
      - 'settings/icon-settings.html'
      - 'tests/fate-cabin.test.mjs'
      - 'tests/fate-cabin.browser.mjs'
      - 'tests/icon-presets-contract.test.mjs'
      - 'tests/default-desktop-layout.test.mjs'
      - '.github/workflows/pwa-navigation-regression.yml'
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'vite.config.js'
      - 'package.json'
      - 'fortune/**'
      - 'settings/icon-settings.html'
      - 'index.html'
      - 'tests/pwa-navigation-cache.test.mjs'
      - 'tests/sw-navigation-cache-lifecycle.test.mjs'
      - 'tests/desktop-app-navigation.browser.mjs'
      - 'tests/fate-cabin.test.mjs'
      - 'tests/fate-cabin.browser.mjs'
      - 'tests/icon-presets-contract.test.mjs'
      - 'tests/default-desktop-layout.test.mjs'
      - '.github/workflows/pwa-navigation-regression.yml'

permissions:
  contents: read

jobs:
  verify-pwa-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build all MAOMAO pages
        run: npm run build
      - name: Install Chromium for real mobile tap checks
        run: npx playwright install --with-deps chromium
      - name: Verify route precache and mobile navigation
        run: npm run test:pwa:navigation
      - name: Verify desktop app taps in a mobile browser
        run: node tests/desktop-app-navigation.browser.mjs
      - name: Verify Fate Cabin tarot, wheel, oracle and persistence
        run: npm run test:fate-cabin
      - name: Verify navigation cache write lifecycle
        run: node --test tests/sw-navigation-cache-lifecycle.test.mjs
