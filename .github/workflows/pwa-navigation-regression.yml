name: PWA Mobile Navigation Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'sw.js'
      - 'vite.config.js'
      - 'package.json'
      - 'tests/pwa-navigation-cache.test.mjs'
      - '.github/workflows/pwa-navigation-regression.yml'
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'vite.config.js'
      - 'package.json'
      - 'tests/pwa-navigation-cache.test.mjs'
      - '.github/workflows/pwa-navigation-regression.yml'

permissions:
  contents: read

jobs:
  verify-pwa-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build all MAOMAO pages
        run: npm run build
      - name: Verify route precache and mobile navigation
        run: npm run test:pwa:navigation
