name: Deploy MAOMAO to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare-worker.yml'
      - 'diary/**'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'assets/**'
      - 'games/assets/**'
      - 'shared/**'
      - 'apps/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tests/production-worker-navigation.browser.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MAOMAO web pages
        run: npm run build

      - name: Verify PWA navigation fallback
        run: npm run test:pwa:navigation

      # Verify actual custom-domain ownership, not just the Worker configured in wrangler.jsonc.
      - name: Block unprepared production account deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAOMAO_PRODUCTION_ORIGIN: https://app.mao520.com
        run: node scripts/verify-production-account-readiness.mjs

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Install Chromium for live production verification
        run: npx playwright install --with-deps chromium

      - name: Verify real production app routes and mobile taps
        run: node tests/production-worker-navigation.browser.mjs
