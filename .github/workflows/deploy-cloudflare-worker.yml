name: Deploy MAOMAO to Cloudflare Workers

# Keep production deployment manual while preserving original account recovery.
# The account continuity gate must pass before release; do not auto-publish
# old static assets or cutover settings on a branch merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Protect running CloudDatabase backend and credentials
        run: node scripts/verify-production-worker-source.mjs

      - name: Verify backup and chat compatibility
        run: npm run test:backup:modules && npm run test:media:backup && npm run test:chat:reply

      - name: Build MAOMAO web pages
        run: npm run build

      - name: Verify PWA navigation fallback
        run: npm run test:pwa:navigation

      # A fail-closed release gate protects the original mao520.com account authority.
      # A backup checkpoint and identity transfer must be independently verified
      # before this manual job can ever be enabled for production.
      - name: Block unprepared production account deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAOMAO_PRODUCTION_ORIGIN: https://mao520.com
          # One-time repository variable; no ID or password embedded into Git.
          MAO_EXPECTED_FOUNDER_ID: ${{ vars.MAO_EXPECTED_FOUNDER_ID }}
        run: node scripts/release/verify-canonical-root-readiness.mjs

      - name: Deploy original mao520.com authority (only after recovery gate)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.jsonc --keep-vars

      - name: Install Chromium for live production verification
        run: npx playwright install --with-deps chromium

      - name: Verify official root login gates and private route protections
        env:
          MAOMAO_PRODUCTION_URL: https://mao520.com
        run: node tests/production-official-auth-smoke.browser.mjs
