name: Deploy MAOMAO to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare-worker.yml'
      - 'diary/**'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'assets/**'
      - 'games/assets/**'
      - 'shared/**'
      - 'apps/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MAOMAO web pages
        run: npm run build

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
