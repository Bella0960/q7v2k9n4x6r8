name: Manual deploy mao backend Worker (NOT app.mao520.com)

# Production release hold: the live original account DB, founder 001 and
# existing member must pass recoverable checkpoint + same-origin continuity.
# Do not auto-overwrite the uploaded backend or official gateway from old main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Block release from a non-main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Blocked: manual mao backend deploy can only run on main"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Protect running CloudDatabase backend and credentials
        run: node scripts/verify-production-worker-source.mjs

      - name: Verify backup and chat compatibility
        run: npm run test:backup:modules && npm run test:media:backup && npm run test:chat:reply

      - name: Build MAOMAO web pages
        run: npm run build

      - name: Verify PWA navigation fallback
        run: npm run test:pwa:navigation

      - name: Block unverified account cutover (no live writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAOMAO_PRODUCTION_ORIGIN: https://app.mao520.com
          MAO_EXPECTED_FOUNDER_ID: ${{ vars.MAO_EXPECTED_FOUNDER_ID }}
        run: |
          test -f scripts/verify-production-account-readiness.mjs || {
            echo "Blocked: current main lacks the verified account-continuity release gate"
            exit 1
          }
          node scripts/verify-production-account-readiness.mjs

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc --keep-vars

      - name: Install Chromium for live production verification
        run: npx playwright install --with-deps chromium

      - name: Verify real production app routes and mobile taps
        run: node tests/production-worker-navigation.browser.mjs
