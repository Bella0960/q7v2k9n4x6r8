name: Deploy MAOMAO to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'diary/**'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'assets/**'
      - 'games/assets/**'
      - 'shared/**'
      - 'apps/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '!tests/**'
      - '!docs/**'
      - '!perf/**'
      - '!android/**'
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an in-progress production deploy. Newer pending main commits replace
# older pending deploys so the latest source is what reaches production.
concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MAOMAO web pages
        run: npm run build

      - name: Verify PWA navigation fallback
        run: npm run test:pwa:navigation

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Install Chromium for live production verification
        run: npx playwright install --with-deps chromium

      - name: Verify real production app routes and mobile taps
        run: node tests/production-worker-navigation.browser.mjs
