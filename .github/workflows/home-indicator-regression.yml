name: Home Indicator Hit Area Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/js/home-indicator.js'
      - 'tests/home-indicator-hit-area.test.mjs'
      - '.github/workflows/home-indicator-regression.yml'
  push:
    branches: [main]
    paths:
      - 'shared/js/home-indicator.js'
      - 'tests/home-indicator-hit-area.test.mjs'
      - '.github/workflows/home-indicator-regression.yml'

permissions:
  contents: read

jobs:
  home-indicator-hit-area:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Home Indicator browser regression
        run: node tests/home-indicator-hit-area.test.mjs
