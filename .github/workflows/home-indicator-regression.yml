name: Home Indicator Hit Area Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/js/home-indicator.js'
      - 'tests/home-indicator-hit-area.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/home-indicator-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-indicator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  home-indicator-hit-area:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Home Indicator browser regression
        run: node tests/home-indicator-hit-area.test.mjs
