<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>主题工作台</title>
  <script src="../shared/js/chat-beauty.js?v=20261102v3"></script>
  <script src="../shared/js/theme-studio-runtime.js?v=1"></script>
  <link rel="stylesheet" href="../shared/css/mobile-fit.css">
  <link rel="stylesheet" href="./studio.css?v=1">
  <script defer src="./studio.js?v=1"></script>
</head>
<body>
  <div class="studio">
    <header class="topbar">
      <a class="back" href="../index.html" aria-label="返回桌面">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <h1>主题工作台</h1>
      <button type="button" id="exportButton" class="text-button">导出</button>
    </header>
    <section class="preview-area" aria-label="实时预览">
      <div class="preview-caption"><span>实时预览</span><span id="previewLabel">聊天列表</span></div>
      <div class="preview-surface" id="previewSurface">
        <section class="mock-list" id="mockList" aria-label="聊天列表预览">
          <div class="chat-theme-header">
            <div class="chat-theme-copy"><h1>聊天</h1></div>
            <div class="chat-theme-actions">
              <button type="button" class="chat-theme-action" aria-label="搜索聊天">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
              </button>
              <button type="button" class="chat-theme-action chat-theme-plus" aria-label="创建群聊">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </div>
          </div>
          <div class="chat-list-container" id="mockListRows">
            <div class="chat-slim-card">
              <div class="chat-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
              <div class="chat-meta">
                <div class="chat-title-row"><span class="chat-name">林晚照</span><span class="chat-time">16:20</span></div>
                <div class="chat-last-msg">明天的天气应该很好。</div>
              </div>
            </div>
            <div class="chat-slim-card">
              <div class="chat-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
              <div class="chat-meta">
                <div class="chat-title-row"><span class="chat-name">沈既明</span><span class="chat-time">昨天</span></div>
                <div class="chat-last-msg">照片已经收到了。</div>
              </div>
            </div>
          </div>
        </section>
        <section class="mock-detail" id="mockDetail" hidden>
          <header class="chat-header">
            <a class="nav-circle-btn" aria-label="返回联系人列表">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
            </a>
            <div class="chat-title-box">
              <div class="chat-header-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
              <span class="chat-user-name">林晚照</span>
            </div>
            <div class="chat-header-actions">
              <button class="nav-circle-btn" type="button" aria-label="对话设置">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#111111"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
              </button>
            </div>
          </header>
          <div class="chat-stage" id="mockMessages">
            <div class="message-time">今天 09:41</div>
            <div class="msg-row received"><div class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div><div class="msg-bubble">你看窗外，今天很安静。</div></div>
            <div class="msg-row sent"><div class="msg-bubble">嗯，阳光刚刚好。</div><div class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div></div>
          </div>
          <form class="input-dock" onsubmit="return false">
            <button class="plus-action-btn" type="button" aria-label="更多功能">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <div class="input-capsule">
              <textarea class="real-input" rows="1" placeholder="发送消息…" disabled></textarea>
            </div>
            <button class="send-icon-btn" type="button" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6c-2.2-2.2-5.7-2.2-7.9 0L12 5.5l-.9-.9c-2.2-2.2-5.7-2.2-7.9 0s-2.2 5.7 0 7.9L12 21l8.8-8.5c2.2-2.2 2.2-5.7 0-7.9Z"/></svg>
            </button>
          </form>
        </section>
      </div>
    </section>
    <nav class="editor-tabs" id="editorTabs" aria-label="编辑区域">
      <button type="button" class="selected" data-tab="list" aria-pressed="true">聊天列表</button>
      <button type="button" data-tab="detail" aria-pressed="false">聊天详情</button>
      <button type="button" data-tab="bubble" aria-pressed="false">聊天气泡</button>
    </nav>
    <main class="editor" id="editor">
      <div class="section-heading"><div><small id="panelSubtitle">布局与配色</small><h2 id="panelTitle">聊天列表</h2></div><div class="heading-actions"><span id="dirtyTag" class="dirty-tag" hidden>未应用</span><button type="button" id="undoButton" class="history-btn" aria-label="撤销" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button type="button" id="redoButton" class="history-btn" aria-label="重做" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button><button type="button" id="restoreDraft">还原草稿</button></div></div>
      <div class="scope" id="bubbleScopeRow" hidden><label for="bubbleScope">应用范围</label><select id="bubbleScope"><option value="global">全部角色</option></select></div>
      <div id="editorFields" class="fields"></div>
      <div class="subsection"><div class="subsection-head"><h3>保存的方案</h3><button type="button" id="savePreset">保存为方案</button></div><div id="presetList" class="preset-list"><p>还没有保存方案</p></div></div>
      <div class="utilities">
        <button type="button" id="importButton">导入 JSON / CSS</button>
        <button type="button" id="exportCssButton">导出 CSS 变量</button>
        <a href="../beauty/beauty.html">更多气泡细节与传统 CSS 编辑</a>
      </div>
      <p class="explain">只修改聊天列表与聊天详情。预览不会改变当前主题，点「应用」才保存；旧聊天、人设、世界书和其他应用不受影响。</p>
    </main>
    <footer class="actions">
      <button type="button" class="secondary" id="disableButton">停用当前定制</button>
      <button type="button" class="primary" id="applyButton">应用到聊天</button>
    </footer>
  </div>
  <input id="importFile" type="file" accept=".json,.css,application/json,text/css" hidden>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
</body>
</html>
